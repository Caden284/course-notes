}</code></pre><p>The <strong>+1</strong> is the null terminator — forgetting it is a classic buffer-overrun bug.</p></div>
<h3 id="s3-9"><span class="secnum">3.9</span> Freeing Memory: Leaks and Dangling Pointers</h3>
<p>C has <strong>no garbage collector</strong> — you must hand memory back yourself with <code>free()</code>:</p>
<pre class="code"><code>void free(void *ptr);   // returns ptr's block to the heap</code></pre>
<p>Only call <code>free</code> on an address that came from <code>malloc</code>/<code>calloc</code>/<code>realloc</code>. Two failure modes dominate:</p>
<div class="box def"><span class="lbl">Definition: Memory Leak</span><dl><dt>Plain English</dt><dd>Memory you allocated but lost the only pointer to, so you can never free it — wasted forever (until the program ends).</dd><dt>Technical</dt><dd>A block of memory that is no longer accessible (garbage) because every pointer to it was overwritten or lost; a program that leaves garbage behind has a memory leak.</dd><dt>Why it matters</dt><dd>Leaks slowly exhaust the heap. In long-running programs (servers) and embedded systems, leaks eventually crash the program.</dd></dl></div>
<pre class="code"><code>p = malloc(...);
q = malloc(...);
p = q;     // the block p used to point to is now UNREACHABLE -&gt; leak</code></pre>
<div class="box def"><span class="lbl">Definition: Dangling Pointer</span><dl><dt>Plain English</dt><dd>A pointer that still holds the address of memory you already freed — pointing at something that is gone.</dd><dt>Technical</dt><dd>A pointer whose target block has been deallocated by free(); free() releases the block but does NOT change the pointer's value, so it still contains the old address.</dd><dt>Why it matters</dt><dd>Using a dangling pointer reads or writes reclaimed memory, causing unpredictable corruption. The fix is to set the pointer to NULL immediately after freeing.</dd></dl><pre class="code"><code>char *ptr = malloc(4);
free(ptr);              // memory released, but ptr STILL holds the old address
strcpy(ptr, "abc");     // *** dangling-pointer use: risky! ***
// correct habit:
free(ptr);
ptr = NULL;             // now ptr is safe to test and won't dangle</code></pre></div>
<p>For <strong>nested</strong> dynamic memory (a struct holding pointers that were themselves malloc'd), <strong>free the inner pointers first, then the struct</strong> — otherwise you lose the only references to the inner blocks and leak them:</p>
<pre class="code"><code>free(myname-&gt;first_name);   // free inner pointers FIRST
free(myname);               // then the struct itself</code></pre>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Leak vs. dangling — know the difference cold.</strong> A <strong>memory leak</strong> = you still have memory but lost the pointer (can't free it). A <strong>dangling pointer</strong> = you freed the memory but still have the pointer (point at nothing valid). Two opposite mistakes.</p></div>
<h3 id="s3-10"><span class="secnum">3.10</span> Linked Lists</h3>
<p>A <strong>linked list</strong> is a chain of structs called <strong>nodes</strong>; each node holds data plus a pointer to the next node. The last node's next pointer is <strong>NULL</strong> (drawn as a diagonal line). Because nodes are self-referential, you must use the <strong>struct tag</strong> form:</p>
<pre class="code"><code>struct node {
    int value;            // the data
    struct node *next;    // pointer to the next node (self-reference)
};
struct node *head = NULL; // tracks the start of the list</code></pre>
<p>Creating a node = allocate memory, store data, then insert. The <strong>-&gt; (arrow) operator</strong> accesses a member through a pointer — it is shorthand for dereference-then-dot:</p>
<pre class="code"><code>struct node *new_node = malloc(sizeof(struct node));
(*new_node).value = 10;   // verbose way
new_node-&gt;value = 10;     // identical, using the -&gt; operator</code></pre>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Inserting at the front of a list (returns the new head):</strong></p><pre class="code"><code>struct node *add_to_list(struct node *list, int n) {
    struct node *new_node = malloc(sizeof(struct node));
    if (new_node == NULL) exit(EXIT_FAILURE);
    new_node-&gt;value = n;
    new_node-&gt;next  = list;   // new node points at the old head
    return new_node;          // new node becomes the new head
}</code></pre></div>
<h3 id="s3-11"><span class="secnum">3.11</span> Creating and Replacing Processes: fork(), exec(), wait()</h3>
<p>This section is the bridge into Chapter 4 — the C system calls that create processes. In UNIX, a new process is born from <strong>fork()</strong>.</p>
<div class="box def"><span class="lbl">Definition: fork()</span><dl><dt>Plain English</dt><dd>A system call that makes a near-perfect copy of the running process, so now there are two: a parent and a child.</dd><dt>Technical</dt><dd>A system call (prototype pid_t fork(void)) that creates a new process by copying the parent's process image (except shared memory); it is called ONCE but returns TWICE.</dd><dt>Why it matters</dt><dd>fork() is how every UNIX process except the first comes into existence. The “returns twice” behavior is the single most-tested fact about it.</dd></dl></div>
<p>When fork() is called, the OS: allocates a slot in the process table; assigns a unique process ID; copies the parent's process image (except shared memory); puts the child in the Ready-to-Run state; and returns the child's PID to the parent and 0 to the child.</p>
<p><strong>The key to telling parent from child is the return value:</strong></p>
<ul><li>In the <strong>child</strong>: <code>fork()</code> returns <strong>0</strong>.</li><li>In the <strong>parent</strong>: <code>fork()</code> returns the <strong>child's PID</strong> (a positive number).</li><li>On <strong>failure</strong>: <code>fork()</code> returns <strong>-1</strong> and no child is created.</li></ul>
<p>The child is an <em>exact but separate</em> copy — an independent process image, not a shared one.</p>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Distinguishing parent and child after fork():</strong></p><pre class="code"><code>#include &lt;unistd.h&gt;
int main() {
    pid_t pid = fork();
    if (pid == 0)
        printf("I am the child process\n");
    else if (pid &gt; 0)
        printf("I am the parent process\n");
    else
        printf("the fork() has failed\n");
}</code></pre><p>Both processes run the same code <em>after</em> the fork; they differ only in <code>pid</code>, so the <code>if</code> sends each down its own branch. The code <em>before</em> the fork runs once; the code after runs in both.</p></div>
<p>To run a <em>different</em> program, a process uses the <strong>exec()</strong> family to replace its current code, data, and stack with a new executable. Crucially, <strong>only the code being executed changes — the PID and PPID stay the same.</strong> The <code>exec()</code> functions (<code>execl</code>, <code>execv</code>, <code>execlp</code>, etc.) are C library wrappers around the single real system call <code>execve()</code>, which is rarely called directly.</p>
<pre class="code"><code>int execl(const char *path, const char *arg0, ..., const char *argn, NULL);
// path = absolute path to executable; arg0 = program name; args end with NULL
// returns -1 if the executable is not found</code></pre>
<p>The standard pattern combines all three calls — <strong>fork to create, exec in the child to run a new program, wait in the parent to synchronize:</strong></p>
<pre class="code"><code>int main() {
    pid_t pid = fork();
    if (pid &lt; 0) {                    // error
        fprintf(stderr, "Fork Failed");
        exit(-1);
    } else if (pid == 0) {            // child: become 'ls'
        execlp("/bin/ls", "ls", NULL);
    } else {                          // parent: wait for child
        wait(NULL);
        printf("Child Complete");
        exit(0);
    }
}</code></pre>
<p>Two coordination calls round this out:</p>
<ul><li><code>void exit(int status)</code> terminates a process; <code>status</code> is its return value, announcing success or failure.</li><li><code>pid_t wait(int *status)</code> suspends the parent until a child terminates, returning that child's PID (or -1 if no children exist) and writing the child's status into <code>status</code>.</li></ul>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>The “fork() prints” question.</strong> Given <code>printf("One\n"); fork(); printf("Two\n");</code> — “One” prints <strong>once</strong> (before the fork) and “Two” prints <strong>twice</strong> (parent and child each run the code after the fork). Be ready to count outputs across multiple forks, where <em>n</em> forks create <em>2^n</em> processes.</p></div>
<div class="box proc"><span class="lbl">Chapter 3 in one breath</span><p>C gives you <strong>manual control</strong>: typed variables (mind <code>sizeof</code> and uninitialized junk), <strong>pointers</strong> (<code>&amp;</code> address-of, <code>*</code> dereference) for pass-by-reference, <strong>structs</strong> (assign yes, compare no), <strong>malloc/free</strong> on the heap (watch leaks &amp; dangling pointers), and the <strong>fork/exec/wait</strong> trio that creates and runs processes.</p></div>
</section>
<section class="lecture prose" id="ch4">
<div class="plate"><span class="num" aria-hidden="true">04</span><p class="ttl">Processes</p><p class="src">Chapter 4</p></div>
<h3 id="s4-1"><span class="secnum">4.1</span> Big Picture</h3>
<p>The process is the OS's fundamental unit of work, and this chapter is the spine of the course. You will learn what a process is made of, the <strong>states</strong> it moves through, the <strong>PCB</strong> the OS uses to track it, how the scheduler shuffles processes through <strong>queues</strong>, what a <strong>context switch</strong> costs, how processes are <strong>created and terminated</strong>, and finally how cooperating processes talk to each other via <strong>IPC</strong> (shared memory, message passing, and pipes).</p>
<h3 id="s4-2"><span class="secnum">4.2</span> The Process Concept and Its Memory Layout</h3>
<div class="box def"><span class="lbl">Definition: Process</span><dl><dt>Plain English</dt><dd>A program that is actually running, together with everything it needs to run.</dd><dt>Technical</dt><dd>A program in execution; execution must progress sequentially (no parallel execution of instructions within a single process).</dd><dt>Why it matters</dt><dd>It is the active counterpart of a passive program file, and the entity the OS schedules, protects, and accounts for.</dd></dl></div>
<p><strong>Program vs. process, again, because the exam loves it:</strong> a program is a <strong>passive</strong> file on disk; a process is <strong>active</strong>. You can start a program via GUI clicks, a command-line name, or the <code>exec()</code> system call. And <strong>one program can become many processes</strong> — e.g., several users running the same shell each get a separate process.</p>
<p>A process in memory has four sections (plus current activity). Know all of them and what each holds:</p>
<div class="tw"><table><thead><tr><th>Section</th><th>Contains</th></tr></thead><tbody><tr><td>Text</td><td>The program code (the compiled instructions).</td></tr><tr><td>Data</td><td>Global variables (split into initialized and uninitialized).</td></tr><tr><td>Heap</td><td>Memory dynamically allocated at runtime (malloc).</td></tr><tr><td>Stack</td><td>Temporary data: function parameters, return addresses, local variables.</td></tr><tr><td>(Current activity)</td><td>Program counter + processor registers.</td></tr></tbody></table></div>
<p>The heap and stack grow toward each other into the free space between them. The global data section divides into <strong>initialized</strong> and <strong>uninitialized</strong> data, and a separate area holds the <code>argc</code>/<code>argv</code> command-line parameters.</p>
<p>You can inspect a compiled program's section sizes with the Linux <code>size</code> utility (<code>size executable_name</code>). It reports <code>text</code> (code), <code>data</code>, <code>bss</code> (Block Started by Symbol — uninitialized data), and the <code>dec</code>/<code>hex</code> totals.</p>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>Slide wording quirk to watch.</strong> The lecture's <code>size</code> slide labels <code>data</code> as “uninitialized” and <code>bss</code> as “initialized,” but standard convention is the reverse: <code>data</code> = initialized globals, <code>bss</code> = uninitialized globals. Learn the standard meaning (<strong>bss = uninitialized</strong>) and be aware the slide swapped the labels.</p></div>
<h3 id="s4-3"><span class="secnum">4.3</span> Process States</h3>
<p>As a process runs it changes state. Memorize the five-state model — it is guaranteed exam material and underpins Chapter 6.</p>
<div class="tw"><table><thead><tr><th>State</th><th>Meaning</th></tr></thead><tbody><tr><td>New</td><td>The process is being created.</td></tr><tr><td>Ready</td><td>Waiting to be assigned to a processor (in memory, runnable).</td></tr><tr><td>Running</td><td>Instructions are currently being executed on a CPU.</td></tr><tr><td>Waiting</td><td>Blocked, waiting for some event (e.g., I/O completion).</td></tr><tr><td>Terminated</td><td>The process has finished execution.</td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Ready vs. Waiting — the distinction students miss.</strong> A <strong>Ready</strong> process <em>could</em> run right now but is waiting only for a free CPU. A <strong>Waiting</strong> (blocked) process <em>cannot</em> run yet because it is waiting for an event like I/O. After the event completes, a Waiting process moves back to Ready, not straight to Running.</p></div>
<h3 id="s4-4"><span class="secnum">4.4</span> The Process Control Block (PCB)</h3>
<div class="box def"><span class="lbl">Definition: Process Control Block (PCB)</span><dl><dt>Plain English</dt><dd>The OS's record card for a process — everything it needs to know to manage and resume that process.</dd><dt>Technical</dt><dd>The kernel data structure holding all information associated with a process; in Linux it is the C structure task_struct (also called a Task Control Block).</dd><dt>Why it matters</dt><dd>The PCB is what the OS saves and restores on a context switch. Without it, the OS could not pause a process and pick it back up later.</dd></dl></div>
<p>A PCB stores, at minimum:</p>
<ul><li><strong>Process state</strong> — running, waiting, ready, etc.</li><li><strong>Program counter</strong> — the address of the next instruction.</li><li><strong>CPU registers</strong> — the contents of all process registers.</li><li><strong>Memory-management information</strong> — the memory allocated to the process.</li><li><strong>Accounting information</strong> — CPU time used, clock time since start, time limits.</li><li><strong>I/O status information</strong> — I/O devices allocated, list of open files.</li></ul>
<p>So far each process had a single <strong>thread</strong> (one program counter). A <strong>multithreaded</strong> process has multiple program counters — one per thread — so multiple locations can execute at once (e.g., a word processor handling input, spell-checking, and saving simultaneously). The PCB must then store details for each thread. The number of processes currently in memory is the <strong>degree of multiprogramming</strong>.</p>
<h3 id="s4-5"><span class="secnum">4.5</span> Process Scheduling and Queues</h3>
<p>The <strong>process scheduler</strong> selects which available process runs next on each CPU core, with the goal of <strong>maximizing CPU utilization</strong> by switching quickly when a process blocks or terminates. It keeps processes organized in queues:</p>
<ul><li><strong>Ready queue</strong> — all processes in main memory that are ready and waiting to execute. Generally stored as a <strong>linked list</strong>, with a header pointing to the first PCB.</li><li><strong>Wait queues</strong> — processes waiting for a particular event, such as I/O completion.</li></ul>
<p>Processes <strong>migrate among the queues</strong> over their lifetime: a running process that issues I/O moves to a wait queue; when the I/O completes it returns to the ready queue. When a process finally terminates, it is removed from all queues and its PCB is deallocated.</p>
<h3 id="s4-6"><span class="secnum">4.6</span> Context Switch</h3>
<div class="box def"><span class="lbl">Definition: Context Switch</span><dl><dt>Plain English</dt><dd>The act of saving one process's state and loading another's so the CPU can switch between them.</dd><dt>Technical</dt><dd>The procedure where the system saves the state of the old process (in its PCB) and loads the saved state of the new process when the CPU switches processes.</dd><dt>Why it matters</dt><dd>Context switching is what makes multitasking possible — but it is pure overhead, so its cost directly limits how much real work the CPU gets done.</dd></dl></div>
<p>The crucial exam point: <strong>context-switch time is pure overhead — no useful work happens during it.</strong> The more complex the OS and the PCB, the longer a switch takes. It also depends on hardware support: some CPUs provide <strong>multiple register sets</strong>, so several contexts can be loaded at once and a switch becomes as cheap as changing a pointer to the active register set.</p>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>“Context switching gets work done faster.”</strong> A context switch itself accomplishes <strong>zero</strong> useful computation — it is overhead. The <em>benefit</em> is keeping the CPU busy across many processes; the switch itself is a cost you want to minimize.</p></div>
<h3 id="s4-7"><span class="secnum">4.7</span> Operations on Processes: Creation and Termination</h3>
<p>Processes form a <strong>tree</strong> (“process genealogy”): a <strong>parent</strong> creates <strong>children</strong>, which create their own children. Each process has a <strong>process identifier (PID)</strong>. On creation, the OS decides resource sharing and execution policy:</p>
<ul><li><strong>Resource sharing</strong>: parent and child share all resources; OR child shares a subset; OR they share nothing.</li><li><strong>Execution</strong>: parent and children execute concurrently; OR the parent waits until the child terminates.</li><li><strong>Address space</strong>: the child is a duplicate of the parent, OR the child has a new program loaded into it.</li></ul>
<p>In UNIX, <code>fork()</code> creates the new process, <code>exec()</code> (after the fork) replaces the child's memory with a new program, and the parent calls <code>wait()</code> to wait for the child. On Linux, <code>pstree -p</code> shows the tree: <code>systemd</code> is the root parent, <code>logind</code> manages logins, and from a <code>bash</code> shell a user spawns processes like <code>ps</code> and <code>vim</code>.</p>
<h4>Termination</h4>
<p>A process finishes by executing its last instruction and calling <code>exit()</code>, which returns status data to the parent (via <code>wait()</code>) and lets the OS deallocate its resources. A parent can forcibly terminate a child with <code>abort()</code> if: the child exceeded its allocated resources; the child's task is no longer needed; or the parent is exiting and the OS does not allow a child to outlive its parent.</p>
<h4>Mobile process-importance hierarchy</h4>
<p>Mobile OSes (Android) reclaim memory by killing processes, starting with the least important. Know the ranking, most to least important:</p>
<ol><li><strong>Foreground</strong> — the process currently visible and interacting on screen.</li><li><strong>Visible</strong> — visible but not directly interacting (e.g., a video in picture-in-picture).</li><li><strong>Service</strong> — background work with apparent output (downloading, streaming music).</li><li><strong>Background</strong> — not apparent (a messaging app syncing).</li><li><strong>Empty</strong> — no active components (an unused app kept around for fast restart).</li></ol>
<h3 id="s4-8"><span class="secnum">4.8</span> Multi-Process Architecture: The Chrome Example</h3>
<p>Older browsers ran as a single process; Google Chrome uses <strong>multiple processes</strong> for robustness and security — a great real-world illustration of process isolation:</p>
<ul><li><strong>Browser process</strong> — manages the user interface, disk, and network I/O.</li><li><strong>Renderer process</strong> — renders web pages and runs HTML/JavaScript. A new renderer is created per tab, each in a <strong>sandbox</strong> that restricts disk and network I/O, minimizing the damage from a security exploit.</li><li><strong>Plug-in process</strong> — runs each type of plug-in/extension.</li></ul>
<p>So a crash or compromise in one tab's renderer is contained — it cannot easily take down the whole browser or reach the disk.</p>
<h3 id="s4-9"><span class="secnum">4.9</span> Inter-Process Communication (IPC)</h3>
<p>Processes are either <strong>independent</strong> or <strong>cooperating</strong>. Cooperating processes can affect or be affected by each other (e.g., by sharing data), and they need <strong>IPC</strong>. Reasons to cooperate: information sharing, computation speedup (splitting subtasks across cores), modularity, and convenience.</p>
<p>There are two IPC models. The comparison is a guaranteed exam question:</p>
<div class="tw"><table><thead><tr><th></th><th>Shared Memory</th><th>Message Passing</th></tr></thead><tbody><tr><td>Speed</td><td>Faster.</td><td>Slower.</td></tr><tr><td>Kernel involvement</td><td>Only to set up the shared region; then routine memory access, no kernel.</td><td>Each message needs kernel intervention (time-consuming).</td></tr><tr><td>Data size</td><td>Good for large amounts of data.</td><td>Useful for smaller amounts of data.</td></tr><tr><td>Coordination</td><td>Programmer must synchronize access (risk of race conditions).</td><td>No conflict avoidance needed by the programmer.</td></tr><tr><td>Distributed systems</td><td>Harder.</td><td>Easier to implement across machines.</td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Why is shared memory faster?</strong> Because after the region is established, all accesses are <strong>ordinary memory reads/writes with no system calls and no kernel intervention</strong>. Message passing must trap into the kernel for every send/receive.</p></div>
<h3 id="s4-10"><span class="secnum">4.10</span> The Producer–Consumer Problem and Race Conditions</h3>
<div class="box def"><span class="lbl">Definition: Producer–Consumer Problem</span><dl><dt>Plain English</dt><dd>A classic setup where one process makes data and another uses it, sharing a buffer between them.</dd><dt>Technical</dt><dd>A paradigm for cooperating processes in which a producer process produces information consumed by a consumer process; a process can be both at once.</dd><dt>Why it matters</dt><dd>It is the canonical example for studying synchronization, buffering, and race conditions — and it directly motivates the synchronization tools in later chapters.</dd></dl></div>
<p>Two buffer variations:</p>
<ul><li><strong>Unbounded buffer</strong> — no size limit; the producer never waits, but the consumer must wait if there is nothing to consume.</li><li><strong>Bounded buffer</strong> — fixed maximum size; the producer must wait if the buffer is full, and the consumer must wait if it is empty.</li></ul>
<p>A clean bounded-buffer solution uses a <strong>circular array</strong> with two indices: <code>in</code> (next free slot) and <code>out</code> (first filled slot). The buffer is <strong>full</strong> when <code>(in + 1) % BUFFER_SIZE == out</code> and <strong>empty</strong> when <code>in == out</code>. This version is correct but can only use <strong>BUFFER_SIZE - 1</strong> elements (one slot is sacrificed to distinguish full from empty).</p>
<pre class="code"><code>/* Producer */                      /* Consumer */
while (1) {                         while (1) {
  /* produce next_produced */         while (in == out)   ; // empty? busy-wait
  while ((in+1)%SIZE == out) ;        next_consumed = buffer[out];
  buffer[in] = next_produced;         out = (out + 1) % SIZE;
  in = (in + 1) % SIZE;               /* consume next_consumed */
}                                   }</code></pre>
<p>To use <em>all</em> of the buffer, add a <code>counter</code> of filled slots: the producer waits while <code>counter == BUFFER_SIZE</code> and increments after producing; the consumer waits while <code>counter == 0</code> and decrements after consuming. But this shared <code>counter</code> introduces a <strong>race condition</strong>.</p>
<div class="box def"><span class="lbl">Definition: Race Condition</span><dl><dt>Plain English</dt><dd>A bug where the final result depends on the unpredictable timing of which process touches shared data first.</dd><dt>Technical</dt><dd>A situation in a shared-memory solution where multiple processes/threads access and manipulate shared data concurrently, and the outcome depends on the order in which operations execute.</dd><dt>Why it matters</dt><dd>Race conditions cause data corruption and unpredictable behavior, and motivate the entire field of process synchronization (locks, semaphores).</dd></dl></div>
<p>Why <code>counter++</code> is dangerous: it is not atomic. It compiles to three steps — <code>register = counter</code>; <code>register = register + 1</code>; <code>counter = register</code>. With <code>counter = 5</code> and the producer's <code>++</code> interleaved with the consumer's <code>--</code>, you can end up with <code>counter = 6</code> or <code>4</code> depending on interleaving — a lost update.</p>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>A losing interleaving (counter starts at 5):</strong></p><pre class="code"><code>S0 producer: reg1 = counter        (reg1 = 5)
S1 producer: reg1 = reg1 + 1       (reg1 = 6)
S2 consumer: reg2 = counter        (reg2 = 5)
S3 consumer: reg2 = reg2 - 1       (reg2 = 4)
S4 producer: counter = reg1        (counter = 6)
S5 consumer: counter = reg2        (counter = 4)  &lt;-- should be 5!</code></pre><p>The correct answer is 5 (one produced, one consumed), but the race yields 4. The <strong>first</strong> version (using only BUFFER_SIZE-1 slots) had no race because producer and consumer never wrote the <em>same</em> variable — the producer only touched <code>in</code>, the consumer only touched <code>out</code>.</p></div>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Why was there no race in the first solution?</strong> Because the two processes never modified a <strong>shared</strong> variable. With the <code>counter</code>, both write it, so their unsynchronized read-modify-write sequences interleave badly. This is the setup for synchronization tools in the next chapter.</p></div>
<h3 id="s4-11"><span class="secnum">4.11</span> Message Passing in Detail</h3>
<p>In message passing, processes communicate <strong>without shared variables</strong>, through two operations: <code>send(message)</code> and <code>receive(message)</code>. To communicate, processes P and Q must <strong>establish a link</strong> and then exchange messages. Messages may be fixed or variable size.</p>
<h4>Direct vs. indirect communication</h4>
<div class="tw"><table><thead><tr><th></th><th>Direct</th><th>Indirect</th></tr></thead><tbody><tr><td>Naming</td><td>Processes name each other: send(P, msg), receive(Q, msg).</td><td>Messages go to/from mailboxes (ports) with unique IDs: send(A, msg).</td></tr><tr><td>Link established</td><td>Automatically, between exactly one pair.</td><td>Only if processes share a common mailbox.</td></tr><tr><td>Processes per link</td><td>Exactly two.</td><td>A link may be associated with many processes.</td></tr><tr><td>Links per pair</td><td>Exactly one.</td><td>Several (one per shared port).</td></tr></tbody></table></div>
<p>Indirect communication raises a sharing puzzle: if P1, P2, P3 all share mailbox A and P1 sends one message while P2 and P3 both try to receive, <strong>who gets it?</strong> Solutions: limit a link to at most two processes; allow only one receive at a time; or let the system pick the receiver arbitrarily and tell the sender who got it. Mailbox operations: create a mailbox, send/receive through it, and delete it.</p>
<h4>Synchronization: blocking vs. non-blocking</h4>
<ul><li><strong>Blocking (synchronous)</strong>: a blocking <em>send</em> waits until the message is received; a blocking <em>receive</em> waits until a message is available.</li><li><strong>Non-blocking (asynchronous)</strong>: a non-blocking <em>send</em> sends and continues; a non-blocking <em>receive</em> returns either a valid message or null.</li></ul>
<p>Commonly, sending is non-blocking but receiving is blocking. If <strong>both</strong> send and receive block, that meeting point is called a <strong>rendezvous</strong>.</p>
<h4>Buffering</h4>
<p>A queue of messages (a buffer) can attach to a link in three capacities:</p>
<ul><li><strong>Zero capacity</strong> — no queuing; the sender must wait for the receiver (a rendezvous).</li><li><strong>Bounded capacity</strong> — finite length n; the sender waits if the buffer is full.</li><li><strong>Unbounded capacity</strong> — infinite length; the sender never waits.</li></ul>
<h3 id="s4-12"><span class="secnum">4.12</span> POSIX Shared Memory in Practice</h3>
<p>POSIX shared memory uses <code>shm_open</code> (create/open a named shared object), <code>ftruncate</code> (size it), and <code>mmap</code> (map it into the address space). A producer writes; a consumer reads and unlinks it.</p>
<pre class="code"><code>/* Producer (excerpt) */
const int SIZE = 4096;  const char *name = "OS";
int fd = shm_open(name, O_CREAT | O_RDWR, 0666);   // create shared object
ftruncate(fd, SIZE);                               // set its size
char *ptr = mmap(0, SIZE, PROT_READ|PROT_WRITE, MAP_SHARED, fd, 0);
sprintf(ptr, "%s", "Hello");  ptr += strlen("Hello");
/* Consumer (excerpt) */
int fd = shm_open(name, O_RDONLY, 0666);
char *ptr = mmap(0, SIZE, PROT_READ, MAP_SHARED, fd, 0);
printf("%s", ptr);              // read what the producer wrote
shm_unlink(name);               // remove the object from the system</code></pre>
<p>On Snowball you must link the real-time library with <code>-lrt</code>: <code>gcc -o producer producer.c -lrt</code>. Each memory map corresponds to a file under <code>/dev/shm/</code> — run <code>ls -l /dev/shm/</code> to see the <code>"OS"</code> object.</p>
<h3 id="s4-13"><span class="secnum">4.13</span> Pipes</h3>
<div class="box def"><span class="lbl">Definition: Pipe</span><dl><dt>Plain English</dt><dd>A one-way channel that lets one program's output flow directly into another program's input.</dd><dt>Technical</dt><dd>A local IPC mechanism allowing two or more processes to send data to each other; in shells, it connects one utility's standard output to another's standard input.</dd><dt>Why it matters</dt><dd>Pipes are everywhere in UNIX. The shell's | operator is a pipe, and they are the simplest hands-on IPC you will use.</dd></dl></div>
<p>In a shell, the <code>|</code> character creates a pipe: <code>who | wc -l</code> feeds the output of <code>who</code> into <code>wc -l</code>, counting logged-in users. Both the reader and writer <strong>execute concurrently</strong>, and the pipe controls them — blocking the writer if the buffer is full, the reader if it is empty.</p>
<h4>Unnamed vs. named pipes</h4>
<p>An <strong>unnamed pipe</strong> is a <strong>unidirectional</strong> link that automatically buffers input (buffer size varies, ~5000 bytes). Each end has a file descriptor — a <strong>read end</strong> and a <strong>write end</strong> — and it uses the ordinary <code>read()</code>/<code>write()</code> system calls. Bidirectional communication needs <strong>two</strong> pipes.</p>
<pre class="code"><code>int fd[2];
pipe(fd);        // create the pipe
// fd[0] = READ end ; fd[1] = WRITE end</code></pre>
<p>Because unnamed pipes use file descriptors, access can be passed to descendants via fork(). Typical parent–child usage:</p>
<ol><li>Parent creates the pipe with pipe().</li><li>Parent forks (the child inherits the descriptors).</li><li>The writer closes its read end; the reader closes its write end.</li><li>They communicate with write() and read().</li><li>Each closes its active descriptor when finished.</li></ol>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Pipe ends — do not flip them.</strong> <code>fd[0]</code> is the <strong>READ</strong> end; <code>fd[1]</code> is the <strong>WRITE</strong> end. Unnamed pipes are <strong>unidirectional</strong> and used between a process and its descendants; bidirectional needs two pipes.</p></div>
<div class="box proc"><span class="lbl">Chapter 4 in one breath</span><p>A process = program in execution with <strong>text/data/heap/stack</strong>; it moves through <strong>New→Ready→Running→Waiting→Terminated</strong>; the <strong>PCB</strong> tracks it; the scheduler shuffles it through <strong>ready/wait queues</strong> using costly <strong>context switches</strong>; <strong>fork/exec/wait</strong> create and end it; and cooperating processes use <strong>shared memory, message passing, or pipes</strong> — where unsynchronized sharing breeds <strong>race conditions</strong>.</p></div>
</section>
<section class="lecture prose" id="ch5">
<div class="plate"><span class="num" aria-hidden="true">05</span><p class="ttl">Threads &amp; Concurrency</p><p class="src">Chapter 5</p></div>
<p>In Chapter 4 you learned that a <strong>process</strong> is a program in execution, carrying its own memory (text, data, heap, stack), its own state (ready/running/waiting), and its own kernel record (the PCB). That is a heavy, self-contained container. This chapter zooms <em>inside</em> the process and asks a sharper question: what is the smallest unit the CPU can actually run? The answer is the <strong>thread</strong>. Everything in this chapter — concurrency, parallelism, Amdahl's Law, threading models, Pthreads — is about splitting one process into many independently runnable streams of execution so your program can do several things at once and exploit multiple CPU cores.</p>
<div class="box bg"><span class="lbl">Week 2 review — what you must already hold in your head</span><ul><li><strong>Process = program in execution</strong>; its current activity is captured by the program counter plus the other CPU registers.</li><li><strong>Memory layout = 4 sections:</strong> text, data, heap, stack.</li><li><strong>Process states (this deck says four):</strong> ready, running, waiting, terminated (Chapter 4 listed New as a fifth).</li><li><strong>PCB</strong> is the kernel data structure representing a process; the <strong>scheduler</strong> picks a ready process for the CPU; a <strong>context switch</strong> swaps one process out and another in.</li><li><strong>Cooperating processes</strong> need IPC (shared memory or message passing), which forces <strong>synchronization</strong>. The producer/consumer counter bug was a <strong>race condition</strong>: the result depended on the interleaving order of operations on a shared variable.</li></ul></div>
<h3 id="s5-1"><span class="secnum">5.1</span> What a Thread Is</h3>
<p>Big picture: a process is the container; a thread is a worker inside that container. A single-threaded process has exactly one worker that runs the code top to bottom. A multithreaded process has several workers running different parts of the same code at the same time, all sharing the process's memory and resources. This is the central idea of the chapter — hold onto it.</p>
<div class="box def"><span class="lbl">Definition: Thread</span><dl><dt>Plain English</dt><dd>A thread is one independent path of execution inside a process — one 'worker' that the CPU can run. A process can hold many of them.</dd><dt>Technical</dt><dd>A thread is the basic unit of CPU utilization. It comprises a thread ID (TID), a program counter, a register set, and a stack. It shares its code section, data section, and other OS resources (such as open files and signals) with the other threads of the same process.</dd><dt>Why it matters</dt><dd>The CPU does not actually schedule 'processes' to run — it schedules threads. Understanding what a thread privately owns versus what it shares is the key to understanding every bug and every benefit in concurrent programming.</dd></dl></div>
<h4>Private vs. shared — the single most testable table in this chapter</h4>
<div class="tw"><table><thead><tr><th>Each thread has its OWN</th><th>All threads SHARE (per process)</th></tr></thead><tbody><tr><td>Thread ID (TID)</td><td>Code / text section</td></tr><tr><td>Program counter (PC)</td><td>Data section (globals)</td></tr><tr><td>Register set</td><td>Heap</td></tr><tr><td>Stack (its own call frames / locals)</td><td>Open files, signals, other OS resources</td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>The classic exam line:</strong> "Threads of the same process share the heap and global data but each has its own stack and registers." That is why two threads can clobber a shared global (race condition) but cannot accidentally overwrite each other's local variables — locals live on each thread's private stack.</p></div>
<h4>Single-threaded vs. multithreaded process (the Slide 5 diagram explained)</h4>
<p>The instructor's diagram shows two boxes. The <strong>left box (single-threaded)</strong> has one column: code, data, files across the top, then a single registers/stack/PC unit and one wavy thread line. The <strong>right box (multithreaded)</strong> has the same shared row across the top — code, data, files — but underneath it shows <em>multiple</em> registers+stack+PC units side by side, each with its own wavy thread line. What the instructor wants you to notice: the top row (code/data/files) is drawn <strong>once and shared</strong>; the registers/stack/PC unit is <strong>duplicated per thread</strong>. That picture is the whole 'private vs. shared' table in visual form.</p>
<h3 id="s5-2"><span class="secnum">5.2</span> Why Threads — Motivation &amp; Benefits</h3>
<p>Big picture: almost every modern application is multithreaded because a single thread leaves the machine underused and the user interface frozen. A word processor, for example, can use separate threads to update the display, fetch data, run the spell checker, and answer a network request — all at once.</p>
<h4>Motivation</h4>
<ul><li>Most modern applications are multithreaded, to leverage the processing power of multicore systems.</li><li>Threads run inside the application; multiple tasks within one application become separate threads (update display, fetch data, spell-check, answer a network request).</li><li>Process creation is <strong>heavyweight</strong>; thread creation is <strong>lightweight</strong> — far less memory and setup. This can simplify code and increase efficiency.</li><li>Kernels themselves are generally multithreaded.</li></ul>
<h4>The four benefits (memorize these four words: Responsiveness, Resource sharing, Economy,</h4>
<h4>Scalability)</h4>
<div class="tw"><table><thead><tr><th>Benefit</th><th>What it means</th></tr></thead><tbody><tr><td>Responsiveness</td><td>If one part of a process blocks (e.g., waiting on disk), other threads keep running. Crucial for UIs — the interface stays alive while work happens in the background.</td></tr><tr><td>Resource sharing</td><td>Threads share the process's memory and resources by default — easier and cheaper than setting up shared memory or message passing between processes.</td></tr><tr><td>Economy</td><td>Creating a thread is cheaper than creating a process; switching between threads has lower overhead than a full process context switch.</td></tr><tr><td>Scalability</td><td>A multithreaded process can spread its threads across multiple cores and run them truly in parallel; a single-threaded process cannot.</td></tr></tbody></table></div>
<p>The <strong>Multithreaded Server Architecture</strong> diagram (Slide 7) makes the point concrete: a server thread sits in a loop waiting for client requests. When a request arrives, instead of handling it itself (and making everyone else wait), the server <em>creates a new thread</em> (or hands the request to an existing one) to service that client, then immediately loops back to wait for the next request. Result: many clients served concurrently, and the listening thread is never blocked.</p>
<h3 id="s5-3"><span class="secnum">5.3</span> Concurrency vs. Parallelism</h3>
<p>Big picture: these two words are constantly confused, and distinguishing them is a guaranteed exam question. They are NOT synonyms.</p>
<div class="box def"><span class="lbl">Definition: Concurrency</span><dl><dt>Plain English</dt><dd>More than one task is making progress over the same period — but not necessarily at the same instant. A single core can be concurrent by rapidly switching between tasks.</dd><dt>Technical</dt><dd>Concurrency supports more than one task making progress. On a single processor/core, the scheduler interleaves tasks to provide the illusion of simultaneous progress.</dd><dt>Why it matters</dt><dd>Concurrency is about dealing with many things at once (structure); it is possible even on one core.</dd></dl></div>
<div class="box def"><span class="lbl">Definition: Parallelism</span><dl><dt>Plain English</dt><dd>Two or more tasks literally run at the very same instant, on different cores.</dd><dt>Technical</dt><dd>Parallelism implies a system can perform more than one task simultaneously. It requires hardware with multiple cores/processors.</dd><dt>Why it matters</dt><dd>Parallelism is about doing many things at once (execution); it requires multiple cores. Parallelism implies concurrency, but concurrency does not imply parallelism.</dd></dl></div>
<p>The Slide 10 diagrams: <strong>Concurrent execution on a single core</strong> is drawn as one timeline where threads T1, T2, T3, T4 take turns — T1 T2 T3 T4 T1 T2 T3 T4… — interleaved on the <em>same</em> core. <strong>Parallelism on a multicore system</strong> is drawn as two timelines stacked: core 1 runs T1 T3 T1 T3… while core 2 runs T2 T4 T2 T4… <em>simultaneously</em>. Notice in the parallel picture two threads occupy the same vertical time slice; in the concurrent picture only one ever does.</p>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>"Concurrent means parallel."</strong> No. Concurrency can happen on a single core through time-slicing — tasks make progress by taking turns, not by running at the same instant. You only get parallelism when you have multiple cores actually executing at the same time.</p></div>
<h4>Two types of parallelism</h4>
<div class="tw"><table><thead><tr><th>Type</th><th>Idea</th><th>Example</th></tr></thead><tbody><tr><td>Data parallelism</td><td>Split the SAME data across cores; each core runs the SAME operation on its chunk.</td><td>Sum a huge array by giving each core a slice to sum, then combine.</td></tr><tr><td>Task parallelism</td><td>Distribute THREADS across cores; each thread performs a UNIQUE operation (possibly on the same data).</td><td>One thread sorts, another compresses, another encrypts.</td></tr></tbody></table></div>
<p><strong>Memory trick:</strong> DATA parallelism = same operation, different DATA. TASK parallelism = different TASK (operation), possibly same data.</p>
<h4>Challenges of multicore programming (Slide 9)</h4>
<p>Multicore systems put pressure on programmers. The instructor lists five challenges you should be able to name:</p>
<ol><li><strong>Dividing activities</strong> — identifying which parts of the program can actually run in parallel.</li><li><strong>Balancing</strong> — making sure the parallel pieces do roughly equal work, so no core sits idle while another is overloaded.</li><li><strong>Data splitting</strong> — dividing the data so it can be processed across cores.</li><li><strong>Data dependency</strong> — when one task's result feeds another, that ordering must be examined and protected.</li><li><strong>Testing and debugging</strong> — concurrent execution has many possible interleavings, so bugs are harder to reproduce and find.</li></ol>
<h3 id="s5-4"><span class="secnum">5.4</span> Amdahl's Law — the Formula You Will Be Tested On</h3>
<p>Big picture: you bought a 16-core machine. Does your program get 16× faster? Almost never. Amdahl's Law tells you the ceiling, because the part of your program that must run serially (one step after another) cannot be sped up by adding cores. This is the marquee equation of the chapter — expect to compute it by hand.</p>
<div class="box def"><span class="lbl">Definition: Amdahl's Law</span><dl><dt>Plain English</dt><dd>A formula that predicts the maximum speedup you can get by adding more cores, given that some fraction of your program is stuck running serially.</dd><dt>Technical</dt><dd>Amdahl's Law identifies the performance gains from adding cores to an application that has both serial and parallel components.</dd><dt>Why it matters</dt><dd>It quantifies the brutal truth that the serial fraction of a program limits the benefit of parallel hardware — the basis of nearly every 'how much faster' question in this unit.</dd></dl></div>
<h4>The formula</h4>
<pre class="code"><code>                    1
   speedup  =  -------------
                     (1 - S)
                S  +  -------
                        N</code></pre>
<h4>Every variable explained</h4>
<div class="tw"><table><thead><tr><th>Symbol</th><th>Meaning</th><th>Units / range</th></tr></thead><tbody><tr><td>S</td><td>Serial portion — the fraction of the program that must run sequentially (cannot be parallelized).</td><td>A fraction between 0 and 1 (e.g., 0.25 = 25%).</td></tr><tr><td>1 - S</td><td>Parallel portion — the fraction that CAN be split across cores.</td><td>Fraction between 0 and 1.</td></tr><tr><td>N</td><td>Number of processing cores you run the parallel portion on.</td><td>A positive integer (1, 2, 4, …).</td></tr><tr><td>speedup</td><td>How many times faster the whole program runs vs. on a single core.</td><td>A unitless ratio (e.g., 1.6 means 1.6× faster).</td></tr></tbody></table></div>
<h4>Why the equation works</h4>
<p>Think of total work on one core as taking time 1. That work splits into two pieces: the serial piece <code>S</code>, which always takes time <code>S</code> no matter how many cores you have, and the parallel piece <code>(1 - S)</code>, which <em>can</em> be divided evenly across <code>N</code> cores, so it now takes <code>(1 - S) / N</code>. The new total time is <code>S + (1 - S)/N</code>. Speedup is old time over new time = <code>1 / (S + (1 - S)/N)</code>. The serial term <code>S</code> never shrinks — that is the anchor dragging your speedup down.</p>
<h4>When it's used</h4>
<ul><li>Estimating the payoff before buying or allocating more cores.</li><li>Deciding whether it is worth the effort to parallelize a program at all.</li><li>Explaining why a heavily serial program barely improves on a 64-core server.</li></ul>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Example 1 (the deck's own numbers): 75% parallel, 25% serial, 1 → 2 cores.</strong></p><p>Here <code>S = 0.25</code>, <code>(1 - S) = 0.75</code>, <code>N = 2</code>.</p><p>Denominator = <code>0.25 + 0.75/2 = 0.25 + 0.375 = 0.625</code>.</p><p>speedup = <code>1 / 0.625 = 1.6</code>. So two cores give a <strong>1.6× speedup</strong>, not 2× — exactly what the slide states.</p></div>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Example 2: the ceiling as N → ∞ (50% serial).</strong></p><p>As you add infinite cores, <code>(1 - S)/N → 0</code>, so speedup → <code>1 / S</code>.</p><p>If <code>S = 0.50</code>, maximum speedup = <code>1 / 0.5 = 2.0×</code> — no matter how many cores you throw at it. Half-serial code can never beat 2× total. This is the slide's headline warning.</p></div>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Example 3 (harder): 90% parallel, 4 cores.</strong></p><p>Here <code>S = 0.10</code>, <code>N = 4</code>. Denominator = <code>0.10 + 0.90/4 = 0.10 + 0.225 = 0.325</code>.</p><p>speedup = <code>1 / 0.325 ≈ 3.08×</code>. And the ceiling for this program (N → ∞) is <code>1/0.10 = 10×</code>.</p></div>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>Mistake 1 — using percentages instead of fractions.</strong> Plug in 0.25, not 25. The formula needs fractions of 1.</p><p><strong>Mistake 2 — dividing the serial part by N.</strong> Only the parallel part <code>(1 - S)</code> is divided by N. The serial term <code>S</code> stands alone.</p><p><strong>Mistake 3 — thinking N cores means N× speedup.</strong> That is only true if S = 0 (fully parallel). Any serial fraction caps you below N.</p></div>
<div class="box proc"><span class="lbl">Amdahl in one line</span><p>The serial portion of an application has a <strong>disproportionate</strong> effect on the gain from extra cores; the absolute ceiling is <code>1/S</code>.</p></div>
<h3 id="s5-5"><span class="secnum">5.5</span> User Threads vs. Kernel Threads</h3>
<p>Big picture: threads can be managed in two different places — by a library running in user space, or by the kernel itself. Which one you have determines how concurrency really behaves.</p>
<div class="box def"><span class="lbl">Definition: User threads</span><dl><dt>Plain English</dt><dd>Threads created and managed by a user-level library, without the kernel necessarily knowing each one exists.</dd><dt>Technical</dt><dd>User threads are supported above the kernel and managed by a user-level threads library. The three primary libraries are POSIX Pthreads, Windows threads, and Java threads.</dd><dt>Why it matters</dt><dd>User-level management is fast (no kernel calls to switch), but the kernel may not know to schedule them across cores or to keep the process running when one thread blocks.</dd></dl></div>
<div class="box def"><span class="lbl">Definition: Kernel threads</span><dl><dt>Plain English</dt><dd>Threads the operating system kernel knows about and schedules directly.</dd><dt>Technical</dt><dd>Kernel threads are supported and managed directly by the kernel. Virtually all general-purpose OSes provide them — Windows, Linux, macOS, iOS, Android.</dd><dt>Why it matters</dt><dd>Because the kernel sees them, kernel threads can be scheduled across multiple cores and one blocking thread need not freeze the others — at the cost of kernel involvement (slower to create/switch).</dd></dl></div>
<h4>What a user-level thread library must do itself (Slide 31)</h4>
<p>If threads live purely in user space, the library — not the kernel — is responsible for everything:</p>
<ul><li><strong>Thread creation</strong> — allocate memory for each thread's stack and registers, and build the thread control block (TCB) to store its state.</li><li><strong>Context switching</strong> — the kernel is unaware of the threads, so the library saves and restores register state to switch between them.</li><li><strong>Scheduling</strong> — the library implements its own scheduler to decide which thread runs next.</li><li><strong>Synchronization</strong> — since the kernel isn't managing them, the library must provide the locks that coordinate access to shared data.</li></ul>
<h3 id="s5-6"><span class="secnum">5.6</span> Multithreading Models</h3>
<p>Big picture: there must be a relationship — a mapping — between user threads and the kernel threads that actually get CPU time. There are four ways to draw that mapping, and each has a concurrency consequence.</p>
<h4>Many-to-One</h4>
<ul><li>Many user-level threads are mapped to a single kernel thread.</li><li><strong>Consequence:</strong> if one thread makes a blocking call, <strong>all</strong> threads block (the one kernel thread is stuck).</li><li>Multiple threads cannot run in parallel on a multicore system, because only one may be in the kernel at a time.</li><li>Few systems use this today. Examples: Solaris Green Threads, GNU Portable Threads.</li></ul>
<h4>One-to-One</h4>
<ul><li>Each user thread maps to its own kernel thread; creating a user thread creates a kernel thread.</li><li><strong>More concurrency</strong> than many-to-one — threads can block independently and run on different cores.</li><li>Downside: the number of threads per process is sometimes restricted, because each kernel thread carries overhead.</li><li>Examples: Windows, Linux.</li></ul>
<h4>Many-to-Many</h4>
<ul><li>Many user threads are multiplexed onto a smaller-or-equal number of kernel threads.</li><li>Lets the OS create a sufficient number of kernel threads, combining the flexibility of many-to-one with the parallelism of one-to-one.</li><li>Examples: Windows with the ThreadFiber package; otherwise uncommon.</li></ul>
<h4>Two-Level Model</h4>
<ul><li>Like many-to-many, except it also allows a particular user thread to be bound directly to a kernel thread.</li><li>Combines many-to-many and one-to-one behavior at the same time.</li></ul>
<p>The Slide 17–18 diagrams draw user threads as circles (<em>k</em> or <em>user thread</em> labels) on top, kernel threads as boxes below, and lines connecting them. The number and pattern of those connecting lines <em>is</em> the model: many lines into one box = many-to-one; one line each = one-to-one; many lines into several boxes = many-to-many.</p>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Guaranteed question:</strong> "In the many-to-one model, what happens when one thread blocks?" Answer: every thread in the process blocks, because they all share a single kernel thread. Contrast with one-to-one, where only the blocking thread is stuck.</p></div>
<h3 id="s5-7"><span class="secnum">5.7</span> Thread Libraries &amp; Asynchronous vs. Synchronous Threading</h3>
<p>Big picture: a thread library gives the programmer an API to create and manage threads. There are three you must know by name, and one structural choice (async vs. sync) about how the parent behaves after spawning children.</p>
<h4>The three primary libraries</h4>
<div class="tw"><table><thead><tr><th>Library</th><th>Key facts</th></tr></thead><tbody><tr><td>POSIX Pthreads</td><td>An IEEE POSIX standard (1003.1c). It is a SPECIFICATION, not an implementation — it defines the API's behavior and leaves the implementation to the OS. May be user-level or kernel-level. Common on Linux &amp; macOS. Now part of glibc.</td></tr><tr><td>Windows threads</td><td>The native threading API on Windows.</td></tr><tr><td>Java threads</td><td>Managed by the JVM, typically built on the underlying OS's thread model.</td></tr></tbody></table></div>
<p><strong>True/False from the slides:</strong> "It is possible to create a thread library without any kernel-level support." <strong>True</strong> — a library can live entirely in user space.</p>
<h4>Asynchronous vs. synchronous threading</h4>
<div class="tw"><table><thead><tr><th>Asynchronous threading</th><th>Synchronous threading</th></tr></thead><tbody><tr><td>After the parent creates a child, the parent RESUMES execution. Parent and child run concurrently and independently.</td><td>The parent creates one or more children and then WAITS for all of them to finish before it continues. Children run concurrently, but the parent is blocked until they all terminate.</td></tr></tbody></table></div>
<h3 id="s5-8"><span class="secnum">5.8</span> Pthreads in Practice</h3>
<p>The deck walks through a complete Pthreads program that sums the integers 1..N in a separate thread. The four calls to know: <code>pthread_attr_init</code> (set default attributes), <code>pthread_create</code> (start the thread running a given function), <code>pthread_join</code> (wait for it to finish), and <code>pthread_exit</code> (the thread ends, optionally returning a value).</p>
<h4>The worker and main (Slides 26–27)</h4>
<pre class="code"><code>#include &lt;pthread.h&gt;
#include &lt;stdio.h&gt;
#include &lt;stdlib.h&gt;
int sum;                 /* shared by the thread(s) */
void *runner(void *param);
int main(int argc, char *argv[]) {
    pthread_t tid;           /* the thread identifier */
    pthread_attr_t attr;     /* set of thread attributes */
    pthread_attr_init(&amp;attr);              /* default attrs */
    pthread_create(&amp;tid, &amp;attr, runner, argv[1]);  /* start */
    pthread_join(tid, NULL);               /* wait for exit */
    printf("sum = %d\n", sum);
}
void *runner(void *param) {
    int i, upper = atoi(param);
    sum = 0;
    for (i = 1; i &lt;= upper; i++)
        sum += i;
    pthread_exit(0);
}</code></pre>
<p>Note <code>sum</code> is a <strong>global</strong>, so it lives in the shared data section — that is why the child thread can write it and <code>main</code> can read it after the join. If <code>sum</code> were a local in <code>runner</code>, it would die with the thread's private stack.</p>
<h4>Returning a value through void * (Slide 28)</h4>
<p><strong>Why void *?</strong> A thread function has a fixed signature: it takes a <code>void *</code> and returns a <code>void *</code>. <code>void *</code> is a generic pointer — it can point to <em>any</em> type. To return an int, you allocate it on the heap (so it survives the thread), store its address, and the joiner casts the pointer back:</p>
<pre class="code"><code>/* in the worker: return 42 via the heap */
int *result = malloc(sizeof(int));
*result = 42;
pthread_exit((void *) result);
/* in main: collect it */
void *return_value;
pthread_join(tid, &amp;return_value);
int *result = (int *) return_value;
printf("The returned value: %d\n", *result);</code></pre>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>Why malloc instead of returning a local's address?</strong> If the worker did <code>int r = 42; pthread_exit(&amp;r);</code>, <code>r</code> lives on the thread's stack, which is gone the moment the thread exits — the joiner would read freed memory. Heap memory persists until you <code>free</code> it, so it survives the handoff.</p></div>
<p>To join many threads (Slide 29), keep them in an array and loop: <code>for (i = 0; i &lt; NUM_THREADS; i++) pthread_join(workers[i], NULL);</code></p>
<h4>Windows and Java equivalents (Slides 32–35)</h4>
<div class="tw"><table><thead><tr><th>Concept</th><th>Windows</th><th>Java</th></tr></thead><tbody><tr><td>Create a thread</td><td>CreateThread(...)</td><td>new Thread(new Task()); worker.start();</td></tr><tr><td>Wait for a thread</td><td>WaitForSingleObject(handle, INFINITE)</td><td>worker.join();</td></tr><tr><td>Thread function / body</td><td>DWORD WINAPI Summation(LPVOID Param)</td><td>implement Runnable's run() method</td></tr><tr><td>Generic pointer type</td><td>LPVOID (= void *)</td><td>(handled by objects)</td></tr><tr><td>32-bit unsigned int type</td><td>DWORD ("double word")</td><td>(int)</td></tr></tbody></table></div>
<p>Java specifics: a thread body is written by <strong>implementing the Runnable interface</strong> (<code>public void run()</code>) — standard practice — or by extending the Thread class. You start it with <code>worker.start()</code> and wait with <code>worker.join()</code> (wrapped in a try/catch for InterruptedException).</p>
<h3 id="s5-9"><span class="secnum">5.9</span> Implicit Threading</h3>
<p>Big picture: as thread counts grow, explicit thread management becomes error-prone. Implicit threading shifts the creation and management of threads away from the programmer and onto compilers and run-time libraries. The deck explores five methods.</p>
<div class="box def"><span class="lbl">Definition: Implicit threading</span><dl><dt>Plain English</dt><dd>Letting the compiler or a run-time library create and manage threads for you, so you describe the work, not the threads.</dd><dt>Technical</dt><dd>Implicit threading moves the creation and management of threads from application programmers to compilers and run-time libraries.</dd><dt>Why it matters</dt><dd>It improves correctness and productivity as thread counts scale, because the hard, bug-prone parts (creation, pooling, scheduling) are handled by tested infrastructure.</dd></dl></div>
<h4>1. Thread Pools</h4>
<p>Create a number of threads up front in a pool, where they wait for work. When a request arrives, it is handed to an idle pool thread; if none is free, the request is queued until one finishes and returns to the pool.</p>
<ul><li>Servicing a request with an existing thread is usually faster than creating a new thread each time.</li><li>Bounds the number of threads to the pool size — prevents runaway thread creation under load.</li><li>Separates the task from the mechanics of running it, so tasks can be scheduled with a delay or run periodically.</li></ul>
<p>Windows uses <code>QueueUserWorkItem(&amp;PoolFunction, NULL, 0)</code> — passing a function pointer, a parameter, and flags — to run a function on a pool thread.</p>
<h4>2. Fork-Join Parallelism</h4>
<p>Multiple tasks are <strong>forked</strong> (spawned) and later <strong>joined</strong> (their results combined). The general recipe is divide-and-conquer:</p>
<pre class="code"><code>Task(problem)
    if the problem is small enough
        solve it directly
    else
        subtask1 = fork(new Task(subset of problem))
        subtask2 = fork(new Task(subset of problem))
        result1  = join(subtask1)
        result2  = join(subtask2)
        combine result1 and result2</code></pre>
<p>Java added a fork-join library in 1.7 for recursive divide-and-conquer algorithms (Quicksort, Mergesort, array summation). <code>ForkJoinTask</code> is the abstract base; <code>RecursiveTask</code> returns a result (via <code>compute()</code>), while <code>RecursiveAction</code> returns nothing. A <code>ForkJoinPool</code> runs the tasks. The summation example splits the array at the midpoint, forks both halves, and joins them — recursing until a chunk is below THRESHOLD (1000), where it sums directly.</p>
<h4>3. OpenMP</h4>
<p>A set of <strong>compiler directives</strong> and an API for C, C++, and FORTRAN, for shared-memory parallelism. You annotate parallel regions and the compiler creates the threads:</p>
<pre class="code"><code>#pragma omp parallel          /* one thread per core */
{
    printf("I am a parallel region.");
}
#pragma omp parallel for      /* split loop across threads */
for (int i = 0; i &lt; N; i++)
    c[i] = a[i] + b[i];
/* compile: */  gcc -fopenmp openmp_ex.c -o openmp</code></pre>
<p><code>#pragma omp parallel</code> creates as many threads as there are cores; <code>#pragma omp parallel for</code> additionally divides the loop iterations among those threads. Available on many compilers for Linux, Windows, and macOS.</p>
<h4>4. Grand Central Dispatch (GCD)</h4>
<ul><li>Apple's technology for macOS and iOS: extensions to C, C++, and Objective-C, plus an API and run-time library.</li><li>You identify parallel sections as <strong>blocks</strong> written in <code>^{ ... }</code> syntax, e.g. <code>^{ printf("I am a block"); }</code>.</li><li>Blocks are placed on a dispatch queue and assigned to an available thread in a thread pool when removed from the queue. GCD manages most threading details for you.</li></ul>
<h4>5. Intel Threading Building Blocks (TBB)</h4>
<p>A C++ template library for parallelism. A serial loop <code>for (int i=0;i&lt;n;i++) apply(v[i]);</code> becomes <code>parallel_for(size_t(0), n, [=](size_t i){ apply(v[i]); });</code>. TBB splits the iterations into chunks and creates tasks for them. Supported on Linux, Windows, and macOS.</p>
<h3 id="s5-10"><span class="secnum">5.10</span> Threading Issues</h3>
<p>Big picture: threads complicate several classic OS mechanisms. The deck lists six issues you should be able to discuss.</p>
<h4>1. Semantics of fork() and exec()</h4>
<ul><li>Does <code>fork()</code> duplicate only the calling thread, or all threads of the process? Some UNIXes provide two versions: <code>fork()</code> and <code>vfork()</code>.</li><li><code>exec()</code> works as usual: the new program replaces the <strong>entire</strong> process, including all of its threads.</li><li>Which to use depends on the application: if <code>exec()</code> is called immediately after forking, duplicating all threads is wasteful, so duplicating only the calling thread is appropriate. If the child does <em>not</em> call exec(), it should ideally duplicate all threads.</li><li><code>vfork()</code> is faster than <code>fork()</code> because the parent's memory space is not copied.</li></ul>
<h4>2. Signal handling (synchronous vs. asynchronous)</h4>
<p>A <strong>signal</strong> notifies a process that an event occurred; a <strong>signal handler</strong> (default or user-defined) processes it. The hard question with threads is: <em>which thread receives the signal?</em> The options are: deliver to the thread the signal applies to; deliver to every thread; deliver to certain threads; or assign one thread to receive all signals.</p>
<ul><li><strong>Synchronous signals</strong> (caused by the thread itself, e.g., illegal memory access) must go to the thread that caused them.</li><li><strong>Asynchronous signals</strong> (e.g., CTRL+C to terminate) should generally be sent to all threads.</li></ul>
<h4>3. Thread cancellation</h4>
<div class="box def"><span class="lbl">Definition: Thread cancellation</span><dl><dt>Plain English</dt><dd>Stopping a thread before it has finished its work. The thread being stopped is called the target thread.</dd><dt>Technical</dt><dd>Thread cancellation terminates a target thread before it has completed. Two approaches exist: asynchronous (another thread terminates it immediately) and deferred (the target periodically checks whether it should terminate).</dd><dt>Why it matters</dt><dd>Asynchronous cancellation can leave shared data in a half-updated state; deferred cancellation lets the target stop at a safe point. This trade-off shows up directly on exams.</dd></dl></div>
<p>In Pthreads, <code>pthread_cancel(tid)</code> only <strong>requests</strong> cancellation — whether and when it actually happens depends on the target thread's cancellation state. You still <code>pthread_join</code> afterward to wait for it to terminate.</p>
<h4>4. Thread-local storage (TLS)</h4>
<ul><li>TLS gives each thread its own private copy of a piece of data — useful when you don't control thread creation (e.g., using a thread pool).</li><li><strong>Vs. local variables:</strong> locals are visible only during a single function call; TLS persists <em>across</em> function calls.</li><li><strong>Vs. static data:</strong> like static data it persists, but TLS is <em>unique to each thread</em> rather than shared.</li><li>In gcc, declare it with the storage class keyword: <code>static __thread int threadID;</code></li></ul>
<h4>5. Scheduler activations (LWPs and upcalls)</h4>
<p>Both the many-to-many and two-level models need the user library and kernel to communicate about how many kernel threads to allocate. They use an intermediate structure called a <strong>lightweight process (LWP)</strong>, which appears to the application as a virtual processor it can schedule a user thread onto. Each LWP attaches to a kernel thread. A good starting heuristic is one LWP per available core.</p>
<p><strong>Scheduler activations</strong> provide <strong>upcalls</strong> — a communication mechanism <em>from the kernel up to</em> an upcall handler in the thread library — so the application can keep the right number of kernel threads as conditions change (e.g., when a thread blocks).</p>
<div class="box proc"><span class="lbl">Chapter 5 in one breath</span><p>A <strong>thread</strong> is the basic unit of CPU scheduling: it privately owns a TID, PC, registers, and stack, and shares code, data, heap, and files with its siblings. Threads buy you <strong>responsiveness, resource sharing, economy, and scalability</strong>. <strong>Concurrency</strong> (progress via interleaving, even on one core) is not <strong>parallelism</strong> (true simultaneous execution on many cores). <strong>Amdahl's Law</strong> — speedup = 1 / (S + (1−S)/N) — caps that parallelism at 1/S because the serial fraction never shrinks. Threads are managed as <strong>user</strong> or <strong>kernel</strong> threads and mapped via <strong>many-to-one, one-to-one, many-to-many, or two-level</strong> models. <strong>Pthreads, Windows, and Java</strong> are the three libraries; <strong>implicit threading</strong> (thread pools, fork-join, OpenMP, GCD, TBB) hands the hard parts to the runtime. Finally, threads complicate <strong>fork/exec, signals, cancellation, TLS, and scheduler activations</strong>.</p></div>
</section>
<section class="lecture prose" id="ch6">
<div class="plate"><span class="num" aria-hidden="true">06</span><p class="ttl">CPU Scheduling</p><p class="src">Chapter 6</p></div>
<p>Chapter 5 gave you threads — many runnable streams of execution. But a single core can run only one at a time. <strong>CPU scheduling</strong> is the policy that decides <em>which</em> ready process (or thread) gets the CPU <em>next</em>, and for how long. Get this wrong and short jobs wait forever behind long ones; get it right and the machine stays busy and responsive. This chapter builds the vocabulary, the criteria, and your first two algorithms — FCFS and SJF — with full Gantt-chart worked examples.</p>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Heads-up on scope:</strong> this lecture deck ends after SJF and the start of CPU-burst prediction. These notes cover everything the slides present — basic concepts, the process lifecycle, scheduling vs. dispatching, preemptive vs. non-preemptive, the dispatcher, scheduling criteria, priority, FCFS, SJF, and the burst-prediction (exponential averaging) formula. Later algorithms (Round Robin, Priority queues, multilevel queues) belong to the next part of the chapter and are not in this deck.</p></div>
<h3 id="s6-1"><span class="secnum">6.1</span> Basic Concepts — the CPU–I/O Burst Cycle</h3>
<p>Big picture: scheduling exists only because the CPU would otherwise sit idle. Whenever a running process pauses to do I/O, the scheduler can slot in another ready process so no CPU cycles are wasted. This is the entire payoff of multiprogramming.</p>
<ul><li>Maximizing CPU utilization is only possible with <strong>multiprogramming</strong> — keeping several processes in memory so idle CPU cycles can be filled by other ready-to-run processes.</li><li>Process execution is a <strong>CPU–I/O burst cycle</strong>: a burst of CPU execution, followed by an I/O burst (a wait for I/O), repeating until the process finishes.</li><li>The distribution of CPU-burst lengths is the main concern when designing a scheduler.</li><li>Generally, I/O can be carried out without CPU intervention (e.g., via DMA from Chapter 1), which is exactly why the CPU is free to run someone else during an I/O burst.</li></ul>
<div class="box def"><span class="lbl">Definition: CPU–I/O Burst Cycle</span><dl><dt>Plain English</dt><dd>Programs alternate between thinking (using the CPU) and waiting (doing I/O). Scheduling happens at the boundaries of these bursts.</dd><dt>Technical</dt><dd>Process execution consists of a cycle of CPU execution (a CPU burst) and I/O wait (an I/O burst). Processes alternate between these two states until termination.</dd><dt>Why it matters</dt><dd>The CPU scheduler only cares about CPU bursts — those are the intervals it actually hands out. Knowing whether a workload has many short bursts or few long bursts drives algorithm choice.</dd></dl></div>
<p><strong>Histogram of CPU-burst times (Slide 5):</strong> the instructor shows a frequency curve that is high on the left and tails off to the right — meaning there are <strong>many short CPU bursts</strong> and <strong>relatively few long ones</strong>. This 'many short, few long' shape is why algorithms that favor short jobs (like SJF) tend to perform well in practice.</p>
<h4>Lifecycle of a process (the Slide 4 diagram explained)</h4>
<p>The deck shows a detailed UNIX-style state diagram — richer than Chapter 4's five states. Trace the arrows: a program starts at <strong>New</strong> (e.g., you run <code>./my_prog</code>), then becomes <strong>Ready to Run (in memory)</strong>. If memory is short it can be <strong>Ready to Run (swapped)</strong> out to disk. From ready it is dispatched to <strong>Running (user mode)</strong>; a system call or interrupt moves it to <strong>Running (kernel mode)</strong>. A <strong>preempt</strong> sends it back to ready; a <code>sleep()</code> or I/O wait sends it to <strong>Asleep (in memory)</strong> — or <strong>Asleep (swapped)</strong> if memory is short. When the event completes it returns to ready. On exit it becomes a <strong>Zombie</strong> (terminated but its exit status not yet collected by the parent) before final removal. What the instructor wants you to notice: the user-mode/kernel-mode split, the swapped variants driven by 'not enough memory,' and the zombie step — none of which appeared in the simpler five-state model.</p>
<h3 id="s6-2"><span class="secnum">6.2</span> Scheduling vs. Dispatching</h3>
<p>Big picture: 'choosing who runs next' and 'actually putting them on the CPU' are two different jobs. Mixing them up is a common exam trap.</p>
<p>Allocating ready processes/threads to available processors is split into two parts:</p>
<div class="box def"><span class="lbl">Definition: Process Scheduling</span><dl><dt>Plain English</dt><dd>The decision-making part: picking the order in which ready processes compete for the CPU.</dd><dt>Technical</dt><dd>Process scheduling is the set of policies that determine the order in which active processes compete for the use of the CPU(s).</dd><dt>Why it matters</dt><dd>This is where algorithms like FCFS and SJF live — the policy layer.</dd></dl></div>
<div class="box def"><span class="lbl">Definition: Process Dispatching</span><dl><dt>Plain English</dt><dd>The doing part: actually binding the chosen process to a CPU and handing it control.</dd><dt>Technical</dt><dd>Dispatching is the actual binding of the selected process to a CPU. It involves removing the process from the ready queue, changing its status in the PCB, and loading the processor state.</dd><dt>Why it matters</dt><dd>Dispatching is pure mechanism (and overhead). The time it takes is dispatch latency — a real cost paid on every switch.</dd></dl></div>
<h4>The CPU scheduler's four decision points</h4>
<p>The CPU scheduler selects from the ready queue and assigns a core. A scheduling decision is triggered when a process:</p>
<ol><li>Switches from running to waiting (e.g., issues an I/O request or waits on a child).</li><li>Switches from running to ready (e.g., an interrupt preempts it).</li><li>Switches from waiting to ready (e.g., its I/O completes).</li><li>Terminates.</li></ol>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>The four-points question is a favorite.</strong> For situations <strong>1 and 4</strong> there is <strong>no choice</strong> — the running process can't continue, so a new one must be selected (or the CPU goes idle). For situations <strong>2 and 3</strong> there <strong>is</strong> a choice — the scheduler may keep the current process or switch. That distinction is exactly what defines preemptive vs. non-preemptive scheduling below.</p></div>
<h3 id="s6-3"><span class="secnum">6.3</span> Preemptive vs. Non-Preemptive Scheduling</h3>
<div class="box def"><span class="lbl">Definition: Non-preemptive scheduling</span><dl><dt>Plain English</dt><dd>Once a process gets the CPU, it keeps it until it voluntarily gives it up (by finishing or by blocking for I/O).</dd><dt>Technical</dt><dd>Under non-preemptive scheduling, scheduling occurs only under circumstances 1 &amp; 4. Once the CPU is allocated to a process, the process keeps it until it releases the CPU by terminating or by switching to the waiting state.</dd><dt>Why it matters</dt><dd>Simple, but a long-running process can hog the CPU and starve everyone else — unacceptable for interactive systems.</dd></dl></div>
<div class="box def"><span class="lbl">Definition: Preemptive scheduling</span><dl><dt>Plain English</dt><dd>The OS can forcibly take the CPU away from a running process to give it to another.</dd><dt>Technical</dt><dd>Under preemptive scheduling, scheduling can also occur under circumstances 2 &amp; 3 — the scheduler may remove a process from the CPU before it finishes. Virtually all modern OSes (Windows, macOS, Linux, UNIX) use preemptive algorithms.</dd><dt>Why it matters</dt><dd>Preemption is what makes a system responsive and fair, and what lets priorities and deadlines actually mean something — but it introduces race conditions on shared data.</dd></dl></div>
<h4>Why preemption is necessary (Slide 9)</h4>
<p>Because resource sharing is the whole point of multiprogramming, the scheduler must be able to remove (preempt) a process in response to changing circumstances, such as:</p>
<ul><li><strong>Change in relative priority</strong> — a more important process becomes ready.</li><li><strong>Resource availability</strong> — a needed resource frees up or runs out.</li><li><strong>Deadlock resolution</strong> — breaking a stuck cycle of waiting processes.</li></ul>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>Preemption isn't free.</strong> Preemptive scheduling can cause <strong>race conditions</strong> on shared data: while process A is mid-update of a shared variable, it gets preempted, and process B reads the variable in its inconsistent, half-updated state. This is exactly the producer/consumer race from Chapter 4. The tools to fix it (locks, semaphores) come in the next chapter.</p></div>
<h3 id="s6-4"><span class="secnum">6.4</span> The Dispatcher</h3>
<div class="box def"><span class="lbl">Definition: Dispatcher</span><dl><dt>Plain English</dt><dd>The component that physically hands the CPU to whichever process the scheduler chose.</dd><dt>Technical</dt><dd>The dispatcher module gives control of the CPU to the process selected by the CPU scheduler. It performs: switching context, switching to user mode, and restarting the new process (jumping to the proper location to resume it).</dd><dt>Why it matters</dt><dd>Every single context switch routes through the dispatcher, so its speed directly taxes overall throughput.</dd></dl></div>
<div class="box def"><span class="lbl">Definition: Dispatch latency</span><dl><dt>Plain English</dt><dd>The little gap of wasted time it takes the dispatcher to stop one process and get the next one running.</dd><dt>Technical</dt><dd>Dispatch latency is the time it takes for the dispatcher to stop one process and start another running.</dd><dt>Why it matters</dt><dd>It is pure overhead. Lower dispatch latency means more of the CPU's time is spent on real work and less on switching.</dd></dl></div>
<h3 id="s6-5"><span class="secnum">6.5</span> Scheduling Criteria</h3>
<p>Big picture: to compare scheduling algorithms you need yardsticks. The deck lists five. Some you want to maximize, some you want to minimize — and knowing which is which is a classic question.</p>
