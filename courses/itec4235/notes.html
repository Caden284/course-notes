<section class="lecture prose" id="l06a">
  <div class="plate"><span class="num" aria-hidden="true">L06a</span><p class="ttl">Malware</p><p class="src">Source: L06a-Malware.pdf (Stallings &amp; Brown Chapter 6; Table 6.1 and Figures 6.1–6.3). The deck's title slide reads "Buffer Overflow &amp; Malware," because it continues straight on from L05.</p></div>

  <p>L05 showed you one <em>mechanism</em>: a bug that lets an attacker run code. This lecture is the catalogue of what gets run. Malware is organised around two questions, and if you keep them separate the whole chapter stays straight: <strong>how does it get there</strong> (propagation) and <strong>what does it do once it is there</strong> (payload). Everything else — virus, worm, Trojan, bot, rootkit, ransomware — is a combination of an answer to each.</p>

  <div class="box bg"><span class="lbl">Background: what you already know that this builds on</span>
    <p>From <a href="#l05-why">L05</a>: the Morris Worm (1988), Code Red (2001), Slammer (2003), and Sasser (2004) all spread by exploiting buffer overflows — this lecture tells you what those worms <em>were</em>, not just how they got in. From <a href="#l01a-cia">L01a</a>: confidentiality, integrity, and availability; the NIST malware definition below is written in exactly those terms. From <a href="#l04a-unix">L04a</a> and <a href="#l04b-sids">L04b</a>: a rootkit's whole purpose is to defeat the reporting mechanisms of the OS you studied there, and a virus attached to a program inherits that program's privileges — which is the setuid problem all over again.</p>
  </div>

  <h3 id="l06a-what">What malware is, and how it is classified</h3>

  <div class="box def"><span class="lbl">Definition: malware</span>
    <dl>
      <dt>Plain English</dt><dd>Software somebody slipped onto your system on purpose to hurt you or annoy you.</dd>
      <dt>Technical</dt><dd>NIST SP 800-83 defines malware as "a program that is inserted into a system, usually covertly, with the intent of compromising the confidentiality, integrity, or availability of the victim's data, applications, or operating system or otherwise annoying or disrupting the victim."</dd>
      <dt>Why it matters</dt><dd>Read the definition carefully and it is the CIA triad with one extra clause. "Usually covertly" is the part that makes it a security problem rather than a usability problem: you are not supposed to know it is there.</dd>
    </dl>
  </div>

  <h4>Table 6.1: the terminology, in one table</h4>
  <p>This table is the single most likely source of a matching or definition question on the exam. Read it once as a list, then read it again grouped the way the next slide groups it — by propagation versus payload.</p>
  <div class="tw"><table>
    <thead><tr><th>Name</th><th>Description</th></tr></thead>
    <tbody>
      <tr><td><strong>Advanced Persistent Threat (APT)</strong></td><td>Cybercrime directed at business and political targets, using a wide variety of intrusion technologies and malware, applied persistently and effectively to specific targets over an extended period, often attributed to state-sponsored organizations.</td></tr>
      <tr><td><strong>Adware</strong></td><td>Advertising that is integrated into software. It can result in pop-up ads or redirection of a browser to a commercial site.</td></tr>
      <tr><td><strong>Attack kit</strong></td><td>Set of tools for generating new malware automatically using a variety of supplied propagation and payload mechanisms.</td></tr>
      <tr><td><strong>Auto-rooter</strong></td><td>Malicious hacker tools used to break into new machines remotely.</td></tr>
      <tr><td><strong>Backdoor (trapdoor)</strong></td><td>Any mechanism that bypasses a normal security check; it may allow unauthorized access to functionality in a program or onto a compromised system.</td></tr>
      <tr><td><strong>Downloaders</strong></td><td>Code that installs other items on a machine that is under attack. It is normally included in the malware code first inserted onto a compromised system to then import a larger malware package.</td></tr>
      <tr><td><strong>Drive-by-download</strong></td><td>An attack using code on a compromised website that exploits a browser vulnerability to attack a client system when the site is viewed.</td></tr>
      <tr><td><strong>Exploits</strong></td><td>Code specific to a single vulnerability or set of vulnerabilities.</td></tr>
      <tr><td><strong>Flooders (DoS client)</strong></td><td>Used to generate a large volume of data to attack networked computer systems by carrying out some form of denial-of-service attack.</td></tr>
      <tr><td><strong>Keyloggers</strong></td><td>Captures keystrokes on a compromised system.</td></tr>
      <tr><td><strong>Logic bomb</strong></td><td>Code inserted into malware by an intruder. A logic bomb lies dormant until a predefined condition is met; the code then triggers some payload.</td></tr>
      <tr><td><strong>Macro virus</strong></td><td>A type of virus that uses macro or scripting code, typically embedded in a document or document template and triggered when the document is viewed or edited, to run and replicate itself into other such documents.</td></tr>
      <tr><td><strong>Mobile code</strong></td><td>Software (e.g. script and macro) that can be shipped unchanged to a heterogeneous collection of platforms and executed with identical semantics.</td></tr>
      <tr><td><strong>Rootkit</strong></td><td>Set of hacker tools used after an attacker has broken into a computer system and gained root-level access.</td></tr>
      <tr><td><strong>Spammer programs</strong></td><td>Used to send large volumes of unwanted e-mail.</td></tr>
      <tr><td><strong>Spyware</strong></td><td>Software that collects information from a computer and transmits it to another system by monitoring keystrokes, screen data, and/or network traffic, or by scanning files on the system for sensitive information.</td></tr>
      <tr><td><strong>Trojan horse</strong></td><td>A computer program that appears to have a useful function but also has a hidden and potentially malicious function that evades security mechanisms, sometimes by exploiting legitimate authorizations of a system entity that invokes it.</td></tr>
      <tr><td><strong>Virus</strong></td><td>Malware that, when executed, tries to replicate itself into other executable machine or script code; when it succeeds, the code is said to be infected. When the infected code is executed, the virus also executes.</td></tr>
      <tr><td><strong>Worm</strong></td><td>A computer program that can run independently and can propagate a complete working version of itself onto other hosts on a network by exploiting software vulnerabilities in the target system or using captured authorization credentials.</td></tr>
      <tr><td><strong>Zombie, bot</strong></td><td>Program installed on an infected machine that is activated to launch attacks on other machines.</td></tr>
    </tbody>
  </table></div>

  <h4>The two-axis classification</h4>
  <p>Malware is classified <strong>first</strong> by how it spreads or propagates to reach the desired targets, and <strong>then</strong> by the actions or payloads it performs once a target is reached. Two more cuts are given alongside:</p>
  <div class="tw"><table>
    <thead><tr><th>Cut</th><th>Needs a host program (parasitic)</th><th>Independent, self-contained</th></tr></thead>
    <tbody>
      <tr><td>Examples</td><td>Viruses</td><td>Worms, Trojans, bots</td></tr>
    </tbody>
  </table></div>
  <div class="tw"><table>
    <thead><tr><th>Cut</th><th>Does not replicate</th><th>Replicates</th></tr></thead>
    <tbody>
      <tr><td>Examples</td><td>Trojans, spam e-mail</td><td>Viruses, worms</td></tr>
    </tbody>
  </table></div>

  <div class="box warn"><span class="lbl">Misconception</span>
    <p>"Virus" is not a synonym for malware. A <strong>virus needs a host</strong> — it infects something that already exists and runs when that thing runs. A <strong>worm is a complete program</strong> that runs and spreads by itself. A <strong>Trojan does not replicate at all</strong>; it spreads because people choose to install it. Getting these three straight is worth more exam points than memorising any single attack name.</p>
  </div>

  <h4>The two lists worth memorising</h4>
  <div class="tw"><table>
    <thead><tr><th>Propagation mechanisms</th><th>Payload actions</th></tr></thead>
    <tbody>
      <tr><td>Infection of existing content by <strong>viruses</strong>, subsequently spread to other systems</td><td>Corruption of system or data files</td></tr>
      <tr><td>Exploit of software vulnerabilities by <strong>worms</strong> or <strong>drive-by-downloads</strong>, allowing the malware to replicate</td><td>Theft of service: make the system a zombie agent of attack as part of a <strong>botnet</strong></td></tr>
      <tr><td><strong>Social engineering</strong> attacks that convince users to bypass security mechanisms to install Trojans or respond to phishing</td><td>Theft of information from the system, e.g. <strong>keylogging</strong></td></tr>
      <tr><td></td><td><strong>Stealthing</strong>: hiding its presence on the system</td></tr>
    </tbody>
  </table></div>
  <p>Memory hook: three ways in — <strong>infect, exploit, trick</strong>. Four things to do — <strong>corrupt, conscript, steal, hide</strong>.</p>

  <h3 id="l06a-kits">Attack kits, attack sources, and APTs</h3>

  <h4>Attack kits (crimeware)</h4>
  <p>Initially, developing and deploying malware required considerable technical skill. Virus-creation toolkits in the early 1990s and more general attack kits in the 2000s changed that. These toolkits, often called <strong>crimeware</strong>, include a variety of propagation mechanisms and payload modules that even novices can deploy. The defensive problem is not the kit itself but the number of <strong>variants</strong> it generates: each one looks different to a signature scanner. Examples named on the slide: <strong>Zeus</strong> and <strong>Angler</strong>.</p>

  <h4>Attack sources</h4>
  <p>The other significant development is who is writing malware. The slide describes a shift from individuals motivated to demonstrate technical competence to their peers, to more organised and dangerous sources:</p>
  <ul>
    <li>Politically motivated attackers</li>
    <li>Criminals</li>
    <li>Organized crime</li>
    <li>Organizations that sell their services to companies and nations</li>
    <li>National government agencies</li>
  </ul>
  <p>This changed both the resources available and the motivation, and produced a large <strong>underground economy</strong> trading attack kits, access to compromised hosts, and stolen information.</p>

  <h4>Advanced Persistent Threats</h4>
  <p>An APT is the well-resourced, persistent application of a wide variety of intrusion technologies and malware to selected targets, usually business or political, and is typically attributed to state-sponsored organizations and criminal enterprises. What makes APTs <em>different</em> from other attacks is not sophistication for its own sake: it is <strong>careful target selection</strong> plus <strong>stealthy intrusion over extended periods</strong>. High-profile examples: <strong>Aurora, RSA, APT1, Stuxnet</strong>.</p>
  <div class="box def"><span class="lbl">Definition: reading "APT" one word at a time</span>
    <dl>
      <dt>Advanced</dt><dd>A wide variety of intrusion technologies and malware, including custom malware if required. Individual components need not be technically advanced — they are <em>carefully selected to suit the chosen target</em>.</dd>
      <dt>Persistent</dt><dd>Determined application of attacks over an extended period against the chosen target to maximise the chance of success; a variety of attacks may be progressively applied until the target is compromised.</dd>
      <dt>Threat</dt><dd>Organized, capable, well-funded attackers who intend to compromise specifically chosen targets. The <em>active involvement of people</em> greatly raises the threat level above automated attack tools, and raises the likelihood of success.</dd>
    </dl>
  </div>
  <p>APT attacks aim at anything from theft of intellectual property and security- or infrastructure-related data through to the physical disruption of infrastructure. The techniques are the ordinary ones — social engineering, spear-phishing e-mails, drive-by-downloads from compromised sites the target's personnel are likely to visit. The intent is to infect the target with sophisticated malware having multiple propagation mechanisms and payloads; once initial access is gained, a further range of attack tools is used to <strong>maintain and extend</strong> that access.</p>

  <div class="box ex"><span class="lbl">Worked example: why "advanced" is a misleading word</span>
    <p>A spear-phishing e-mail with a malicious attachment is technologically unremarkable — the same trick has worked since the 1990s. What makes it an APT is the preparation around it: the attacker knows which engineer opens contract PDFs, the e-mail quotes a real project, the payload calls back over HTTPS so it blends into normal traffic, and the operators keep quiet for months. The sophistication is in the <em>campaign</em>, not the exploit. That is why the slide says individual components "may not necessarily be technically advanced."</p>
  </div>

  <h3 id="l06a-virus">Viruses</h3>

  <p>A virus is a piece of software that infects programs: it modifies them to include a copy of the virus, then replicates and goes on to infect other content. It spreads easily through network environments. When attached to an executable program, <strong>a virus can do anything that the program is permitted to do</strong>, and it executes secretly when the host program is run. Viruses are specific to an operating system and hardware, because they take advantage of their details and weaknesses.</p>

  <div class="box warn"><span class="lbl">Tie this back to L04</span>
    <p>"A virus can do anything that the program is permitted to do" is the same sentence as the setuid problem from <a href="#l04a-setuid">L04a</a>, viewed from the other side. Access control decides what a <em>program</em> may do, not what a <em>person</em> intends; infect a privileged program and the virus inherits the privilege. Least privilege is therefore an anti-virus measure, not just an administration measure.</p>
  </div>

  <h4>The three components of a virus</h4>
  <div class="tw"><table>
    <thead><tr><th>Component</th><th>What it is</th><th>Also called</th></tr></thead>
    <tbody>
      <tr><td><strong>Infection mechanism</strong></td><td>The means by which the virus spreads or propagates</td><td>Infection vector</td></tr>
      <tr><td><strong>Trigger</strong></td><td>The event or condition that determines when the payload is activated or delivered</td><td>Logic bomb</td></tr>
      <tr><td><strong>Payload</strong></td><td>What the virus does besides spreading; may be damage, or benign but noticeable activity</td><td>—</td></tr>
    </tbody>
  </table></div>

  <h4>The four phases of a virus</h4>
  <div class="tw"><table>
    <thead><tr><th>Phase</th><th>What happens</th></tr></thead>
    <tbody>
      <tr><td><strong>Dormant</strong></td><td>The virus is idle and will eventually be activated by some event. <em>Not all viruses have this stage.</em></td></tr>
      <tr><td><strong>Propagation</strong></td><td>The virus places a copy of itself into other programs or into certain system areas on the disk. The copy may not be identical to the propagating version. Each infected program now contains a clone of the virus which will itself enter a propagation phase.</td></tr>
      <tr><td><strong>Triggering</strong></td><td>The virus is activated to perform the function for which it was intended; can be caused by a variety of system events.</td></tr>
      <tr><td><strong>Execution</strong></td><td>The function is performed. It may be harmless or damaging.</td></tr>
    </tbody>
  </table></div>
  <p>The slides present these in the order dormant → triggering → propagation → execution. The logical life cycle is dormant → propagation → triggering → execution, since a virus normally spreads for a while before its trigger fires. Either ordering is defensible on an exam; what you must be able to say is that <strong>four phases exist, that the dormant phase is optional, and which phase does the copying</strong>.</p>

  <h4>Macro and scripting viruses</h4>
  <p>NISTIR 7298 defines a macro virus as "a virus that attaches itself to documents and uses the macro programming capabilities of the document's application to execute and propagate." Macro viruses infect the scripting code used to support active content in user document types. They are threatening for five reasons:</p>
  <ul>
    <li>They are <strong>platform independent</strong> — the macro language, not the CPU, is the environment.</li>
    <li>They infect <strong>documents, not executable portions of code</strong>.</li>
    <li>They are <strong>easily spread</strong>, because documents are what people e-mail each other.</li>
    <li>Because they infect user documents rather than system programs, <strong>traditional file system access controls are of limited use</strong> in preventing their spread — users are <em>expected</em> to modify their own documents.</li>
    <li>They are <strong>much easier to write or modify</strong> than traditional executable viruses.</li>
  </ul>

  <h4>Diagram explained: Figure 6.1, Melissa macro virus pseudo-code</h4>
  <p>The figure is a single block of pseudo-code for a macro named <code>Document_Open</code> — a handler the application calls automatically every time a document is opened. Reading it line by line shows all three virus components in about twenty lines:</p>
<pre class="code"><code>macro Document_Open
    disable Macro menu and some macro security features
    if called from a user document
        copy macro code into Normal template file
    else
        copy macro code into user document being opened
    end if
    if registry key "Melissa" not present
        if Outlook is email client
            for first 50 addresses in address book
                send email to that address
                with currently infected document attached
            end for
        end if
        create registry key "Melissa"
    end if
    if minute in hour equals day of month
        insert text into document being opened
    end if
end macro</code></pre>
  <p>What each part is doing, and why it is on the exam:</p>
  <ul>
    <li><strong>Line 2 is self-defence:</strong> disabling the Macro menu and macro security features stops the user from inspecting or blocking the macro.</li>
    <li><strong>The first if/else is the infection mechanism.</strong> If the macro is running from an ordinary user document, it copies itself into the <em>Normal template</em> — the file every new document inherits from — so every future document is infected. If it is already running from the template, it copies itself into the document being opened, so the infection travels out with that file.</li>
    <li><strong>The registry key is a "do this once" marker.</strong> Mass-mailing to the first 50 address-book entries happens only when the key is absent; afterwards the key exists and the mailing is skipped. This is throttling for stealth: one burst per machine, not a permanent spam engine.</li>
    <li><strong>The last if is the trigger plus payload.</strong> "If minute in hour equals day of month" — e.g. at 11:17 on the 17th — insert text into the document. That is a classic <strong>logic bomb</strong>: a cheap date/time condition guarding a benign but noticeable payload.</li>
  </ul>
  <div class="box ex"><span class="lbl">Worked example: compute the trigger</span>
    <p>Take 3 September at 14:03. The minute in the hour is 3; the day of the month is 3; they are equal, so the payload fires. At 14:04 on the same day it does not. Over a whole day the condition is true for exactly one minute in each hour, 24 minutes in all, and on the 31st of a month it is true at :31 past each hour. The point of the exercise is that a trigger does not have to be clever to be effective — it only has to be rare enough that the virus spreads before anyone notices it.</p>
  </div>

  <h4>Virus classifications</h4>
  <div class="tw"><table>
    <thead><tr><th colspan="2">By target</th></tr></thead>
    <tbody>
      <tr><td><strong>Boot sector infector</strong></td><td>Infects a master boot record or boot record and spreads when a system is booted from the disk containing the virus.</td></tr>
      <tr><td><strong>File infector</strong></td><td>Infects files that the operating system or shell considers to be executable.</td></tr>
      <tr><td><strong>Macro virus</strong></td><td>Infects files with macro or scripting code that is interpreted by an application.</td></tr>
      <tr><td><strong>Multipartite virus</strong></td><td>Infects files in multiple ways.</td></tr>
    </tbody>
  </table></div>
  <div class="tw"><table>
    <thead><tr><th colspan="2">By concealment strategy</th></tr></thead>
    <tbody>
      <tr><td><strong>Encrypted virus</strong></td><td>A portion of the virus creates a random encryption key and encrypts the remainder of the virus.</td></tr>
      <tr><td><strong>Stealth virus</strong></td><td>A form of virus explicitly designed to hide itself from detection by anti-virus software.</td></tr>
      <tr><td><strong>Polymorphic virus</strong></td><td>A virus that mutates with every infection.</td></tr>
      <tr><td><strong>Metamorphic virus</strong></td><td>A virus that mutates and rewrites itself completely at each iteration, and may change behavior as well as appearance.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">The distinction examiners like</span>
    <p><strong>Polymorphic</strong> changes its <em>appearance</em> — typically a new encryption key and a new decryptor each time, so the body differs byte-for-byte but does the same thing. <strong>Metamorphic</strong> rewrites itself completely and <em>may change behaviour as well as appearance</em>. Polymorphic defeats byte-signature scanning; metamorphic also defeats behavioural signatures. Note that an encrypted virus still has to decrypt itself before it runs, which is precisely what <a href="#l06a-counter">sandbox analysis</a> exploits.</p>
  </div>

  <h3 id="l06a-worm">Worms</h3>

  <p>A worm is a program that actively seeks out more machines to infect; each infected machine serves as an automated launching pad for attacks on other machines. It exploits software vulnerabilities in client or server programs, uses network connections to spread from system to system, and also spreads through shared media (USB drives, CD and DVD data disks). E-mail worms spread in macro or script code included in attachments and in instant messenger file transfers. Upon activation the worm may replicate and propagate again, and it usually carries some form of payload. The first known implementation was done at <strong>Xerox Palo Alto Labs in the early 1980s</strong>.</p>

  <h4>The five replication routes</h4>
  <div class="tw"><table>
    <thead><tr><th>Route</th><th>How the copy travels</th></tr></thead>
    <tbody>
      <tr><td>Electronic mail or instant messenger</td><td>The worm e-mails a copy of itself to other systems, or sends itself as an attachment via an instant message service.</td></tr>
      <tr><td>File sharing</td><td>Creates a copy of itself, or infects a file as a virus does, on removable media.</td></tr>
      <tr><td>Remote execution capability</td><td>The worm executes a copy of itself on another system.</td></tr>
      <tr><td>Remote file access or transfer capability</td><td>The worm uses a remote file access or transfer service to copy itself from one system to the other.</td></tr>
      <tr><td>Remote login capability</td><td>The worm logs on to a remote system as a user and then uses commands to copy itself across.</td></tr>
    </tbody>
  </table></div>

  <h4>Target discovery: the four scanning strategies</h4>
  <p><strong>Scanning</strong> (or fingerprinting) is the first function in the propagation phase of a network worm: it searches for other systems to infect. Four strategies are given, and they are a nice illustration of the trade-off between speed and stealth.</p>
  <div class="tw"><table>
    <thead><tr><th>Strategy</th><th>How it picks targets</th><th>Consequence</th></tr></thead>
    <tbody>
      <tr><td><strong>Random</strong></td><td>Each compromised host probes random addresses in the IP address space, using a different seed.</td><td>Produces a <strong>high volume of Internet traffic</strong>, which may cause generalized disruption even before the actual attack is launched. Loud, and slow to find the good targets.</td></tr>
      <tr><td><strong>Hit-list</strong></td><td>The attacker first compiles a long list of potentially vulnerable machines; once compiled, each infected machine is given a portion of the list to scan.</td><td>A <strong>very short scanning period</strong>, which may make it difficult to detect that infection is taking place. Fast and quiet, but requires reconnaissance in advance.</td></tr>
      <tr><td><strong>Topological</strong></td><td>Uses information contained on the infected victim machine to find more hosts to scan.</td><td>Targets are real and reachable (address books, known hosts, peer lists), so hit rates are high and no scanning noise is generated.</td></tr>
      <tr><td><strong>Local subnet</strong></td><td>If a host behind a firewall can be infected, that host looks for targets in its own local network using the subnet address structure.</td><td>Finds hosts that would otherwise be <strong>protected by the firewall</strong>. This is why a perimeter firewall is not a defence once one machine inside is infected.</td></tr>
    </tbody>
  </table></div>

  <h4>Diagram explained: Figure 6.2, the worm propagation model</h4>
  <p>The figure is a graph with time on the horizontal axis and "fraction" from 0 to 1.0 on the vertical. Two curves cross in the middle: one rising from 0 to 1.0 labelled <strong>fraction of hosts infected</strong>, and its mirror image falling from 1.0 to 0 labelled <strong>fraction of hosts not infected</strong>. They cross at 0.5. Across the top, three braces divide the time axis into labelled phases:</p>
  <div class="tw"><table>
    <thead><tr><th>Phase</th><th>Shape of the curve</th><th>Why it looks like that</th></tr></thead>
    <tbody>
      <tr><td><strong>Slow start</strong></td><td>Nearly flat near zero</td><td>Very few infected machines exist, so very few scans are happening. Growth is exponential but from a tiny base, so in absolute terms almost nothing is visible.</td></tr>
      <tr><td><strong>Fast spread</strong></td><td>Steep, nearly vertical through the 0.5 crossing</td><td>Many infected machines are scanning at once and most of the addresses they hit are still vulnerable. This is where the whole Internet notices.</td></tr>
      <tr><td><strong>Slow finish</strong></td><td>Flattens asymptotically toward 1.0</td><td>Almost every vulnerable host is already infected, so most scans land on a machine that is already compromised or was never vulnerable. Effort is wasted, and the curve saturates.</td></tr>
    </tbody>
  </table></div>
  <p>This is a <strong>logistic (S-shaped) curve</strong>, the same shape as an epidemic. The defensive lesson is the one the shape forces: a response that only begins in the fast-spread phase is already too late, because the fast-spread phase is measured in minutes for a well-engineered worm. <strong>Slammer in 2003 reached most of its victims in about ten minutes.</strong> Detection has to happen in the flat slow-start region, which is exactly where there is least evidence.</p>

  <h4>The Morris Worm (1988)</h4>
  <p>The earliest significant worm infection, released by Robert Morris in 1988, designed to spread on UNIX systems. It used three attack routes:</p>
  <ol>
    <li>Attempted to <strong>crack the local password file</strong> to use a login/password pair to log on to other systems.</li>
    <li>Exploited a bug in the <strong>finger protocol</strong>, which reports the whereabouts of a remote user. (This is the <code>fingerd</code> buffer overflow from Table 10.1 in <a href="#l05-why">L05</a>.)</li>
    <li>Exploited a <strong>trapdoor in the debug option</strong> of the remote process that receives and sends mail.</li>
  </ol>
  <p>A successful attack achieved communication with the operating system command interpreter, and the worm then sent the interpreter a <strong>bootstrap program</strong> to copy the rest of the worm over. The bootstrap pattern — get a tiny foothold, then pull down the real payload — is exactly what Table 6.1 calls a <em>downloader</em>, and it is still how most malware is staged today.</p>

  <h4>A brief history of worm attacks</h4>
  <div class="tw"><table>
    <thead><tr><th>Name</th><th>Year</th><th>Description</th></tr></thead>
    <tbody>
      <tr><td><strong>Melissa</strong></td><td>1998</td><td>E-mail worm; the first to include virus, worm, and Trojan in one package.</td></tr>
      <tr><td><strong>Code Red</strong></td><td>July 2001</td><td>Exploited a Microsoft IIS bug; probes random IP addresses; consumes significant Internet capacity when active.</td></tr>
      <tr><td><strong>Code Red II</strong></td><td>August 2001</td><td>Also targeted Microsoft IIS; installed a backdoor for access.</td></tr>
      <tr><td><strong>Nimda</strong></td><td>September 2001</td><td>Had worm, virus, and mobile code characteristics; spread using e-mail, Windows shares, Web servers, Web clients, and backdoors.</td></tr>
      <tr><td><strong>SQL Slammer</strong></td><td>Early 2003</td><td>Exploited a buffer overflow vulnerability in SQL Server; compact, and spread rapidly.</td></tr>
      <tr><td><strong>Sobig.F</strong></td><td>Late 2003</td><td>Exploited open proxy servers to turn infected machines into spam engines.</td></tr>
      <tr><td><strong>Mydoom</strong></td><td>2004</td><td>Mass-mailing e-mail worm; installed a backdoor in infected machines.</td></tr>
      <tr><td><strong>Warezov</strong></td><td>2006</td><td>Creates executables in system directories; sends itself as an e-mail attachment; can disable security-related products.</td></tr>
      <tr><td><strong>Conficker (Downadup)</strong></td><td>November 2008</td><td>Exploits a Windows buffer overflow vulnerability; most widespread infection since SQL Slammer.</td></tr>
      <tr><td><strong>Stuxnet</strong></td><td>2010</td><td><strong>Restricted its rate of spread to reduce the chance of detection</strong>; targeted industrial control systems.</td></tr>
    </tbody>
  </table></div>
  <p>Read the table as a story rather than a list. 1998–2006 is the age of worms that wanted to be as fast and as visible as possible. <strong>Stuxnet in 2010 inverts the entire design goal</strong>: it deliberately slows itself down, because the objective is not scale but one specific target. That inversion is the bridge from "worms" to "APTs," and it is a very likely short-answer question.</p>

  <h4>WannaCry (May 2017)</h4>
  <p>A ransomware attack that spread extremely fast over a period of hours to days, infecting hundreds of thousands of systems belonging to both public and private organizations in more than 150 countries. It spread <strong>as a worm</strong>, aggressively scanning both local and random remote networks (note: local subnet <em>and</em> random scanning, two of the four strategies at once), attempting to exploit a vulnerability in the <strong>SMB file sharing service</strong> on unpatched Windows systems. Its rapid spread was only slowed by the accidental activation of a <strong>"kill-switch" domain</strong> by a UK security researcher. Once installed, it also encrypted files and demanded a ransom payment to recover them.</p>
  <p>WannaCry is the example that refuses to fit in one box: worm propagation, ransomware payload. That is the point of the two-axis classification.</p>

  <h4>The state of worm technology</h4>
  <p>Five properties characterise modern worm technology, and each one is a defence being defeated:</p>
  <div class="tw"><table>
    <thead><tr><th>Property</th><th>What it defeats</th></tr></thead>
    <tbody>
      <tr><td><strong>Multiplatform</strong></td><td>"We don't run Windows, so we're fine."</td></tr>
      <tr><td><strong>Multi-exploit</strong></td><td>Patching the one vulnerability you heard about.</td></tr>
      <tr><td><strong>Ultrafast spreading</strong></td><td>Human-speed incident response.</td></tr>
      <tr><td><strong>Polymorphic</strong></td><td>Byte-signature scanning.</td></tr>
      <tr><td><strong>Metamorphic</strong></td><td>Behavioural signatures as well.</td></tr>
    </tbody>
  </table></div>

  <h3 id="l06a-client">Client-side propagation: mobile code and the drive-by family</h3>

  <h4>Mobile code</h4>
  <p>NIST SP 800-28 defines mobile code as "programs that can be shipped unchanged to a heterogeneous collection of platforms and executed with identical semantics." It is transmitted from a remote system to a local system and then executed locally. It often acts as a mechanism for a virus, worm, or Trojan horse, and takes advantage of vulnerabilities to perform its own exploits.</p>
  <div class="tw"><table>
    <thead><tr><th>Popular vehicles</th><th>Most common malicious uses</th></tr></thead>
    <tbody>
      <tr><td>Java applets</td><td>Cross-site scripting</td></tr>
      <tr><td>ActiveX</td><td>Interactive and dynamic websites</td></tr>
      <tr><td>JavaScript</td><td>E-mail attachments</td></tr>
      <tr><td>VBScript</td><td>Downloads from untrusted sites or of untrusted software</td></tr>
    </tbody>
  </table></div>

  <h4>Mobile phone worms</h4>
  <p><strong>Cabir</strong> was the first mobile phone worm, in 2004; <strong>Lasco</strong> and <strong>CommWarrior</strong> followed in 2005. They communicate through Bluetooth wireless connections or MMS, and the target is the smartphone. They can completely disable the phone, delete data on it, or force the device to send costly messages. <strong>CommWarrior</strong> is the one to remember in detail: it replicates by Bluetooth to other phones, sends itself as an MMS file to contacts, and sends itself as an auto-reply to incoming text messages — three propagation routes in one piece of malware, two of which (contacts, auto-reply) are <em>topological</em> target discovery.</p>

  <h4>Drive-by-downloads</h4>
  <p>Exploits browser and plugin vulnerabilities so that when the user merely <em>views</em> a webpage controlled by the attacker, code in the page exploits the browser bug to download and install malware without the user's knowledge or consent. In most cases the malware <strong>does not actively propagate as a worm does</strong>: it spreads when users visit the malicious page. The propagation mechanism is the web's ordinary traffic.</p>

  <h4>Watering-hole attacks</h4>
  <p>A variant of drive-by-download used in highly targeted attacks. The sequence is:</p>
  <ol>
    <li>The attacker researches their intended victims to identify websites those victims are likely to visit.</li>
    <li>The attacker scans those sites to identify ones with vulnerabilities that allow their compromise.</li>
    <li>The attacker compromises such a site and then <strong>waits</strong> for an intended victim to visit.</li>
    <li>Attack code may be written so that it <strong>only infects systems belonging to the target organization</strong> and takes no action for other visitors — which greatly increases the likelihood of the site compromise remaining undetected.</li>
  </ol>
  <p>The name is the whole explanation: rather than hunting the animal, poison the water hole it comes to.</p>

  <h4>Malvertising</h4>
  <p>Places malware on websites <strong>without actually compromising them</strong>. The attacker pays for advertisements that are highly likely to be placed on their intended target websites and incorporates malware in them; visitors to sites displaying those ads get infected. The malware code may be dynamically generated, either to reduce the chance of detection or to infect only specific systems. It has grown rapidly because it is easy to place on desired websites with few questions asked and hard to track, and because attackers can buy the ads <strong>for as little as a few hours</strong> — timed to when their intended victims are browsing — which greatly reduces the ads' visibility to defenders.</p>
  <div class="box warn"><span class="lbl">Why malvertising is hard to defend against</span>
    <p>The reputable site is not compromised, so scanning it finds nothing. The ad is served by a third-party network the site operator does not control, so blocking at the site is not possible. And the ad may be live for hours, so by the time anyone reports it, the evidence is gone. This is the clearest example in the lecture of an attack that exploits a <em>business</em> relationship rather than a software bug.</p>
  </div>

  <h4>Clickjacking</h4>
  <p>Also known as a <strong>user-interface (UI) redress attack</strong>. It is a vulnerability used by an attacker to collect an infected user's clicks. The attacker can force the user to do a variety of things, from adjusting the user's computer settings to unwittingly sending the user to websites that might have malicious code. By taking advantage of Adobe Flash or JavaScript, an attacker can place a button under or over a legitimate button, making it difficult for users to detect. A typical attack uses <strong>multiple transparent or opaque layers</strong> to trick a user into clicking a button or link on another page when they intended to click on the top-level page — the attacker is hijacking clicks meant for one page and routing them to another.</p>
  <p>Using a similar technique, <strong>keystrokes can also be hijacked</strong>: a user can be led to believe they are typing the password to an e-mail or bank account, but is instead typing into an invisible frame controlled by the attacker.</p>

  <h3 id="l06a-social">Social engineering: spam and Trojans</h3>

  <p>Social engineering is "tricking" users into assisting in the compromise of their own systems. It is the third propagation mechanism, and the only one that does not require a software vulnerability at all.</p>
  <div class="tw"><table>
    <thead><tr><th>Vehicle</th><th>Description</th></tr></thead>
    <tbody>
      <tr><td><strong>Spam</strong></td><td>Unsolicited bulk e-mail. A significant carrier of malware, and the delivery mechanism for phishing attacks.</td></tr>
      <tr><td><strong>Trojan horse</strong></td><td>A program or utility containing harmful hidden code, used to accomplish functions that the attacker could not accomplish directly.</td></tr>
      <tr><td><strong>Mobile phone Trojans</strong></td><td>First appeared in 2004 (<strong>Skuller</strong>); the target is the smartphone.</td></tr>
    </tbody>
  </table></div>
  <div class="box def"><span class="lbl">Definition: the Trojan's real trick</span>
    <p>Table 6.1 says a Trojan "evades security mechanisms, sometimes by <em>exploiting the legitimate authorizations of a system entity that invokes it</em>." That clause is the important one. The Trojan does not break access control; it borrows yours. When you run it, it runs with your rights — it can read every file you can read. No exploit, no privilege escalation, no bug. This is why access control alone cannot stop a Trojan, and why the "confused deputy" idea from <a href="#l04a-principles">L04a</a> keeps reappearing.</p>
  </div>

  <h3 id="l06a-payload">Payloads</h3>

  <p>Four payload categories, matching the four actions listed at the start: system corruption, attack agents, information theft, and stealthing.</p>

  <h4>Payload 1 — system corruption</h4>
  <div class="tw"><table>
    <thead><tr><th>Example</th><th>Year</th><th>What it did</th></tr></thead>
    <tbody>
      <tr><td><strong>Chernobyl virus</strong></td><td>1998</td><td>A destructive parasitic memory-resident Windows 95/98 virus. Infects executable files when they are opened. When a trigger date is reached, it deletes data by <strong>overwriting the first megabyte of the hard drive with zeroes</strong>, causing massive corruption of the entire file system. It also <strong>rewrites BIOS code</strong> — real-world damage to physical equipment.</td></tr>
      <tr><td><strong>Klez</strong></td><td>October 2001</td><td>Mass-mailing worm infecting Windows 95 through XP. Spreads by e-mailing copies of itself to addresses found in the address book <em>and in files on the system</em>. Can stop and delete some anti-virus programs. On the trigger date, causes files on the hard drive to <strong>become empty</strong>.</td></tr>
      <tr><td><strong>Ransomware</strong></td><td>1989 onward</td><td>Encrypts the user's data and demands payment for the key needed to recover it. The <strong>PC Cyborg Trojan (1989)</strong> is the first example. From mid-2006 a number of worms and Trojans appeared using <strong>public-key cryptography with increasingly larger key sizes</strong> to encrypt data; the user had to pay a ransom or make a purchase from certain sites to receive the decryption key.</td></tr>
      <tr><td><strong>Stuxnet</strong></td><td>2010</td><td>Targets specific industrial control system software; the lecture notes concerns about using sophisticated targeted malware for <strong>industrial sabotage</strong>.</td></tr>
    </tbody>
  </table></div>
  <p>A <strong>logic bomb</strong> is code embedded in the malware that is set to "explode" when certain conditions are met. It is not a separate kind of malware — it is the trigger component, named in isolation.</p>

  <div class="box warn"><span class="lbl">Why public-key cryptography made ransomware work</span>
    <p>Early ransomware used symmetric encryption, which meant the decryption key had to be somewhere on the victim's machine — so researchers could extract it and publish a free decryptor. With public-key crypto, the malware carries only the attacker's <strong>public</strong> key, encrypts with that, and the matching private key never leaves the attacker. There is nothing on the victim's machine to recover. This is the one slide in the chapter where <a href="#l03a-rsa">L03a</a>'s RSA pays off directly, and it is a very good exam question: <em>why did ransomware become unrecoverable?</em></p>
  </div>

  <p>WannaCry is used again as the modern illustration: it infected a large number of systems in many countries in May 2017, encrypted a large number of files, and demanded payment in <strong>Bitcoins</strong>. Recovery was generally only possible if the organization had <strong>good backups and an appropriate incident response and disaster recovery plan</strong>. Targets have widened beyond personal computers to mobile devices and Linux servers, and tactics such as <strong>threatening to publish sensitive personal information</strong>, or to <strong>permanently destroy the encryption key after a short period</strong>, are increasingly used to increase pressure on the victim to pay.</p>

  <h4>Payload 2 — attack agents: zombies and bots</h4>
  <p>A <strong>bot</strong> takes over another Internet-attached computer and uses that computer to launch or manage attacks. A <strong>botnet</strong> is a collection of bots capable of acting in a coordinated manner. The uses listed are:</p>
  <ul>
    <li>Distributed denial-of-service (DDoS) attacks</li>
    <li>E-mail spam</li>
    <li>Spyware</li>
    <li>Click fraud</li>
    <li>File sharing</li>
    <li>Spreading malware</li>
    <li>Chatterbots</li>
    <li>Bitcoin mining</li>
  </ul>

  <div class="box def"><span class="lbl">Definition: the remote control facility</span>
    <p>The <strong>remote control facility is what distinguishes a bot from a worm</strong>. A worm propagates itself and activates itself; a bot is initially controlled from some central facility. Memorise this one sentence — it is the cleanest single-line distinction in the chapter.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Generation of command and control</th><th>How it works</th><th>Weakness it fixes</th></tr></thead>
    <tbody>
      <tr><td><strong>IRC server</strong></td><td>Bots join a specific channel on the server and treat incoming messages as commands.</td><td>(The original.) Easy to build, but obvious traffic and one server to seize.</td></tr>
      <tr><td><strong>Covert channels over HTTP</strong></td><td>More recent botnets hide commands inside ordinary web traffic.</td><td>IRC traffic stands out on a corporate network; HTTP does not.</td></tr>
      <tr><td><strong>Peer-to-peer protocols</strong></td><td>Distributed control mechanisms.</td><td>Removes the <strong>single point of failure</strong> — there is no one server for law enforcement to take down.</td></tr>
    </tbody>
  </table></div>

  <h4>Payload 3 — information theft</h4>
  <div class="tw"><table>
    <thead><tr><th>Mechanism</th><th>What it captures</th></tr></thead>
    <tbody>
      <tr><td><strong>Keylogger</strong></td><td>Captures keystrokes to allow an attacker to monitor sensitive information. Typically uses a <strong>filtering mechanism</strong> that only returns information close to keywords such as "login" and "password" — because sending every keystroke home is both enormous and conspicuous.</td></tr>
      <tr><td><strong>Spyware</strong></td><td>Subverts the compromised machine to allow monitoring of a wide range of activity: monitoring the history and content of browsing activity, redirecting certain webpage requests to fake sites, and <strong>dynamically modifying data exchanged between the browser and certain websites of interest</strong>.</td></tr>
    </tbody>
  </table></div>
  <p>That last clause describes a <strong>man-in-the-browser</strong> attack: the data is changed after TLS has decrypted it, so encryption in transit does not help. Worth connecting back to <a href="#l03a-mac">L03a</a>'s secure channels — a secure channel protects the wire, not the endpoints.</p>

  <div class="tw"><table>
    <thead><tr><th>Phishing</th><th>Spear-phishing</th></tr></thead>
    <tbody>
      <tr><td>Exploits social engineering to leverage the user's trust by masquerading as communication from a trusted source. Typically: include a URL in a spam e-mail linking to a fake website that mimics the login page of a banking, gaming, or similar site; suggest that <strong>urgent action is required</strong> by the user to authenticate their account; then exploit the account using the captured credentials.</td><td>Recipients are <strong>carefully researched</strong> by the attacker. The e-mail is crafted to specifically suit its recipient, often quoting a range of information to convince the recipient of its authenticity.</td></tr>
    </tbody>
  </table></div>
  <p>Phishing is broadcast; spear-phishing is aimed. Note how the urgency clause works: it is there to prevent the one behaviour that would defeat the attack, which is stopping to check.</p>

  <h4>Payload 4 — stealthing: backdoors and rootkits</h4>
  <p>A <strong>backdoor</strong> (also known as a trapdoor) is a secret entry point into a program allowing the attacker to gain access and bypass the security access procedures. A <strong>maintenance hook</strong> is a backdoor used by programmers to debug and test programs — i.e. backdoors are not always malicious in origin, which is exactly why they survive into shipped code. It is difficult to implement operating system controls for backdoors in applications, because from the OS's point of view the application is simply doing what applications do.</p>

  <p>A <strong>rootkit</strong> is a set of hidden programs installed on a system to maintain covert access to that system. It hides by <strong>subverting the mechanisms that monitor and report on the processes, files, and registries</strong> on a computer, and gives administrator (or root) privileges to the attacker, who can then add or change programs and files, monitor processes, send and receive network traffic, and get backdoor access on demand.</p>

  <div class="box def"><span class="lbl">Definition: the six rootkit classification characteristics</span>
    <dl>
      <dt>Persistent</dt><dd>Survives a reboot — it is installed somewhere that runs at startup.</dd>
      <dt>Memory based</dt><dd>Exists only in memory, so it disappears on reboot; harder to find on disk, easier to remove.</dd>
      <dt>User mode</dt><dd>Intercepts calls inside ordinary user-space processes, e.g. by replacing library functions.</dd>
      <dt>Kernel mode</dt><dd>Operates inside the kernel itself, where it can lie to everything in user space. Figure 6.3 shows this case.</dd>
      <dt>Virtual machine based</dt><dd>Installs itself underneath the operating system, running the real OS as a guest.</dd>
      <dt>External mode</dt><dd>Lives outside the OS altogether — in BIOS/firmware or a hardware management mode — where OS-based detection cannot reach it.</dd>
    </dl>
  </div>

  <h4>Diagram explained: Figure 6.3, system call table modification by a rootkit</h4>
  <p>The figure has two halves showing the same kernel memory before and after a rootkit named <strong>knark</strong> is installed.</p>
  <p><strong>(a) Normal kernel memory layout.</strong> On the left is a tall box labelled <em>system call table</em>, containing entries drawn in order with gaps between them: <code>fork entry</code>, <code>read entry</code>, then a vertical ellipsis, then <code>execve entry</code>, <code>chdir entry</code>. Each entry holds a pointer, drawn as a dot, and an arrow runs from each dot to a box on the right holding the real kernel function: <code>sys_fork()</code>, <code>sys_read()</code>, <code>sys_execve()</code>, <code>sys_chdir()</code>. Four entries, four arrows, four real functions — the table is just an array of function pointers indexed by system-call number.</p>
  <p><strong>(b) After knark install.</strong> The table looks identical from the outside — same entries, same order. But the arrows from <code>fork entry</code>, <code>read entry</code>, and <code>execve entry</code> now point to a new grey block containing <code>knark_fork()</code>, <code>knark_read()</code>, and <code>knark_execve()</code>. The original <code>sys_fork()</code>, <code>sys_read()</code>, and <code>sys_execve()</code> boxes are still there, untouched, with nothing pointing at them. Only <code>chdir entry</code> still points to its real <code>sys_chdir()</code>.</p>
  <p>What this buys the attacker, and why this figure is in the chapter:</p>
  <ul>
    <li><strong>Nothing was modified that an integrity checker would look at.</strong> The kernel's code is unchanged; the system call table's <em>contents</em> changed, and the table is data.</li>
    <li><strong>Every program on the system is now lying to you, and none of them is compromised.</strong> <code>ls</code>, <code>ps</code>, and a file-integrity scanner all go through <code>read</code> and <code>execve</code> eventually; the rootkit's versions call the real function and then edit the results — removing its own files from directory listings, its own processes from the process list.</li>
    <li><strong>Hooking only some entries is deliberate.</strong> <code>chdir</code> is left alone because there is nothing to hide there; each hook costs performance and adds a chance of a bug that crashes the kernel and reveals the rootkit.</li>
    <li><strong>The detection consequence:</strong> you cannot reliably detect a kernel-mode rootkit using tools that run on the infected kernel. You boot from clean media, or compare the running system against an external view of the same disk. This is precisely why the classification above goes on to <em>virtual machine based</em> and <em>external mode</em> — each level down defeats the detection that works at the level above.</li>
  </ul>
  <div class="box warn"><span class="lbl">Connect it to L04</span>
    <p>In <a href="#l04a-unix">L04a</a> the system call interface was the trust boundary: user mode asks, kernel mode decides. Figure 6.3 is what happens when the attacker gets to the <em>other</em> side of that boundary. The access control is still working perfectly; it is the reporting that has been subverted. "Security mechanisms you can no longer trust the output of" is a different failure from "security mechanisms that were bypassed."</p>
  </div>

  <h3 id="l06a-counter">Countermeasures</h3>

  <p>The ideal solution to the threat of malware is <strong>prevention</strong>, with four main elements:</p>
  <div class="tw"><table>
    <thead><tr><th>Element</th><th>What it means in practice</th></tr></thead>
    <tbody>
      <tr><td><strong>Policy</strong></td><td>Rules about what may be installed, run, and connected.</td></tr>
      <tr><td><strong>Awareness</strong></td><td>Training users, because social engineering targets people, not software.</td></tr>
      <tr><td><strong>Vulnerability mitigation</strong></td><td>Patching and hardening, so exploits have nothing to exploit.</td></tr>
      <tr><td><strong>Threat mitigation</strong></td><td>Controls that limit what malware can do if it does arrive.</td></tr>
    </tbody>
  </table></div>
  <p>If prevention fails, technical mechanisms support three threat mitigation options, in order: <strong>detection, identification, removal</strong>. (Detection: something is wrong. Identification: it is <em>this</em>. Removal: it is gone. You cannot skip a step — removal requires identification, which requires detection.)</p>

  <h4>The four generations of anti-virus software</h4>
  <div class="tw"><table>
    <thead><tr><th>Generation</th><th>Name</th><th>How it works</th><th>Limitation</th></tr></thead>
    <tbody>
      <tr><td><strong>First</strong></td><td>Simple scanners</td><td>Requires a malware <strong>signature</strong> to identify the malware.</td><td>Limited to the detection of <strong>known</strong> malware; defeated by polymorphism.</td></tr>
      <tr><td><strong>Second</strong></td><td>Heuristic scanners</td><td>Uses heuristic rules to search for probable malware instances. Another approach is <strong>integrity checking</strong>.</td><td>False positives; integrity checking can be subverted by a rootkit (see Figure 6.3).</td></tr>
      <tr><td><strong>Third</strong></td><td>Activity traps</td><td>Memory-resident programs that identify malware <strong>by its actions rather than its structure</strong> in an infected program.</td><td>The malware must already be running.</td></tr>
      <tr><td><strong>Fourth</strong></td><td>Full-featured protection</td><td>Packages combining a variety of anti-virus techniques: scanning and activity-trap components plus <strong>access control capability</strong>.</td><td>Complexity and performance cost.</td></tr>
    </tbody>
  </table></div>
  <p>The progression is a single idea applied harder: the first generation asks <em>what does it look like</em>, the third asks <em>what does it do</em>, and the fourth adds <em>what is it allowed to do</em>. Each generation exists because the previous one was defeated by a concealment strategy from the virus classification table.</p>

  <h4>Sandbox analysis</h4>
  <p>Running potentially malicious code in an emulated sandbox or on a virtual machine. This allows the code to execute in a controlled environment where its behavior can be closely monitored without threatening the security of a real system. It enables the detection of complex <strong>encrypted, polymorphic, or metamorphic malware</strong> — because however the body is disguised, it must eventually decrypt and run, and then its behaviour is visible.</p>
  <p>The most difficult design issue with sandbox analysis is <strong>deciding how long to run each interpretation</strong>. Run too briefly and you miss malware that waits; run too long and you cannot process the volume. This is also the obvious attacker response: delay, or detect the sandbox and behave.</p>

  <h4>Host-based behavior-blocking software</h4>
  <p>Integrates with the host operating system and monitors program behavior <strong>in real time</strong> for malicious action, blocking potentially malicious actions before they have a chance to affect the system. Because it blocks in real time, it has an advantage over detection techniques such as fingerprinting or heuristics.</p>
  <p><strong>Limitation:</strong> because malicious code must <em>run</em> on the target machine before all its behaviors can be identified, it can cause harm before it has been detected and blocked. Compare with sandbox analysis, which has the same insight — watch the behaviour — but pays for safety with the timing problem instead.</p>

  <h4>Perimeter scanning approaches</h4>
  <p>Anti-virus software is typically included in e-mail and Web proxy services running on an organization's firewall and IDS, and may also be included in the traffic analysis component of an IDS. It may include intrusion prevention measures, blocking the flow of any suspicious traffic. The approach is <strong>limited to scanning malware</strong>.</p>
  <div class="tw"><table>
    <thead><tr><th>Monitor</th><th>Where it sits</th><th>What it looks for</th></tr></thead>
    <tbody>
      <tr><td><strong>Ingress monitors</strong></td><td>At the border between the enterprise network and the Internet.</td><td>Incoming traffic — one technique is to look for traffic addressed to <strong>unused local IP addresses</strong>, since legitimate traffic has no reason to go there, but a scanning worm will try them.</td></tr>
      <tr><td><strong>Egress monitors</strong></td><td>At the egress point of individual LANs <em>as well as</em> at the enterprise border.</td><td>Outgoing traffic, for signs of <strong>scanning</strong> or other suspicious behavior.</td></tr>
    </tbody>
  </table></div>
  <div class="box ex"><span class="lbl">Worked example: why egress monitoring catches what ingress misses</span>
    <p>Recall local-subnet target discovery: a worm behind the firewall scans its own LAN, so none of that traffic ever crosses the perimeter. An ingress monitor sees nothing. An egress monitor placed <em>at the exit of each LAN</em> sees one machine suddenly talking to hundreds of its neighbours, which is not what a workstation normally does. The slide's phrase "at the egress point of individual LANs as well as at the border" is doing real work: perimeter-only monitoring cannot see an inside-out infection.</p>
  </div>

  </table></div>

  <div class="box proc"><span class="lbl">L06a in one breath</span>
    <p>Malware is any program inserted covertly to compromise <strong>confidentiality, integrity, or availability</strong> (NIST SP 800-83), and it is classified first by <strong>how it propagates</strong> — infect existing content (<strong>virus</strong>), exploit a vulnerability (<strong>worm</strong>, drive-by-download), or trick the user (<strong>social engineering</strong>, Trojan) — and then by its <strong>payload</strong>: corrupt, conscript into a botnet, steal, or hide. A virus needs a host and has three components (<strong>infection mechanism, trigger, payload</strong>) and four phases (<strong>dormant, propagation, triggering, execution</strong>); it is classified by target (boot sector, file, macro, multipartite) and by concealment (encrypted, stealth, <strong>polymorphic</strong> = changes appearance, <strong>metamorphic</strong> = rewrites itself and may change behaviour). A worm is independent, replicates over five routes, and finds targets by <strong>random, hit-list, topological, or local-subnet</strong> scanning; its propagation follows an S-curve with <strong>slow start, fast spread, slow finish</strong>, which is why detection must happen while there is almost no evidence. Morris (1988) started it, Slammer (2003) perfected speed, <strong>Stuxnet (2010) deliberately slowed down</strong> to stay hidden, and WannaCry (2017) combined worm propagation with a ransomware payload. Client-side propagation adds <strong>mobile code, drive-by-downloads, watering holes, malvertising, and clickjacking</strong>. Payloads run from system corruption (Chernobyl, Klez, ransomware made unrecoverable by <strong>public-key crypto</strong>) through <strong>bots</strong> — distinguished from worms purely by the <strong>remote control facility</strong>, which moved from IRC to HTTP to peer-to-peer to kill the single point of failure — to information theft (keyloggers, spyware, phishing and spear-phishing) and stealthing (<strong>backdoors</strong> and <strong>rootkits</strong>, where Figure 6.3 shows a kernel rootkit swinging system-call-table pointers at its own functions so every tool on the box reports a clean system). Countermeasures start with prevention (<strong>policy, awareness, vulnerability mitigation, threat mitigation</strong>) and fall back to <strong>detection, identification, removal</strong> via four generations of anti-virus (signature scanners → heuristics and integrity checking → activity traps → full-featured packages), <strong>sandbox analysis</strong> (whose hard problem is how long to run), <strong>host-based behavior blocking</strong> (whose weakness is that the code must run first), and perimeter <strong>ingress and egress monitors</strong>.</p>
  </div>

<section class="lecture prose" id="l06b">
  <div class="plate"><span class="num" aria-hidden="true">L06b</span><p class="ttl">Network security I: computer networks</p><p class="src">Source: L06b-Ch04-NetworkSecurity-I.pdf — 143 slides, "Computer Networks," dated 28 May 2026. Roughly the first half is a networking refresher; the second half is the attack catalogue built on top of it.</p></div>

  <p>This deck has an unusual shape and it is worth knowing that before you start. Slides 1–83 teach you how the Internet works, bottom to top: link, network, transport, application. Slides 84–143 then go back through the same stack and show that <strong>almost every one of those protocols was designed with no authentication at all</strong>. ARP believes any reply. IP believes any source address. DNS believes any response with the right 16-bit number. TCP believes any packet in the right sequence window. The attacks are not clever exploits of bugs; they are the protocols working exactly as specified.</p>

  <div class="box bg"><span class="lbl">Background: what you already know that this builds on</span>
    <p>From <a href="#l01a-cia">L01a</a>: confidentiality, integrity, availability — this lecture is mostly about the third. From <a href="#l03a-mac">L03a</a>: a MAC or signature gives you origin authentication, which is precisely what every protocol below is missing; DNSSEC is that fix applied to DNS. From <a href="#l05-why">L05</a>: Slammer and Code Red were buffer overflows, and here you see what they did with the network once inside. From <a href="#l06a-worm">L06a</a>: worm scanning, botnets, and the remote control facility — Mirai at the end of this deck is the botnet chapter made concrete.</p>
  </div>

  <h3 id="l06b-switching">Circuit switching, packet switching, and multiplexing</h3>

  <div class="tw"><table>
    <thead><tr><th>Circuit switching</th><th>Packet switching</th></tr></thead>
    <tbody>
      <tr><td>Legacy phone network</td><td>The Internet</td></tr>
      <tr><td>A single route through a sequence of hardware devices is <strong>established when two nodes start communicating</strong></td><td>Data is <strong>split into packets</strong></td></tr>
      <tr><td>Data is sent along that route</td><td>Packets are transported <strong>independently</strong> through the network</td></tr>
      <tr><td>The route is <strong>maintained until communication ends</strong></td><td>Each packet is handled on a <strong>best efforts</strong> basis, and packets may follow different routes</td></tr>
    </tbody>
  </table></div>

  <h4>Diagram explained: the four-slide packet switching animation</h4>
  <p>Slides 3–6 are one picture advanced four times. Host <strong>A</strong> sits on the left with three packets queued beside it, labelled <code>3 2 1</code>. A mesh of routers (B, C, D) lies in the middle and host <strong>F</strong> sits on the right. On each successive slide one packet leaves A and appears in a growing list at F: first <code>1</code>, then <code>1 2</code>, then <code>1 2 3</code>. The packets visibly take different paths through the mesh.</p>
  <p>Two things the animation is designed to make you notice: the link between A and the first router is <strong>free to carry someone else's traffic between packet 1 and packet 2</strong> (that is the efficiency argument), and because the packets travelled different routes, <strong>nothing guarantees they arrive in the order they were sent</strong> (that is the bill you pay, and the reason the transport layer exists).</p>

  <h4>Advantages and disadvantages</h4>
  <div class="tw"><table>
    <thead><tr><th>Advantages</th><th>Disadvantages</th></tr></thead>
    <tbody>
      <tr><td><strong>No wasted bandwidth</strong> — links are not reserved during idle periods. (The slide itself adds "not entirely true.")</td><td><strong>No guaranteed bandwidth</strong>, making it harder to build applications requiring QoS.</td></tr>
      <tr><td><strong>Multiplexing</strong>: frequency, time, and statistical.</td><td><strong>Per-packet overhead</strong>: every packet needs a header with source and destination addresses.</td></tr>
      <tr><td><strong>Service</strong>: more connections of lesser quality; no blocking of users.</td><td><strong>Complex end-to-end control</strong>: packets can be lost, corrupted, or delivered out of order.</td></tr>
      <tr><td><strong>Adaptation</strong>: can adapt to network congestion and failures.</td><td><strong>Delay and congestion</strong>: with no congestion control, arbitrary delays and packet drops.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Why "no wasted bandwidth" is "not entirely true"</span>
    <p>Two reasons the slide is hedging. First, every packet carries a header, so some of the bandwidth you "saved" goes to addressing — a 40-byte TCP/IP header on a 40-byte payload is 50% overhead. Second, when demand exceeds capacity, packets are dropped and <em>retransmitted</em>, so the bandwidth used to carry the dropped copy was wasted outright. Circuit switching wastes capacity predictably during silence; packet switching wastes it unpredictably during congestion.</p>
  </div>

  <h4>Multiplexing</h4>
  <p>The picture shows three pairs of senders and receivers sharing the same physical link, and a switch multiplexing packets from the different senders into one packet stream.</p>
  <div class="tw"><table>
    <thead><tr><th>Method</th><th>How the picture is drawn</th><th>How it divides the link</th></tr></thead>
    <tbody>
      <tr><td><strong>Time Division Multiplexing (TDM)</strong></td><td>A single horizontal time axis carrying the repeating sequence <code>S1 S2 S3 S1 S2 S3 …</code></td><td>Each sender gets the whole link for a fixed, repeating slot. A silent sender's slot is still reserved and goes empty.</td></tr>
      <tr><td><strong>Frequency Division Multiplexing (FDM)</strong></td><td>Frequency on the vertical axis, time on the horizontal; three horizontal bands <code>f1</code>, <code>f2</code>, <code>f3</code> each occupied continuously by <code>S1</code>, <code>S2</code>, <code>S3</code></td><td>Each sender gets its own slice of the spectrum, all the time. Again, an idle sender's slice is wasted.</td></tr>
      <tr><td><strong>Statistical multiplexing</strong></td><td>(Named in the advantages list rather than drawn.)</td><td>Capacity is handed out on demand, packet by packet. This is what packet switching actually does, and it is the only one of the three in which an idle sender costs nothing.</td></tr>
    </tbody>
  </table></div>

  <h3 id="l06b-layers">Layering, protocols, and encapsulation</h3>

  <h4>Internet protocol stack versus OSI</h4>
  <div class="tw"><table>
    <thead><tr><th class="num">#</th><th>Internet (TCP/IP) — 5 layers</th><th>What it does</th><th>Examples</th><th>OSI equivalent</th></tr></thead>
    <tbody>
      <tr><td class="num">5</td><td><strong>Application</strong></td><td>Supporting network applications</td><td>FTP, SMTP, HTTP</td><td>Application (7), Presentation (6), Session (5)</td></tr>
      <tr><td class="num">4</td><td><strong>Transport</strong></td><td>Process-to-process data transfer</td><td>TCP, UDP</td><td>Transport (4)</td></tr>
      <tr><td class="num">3</td><td><strong>Network</strong></td><td>Routing of datagrams from source to destination</td><td>IP, routing protocols</td><td>Network (3)</td></tr>
      <tr><td class="num">2</td><td><strong>Link</strong></td><td>Data transfer between neighbouring network elements</td><td>PPP, Ethernet</td><td>Data Link (2)</td></tr>
      <tr><td class="num">1</td><td><strong>Physical</strong></td><td>Bits "on the wire"</td><td>Copper, fibre, radio</td><td>Physical (1)</td></tr>
    </tbody>
  </table></div>
  <p>The slide asks: <em>"anything missing?"</em> The answer is OSI's <strong>presentation</strong> and <strong>session</strong> layers. The Internet stack does not have them; whatever they would have done (character encoding, compression, encryption, session management) is left to the application. That is why TLS is "an application-layer thing" from IP's point of view, and why each application reinvents its own session handling.</p>

  <div class="box def"><span class="lbl">Definition: what is a protocol?</span>
    <dl>
      <dt>Human analogy</dt><dd>"What's the time?" / "I have a question" / introductions — specific messages sent, and specific actions taken when messages are received or other events occur.</dd>
      <dt>Network protocols</dt><dd>The same, between machines rather than humans. All communication activity in the Internet is governed by protocols.</dd>
      <dt>Formal</dt><dd>Protocols define the <strong>format</strong> and <strong>order</strong> of messages sent and received among network entities, and the <strong>actions taken</strong> on message transmission and receipt.</dd>
    </dl>
  </div>
  <p>Hold on to the three-part definition — format, order, actions — because every attack later in the deck is a message that is correctly <em>formatted</em>, arrives in a plausible <em>order</em>, and therefore gets the standard <em>action</em> applied to it. Nothing in the definition says anything about where a message came from.</p>

  <h4>Diagram explained: encapsulation</h4>
  <p>The figure shows a message travelling down the sending host's stack, across a switch and a router, and back up the receiving host's stack. On the source side, each layer prepends its own header:</p>
  <div class="tw"><table>
    <thead><tr><th>Layer</th><th>What the box contains</th><th>Name of the unit</th></tr></thead>
    <tbody>
      <tr><td>Application</td><td><code>M</code></td><td>message</td></tr>
      <tr><td>Transport</td><td><code>Ht M</code></td><td><strong>segment</strong></td></tr>
      <tr><td>Network</td><td><code>Hn Ht M</code></td><td><strong>datagram</strong></td></tr>
      <tr><td>Link</td><td><code>Hl Hn Ht M</code></td><td><strong>frame</strong></td></tr>
      <tr><td>Physical</td><td>bits</td><td>—</td></tr>
    </tbody>
  </table></div>
  <p>In the middle of the figure, the <strong>switch</strong> only goes up as far as the link layer — it receives <code>Hl Hn Ht M</code>, reads the link header, and sends it on. The <strong>router</strong> goes one layer higher: it strips the frame header, looks at <code>Hn Ht M</code>, makes a routing decision, and builds a <em>new</em> frame for the next hop. At the destination the headers come off in reverse order until the application gets back its original <code>M</code>.</p>
  <p>A second slide draws the same idea with named fields: an <em>application packet</em>, wrapped in a <em>TCP header + TCP data</em>, wrapped in an <em>IP header + IP data</em>, wrapped in a <em>frame header + frame data + frame footer</em> (the frame is the only one with a trailer, because that is where the Ethernet checksum lives).</p>
  <div class="box warn"><span class="lbl">The fact to carry into every later attack</span>
    <p>A router <strong>rewrites the link-layer header at every hop but leaves the IP header alone</strong>. That is why MAC addresses are hop-local and IP addresses are end-to-end — and why a MAC address is meaningless for identifying a remote attacker, while a source IP address is attacker-controlled and therefore meaningless for identifying anybody at all.</p>
  </div>

  <h4>The Internet architecture, hourglass view</h4>
  <p>A diagram shaped like an hourglass: at the top, applications (FTP, HTTP, TFTP, DNS); below them two transports, <strong>TCP</strong> and <strong>UDP</strong>; below those a single narrow waist, <strong>IP</strong>; and below that, many link technologies (Ethernet, FDDI, …). The waist is the point: <em>everything</em> runs over IP, and IP runs over <em>everything</em>. One universal, minimal network layer is what lets a new application work on a network technology that did not exist when the application was written.</p>

  <h3 id="l06b-edge">Nuts and bolts: edge, core, and links</h3>

  <h4>What the Internet is made of</h4>
  <ul>
    <li><strong>Hosts (end systems)</strong>: millions of connected computing devices running network apps — PCs, servers, wireless laptops, cellular handhelds.</li>
    <li><strong>Communication links</strong>: fibre, copper, radio, satellite. Transmission rate = <strong>bandwidth</strong>.</li>
    <li><strong>Routers</strong>: forward packets (chunks of data).</li>
    <li><strong>Protocols</strong> control sending and receiving of messages: TCP, IP, HTTP, Skype, Ethernet.</li>
    <li>The Internet is a <strong>"network of networks"</strong> — loosely hierarchical, with mobile, home, institutional, regional-ISP and global-ISP networks drawn as nested clouds. Public Internet versus private intranet.</li>
    <li>Standards come from <strong>RFCs</strong> (Request For Comments) published by the <strong>IETF</strong> (Internet Engineering Task Force).</li>
  </ul>

  <div class="tw"><table>
    <thead><tr><th>Part of the structure</th><th>What lives there</th></tr></thead>
    <tbody>
      <tr><td><strong>Network edge</strong></td><td>Applications and hosts. End systems run application programs (Web, email) at the "edge of the network."</td></tr>
      <tr><td><strong>Access networks, physical media</strong></td><td>Wired and wireless communication links connecting the edge to the core.</td></tr>
      <tr><td><strong>Network core</strong></td><td>A mesh of interconnected routers; a network of networks.</td></tr>
    </tbody>
  </table></div>
  <p>Two models at the edge: <strong>client/server</strong>, where a client host requests and receives service from an always-on server (Web browser/server, email client/server), and <strong>peer-to-peer</strong>, with minimal or no use of dedicated servers (Skype, BitTorrent).</p>

  <h4>The network core</h4>
  <p>The fundamental question the slide poses is "how is data transferred through the net?" — circuit switching (a dedicated circuit per call, as in the telephone network) or packet switching (data sent through the net in discrete chunks). The packet-switching slide spells out the consequences, and the professor's handwriting strikes a red circle-and-slash through the bottom third of it:</p>
  <div class="tw"><table>
    <thead><tr><th>Packet switching does this</th><th>…and pays this price (resource contention)</th></tr></thead>
    <tbody>
      <tr><td>Each end-to-end data stream is divided into <strong>packets</strong></td><td>Aggregate resource demand can exceed the amount available</td></tr>
      <tr><td>User A's and user B's packets <strong>share</strong> network resources</td><td><strong>Congestion</strong>: packets queue, waiting for link use</td></tr>
      <tr><td>Each packet uses the <strong>full link bandwidth</strong></td><td><strong>Store and forward</strong>: packets move one hop at a time; a node receives the complete packet before forwarding it</td></tr>
      <tr><td>Resources are used <strong>as needed</strong></td><td></td></tr>
    </tbody>
  </table></div>
  <p>The crossed-out box reads "bandwidth division into pieces / dedicated allocation / resource reservation" — i.e. everything circuit switching does, which packet switching explicitly does <strong>not</strong> do. The red slash is the professor's way of saying: those three phrases are the wrong answer on a packet-switching question.</p>

  <h4>Physical links</h4>
  <p>Different links have different transmission ranges because of <strong>signal attenuation</strong>.</p>
  <ul>
    <li><strong>Cables</strong>: CAT-5, coax, fibre. Used to connect computers in the same building. <strong>Leased lines</strong> are dedicated lines rented from telephone companies to connect far-away nodes.</li>
    <li><strong>Wireless links</strong>: transmit electromagnetic signals through space. They are <strong>shared media</strong>, divided by frequency and space. The FCC determines who may use a spectrum in a geographic area — "licensing," allocated by <strong>auction</strong>, which is why it is expensive to become a cellular carrier. <strong>Unlicensed spectrum</strong> covers WiFi, Bluetooth, and infrared.</li>
  </ul>
  <p>Note the security implication the slide does not say out loud: a shared wireless medium means every frame is receivable by anyone in range, with no physical access to a cable required. Everything in the ARP-spoofing section becomes much easier on wireless.</p>

  <h3 id="l06b-link">The link layer: MAC addresses, Ethernet, CSMA/CD</h3>

  <p>Link layer topics: <strong>medium access control, MAC address, Ethernet, error detection, reliable transmission</strong>.</p>
  <div class="box def"><span class="lbl">Definition: link layer terminology</span>
    <dl>
      <dt>Nodes</dt><dd>Hosts and routers.</dd>
      <dt>Links</dt><dd>Communication channels that connect adjacent nodes along a communication path: wired links, wireless links, LANs.</dd>
      <dt>Frame</dt><dd>The layer-2 packet; it encapsulates a datagram.</dd>
      <dt>Responsibility</dt><dd>The data-link layer transfers a datagram from one node to an <strong>adjacent</strong> node over a link. Two physically connected devices: host–router, router–router, or host–host.</dd>
    </dl>
  </div>
  <p>The context figure shows the full stack on the left, the frame <code>Hl Hn Ht M</code> crossing a physical link in the middle via the <em>data link protocol</em>, and the stack on the right receiving it — with the whole link layer implemented on the <strong>adapter card</strong> (the NIC), not in the operating system proper.</p>

  <h4>Multiple-access links and the channel allocation problem</h4>
  <p>Many nodes attached to the same link: Ethernet, token rings, wireless networks (WiFi). The problem is <strong>who gets to send a frame</strong>, because multiple senders lead to a <strong>collision</strong>. The general solution named is <strong>multiple access with collision detect (CSMA/CD)</strong>.</p>
  <p>The attributes of the channel allocation problem, as listed: dynamic or static allocation; a single channel is available; time is continuous versus slotted; <strong>carrier sensing (CS)</strong>; <strong>collision detection (CD)</strong>.</p>
