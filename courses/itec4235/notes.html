  <p>Topologies drawn: a <strong>bus LAN</strong> (coaxial cable with everything tapped onto it), a <strong>ring LAN</strong>, a <strong>star</strong> (a switch in the centre), and <strong>shared RF</strong> (802.11 WiFi).</p>

  <div class="box def"><span class="lbl">Definition: collision domain</span>
    <p>A collision domain is a region in which <strong>any host hears any other host</strong>. It can be a single segment, multiple segments connected by <strong>repeaters</strong>, or multiple segments connected by a <strong>hub</strong>. All these hosts are competing for access to the same link, and as a consequence are said to be in the same collision domain. A <em>switch</em> breaks a collision domain into separate ones; a <em>hub</em> does not, because a hub just repeats every bit to every port.</p>
  </div>

  <div class="box proc"><span class="lbl">Process: the Ethernet transmitter algorithm (CSMA/CD)</span>
    <ol>
      <li>The adaptor receives a datagram from the network layer and creates a frame.</li>
      <li>If the adaptor senses the channel <strong>idle</strong>, it starts frame transmission. If it senses the channel <strong>busy</strong>, it waits until the channel is idle, then transmits.</li>
      <li>If the adaptor transmits the entire frame <strong>without detecting another transmission</strong>, the adaptor is done with the frame.</li>
      <li>If the adaptor <strong>detects another transmission while transmitting</strong>, it aborts and sends a <strong>jam signal</strong> (collision).</li>
    </ol>
    <p>Step 2 is the <em>carrier sense</em>; step 4 is the <em>collision detect</em>. The jam signal exists so that every other station on the segment learns about the collision too, rather than only the two that collided.</p>
  </div>

  <h4>LANs and LAN addresses</h4>
  <p>Bus topology was popular through the mid-90s; today <strong>star topology prevails</strong>, with an active switch in the centre and each "spoke" running a separate Ethernet protocol. Wireless LANs are 802.11.</p>
  <p>Each adapter on a LAN has a unique LAN address (and also has an IP address). The <strong>LAN (or MAC, or physical) address</strong> is used to get a datagram from one interface to another <em>physically connected</em> interface on the same network. It is a <strong>48-bit MAC address</strong> for most LANs, <strong>burned into the adapter ROM</strong>.</p>

  <h4>Ethernet addressing, bit by bit</h4>
  <p>Every host has a unique 48-bit Ethernet address. The slide works one example all the way through:</p>
<pre class="code"><code>00001000 00000000 00101011 11100100 10110001 00000010
   08    :   00   :   2b   :   e4   :   b1   :   02</code></pre>
  <p>Each group of eight bits becomes two hex digits — <code>00001000</code> is <code>0000</code>=0 and <code>1000</code>=8, hence <code>08</code>. (This is the binary-to-hex conversion from <a href="#l00-numbers">L00</a>, used for real.) Three rules follow:</p>
  <ul>
    <li>To ensure uniqueness, every Ethernet manufacturer has its own <strong>24-bit prefix</strong> — the first three bytes. The manufacturer assigns the remaining 24 bits.</li>
    <li>Regardless of addresses, <strong>each frame is received by EVERY adaptor</strong> on the segment; the adaptor normally discards frames not addressed to it. (Which is exactly what <em>promiscuous mode</em> turns off — see Wireshark below.)</li>
    <li>An address of all 1s (<code>FF:FF:FF:FF:FF:FF</code>) is the <strong>broadcast</strong> address. An address whose <strong>first bit is 1</strong> is a <strong>multicast</strong> address.</li>
  </ul>
  <p>The slide also poses a question worth being able to answer: <strong>why separate MAC and IP addresses?</strong> Because they answer different questions. The MAC address is burned in and belongs to the hardware, so it cannot change when you move the machine — which makes it useless for routing, since routing needs addresses that reflect <em>where you are</em>. The IP address is assigned by the network you are attached to and so encodes location; that is what makes hierarchical routing possible. One identifies the box, the other identifies the place.</p>

  <h3 id="l06b-arp">ARP: the Address Resolution Protocol</h3>

  <p>The question ARP answers: <strong>how do I determine the MAC address of B, knowing B's IP address?</strong> Each IP node (host or router) on a LAN has an <strong>ARP table</strong> holding IP/MAC mappings for some LAN nodes, each entry of the form <code>&lt;IP address; MAC address; TTL&gt;</code>, where the <strong>TTL</strong> is the time after which the mapping will be forgotten — typically <strong>20 minutes</strong>.</p>

  <div class="box proc"><span class="lbl">Process: ARP on the same LAN</span>
    <ol>
      <li>A wants to send a datagram to B, and B's MAC address is not in A's ARP table.</li>
      <li>A <strong>broadcasts</strong> an ARP query packet containing B's IP address, with destination MAC address <code>FF-FF-FF-FF-FF-FF</code>. <strong>All machines on the LAN receive the query.</strong></li>
      <li>B receives the ARP packet and replies to A with its own MAC address. That reply frame is sent to A's MAC address — <strong>unicast</strong>.</li>
      <li>A <strong>caches</strong> the IP-to-MAC pair in its ARP table until the information times out. This is <strong>soft state</strong>: information that goes away unless refreshed.</li>
    </ol>
    <p>ARP is <strong>"plug-and-play"</strong>: nodes create their ARP tables without intervention from a network administrator. That convenience is the vulnerability — see <a href="#l06b-attacks">ARP spoofing</a>.</p>
  </div>

  <h4>Diagram explained: routing to another LAN (the walkthrough the slide calls "really important")</h4>
  <p>The figure shows two IP networks joined by one router R. On the left network <code>111.111.111.x</code>: host <strong>A</strong> at <code>111.111.111.111</code> with MAC <code>74-29-9C-E8-FF-55</code>, another host at <code>111.111.111.112</code> with MAC <code>CC-49-DE-D0-AB-7D</code>, and R's left interface at <code>111.111.111.110</code> with MAC <code>E6-E9-00-17-BB-4B</code>. On the right network <code>222.222.222.x</code>: R's right interface at <code>222.222.222.220</code> with MAC <code>1A-23-F9-CD-06-9B</code>, host <strong>B</strong> at <code>222.222.222.222</code> with MAC <code>49-BD-D2-C7-56-2A</code>, and another host at <code>222.222.222.221</code> with MAC <code>88-B2-2F-54-1A-0F</code>. R has <strong>two ARP tables, one for each IP network</strong>. The slide carries a hand-added note: <em>"This is a really important example — make sure you understand!"</em></p>
  <p>Assume A knows B's IP address. The seven steps:</p>
  <ol>
    <li>A creates an IP datagram with source A, destination B.</li>
    <li>A uses <strong>ARP to get R's MAC address</strong> for <code>111.111.111.110</code>.</li>
    <li>A creates a link-layer frame with <strong>R's MAC address as the destination</strong>; the frame contains the A-to-B IP datagram.</li>
    <li>A's NIC sends the frame; R's NIC receives it.</li>
    <li>R removes the IP datagram from the Ethernet frame and sees that it is destined for B.</li>
    <li>R uses <strong>ARP to get B's MAC address</strong>.</li>
    <li>R creates a frame containing the A-to-B IP datagram and sends it to B.</li>
  </ol>
  <div class="box warn"><span class="lbl">The one sentence this whole example exists to teach</span>
    <p>While the Ethernet frame leaving A has the <strong>router's MAC address</strong> as its destination, the IP datagram inside it <em>still</em> has <strong>B's IP address</strong> as its destination. Two destination addresses in the same packet, meaning different things: the MAC address says "next hop," the IP address says "final destination." Every hop rewrites the first and preserves the second. If you can say that sentence, you can answer almost any question about how a packet crosses a network.</p>
  </div>
  <div class="box ex"><span class="lbl">Worked example: count the ARP exchanges</span>
    <p>How many ARP request/reply pairs does the walkthrough need, on a cold start? <strong>Two.</strong> A→R resolves <code>111.111.111.110</code> on the left LAN; R→B resolves <code>222.222.222.222</code> on the right LAN. A never ARPs for B, and <em>cannot</em> — the ARP broadcast would never leave the left LAN, because a router does not forward broadcasts. That is also why A must be configured with a <strong>default gateway</strong>: it has to know which local IP address to ARP for when the destination is off-net.</p>
  </div>

  <h3 id="l06b-ip">The network layer: IP</h3>

  <p>The network layer transports a segment from the sending to the receiving host. On the sending side it <strong>encapsulates segments into datagrams</strong>; on the receiving side it delivers segments to the transport layer. Network-layer protocols are in <strong>every host and every router</strong>, and a router <strong>examines header fields in all IP datagrams passing through it</strong>.</p>

  <p>The slide labelled "Network service model" is marked <strong>CRUCIAL question!</strong> — what service model should the "channel" transporting packets from sender to receiver provide? Guaranteed bandwidth? Preservation of inter-packet timing (no jitter)? Loss-free delivery? In-order delivery? Congestion feedback to the sender? The most important abstraction provided by the network layer is the choice between a <strong>virtual circuit</strong> and a <strong>datagram</strong> service. The Internet chose datagram.</p>

  <div class="box def"><span class="lbl">Definition: the IP service model</span>
    <p>The delivery service of IP is <strong>minimal</strong>. IP provides an <strong>unreliable, connectionless, best-effort</strong> service, also called <em>datagram service</em>.</p>
    <dl>
      <dt>Unreliable</dt><dd>IP does not make an attempt to recover lost packets.</dd>
      <dt>Connectionless</dt><dd>Each packet ("datagram") is handled independently. IP is not aware that packets between hosts may be sent in a logical sequence.</dd>
      <dt>Best effort</dt><dd>IP makes no guarantees on the service — no throughput guarantee, no delay guarantee.</dd>
      <dt>Consequences</dt><dd>Higher-layer protocols have to deal with losses and duplicate packets, and packets may be delivered out of order.</dd>
    </dl>
  </div>
  <p>The deck states the same thing again later as a yes/no list:</p>
  <div class="tw"><table>
    <thead><tr><th>IP does</th><th>IP does not</th></tr></thead>
    <tbody>
      <tr><td><strong>Routing</strong>: if a host knows the destination host's IP, route the packet to it.</td><td rowspan="3">Everything else. <strong>No ordering. No retransmission. No (real) error checking. No acknowledgement of receipt. No "connections." No security. Just packets.</strong></td></tr>
      <tr><td><strong>Fragmentation and reassembly</strong>: split data into packets and reassemble.</td></tr>
      <tr><td><strong>Error reporting</strong>: maybe, if you're lucky, tell the source it dropped your packet.</td></tr>
    </tbody>
  </table></div>

  <h4>IP addressing</h4>
  <p>An <strong>IP address is a 32-bit identifier for a host or router <em>interface</em></strong>. An interface is the connection between a host or router and a physical link; routers typically have multiple interfaces, and a host may have multiple interfaces. <strong>IP addresses are associated with an interface, not with a host or router.</strong></p>
  <p>The worked conversion on the slide:</p>
<pre class="code"><code>223.1.1.1 = 11011111 00000001 00000001 00000001
              223        1        1        1</code></pre>
  <p>An IP address has a <strong>network part</strong> (high-order bits) and a <strong>host part</strong> (low-order bits). The slide's question — <em>what is a network, from the IP address perspective?</em> — is answered: device interfaces with the <strong>same network part</strong> of their IP address, which <strong>can physically reach each other without an intervening router</strong>. The example picture has a network of three IP networks (<code>223.1.1.x</code>, <code>223.1.2.x</code>, <code>223.1.3.x</code>), where for addresses starting with 223 the first 24 bits are the network address.</p>

  <h4>Forwarding versus routing</h4>
  <div class="tw"><table>
    <thead><tr><th></th><th>Forwarding</th><th>Routing</th></tr></thead>
    <tbody>
      <tr><td>What it is</td><td>Move packets from a router's input to the appropriate router output</td><td>Determine the route taken by packets from source to destination</td></tr>
      <tr><td>Plane</td><td><strong>Data plane</strong></td><td><strong>Control plane</strong></td></tr>
      <tr><td>Who does it</td><td>An individual router, using a forwarding table</td><td>Routers talking amongst themselves; each router then creates its forwarding table</td></tr>
      <tr><td>Road-trip analogy</td><td>Getting through a single interchange</td><td>Planning the trip from source to destination</td></tr>
      <tr><td>Timescale</td><td>Per packet, nanoseconds</td><td>Per topology change, seconds to minutes</td></tr>
    </tbody>
  </table></div>
  <p>The interplay figure shows a routing algorithm feeding a <strong>local forwarding table</strong> that maps header values to output links (<code>0100→3</code>, <code>0101→2</code>, <code>0111→2</code>, <code>1001→1</code>); an arriving packet with header value <code>0111</code> is sent out link 2.</p>

  <h4>Diagram explained: the IPv4 header</h4>
  <p>The header "instructs routers and hosts what to do with a packet," and <strong>all values are filled in by the sending host</strong>. The figure is a grid, 32 bits wide, with byte offsets down the left side and bit numbers 0–31 along the bottom; a brace on the right marks the first <strong>20 bytes</strong> as the fixed header, and <strong>IHL (Internet Header Length)</strong> as the measure of the full length including options.</p>
  <div class="tw"><table>
    <thead><tr><th class="num">Byte offset</th><th>Fields in that 32-bit word</th></tr></thead>
    <tbody>
      <tr><td class="num">0</td><td><strong>Version</strong> · <strong>IHL</strong> (header length) · <strong>Type of Service (TOS)</strong> · <strong>Total Length</strong></td></tr>
      <tr><td class="num">4</td><td><strong>Identification</strong> · <strong>IP Flags</strong> (x, D, M) · <strong>Fragment Offset</strong></td></tr>
      <tr><td class="num">8</td><td><strong>Time To Live (TTL)</strong> · <strong>Protocol</strong> · <strong>Header Checksum</strong></td></tr>
      <tr><td class="num">12</td><td><strong>Source Address</strong> (32 bits)</td></tr>
      <tr><td class="num">16</td><td><strong>Destination Address</strong> (32 bits)</td></tr>
      <tr><td class="num">20</td><td><strong>IP Option</strong> — variable length, optional, not common</td></tr>
    </tbody>
  </table></div>
  <p>The deck then singles out three fields on their own slides, and the wording matters:</p>
  <ul>
    <li><strong>Destination Address</strong>: "Sender sets destination address. Routers try to forward packet to that address." <em>Try</em> — best effort, again.</li>
    <li><strong>Source Address</strong>: "Sender fills in. <strong>Routers do not verify.</strong>"</li>
    <li><strong>Checksum</strong>: a 16-bit <strong>simple header checksum</strong>, filled in by the sender. Note what it covers — the <em>header</em>, not the data — and that it is a checksum, not a MAC, so anyone who edits the header can simply recompute it.</li>
  </ul>

  <div class="box warn"><span class="lbl">IP security: the consequence of "routers do not verify"</span>
    <p>The client is <strong>trusted to embed the correct source IP</strong>, and it is easy to override using lower-level network sockets. <strong>Libnet</strong> is named as a library for formatting raw packets with arbitrary IP headers. Anyone who owns their own machine can send packets with an arbitrary source IP, which enables:</p>
    <ul>
      <li><strong>Denial of service attacks</strong> — the victim cannot filter by source, and cannot trace back to the attacker.</li>
      <li><strong>Anonymous infection</strong> (if one packet is enough) — you never need to see a reply, so you never need a real return address.</li>
    </ul>
    <p>Spoofing only works for attacks that do not need the reply. That single limitation explains a surprising amount of the rest of the deck: it is why TCP connection spoofing is hard (you need the server's sequence number, which comes back to the <em>real</em> owner of the address), why amplification attacks use UDP (no handshake to complete), and why GET floods cannot use random source IPs (they must complete a real TCP connection).</p>
  </div>

  <h3 id="l06b-transport">The transport layer: UDP and TCP</h3>

  <p>The transport layer is responsible for the realization of <strong>host-to-host packet delivery</strong>. Its services:</p>
  <ul>
    <li>Guaranteed message delivery (end-to-end)</li>
    <li>Ordered delivery</li>
    <li>Rejection of duplicate messages</li>
    <li>Messages of arbitrary length</li>
    <li>Congestion control to handle network overloading</li>
    <li>Running of multiple application processes at the same host</li>
  </ul>
  <p>Why we need it at all is the mirror image of that list — the limitations of the network layer: it can <strong>drop</strong> messages (routers may incur buffer overflow), <strong>reorder</strong> messages, <strong>deliver duplicate copies</strong> of the same message, and <strong>limit messages to a finite size</strong> (IP's size is limited). The network layer is intended to hide the different technologies at link level and provide a transparent end-to-end routing service; the transport layer provides an end-to-end transport service to the application layer.</p>

  <div class="tw"><table>
    <thead><tr><th>Internet transport protocol</th><th>What it gives you</th></tr></thead>
    <tbody>
      <tr><td><strong>UDP</strong> — datagram messaging service</td><td>"Best-effort" IP end-to-end service, with ports added.</td></tr>
      <tr><td><strong>TCP</strong> — reliable, in-order delivery</td><td>Connection set-up; discarding of corrupted packets; retransmission of lost packets; <strong>flow control</strong>; <strong>congestion control</strong>.</td></tr>
      <tr><td><strong>RPC</strong> — remote procedure call</td><td>Request/reply service.</td></tr>
    </tbody>
  </table></div>
  <p>The slide asks parenthetically, "congestion control — what is the difference?" <strong>Flow control protects the receiver</strong> from being sent data faster than it can take it; <strong>congestion control protects the network</strong> from being sent data faster than it can carry it. Same symptom, different victim, different feedback signal: flow control is told the receiver's window explicitly; congestion control has to infer the network's state from loss and delay.</p>

  <h4>UDP</h4>
  <p>UDP is a <strong>process-to-process</strong> communication service. Processes are identified by incoming <strong>ports</strong> (sockets in Windows). There are <strong>16 bits for each field, yielding 64K different identifiers</strong>, and the <code>&lt;IP, port&gt;</code> combination allows <strong>de-multiplexing</strong> at the receiving host. The "UDP message queue" figure shows the obvious consequence: one queue per bound port, and the kernel drops the datagram if nobody is listening.</p>
  <p>Applications that use UDP, and why:</p>
  <div class="tw"><table>
    <thead><tr><th>Application</th><th>Reasons given</th></tr></thead>
    <tbody>
      <tr><td><strong>Simple query protocols</strong> like DNS</td><td>Delay for connection establishment is too large; queries are small and UDP adds only a small header overhead; it is easier to have the application retransmit if needed; a query usually fits within a single UDP packet, so there is no out-of-order danger.</td></tr>
      <tr><td><strong>Multimedia applications</strong></td><td>Retransmitting lost or corrupted packets is not worthwhile — by the time the packet is retransmitted it is too late. Telephone calls, video conferencing, gaming. Certain loss is acceptable since voice and picture are still discernible.</td></tr>
    </tbody>
  </table></div>

  <h4>TCP</h4>
  <div class="tw"><table>
    <thead><tr><th>Property</th><th>What it means</th></tr></thead>
    <tbody>
      <tr><td><strong>Connection oriented</strong></td><td>Explicit set-up and tear-down of the TCP session.</td></tr>
      <tr><td><strong>Stream-of-bytes service</strong></td><td>Sends and receives a stream of bytes, <strong>not messages</strong>. (So "one send = one receive" is not guaranteed; message boundaries are the application's problem.)</td></tr>
      <tr><td><strong>Reliable, in-order delivery</strong></td><td>Checksums to detect corrupted data; acknowledgments and retransmissions for reliable delivery; <strong>sequence numbers</strong> to detect losses and data reordering.</td></tr>
      <tr><td><strong>Flow control</strong></td><td>Prevents overflow of the receiver's buffer.</td></tr>
      <tr><td><strong>Congestion control</strong></td><td>Adapts to network congestion "for the greater good."</td></tr>
    </tbody>
  </table></div>

  <p>The deck asks a good question: <strong>does TCP duplicate lower-layer services?</strong> Both use a sliding-window algorithm with ACKs, NACKs, retransmissions, timeouts, and ordering. Four differences:</p>
  <ul>
    <li>TCP runs over a <strong>route</strong> rather than a single physical link, so it must <strong>establish a connection and negotiate parameters</strong> such as the sliding window size.</li>
    <li>It must adapt to <strong>heterogeneous conditions</strong>: RTT varies with the connected host and time of day and is unpredictable; flow control must work between computers with very different resources.</li>
    <li>It reorders and retransmits packets <strong>end-to-end</strong> — packets being in order on one physical link does not guarantee end-to-end ordering.</li>
    <li>It provides <strong>congestion control</strong>, with no immediate feedback from the link and no knowledge of conditions along the way, so control is based on inferred feedback.</li>
  </ul>

  <h4>Recovering from lost packets</h4>
  <p>Why are packets lost? Limited storage, so packets are discarded in congestion; outages, which eventually reroute around the failure (hopefully in seconds); and drops at the end system, e.g. on the NIC.</p>
  <p><strong>ARQ (automatic request repeat)</strong>: the sender puts <strong>sequence numbers</strong> on packets; the receiver positively or negatively acknowledges correct receipt; the sender starts a logical timer for each packet and retransmits on timeout. (The slide asks "why" sequence numbers — because without them the receiver cannot tell a retransmission from new data, and the sender cannot tell which packet an ACK refers to.)</p>

  <h4>Diagram explained: rdt3.0 in action</h4>
  <p>Two time-sequence charts side by side, each with a <em>sender</em> timeline on the left and a <em>receiver</em> timeline on the right, blue arrows going right for data and green arrows going left for ACKs. The professor has circled the lost messages in red.</p>
  <p><strong>(c) lost ACK.</strong> Sender sends <code>pkt0</code>; receiver receives it and sends <code>ACK0</code>; sender gets <code>ACK0</code> and sends <code>pkt1</code>; receiver receives <code>pkt1</code> and sends <code>ACK1</code> — but that ACK is <strong>lost</strong> (marked with a red X). The sender times out and <strong>resends pkt1</strong>. The receiver gets it, <strong>detects the duplicate</strong>, discards the data, and re-sends <code>ACK1</code>. Now the sender gets <code>ACK1</code> and moves on to <code>pkt0</code>.</p>
  <p><strong>(d) premature timeout.</strong> Same start, but this time nothing is lost — the sender's timer simply fires <strong>too early</strong>, before <code>ACK1</code> arrives. The sender resends <code>pkt1</code>; the receiver detects the duplicate and ACKs again; both the original and the duplicate ACK arrive, and the extra ACK is ignored. Nothing breaks, but the channel carried two useless packets.</p>
  <p>The lesson both halves teach: <strong>the sender cannot distinguish "my packet was lost" from "the ACK was lost" from "I was impatient."</strong> All three look identical — silence. Because the only response available is to retransmit, the protocol must make duplicates harmless, which is exactly what the alternating sequence numbers are for. This is also why premature timeouts make congestion worse rather than better, which motivates the congestion control that follows.</p>

  <h4>Forward error control</h4>
  <p>The alternative to retransmission: <strong>add redundancy to recover from losses</strong>. The figure shows an original file of <em>n</em> blocks going through <strong>encoding</strong> into a potentially infinite number of blocks, passing through a <strong>lossy channel</strong>, and <strong>decoding</strong> once the receiver eventually has <em>n</em>(1+ε) blocks — slightly more than the original count, but it does not matter <em>which</em> ones. No feedback channel is needed and no retransmission ever occurs, which is why this approach suits one-way and real-time links where an ARQ round trip would be too slow.</p>

  <h4>Congestion control</h4>
  <div class="tw"><table>
    <thead><tr><th>End-to-end congestion control</th><th>Network-assisted congestion control</th></tr></thead>
    <tbody>
      <tr><td><strong>No explicit feedback from the network.</strong> Congestion is inferred from end-system observed loss and delay. <strong>This is the approach taken by TCP.</strong></td><td><strong>Routers provide feedback to end systems</strong>: either a single bit indicating congestion (SNA, DECbit, TCP/IP <strong>ECN</strong>, ATM), or an explicit rate the sender should send at.</td></tr>
    </tbody>
  </table></div>
  <p>TCP congestion control works by <strong>"probing" for usable bandwidth</strong>: ideally transmit as fast as possible — make <code>Congwin</code> as large as possible — without loss; increase <code>Congwin</code> until loss occurs (congestion); on loss, decrease <code>Congwin</code> and begin probing upward again. There are two phases, <strong>slow start</strong> and <strong>congestion avoidance</strong>, and the important variables are <strong><code>Congwin</code></strong> (the congestion window) and <strong><code>threshold</code></strong>, which defines the boundary between the slow-start phase and the congestion-control phase.</p>
  <div class="box warn"><span class="lbl">Why this matters for security</span>
    <p>TCP's congestion control is <strong>voluntary</strong>. It lives in the sender's own stack, and nothing in the network enforces it. A well-behaved host backs off when it sees loss; an attacker's host simply does not. Every flooding attack later in this deck is, at bottom, a host declining to run the algorithm everyone else runs.</p>
  </div>

  <h4>Diagram explained: the TCP three-way handshake</h4>
  <p>Client on the left, server on the right, three diagonal arrows between them. The state labels are the part to memorise:</p>
  <div class="tw"><table>
    <thead><tr><th class="num">#</th><th>Message</th><th>Client state after</th><th>Server state after</th></tr></thead>
    <tbody>
      <tr><td class="num">1</td><td>Client → Server: <strong>SYN</strong>, seq = 100</td><td><code>SYN-SENT</code></td><td><code>SYN-RECEIVED</code></td></tr>
      <tr><td class="num">2</td><td>Server → Client: <strong>SYN-ACK</strong>, seq = 200, ack = 101</td><td><code>ESTABLISHED</code></td><td><code>SYN-RECEIVED</code></td></tr>
      <tr><td class="num">3</td><td>Client → Server: <strong>ACK</strong>, seq = 101, ack = 201</td><td><code>ESTABLISHED</code></td><td><code>ESTABLISHED</code></td></tr>
    </tbody>
  </table></div>
  <p>Check the arithmetic, because exams ask for it: the server's <code>ack = 101</code> is the client's <code>seq + 1</code>, because <strong>the SYN flag consumes one sequence number</strong> even though it carries no data. Likewise the client's final <code>ack = 201</code> is the server's <code>seq + 1</code>. After step 2 the client is <code>ESTABLISHED</code> but the server is not — it is still waiting for the third packet, holding state for a connection that may never complete. <strong>That asymmetry is the entire SYN flood attack</strong>, so note it now.</p>

  <h4>Ending a connection, and resets</h4>
  <p>To close: send a packet with the <strong>FIN</strong> flag set; it must have the ACK flag with a valid sequence number. The peer receiving the FIN acknowledges receipt with an ACK. The <strong>FIN "consumes" one byte of sequence number</strong> (just as SYN does). Eventually the other side sends its own packet with FIN set, which terminates the session.</p>
  <p>TCP is designed to handle the possibility of <strong>spurious TCP packets</strong>, e.g. from previous connections. Packets that are invalid given the current state of the session generate a <strong>reset</strong>: if a connection exists it is torn down, and a packet with the <strong>RST</strong> flag is sent in response. If a host receives a TCP packet with the RST flag, it tears down the connection.</p>

  <h4>TCP connection spoofing and the reset attack</h4>
  <p>Can we impersonate another host when <em>initiating</em> a connection? An off-path attacker can send the initial SYN to the server, but <strong>cannot complete the three-way handshake without seeing the server's sequence number</strong> — the SYN-ACK goes to the real owner of the spoofed address. If the initial sequence number is chosen uniformly at random, the attacker has a <strong>1 in 2<sup>32</sup></strong> chance of guessing right.</p>
  <p>Can we <em>reset</em> an existing TCP connection? That is easier, for three reasons the slide lists:</p>
  <ul>
    <li>You need to know the <strong>port numbers (16 bits)</strong>. The initiator's port is usually chosen at random by the OS, but the responder's is often a <strong>well-known port</strong> for the service — so in practice only 16 bits, not 32, are unknown.</li>
    <li>There is <strong>leeway in the sequence numbers B will accept</strong>: anything within the window size, which is 32–64K on most modern operating systems.</li>
    <li>The resulting probability of guessing right is <strong>1 in 2<sup>16+32</sup>/W</strong>, where <em>W</em> is the window size.</li>
  </ul>
  <div class="box ex"><span class="lbl">Worked example: how much does the window help the attacker?</span>
    <p>Spoofing a new connection costs you 2<sup>32</sup> guesses on the sequence number alone. Resetting an existing one costs 2<sup>16+32</sup>/W. With W = 64K = 2<sup>16</sup>, that is 2<sup>48</sup>/2<sup>16</sup> = <strong>2<sup>32</sup></strong> — the same order, but now you may also know the server port (knock 2<sup>16</sup> off) and may be able to guess the client port range, which brings a blind reset into the realm of a few million packets rather than billions. The security lesson is general: <strong>any protocol that accepts a <em>range</em> of valid values instead of one exact value has multiplied the attacker's chances by the size of that range.</strong> A large receive window is a performance optimisation that quietly costs security.</p>
  </div>

  <h3 id="l06b-http">The application layer: what actually happens on an HTTP GET</h3>

  <p>This is the deck's synthesis slide — a user types a URL and the browser downloads a page. Four slides trace every protocol involved, and it is the best single revision exercise in the lecture because it touches every layer at once.</p>

  <div class="box proc"><span class="lbl">Process: stage 1 — name resolution</span>
    <ol>
      <li>Via <strong>DHCP</strong>, the source already has the IP address of a DNS server (suppose it is on the same network segment) and the address of a default router.</li>
      <li>The host creates a <strong>DNS query</strong>, passes it to <strong>UDP</strong>, creates a UDP segment containing the query, and passes it to <strong>IP</strong>.</li>
      <li>It looks in its routing table and recognises that the DNS server is <strong>on the same network</strong>.</li>
      <li>It uses <strong>ARP</strong> to determine the MAC address of the DNS server.</li>
      <li><strong>Ethernet</strong> sends the frame to the DNS server over the physically connected wire.</li>
      <li>On the DNS machine: Ethernet → IP → UDP. UDP looks at the destination port number, sees it is DNS, and passes the query to the DNS application.</li>
      <li>The DNS server sends a <strong>UDP reply</strong> back to the originating machine with the address.</li>
    </ol>
  </div>

  <div class="box proc"><span class="lbl">Process: stage 2 — opening the TCP connection, hop by hop</span>
    <ol>
      <li>The browser now has the IP address of the destination server and needs a TCP connection, so it sends a <strong>SYN</strong> packet.</li>
      <li>The SYN goes down to the network layer with the server's IP address. The destination is <strong>off my network</strong>, so the packet must go through a router.</li>
      <li>The host looks in its routing table, sees the destination is off-network, and must send to the <strong>default gateway</strong>.</li>
      <li>It uses <strong>ARP to get the MAC address of the default gateway</strong>, and creates an Ethernet frame with the gateway's MAC address, containing an IP packet, containing a TCP segment, containing the SYN.</li>
      <li><strong>Important:</strong> the Ethernet frame's destination is the <em>router's</em> MAC address, while the IP datagram inside still has the destination address of the <em>remote web server</em>. (The same sentence as the ARP walkthrough, now in context.)</li>
      <li>The router receives the frame (addressed to it), looks at the IP datagram, sees it is not addressed to itself, and knows it must forward it to the next hop.</li>
      <li>The router checks its <strong>routing tables</strong> — populated by intra-domain and possibly inter-domain routing protocols such as <strong>OSPF, RIP, IS-IS, and BGP</strong> (BGP being the inter-domain one) — and gets the IP address of the next-hop router.</li>
      <li>The router puts the IP packet in an Ethernet frame addressed to the next-hop router, whose MAC address it determines by <strong>ARP</strong>, and sends it.</li>
      <li>(Network-management aside: arriving packets at an interface cause the <strong>SNMP MIB</strong> variable counting arriving IP datagrams to be incremented.)</li>
      <li>Forwarding continues until the datagram arrives at the destination — the slide's example is <code>gaia.cs.umass.edu</code> at <code>128.119.30.30</code>.</li>
      <li>Up to IP, demultiplexing from Ethernet to IP using the Ethernet <strong>TYPE</strong> field to identify IP as the upper-layer protocol; from IP to TCP using the IP datagram's <strong>protocol</strong> field. The SYN finally arrives at the destination's TCP.</li>
    </ol>
  </div>

  <div class="box proc"><span class="lbl">Process: stage 3 — the request</span>
    <ol>
      <li>The server returns a <strong>SYNACK</strong> to the initial sender; the handshake completes and the client is ready to send data.</li>
      <li>The <strong>HTTP GET</strong> message is sent to the server in a TCP segment, in an IP datagram, in an Ethernet frame, along the hops to the destination.</li>
      <li>The GET arrives, the HTTP server formulates a <strong>REPLY</strong>, and sends it.</li>
    </ol>
  </div>
  <p>Count the protocols that had to work for one page load: <strong>DHCP, DNS, UDP, ARP, Ethernet, IP, TCP, HTTP</strong>, plus the routing protocols (OSPF/RIP/IS-IS/BGP) that built the tables, plus SNMP counting along the way. Of those, in their original form, <strong>only one has any authentication at all</strong>. That is the setup for the rest of the lecture.</p>

  <h3 id="l06b-dns">DNS</h3>

  <p>Application-layer protocols (and people) usually refer to an Internet host by host name, e.g. <code>google.com</code>. <strong>DNS is a delegatable, hierarchical name space.</strong> A DNS server has a set of records it <strong>authoritatively</strong> knows about.</p>

  <h4>Reading a DNS answer</h4>
  <p>The slide shows real <code>dig</code> output, which is worth being able to read line by line:</p>
<pre class="code"><code>$ dig bob.ucsd.edu
;; Got answer:
;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY, status: NOERROR, id: 30439
;; flags: qr aa rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 3, ADDITIONAL: 6
;; QUESTION SECTION:
;bob.ucsd.edu.        IN  A
;; ANSWER SECTION:
bob.ucsd.edu.   3600  IN  A    132.239.80.176
;; AUTHORITY SECTION:
ucsd.edu.       3600  IN  NS   ns0.ucsd.edu.
ucsd.edu.       3600  IN  NS   ns1.ucsd.edu.
ucsd.edu.       3600  IN  NS   ns2.ucsd.edu.</code></pre>
  <ul>
    <li><code>id: 30439</code> is the <strong>query ID</strong> — remember this number, it is the only thing authenticating the response.</li>
    <li><code>aa</code> in the flags means <strong>authoritative answer</strong>.</li>
    <li>The counts <code>QUERY: 1, ANSWER: 1, AUTHORITY: 3, ADDITIONAL: 6</code> name the <strong>four sections</strong> of a DNS packet. The six additional records are not shown — and the <em>additional</em> section is where cache poisoning lives.</li>
    <li><code>3600</code> is the <strong>TTL</strong> in seconds, i.e. one hour. <code>A</code> maps a name to an IPv4 address; <code>NS</code> names an authoritative server for a zone.</li>
  </ul>
  <p>There are <strong>13 main DNS root servers</strong>, each named with a letter from <strong>A to M</strong>.</p>

  <h4>Caching</h4>
  <ul>
    <li>DNS responses are cached, giving a quick response for repeated translations. <strong>NS records for domains are also cached.</strong></li>
    <li><strong>Negative queries are cached too</strong>, saving time for nonexistent sites, e.g. misspellings.</li>
    <li>Cached data periodically times out; the <strong>lifetime (TTL) is controlled by the owner of the data</strong>, and the TTL is passed with every record.</li>
  </ul>

  <h4>Diagram explained: the DNS packet header</h4>
  <p>A 12-byte header grid in the same style as the IPv4 header:</p>
  <div class="tw"><table>
    <thead><tr><th class="num">Byte offset</th><th>Fields</th></tr></thead>
    <tbody>
      <tr><td class="num">0</td><td><strong>Identification</strong> (16 bits) · <strong>QR</strong> · <strong>Opcode</strong> · DNS Flags (AA, TC, RD, RA, Z, AD, CD) · <strong>RCode</strong></td></tr>
      <tr><td class="num">4</td><td><strong>Total Questions</strong> · <strong>Total Answers</strong></td></tr>
      <tr><td class="num">8</td><td><strong>Total Authority Resource Records</strong> · <strong>Total Additional Resource Records</strong></td></tr>
    </tbody>
  </table></div>
  <p>Summary of the three facts the slide wants: DNS requests are sent over <strong>UDP</strong>; there are <strong>four sections</strong> (questions, answers, authority, additional records); and the <strong>query ID is a 16-bit random value</strong> that links the response to the query.</p>

  <h3 id="l06b-attacks">Network attacks at the link and routing layers</h3>

  <h4>ARP spoofing / ARP poisoning</h4>
  <p>Any host on the LAN can send ARP requests <em>and replies</em>, so <strong>any host can claim to be another host on the local network</strong>. This is ARP spoofing, and it allows any host X to force IP traffic between any two other hosts A and B to flow through X — a <strong>man-in-the-middle</strong>:</p>
  <ol>
    <li>Claim that N<sub>A</sub> (A's IP) is at the attacker's MAC address M<sub>X</sub>.</li>
    <li>Claim that N<sub>B</sub> (B's IP) is at the attacker's MAC address M<sub>X</sub>.</li>
    <li>Re-send traffic addressed to N<sub>A</sub> on to M<sub>A</sub>, and vice versa — so neither side notices.</li>
  </ol>
  <p>Why it works, stated four different ways across two slides:</p>
  <ul>
    <li>The ARP table is updated whenever an ARP <em>response</em> is received, and <strong>requests are not tracked</strong>.</li>
    <li>According to the standard, almost all ARP implementations are <strong>stateless</strong>: a cache updates every time it receives an ARP reply, <strong>even if it never sent a request</strong>. A reply nobody asked for is called a <strong>gratuitous ARP</strong>, and it is a legitimate feature.</li>
    <li>ARP announcements are <strong>not authenticated</strong>, and machines simply trust each other.</li>
    <li><strong>Using static entries solves the problem, but it is almost impossible to manage</strong> at any realistic scale.</li>
  </ul>

  <h4>Diagram explained: the ARP cache, before and after</h4>
  <p><strong>Before.</strong> Two machines, <code>192.168.1.1</code> with MAC <code>00:11:22:33:44:01</code> and <code>192.168.1.105</code> with MAC <code>00:11:22:33:44:02</code>, exchange data directly. Each holds the other's correct mapping in its ARP cache.</p>
  <p><strong>After.</strong> A third machine appears, <code>192.168.1.106</code> with MAC <code>00:11:22:33:44:03</code>. It sends two gratuitous replies: to the first machine, "<code>192.168.1.105</code> is at <code>00:11:22:33:44:03</code>"; to the second, "<code>192.168.1.1</code> is at <code>00:11:22:33:44:03</code>." Both caches now map the other party's IP to <strong>the attacker's MAC</strong>, and both data arrows bend through the attacker. Note that <strong>the IP addresses in the caches are still correct</strong> — nothing an IP-level tool checks has changed.</p>

  <h4>The classroom demo</h4>
  <p>Three demo slides build the attack on a LAN <code>192.168.1.x</code> with Alice (client, <code>.10</code>, MAC <code>00:0A:E4:2E:9B:11</code>), Bob (server, <code>.100</code>, MAC <code>00:0A:E4:3B:47:7E</code>), and the attacker (<code>.1</code>, MAC <code>00:22:64:34:60:88</code>), all plugged into a switch.</p>
  <ol>
    <li><strong>Demo 1, part 1 — the setup.</strong> Alice uses <strong>telnet</strong> to log in to Bob and run <code>adduser</code>. The slide points out the expectation: "in a switched network, packets are sent only to the destination computer; one would think that another computer plugged into the switch cannot sniff traffic."</li>
    <li><strong>Demo 1, part 2 — ARP spoofing.</strong> The attacker sends gratuitous ARP replies in both directions, mapping Bob's IP to the attacker's MAC and Alice's IP to the attacker's MAC, using a tool invoked as <code>arpspoof &lt;victim ip&gt; &lt;gateway ip&gt;</code> in each direction. The attacker now <strong>acts as a router</strong> between them.</li>
    <li><strong>Demo 1, part 3 — the password.</strong> With traffic flowing through the attacker, a sniffing tool run as <code>dsniff -n</code> extracts the credentials used to log in to the telnet service.</li>
  </ol>
  <p>The conclusion the demo is built to deliver: <strong>a switch is not a security boundary.</strong> It separates collision domains, not trust domains. The only reason the password was readable is the protocol in the middle — which brings us to telnet.</p>

  <h4>Telnet and Wireshark</h4>
  <p><strong>Telnet (RFC 854)</strong> is a protocol providing general, bi-directional, <strong>not encrypted</strong> communication. It is a generic TCP client: it allows a computer to connect to another, provides remote login, sends whatever you type, prints whatever comes back, and is useful for testing ASCII-based TCP servers. Everything including the password travels in cleartext — which is why SSH replaced it, and why telnet survives only as a debugging tool.</p>
  <p><strong>Wireshark</strong> is a packet sniffer and protocol analyzer that captures and analyzes frames and supports plugins. It usually requires administrator privileges. Setting the network interface in <strong>promiscuous mode</strong> captures traffic across the entire LAN segment, not just frames addressed to the machine — which is exactly the "each frame is received by EVERY adaptor" fact from the Ethernet addressing slide, with the normal discarding turned off. It is freely available from <code>wireshark.org</code>. The UI figure labels five regions: the <strong>menu</strong>, the <strong>main toolbar</strong>, the <strong>filter toolbar</strong>, the <strong>packet list pane</strong>, the <strong>packet details pane</strong>, the <strong>packet bytes pane</strong>, and the <strong>status bar</strong>.</p>

  <h4>Demo 2: network denial of service using ARP</h4>
  <p>The second demo is availability rather than confidentiality. Two hosts <code>192.168.1.101</code> and <code>192.168.1.102</code> are on a switch wired with a <strong>cable loop</strong>. A single ping provokes an ARP request, which is a broadcast; the loop causes that broadcast to be forwarded around the loop forever and multiplied at every pass — a <strong>broadcast storm</strong> that saturates the segment. The slide ends with the exam question: <em>"How can it be avoided?"</em> The standard answer is the <strong>Spanning Tree Protocol</strong>, which detects loops and disables redundant links so the active topology is always loop-free; broadcast storm control and rate-limiting on switch ports are the complementary mitigations.</p>

  <h4>BGP and route hijacking</h4>
  <p><strong>BGP (Border Gateway Protocol)</strong> is the protocol that allows routers to exchange information about their routing tables. Each router <strong>announces what it can route</strong> to all of its neighbours, and every router maintains a global table of routes. There is no authentication of those announcements — the same design flaw as ARP, at Internet scale.</p>
  <div class="box ex"><span class="lbl">Worked example: Pakistan hijacks YouTube, 24 February 2008</span>
    <ul>
      <li>Pakistan Telecom (AS 17557) began advertising a small part of YouTube's (AS 36561) assigned network — the prefix <code>208.65.153.0/24</code>.</li>
      <li>PCCW (AS 3491), Pakistan Telecom's upstream provider, <strong>did not validate</strong> the advertisement and propagated it onward.</li>
      <li>YouTube went offline, worldwide.</li>
    </ul>
    <p>Why a <em>more specific</em> prefix wins: BGP prefers the longest matching prefix, so a <code>/24</code> announcement beats the legitimate shorter announcement covering the same space, everywhere the hijacked route reaches. And note the shape of the incident — the originator made a local decision (blocking YouTube domestically), and the <strong>absence of validation one hop upstream</strong> turned it into a global outage. Trust in BGP is transitive by default, which is exactly what "every router maintains a global table of routes" implies.</p>
  </div>

  <h3 id="l06b-dnsattacks">DNS attacks</h3>

  <p>Why DNS is worth attacking: users and hosts <strong>trust the host-address mapping provided by DNS</strong>, and that mapping is used as the basis for many security policies — <strong>the browser same-origin policy</strong> and the <strong>URL address bar</strong> are the two named. Interception of requests, or compromise of DNS servers, can result in incorrect or malicious responses. If you can decide what <code>bank.com</code> means, you do not need to break any cryptography.</p>

  <h4>DNS cache poisoning</h4>
  <p>DNS query results include an <strong>Additional Records</strong> section, which exists to provide records for the anticipated next resolution step. Early servers <strong>accepted and cached all additional records</strong> provided in a query response — so a malicious server, asked an innocent question, could attach an answer to a question nobody asked.</p>
  <div class="box ex"><span class="lbl">Worked example: the "early attack strategy" figure, step by step</span>
    <p>The illustration follows six numbered steps across a drawing of a targeted name server:</p>
    <ol>
      <li>A user loads a web page containing an image hosted at <code>www.BadGuysAreUs.com</code>.</li>
      <li>The user's computer asks the <strong>targeted name server</strong> to translate <code>www.BadGuysAreUs.com</code> into an IP address.</li>
      <li>The targeted name server has not cached the address, so the query is routed through a <strong>root name server</strong>, a <strong>.com name server</strong>, and finally the <strong>BadGuysAreUs.com name server</strong>.</li>
      <li>The BadGuysAreUs name server responds with an IP address <strong>and adds a false IP address for a completely different website</strong>, <code>www.paypal.com</code>.</li>
      <li>The targeted name server <strong>stores the false IP address for paypal.com</strong> in its cache.</li>
      <li>When <em>other</em> people using this name server attempt to go to <code>www.paypal.com</code>, they are directed to a website that looks like PayPal's but works only to harvest their usernames and passwords.</li>
    </ol>
    <p>Three things to notice. The attacker never touched PayPal or the victims. The attack is triggered by the <em>victim's own</em> lookup of an attacker-controlled name, so the attacker only has to get one person to load an image. And the poison then serves <strong>everyone</strong> using that resolver until the TTL expires — and the TTL is chosen by the attacker.</p>
  </div>

  <h4>Glue records and bailiwick checking</h4>
  <p>The obvious fix — stop using the additional section, only accept answers from authoritative servers — does not work, because of <strong>glue records</strong>: non-authoritative records that are <em>necessary</em> to contact the next hop in the resolution chain. (If <code>ns0.ucsd.edu</code> is the nameserver for <code>ucsd.edu</code>, you need its address to ask it anything, and only it can tell you — a loop that glue records break.) They are necessary given the current design of DNS.</p>
  <p>The real fix is <strong>bailiwick checking</strong>: only accept additional records that are for a domain <strong>in the original question</strong>. Under bailiwick checking, the attack above fails immediately — a server answering about <code>BadGuysAreUs.com</code> has no business supplying a record for <code>paypal.com</code>, and the record is dropped.</p>

  <h4>DNS spoofing</h4>
  <p>Scenario: a DNS client issues a query to a server. The attacker would like to <strong>inject a fake reply</strong>, and crucially the attacker <strong>does not see the query or the real response</strong> — this is an off-path (blind) attack. So: how does the client authenticate the response? Only two checks:</p>
  <ul>
    <li>The <strong>UDP port numbers must match</strong>. The destination port is usually 53 by convention, and historically the client's source port was fixed or predictable.</li>
    <li>The <strong>16-bit query ID must match</strong>.</li>
  </ul>
  <p>That is the whole of DNS authentication: 16 bits, plus a port number the attacker could often guess. <strong>1 in 65,536</strong> — and the attacker can send thousands of guesses in the time the real answer takes to arrive. Whoever's answer arrives first and matches, wins; the real answer that comes later is discarded as a duplicate.</p>

  <h4>Diagram explained: the Kaminsky attack</h4>
  <p>The figure shows four boxes: <strong>user browser</strong> → <strong>local DNS resolver</strong> → <strong>.com</strong>, with an <strong>attacker</strong> box at the lower right. Across the top: "victim machine visits attacker's web site, downloads JavaScript." The flow:</p>
  <ol>
    <li>The browser queries the local DNS resolver for <code>a.bank.com</code>.</li>
    <li>The resolver forwards the query toward <code>.com</code> with query ID <code>x₁</code>, and waits for the response.</li>
    <li>The attacker floods the resolver with <strong>256 responses</strong> carrying random query IDs <code>y₁, y₂, …</code>. Each forged response contains (highlighted in yellow on the slide) two records: <code>NS bank.com = ns.bank.com</code> and <code>A ns.bank.com = attackerIP</code>.</li>
    <li>The attacker <strong>wins if there exists some j such that x₁ = y<sub>j</sub></strong>. The response is then cached, and <strong>the attacker owns bank.com</strong>.</li>
  </ol>
  <p>The next slide is titled simply <strong>"Try Again!"</strong> and shows the identical diagram. That repetition <em>is</em> the attack. Kaminsky's insight was not a better guess — it was removing the penalty for guessing wrong:</p>
  <ul>
    <li>The JavaScript downloaded from the attacker's site makes the browser query <code>a.bank.com</code>, then <code>b.bank.com</code>, then <code>c.bank.com</code>, and so on. Each is a <strong>fresh name that is not in the cache</strong>, so each forces a <em>new</em> outbound query with a <em>new</em> query ID to guess.</li>
    <li>Classic cache poisoning had to wait for the TTL of a real record to expire before it could try again — potentially hours. Kaminsky's version can retry <strong>as fast as the browser can issue queries</strong>.</li>
    <li>And the prize is not one hostname. Because the forged answer is an <strong>NS record for the whole <code>bank.com</code> zone</strong> plus the glue A record pointing at the attacker, one success hands over <em>every</em> name under <code>bank.com</code>, not just the random one that was queried.</li>
  </ul>
  <p>A 1-in-65,536 chance that you may retry a thousand times per second is not a 1-in-65,536 chance. That is the lesson.</p>

  <h4>Defenses</h4>
  <p>The slide poses the problem directly: we want to <strong>increase the query ID space, but how?</strong> We do not want to change the packet format — that would mean upgrading every DNS implementation in the world at once. The answer:</p>
  <ul>
    <li><strong>Randomize the source port</strong>, adding <strong>11 bits of entropy</strong>. The attacker must now guess both the 16-bit query ID and the source port.</li>
    <li>Result: the <strong>attack now takes several hours</strong> instead of seconds. (Note the honest framing — the attack is made expensive, not impossible. This is source port randomization, deployed in 2008, and it is still the main thing standing between you and a Kaminsky attack.)</li>
  </ul>

  <h4>Diagram explained: DNS rebinding</h4>
  <p>The figure shows a user at a browser on the left, a tall red <strong>firewall</strong> bar down the middle, and on the right <code>ns.evil.com</code> (the attacker's DNS server, marked with a star) and <code>www.evil.com</code>'s web server at <code>171.64.7.115</code>. Below the user, inside the firewall, sits a <strong>corporate web server</strong> at <code>192.168.0.100</code>. Across the top: <code>&lt;iframe src="http://www.evil.com"&gt;</code>. A note on the right says <strong>"DNS-SEC cannot stop this attack."</strong></p>
  <p>The sequence of arrows:</p>
  <ol>
    <li>The browser asks "<code>www.evil.com</code>?" and <code>ns.evil.com</code> answers <strong><code>171.64.7.115</code> with TTL = 0</strong>.</li>
    <li>The browser loads the page from the real evil.com web server. The page's origin is now <code>www.evil.com</code>.</li>
    <li>Because the TTL was zero, the <em>next</em> lookup is not cached. The attacker's DNS server now answers the same name with <strong><code>192.168.0.100</code></strong> — an address inside the corporate network.</li>
    <li>The script in the page makes another request to <code>www.evil.com</code>, which now resolves to the internal server. The browser considers this <strong>"same origin"</strong> — the caption reads <em>"Read permitted: it's the same origin"</em> — so the script may read the response.</li>
  </ol>
  <p>The attacker has used the victim's browser as a proxy to read a server the attacker cannot reach through the firewall. And the note is right that <strong>DNSSEC does not help</strong>: every answer the attacker's server gave was authentic, correctly signed, and for a domain it genuinely owns. The flaw is that the same-origin policy keys on the <em>name</em> while the connection goes to an <em>address</em>, and the attacker controls the binding between them.</p>
  <div class="tw"><table>
    <thead><tr><th>Rebinding defense</th><th>Problem with it</th></tr></thead>
    <tbody>
      <tr><td><strong>Browser:</strong> refuse to switch IPs mid-session (DNS pinning)</td><td>Interacts poorly with proxies, VPNs, CDNs, etc. <strong>Not consistently implemented in any browser.</strong></td></tr>
      <tr><td><strong>Server:</strong> check the <code>Host</code> header for unrecognized domains</td><td>Requires every internal server to do it. (It works because the browser sends <code>Host: www.evil.com</code> to the internal server, which is not a name that server answers to.)</td></tr>
      <tr><td><strong>Server:</strong> authenticate users with something beyond IP address</td><td>Requires giving up "it's on the internal network, so it's trusted" — which is the real root cause.</td></tr>
    </tbody>
  </table></div>

  <h4>DNSSEC</h4>
  <p>DNSSEC <strong>adds authentication and integrity to DNS responses</strong>. Authoritative DNS servers <strong>sign</strong> DNS responses using a cryptographic key, and clients can verify that a response is legitimate by checking the signature through a <strong>PKI similar to HTTPS</strong>. This is precisely the origin-authentication primitive from <a href="#l03a-mac">L03a</a> applied to the one protocol in this lecture that most needed it.</p>
  <p>The slide's verdict is blunt: <strong>"Most people don't use DNSSEC and never will. Use TLS instead."</strong> The reasoning behind that opinion is worth knowing for a discussion question — DNSSEC authenticates the <em>name-to-address mapping</em> but provides no confidentiality and does not protect the connection, whereas TLS authenticates the <em>server you actually ended up talking to</em> and encrypts the session. If TLS is doing its job, being sent to the wrong IP address fails safely: the certificate will not match.</p>

  <h3 id="l06b-dos">Denial of service</h3>

  <div class="box def"><span class="lbl">Definition: denial of service</span>
    <dl>
      <dt>Goal</dt><dd>Take a large site offline by overwhelming it with network traffic, such that it cannot process real requests.</dd>
      <dt>How</dt><dd>Find a mechanism where the <strong>attacker doesn't have to spend a lot of effort</strong>, but the requests are <strong>difficult or expensive for the victim to process</strong>. The whole subject is the search for <em>asymmetry</em>.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Type</th><th>Description</th></tr></thead>
    <tbody>
      <tr><td><strong>DoS Bug</strong></td><td>A design flaw that allows <strong>one machine</strong> to disrupt a service. Generally a <strong>protocol asymmetry</strong> — e.g. easy to send a request, difficult to create a response, or the request requires server state.</td></tr>
      <tr><td><strong>DoS Flood</strong></td><td>Control a large number of requests from a <strong>botnet</strong> of machines you control.</td></tr>
    </tbody>
  </table></div>
  <p>Denial of service is possible at <strong>every layer</strong>:</p>
  <div class="tw"><table>
    <thead><tr><th>Layer</th><th>The attack</th></tr></thead>
    <tbody>
      <tr><td><strong>Link layer</strong></td><td>Send too much traffic for switches and routers to handle. (Demo 2's broadcast storm is exactly this.)</td></tr>
      <tr><td><strong>TCP/UDP</strong></td><td>Require servers to maintain a large number of concurrent connections or state.</td></tr>
      <tr><td><strong>Application layer</strong></td><td>Require servers to perform expensive queries or cryptographic operations.</td></tr>
    </tbody>
  </table></div>

  <h4>Diagram explained: SYN floods</h4>
  <p>The figure has a client timeline <strong>C</strong> on the left and a server timeline <strong>S</strong> on the right. Five arrows labelled <code>SYN_C1</code> through <code>SYN_C5</code> run from left to right, and beside the server's timeline a blue bar grows taller with each arrival — the backlog queue filling up. The bullets on the right:</p>
  <ul>
    <li><strong>Single machine.</strong> No botnet required; this is a DoS bug, not a DoS flood.</li>
    <li>SYN packets with <strong>random source IP addresses</strong>.</li>
    <li><strong>Fills up the backlog queue</strong> on the server.</li>
    <li><strong>No further connections possible.</strong></li>
  </ul>
  <p>Trace it against the three-way handshake above. The server receives a SYN, allocates state, enters <code>SYN-RECEIVED</code>, and sends a SYN-ACK — to a random address that never asked and will never answer. The entry sits in the backlog until it times out. The attacker spent one small packet and no state; the server spent an entry in a finite queue and a timeout's worth of memory. That is the asymmetry.</p>

  <div class="box def"><span class="lbl">Definition: the core problem, and the real solution</span>
    <p><strong>Problem:</strong> the server <strong>commits resources (memory) before confirming the identity of the client</strong> — before the client responds.</p>
    <p><strong>Bad solutions:</strong> increase the backlog queue size (the attacker just sends more); decrease the timeout (now legitimate clients on slow links fail).</p>
    <p><strong>Real solution:</strong> <strong>avoid state until the three-way handshake completes.</strong></p>
  </div>

  <div class="box proc"><span class="lbl">Process: SYN cookies</span>
    <p>Instead of storing SN<sub>C</sub> and SN<sub>S</sub>, send a cookie back to the client. The server computes:</p>
<pre class="code"><code>L   = MAC_key( SAddr, SPort, DAddr, DPort, SN_C, T )
      key: picked at random during boot
T   = 5-bit counter incremented every 64 secs
SN_s = ( T || mss || L )</code></pre>
    <p>An honest client sends back an ACK with <code>AN = SN_s</code> and <code>SN = SN_C + 1</code>. The server <strong>allocates space for the socket only if SN<sub>s</sub> is valid</strong> — that is, only if it recomputes the MAC and gets a match.</p>
    <p><strong>The server does not save state</strong> (at the cost of losing TCP options).</p>
  </div>
  <p>Why this works, in one line: the server's own initial sequence number <em>is</em> the state, encoded and authenticated with a key only the server knows. The client hands it back in the third packet, and the server reconstructs everything it needed to remember. <code>T</code>, a 5-bit counter ticking every 64 seconds, is there to expire old cookies — it wraps every 32 × 64 s ≈ 34 minutes, so a cookie cannot be replayed indefinitely. This is a <strong>MAC from <a href="#l03a-mac">L03a</a> used as a memory-saving device</strong>, which is a genuinely elegant idea and a very likely exam question.</p>

  <h4>Diagram explained: amplification attacks</h4>
  <p>The figure shows an <strong>attacker</strong> at the top left controlling a <strong>bot</strong>, which sends small <em>spoofed requests</em> ("DNS ANY example.com") to three <strong>open DNS resolvers</strong> in the middle, each marked with a warning triangle. From each resolver a thick arrow of <em>large response</em> data — columns of <code>MX mx1.example.com</code> and <code>A 1.2.3.x</code> records — converges on the <strong>target victim</strong> at the right. A wide arrow across the bottom reads <strong>60–70× increase in size</strong>.</p>
  <p>The two ingredients, both of which are required:</p>
  <ul>
    <li><strong>Source IP spoofing</strong>, so the response goes to the victim rather than back to the bot. This is "routers do not verify" collecting its debt.</li>
    <li><strong>A protocol where a small request produces a large response.</strong> The slide is explicit: this <strong>only works if you can receive a big response by sending a single packet</strong> — otherwise spoofing does not help you, because you would need to see replies to continue.</li>
  </ul>
  <div class="tw"><table>
    <thead><tr><th>Common UDP amplifier</th><th>The trick</th></tr></thead>
    <tbody>
      <tr><td><strong>DNS</strong></td><td>An <code>ANY</code> query returns <em>all</em> records the server has about a domain.</td></tr>
      <tr><td><strong>NTP</strong></td><td><code>MONLIST</code> returns a list of the last <strong>600 clients</strong> who asked for the time recently.</td></tr>
      <tr><td><strong>Memcache</strong></td><td>Retrieve a large record: the server responds by firing back <strong>as much as 50,000 times</strong> the data it received.</td></tr>
    </tbody>
  </table></div>
  <p>Note that all three are <strong>UDP</strong>. TCP cannot be used this way: the handshake would have to complete, and the SYN-ACK goes to the spoofed address, so the attacker could never finish a connection.</p>
  <div class="box ex"><span class="lbl">Worked example: the recorded attacks, and why the numbers climb</span>
    <ul>
      <li><strong>2013, 300 Gbps via DNS:</strong> 31,000 misconfigured open resolvers, each contributing about 10 Mbps. (31,000 × 10 Mbps = 310 Gbps — the arithmetic checks.) The source was <strong>3 networks that allowed IP spoofing</strong>. Three networks failing to filter outbound spoofed traffic was enough.</li>
      <li><strong>2014, 400 Gbps via NTP:</strong> 4,500 NTP servers. Note the efficiency gain — a seventh as many amplifiers produced a larger attack, because MONLIST amplifies harder than an ANY query.</li>
      <li><strong>2018, memcache:</strong> a 1.7 Tbps peak on the Netscout/Arbor chart of peak attack sizes, which rises from 24 Gbps in 2007 through 100, 309 and 650 Gbps to that spike. A 50,000× amplification factor means a single attacker with a modest uplink can generate a terabit.</li>
    </ul>
    <p>The defensive conclusion is uncomfortable and worth stating: <strong>the victim can do nothing</strong>. The fix is <strong>BCP 38 ingress filtering</strong> at the networks that permit spoofed source addresses to leave, plus closing open resolvers — both of which have to be done by parties who suffer no harm from the attack. This is the clearest example in the course of a security problem whose costs and whose remedies sit with different people.</p>
  </div>

  <h4>Mirai and the IoT botnet</h4>
  <p>The October 2016 attacks on <strong>OVH, Dyn, and Krebs</strong> are the deck's case study. The Akamai quote on the Krebs slide reads, in part, that the attacks of that final week were significantly larger than the majority Akamai normally sees, and that the attack of <strong>20 September was the largest ever mitigated by Akamai</strong>, while the <strong>22 September attack peaked at 555 Gbps</strong> and would have held the record at any other time. Verisign's estimate was <strong>up to 100,000 malicious endpoints</strong>, with unverified reports in the <strong>1.2 Tbps</strong> range.</p>
  <p>The botnet figure shows a <strong>bot master</strong> at the left and about <strong>200K IoT devices</strong> in the middle, firing <strong>GRE, HTTP, and TLS</strong> traffic at the targets. The slide's one-line analysis is the important part: <strong>"Not amplification. Flood with SYN, ACK, UDP, and GRE packets."</strong> With 200,000 real hosts you do not need an amplifier — you have the volume already, and the traffic comes from real addresses, which makes it harder to filter rather than easier.</p>
  <div class="box proc"><span class="lbl">Process: how Mirai operates (the seven-step diagram)</span>
    <p>The architecture figure has four horizontal bands — <strong>Attacker</strong>, <strong>Infrastructure</strong>, <strong>Devices</strong>, <strong>DDoS Target</strong> — with seven numbered arrows:</p>
    <ol>
      <li><strong>Scan.</strong> Infected bots scan for new victims. (Mirai's method is <strong>password guessing</strong> against telnet on IoT devices using a built-in list of default credentials — note that it is the <a href="#l06b-attacks">unencrypted telnet</a> from earlier in this same deck, left enabled on cameras and routers.)</li>
      <li><strong>Report.</strong> The bot reports a successful credential guess to a <strong>report server</strong>.</li>
      <li><strong>Dispatch.</strong> The report server dispatches the victim's details to a <strong>loader</strong>.</li>
      <li><strong>Load.</strong> The loader logs in and installs the Mirai binary on the victim, which becomes a bot.</li>
      <li><strong>Send command.</strong> Later, the bot master issues commands to the <strong>command &amp; control</strong> server to pause scanning and start an attack.</li>
      <li><strong>Relay.</strong> C&amp;C relays the attack command to the bots. The command carries: <strong>Action</strong> (e.g. START, STOP), <strong>Target IP(s)</strong>, <strong>Attack Type</strong> (e.g. GRE, DNS, TCP), and <strong>Attack Duration</strong>.</li>
      <li><strong>Attack.</strong> The bots flood the DDoS target.</li>
    </ol>
    <p>Separating the scanning bot from the loader is the design detail worth noticing: the device that finds the victim is not the device that infects it, so the infection traffic all comes from a small number of well-connected machines rather than from thousands of slow cameras. Compare this with the <strong>remote control facility</strong> from <a href="#l06a-payload">L06a</a> — this is that abstract definition drawn as a system diagram.</p>
  </div>
  <p>The population slide reports roughly <strong>600K devices compromised</strong> over the life of the botnet (against ~200K participating in a given attack). <strong>Booter services</strong> — DDoS-for-hire — are named as the commercial layer on top.</p>
  <p><strong>Google Project Shield</strong> is given as the defence: DDoS attacks are often used to <strong>censor content</strong>, as in Mirai's case where Brian Krebs's blog was under attack, and Project Shield uses Google's bandwidth to shield vulnerable websites such as news outlets, blogs, and human rights organisations. The framing matters — availability attacks are a free-speech problem, and the practical defence is to borrow capacity from someone who has more of it than the attacker.</p>

  <h4>Moving up the stack: GET floods</h4>
  <p>Command the bot army to <strong>complete a real TCP connection</strong>, <strong>complete the TLS handshake</strong>, and then <strong>GET a large image or other content</strong>. This <strong>bypasses flood protections</strong> — every request is indistinguishable from a real user's — but there is a cost: <strong>the attacker can no longer use random source IPs</strong>, because a real connection requires receiving the replies. Consequently the <strong>victim site can block or rate-limit the bots</strong> once it identifies them.</p>
  <p>That trade-off is the same one from the IP spoofing slide, now visible in both directions: spoofing buys anonymity but only works for attacks that need no reply; completing the handshake buys legitimacy but costs anonymity. An attacker cannot have both.</p>
  <p>The <strong>GitHub attack</strong> is given as an example of an application-layer flood: <strong>1.35 Tbps against GitHub</strong>, caused by <strong>JavaScript injected into HTTP web requests</strong> — ordinary users' browsers turned into attackers by modifying unencrypted pages in transit. The Chinese government was widely suspected to be behind the attack. (The lesson hiding in that sentence: the injection was possible because the pages were served over plain HTTP. HTTPS everywhere is a DDoS defence as well as a privacy measure.)</p>

  <h4>Client puzzles</h4>
  <p>The idea: force every client to do a <strong>moderate amount of work for every connection</strong> they make.</p>
  <div class="box proc"><span class="lbl">Process: the client puzzle protocol</span>
    <ol>
      <li>The server sends a challenge <code>C</code>.</li>
      <li>The client must find an <code>X</code> such that <code>LSB_n( SHA-1( C || X ) ) = 0ⁿ</code> — i.e. the last <em>n</em> bits of the hash of the challenge concatenated with the answer are all zero.</li>
    </ol>
    <p><strong>Assumption:</strong> the puzzle takes 2<sup>n</sup> work for the client to compute (about 0.3 s on a 1 GHz core for the parameters assumed), while <strong>the solution is trivial for the server to check</strong> — a single SHA-1.</p>
  </div>
  <p>This is the DoS asymmetry <em>reversed</em>: now the <em>requester</em> does the expensive work and the server does the cheap check. It is the same construction as proof-of-work in Bitcoin, and it relies on the one-wayness of the hash function from <a href="#l03a-hash">L03a</a> — there is no shortcut to finding <code>X</code> but checking it is one hash.</p>
  <div class="tw"><table>
    <thead><tr><th>Benefits</th><th>Limitations</th></tr></thead>
    <tbody>
      <tr><td>Can <strong>change <em>n</em> based on the amount of attack traffic</strong> — the defence scales itself with the attack.</td><td>Requires changes to <strong>both protocols, clients, and servers</strong>.</td></tr>
      <tr><td></td><td><strong>Hurts low-power legitimate clients during an attack</strong>, e.g. phones. (A botnet of 200,000 devices can absorb the cost far better than one phone on battery.)</td></tr>
    </tbody>
  </table></div>
  <p>The slide's own verdict: client puzzles are <strong>not frequently used in the real world</strong>.</p>

  <div class="box proc"><span class="lbl">L06b in one breath</span>
    <p>The Internet is <strong>packet switched</strong>: data is split into packets routed independently and best-effort, which buys <strong>statistical multiplexing</strong> and adaptation at the price of <strong>no guaranteed bandwidth, per-packet overhead, reordering, loss, and congestion</strong>. It is organised as a <strong>five-layer stack</strong> (application, transport, network, link, physical — OSI's presentation and session layers are missing), each layer <strong>encapsulating</strong> the one above, so a message becomes a <strong>segment</strong>, then a <strong>datagram</strong>, then a <strong>frame</strong>; a switch works to layer 2, a router to layer 3, and <strong>every hop rewrites the MAC address while preserving the IP address</strong>. At the link layer, <strong>48-bit MAC addresses</strong> are burned into the adaptor, every adaptor hears every frame on the segment (which is what <strong>promiscuous mode</strong> exploits), and <strong>CSMA/CD</strong> resolves collisions by sense-transmit-abort-jam. <strong>ARP</strong> maps IP to MAC by broadcast query and unicast reply, caches the answer as <strong>soft state</strong>, and authenticates nothing — so a <strong>gratuitous ARP reply</strong> poisons any cache and puts the attacker in the middle, as the <code>arpspoof</code>/<code>dsniff</code> demo shows against cleartext <strong>telnet</strong>. <strong>IP</strong> is <strong>unreliable, connectionless, best-effort</strong>, splits a 32-bit address into network and host parts, separates <strong>forwarding</strong> (data plane) from <strong>routing</strong> (control plane), and lets the sender fill in a source address that <strong>routers do not verify</strong> — the single fact behind spoofing, DoS, and amplification. <strong>BGP</strong> has the same credulity at Internet scale (Pakistan/YouTube, 2008). <strong>UDP</strong> adds only ports; <strong>TCP</strong> adds connections, byte streams, sequence numbers, <strong>flow control</strong> (protects the receiver) and <strong>congestion control</strong> (protects the network, inferred from loss, Congwin and threshold, slow start and congestion avoidance). The <strong>three-way handshake</strong> leaves the server holding state after SYN-ACK, which is the <strong>SYN flood</strong>; the fix is to hold no state until the handshake completes, via <strong>SYN cookies</strong> that put the state inside a MAC-protected sequence number. <strong>DNS</strong> authenticates a response with a matching port and a <strong>16-bit query ID</strong>, which gives <strong>cache poisoning</strong> through the <strong>additional records</strong> section (blocked by <strong>bailiwick checking</strong>) and the <strong>Kaminsky attack</strong>, which wins by querying endless fresh subdomains so a wrong guess costs nothing — mitigated by <strong>source port randomization</strong>, while <strong>DNS rebinding</strong> defeats the same-origin policy with a zero-TTL name and is <em>not</em> stopped by <strong>DNSSEC</strong>. Finally, <strong>denial of service</strong> is the search for asymmetry at every layer: <strong>DoS bugs</strong> (one machine, a protocol flaw) versus <strong>DoS floods</strong> (a botnet), <strong>amplification</strong> via open DNS, NTP <code>MONLIST</code> and memcache, the <strong>Mirai</strong> IoT botnet that needed no amplification at all, <strong>GET floods</strong> that trade anonymity for legitimacy, and <strong>client puzzles</strong> that reverse the asymmetry but hurt phones and are rarely deployed.</p>
  </div>
