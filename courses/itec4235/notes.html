  <h4>Where the primes and exponents come from</h4>
  <p><strong>Step 1: generate primes.</strong> Get a pseudo-random number and test it. The slide's test uses Fermat: for prime n and any a, a<sup>n</sup> mod n = a. If a<sup>n</sup> mod n ≠ a, n is definitely composite. <strong>But</strong> if a<sup>n</sup> mod n = a, n could still be composite (a pseudoprime), so the test is probabilistic. (The slide's second bullet, "for composite n and any a, a<sup>n</sup> mod n ≠ a," is not always true; that is exactly the "BUT." Example: 2<sup>341</sup> mod 341 = 2 even though 341 = 11 × 31.)</p>
  <p><strong>Step 2: choose e.</strong> Any prime not dividing φ(n); 3, 17, 65537 are common. 65537 has only two 1-bits (10000000000000001), which makes encryption fast.</p>
  <p><strong>Step 3: compute d</strong> with the extended Euclidean algorithm (the slide's version carries an auxiliary number u<sub>i</sub> = u<sub>i−2</sub> − u<sub>i−1</sub>q<sub>i−2</sub> mod n, starting from u<sub>0</sub> = 0, u<sub>1</sub> = 1; this is Method B above in different notation).</p>

  <h4>Why RSA is correct</h4>
  <div class="box proc"><span class="lbl">Proof: (M<sup>e</sup>)<sup>d</sup> mod n = M</span>
    <ol>
      <li>Since ed mod φ(n) = 1, there is an integer k with <strong>ed = kφ(n) + 1</strong>.</li>
      <li>Assume gcd(M, n) = 1 (the slide says "M does not divide n"; the precise condition is that M shares no factor with n). By Euler's theorem, M<sup>φ(n)</sup> mod n = 1.</li>
      <li>(M<sup>e</sup>)<sup>d</sup> = M<sup>ed</sup> = M<sup>kφ(n)+1</sup> = M · (M<sup>φ(n)</sup>)<sup>k</sup>.</li>
      <li>Mod n: M · (1)<sup>k</sup> = M. ∎</li>
    </ol>
    <p>The proof extends to the rare case where M shares a factor with n (using the Chinese Remainder Theorem). This proof is also what the "RSA trapdoor 1-to-1 function" slide shows: d is the <strong>trapdoor</strong>, the secret that makes an otherwise one-way function easy to invert.</p>
  </div>
  <p><strong>The three hard problems</strong> (the "C = M<sup>e</sup> mod (n = pq)" slide): from n, it is hard to find p and q; from (n, e), it is hard to find d; from (n, e) and C, it is hard to find M with C = M<sup>e</sup>.</p>

  <h4>Security of RSA</h4>
  <p>RSA's security rests on the widely believed difficulty of factoring; the best known algorithms take super-polynomial time. Practical guidance: keys of 256 bits or fewer can be cracked in hours on a personal computer; 1024-bit keys may be breakable soon; <strong>the current recommendation is 2048 bits</strong>.</p>
  <ul>
    <li>1999: the 512-bit RSA challenge was factored in about 4 months (roughly 35.7 CPU-years of work).</li>
    <li>2005: RSA-640 was factored using about 30 2.2 GHz-CPU-years.</li>
    <li>2004: the prize for factoring RSA-2048 was $200,000 (the challenge has since been discontinued).</li>
  </ul>
  <div class="tw"><table style="max-width:560px">
    <thead><tr><th class="num">Key length (bits)</th><th class="num">PCs to factor in one year</th><th class="num">Memory</th></tr></thead>
    <tbody>
      <tr><td class="num">430</td><td class="num">1</td><td class="num">128 MB</td></tr>
      <tr><td class="num">760</td><td class="num">215,000</td><td class="num">4 GB</td></tr>
      <tr><td class="num">1,020</td><td class="num">342 × 10<sup>6</sup></td><td class="num">170 GB</td></tr>
      <tr><td class="num">1,620</td><td class="num">1.6 × 10<sup>15</sup></td><td class="num">120 TB</td></tr>
    </tbody>
  </table></div>
  <p>What to notice: each few hundred extra bits multiplies the required resources enormously.</p>

  <h4>Algorithmic issues</h4>
  <p>Implementing RSA requires: arbitrary-size integers and their arithmetic (overall); random number generation with a given bit length, primality testing, GCD, and multiplicative inverse (setup); modular power (encryption and decryption).</p>

  <h4>Private-key vs. public-key in practice</h4>
  <p><strong>Advantage of public key:</strong> private keys never need to be transmitted or revealed, and strangers can communicate spontaneously. Public-key crypto is meant to <em>supplement</em> symmetric crypto, not replace it. In software DES is about 100× faster than RSA (about 1000× in hardware). With n users: n(n−1)/2 secret keys versus 2n keys for public-key.</p>
  <div class="box proc"><span class="lbl">Process: the RSA digital envelope (hybrid encryption)</span>
    <ol>
      <li>Encrypt the message with a random symmetric (DES) session key.</li>
      <li>Encrypt that session key with the recipient's RSA public key.</li>
      <li>Send both: the symmetric-encrypted message and the RSA-encrypted key.</li>
    </ol>
    <p><strong>Why:</strong> you get RSA's easy key distribution and the symmetric cipher's speed. Today's TLS follows the same idea (with AES instead of DES).</p>
  </div>
  <p><strong>RSA signatures:</strong> the public exponent is usually much smaller than the private one, so verification is faster than signing. An RSA signature (with a secure hash) is superior to a handwritten one: it attests to <em>both</em> the signer's identity and the message contents, cannot be moved to another document, and fails if the message changes in the slightest way. That is what lets important documents exist in digital form only.</p>
  <div class="box def"><span class="lbl">Definition: digital signature (FIPS 186-4)</span>
    <dl>
      <dt>Plain English</dt><dd>A data-dependent value proving who created the data and that it was not changed.</dd>
      <dt>Technical</dt><dd>"The result of a cryptographic transformation of data that, when properly implemented, provides a mechanism for verifying origin authentication, data integrity, and signatory non-repudiation." It is a bit pattern generated as a function of the data. FIPS 186-4 allows three algorithms: DSA, RSA digital signature, and ECDSA (Elliptic Curve DSA).</dd>
      <dt>Why it matters</dt><dd>Memorize the three properties: origin authentication, data integrity, non-repudiation.</dd>
    </dl>
  </div>

  <div class="box warn"><span class="lbl">A simple attack on textbook RSA</span>
    <p><strong>Scenario (diagram):</strong> a web browser sends CLIENT HELLO; the server replies SERVER HELLO with (e, N); the browser picks a random 64-bit session key K and sends C = RSA(K) = K<sup>e</sup> mod N. The server decrypts with d. Eve sees C.</p>
    <p><strong>Attack (meet in the middle):</strong> about 20% of the time, K factors as K = K<sub>1</sub>·K<sub>2</sub> with both parts below 2<sup>34</sup>. Then C / K<sub>1</sub><sup>e</sup> ≡ K<sub>2</sub><sup>e</sup> (mod N).</p>
    <ol>
      <li>Build a table of C / 1<sup>e</sup>, C / 2<sup>e</sup>, …, C / (2<sup>34</sup>)<sup>e</sup> mod N. Cost ≈ 2<sup>34</sup>.</li>
      <li>For each K<sub>2</sub> = 0 … 2<sup>34</sup>, compute K<sub>2</sub><sup>e</sup> and look it up. Cost ≈ 2<sup>34</sup> × 34.</li>
      <li>A match reveals K<sub>1</sub> and K<sub>2</sub>, hence K.</li>
    </ol>
    <p><strong>Total ≈ 2<sup>40</sup> ≪ 2<sup>64</sup>.</strong> The lesson: "textbook" RSA (raw M<sup>e</sup> with no padding) is deterministic and multiplicative, which leaks structure. Real systems pad the message with randomness first (e.g., RSA-OAEP).</p>
  </div>

  <h3 id="l03a-hash">Cryptographic hash functions</h3>
  <h4>Big picture</h4>
  <p>Hashes give every piece of data a short, fixed-size fingerprint. They underpin integrity checks, password storage, signatures, and blockchains. The exam-critical content: the three security properties, the birthday attack, and which algorithms are broken.</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: hash function, digest, collision</span>
    <dl>
      <dt>Plain English</dt><dd>A function that turns any input into a fixed-size value. A collision is two different inputs with the same output.</dd>
      <dt>Technical</dt><dd>h maps plaintext P to a fixed-length value x = h(P), the <strong>hash value</strong> or <strong>digest</strong>. A collision is a pair P ≠ Q with h(P) = h(Q). Collisions are unavoidable (infinitely many inputs, finitely many outputs, by the pigeonhole principle). Computation should take time proportional to the input length.</dd>
      <dt>Why it matters</dt><dd>The goal is not to prevent collisions from existing, only to make them infeasible to <em>find</em>.</dd>
    </dl>
  </div>
  <div class="box bg"><span class="lbl">Background: hash tables (from data structures)</span>
    <p>A hash table stores items at locations determined by their hash value. Collisions are handled by <strong>chaining</strong> (a list at each slot) or <strong>open addressing</strong> (probe for another slot). The number of slots is proportional to the expected number of items, and a good hash spreads items uniformly so searches take constant expected time. Hash tables only need speed and spread; <em>cryptographic</em> hashes add the security properties below.</p>
  </div>

  <div class="tw"><table>
    <thead><tr><th>Property</th><th>Also called</th><th>Attacker is given…</th><th>…and must find</th></tr></thead>
    <tbody>
      <tr><td>Preimage resistance</td><td>One-way</td><td>A hash value x</td><td>Any P with h(P) = x</td></tr>
      <tr><td>Second preimage resistance</td><td>Weak collision resistance</td><td>A specific plaintext P</td><td>A different Q with h(Q) = h(P)</td></tr>
      <tr><td>Collision resistance</td><td>Strong collision resistance</td><td>Nothing</td><td>Any pair P ≠ Q with h(P) = h(Q)</td></tr>
    </tbody>
  </table></div>
  <p><strong>Collision resistance implies second preimage resistance</strong>: if you could find a second preimage for a given P, you would have found a collision. The reverse is not true, because in a collision attack the attacker gets to choose <em>both</em> inputs, which is easier. Memory trick: <em>"one given, one given-and-match, none given."</em></p>
  <div class="box ex"><span class="lbl">Worked examples: which property protects this? <span class="lvl">medium</span></span>
    <p><strong>1.</strong> A stolen password-hash file: the attacker has hash values and wants passwords. → <em>Preimage resistance.</em></p>
    <p><strong>2.</strong> A software download page lists the SHA-256 of the official installer; an attacker wants a malicious installer with the same hash. → <em>Second preimage resistance</em> (the target file is fixed).</p>
    <p><strong>3.</strong> An attacker prepares two contracts, one fair and one unfair, with the same hash, gets you to sign the fair one, then swaps. → <em>Collision resistance</em> (the attacker controls both). This is exactly the MD5 chosen-prefix attack below.</p>
  </div>
  <div class="box def"><span class="lbl">Definition: random oracle</span>
    <dl>
      <dt>Plain English</dt><dd>An idealized "perfect" hash: a black box that returns a truly random answer for each new input and the same answer for repeat inputs.</dd>
      <dt>Technical</dt><dd>A function h: P → X chosen uniformly at random from all such functions, accessible only through queries (you learn outputs for inputs you ask about, nothing else).</dd>
      <dt>Why it matters</dt><dd>It is the theoretical model used to prove protocols secure; real hashes aim to behave like one.</dd>
    </dl>
  </div>
  <p>Hash values should be <strong>at least 256 bits</strong> to resist brute force, for the reason the birthday attack explains.</p>

  <h4>The birthday attack</h4>
  <div class="box bg"><span class="lbl">Background: the birthday paradox</span>
    <p>In a room of just 23 people, there is a better than 50% chance two share a birthday. It feels wrong because you are not looking for someone matching <em>your</em> birthday; you are looking for <em>any</em> matching pair, and 23 people form 253 pairs.</p>
  </div>
  <div class="box proc"><span class="lbl">Process: brute-force birthday attack on a hash</span>
    <ol>
      <li>Generate random plaintexts X<sub>1</sub>, X<sub>2</sub>, X<sub>3</sub>, …</li>
      <li>For each X<sub>i</sub>, compute y<sub>i</sub> = h(X<sub>i</sub>) and check whether y<sub>i</sub> = y<sub>j</sub> for any earlier j (store hashes in a hash table so the check is fast).</li>
      <li>Stop at the first collision.</li>
    </ol>
  </div>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: birthday bound</span>
    <div class="eq">F<sub>k</sub> ≈ e<sup>−k(k−1)/2m</sup>&nbsp;&nbsp;&nbsp;&nbsp;k ≈ 1.17√m&nbsp;&nbsp;&nbsp;&nbsp;b-bit hash → about b/2 bits of security</div>
    <p><strong>Variables:</strong> m = number of possible hash values (m = 2<sup>b</sup> for a b-bit hash); k = number of plaintexts tried; F<sub>k</sub> = probability of <em>no</em> collision after k tries.</p>
    <p><strong>Derivation.</strong> The i-th plaintext avoids all i−1 earlier hashes with probability 1 − (i−1)/m. Multiply for all k: F<sub>k</sub> = (1 − 1/m)(1 − 2/m)…(1 − (k−1)/m). Using 1 − x ≈ e<sup>−x</sup> for small x, the product becomes e<sup>−(1+2+…+(k−1))/m</sup> = e<sup>−k(k−1)/2m</sup>. Setting F<sub>k</sub> = ½ gives k(k−1)/2m = ln 2, so k<sup>2</sup> ≈ 2m ln 2 and <strong>k ≈ √(2 ln 2)·√m ≈ 1.17√m</strong>.</p>
    <p><strong>Interpretation:</strong> you need only about the <em>square root</em> of the output space to find a collision. √(2<sup>b</sup>) = 2<sup>b/2</sup>, so a b-bit hash gives only b/2 bits of collision resistance.</p>
    <p><strong>Worked examples:</strong></p>
    <ul>
      <li>Birthdays: m = 365 → k ≈ 1.17 × 19.1 ≈ 22.4, so 23 people.</li>
      <li>A 32-bit checksum: k ≈ 1.17 × 2<sup>16</sup> ≈ 77,000 tries. Trivial.</li>
      <li>MD5 (128-bit): about 2<sup>64</sup> tries (1.17 × 2<sup>64</sup> ≈ 2.2 × 10<sup>19</sup>).</li>
      <li>SHA-1 (160-bit): about 2<sup>80</sup>. SHA-256: about 2<sup>128</sup>, which is why 256 bits is recommended (it matches AES-128's brute-force strength).</li>
    </ul>
    <p><strong>Common mistakes:</strong> saying a 128-bit hash takes 2<sup>127</sup> tries to collide (that is the preimage/brute-force figure, not the collision figure); forgetting the square root.</p>
  </div>

  <h4>Real hash algorithms</h4>
  <div class="tw"><table>
    <thead><tr><th>Algorithm</th><th>Origin</th><th>Output</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>MD5</td><td>Ron Rivest, 1991</td><td>128 bits</td><td>Insecure; still found in legacy systems</td></tr>
      <tr><td>SHA-0 / SHA-1</td><td>NSA, NIST standard, 1993</td><td>160 bits</td><td>Insecure; still in legacy apps; flaws less severe than MD5's</td></tr>
      <tr><td>SHA-2 (SHA-256, SHA-512)</td><td>NSA/NIST, 2002</td><td>256 or 512 bits</td><td>Still considered secure</td></tr>
      <tr><td>SHA-3</td><td>Public competition announced 2007 (Keccak won in 2012)</td><td>224–512 bits</td><td>Secure; different internal design</td></tr>
    </tbody>
  </table></div>
  <p><strong>MD5's chosen-prefix collision</strong> (Marc Stevens, Arjen Lenstra, Benne de Weger): start with <em>any</em> two plaintexts P and Q, and compute suffixes S<sub>1</sub> and S<sub>2</sub> so that P‖S<sub>1</sub> and Q‖S<sub>2</sub> have the same MD5 hash, using about 2<sup>50</sup> hash evaluations. With this, attackers have built pairs of different executables or PDF documents with identical MD5 hashes.</p>

  <h4>Diagram explained: iterated hash functions</h4>
  <figure class="fig">
<pre class="mermaid">
flowchart LR
  IV[IV] --> F1[compress]
  P1[P1] --> F1 --> F2[compress]
  P2[P2] --> F2 --> F3[compress]
  P3[P3] --> F3 --> F4[compress]
  P4[P4] --> F4 --> D[digest]
</pre>
    <figcaption>An iterated (Merkle–Damgård) hash: a fixed-size compression function chained over padded blocks.</figcaption>
  </figure>
  <p>A <strong>compression function</strong> works on fixed-length input. An <strong>iterated hash</strong> extends it to any length: pad the message, split it into blocks P1…P4, and feed each block together with the previous output (starting from an <strong>initialization vector</strong>) into the compression function. The last output is the digest. It inherits the compression function's collision resistance. MD5 and SHA-1/SHA-2 are built this way.</p>
  <p>The accompanying <strong>chart</strong> plots hashing time (0–0.06 ms) against input size (0–1000 bytes) for SHA-1 and MD5. Both lines rise roughly linearly, confirming that time is proportional to input length, with MD5 slightly faster than SHA-1.</p>

  <h3 id="l03a-mac">MACs, HMAC, and securing a channel</h3>
  <h4>Big picture</h4>
  <p>A plain hash detects accidental changes, but an attacker can simply recompute it. Adding a secret key makes the hash impossible to forge.</p>
  <div class="box def"><span class="lbl">Definition: message authentication code (MAC)</span>
    <dl>
      <dt>Plain English</dt><dd>A keyed checksum only key-holders can produce.</dd>
      <dt>Technical</dt><dd>A cryptographic hash h(K, M) with two inputs, a secret key K and a message M.</dd>
      <dt>Why it matters</dt><dd>Provides integrity and origin authentication between parties sharing K; faster and shorter than a signature. (It does not give nonrepudiation, since both parties know K.)</dd>
    </dl>
  </div>
  <div class="box proc"><span class="lbl">Process: message integrity with a MAC</span>
    <ol>
      <li>Sender and recipient share key K (it can be sent in a separate encrypted and signed message).</li>
      <li>Sender computes c = h(K, M) and transmits (M, c).</li>
      <li>Recipient receives (M′, c′) and computes d = h(K, M′).</li>
      <li>Accept if d = c′; otherwise reject.</li>
    </ol>
    <p><strong>Why an attacker fails:</strong> without K they cannot compute the correct MAC for a forged M′.</p>
  </div>

  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: HMAC</span>
    <div class="eq">HMAC(K, M) = h( (K ⊕ A) ‖ h( (K ⊕ B) ‖ M ) )</div>
    <p><strong>Variables:</strong> h = underlying hash (e.g., SHA-256); K = secret key (padded to the hash's block size); A and B = fixed constants (in the standard, A is "opad" = byte 0x5C repeated and B is "ipad" = byte 0x36 repeated); ‖ = concatenation; ⊕ = XOR.</p>
    <p><strong>Why the simple versions fail.</strong> Because standard hashes are iterated, these are all insecure:</p>
    <ul>
      <li><strong>h(K‖M):</strong> vulnerable to a <em>length-extension attack</em>. The digest is the chain's internal state, so an attacker can keep hashing from it and compute a valid MAC for M‖padding‖(extra data) without knowing K.</li>
      <li><strong>h(M‖K):</strong> an attacker who finds an offline collision h(M) = h(M′) (no key needed) gets a MAC collision too, since the key is only mixed in at the end.</li>
      <li><strong>h(K‖M‖K):</strong> also has known weaknesses.</li>
    </ul>
    <p><strong>Why HMAC works:</strong> two nested hash passes with differently masked keys block length extension. HMAC is as secure as its underlying hash, and it is an Internet standard (used in IPsec, TLS).</p>
    <p><strong>Common mistake:</strong> writing HMAC as h(K ⊕ M) or forgetting the nesting.</p>
  </div>

  <h4>Diagrams explained: Figures 2.3 and 2.5</h4>
  <p><strong>Figure 2.3, message authentication using a MAC.</strong> On the left, the message and key K enter a "MAC algorithm" box; the resulting MAC (checkered block) is appended to the message and transmitted. On the right, the receiver runs the received message through the same MAC algorithm with K and compares the result to the received MAC.</p>
  <p><strong>Figure 2.5, message authentication using a one-way hash</strong>, shows three variants between Source A and Destination B:</p>
  <ol type="a">
    <li><strong>Using symmetric encryption:</strong> hash the message, encrypt only the hash with shared key K, and send it with the message. B decrypts the hash and compares it to its own hash of the message.</li>
    <li><strong>Using public-key encryption:</strong> encrypt the hash with A's <em>private</em> key (a digital signature). B decrypts with A's public key and compares. Adds nonrepudiation.</li>
    <li><strong>Using a secret value:</strong> no encryption at all. A and B share a secret S; A hashes message‖S and sends message plus that hash. B recomputes with its copy of S. (This is the basic idea HMAC refines.)</li>
  </ol>

  <h5>Securing a communication channel (confidentiality + integrity)</h5>
  <ul>
    <li><strong>Sign and encrypt:</strong> transmit the encrypted pair (message, signature).</li>
    <li><strong>MAC and encrypt:</strong> transmit the encrypted pair (message, MAC). More efficient, because a MAC is shorter and faster to compute and verify than a signature. The MAC key can be sent separately.</li>
    <li><strong>Alternative:</strong> sign or MAC the <em>encrypted</em> message instead ("encrypt-then-MAC"). This is the order modern cryptographers generally recommend, since the receiver can reject tampered ciphertext before decrypting it.</li>
  </ul>

  <h3 id="l03a-chains">Hash chains, validation chains, and Merkle trees</h3>
  <h4>Big picture</h4>
  <p>Chaining hashes together lets one expensive signature (or one trusted value) authenticate a long sequence of cheap hashes.</p>

  <h5>Hash chain</h5>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: hash chain</span>
    <div class="eq">x<sub>n</sub> = r,&nbsp;&nbsp;&nbsp;x<sub>i</sub> = h(x<sub>i+1</sub>) for i = n−1 … 1</div>
    <p>Start from a random seed r and hash backward. The sequence x<sub>1</sub>, x<sub>2</sub>, …, x<sub>n</sub> is pseudo-random. Values are <strong>revealed in order</strong> x<sub>1</sub>, x<sub>2</sub>, …, and anyone can check a newly revealed x<sub>i+1</sub> by testing h(x<sub>i+1</sub>) = x<sub>i</sub>.</p>
    <p><strong>Security rests on preimage resistance:</strong> seeing x<sub>i</sub> does not let anyone compute the next value x<sub>i+1</sub>.</p>
    <p><strong>Applications:</strong> one-time passwords (Lamport/S-Key: the server stores the last accepted value; each login reveals the next one) and incremental micropayments (PayWord: each revealed value is worth one unit).</p>
  </div>
  <div class="box ex"><span class="lbl">Worked example: one-time passwords</span>
    <p>With n = 4: x<sub>4</sub> = r, x<sub>3</sub> = h(r), x<sub>2</sub> = h(h(r)), x<sub>1</sub> = h(h(h(r))). The server stores x<sub>1</sub>. Login 1: user sends x<sub>2</sub>; server checks h(x<sub>2</sub>) = x<sub>1</sub>, then stores x<sub>2</sub>. Login 2: user sends x<sub>3</sub>; server checks h(x<sub>3</sub>) = x<sub>2</sub>. An eavesdropper who captured x<sub>2</sub> cannot produce x<sub>3</sub> because that would require inverting h.</p>
  </div>

  <h5>Validation chain (incremental stream authentication, Gennaro–Rohatgi)</h5>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: validation chain</span>
    <div class="eq">x<sub>n+1</sub> = 0,&nbsp;&nbsp;&nbsp;x<sub>i</sub> = h(p<sub>i</sub> ‖ x<sub>i+1</sub>) for i = n … 1</div>
    <p><strong>Transmit:</strong> the signed x<sub>1</sub>, then packets (p<sub>1</sub>, x<sub>2</sub>), (p<sub>2</sub>, x<sub>3</sub>), …, (p<sub>n</sub>, x<sub>n+1</sub>). Each packet carries the hash of the next packet.</p>
    <p><strong>Verify:</strong> check h(p<sub>1</sub> ‖ x<sub>2</sub>) = x<sub>1</sub> (trusted, since it was signed); now x<sub>2</sub> is trusted, so check h(p<sub>2</sub> ‖ x<sub>3</sub>) = x<sub>2</sub>; and so on.</p>
    <p><strong>Properties:</strong> integrity of the first hash implies integrity of the rest; any prefix of the stream is signed and cannot be repudiated; constant overhead (one hash per packet); one slow signature plus n fast hashes. <strong>Limits:</strong> offline (the sender must have the whole stream in advance, since hashes are computed backward) and requires reliable transmission (one lost packet breaks every later check).</p>
  </div>

  <h5>Hash tree (Merkle tree)</h5>
  <figure class="fig">
<pre class="mermaid">
flowchart TD
  g[g = root] --> c[c]
  g --> d[d]
  c --> a[a = h x1,x2]
  c --> b[b = h x3,x4]
  d --> e[e]
  d --> f[f]
  a --> x1[x1]
  a --> x2[x2]
  b --> x3[x3]
  b --> x4[x4]
  e --> x5[x5]
  e --> x6[x6]
  f --> x7[x7]
  f --> x8[x8]
</pre>
    <figcaption>A balanced binary hash tree over eight items (Merkle).</figcaption>
  </figure>
  <p>Each leaf is an item; each internal node is the hash of its two children: a = h(x<sub>1</sub>, x<sub>2</sub>), b = h(x<sub>3</sub>, x<sub>4</sub>), c = h(a, b), and so on up to the root g. <strong>The root hash is a digest of the entire set.</strong></p>
  <div class="box proc"><span class="lbl">Process: proving an item belongs to the tree</span>
    <p><strong>Assumptions:</strong> the hash is collision resistant, and the verifier already trusts the root hash.</p>
    <ol>
      <li>The prover sends the item plus the <strong>sibling hash at each level</strong> on the path to the root, each tagged with which side it is on (L or R).</li>
      <li>The verifier hashes upward, combining with each sibling on the correct side.</li>
      <li>If the result equals the trusted root, the item is authentic.</li>
    </ol>
    <p><strong>Slide example.</strong> Proof for x<sub>4</sub> is [(x<sub>3</sub>, L), (a, L), (d, R)]. Verifier computes b = h(x<sub>3</sub>, x<sub>4</sub>) (x<sub>3</sub> goes on the left), then c = h(a, b) (a on the left), then g′ = h(c, d) (d on the right), and checks g′ = g. In one line: g = h(h(a, h(x<sub>3</sub>, x<sub>4</sub>)), d).</p>
    <p><strong>Why it exists:</strong> the proof has <strong>logarithmic size</strong> (one hash per level; for a million items, about 20 hashes) and logarithmic verification time.</p>
    <p><strong>Common exam question:</strong> write the proof for a different leaf. Try x<sub>6</sub>: [(x<sub>5</sub>, L), (f, R), (c, L)].</p>
    <p><strong>Misconception:</strong> the L/R tags are not optional. h(a, b) ≠ h(b, a).</p>
  </div>

  <h5>Stream authentication with packet losses</h5>
  <p>To authenticate a stream p<sub>1</sub>…p<sub>n</sub> when packets may be lost: build a hash tree over the items (i, p<sub>i</sub>), transmit the signed root hash, and send each packet as (i, p<sub>i</sub>, proof(i, p<sub>i</sub>)). Each packet verifies independently, so lost packets do not block later ones. Cost: logarithmic space overhead and verification time per packet. Like the validation chain, it is an off-line scheme.</p>
  <div class="tw"><table>
    <thead><tr><th></th><th>Validation chain</th><th>Hash tree scheme</th></tr></thead>
    <tbody>
      <tr><td>Overhead per packet</td><td>Constant (one hash)</td><td>Logarithmic (a proof)</td></tr>
      <tr><td>Tolerates loss?</td><td>No, needs reliable delivery</td><td>Yes</td></tr>
      <tr><td>Signatures</td><td>One</td><td>One (on the root)</td></tr>
      <tr><td>Online or offline</td><td>Offline</td><td>Offline</td></tr>
    </tbody>
  </table></div>

  <h3 id="l03a-appendix">Appendix algorithms (the "Readings" slides)</h3>
  <h4>Modular power by repeated squaring</h4>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: square-and-multiply</span>
    <div class="eq">Q<sub>1</sub> = a<sup>p<sub>b−1</sub></sup> mod n,&nbsp;&nbsp;&nbsp;Q<sub>i</sub> = (Q<sub>i−1</sub><sup>2</sup> mod n) · a<sup>p<sub>b−i</sub></sup> mod n,&nbsp;&nbsp;&nbsp;Q<sub>b</sub> = a<sup>p</sup> mod n</div>
    <p><strong>Variables:</strong> the exponent p is written in binary as p<sub>b−1</sub>…p<sub>1</sub>p<sub>0</sub> (b bits). Each a<sup>p<sub>j</sub></sup> is either a (bit 1) or 1 (bit 0).</p>
    <p><strong>Why it works:</strong> reading bits left to right, squaring doubles the exponent built so far and multiplying by a adds 1. That is exactly how you build a binary number digit by digit. Reducing mod n each step keeps numbers small.</p>
    <p><strong>Cost:</strong> O(log p) multiplications instead of p − 1. For a 2048-bit exponent: about 4,000 operations instead of 2<sup>2048</sup>.</p>
  </div>
  <div class="box ex"><span class="lbl">Worked example: 3<sup>18</sup> mod 19 (slide)</span>
    <p>18 in binary is <code>10010</code>.</p>
    <div class="tw"><table style="max-width:600px">
      <thead><tr><th>i</th><th>bit</th><th>multiply by</th><th>Q<sub>i</sub></th></tr></thead>
      <tbody>
        <tr><td>1</td><td>1</td><td>3</td><td>3</td></tr>
        <tr><td>2</td><td>0</td><td>1</td><td>3<sup>2</sup> = 9</td></tr>
        <tr><td>3</td><td>0</td><td>1</td><td>9<sup>2</sup> = 81 mod 19 = 5</td></tr>
        <tr><td>4</td><td>1</td><td>3</td><td>5<sup>2</sup> = 25 mod 19 = 6; 6 × 3 = 18</td></tr>
        <tr><td>5</td><td>0</td><td>1</td><td>18<sup>2</sup> = 324 = 17·19 + 1 → 1</td></tr>
      </tbody>
    </table></div>
    <p><strong>Answer: 1.</strong> Sanity check with Fermat: 19 is prime, so 3<sup>18</sup> mod 19 must be 1 ✓.</p>
    <p><strong>Another:</strong> 8<sup>7</sup> mod 55, with 7 = <code>111</code>: Q<sub>1</sub> = 8; Q<sub>2</sub> = 64 mod 55 = 9, × 8 = 72 mod 55 = 17; Q<sub>3</sub> = 289 mod 55 = 14, × 8 = 112 mod 55 = <strong>2</strong>. Matches RSA Example 4.</p>
  </div>

  <h4>Pseudoprimality and randomized primality testing</h4>
  <p><strong>How many primes are there?</strong> About n / ln n primes are ≤ n. So among random b-bit numbers, roughly 1 in (b ln 2) is prime, and you expect to find a prime after O(b) tries. For 512-bit candidates that is about 1 in 355 (1 in 178 if you only try odd numbers).</p>
  <p><strong>Base-x pseudoprime:</strong> an integer n ≥ 2 with x<sup>n−1</sup> mod n = 1 (it passes the Fermat test for base x). Every prime passes. Composite base-2 pseudoprimes are rare: a random 100-bit integer is one with probability below 10<sup>−13</sup>, and the smallest is <strong>341</strong> (= 11 × 31). The test runs fast with repeated squaring.</p>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: randomized primality test confidence</span>
    <div class="eq">t = ⌈ k / log<sub>2</sub>(1/q) ⌉&nbsp;&nbsp;&nbsp;→&nbsp;&nbsp;&nbsp;error ≤ q<sup>t</sup> ≤ 2<sup>−k</sup></div>
    <p><strong>Variables:</strong> witness(x, n) is a compositeness test. If n is prime it always returns false. If n is composite it returns true except with small probability q. k = desired confidence; t = number of random trials.</p>
    <p><strong>Algorithm RandPrimeTest(n, k):</strong> repeat t times: pick random x; if witness(x, n) is true, return "composite." After all t trials, return "prime." A "composite" answer is always correct; a "prime" answer is wrong with probability at most 2<sup>−k</sup>.</p>
    <p><strong>Worked example:</strong> the Rabin–Miller witness has q ≤ 1/4, so log<sub>2</sub>(4) = 2. For k = 80, t = 40 trials gives error ≤ 2<sup>−80</sup>.</p>
    <p><strong>Common mistake:</strong> thinking a "composite" result could be wrong. Only "prime" can be wrong.</p>
  </div>

  <div class="box proc"><span class="lbl">L03a in one breath</span>
    <p>A good cipher is consistent (D<sub>K</sub>(E<sub>K</sub>(P)) = P) and resists brute force and cryptanalysis; English redundancy sets the <strong>unicity distance</strong> n = k/(1−β). DES (64-bit block, 56-bit key) fell to brute force; 3DES patched it; <strong>AES</strong> (128-bit blocks, 128/192/256-bit keys, SubBytes–ShiftRows–MixColumns–AddRoundKey) replaced it. <strong>ECB leaks patterns; CBC chains blocks</strong> with an IV; stream ciphers must never reuse a key stream. <strong>RSA</strong>: n = pq, φ = (p−1)(q−1), ed ≡ 1 mod φ via extended Euclid, C = M<sup>e</sup> mod n, and it is secure because factoring is hard. Hashes need preimage, second-preimage, and collision resistance, and the <strong>birthday bound</strong> cuts a b-bit hash to b/2 bits; HMAC fixes h(K‖M); hash chains and Merkle trees authenticate long sequences cheaply.</p>
  </div>

<section class="lecture prose" id="l04a">
  <div class="plate"><span class="num" aria-hidden="true">L04a</span><p class="ttl">Operating system security</p><p class="src">Source: L04a-os_sec.pdf (UNIX and Windows security models, sandboxing, Chrome architecture)</p></div>
  <p>L01a said the OS file system is an access control tool. This lecture shows how: who the OS thinks you are (users, UIDs, tokens), what it protects (files, processes), how it decides (permission bits, ACLs), and how modern software shrinks the damage when something goes wrong (privilege dropping, capabilities, sandboxes).</p>

  <h3 id="l04a-principles">Design principles: assume bugs, layer defenses</h3>
  <h4>Big picture</h4>
  <p>The lecture opens with a blunt claim: vulnerabilities are inevitable. So systems must be designed to stay safe <em>even when</em> some component is buggy or some user is malicious.</p>

  <h4>Explanation</h4>
  <p>Any single memory bug might let an attacker run their own code:</p>
  <div class="box bg"><span class="lbl">Background: three classic memory bugs (covered in depth later in the course)</span>
    <ul>
      <li><strong>Buffer overflow:</strong> writing past the end of an array, overwriting neighboring memory (possibly a return address or function pointer). A <em>heap</em> overflow does this in dynamically allocated memory.</li>
      <li><strong>Use-after-free:</strong> using memory after it has been freed, when it may now hold attacker-controlled data.</li>
      <li><strong>Null pointer dereference:</strong> following a pointer that is NULL, usually a crash, sometimes exploitable in kernel code.</li>
    </ul>
    <p>A <strong>CVE</strong> (Common Vulnerabilities and Exposures) ID is the public catalog number for a known vulnerability, formatted CVE-year-number.</p>
  </div>
  <ul>
    <li><strong>CVE-2021-3156 ("Baron Samedit"):</strong> in January 2021, Qualys found a heap overflow in <code>sudo</code> that let users run programs with another user's privileges (including root). It had been in the code since 2011 and affected Linux, macOS, and BSD. Ten years unnoticed in one of the most security-critical programs.</li>
    <li><strong>CVE-2016-5636:</strong> even "safe" languages have bugs, because their interpreters are written in unsafe ones. Python is written in C; an integer overflow in <code>get_data</code> in <code>zipimport.c</code> allowed a heap buffer overflow by specifying a negative data size, and it could be triggered from inside an ordinary Python script.</li>
  </ul>
  <p>Takeaway slide: <em>systems must be designed to be resilient in the face of both software vulnerabilities and malicious users.</em></p>

  <div class="box def"><span class="lbl">Definition: defense in depth</span>
    <dl>
      <dt>Plain English</dt><dd>Several independent walls, so one breach is not a total loss.</dd>
      <dt>Technical</dt><dd>Building security protections at multiple layers of a system so that the failure of one layer is contained by another.</dd>
      <dt>Why it matters</dt><dd>Since bugs are inevitable, each layer should assume the layer above it has been compromised.</dd>
    </dl>
  </div>
  <h4>Diagram explained: defense in depth for a Chrome JavaScript bug</h4>
  <figure class="fig">
<pre class="mermaid">
flowchart TD
  B[Bug in Chrome's JavaScript interpreter] --> L1[Browser layer: malicious site cannot reach other tabs]
  L1 --> L2[OS layer: cannot reach other processes such as a password manager]
  L2 --> L3[Hardware layer: cannot install permanent malware in firmware]
  L3 --> L4[Network layer: cannot infect nearby computers]
</pre>
    <figcaption>Each layer is a separate barrier the attacker must break.</figcaption>
  </figure>
  <p>If an attacker exploits the JavaScript engine, Chrome should still stop the malicious site from touching other tabs. If that fails, the OS should stop the renderer from reading other processes' memory. If that fails, hardware should prevent persistent firmware malware. And the network should stop the infection from spreading. Compare to L01a's Figure 1.4: deep layering lowers risk.</p>

  <div class="box def"><span class="lbl">Definition: least privilege</span>
    <dl>
      <dt>Plain English</dt><dd>Give everyone only the access they need for their job, nothing more.</dd>
      <dt>Technical</dt><dd>Users and system components (subjects) should only have access to the data and resources needed to perform routine, authorized tasks.</dd>
      <dt>Why it matters</dt><dd>It limits damage when an account or program is compromised. Slide examples: faculty can only change grades for classes they teach; only employees with background checks can see classified documents.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: privilege separation</span>
    <dl>
      <dt>Plain English</dt><dd>Split a system into parts so each part can be given only the privileges it needs.</dd>
      <dt>Technical</dt><dd>Dividing a system into components to which access can be limited individually. Least privilege requires it.</dd>
      <dt>Why it matters</dt><dd>Segmenting with least privilege can prevent an attacker who compromises one component from taking over the entire system. (The slide's photo shows a safe with separate locks.)</dd>
    </dl>
  </div>
  <p><strong>Subjects are not just people.</strong> Least privilege applies everywhere:</p>
  <ul>
    <li>UNIX: a <em>user</em> should only read their own files.</li>
    <li>UNIX: a <em>process</em> should not read another process's memory.</li>
    <li>Mobile: an <em>app</em> should not edit another app's data.</li>
    <li>Web: a <em>domain</em> should only read its own cookies.</li>
    <li>Networking: only a trusted <em>host</em> should access the file server.</li>
  </ul>

  <div class="box def"><span class="lbl">Definition: security policy (subject, object, operation)</span>
    <dl>
      <dt>Plain English</dt><dd>A rule saying who can do what to which thing.</dd>
      <dt>Technical</dt><dd><strong>Subject</strong> (who?): an acting principal such as a user, app, or process. <strong>Object</strong> (what?): a protected resource such as memory, files, or hardware devices. <strong>Operation</strong> (how?): how subjects act on objects, such as read or delete.</dd>
      <dt>Why it matters</dt><dd>These are exactly the rows, columns, and cell contents of the access control matrix from L01a.</dd>
    </dl>
  </div>
  <div class="box ex"><span class="lbl">Worked example: parse the policy</span>
    <p>"A <u>Domain</u> should not be able to <u>read</u> another domain's <u>cookies</u>." Subject = domain; operation = read; object = cookies. Try: "An App should only be able to edit its own data." Subject = app; operation = edit (write); object = its data.</p>
  </div>

  <h3 id="l04a-unix">The UNIX security model</h3>
  <h4>Big picture</h4>
  <p>UNIX (and Linux, macOS, BSD) uses one simple model everywhere, and nearly everything is represented as a file, so file permissions control almost everything.</p>
  <div class="tw"><table>
    <thead><tr><th>Element</th><th>In UNIX</th></tr></thead>
    <tbody>
      <tr><td>Subjects (who?)</td><td>Users and processes</td></tr>
      <tr><td>Objects (what?)</td><td>Files and directories. "Files" also include sockets, pipes, hardware devices, kernel objects, and process data</td></tr>
      <tr><td>Access operations (how?)</td><td>Read, write, execute</td></tr>
    </tbody>
  </table></div>

  <h4>Users</h4>
  <p>A UNIX system has many accounts. <strong>Service accounts</strong> run background processes (e.g., <code>www-data</code> for a web server). <strong>User accounts</strong> are typically tied to a human. Every user has a unique integer <strong>User ID (UID)</strong>. <strong>UID 0 is root</strong>, which has access to everything; many system operations can only run as root.</p>
  <h5>Reading /etc/passwd</h5>
<pre class="code"><code>root:x:0:0:root:/root:/bin/bash
www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
backup:x:34:34:backup:/var/backups:/usr/sbin/nologin
systemd-resolve:x:101:103:,,,:/run/systemd/resolve:/usr/sbin/nologin
zakir:x:1001:1001:Zakir Durumeric,,,:/home/zakir:/bin/bash
dabo:x:1009:1009:Dan Boneh,,,:/home/dabo:/usr/sbin/nologin</code></pre>
  <div class="tw"><table>
    <thead><tr><th>Field</th><th>Example (zakir)</th><th>Meaning</th></tr></thead>
    <tbody>
      <tr><td>1 username</td><td>zakir</td><td>Login name</td></tr>
      <tr><td>2 password</td><td>x</td><td>Placeholder: the real password hash is in <code>/etc/shadow</code>, readable only by root</td></tr>
      <tr><td>3 UID</td><td>1001</td><td>User ID</td></tr>
      <tr><td>4 GID</td><td>1001</td><td>Primary group ID</td></tr>
      <tr><td>5 GECOS</td><td>Zakir Durumeric,,,</td><td>Full name and contact info</td></tr>
      <tr><td>6 home</td><td>/home/zakir</td><td>Home directory</td></tr>
      <tr><td>7 shell</td><td>/bin/bash</td><td>Program started at login. <code>/usr/sbin/nologin</code> blocks interactive login</td></tr>
    </tbody>
  </table></div>
  <p>What to notice: service accounts (www-data, backup) have low UIDs and <code>nologin</code>, so nobody can log in as them. Human accounts start around 1000. Even the human account <code>dabo</code> has <code>nologin</code>, so that person cannot get a shell on this machine. And <code>/etc/passwd</code> is world-readable, which is exactly why the hashes were moved to <code>/etc/shadow</code> (recall L01a: stolen hashes can be brute-forced).</p>

  <h4>Groups</h4>
  <p>A <strong>group</strong> is a named collection of users who can share files and resources. Every group has a <strong>group ID (GID)</strong> and a name. A user can belong to several groups.</p>

  <h3 id="l04a-perms">File ownership and permissions</h3>
  <h4>Big picture</h4>
  <p>Reading an <code>ls -l</code> listing and deciding who can do what is a near-certain exam question. Master this section.</p>
  <h4>Explanation</h4>
  <p>Every file and directory has exactly <strong>one user owner</strong> and <strong>one group owner</strong>. Three classes of subject get permissions: the <strong>user</strong> (owner), the <strong>group</strong>, and <strong>other</strong> (everyone else). Each class gets three operations: <strong>read, write, execute</strong>. The owner can change the file's permissions and group; only root can change the user owner.</p>
<pre class="code"><code>zakir@scratch-01:~$ ls -l
total 8
drwxrwx---  5 zakir csc1302-tas   4096 Apr  2 15:56 homework
drwxrwx---  5 zakir csc1302-instr 4096 Apr  2 15:56 grades
drwxrwxr-x 11 zakir csc1302-tas   4096 Dec 28 21:09 lectures
-rwxr-xr--  1 zakir dabo             0 Apr 11 04:15 test.py</code></pre>
  <h4>Diagram explained: anatomy of a listing line</h4>
  <div class="tw"><table>
    <thead><tr><th><code>d</code></th><th><code>rwx</code></th><th><code>rwx</code></th><th><code>r-x</code></th><th><code>11</code></th><th><code>zakir</code></th><th><code>csc1302-tas</code></th><th><code>4096</code></th><th><code>Dec 28 21:09</code></th><th><code>lectures</code></th></tr></thead>
    <tbody><tr><td>Type: <code>d</code> directory, <code>-</code> regular file</td><td>User (owner) permissions</td><td>Group permissions</td><td>Other permissions</td><td>Link count</td><td>User owner</td><td>Group owner</td><td>Size (bytes)</td><td>Last modified</td><td>Name</td></tr></tbody>
  </table></div>

  <div class="tw"><table>
    <thead><tr><th>Letter</th><th>On a file</th><th>On a directory</th></tr></thead>
    <tbody>
      <tr><td>r</td><td>Read the contents</td><td>List the names inside (<code>ls</code>)</td></tr>
      <tr><td>w</td><td>Modify the contents</td><td>Create, delete, or rename entries (together with x)</td></tr>
      <tr><td>x</td><td>Run it as a program</td><td>Enter it (<code>cd</code>) and access items inside by name</td></tr>
      <tr><td>-</td><td colspan="2">Permission not granted</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">Process: deciding what a user can do</span>
    <ol>
      <li>Is the user root (UID 0)? Then permission checks are bypassed.</li>
      <li>Is the user the file's <strong>owner</strong>? Use <em>only</em> the user triplet, and stop.</li>
      <li>Otherwise, is the user a member of the file's <strong>group</strong>? Use <em>only</em> the group triplet, and stop.</li>
      <li>Otherwise, use the <strong>other</strong> triplet.</li>
      <li>To reach a file, the user also needs <code>x</code> on every directory in its path.</li>
    </ol>
    <p><strong>Common misconception:</strong> "permissions add up." They do not. If a file is <code>----rwx---</code>, its owner has <em>no</em> access even if the owner is in the group, because step 2 stops at the owner triplet.</p>
  </div>

  <div class="box exam"><span class="lbl">The slide's two questions</span>
    <details><summary>Access Control Example 1: What can Drew (a member of csc1302-tas) do to homework?</summary><div><p>homework is <code>drwxrwx---</code> with group csc1302-tas. Drew is not the owner (zakir) but is in the group, so the group triplet <code>rwx</code> applies: Drew can list the directory (r), create/delete/rename files in it (w), and enter it (x). Whether Drew can read a particular file <em>inside</em> depends on that file's own permissions.</p></div></details>
    <details><summary>Access Control Example 2: If a student (in none of these groups) has access to this server, which files can they access?</summary><div><p>The student falls under "other." homework (<code>---</code>): nothing. grades (<code>---</code>): nothing. lectures (<code>r-x</code>): list and enter, but not create or delete files. test.py (<code>r--</code>): read it, but not modify or run it. (All of this assumes the student can traverse zakir's home directory, i.e., it grants x to others.)</p></div></details>
    <details><summary>Bonus: Who can execute test.py?</summary><div><p><code>-rwxr-xr--</code>, group dabo: zakir (rwx) and members of group dabo (r-x) can execute it. Others cannot.</p></div></details>
  </div>

  <h4>Octal notation (used with chmod)</h4>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: permission digit</span>
    <div class="eq">digit = 4·r + 2·w + 1·x</div>
    <p><strong>Why it works:</strong> each triplet is 3 bits (r = 100₂ = 4, w = 010₂ = 2, x = 001₂ = 1), so each triplet is one octal digit (the grouping-by-three rule from the number systems refresher).</p>
    <p><strong>Worked examples:</strong> <code>rwxr-xr--</code> = 7 5 4 → <code>chmod 754 test.py</code>. <code>rwxrwx---</code> = 770. <code>rw-r--r--</code> = 644 (typical file). <code>rwx------</code> = 700 (private). A fourth leading digit sets special bits: 4 = setuid, 2 = setgid, so <code>-rwsr-xr-x</code> = 4755.</p>
    <p><strong>Common mistake:</strong> putting the digits in the wrong order. It is always user, group, other.</p>
  </div>
  <div class="tool" id="tool-perm"><span class="lbl">Tool: UNIX permission decoder</span>
    <label for="pm-in">Permission string or octal</label>
    <input id="pm-in" type="text" value="rwxr-xr--" size="14">
    <button type="button" id="pm-go">Decode</button>
    <output id="pm-out" aria-live="polite"></output>
  </div>

  <h4>Access control lists and role-based access control</h4>
  <div class="box def"><span class="lbl">Definition: access control list (ACL)</span>
    <dl>
      <dt>Plain English</dt><dd>A list attached to each object saying who can do what to it.</dd>
      <dt>Technical</dt><dd>Every object has an ACL identifying which operations each subject may perform; every access is checked against the object's ACL. It is one column of the access control matrix. UNIX permission bits are a simple, compressed ACL with exactly three entries (user, group, other).</dd>
      <dt>Why it matters</dt><dd>It is the dominant access control design in real operating systems.</dd>
    </dl>
  </div>
  <p>Slide example ACL for <code>hw/</code>: Dan read/write; Zakir read/write; Amelie read.</p>
  <div class="box def"><span class="lbl">Definition: role-based access control (RBAC)</span>
    <dl>
      <dt>Plain English</dt><dd>Give permissions to job roles, then put people into roles.</dd>
      <dt>Technical</dt><dd>Access rights are assigned to roles rather than to individual users; users gain rights through role membership.</dd>
      <dt>Why it matters</dt><dd>Matrices grow complex as subjects, objects, and operations multiply. <strong>Users change more often than roles</strong>, so when a TA leaves, you remove one group membership instead of editing every file.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Role</th><th>hw/</th><th>exams/</th><th>grades/</th><th>lectures/</th></tr></thead>
    <tbody>
      <tr><td>csc1302-instr</td><td>r/w</td><td>r/w</td><td>r/w</td><td>r/w</td></tr>
      <tr><td>csc1302-tas</td><td>r/w</td><td>read</td><td>—</td><td>r/w</td></tr>
      <tr><td>csc1302-students</td><td>read</td><td>—</td><td>—</td><td>read</td></tr>
      <tr><td>cs-students</td><td>—</td><td>—</td><td>—</td><td>read</td></tr>
    </tbody>
  </table></div>
  <p>This is an access control matrix whose rows are <em>roles</em>. UNIX implements it with groups. Reading it: TAs can grade homework and see exams but not final grades; any CS student can read lectures.</p>

  <h3 id="l04a-proc">UNIX processes and user IDs</h3>
  <h4>Big picture</h4>
  <p>Users do not touch files directly; <em>processes</em> do, on their behalf. So the real security question is: which user does each process act as, and can that change?</p>
  <h4>Explanation</h4>
  <ul>
    <li><strong>Processes are isolated:</strong> they cannot access each other's memory.</li>
    <li><strong>Processes run as a specific user:</strong> a process you start has your UID's permissions and can access any file your UID can. Processes with the same UID have the same permissions.</li>
    <li><strong>Inheritance:</strong> your shell runs as you. When you type a command, the shell <strong>forks</strong> (creates a copy of itself) and the child runs the command. A forked child inherits its parent's UID, so every command runs with all your privileges.</li>
    <li><strong>Dropping privilege:</strong> a process started by root can reduce its privileges by changing its UID to a less privileged one.</li>
  </ul>
  <div class="box def"><span class="lbl">Definition: the three process user IDs</span>
    <dl>
      <dt>Plain English</dt><dd>Who the process is acting as right now, who started it, and a saved spot to switch back to.</dd>
      <dt>Technical</dt><dd><strong>Effective UID (EUID):</strong> determines the process's permissions. <strong>Real UID (RUID):</strong> the user who started the process. <strong>Saved UID (SUID):</strong> the EUID before the last change. Usually all three equal the user who started the process.</dd>
      <dt>Why it matters</dt><dd>Privilege bugs almost always come from leaving one of these set to 0.</dd>
    </dl>
  </div>
  <p><strong>Rules for changing them:</strong> root can set EUID, RUID, and SUID to anything. An unprivileged process can only change its EUID to its current RUID or SUID.</p>
  <div class="tw"><table>
    <thead><tr><th>Call</th><th>EUID</th><th>RUID</th><th>SUID</th><th>Use</th></tr></thead>
    <tbody>
      <tr><td><code>setuid(x)</code> (as root)</td><td>x</td><td>x</td><td>x</td><td>Permanently drop privilege</td></tr>
      <tr><td><code>seteuid(x)</code></td><td>x</td><td>unchanged</td><td>unchanged</td><td>Temporarily drop privilege</td></tr>
    </tbody>
  </table></div>

  <div class="box ex"><span class="lbl">Worked example 1: Apache drops privilege permanently <span class="lvl">easy</span></span>
<pre class="code"><code>if (fork() == 0) {
    int sock = socket(":80");          // needs root: port 80 is privileged
    setuid(getuid("www-data"));        // now EUID = RUID = SUID = www-data
}</code></pre>
    <p>Only root can listen on ports below 1024, so Apache must start as root. Without dropping privilege, any Apache bug would hand the attacker unrestricted control. After opening the socket (which stays open), the child calls <code>setuid</code> and becomes <code>www-data</code> for good. A bug now only gives the attacker www-data's limited rights. This is least privilege and privilege separation in action.</p>
  </div>
  <div class="box ex"><span class="lbl">Worked example 2: temporary drop <span class="lvl">medium</span></span>
<pre class="code"><code># EUID = RUID = SUID = 0
seteuid(100);        # EUID = 100; RUID = SUID = 0
&lt;perform dangerous operation&gt;
setuid(0);           # allowed: 0 equals RUID/SUID → back to root</code></pre>
    <p>The dangerous operation runs with user 100's limited rights. Because RUID and SUID still say 0, the process can return to root afterward.</p>
  </div>
  <div class="box ex"><span class="lbl">Worked example 3: the vulnerable SSH server <span class="lvl">hard</span></span>
<pre class="code"><code>if (authenticate(uid, pwd) == S_SUCCESS) {
    if (fork() == 0) {
        seteuid(uid);          // EUID := uid; RUID and SUID stay 0
        exec("/bin/bash");     // user gets a shell
    }
}</code></pre>
    <p><strong>The bug:</strong> <code>seteuid</code> only changes EUID. The user's shell still has SUID = 0, so the user can simply call <code>setuid(0)</code> (allowed, since 0 equals the saved UID) and become root.</p>
    <p><strong>The slide's fix:</strong> also call <code>setuid(uid)</code>, so EUID = RUID = SUID = uid and the user cannot switch back.</p>
    <p><strong>Real-world footnote:</strong> on actual Linux, call <code>setuid(uid)</code> <em>while still root</em>, and do it before anything else. In the slide's order, after <code>seteuid(uid)</code> the process is no longer privileged, and a real unprivileged <code>setuid</code> changes only the EUID, leaving SUID = 0. Answer exam questions using the slide's simplified model, but know the principle: drop privilege completely, while you still have the power to.</p>
  </div>

  <h4>Diagram explained: the UNIX process tree</h4>
<pre class="code"><code>systemd─┬─accounts-daemon───2*[{accounts-daemon}]
        ├─lighttpd(www-data)
        ├─rsyslogd(syslog)───3*[{rsyslogd}]
        ├─screen(zakir)───bash─┬─zdns───82*[{zdns}]
        │                      └─ziterate
        ├─sshd─┬─sshd───sshd(zakir)───bash───pstree
        │      └─sshd───sshd(dabo)───bash
        ├─systemd-resolve(systemd-resolve)</code></pre>
  <p>This is <code>pstree -u</code>. The main system process <strong>systemd</strong> starts as root and forks everything else. A name in parentheses means the process's UID <em>changed</em> from its parent's. So <code>lighttpd(www-data)</code> is a web server that dropped to www-data; <code>rsyslogd(syslog)</code> runs as syslog. The <strong>sshd</strong> branch shows privilege separation: the root sshd forks a per-connection sshd, which after authentication forks <code>sshd(zakir)</code> running as the logged-in user, whose bash then runs <code>pstree</code> itself. <code>{…}</code> entries are threads (e.g., 82 zdns threads).</p>

  <h3 id="l04a-setuid">The setuid bit, sudo, and Linux capabilities</h3>
  <h4>Big picture</h4>
  <p>Sometimes an ordinary user legitimately needs to do something only root can. UNIX solves this by letting certain programs run as their owner, which is powerful and dangerous.</p>
  <div class="box def"><span class="lbl">Definition: setuid bit</span>
    <dl>
      <dt>Plain English</dt><dd>A flag on a program that makes it run as the program's owner instead of as you.</dd>
      <dt>Technical</dt><dd>When an executable with the setuid bit is run, the process's EUID is set to the file's owner (and with the setgid bit, its group), while the RUID remains the calling user.</dd>
      <dt>Why it matters</dt><dd>It enables tools like <code>passwd</code>, but any bug in a setuid-root program gives an attacker root.</dd>
    </dl>
  </div>
  <p><strong>The passwd example.</strong> Changing your password means updating <code>/etc/shadow</code>, which only root can read or write. Normally your process (running as you) could not. So <code>passwd</code> is setuid root:</p>
<pre class="code"><code>zakir@scratch-03:~$ ls -ali /usr/bin/passwd
2235 -rwsr-xr-x 1 root root 59640 Mar 22 2019 /usr/bin/passwd</code></pre>
  <p>The <code>s</code> in the owner's execute position (arrow on the slide) is the setuid bit. The owner is root, so anyone who runs passwd gets EUID = 0. (The leading 2235 is the inode number, from the <code>-i</code> flag.)</p>
  <div class="box exam"><span class="lbl">The slide's question</span>
    <details><summary>How does passwd know which user it should allow the caller to change the password for?</summary><div><p>It looks at the <strong>real UID</strong>. The EUID is root (from the setuid bit), but the RUID is still the person who ran the program. passwd lets an ordinary RUID change only its own password; only a real root may change anyone's.</p></div></details>
  </div>
  <div class="tw"><table>
    <thead><tr><th><code>setuid()</code> system call (in code)</th><th>setuid bit (on an executable file)</th></tr></thead>
    <tbody><tr><td>Lets a running process change its own user IDs (EUID, RUID, SUID ← x)</td><td>Makes the program run as the file's owner and group rather than the calling user</td></tr>
    <tr><td>Used to <em>drop</em> privilege</td><td>Used to <em>gain</em> privilege</td></tr></tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Misconception</span><p>Same name, opposite directions. The <em>call</em> usually lowers privilege; the <em>bit</em> raises it.</p></div>

  <h5>Becoming root</h5>
  <ul>
    <li>System configuration files are owned by root, and important system processes run as root, so admins sometimes need root.</li>
    <li><code>sudo</code>: run a single command as root. Requires you to be "blessed" (listed in the sudoers configuration); asks for <em>your</em> password.</li>
    <li><code>su</code>: become root (or another user) by knowing <em>that account's</em> password.</li>
    <li><code>sudo su</code>: become root without knowing root's password (sudo runs su as root, and root needs no password to su).</li>
  </ul>

  <h5>"Worst privilege separation ever?"</h5>
  <p>Traditional UNIX has only two levels: privileged processes (EUID = 0) bypass <em>all</em> kernel permission checks, and unprivileged ones get full checking. Many utilities, like <code>ping</code> (which needs raw network sockets), were made setuid root just to get one small power, and got all of root with it. That is exceptionally dangerous: a bug in any of them can compromise the whole system.</p>
  <div class="box def"><span class="lbl">Definition: Linux capabilities</span>
    <dl>
      <dt>Plain English</dt><dd>Root's powers cut into separate pieces, so a program gets only the piece it needs.</dd>
      <dt>Technical</dt><dd>Per-thread privilege flags that split superuser power into components. A compromised program holding only some capabilities can do only limited damage.</dd>
      <dt>Why it matters</dt><dd>Least privilege applied to root itself. Modern <code>ping</code> uses CAP_NET_RAW instead of setuid root.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Capability</th><th>Grants</th></tr></thead>
    <tbody>
      <tr><td>CAP_KILL</td><td>Bypass permission checks for sending signals (e.g., kill other users' processes)</td></tr>
      <tr><td>CAP_NET_BIND_SERVICE</td><td>Bind a socket to privileged ports (&lt; 1024). Apache could use this instead of starting as root</td></tr>
      <tr><td>CAP_SYS_PTRACE</td><td>Trace arbitrary processes with ptrace (debuggers)</td></tr>
    </tbody>
  </table></div>

  <h5>UNIX security: pros and cons</h5>
  <div class="tw"><table>
    <thead><tr><th>Pros</th><th>Cons</th></tr></thead>
    <tbody>
      <tr><td>Simple model protects most situations</td><td>ACLs are coarse-grained; do not capture enterprise complexity</td></tr>
      <tr><td>Flexible enough for most simple systems in practice</td><td>Cannot separate different applications within one user account</td></tr>
      <tr><td></td><td>Nearly all system operations require root, and people get sloppy</td></tr>
    </tbody>
  </table></div>

  <h3 id="l04a-win">The Windows security model</h3>
  <h4>Big picture</h4>
  <p>Windows uses the same subject/object idea but with much richer, finer-grained ACLs and a token-based identity for each process.</p>
  <h4>Explanation</h4>
  <p><strong>Flexible ACLs:</strong> objects have full ACLs (any number of entries), allowing fine-grained permissions. Users can belong to multiple groups, groups can be nested, and ACL entries can <strong>allow or deny</strong>.</p>
  <div class="box def"><span class="lbl">Definition: security descriptor</span>
    <dl>
      <dt>Plain English</dt><dd>The security label attached to every Windows object.</dd>
      <dt>Technical</dt><dd>Specifies who can perform what, plus audit rules. It contains: <strong>SIDs</strong> (security identifiers) for the object's owner and primary group; a <strong>DACL</strong> (discretionary ACL) listing access rights allowed or denied to users and groups; and a <strong>SACL</strong> (system ACL) listing which access attempts generate audit records.</dd>
      <dt>Why it matters</dt><dd>DACL = access decisions; SACL = logging. Memory trick: <strong>D</strong>ACL <strong>D</strong>ecides, <strong>S</strong>ACL <strong>S</strong>urveils.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: access token</span>
    <dl>
      <dt>Plain English</dt><dd>The ID badge each Windows process carries.</dd>
      <dt>Technical</dt><dd>A process's security context: the user account ID, group IDs, login session ID, list of OS privileges held, and list of restrictions. An <strong>impersonation token</strong> lets a process temporarily adopt a different context (e.g., a file server acting as the client it is serving).</dd>
      <dt>Why it matters</dt><dd>It is the Windows counterpart to UNIX's UIDs, but carries far more.</dd>
    </dl>
  </div>
  <div class="box proc"><span class="lbl">Process: a Windows access request</span>
    <ol>
      <li>A process wants to access an object and presents its tokens (security context).</li>
      <li>Windows reads the object's security descriptor.</li>
      <li>It compares the token's SIDs and privileges against the DACL entries.</li>
      <li>Access is granted or denied; if the SACL says so, an audit record is written.</li>
    </ol>
    <p>(Background: Windows orders explicit deny entries ahead of allow entries, so a deny normally wins.)</p>
  </div>

  <h4>Capabilities vs. ACLs</h4>
  <div class="tw"><table>
    <thead><tr><th></th><th>Capability</th><th>ACL</th></tr></thead>
    <tbody>
      <tr><td>How access is checked</td><td>Subject presents an unforgeable ticket granting access; the system does not care who the subject is</td><td>System checks whether the subject is on the object's list</td></tr>
      <tr><td>Matrix view</td><td>A row (per subject)</td><td>A column (per object)</td></tr>
      <tr><td>Analogy</td><td>A movie ticket: whoever holds it gets in</td><td>A guest list at the door</td></tr>
      <tr><td>Easy to answer</td><td>"What can this subject access?"</td><td>"Who can access this object?"</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Misconception</span><p>"Linux capabilities" (CAP_KILL, etc.) and "capabilities" in the capability-vs-ACL sense are different concepts that share a name. Read the question carefully.</p></div>

  <h3 id="l04a-sandbox">Sandboxing: desktops, mobile, and Chrome</h3>
  <h4>Big picture</h4>
  <p>User-based permissions protect users from <em>each other</em>, but not from the programs they run. Sandboxing isolates applications from each other even within one user account.</p>
  <h4>Explanation</h4>
  <p><strong>Weak protection on desktops:</strong> a malicious application running as you has access to all your files. The slide's example: Adobe Acrobat (running as you) could edit, delete, or encrypt and ransom all your data. This is the "cannot separate applications within a user account" con from UNIX.</p>
  <div class="box def"><span class="lbl">Definition: sandbox</span>
    <dl>
      <dt>Plain English</dt><dd>A restricted box a program runs in, where it can only touch what it was explicitly allowed.</dd>
      <dt>Technical</dt><dd>An execution environment in which the OS mediates the program's access to resources and denies anything not explicitly granted.</dd>
      <dt>Why it matters</dt><dd>A compromised sandboxed app cannot reach your other data.</dd>
    </dl>
  </div>
  <ul>
    <li><strong>macOS App Sandbox</strong> mediates access to hardware (camera, microphone, USB, printer), network connections (inbound or outbound), app data (calendar, location, contacts), and user files (Downloads, Pictures, Music, Movies, user-selected files). Access to any resource not requested in the project definition is rejected at run time.</li>
    <li><strong>Android process isolation</strong> uses Linux plus its own application sandbox. Each app runs with <strong>its own UID</strong> in its own VM, so apps cannot interact with one another, and access to system resources is limited (decided at installation time). A <strong>reference monitor</strong> (a component that checks every access against policy) checks permissions on inter-component communication. Notice the reuse: Android turns the UNIX <em>user</em> boundary into an <em>app</em> boundary.</li>
  </ul>

  <h4>Chrome's security architecture</h4>
  <p><strong>Diagram explained: Pre-2006 vs. modern.</strong> On the left, a single "Browser Process" box contains everything: tabs, plugins, and the browser UI all share one process, so a bug anywhere compromises everything. On the right, the modern design splits work into separate processes: Network, Browser, UI, Storage, GPU, Device, Renderer, and Plugin, with dashed lines showing that they communicate through defined channels.</p>
  <div class="tw"><table>
    <thead><tr><th>Process</th><th>Responsibility</th></tr></thead>
    <tbody>
      <tr><td>Browser process</td><td>The "chrome" of the app (address bar, bookmarks) plus invisible privileged work such as network requests</td></tr>
      <tr><td>Renderer process</td><td>Everything inside the tab where a website is displayed (HTML, CSS, JavaScript)</td></tr>
      <tr><td>Plugin process</td><td>Plugins used by the site (e.g., Flash)</td></tr>
      <tr><td>GPU process</td><td>GPU tasks, isolated because the GPU handles requests from many apps and draws them on the same surface</td></tr>
    </tbody>
  </table></div>
  <p><strong>Diagram explained: process-based site isolation.</strong> A browser window shows a page from <code>a.com</code> containing two iframes, <code>b.com</code> and <code>c.com</code>. Each iframe is drawn connected to its <em>own</em> renderer process, and a.com has a separate renderer too. Content from different sites never shares a process, so a compromised renderer for one site cannot read another site's data (such as your bank's cookies).</p>

  <div class="box def"><span class="lbl">Definition: broker architecture</span>
    <dl>
      <dt>Plain English</dt><dd>One trusted supervisor process does privileged things on behalf of untrusted sandboxed workers.</dd>
      <dt>Technical</dt><dd>The main browser process is the privileged controller of the sandboxed processes. A renderer's only network access is through its parent browser process, and its file system access can be restricted.</dd>
      <dt>Why it matters</dt><dd>Privilege separation: the code parsing hostile web content (renderer) holds almost no privilege.</dd>
    </dl>
  </div>
  <div class="box proc"><span class="lbl">Process: how Chrome sandboxes a renderer on Windows (four layers)</span>
    <ol>
      <li><strong>Restricted token.</strong> Chrome calls <code>CreateRestrictedToken</code> to make a token with a subset of the user's privileges, and assigns user and group <strong>S-1-0-0 (Nobody, the null SID)</strong>. This removes access to nearly every system resource: as long as disk root directories have non-null security, no files (even ones with null ACLs) are reachable, and there is no network access (Vista and later).</li>
      <li><strong>Job object.</strong> The renderer runs as a Windows "Job," not an interactive process, eliminating access to desktop and display settings, the clipboard, creating subprocesses, and the global atoms table.</li>
      <li><strong>Alternate desktop.</strong> Windows on the same desktop are effectively in one security context, because window messages are not security-checked. Messages cannot cross desktops, so Chrome puts sandboxed processes on an extra desktop, preventing them from snooping on the user's interactions (e.g., keystrokes).</li>
      <li><strong>Integrity levels.</strong> Windows Vista introduced levels: <em>untrusted, low, medium, high, system</em>. Most processes run at medium. A low-integrity process can read but not write most files (it cannot write "up" to higher-integrity objects).</li>
    </ol>
    <p><strong>Why it exists:</strong> defense in depth. Each layer blocks a different escape route. <strong>Common exam question:</strong> "Name the mechanisms Chrome uses to sandbox renderers and what each blocks."</p>
  </div>

  <div class="box proc"><span class="lbl">L04a in one breath</span>
    <p>Bugs are inevitable, so systems use <strong>defense in depth, least privilege, and privilege separation</strong>. UNIX subjects are users and processes, objects are files, and ls -l permissions are checked <strong>owner → group → other</strong>, stopping at the first match (octal digit = 4r + 2w + 1x). Processes carry EUID, RUID, and SUID; <strong>setuid() drops privilege, the setuid bit gains it</strong>, and the SSH seteuid bug shows why you must drop completely. Linux capabilities split root; Windows uses SIDs, DACLs, SACLs, and tokens; capabilities are tickets while ACLs are guest lists. Sandboxes isolate apps within one user, and Chrome layers process isolation, site isolation, a broker, and four Windows sandbox mechanisms.</p>
  </div>

  <div class="box exam"><span class="lbl">L04a exam checklist</span>
