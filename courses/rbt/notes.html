    <p><em>"There are no study notes for this course. This 30-minute training is a quick review of how to locate BIPs in CentralReach and behavior reduction data collection procedures."</em></p>
    <p><strong>Your challenge:</strong> ask your center leadership for a Behavior Intervention Plan (BIP) to review. Discuss how to implement it effectively so you fully understand the procedures and expectations.</p>
  </div>
  <div class="box warn"><span class="lbl">Workplace-specific</span>
    <p>Like <a href="#rbt31">RBT31</a>, this is about your employer's software rather than BACB content. The transferable part is <a href="#rbt33-anatomy">RBT33</a>: know the nine BIP components so that when you open one, you know what you're looking at and what you're looking <em>for</em>.</p>
  </div>
</section>

<section class="lecture prose" id="rbt42">
  <div class="plate"><span class="num" aria-hidden="true">42</span><p class="ttl">Documentation and session notes</p><p class="src">60-minute course · What belongs in a session note · The NOTES acronym · Billable vs non-billable under CPT 97153 · Reporting variables · Ethical, professional, timely documentation</p></div>

  <h3 id="rbt42-notes">The NOTES framework</h3>
  <div class="box def"><span class="lbl">Definition: NOTES</span>
    <p>A quick guide for writing clear, complete session notes.</p>
    <div class="tw"><table>
      <thead><tr><th>Letter</th><th>Stands for</th><th>What it means</th></tr></thead>
      <tbody>
        <tr><td><strong>N</strong></td><td><strong>Novel</strong></td><td>Each note should be <strong>unique to that day's session</strong>. Avoid copying.</td></tr>
        <tr><td><strong>O</strong></td><td><strong>Observation</strong></td><td>Describe <strong>what you saw, not what you felt</strong>. Use measurable terms.</td></tr>
        <tr><td><strong>T</strong></td><td><strong>Treatment plan</strong></td><td>Connect actions to <strong>specific client goals and programs</strong>.</td></tr>
        <tr><td><strong>E</strong></td><td><strong>Evaluation</strong></td><td>Summarize <strong>how the client responded</strong> to interventions.</td></tr>
        <tr><td><strong>S</strong></td><td><strong>Summary</strong></td><td>Provide a clear <strong>close-out of the session and next steps</strong>.</td></tr>
      </tbody>
    </table></div>
    <p><strong>Tip:</strong> a good note answers the question, <em>"If someone else read this, would they know what happened today and what to do next?"</em></p>
  </div>
  <div class="box warn"><span class="lbl">Watch out: the O is RBT06 again</span>
    <p>"Describe what you saw, not what you felt. Use measurable terms" is the <a href="#rbt06-observable">observable language</a> rule applied to prose. "Client was frustrated" fails the O. "Client pushed materials away three times and left the table twice" passes.</p>
  </div>

  <h3 id="rbt42-billable">Billable vs non-billable (CPT 97153)</h3>
  <div class="tw"><table>
    <thead><tr><th>Billable activities</th><th>Non-billable activities</th></tr></thead>
    <tbody>
      <tr><td>Implementing the treatment plan</td><td>Waiting for client arrival</td></tr>
      <tr><td>Collecting data</td><td>Talking to parents after session (off the clock)</td></tr>
      <tr><td>Delivering reinforcement</td><td>Travel time</td></tr>
      <tr><td>Managing behaviors per plan</td><td>Client napping or off-task due to external factors</td></tr>
    </tbody>
  </table></div>
  <div class="box def"><span class="lbl">The rule in one line each</span>
    <p><strong>Billable</strong> = active, face-to-face intervention aligned with the treatment plan.</p>
    <p><strong>Non-billable</strong> = anything that pauses, interrupts, or falls outside intervention delivery.</p>
  </div>

  <h3 id="rbt42-quality">High-quality documentation checklist</h3>
  <p>Before submitting, ask yourself:</p>
  <ul class="checklist">
    <li>Are times and details correct?</li>
    <li>Is the language objective, not opinion-based?</li>
    <li>Did I describe programs run and client responses?</li>
    <li>Are variables noted if something affected the session?</li>
    <li>Did I sign and submit <strong>within 24 hours</strong>?</li>
  </ul>
  <p><strong>Remember: late or incomplete notes may delay client progress and data analysis.</strong></p>

  <h3 id="rbt42-variables">Reporting variables that affect progress</h3>
  <div class="tw"><table>
    <thead><tr><th>Report if it affected progress, engagement, or session integrity</th><th>Do not report</th></tr></thead>
    <tbody>
      <tr><td>Illness or fatigue</td><td rowspan="5">Clothing or hairstyles · minor mood shifts · typical daily fluctuations <strong>without impact on progress</strong></td></tr>
      <tr><td>Medication changes</td></tr>
      <tr><td>Family or schedule disruptions</td></tr>
      <tr><td>Environmental distractions</td></tr>
      <tr><td>Major behavioral or mood changes</td></tr>
    </tbody>
  </table></div>
  <p><strong>If you're unsure, report and consult your Center Leadership.</strong></p>
  <div class="box warn"><span class="lbl">Watch out: the test is <em>impact</em>, not interest</span>
    <p>The "do not report" column isn't about privacy so much as relevance — a minor mood shift with no impact on progress is noise in the record. The deciding question for every variable is: <strong>did this affect progress, engagement, or session integrity?</strong> And when you can't tell, the manual's instruction is to report and ask.</p>
  </div>

  <h3 id="rbt42-gloss">RBT42 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>NOTES acronym</td><td>Novel, Observation, Treatment plan, Evaluation, Summary — a guide to complete session notes</td><td>Used for every session note</td><td>N-O-T-E-S</td><td>Documentation standard</td><td>—</td></tr>
      <tr><td>Novel (note)</td><td>Each note should be unique to that day's session; avoid copying</td><td>Not a copy-paste of yesterday</td><td>New every day</td><td>—</td><td>Cloned note</td></tr>
      <tr><td>CPT 97153</td><td>The billing code for direct ABA services; billable means active face-to-face intervention aligned with the treatment plan</td><td>Running programs, taking data</td><td>Direct service code</td><td>—</td><td>Non-billable time</td></tr>
      <tr><td>Billable Activity</td><td>Active, face-to-face intervention aligned with the treatment plan</td><td>Delivering reinforcement</td><td>You're doing the work</td><td>—</td><td>Non-billable activity</td></tr>
      <tr><td>Non-Billable Activity</td><td>Anything that pauses, interrupts, or falls outside intervention delivery</td><td>Travel time; client napping</td><td>Not delivering treatment</td><td>—</td><td>Billable activity</td></tr>
      <tr><td>Session Variables</td><td>Factors like illness, medication changes, disruptions or distractions that influence progress and must be documented</td><td>"Client slept 3 hours"</td><td>What changed today</td><td>Setting events</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT42 in one breath</span>
    <p>Write session notes with the <strong>NOTES</strong> framework: <strong>Novel</strong> (unique to that day, never copied), <strong>Observation</strong> (what you saw, not what you felt, in measurable terms), <strong>Treatment plan</strong> (connect actions to specific goals and programs), <strong>Evaluation</strong> (how the client responded) and <strong>Summary</strong> (close-out and next steps) — the test being whether another reader would know what happened and what to do next. Under <strong>CPT 97153</strong>, <strong>billable</strong> means active, face-to-face intervention aligned with the treatment plan (implementing the plan, collecting data, delivering reinforcement, managing behavior per plan), while <strong>non-billable</strong> is anything that pauses, interrupts, or falls outside it (waiting for arrival, off-the-clock parent conversations, travel, a napping or externally off-task client). Before submitting, check that <strong>times and details are correct, the language is objective, programs and responses are described, variables are noted, and it is signed and submitted within 24 hours</strong>. <strong>Report</strong> illness or fatigue, medication changes, family or schedule disruptions, environmental distractions and major behavioral or mood changes; <strong>don't report</strong> clothing, hairstyles, minor mood shifts, or typical fluctuations with no impact — and when unsure, report and consult Center Leadership.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT42 exam checklist</span>
    <ul class="checklist">
      <li>Give the NOTES acronym and what each letter means.</li>
      <li>State the test for whether a note is good enough.</li>
      <li>Sort activities into billable and non-billable under CPT 97153, and give the one-line rule for each.</li>
      <li>Recite the five-item high-quality documentation checklist, including the time limit.</li>
      <li>Name five variables you must report and three you should not.</li>
      <li>State the deciding question for whether a variable gets reported.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt43">
  <div class="plate"><span class="num" aria-hidden="true">43</span><p class="ttl">Ethics in documentation</p><p class="src">No study notes in the manual</p></div>
  <div class="box proc"><span class="lbl">No notes in the manual</span>
    <p>The manual lists RBT43 as having no notes. (The placeholder text printed on this page duplicates RBT27's social-skills wording, which appears to be a copy-paste slip in the source document rather than guidance about documentation.)</p>
  </div>
  <div class="box warn"><span class="lbl">What to study instead</span>
    <p>The documentation ethics content you are accountable for is already covered in two places. From <a href="#rbt11-section2">RBT11, Section 2</a>: RBTs <strong>accurately complete all required documentation</strong> (#2); <strong>protect confidentiality and privacy</strong> following BACB, employer and legal requirements (#8); <strong>never post identifying client information on social media or websites</strong> (#9); and <strong>only share necessary client information in job-related communications</strong> (#10). From <a href="#rbt42">RBT42</a>: objective language, accurate times, noting variables, and signing within 24 hours. Treat those as the content of this module.</p>
  </div>
</section>

<section class="lecture prose" id="rbt44">
  <div class="plate"><span class="num" aria-hidden="true">44</span><p class="ttl">Communication and collaboration</p><p class="src">60-minute course · Communicating with supervisors, coworkers and parents · Collaborating with team members</p></div>

  <h3 id="rbt44-seeking">Seeking direction from a supervisor</h3>
  <div class="tw"><table>
    <thead><tr><th>Topic</th><th>Examples</th></tr></thead>
    <tbody>
      <tr><td><strong>Program concerns</strong></td><td>Client is not making progress on a goal or skill · regressing on a skill · resistant to a program · displaying challenging behaviors during specific programs</td></tr>
      <tr><td><strong>Caregiver concerns</strong></td><td>Caregiver disagrees with the treatment plan · asks for changes to it · seems overwhelmed, frustrated or confused · reports new medical issues and/or medications</td></tr>
      <tr><td><strong>Data irregularities</strong></td><td>Data showing inconsistent responding across sessions or days · trending low for previously mastered skills</td></tr>
      <tr><td><strong>Supervision &amp; training needs</strong></td><td>Unsure how to follow teaching instructions · feels uncomfortable or unqualified to implement a program or work with a client · unsure how to respond safely to a new or challenging behavior · having difficulty collecting accurate data</td></tr>
    </tbody>
  </table></div>
  <p><strong>How to seek direction:</strong> identify the right time · use <strong>objective, behavior-specific language</strong> when describing concerns or questions · use preferred communication methods (email, Teams, in-person meetings) · request feedback in regular supervision sessions, <strong>but reach out in between if needed</strong>.</p>

  <h3 id="rbt44-team">The client's team and case management</h3>
  <div class="tw"><table>
    <thead><tr><th>Role</th><th>Responsibilities re: case management</th></tr></thead>
    <tbody>
      <tr><td><strong>RBT</strong></td><td>Implements programs, collects data, and observes client behavior. <strong>Contacts BCBA with any questions or information.</strong></td></tr>
      <tr><td><strong>Clinical Supervisor (CS)</strong></td><td><strong>Makes clinical decisions</strong>, analyzes data, modifies programs, and provides supervision to the client and RBT.</td></tr>
      <tr><td><strong>Center Director (CD)</strong></td><td>Oversees the CSs, handles broader clinical, organizational and/or ethical concerns, works with operations staff to manage and lead the center.</td></tr>
      <tr><td><strong>Operations Leader</strong></td><td>Administrative or operational support — scheduling, resources, documentation processes. <strong>Does not conduct ABA clinical duties.</strong></td></tr>
      <tr><td><strong>Intern</strong></td><td>Assists with treatment decisions, trains on and supports data collection, session implementation, or observation. <strong>Do not make independent treatment decisions.</strong></td></tr>
      <tr><td><strong>Lead RBT</strong></td><td>Provides mentoring and guidance to other RBTs on basic session procedures, helps clarify routine questions about session logistics and implementation strategies. <strong>Do not make independent treatment decisions.</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: who can change a program</span>
    <p>Only the <strong>Clinical Supervisor</strong> makes clinical decisions and modifies programs. <strong>Lead RBTs and interns explicitly cannot make independent treatment decisions</strong> — so "my Lead RBT told me to do it differently" is not a defence. That's also <a href="#rbt30">RBT30</a>'s "mixed messages" barrier: go to the BCBA for clarification.</p>
  </div>

  <h3 id="rbt44-strategies">Professional and effective communication</h3>
  <div class="tw"><table>
    <thead><tr><th>Guideline</th><th>What it means</th></tr></thead>
    <tbody>
      <tr><td><strong>Language and tone</strong></td><td>Use clear, respectful, appropriate language. Maintain a <strong>calm and confident tone, even in stressful situations</strong>.</td></tr>
      <tr><td><strong>Empathy</strong></td><td>Be empathetic to families and clients who may be facing challenges. <strong>Acknowledge concerns with kindness.</strong></td></tr>
      <tr><td><strong>Objectivity</strong></td><td><strong>Report only what you observe</strong>, using specific, measurable language.</td></tr>
      <tr><td><strong>Confidentiality</strong></td><td>Follow <strong>HIPAA</strong> and company policies regarding client information.</td></tr>
    </tbody>
  </table></div>
  <div class="tw"><table>
    <thead><tr><th>Communication barriers</th><th>Solutions</th></tr></thead>
    <tbody>
      <tr><td>Fear of speaking up · misunderstanding instructions · cultural or language differences · emotional reactions · differences in communication styles</td><td><strong>Be proactive · stay professional · listen actively · check your understanding</strong></td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt44-feedback">Responding professionally to feedback</h3>
  <div class="box proc"><span class="lbl">Process: how to accept and apply feedback</span>
    <ol>
      <li><strong>Receive the feedback professionally</strong></li>
      <li><strong>Clarify and confirm understanding</strong></li>
      <li><strong>Reflect on the feedback</strong></li>
      <li><strong>Apply the feedback in sessions</strong></li>
      <li><strong>Ask for follow-up or coaching</strong></li>
      <li><strong>Keep a growth mindset</strong></li>
    </ol>
  </div>
  <div class="box warn"><span class="lbl">This is an ethics requirement, not just good manners</span>
    <p><a href="#rbt11-section2">RBT11, responsibility #3</a>: RBTs conduct themselves professionally and <strong>take action to improve their performance following feedback from supervisors</strong>. Step 4 — <em>apply the feedback in sessions</em> — is the part the code actually requires.</p>
  </div>

  <div class="box proc"><span class="lbl">RBT44 in one breath</span>
    <p>Go to your supervisor about <strong>program concerns</strong> (no progress, regression, resistance, challenging behavior in specific programs), <strong>caregiver concerns</strong> (disagreement, requested changes, overwhelm, new medical issues or medications), <strong>data irregularities</strong> (inconsistent responding, mastered skills trending low) and <strong>supervision and training needs</strong> (unsure how to run something, feeling unqualified, unsafe behavior, difficulty collecting data) — identifying the right time, using <strong>objective, behavior-specific language</strong>, their preferred channel, and reaching out between supervision sessions if needed. On the team, <strong>RBTs implement, collect data and observe; the Clinical Supervisor makes clinical decisions and modifies programs; the Center Director handles broader clinical, organisational and ethical concerns; the Operations Leader does administrative support and no clinical duties; and interns and Lead RBTs assist but do not make independent treatment decisions</strong>. Communicate with clear respectful language and a calm confident tone, empathy for families, <strong>only what you observe</strong>, and HIPAA-compliant confidentiality; get past barriers by being <strong>proactive, staying professional, listening actively and checking your understanding</strong>. Take feedback in six steps: <strong>receive it professionally, clarify and confirm, reflect, apply it in sessions, ask for follow-up or coaching, and keep a growth mindset</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT44 exam checklist</span>
    <ul class="checklist">
      <li>Name the four topics to communicate to your supervisor, with examples.</li>
      <li>Describe how to seek direction from a supervisor.</li>
      <li>Name the six team roles and the responsibility of each.</li>
      <li>Say who may make clinical decisions and modify programs, and who may not.</li>
      <li>List the four effective communication guidelines.</li>
      <li>Name five communication barriers and four solutions.</li>
      <li>List the six steps for accepting and applying feedback.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt45">
  <div class="plate"><span class="num" aria-hidden="true">45</span><p class="ttl">Ethical supervision</p><p class="src">30-minute course · Ethical standards for supervision · Advocating for effective supervision practices</p></div>

  <h3 id="rbt45-standards">Signs of ethical supervision</h3>
  <div class="tw"><table>
    <thead><tr><th>Sign</th><th>Code reference</th></tr></thead>
    <tbody>
      <tr><td>Your supervisor <strong>trains and observes you before asking you to use a procedure</strong></td><td>RBT 2.05, BA 4.06</td></tr>
      <tr><td>You receive <strong>regular feedback</strong></td><td>BA 4.08</td></tr>
      <tr><td>You have <strong>supervision meetings regularly, and they are meaningful</strong></td><td>BA 4.05</td></tr>
      <tr><td>You <strong>clearly know which tasks are assigned to you</strong></td><td>RBT 1.03, BA 4.09</td></tr>
      <tr><td>Your supervisor <strong>encourages you to ask questions and express concerns, and follows up on those concerns</strong></td><td>RBT 2.06</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: supervision has standards you can cite</span>
    <p>The point of the right-hand column is that these aren't preferences — they are <strong>code requirements</strong>, and you can point at them. "My supervisor hasn't observed me on this procedure" isn't a complaint about style; it's RBT 2.05 and BA 4.06. The manual's advice on advocating includes <strong>"use the codes as a reference."</strong></p>
  </div>

  <h3 id="rbt45-advocating">What effective supervision feels like, and looks like</h3>
  <p><strong>You should feel:</strong> confident · supported · competent · empowered · effective.</p>
  <div class="tw"><table>
    <thead><tr><th>What it looks like</th><th>Meaning</th></tr></thead>
    <tbody>
      <tr><td><strong>Clear expectations</strong></td><td>You should know what your role is, what tasks you're responsible for, and <strong>what is outside your scope</strong>.</td></tr>
      <tr><td><strong>Effective, hands-on training</strong></td><td>Your supervisor <strong>models the skill, you practice the skill, your supervisor observes you, provides feedback, and verifies your competence</strong>.</td></tr>
      <tr><td><strong>Supervisory observations</strong></td><td>Observations help monitor client progress, identify training needs, and support your growth.</td></tr>
      <tr><td><strong>Regular and constructive feedback</strong></td><td>You should receive <strong>positive feedback, constructive feedback, and timely feedback</strong>.</td></tr>
    </tbody>
  </table></div>
  <p><strong>How to advocate for effective supervision:</strong> ask questions · request observation · follow up on missed supervision · <strong>use the codes as a reference</strong>.</p>
  <div class="box warn"><span class="lbl">The training sequence is the one to memorise</span>
    <p><strong>Model → practice → observe → feedback → verify competence.</strong> That five-step sequence is what "trained" actually means, and it's the same standard referenced in <a href="#rbt11-section2">RBT11 #5</a> (competence verified before restrictive procedures) and <a href="#rbt37-considerations">RBT37</a> (directly trained before implementing punishment). If you've only watched a video, you haven't been trained.</p>
  </div>

  <div class="box proc"><span class="lbl">RBT45 in one breath</span>
    <p><strong>Ethical supervision</strong> has five recognisable signs, each backed by a code citation: your supervisor <strong>trains and observes you before asking you to use a procedure</strong> (RBT 2.05, BA 4.06), you get <strong>regular feedback</strong> (BA 4.08), you have <strong>regular and meaningful supervision meetings</strong> (BA 4.05), you <strong>clearly know which tasks are assigned to you</strong> (RBT 1.03, BA 4.09), and your supervisor <strong>encourages questions and concerns and follows up on them</strong> (RBT 2.06). Effective supervision should make you feel <strong>confident, supported, competent, empowered and effective</strong>, and should look like <strong>clear expectations</strong> (including what's outside your scope), <strong>hands-on training</strong> that runs <strong>model → practice → observe → feedback → verify competence</strong>, <strong>supervisory observations</strong>, and <strong>regular, constructive, timely feedback</strong>. Advocate for it by <strong>asking questions, requesting observation, following up on missed supervision, and using the codes as a reference</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT45 exam checklist</span>
    <ul class="checklist">
      <li>Name the five signs of ethical supervision and the code sections behind them.</li>
      <li>List the five things effective supervision should make you feel.</li>
      <li>Name the four things effective supervision looks like.</li>
      <li>Give the five-step hands-on training sequence.</li>
      <li>List four ways to advocate for effective supervision.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt46">
  <div class="plate"><span class="num" aria-hidden="true">46</span><p class="ttl">Ethical dilemmas, problem-solving, and reporting violations</p><p class="src">60-minute course · Identifying and analyzing potential violations · When and how to report · Resources for ethical practice</p></div>

  <h3 id="rbt46-identifying">Identifying ethical violations</h3>
  <p><strong>YOU are responsible for being knowledgeable on when to report ethical violations</strong> — towards <strong>yourself</strong>, <strong>other RBTs</strong>, and <strong>behavior analysts</strong>. That means knowing <strong>both codes</strong>: the <strong>RBT Ethics Code</strong> and the <strong>Ethics Code for Behavior Analysts</strong>. You can always find them at <strong>www.bacb.com</strong>.</p>
  <div class="box proc"><span class="lbl">Process: the ethical decision-making process</span>
    <ol>
      <li><strong>Recognize and describe the concern.</strong> Identify what's happening and why it might matter. <strong>Focus on facts, not assumptions.</strong> Who is involved? Could there be a risk to the client or anyone else?</li>
      <li><strong>Check the code.</strong> Look to the Ethics Code for guidance. Which areas apply — client safety, boundaries, honesty, competence?</li>
      <li><strong>Talk to the right people.</strong> Share your concern with your supervisor or BCBA. They will help review the situation and support next steps.</li>
      <li><strong>Act, document and follow up.</strong> Work with your BCBA on next steps. Keep clear notes <em>(while maintaining confidentiality)</em> and <strong>stay involved until the issue is fully resolved</strong>.</li>
    </ol>
  </div>

  <h3 id="rbt46-reporting">Reporting ethical violations</h3>
  <div class="box proc"><span class="lbl">Process: the five reporting steps</span>
    <ol>
      <li><strong>Gather &amp; document objective information.</strong> Write down <strong>only what you directly observed</strong> — dates, events, and facts — <strong>without investigating or adding assumptions</strong>. This keeps your documentation clear and unbiased.</li>
      <li><strong>Report to your supervisor.</strong> Report suspected concerns <strong>promptly and privately</strong> to your Supervisor or BCBA, as required by the Ethics Code. This ensures proper guidance <strong>before any external reporting</strong>.</li>
      <li><strong>Report factually and professionally.</strong> Stick to the facts — <strong>who, what, when, and where</strong> — avoiding opinions or assumptions. Use professional, respectful language and <strong>keep information confidential</strong>.</li>
      <li><strong>Follow the response plan.</strong> Work with your Supervisor to carry out the agreed plan and stay engaged throughout. This may involve HR, compliance, or client services. Response plans may include <strong>training/re-training, documentation corrections, or protocol revisions</strong>.</li>
      <li><strong>Escalate to the BACB, if appropriate.</strong> If the issue is <strong>not resolved or is egregious</strong>, it may be appropriate to escalate through a <strong>Notice of Alleged Violation</strong>. Your Supervisor and compliance department should be involved and support you.</li>
    </ol>
  </div>
  <div class="box warn"><span class="lbl">Watch out: "without investigating"</span>
    <p>Step 1 says to document what you <em>directly observed</em> and explicitly <strong>not to investigate</strong>. Interviewing colleagues or gathering evidence yourself is not your role and can compromise a legitimate process. Observe, write it down, report it, follow the plan.</p>
  </div>

  <h3 id="rbt46-bacb">BACB considerations and what happens next</h3>
  <p><strong>Before reporting to the BACB, consider:</strong></p>
  <ul>
    <li>Can this be resolved by addressing it <strong>directly with the individual</strong>?</li>
    <li>Does the BACB have <strong>jurisdiction</strong> over the individual?</li>
    <li>Is there a violation of a <strong>specific ethics requirement</strong>?</li>
    <li>Is there <strong>supporting documentation</strong> of the alleged violation?</li>
    <li>Did it occur, or were you made aware, <strong>in the last 6 months</strong>?</li>
    <li>Should it be reported to <strong>other agencies first</strong>?</li>
  </ul>
  <div class="tw"><table>
    <thead><tr><th>After reporting to the BACB</th><th>What it involves</th></tr></thead>
    <tbody>
      <tr><td><strong>BACB intake &amp; review</strong></td><td>Outcomes: <strong>no further action · initiation of Consent Agreement · prescribed consequences</strong></td></tr>
      <tr><td><strong>Disciplinary review &amp; outcomes</strong></td><td><strong>Corrective actions · sanctions</strong></td></tr>
      <tr><td><strong>Ongoing responsibilities</strong></td><td><strong>Remain confidential · provide honest and factual follow-up information · document future observations</strong></td></tr>
    </tbody>
  </table></div>
  <p><em>The outcome isn't always punishment — it's often an opportunity to improve and prevent future issues.</em></p>

  <h3 id="rbt46-resources">Ethics resources</h3>
  <div class="tw"><table>
    <thead><tr><th>Source</th><th>What's there</th></tr></thead>
    <tbody>
      <tr><td><strong>Your supervisor</strong></td><td>The first stop, every time</td></tr>
      <tr><td><strong>BSP ethics resources</strong></td><td>Ethics Committee · policies, SOPs and related information</td></tr>
      <tr><td><strong>BACB resources</strong></td><td>RBT Ethics Code · Ethics Code for Behavior Analysts · Code Enforcement Procedures. The BACB has an entire section of its website for ethics information at <strong>www.bacb.com/ethics-information/</strong></td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT46 in one breath</span>
    <p><strong>You</strong> are responsible for knowing when to report ethical violations — by <strong>yourself, other RBTs, and behavior analysts</strong> — which means knowing <strong>both the RBT Ethics Code and the Ethics Code for Behavior Analysts</strong>, available at bacb.com. The <strong>decision-making process</strong> is <strong>recognize and describe the concern (facts, not assumptions), check the code, talk to the right people, then act, document and follow up until it's resolved</strong>. <strong>Reporting</strong> runs five steps: <strong>gather and document only what you directly observed without investigating; report promptly and privately to your supervisor first; report factually — who, what, when, where — and keep it confidential; follow the agreed response plan (which may mean re-training, documentation corrections or protocol revisions); and escalate to the BACB through a Notice of Alleged Violation if the issue is unresolved or egregious</strong>. Before escalating, consider whether it can be resolved directly, whether the BACB has jurisdiction, whether a specific requirement was violated, whether you have documentation, whether it occurred or you learned of it <strong>in the last 6 months</strong>, and whether other agencies should be told first. Afterward you must <strong>remain confidential, provide honest factual follow-up, and document future observations</strong> — and outcomes are often corrective rather than punitive.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT46 exam checklist</span>
    <ul class="checklist">
      <li>State whose conduct you are responsible for reporting, and which two codes you must know.</li>
      <li>List the four steps of the ethical decision-making process.</li>
      <li>List the five steps of reporting an ethical violation.</li>
      <li>Explain why you document but do not investigate.</li>
      <li>Say who you report to first and why.</li>
      <li>Name the six BACB considerations before reporting, including the time limit.</li>
      <li>Describe what happens after a BACB report and your three ongoing responsibilities.</li>
      <li>Name the ethics resources available to you.</li>
    </ul>
  </div>
</section>
