<section id="how" class="prose">
  <h2>How to use these notes</h2>
  <p>This is the whole RBT training manual rewritten as a study site. Every module from the BlueSprig <em>RBT Training TCO-3</em> course notes is here: all 39 modules that have notes, every terminology table, and every "Critical Information" page. The eight modules the manual marks <em>no notes</em> are included too, with what they ask you to do instead.</p>

  <h3 id="how-read">Reading</h3>
  <p>Notes open <strong>one section per screen</strong>, with a bar at the top showing where you are and <strong>Back to / Up next</strong> buttons at the bottom. Arrow keys page through. If you'd rather scroll the whole module at once, hit <strong>Scroll freely</strong> in the sidebar — it remembers which you prefer.</p>

  <h3 id="how-quiz">Quizzing yourself</h3>
  <p>This is the part to lean on. There are three layers, smallest to largest:</p>
  <div class="tw"><table>
    <thead><tr><th>Layer</th><th>Where</th><th>Use it for</th></tr></thead>
    <tbody>
      <tr><td><strong>Inline check questions</strong></td><td>The red <em>Check yourself</em> boxes inside each module</td><td>Retrieval practice while you read. Answer out loud <em>before</em> you open the answer — the struggle is the part that builds memory.</td></tr>
      <tr><td><strong>Practice exam</strong></td><td>The <strong>Practice exam</strong> button, top of the sidebar</td><td>Pick any modules, any mix of multiple choice / true-false / short answer, any length. Answer everything, then grade it at the end like a real paper exam. Nothing is saved, so you can retake it as often as you want.</td></tr>
      <tr><td><strong>Terminology tables</strong></td><td>The glossary at the end of every module</td><td>SAFMEDS and flashcards. Cover the right-hand column, say the definition, uncover. The manual asks you to be <em>fluent</em> with this vocabulary, not just familiar.</td></tr>
    </tbody>
  </table></div>
  <p>The search box on the home page finds any section across any course, so if a term shows up in a module and you can't place it, search it.</p>

  <h3 id="how-boxes">What the colored boxes mean</h3>
  <div class="legend">
    <div class="box def"><span class="lbl">Definition</span><p>A term and its definition, usually straight from the manual's terminology table, with plain-English wording and why it matters.</p></div>
    <div class="box ex"><span class="lbl">Worked example</span><p>A concrete case worked all the way through — usually the manual's own example, expanded.</p></div>
    <div class="box warn"><span class="lbl">Watch out</span><p>The mistake that is easy to make here, or the distinction the exam likes to test.</p></div>
    <div class="box exam"><span class="lbl">Check yourself</span><p>Retrieval practice. Question on the outside, answer hidden until you click.</p></div>
    <div class="box proc"><span class="lbl">Process · In one breath</span><p>Step-by-step procedures, and each module's one-paragraph summary at the end.</p></div>
    <div class="box bg"><span class="lbl">Builds on</span><p>Which earlier module this one assumes you already know.</p></div>
  </div>

  <h3 id="how-order">Suggested order</h3>
  <p>The modules are numbered in the order the training delivers them, and they do build. If you are studying rather than working through the eLearning, these are the natural clusters:</p>
  <div class="tw"><table>
    <thead><tr><th>Cluster</th><th>Modules</th><th>What it gives you</th></tr></thead>
    <tbody>
      <tr><td><strong>Foundations</strong></td><td>RBT01–RBT05</td><td>Scope of practice and ethics, what ABA is, the 3-term contingency, why behavior happens, and verbal operants. <strong>Everything else assumes these.</strong></td></tr>
      <tr><td><strong>Measurement</strong></td><td>RBT06–RBT08</td><td>Data: why it matters, every data collection procedure, and how to read a graph.</td></tr>
      <tr><td><strong>Getting started</strong></td><td>RBT09–RBT11</td><td>Preparing yourself, the environment, and the client; ethical service delivery.</td></tr>
      <tr><td><strong>Assessment</strong></td><td>RBT12–RBT15</td><td>Skill-based, preference, and functional assessment, and your role in each.</td></tr>
      <tr><td><strong>Skill acquisition</strong></td><td>RBT16–RBT31</td><td>The teaching half: instructional control, prompting and fading, DTT, naturalistic teaching, chaining, shaping, generalization.</td></tr>
      <tr><td><strong>Behavior reduction</strong></td><td>RBT32–RBT41</td><td>BIPs, antecedent strategies, extinction and differential reinforcement, FCT, punishment, severe behavior, staying regulated.</td></tr>
      <tr><td><strong>Professional practice</strong></td><td>RBT42–RBT47</td><td>Documentation, communication, supervision, ethical dilemmas, and certification.</td></tr>
    </tbody>

  <div class="box warn"><span class="lbl">One note on the source</span>
    <p>These notes follow the BlueSprig training manual exactly, including its wording for policies that are <strong>that organization's</strong> rather than the BACB's — for example the requirement that a second adult be present during all services. Where the manual names a specific tool (CentralReach) or a specific employer policy, that is marked. The BACB exam tests the <em>general</em> principles; your workplace tests the specific ones. Both are here.</p>
  </div>

<section class="lecture prose" id="rbt01">
  <div class="plate"><span class="num" aria-hidden="true">01</span><p class="ttl">Ethics and scope of practice</p><p class="src">30-minute course · Scope of practice for RBTs · RBT Ethics Code (2.0)</p></div>

  <p>The first module is the one that governs every other module. <strong>Scope of practice</strong> answers the question "what am I allowed to do?" and the answer is narrower than most new RBTs expect — deliberately so. The code applies to you <em>now</em>, during training, not just after you certify.</p>

  <h3 id="rbt01-what">What scope of practice is</h3>
  <div class="box def"><span class="lbl">Definition: scope of practice</span>
    <dl>
      <dt>Plain English</dt><dd>The list of things you have been trained and authorised to do — and nothing beyond it.</dd>
      <dt>Technical</dt><dd>The specific tasks and responsibilities that RBTs are trained, qualified and authorised to perform <strong>under the supervision of a BCBA or BCaBA</strong>.</dd>
      <dt>Why it matters</dt><dd>Providing services outside your scope — <em>even with the best of intentions</em> — can lead to harm. Good intentions are not a defence.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Inside your scope</th><th>Outside your scope</th></tr></thead>
    <tbody>
      <tr><td>Delivering behavior-analytic services as outlined in a treatment plan</td><td rowspan="3">Creating goals · changing a program · providing independent recommendations</td></tr>
      <tr><td>Collecting and recording data during sessions</td></tr>
      <tr><td>Following your supervisor's instructions exactly as given</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "even before you are certified"</span>
    <p>The manual says it twice, so the exam can too: <strong>you are expected to follow these guidelines now</strong>, during training, before certification. The Ethics Code applies to trainees and certificants alike.</p>
  </div>

  <h3 id="rbt01-why">Why scope of practice matters</h3>
  <p>Your scope defines what you are trained and <em>competent</em> to do. You are <strong>not expected to know everything</strong>. You <em>are</em> expected to do three things:</p>
  <ol>
    <li><strong>Follow your supervisor's instructions.</strong></li>
    <li><strong>Do tasks you've been trained on.</strong></li>
    <li><strong>Ask for help when unsure.</strong></li>
  </ol>
  <p>Notice that the third one is an expectation, not a fallback. Recognising the edge of your competence and saying so is part of doing the job correctly, not an admission that you are doing it badly.</p>

  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A parent asks you to add a new goal because their child has started biting at home. What do you do?</summary><div><p>Nothing to the program. Creating or changing goals is outside your scope. Thank the parent, write down objectively what they told you, and bring it to your supervisor — who will decide whether the BIP or SAP needs changing. Responding to a caregiver concern by changing a program yourself is a scope violation even though the concern is real and the intention is good.</p></div></details>
  </div>

  <h3 id="rbt01-resp">Key responsibilities of RBTs</h3>
  <p>The manual's framing is worth keeping: <em>"You don't have to do it all. You just have to do your part — and do it well. That's what scope of practice is all about."</em> The five items within your scope:</p>
  <ul>
    <li><strong>Implement behavior plans</strong> that were created by your supervisor.</li>
    <li><strong>Collect data</strong> on your client's progress.</li>
    <li><strong>Communicate</strong> effectively and professionally.</li>
    <li><strong>Treat every client with dignity and respect.</strong></li>
    <li><strong>Recognise when something is outside your scope — and speak up.</strong></li>
  </ul>

  <h3 id="rbt01-compassion">Compassion, dignity, and respect</h3>
  <p>Every interaction with clients, families, and coworkers should reflect all three. The manual gives concrete examples of what each looks like in practice, and the distinctions are testable:</p>
  <div class="tw"><table>
    <thead><tr><th>Term</th><th>What it looks like in practice</th></tr></thead>
    <tbody>
      <tr><td><strong>Compassion</strong></td><td>Taking a moment to comfort a client who's just hurt themselves; being patient when a parent is overwhelmed; simply choosing kindness when you're frustrated.</td></tr>
      <tr><td><strong>Dignity</strong></td><td>Offering choices whenever possible to promote autonomy; listening respectfully to their preferences; ensuring they feel heard and valued.</td></tr>
      <tr><td><strong>Respect</strong></td><td>Being on time; using professional and inclusive language; respecting cultural differences; using preferred names and pronouns.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: these three are not synonyms</span>
    <p>If you have to tell them apart on an exam: <strong>compassion</strong> is about feeling <em>with</em> someone in a hard moment. <strong>Dignity</strong> is about autonomy — choices, preferences, being treated as a person whose wants count. <strong>Respect</strong> is about conduct — punctuality, language, culture, names and pronouns. Offering a choice is dignity; showing up on time is respect; sitting with a crying child is compassion.</p>
  </div>

  <h3 id="rbt01-gloss">RBT01 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Scope of Practice</td><td>The specific tasks and responsibilities RBTs are trained, qualified and authorized to perform under the supervision of a BCBA or BCaBA</td><td>Running a SAP as written</td><td>Your lane on the road</td><td>Competence</td><td>Independent practice</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT01 in one breath</span>
    <p><strong>Scope of practice</strong> is the set of tasks you are trained, qualified and authorised to do <strong>under BCBA/BCaBA supervision</strong>, and it applies <strong>during training, not just after certification</strong>. Inside it: delivering services as written in the treatment plan, collecting and recording data, following your supervisor's instructions exactly, communicating professionally, treating clients with dignity, and <strong>speaking up when something falls outside</strong>. Outside it: creating goals, changing programs, giving independent recommendations. You are not expected to know everything — you are expected to follow instructions, do what you've been trained on, and <strong>ask when unsure</strong>, because working outside your scope can cause harm even when your intentions are good. Every interaction should show <strong>compassion</strong> (kindness in hard moments), <strong>dignity</strong> (choices, preferences, autonomy) and <strong>respect</strong> (punctuality, inclusive language, culture, names and pronouns).</p>
  </div>

  <div class="box exam"><span class="lbl">RBT01 exam checklist</span>
    <ul class="checklist">
      <li>Define "scope of practice" in the context of the RBT role.</li>
      <li>Recall that the RBT Ethics Code applies during training and after certification.</li>
      <li>Explain the purpose of the Ethics Code as it relates to consumer protection.</li>
      <li>Sort actions into inside/outside scope, and name the three things you <em>are</em> expected to do.</li>
      <li>Recognise when to seek supervision if asked to perform tasks beyond your training or role.</li>
      <li>List the five key responsibilities within an RBT's scope.</li>
      <li>Describe how to respond when asked to perform a task outside of scope.</li>
      <li>Give an example of compassion, of dignity, and of respect, and tell the three apart.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt02">
  <div class="plate"><span class="num" aria-hidden="true">02</span><p class="ttl">ABA 101 and common phases of treatment</p><p class="src">30-minute course · Purpose and goals of ABA · Common features of ABA programs · Common phases of ABA intervention</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p>Nothing yet — this is the vocabulary module. The manual's own note applies: <em>don't worry if you don't fully understand a concept, they will be covered again in later courses.</em> Your job here is to get the words in your head so later modules have something to attach to.</p>
  </div>

  <h3 id="rbt02-purpose">Purpose and goals of ABA</h3>
  <p><strong>ABA is a scientific approach to understanding and modifying behavior to improve socially significant outcomes.</strong> It has <strong>four primary goals</strong>, and this is a near-certain exam item:</p>
  <div class="tw"><table>
    <thead><tr><th colspan="2">The four goals of ABA</th></tr></thead>
    <tbody>
      <tr><td><strong>Increase desired skills</strong></td><td><strong>Decrease challenging behaviors</strong></td></tr>
      <tr><td><strong>Teach new skills</strong></td><td><strong>Generalize skills</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "increase" and "teach new" are not the same goal</span>
    <p>They look redundant and they are not. <strong>Increasing a desired skill</strong> means the learner already does it and you want more of it. <strong>Teaching a new skill</strong> means it isn't in their repertoire at all. Different starting points, different procedures — shaping and chaining build new skills, reinforcement increases existing ones.</p>
  </div>

  <h3 id="rbt02-dimensions">The 7 dimensions of ABA</h3>
  <p>The <strong>7 dimensions</strong> are the defining features of what it means to practice behavior analysis. The manual's mnemonic is <strong>"GET A CAB"</strong>:</p>
  <div class="tw"><table>
    <thead><tr><th>Letter</th><th>Dimension</th><th>What it means</th></tr></thead>
    <tbody>
      <tr><td><strong>G</strong></td><td><strong>Generalized</strong></td><td>Skills should work in different places, with different people, and last a long time.</td></tr>
      <tr><td><strong>E</strong></td><td><strong>Effective</strong></td><td>ABA only uses strategies that actually work for the individual receiving services.</td></tr>
      <tr><td><strong>T</strong></td><td><strong>Technological</strong></td><td>ABA procedures are clearly defined and replicable.</td></tr>
      <tr><td><strong>A</strong></td><td><strong>Applied</strong></td><td>ABA focuses on behaviors that have real-world significance and improve quality of life.</td></tr>
      <tr><td><strong>C</strong></td><td><strong>Conceptually Systematic</strong></td><td>Interventions are based on established principles of behavior analysis (evidence-based practice).</td></tr>
      <tr><td><strong>A</strong></td><td><strong>Analytic</strong></td><td>ABA relies on data to demonstrate that interventions lead to behavior change.</td></tr>
      <tr><td><strong>B</strong></td><td><strong>Behavioral</strong></td><td>Interventions focus on observable and measurable behaviors, not internal thoughts or feelings.</td></tr>
    </tbody>
  </table></div>
  <p>The module title says "7–8 dimensions" because <strong>compassionate care</strong> is increasingly treated as an eighth: clinicians understand and respect the client's needs, preferences, and emotions while implementing interventions.</p>

  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A program is written so clearly that a brand-new RBT could run it identically. Which dimension is that?</summary><div><p><strong>Technological.</strong> Clearly defined and replicable. It is <em>not</em> "effective" (that's about whether it works) and not "conceptually systematic" (that's about being grounded in behavioral principles).</p></div></details>
    <details><summary>Which dimension rules out writing a goal like "the client will feel more confident"?</summary><div><p><strong>Behavioral</strong> — ABA targets observable and measurable behaviors rather than internal states. You'd rewrite it as something you can see and count, like "raises hand to request help."</p></div></details>
  </div>

  <h3 id="rbt02-phases">Life cycle of an ABA program</h3>
  <p>A <strong>phase</strong> is a distinct period or segment of a treatment or behavior intervention plan. Programs move through four, in order:</p>
  <div class="tw"><table>
    <thead><tr><th class="num">#</th><th>Phase</th><th>What it is</th></tr></thead>
    <tbody>
      <tr><td class="num">1</td><td><strong>Baseline</strong></td><td>The information collected <em>before treatment begins</em>.</td></tr>
      <tr><td class="num">2</td><td><strong>Intervention</strong></td><td>A strategy or plan designed to teach new skills, reduce problem behaviors, and improve overall functioning.</td></tr>
      <tr><td class="num">3</td><td><strong>Generalization</strong></td><td>Learned skills are applied across various settings, situations, and individuals.</td></tr>
      <tr><td class="num">4</td><td><strong>Maintenance</strong></td><td>Learned skills continue to be performed <em>after</em> formal teaching and reinforcement have been reduced or removed.</td></tr>
    </tbody>
  </table></div>

  <h4>Diagram explained: the features of a line graph</h4>
  <p>The manual's graph is titled <em>Requesting with Words</em>, with "# of Requests/Hour" up the left and "Session" along the bottom, and vertical lines splitting it into the four phases. Learn these seven labels by name, because RBT08 tests them again:</p>
  <div class="tw"><table>
    <thead><tr><th>Part</th><th>Where it is</th><th>What it tells you</th></tr></thead>
    <tbody>
      <tr><td><strong>Title</strong></td><td>Top of the graph</td><td>The skill being measured — here, <em>Requesting with Words</em>.</td></tr>
      <tr><td><strong>X-axis</strong></td><td>Horizontal, at the bottom</td><td>Time — days, sessions, or weeks of service.</td></tr>
      <tr><td><strong>Y-axis</strong></td><td>Vertical, on the left</td><td>The behavior being measured.</td></tr>
      <tr><td><strong>Data points</strong></td><td>The dots</td><td>How often or how well the behavior happened in a specific day or session.</td></tr>
      <tr><td><strong>Data path</strong></td><td>The line connecting the dots</td><td>Trends in the behavior over time.</td></tr>
      <tr><td><strong>Phase change line</strong></td><td>Vertical lines</td><td>A shift from one phase of treatment to another (e.g. baseline → intervention).</td></tr>
      <tr><td><strong>Condition labels</strong></td><td>Miniature titles at the top of each section</td><td>Which phase of treatment that section shows.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: X and Y</span>
    <p>Mixing these up is the single most common graph mistake. <strong>X is horizontal and always time</strong> (sessions, days, dates). <strong>Y is vertical and always the behavior</strong> (frequency, percent, duration). "Y to the sky" works.</p>
  </div>

  <h3 id="rbt02-gloss">RBT02 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>ABA</td><td>A scientific approach to understanding and modifying behavior to improve socially significant outcomes</td><td>Teaching a child to mand</td><td>Applied Behavior Analysis</td><td>Behavior analysis</td><td>—</td></tr>
      <tr><td>Evidence-Based Practice</td><td>Interventions that have been rigorously researched and proven effective</td><td>DTT, FCT</td><td>Backed by studies</td><td>Conceptually systematic</td><td>Fad treatment</td></tr>
      <tr><td>Socially Significant</td><td>Behaviors of interest improve quality of life, ability to participate in society, and social interactions</td><td>Requesting, dressing</td><td>Matters in real life</td><td>Applied</td><td>Trivial behavior</td></tr>
      <tr><td>7 Dimensions of ABA</td><td>The defining features of what it means to practice behavior analysis</td><td>GET A CAB</td><td>GET A CAB</td><td>Baer, Wolf &amp; Risley</td><td>—</td></tr>
      <tr><td>Applied</td><td>Focuses on behaviors with real-world significance that improve quality of life</td><td>Toileting, not nonsense syllables</td><td>Applies to real life</td><td>Socially significant</td><td>Basic research</td></tr>
      <tr><td>Behavioral</td><td>Focuses on observable and measurable behaviors rather than internal thoughts or feelings</td><td>"Raises hand", not "wants attention"</td><td>Behavior you can see</td><td>Operational definition</td><td>Mentalistic</td></tr>
      <tr><td>Analytic</td><td>Relies on data to demonstrate that interventions lead to behavior change</td><td>Graphing and comparing phases</td><td>Analyze the data</td><td>Data-based decisions</td><td>Opinion-based</td></tr>
      <tr><td>Conceptually Systematic</td><td>Interventions based on established principles of behavior analysis</td><td>Using reinforcement, not a gadget</td><td>Rooted in the concepts</td><td>Evidence-based</td><td>Atheoretical</td></tr>
      <tr><td>Effective</td><td>Only uses strategies that actually work for the individual receiving services</td><td>Dropping a program that isn't working</td><td>It has to work</td><td>Data-based decisions</td><td>Ineffective practice</td></tr>
      <tr><td>Generalized</td><td>Skills work in different places, with different people, and last a long time</td><td>Mands at home and at school</td><td>Generalizes outward</td><td>Maintenance</td><td>Context-bound skill</td></tr>
      <tr><td>Technological</td><td>Procedures are clearly defined and replicable</td><td>A SAP another RBT can run</td><td>Written like a recipe</td><td>Operational definition</td><td>Vague procedure</td></tr>
      <tr><td>Compassionate Care</td><td>Clinicians understand and respect the client's needs, preferences, and emotions while implementing interventions</td><td>Honoring assent</td><td>The 8th dimension</td><td>Dignity</td><td>—</td></tr>
      <tr><td>Phase</td><td>A distinct period or segment of a treatment or behavior intervention plan</td><td>Baseline, intervention</td><td>A chapter of treatment</td><td>Condition</td><td>—</td></tr>
      <tr><td>Baseline Phase</td><td>The information collected before treatment begins</td><td>5 sessions of data before the BIP</td><td>The "before" picture</td><td>Pre-test</td><td>Intervention phase</td></tr>
      <tr><td>Intervention Phase</td><td>A strategy or plan designed to teach new skills, reduce problem behaviors, improve functioning</td><td>Running the SAP</td><td>Treatment is on</td><td>Treatment phase</td><td>Baseline phase</td></tr>
      <tr><td>Generalization Phase</td><td>Learned skills are applied across settings, situations, and individuals</td><td>Same skill with Dad</td><td>Spread it around</td><td>Varied practice</td><td>Baseline phase</td></tr>
      <tr><td>Maintenance Phase</td><td>Learned skills continue after formal teaching and reinforcement have been reduced or removed</td><td>Weekly probes</td><td>It sticks</td><td>Maintenance probe</td><td>Acquisition</td></tr>
      <tr><td>Graph: Title</td><td>The name of the graph, which describes the skill being measured</td><td>"Requesting with Words"</td><td>Top of the page</td><td>—</td><td>—</td></tr>
      <tr><td>Graph: X-axis</td><td>Horizontal axis at the bottom; represents time (days, sessions, weeks)</td><td>Session 1–22</td><td>X is across</td><td>—</td><td>Y-axis</td></tr>
      <tr><td>Graph: Y-axis</td><td>Vertical axis on the left; represents the behavior being measured</td><td>Requests per hour</td><td>Y to the sky</td><td>—</td><td>X-axis</td></tr>
      <tr><td>Graph: Data Points</td><td>The dots showing how often or how well a behavior happened in a session</td><td>One dot per session</td><td>One dot, one session</td><td>—</td><td>Data path</td></tr>
      <tr><td>Graph: Data Path</td><td>The line connecting data points; shows trends over time</td><td>Rising line</td><td>The path it takes</td><td>Trend</td><td>Data point</td></tr>
      <tr><td>Graph: Phase Change Line</td><td>Vertical line marking a shift from one phase to another</td><td>Baseline → intervention</td><td>A wall between phases</td><td>Condition label</td><td>—</td></tr>
      <tr><td>Graph: Condition Labels</td><td>Miniature titles at the top of each section describing the phase</td><td>"Maintenance"</td><td>Labels the chapters</td><td>Phase label</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT02 in one breath</span>
    <p><strong>ABA</strong> is a scientific approach to understanding and modifying behavior to improve <strong>socially significant</strong> outcomes, with four goals: <strong>increase desired skills, decrease challenging behaviors, teach new skills, generalize skills</strong>. Its defining features are the <strong>7 dimensions — GET A CAB</strong>: Generalized, Effective, Technological, Applied, Conceptually Systematic, Analytic, Behavioral, with <strong>compassionate care</strong> often added as an eighth. Programs run through four <strong>phases</strong> in order — <strong>baseline</strong> (data before treatment), <strong>intervention</strong>, <strong>generalization</strong> (across settings, people, situations), <strong>maintenance</strong> (performance continues after teaching and reinforcement are faded) — and you read that story off a <strong>line graph</strong> whose parts are the <strong>title</strong> (the skill), <strong>X-axis</strong> (time), <strong>Y-axis</strong> (the behavior), <strong>data points</strong> (one session each), <strong>data path</strong> (the trend), <strong>phase change lines</strong> (vertical, marking a switch) and <strong>condition labels</strong> (naming each phase).</p>
  </div>

  <div class="box exam"><span class="lbl">RBT02 exam checklist</span>
    <ul class="checklist">
      <li>Define ABA, evidence-based practice, and socially significant.</li>
      <li>Identify the 4 primary goals of ABA.</li>
      <li>Recite the 7 dimensions from GET A CAB and define each one.</li>
      <li>Name the 8th dimension and what it adds.</li>
      <li>Define the 4 phases of an ABA program and put them in order.</li>
      <li>Label all seven features of a line graph, and say which axis carries time.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt03">
  <div class="plate"><span class="num" aria-hidden="true">03</span><p class="ttl">Foundations of ABA: the 3-term contingency and reinforcement</p><p class="src">30-minute course · Stimuli, responses and the 3-term contingency · 2 types of reinforcement · 4 schedules · Dimensions of reinforcement</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt02">RBT02</a>'s vocabulary. This is the module everything else is built on — <a href="#rbt04">RBT04</a> adds a fourth term to the contingency, <a href="#rbt21">RBT21</a> reuses the dimensions and schedules, and every behavior-reduction module depends on knowing what reinforcement actually is.</p>
  </div>

  <h3 id="rbt03-abc">The 3-term contingency</h3>
  <p>Understanding the 3-term contingency is the building block for everything in ABA. When you can spot the three pieces, you can start to understand <em>why</em> behavior happens and how to teach new skills step by step.</p>
  <div class="box def"><span class="lbl">Definition: the ABCs</span>
    <dl>
      <dt>Antecedent</dt><dd>The stimulus that occurs <strong>immediately before</strong> a target behavior.</dd>
      <dt>Behavior</dt><dd>A response that can be <strong>observed and/or measured</strong>.</dd>
      <dt>Consequence</dt><dd>What happens <strong>right after</strong> the response. It can make the behavior more likely, or less likely, in the future.</dd>
      <dt>The chain</dt><dd>Antecedent → Behavior → Consequence. <em>This chain of events is the foundation for understanding behavior.</em></dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Antecedent</th><th>Behavior</th><th>Consequence</th></tr></thead>
    <tbody>
      <tr><td>"Time to clean up"</td><td>Client cleans up</td><td>High five</td></tr>
      <tr><td>Phone rings</td><td>Answer the phone</td><td>Talk to a friend</td></tr>
      <tr><td>Hot and thirsty</td><td>Take a drink of water</td><td>No longer hot and thirsty</td></tr>
      <tr><td>Teacher tells you there will be a quiz tomorrow</td><td>Study</td><td>Get an "A"</td></tr>
      <tr><td>Client cries</td><td>You comfort them</td><td>Client calms down</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: the last row is about <em>your</em> behavior</span>
    <p>In "Client cries → You comfort them → Client calms down," the behavior being analysed is <strong>yours</strong>, and the consequence (the crying stops) reinforces <em>your</em> comforting. Contingencies run in both directions during a session, which is why the same event can be an antecedent for one person and a consequence for another.</p>
  </div>

  <h3 id="rbt03-reinf">Positive and negative reinforcement</h3>
  <p><strong>Reinforcement</strong> means something happens after a behavior that makes that behavior <strong>more likely to happen again</strong>. If a behavior is more likely after a specific consequence, that consequence is a reinforcer.</p>
  <div class="tw"><table>
    <thead><tr><th>Positive reinforcement</th><th>Negative reinforcement</th></tr></thead>
    <tbody>
      <tr><td><strong>Adding</strong> something good to increase behavior.</td><td><strong>Removing</strong> something unpleasant to increase behavior.</td></tr>
      <tr><td>"Raise hand" → child raises hand → teacher calls on them and praises → child raises hand more often. <em>Stimulus added, behavior increased.</em></td><td>Loud music plays → person puts on noise-cancelling headphones → noise is muted → they use headphones more often. <em>Stimulus removed, behavior increased.</em></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "negative" does not mean bad</span>
    <p>This is the single most common error in the whole course. <strong>Positive and negative describe whether something was added or subtracted, not whether it was pleasant.</strong> Both kinds of reinforcement <em>increase</em> behavior — that is what makes them reinforcement. If the behavior went down, it wasn't reinforcement at all, it was punishment (<a href="#rbt37">RBT37</a>).</p>
    <p>Think of it as arithmetic: positive = <strong>+</strong> (added), negative = <strong>−</strong> (removed). Reinforcement = behavior <strong>↑</strong>. Punishment = behavior <strong>↓</strong>. Those two dimensions are independent, which gives you the four combinations.</p>
  </div>

  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A learner screams during math worksheets. You remove the worksheet. Screaming during worksheets goes up. What happened?</summary><div><p><strong>Negative reinforcement</strong>, and it is maintaining the screaming. Something aversive (the worksheet) was <em>removed</em> after the behavior, and the behavior <em>increased</em>. This is the escape function from <a href="#rbt04">RBT04</a> seen from the consequence side, and it is exactly why extinction for escape-maintained behavior means <em>continuing the task</em> (<a href="#rbt35">RBT35</a>).</p></div></details>
  </div>

  <h3 id="rbt03-sched">Schedules of reinforcement</h3>
  <p><strong>Schedules are rules for when RBTs should deliver reinforcement.</strong> Two big families first: <strong>continuous</strong> (reinforcement every time the behavior occurs) and <strong>intermittent</strong> (only some of the time). The four named schedules split intermittent along two questions: <em>is it based on responses or on time?</em> and <em>is it predictable or does it vary?</em></p>
  <div class="tw"><table>
    <thead><tr><th>Schedule</th><th>Based on</th><th>Predictable or varies</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td><strong>Fixed Ratio (FR)</strong></td><td>Number of responses</td><td>Predictable</td><td>Every 5 math problems = sticker</td></tr>
      <tr><td><strong>Variable Ratio (VR)</strong></td><td>Number of responses</td><td>Varies</td><td>A token after every 2–7 responses (on average every 5th)</td></tr>
      <tr><td><strong>Fixed Interval (FI)</strong></td><td>Time</td><td>Predictable</td><td>A child gets a break after 5 minutes of sitting</td></tr>
      <tr><td><strong>Variable Interval (VI)</strong></td><td>Time</td><td>Varies</td><td>Praise after sitting quietly for 1–4 minutes</td></tr>
    </tbody>
  </table></div>
  <div class="box ex"><span class="lbl">Worked example: reading a schedule off a scenario</span>
    <p>Decode any scenario with two questions, in this order:</p>
    <ol>
      <li><strong>Counting responses, or watching a clock?</strong> Responses → <em>Ratio</em>. Time → <em>Interval</em>.</li>
      <li><strong>Same number/time every time, or does it change?</strong> Same → <em>Fixed</em>. Changes → <em>Variable</em>.</li>
    </ol>
    <p>"You give a token after the learner labels 3 pictures, then after 7, then after 4." Counting labels → Ratio. The number changes → Variable. <strong>VR.</strong></p>
    <p>"Every 2 minutes you check, and if she is still in her seat you praise her." Watching a clock → Interval. Always 2 minutes → Fixed. <strong>FI.</strong></p>
    <p>Careful with that last one: the formal definition is that <em>the first correct response after the set time elapses</em> gets reinforced — the clock makes reinforcement <em>available</em>, the behavior still has to happen.</p>
  </div>

  <h3 id="rbt03-dims">Dimensions of reinforcement</h3>
  <p><strong>Dimensions of reinforcement</strong> are features of reinforcement delivery that can affect the motivational value of the reinforcer. Changing them can have a big impact on progress.</p>
  <div class="tw"><table>
    <thead><tr><th>Dimension</th><th>What it means</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td><strong>Immediacy</strong></td><td>How quickly reinforcement is delivered after the behavior</td><td>Praising a child within 2 seconds of sharing a toy</td></tr>
      <tr><td><strong>Magnitude</strong></td><td>How big or powerful the reinforcer is — bigger effort = bigger reward</td><td>Giving 10 minutes of play time after finishing a big task</td></tr>
      <tr><td><strong>Quality</strong></td><td>How preferred or important the reinforcer is to the client</td><td>Offering bubbles to a child who loves bubbles instead of a random toy</td></tr>
      <tr><td><strong>Rate</strong></td><td>How often reinforcement is delivered — often enough to keep motivation high</td><td>Delivering frequent praise and tokens during early skill learning</td></tr>
    </tbody>
  </table></div>
  <div class="box proc"><span class="lbl">Ticket to success</span>
    <p>Use <strong>descriptive praise</strong> — tell the learner exactly what they did right when you deliver the reinforcer. "Nice job putting the blocks in the bin!" rather than "good job." It turns the reinforcer into teaching.</p>
  </div>

  <h3 id="rbt03-gloss">RBT03 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Stimulus</td><td>Anything around you that you can see, hear, smell, touch or taste — anything that can get your attention or make you react</td><td>A ringing phone</td><td>Something that stimulates</td><td>Event</td><td>—</td></tr>
      <tr><td>Response</td><td>What you actually do in the presence of a stimulus</td><td>Answering the phone</td><td>You respond to it</td><td>Behavior</td><td>Stimulus</td></tr>
      <tr><td>Consequence</td><td>What happens right after the response; can make the behavior more or less likely in future</td><td>Talking to a friend</td><td>What follows</td><td>Outcome</td><td>Antecedent</td></tr>
      <tr><td>Antecedent</td><td>Stimulus that occurs immediately before a target behavior</td><td>"Time to clean up"</td><td>Ante = before</td><td>Trigger</td><td>Consequence</td></tr>
      <tr><td>Behavior</td><td>A response that can be observed and/or measured</td><td>Client cleans up</td><td>You can see it</td><td>Response</td><td>Internal state</td></tr>
      <tr><td>3-Term Contingency</td><td>Antecedent → Behavior → Consequence; the foundation for understanding behavior</td><td>The ABCs</td><td>A-B-C</td><td>4-term contingency</td><td>—</td></tr>
      <tr><td>Reinforcement</td><td>Something happens after a behavior that makes it more likely to happen again</td><td>High five after cleaning up</td><td>Re-inforce = strengthen</td><td>—</td><td>Punishment</td></tr>
      <tr><td>Positive Reinforcement</td><td>Adding something good after the behavior to increase the behavior</td><td>Praise after raising hand</td><td>+ added</td><td>SR+</td><td>Negative reinforcement</td></tr>
      <tr><td>Negative Reinforcement</td><td>Removing something unpleasant after the behavior to increase the behavior</td><td>Headphones mute noise</td><td>− removed</td><td>Escape</td><td>Positive reinforcement</td></tr>
      <tr><td>Schedules of Reinforcement</td><td>Rules about when a behavior gets reinforced</td><td>FR, VR, FI, VI</td><td>The rulebook</td><td>—</td><td>—</td></tr>
      <tr><td>Continuous Schedule</td><td>Reinforcement is provided every time the behavior occurs</td><td>Token every trial</td><td>Continuous = always</td><td>Rich schedule</td><td>Intermittent schedule</td></tr>
      <tr><td>Intermittent Schedule</td><td>Reinforcement is only provided some of the time the behavior occurs</td><td>Every few trials</td><td>Intermittent = sometimes</td><td>Lean schedule</td><td>Continuous schedule</td></tr>
      <tr><td>Fixed Ratio (FR)</td><td>Reinforcement after a set number of responses</td><td>Every 5 problems = sticker</td><td>Fixed count</td><td>Variable ratio</td><td>Fixed interval</td></tr>
      <tr><td>Variable Ratio (VR)</td><td>Reinforcement after an unpredictable (but around an average) number of responses</td><td>Token every 2–7 responses</td><td>Slot machine</td><td>Fixed ratio</td><td>Variable interval</td></tr>
      <tr><td>Fixed Interval (FI)</td><td>The first correct response after a set amount of time gets reinforced</td><td>Break after 5 minutes sitting</td><td>Fixed clock</td><td>Variable interval</td><td>Fixed ratio</td></tr>
      <tr><td>Variable Interval (VI)</td><td>Reinforcement after an unpredictable (but around an average) amount of time</td><td>Praise after 1–4 minutes quiet</td><td>Surprise check-in</td><td>Fixed interval</td><td>Variable ratio</td></tr>
      <tr><td>Dimensions of Reinforcement</td><td>Features of reinforcement delivery that affect the motivational value of the reinforcer</td><td>Immediacy, magnitude, quality, rate</td><td>Four dials you can turn</td><td>—</td><td>—</td></tr>
      <tr><td>Immediacy</td><td>How quickly the reinforcement is delivered after the behavior</td><td>Praise within 2 seconds</td><td>Right now</td><td>—</td><td>Delayed reinforcement</td></tr>
      <tr><td>Magnitude</td><td>How big or powerful the reinforcer is</td><td>10 minutes of play</td><td>How much</td><td>Amount</td><td>—</td></tr>
      <tr><td>Quality</td><td>How preferred or important the reinforcer is to the client</td><td>Bubbles for a bubble-lover</td><td>How good</td><td>Preference</td><td>—</td></tr>
      <tr><td>Rate</td><td>How often reinforcement is delivered</td><td>Frequent praise early on</td><td>How often</td><td>Density</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT03 in one breath</span>
    <p>The <strong>3-term contingency</strong> — <strong>Antecedent → Behavior → Consequence</strong> — is the foundation of ABA: the antecedent is the stimulus immediately before, the behavior is an observable and measurable response, and the consequence is what follows and makes the behavior more or less likely. <strong>Reinforcement</strong> is any consequence that makes behavior <em>more</em> likely, and it comes in two kinds: <strong>positive</strong> (add something good) and <strong>negative</strong> (remove something unpleasant) — where <em>positive and negative mean added and removed, not good and bad</em>, and both increase behavior. <strong>Schedules</strong> are the rules for when to reinforce: <strong>continuous</strong> (every time) versus <strong>intermittent</strong>, and the four named ones split by whether they count <strong>responses (ratio)</strong> or watch the <strong>clock (interval)</strong> and whether they are <strong>fixed</strong> or <strong>variable</strong> — FR, VR, FI, VI. Finally the four <strong>dimensions of reinforcement</strong> — <strong>immediacy, magnitude, quality, rate</strong> — are the dials that change how motivating the reinforcer actually is, and <strong>descriptive praise</strong> turns delivering one into teaching.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT03 exam checklist</span>
    <ul class="checklist">
      <li>Define stimulus, response, antecedent, behavior, and consequence.</li>
      <li>Identify each part of the 3-term contingency in a scenario.</li>
      <li>Define reinforcement and say what makes a consequence a reinforcer.</li>
      <li>Distinguish positive from negative reinforcement, and explain why "negative" doesn't mean bad.</li>
      <li>Define continuous and intermittent schedules.</li>
      <li>Identify FR, VR, FI and VI from a scenario, using the ratio/interval and fixed/variable questions.</li>
      <li>Name the four dimensions of reinforcement and give an example of each.</li>
      <li>Explain what descriptive praise is and why it is used.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt04">
  <div class="plate"><span class="num" aria-hidden="true">04</span><p class="ttl">Behavior basics: why behavior occurs</p><p class="src">30-minute course · The 4 functions of behavior · Factors that influence motivation (setting events &amp; MOs)</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt03-abc">RBT03</a>'s 3-term contingency. This module adds a fourth term to the front of it, and introduces the single most important question in behavior reduction: <em>what is this behavior for?</em></p>
  </div>

  <h3 id="rbt04-function">The four functions of behavior</h3>
  <p><strong>All behavior is functional. It always serves a purpose.</strong> Every behavior happens for a reason, and when we understand why, we can respond more effectively and create real, lasting change. The manual asks you to shift your mindset:</p>
  <div class="tw"><table>
    <thead><tr><th>Not this question</th><th>This question instead</th></tr></thead>
    <tbody>
      <tr><td>"How do I stop this?!"</td><td>"What is this behavior trying to achieve?"</td></tr>
    </tbody>
  </table></div>
  <p>Use the 3-term contingency to identify the function: <em>what triggered the behavior</em> (antecedent) and <em>what happened after it</em> (consequence). Based on the ABCs, work out what the client is trying to communicate and you have a good guess at the function.</p>
  <div class="tw"><table>
    <thead><tr><th>Function</th><th>What the client is "saying"</th><th>Definition</th></tr></thead>
    <tbody>
      <tr><td><strong>Attention</strong></td><td>"Notice me!"</td><td>Behaving in a certain way to get social contact.</td></tr>
      <tr><td><strong>Escape</strong></td><td>"Get me out!"</td><td>Behaving in a certain way to avoid or get away from something unpleasant or difficult.</td></tr>
      <tr><td><strong>Access to tangibles</strong></td><td>"I want that."</td><td>Behaving in a certain way to get something they want — an item, activity, or experience.</td></tr>
      <tr><td><strong>Automatic</strong></td><td>"This feels good."</td><td>Behaving in a certain way because the behavior is reinforcing all on its own — <em>not</em> because of something someone else does.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: topography is not function</span>
    <p><strong>Topography</strong> is what a behavior <em>looks like</em> — its form, the action we observe. <strong>Function</strong> is the <em>why</em>. Two children can both hit, and one is hitting for attention while the other is hitting to escape a demand — same topography, different function, <strong>and therefore different intervention</strong>. This is why the function has to be identified before the plan is written, and it is why you never pick an intervention off a behavior's name.</p>
    <p>The flip side is also tested: the <em>same</em> client can engage in the <em>same</em> behavior for <strong>multiple functions</strong> (<a href="#rbt33">RBT33</a> says so explicitly), so a BIP may list more than one.</p>
  </div>
  <div class="box warn"><span class="lbl">Watch out: automatic is the odd one out</span>
    <p>Attention, escape and tangible are all <strong>socially mediated</strong> — another person has to do something for the behavior to pay off. <strong>Automatic</strong> is not: the behavior produces its own reinforcement, so no one else is involved. That is why automatic behavior doesn't stop when you withhold attention, and why extinction looks completely different for it.</p>
  </div>

  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A client throws materials every time a worksheet is placed in front of him, and you take the worksheet away. What is the likely function?</summary><div><p><strong>Escape.</strong> The antecedent is a demand and the consequence is removal of the demand. Note that this is also <em>negative reinforcement</em> from <a href="#rbt03-reinf">RBT03</a> — escape function and negative reinforcement are the same event described from two sides.</p></div></details>
    <details><summary>A client rocks back and forth whether or not anyone is in the room. Function?</summary><div><p><strong>Automatic.</strong> The giveaway is that it happens with no one around — no social consequence is required, so the behavior is reinforcing on its own.</p></div></details>
  </div>

  <h3 id="rbt04-motivation">Factors that influence motivation</h3>
  <p>Behavior has a purpose, but the <em>motivation</em> for engaging in it changes depending on what's going on inside the person or around them. <strong>Setting events and motivating operations do not directly cause behavior — they influence the likelihood of it occurring.</strong> Adding them to the front gives you the <strong>4-term contingency</strong>:</p>
  <div class="box proc"><span class="lbl">The 4-term contingency</span>
    <p><strong>Setting events / Motivating operations → Antecedent → Behavior → Consequence</strong></p>
  </div>
  <div class="box def"><span class="lbl">Definition: the three motivation terms</span>
    <dl>
      <dt>Setting event</dt><dd>Prior conditions that <strong>don't occur immediately before</strong> the behavior, and don't directly cause it, but <strong>set the stage</strong> for it to happen.</dd>
      <dt>Motivating Operation (MO)</dt><dd>Temporary changes to the environment that affect <strong>how much someone wants a certain consequence in the moment</strong>.</dd>
      <dt>Establishing Operation (EO)</dt><dd>A type of MO that temporarily <strong>increases</strong> the value of a reinforcer and <strong>increases</strong> the likelihood of behaviors that get access to it.</dd>
      <dt>Abolishing Operation (AO)</dt><dd>A type of MO that temporarily <strong>decreases</strong> the value of a reinforcer and <strong>decreases</strong> the likelihood of behaviors that get access to it.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Example</th><th>Type of event</th><th>Rationale</th></tr></thead>
    <tbody>
      <tr><td>Child is tired and skipped breakfast. He engages in challenging behavior when a demand is placed.</td><td><strong>Setting event</strong></td><td>Being tired and hungry doesn't <em>cause</em> challenging behavior, but it does increase the likelihood that it will occur.</td></tr>
      <tr><td>Child has not played with their favorite toy in a while. The child works hard to earn tokens to play with the toy.</td><td><strong>Establishing Operation (EO)</strong></td><td>Being deprived of the toy temporarily <em>increases</em> its value, and consequently increases behaviors to earn it.</td></tr>
      <tr><td>Child plays with their favorite toy for 30 minutes and is no longer interested in earning tokens for it.</td><td><strong>Abolishing Operation (AO)</strong></td><td>Too much access temporarily <em>decreases</em> the toy's value, and consequently decreases behaviors to earn it.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: setting event vs MO</span>
    <p>Both make behavior more or less likely without causing it, and the exam will offer you both. The cleanest split: a <strong>setting event</strong> is a background condition — it happened earlier and it is about the <em>person's whole state</em> (slept badly, is sick, had a fight on the bus). An <strong>MO</strong> is specifically about <em>how valuable a particular reinforcer is right now</em> (hasn't had the toy, just ate a big lunch). If the scenario names a specific reinforcer whose value went up or down, it's an MO — and then <strong>deprivation → EO, satiation → AO</strong>.</p>
  </div>

  <h3 id="rbt04-gloss">RBT04 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Topography</td><td>What a behavior looks like — its form; the action we observe</td><td>Hitting, screaming</td><td>Topo = the shape of it</td><td>Form</td><td>Function</td></tr>
      <tr><td>Function</td><td>The "why" behind behavior; what the person is trying to achieve</td><td>Escape from a demand</td><td>What it's <em>for</em></td><td>Purpose</td><td>Topography</td></tr>
      <tr><td>Attention Function</td><td>Behaving in a certain way to get social contact</td><td>"Notice me!"</td><td>Wants you</td><td>Socially mediated</td><td>Automatic function</td></tr>
      <tr><td>Escape Function</td><td>Behaving in a certain way to avoid or get away from something unpleasant or difficult</td><td>"Get me out!"</td><td>Wants out</td><td>Negative reinforcement</td><td>Tangible function</td></tr>
      <tr><td>Access to Tangibles Function</td><td>Behaving in a certain way to get an item, activity, or experience</td><td>"I want that."</td><td>Wants a thing</td><td>Socially mediated</td><td>Escape function</td></tr>
      <tr><td>Automatic Function</td><td>Behaving in a certain way because the behavior is reinforcing on its own, not because of what someone else does</td><td>"This feels good."</td><td>No audience needed</td><td>Sensory</td><td>Socially mediated functions</td></tr>
      <tr><td>Setting Events</td><td>Prior conditions that don't occur immediately before the behavior or directly cause it, but set the stage for it</td><td>Tired, skipped breakfast</td><td>Sets the stage</td><td>Motivating operation</td><td>Immediate antecedent</td></tr>
      <tr><td>Motivating Operation (MO)</td><td>Temporary changes to the environment that affect how much someone wants a certain consequence in the moment</td><td>Hasn't had the toy all day</td><td>Changes what you want</td><td>Setting event</td><td>—</td></tr>
      <tr><td>Establishing Operation (EO)</td><td>A type of MO that temporarily increases the value of a reinforcer and the likelihood of behaviors that access it</td><td>Deprivation of a toy</td><td>E for Elevates</td><td>Deprivation</td><td>Abolishing operation</td></tr>
      <tr><td>Abolishing Operation (AO)</td><td>A type of MO that temporarily decreases the value of a reinforcer and the likelihood of behaviors that access it</td><td>30 minutes with the toy</td><td>A for Abolishes</td><td>Satiation</td><td>Establishing operation</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT04 in one breath</span>
    <p><strong>All behavior is functional</strong> — it always serves a purpose — so the question is never "how do I stop this?" but "<strong>what is this behavior trying to achieve?</strong>", and you answer it by reading the <strong>ABCs</strong>. There are <strong>four functions</strong>: <strong>attention</strong> ("notice me"), <strong>escape</strong> ("get me out"), <strong>access to tangibles</strong> ("I want that"), and <strong>automatic</strong> ("this feels good") — the first three are <em>socially mediated</em> and the fourth is not. <strong>Topography</strong> (what it looks like) is not <strong>function</strong> (why it happens), two clients can do the same thing for different reasons, and one client can do the same thing for several. Motivation is shaped by two things added to the front of the contingency, making it the <strong>4-term contingency</strong>: <strong>setting events</strong> — background conditions like being tired or hungry that set the stage without causing the behavior — and <strong>motivating operations</strong>, temporary changes in how much a particular reinforcer is wanted right now, which are <strong>establishing operations (EO)</strong> when deprivation raises a reinforcer's value and <strong>abolishing operations (AO)</strong> when satiation lowers it.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT04 exam checklist</span>
    <ul class="checklist">
      <li>State that all behavior is functional, and give the mindset shift in the manual's words.</li>
      <li>Define and recognise examples of all four functions of behavior.</li>
      <li>Say which functions are socially mediated and which is not.</li>
      <li>Distinguish topography from function, and explain why that distinction drives treatment.</li>
      <li>Define setting events and motivating operations, and tell them apart in a scenario.</li>
      <li>Define EO and AO and link them to deprivation and satiation.</li>
      <li>Draw the 4-term contingency.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt05">
  <div class="plate"><span class="num" aria-hidden="true">05</span><p class="ttl">Communication basics: verbal operants</p><p class="src">30-minute course · The 4 elementary verbal operants (mands, tacts, echoics, intraverbals)</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt04-motivation">RBT04</a>'s motivating operations — the MO is what separates a mand from everything else. <a href="#rbt36">RBT36</a> (FCT) is this module applied to behavior reduction.</p>
  </div>

  <p><strong>Verbal operants are the building blocks of language in ABA.</strong> There are four elementary ones, and the entire module comes down to two questions about each: <strong>what controls it</strong> (what has to be in place for it to happen), and <strong>what reinforces it</strong>.</p>

  <div class="box proc"><span class="lbl">The whole module in one table</span>
    <div class="tw"><table>
      <thead><tr><th>Operant</th><th>In everyday language</th><th>Controlled by</th><th>Reinforced by</th></tr></thead>
      <tbody>
        <tr><td><strong>Mand</strong></td><td>A <em>request</em></td><td><strong>Motivating operations</strong> — the client must want something first</td><td><strong>Access to the item or activity requested</strong></td></tr>
        <tr><td><strong>Tact</strong></td><td>A <em>label</em></td><td><strong>Contact with the environment</strong>, <em>not</em> MOs</td><td><strong>Social consequences</strong> — praise or attention</td></tr>
        <tr><td><strong>Echoic</strong></td><td>A <em>repeat</em></td><td><strong>Someone else's verbal behavior</strong></td><td><strong>Social consequences</strong> — praise or attention</td></tr>
        <tr><td><strong>Intraverbal</strong></td><td>A <em>conversation</em></td><td><strong>Someone else's verbal behavior</strong></td><td><strong>Social consequences</strong> — praise or attention</td></tr>
      </tbody>
    </table></div>
  </div>
  <div class="box warn"><span class="lbl">Watch out: the two distinctions that get tested</span>
    <p><strong>Mand vs everything else:</strong> only the mand is controlled by an MO and only the mand is reinforced by getting the thing. If the MO column in a scenario says N/A, it is <em>not</em> a mand.</p>
    <p><strong>Echoic vs intraverbal:</strong> both are controlled by what someone else said. An <strong>echoic</strong> copies it exactly — "point-to-point correspondence." An <strong>intraverbal</strong> is <em>related but not identical</em>. "You say 'ball' → they say 'ball'" is echoic. "You say 'what do you throw?' → they say 'ball'" is intraverbal.</p>
  </div>

  <h3 id="rbt05-mand">Mands</h3>
  <p>A <strong>mand</strong> is a type of verbal behavior that occurs when someone <strong>wants or needs something</strong> — in everyday language, a request. Two rules:</p>
  <ul>
    <li>Mands are <strong>controlled by motivating operations</strong>. Clients must <em>want</em> something before they can mand for it.</li>
    <li>Mands are <strong>reinforced by access to the item or activity</strong> the client requested.</li>
  </ul>
  <div class="tw"><table>
    <thead><tr><th>MO</th><th>A — Antecedent</th><th>B — Mand</th><th>C — Consequence</th></tr></thead>
    <tbody>
      <tr><td>A toddler is hungry</td><td>They see their bottle</td><td>They say "Milk"</td><td>They get the bottle and drink</td></tr>
      <tr><td>A learner has been sitting still for 30 minutes</td><td>You say, "Great work! You can go play."</td><td>They hand you a picture of a trampoline</td><td>You take them to the playroom to jump</td></tr>
      <tr><td>A student hasn't played with friends all day</td><td>He sees other children having fun on the swings</td><td>He uses a speech-generating device to say "swing"</td><td>You let him swing and even give a few big pushes</td></tr>
    </tbody>
  </table></div>
  <p>Each of these is a mand because the child <strong>made a request in the presence of a motivating operation and received the requested item as a consequence</strong>. Note the second and third rows: a mand does not have to be spoken. A picture exchange and a speech-generating device are both mands.</p>

  <h3 id="rbt05-tact">Tacts</h3>
  <p>A <strong>tact</strong> is a type of verbal behavior where the speaker <strong>labels something in their environment</strong>. In short, it's a label.</p>
  <ul>
    <li>Tacts are <strong>controlled by contact with the environment</strong>, not motivating operations.</li>
    <li>Tacts are <strong>reinforced with social consequences</strong>, like praise or attention.</li>
  </ul>
  <div class="tw"><table>
    <thead><tr><th>MO</th><th>A — Antecedent</th><th>B — Tact</th><th>C — Consequence</th></tr></thead>
    <tbody>
      <tr><td>N/A</td><td>You hold up a red crayon</td><td>Child says "Red"</td><td>You say, "Nice! It is red!"</td></tr>
      <tr><td>N/A</td><td>A bird flies by the window</td><td>Child says, "Bird"</td><td>You say, "I saw the bird. It was flying fast."</td></tr>
      <tr><td>N/A</td><td>A child sees someone smile and laugh</td><td>Child uses a device to say "happy"</td><td>You say, "They do look really happy!"</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt05-echoic">Echoics</h3>
  <p>An <strong>echoic</strong> is a type of verbal behavior where the speaker <strong>repeats what they hear</strong> — with <strong>point-to-point correspondence</strong>, meaning the response matches the model piece for piece.</p>
  <div class="tw"><table>
    <thead><tr><th>MO</th><th>A — Antecedent</th><th>B — Echoic</th><th>C — Consequence</th></tr></thead>
    <tbody>
      <tr><td>N/A</td><td>You say "ma"</td><td>Client repeats, "Ma"</td><td>You say, "Great job!"</td></tr>
      <tr><td>N/A</td><td>You say, "hello"</td><td>Client repeats, "hello"</td><td>You say, "You got it!"</td></tr>
    </tbody>
  </table></div>
  <p>Each of these is an echoic because <strong>the response is a vocal imitation of what was just heard</strong>.</p>

  <h3 id="rbt05-intraverbal">Intraverbals</h3>
  <p>An <strong>intraverbal</strong> is a type of verbal behavior that occurs <strong>in response to another person's verbal behavior, but without directly copying it</strong>.</p>
  <div class="tw"><table>
    <thead><tr><th>MO</th><th>A — Antecedent</th><th>B — Intraverbal</th><th>C — Consequence</th></tr></thead>
    <tbody>
      <tr><td>N/A</td><td>"What's your name?"</td><td>Child says, "Ava"</td><td>Reinforcement</td></tr>
      <tr><td>N/A</td><td>"What do you eat for lunch?"</td><td>Child says, "Pizza"</td><td>Reinforcement</td></tr>
      <tr><td>N/A</td><td>"Twinkle, twinkle"</td><td>Child says, "Little star"</td><td>Reinforcement</td></tr>
    </tbody>
  </table></div>
  <p>These are all intraverbals because <strong>the response is related to the verbal stimulus, but not identical</strong>.</p>

  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A child is thirsty, sees a cup, and says "cup." You say "Yes, that's a cup!" and keep it. Mand or tact?</summary><div><p><strong>Tact</strong> — because of the <em>consequence</em>. An MO was present, but the response was reinforced with praise and the child didn't get the cup. Mands are defined by being reinforced with the thing requested. (In practice this is a missed opportunity: you had an MO available and could have reinforced a mand instead.)</p></div></details>
    <details><summary>You say "The cow says…" and the child says "moo." Which operant?</summary><div><p><strong>Intraverbal.</strong> It's controlled by your verbal behavior and it's related but not identical. If you had said "moo" and they said "moo," that would be an echoic.</p></div></details>
  </div>

  <h3 id="rbt05-gloss">RBT05 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Verbal Operants</td><td>The building blocks of language in ABA</td><td>Mand, tact, echoic, intraverbal</td><td>Units of language</td><td>Verbal behavior</td><td>—</td></tr>
      <tr><td>Mand</td><td>Verbal behavior that occurs when someone wants or needs something; a request</td><td>"Milk" when hungry</td><td>Mand = demand</td><td>Request</td><td>Tact</td></tr>
      <tr><td>Tact</td><td>Verbal behavior where the speaker labels something in their environment</td><td>"Bird" when a bird flies by</td><td>Tact = conTACT with the world</td><td>Label</td><td>Mand</td></tr>
      <tr><td>Echoic</td><td>Verbal behavior where the speaker repeats what they hear (point-to-point correspondence)</td><td>You say "ma", they say "ma"</td><td>Echo</td><td>Imitation</td><td>Intraverbal</td></tr>
      <tr><td>Intraverbal</td><td>Verbal behavior in response to another person's verbal behavior, without directly copying it</td><td>"Twinkle twinkle" → "little star"</td><td>Conversation</td><td>Echoic</td><td>Echoic</td></tr>
      <tr><td>Point-to-point correspondence</td><td>The response matches the verbal model piece for piece</td><td>Repeating "hello"</td><td>Matches exactly</td><td>Echoic</td><td>Intraverbal</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT05 in one breath</span>
    <p><strong>Verbal operants</strong> are the building blocks of language in ABA, and there are four elementary ones, each defined by what <em>controls</em> it and what <em>reinforces</em> it. A <strong>mand</strong> is a request: it is controlled by a <strong>motivating operation</strong> (the client must want something first) and reinforced by <strong>getting the thing requested</strong> — and it doesn't have to be spoken, since a picture exchange or a device counts. A <strong>tact</strong> is a label: controlled by <strong>contact with the environment</strong>, not an MO, and reinforced by <strong>social consequences</strong> like praise. An <strong>echoic</strong> repeats what was heard with <strong>point-to-point correspondence</strong>, controlled by someone else's verbal behavior and reinforced socially. An <strong>intraverbal</strong> responds to someone else's verbal behavior <strong>without copying it</strong>, also reinforced socially. The two exam traps: only the mand has an MO and gets the item, and <strong>echoic copies exactly while intraverbal is related but different</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT05 exam checklist</span>
    <ul class="checklist">
      <li>Define verbal operants and name the four elementary ones.</li>
      <li>Define and recognise examples of mands, and state what controls and reinforces them.</li>
      <li>Define and recognise examples of tacts, and state what controls and reinforces them.</li>
      <li>Define and recognise examples of echoics, including point-to-point correspondence.</li>
      <li>Define and recognise examples of intraverbals.</li>
      <li>Tell an echoic from an intraverbal, and a mand from a tact, in a scenario.</li>
      <li>Explain why a picture exchange or device response can still be a mand.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt06">
  <div class="plate"><span class="num" aria-hidden="true">06</span><p class="ttl">Data 101</p><p class="src">60-minute course · Importance of data collection · IOA, reliability &amp; the risks of unreliable data · Operational definitions · Describing behavior in observable terms</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt02-dimensions">RBT02</a>'s <em>analytic</em> and <em>behavioral</em> dimensions. Data is how ABA earns the word "analytic," and operational definitions are how it earns "behavioral."</p>
  </div>

  <h3 id="rbt06-importance">Why we collect data</h3>
  <div class="box def"><span class="lbl">Definition: data collection</span>
    <dl>
      <dt>What is it?</dt><dd>A process that allows information about behavior and environmental events to be <strong>documented and analyzed</strong>.</dd>
      <dt>Why do it?</dt><dd>To determine <strong>baseline performance</strong>; <strong>monitor treatment progress</strong>; <strong>puzzle-solve treatment barriers</strong>; and <strong>ensure consistent treatment implementation</strong>.</dd>
    </dl>
  </div>

  <h3 id="rbt06-ioa">IOA and reliability</h3>
  <div class="box def"><span class="lbl">Definition: IOA and reliability</span>
    <dl>
      <dt>IOA</dt><dd><strong>Interobserver agreement</strong> — the degree to which two or more <em>independent</em> observers record the same data after observing the <em>exact same event</em>.</dd>
      <dt>Reliability</dt><dd>The <strong>consistency</strong> of measurement, or the extent to which the same behavior is recorded in the same way.</dd>
    </dl>
  </div>
  <div class="box warn"><span class="lbl">Watch out: reliability ≠ accuracy</span>
    <p>The manual states this directly. Two observers can agree perfectly and both be <strong>consistently wrong</strong> — if the operational definition is bad, or both were trained the same wrong way, your data is reliable and useless. Reliability means <em>consistent</em>; accuracy means <em>correct</em>. You need both, and IOA only measures the first.</p>
  </div>
  <p><strong>Risks of unreliable data:</strong></p>
  <ul>
    <li>Poor treatment decisions</li>
    <li>Lack of client progress</li>
    <li>Unclear if the treatment plan is working</li>
    <li>Lack of trust in the data</li>
    <li>Time and effort wasted on ineffective approaches</li>
  </ul>

  <h3 id="rbt06-impact">How data helps</h3>
  <div class="tw"><table>
    <thead><tr><th>Data helps your supervisor…</th><th>Data helps everyone…</th><th>Data helps you…</th></tr></thead>
    <tbody>
      <tr><td>Analyze patterns · make program updates · make data-based decisions · ensure treatment fidelity</td><td>Track progress · support the client in meeting goals</td><td>Switch to a different program based on client motivation · provide more practice when needed · identify wins to celebrate · identify concerns to bring to your supervisor</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt06-opdef">Operational definitions</h3>
  <div class="box def"><span class="lbl">Definition: operational definition</span>
    <p>A description of behavior or an environmental event that outlines <strong>what to observe and which responses to record data on</strong>. These descriptions must be <strong>objective, clear, complete, and individualized</strong>.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Four key components</th><th>Why operational definitions matter</th></tr></thead>
    <tbody>
      <tr><td><strong>Objective</strong></td><td>Everyone records the <strong>same data in the same way</strong></td></tr>
      <tr><td><strong>Clear</strong></td><td><strong>No guesswork</strong></td></tr>
      <tr><td><strong>Complete</strong></td><td><strong>Consistent data over time</strong></td></tr>
      <tr><td><strong>Individualized</strong></td><td><strong>Reliable data to inform treatment decisions</strong></td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt06-observable">Describing behavior in observable terms</h3>
  <p>Observable language focuses on <strong>what can be seen and heard</strong>. Non-observable language sneaks in <strong>assumptions about internal states</strong>.</p>
  <div class="tw"><table>
    <thead><tr><th>Observable ✓</th><th>Non-observable ✗</th></tr></thead>
    <tbody>
      <tr><td>Throws a pencil</td><td>Is frustrated</td></tr>
      <tr><td>Says, "Yes"</td><td>Agrees to cooperate</td></tr>
      <tr><td>Walks out of the room</td><td>Avoids the task</td></tr>
      <tr><td>Claps hands and jumps</td><td>Gets excited</td></tr>
      <tr><td>Raises hand</td><td>Wants attention</td></tr>
    </tbody>
  </table></div>
  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>Rewrite "the client was being defiant during circle time" as an observable description.</summary><div><p>Something like: "During circle time, the client left his chair 6 times and said 'no' when given an instruction 4 times." You replace the interpretation ("defiant") with what you could see and hear, and you can count it. Anyone reading it would record the same thing — which is the point.</p></div></details>
  </div>

  <h3 id="rbt06-tips">Data 101 hot tips</h3>
  <div class="box proc"><span class="lbl">The six rules</span>
    <ol>
      <li><strong>Record data immediately after the behavior.</strong></li>
      <li><strong>Write down what you see/hear, not what you think or feel.</strong></li>
      <li><strong>Use the client's operational definitions.</strong></li>
      <li><strong>Be consistent with the data system in place.</strong></li>
      <li><strong>Keep data objective and observable.</strong></li>
      <li><strong>Accurate data = better treatment decisions.</strong></li>
    </ol>
  </div>

  <h3 id="rbt06-gloss">RBT06 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>IOA</td><td>Interobserver agreement — the degree to which two or more independent observers record the same data after observing the exact same event</td><td>Two RBTs scoring one video</td><td>Inter-Observer-Agreement</td><td>Reliability</td><td>—</td></tr>
      <tr><td>Reliability</td><td>The consistency of measurement; the extent to which the same behavior is recorded in the same way</td><td>Same score every time</td><td>Reliable = consistent</td><td>IOA</td><td>Accuracy (not the same!)</td></tr>
      <tr><td>Operational Definition</td><td>A description of behavior or an environmental event outlining what to observe and which responses to record; objective, clear, complete, individualized</td><td>"Leaves chair with both feet"</td><td>Defines the operation</td><td>Target definition</td><td>Vague description</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT06 in one breath</span>
    <p><strong>Data collection</strong> documents and analyzes behavior and environmental events so the team can establish a <strong>baseline</strong>, monitor progress, puzzle-solve barriers, and ensure consistent implementation. <strong>IOA</strong> is the degree to which two <em>independent</em> observers record the same data on the <em>same event</em>; <strong>reliability</strong> is consistency of measurement — and <strong>reliability does not equal accuracy</strong>, because two people can agree and both be wrong. Unreliable data costs you poor treatment decisions, lack of progress, uncertainty about whether the plan works, lost trust, and wasted effort. The protection against that is an <strong>operational definition</strong> — a description of what to observe and record that is <strong>objective, clear, complete and individualized</strong>, so everyone records the same data the same way with no guesswork. Write in <strong>observable terms</strong>: "throws a pencil," not "is frustrated." And six rules: record immediately, write what you see and hear rather than what you think or feel, use the client's operational definitions, be consistent with the data system, keep it objective, because <strong>accurate data means better treatment decisions</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT06 exam checklist</span>
    <ul class="checklist">
      <li>State the importance of data collection and its four purposes.</li>
      <li>Define IOA and reliability, and explain why reliability is not accuracy.</li>
      <li>List five risks of unreliable data collection.</li>
      <li>Describe how data collection supports treatment implementation.</li>
      <li>Define operational definition and name its four key components.</li>
      <li>Give four reasons operational definitions matter.</li>
      <li>Sort statements into observable and non-observable, and rewrite a non-observable one.</li>
      <li>Recite the six data hot tips.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt07">
  <div class="plate"><span class="num" aria-hidden="true">07</span><p class="ttl">Common data systems</p><p class="src">60-minute course · Types of data collection procedures · Continuous vs discontinuous · Recognizing and collecting each type</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt06">RBT06</a>. This is the catalogue of <em>how</em> to measure, and it is one of the densest vocabulary modules in the course — ten procedures, each with its own advantage and its own trap.</p>
  </div>

  <h3 id="rbt07-procedures">The ten data collection procedures</h3>
  <div class="tw"><table>
    <thead><tr><th>Procedure</th><th>What it measures</th><th>Advantage</th><th>Things to keep in mind</th></tr></thead>
    <tbody>
      <tr><td><strong>Frequency</strong></td><td>The number of times a behavior occurs</td><td>Exact count of behavior</td><td>Difficult with high-rate behavior or behavior with unclear start/stop</td></tr>
      <tr><td><strong>Rate</strong></td><td>How many times a behavior occurs during a set amount of time</td><td>Exact count of behavior during a certain timeframe</td><td>Difficult with high-rate behavior or unclear start/stop</td></tr>
      <tr><td><strong>Duration</strong></td><td>How long a behavior occurs</td><td>Exactly how long behavior occurs</td><td>Difficult with high-rate behavior; must pay close attention to start/stop</td></tr>
      <tr><td><strong>Latency</strong></td><td>How long it takes for behavior to <em>begin</em></td><td>Great for measuring delay to first response</td><td>Must pay close attention to the start of behavior</td></tr>
      <tr><td><strong>Interresponse time (IRT)</strong></td><td>The time <em>between two responses</em></td><td>Great for measuring the pace of a behavior</td><td>Difficult with high-rate behavior; must watch stop/start closely</td></tr>
      <tr><td><strong>Trial-by-trial</strong></td><td>How someone responds after a discrete learning opportunity</td><td>Detailed data on each discrete learning opportunity</td><td>Requires practice to remember to record for each trial while implementing</td></tr>
      <tr><td><strong>Partial-interval</strong></td><td>Occurrence/non-occurrence <em>at any point</em> during consecutive intervals</td><td>Only have to focus on whether behavior occurred at any point in the interval</td><td><strong>May overestimate</strong> the actual occurrence of behavior</td></tr>
      <tr><td><strong>Whole-interval</strong></td><td>Number of intervals in which behavior occurred for the <em>entire</em> interval</td><td>Only have to focus on whether behavior occurred for the whole interval</td><td><strong>May underestimate</strong> the actual occurrence of behavior</td></tr>
      <tr><td><strong>Momentary time sampling (MTS)</strong></td><td>Whether behavior occurs right <em>at the end</em> of each interval</td><td>Only have to focus on the end of the interval</td><td>Does not give you data on every instance of behavior</td></tr>
      <tr><td><strong>Permanent product</strong></td><td>A physical product produced by the behavior</td><td>Do not have to observe the behavior directly</td><td>Can be difficult to confirm who produced the permanent product</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt07-continuous">Continuous vs discontinuous</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
