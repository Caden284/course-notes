  <div class="box warn"><span class="lbl">Watch out: "honor the choice"</span>
    <p>Step 4 of the choices procedure is not a formality. Offering a choice and then overriding it teaches the learner that choices are fake — which damages assent (<a href="#rbt10-signs">RBT10</a>) and rapport. Only offer options you are willing to deliver.</p>
  </div>

  <h3 id="rbt34-environment">Environmental modifications</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Environmental modification</dt><dd>Making changes to the <strong>physical or social environment</strong> to reduce the likelihood of problem behavior and increase the likelihood of success.</dd>
      <dt>Environmental enrichment</dt><dd>Adding <strong>variety, stimulation, and opportunities for engagement</strong> to the client's surroundings.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Type</th><th>What it involves</th></tr></thead>
    <tbody>
      <tr><td><strong>Meet basic needs</strong></td><td>Clients do better when their basic needs are met: make sure they've eaten, offer movement or sensory breaks, provide water, rest, or bathroom access. Meeting these needs <strong>reduces frustration and supports cooperation</strong>.</td></tr>
      <tr><td><strong>Ensure safety</strong></td><td>Remove sharp or breakable items, secure heavy objects, and check for hazards before starting. A safe environment reduces risks for <strong>both the client and staff</strong>.</td></tr>
      <tr><td><strong>Visual supports</strong></td><td>Add structure and predictability, lowering anxiety and easing transitions: picture schedules, first-then boards, labels for areas or materials, and timers. They help clients understand expectations <strong>without relying only on verbal instructions</strong>.</td></tr>
      <tr><td><strong>Enriched environment</strong></td><td>Rotate items to keep them novel, offer choices, match enrichment to client preferences, and <strong>balance stimulation</strong>. A stimulating but <em>manageable</em> environment promotes appropriate behavior.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "meet basic needs" is a setting-event intervention</span>
    <p>Hunger, tiredness and needing the bathroom are the textbook <strong>setting events</strong> from <a href="#rbt04-motivation">RBT04</a>. Addressing them is the most unglamorous and most effective antecedent work you will do — and it's often the answer to "why was today so hard?"</p>
  </div>

  <h3 id="rbt34-considerations">Choosing a strategy</h3>
  <p>Two things should drive your selection: the <strong>MO in play</strong>, and the <strong>function</strong> of the behavior you're preventing.</p>
  <div class="tw"><table>
    <thead><tr><th>MO</th><th>What it means</th><th>What to do</th></tr></thead>
    <tbody>
      <tr><td><strong>Deprivation (EO)</strong></td><td>When someone has had little or no access to something they like, it becomes <strong>more valuable</strong>.</td><td>Use the <strong>Premack Principle or behavioral momentum</strong>, because the reinforcer is really valuable.</td></tr>
      <tr><td><strong>Satiation (AO)</strong></td><td>When someone has had a lot of access to something, it becomes <strong>less valuable</strong>.</td><td><strong>Switch reinforcers</strong> or try to <strong>enrich the environment</strong>.</td></tr>
    </tbody>
  </table></div>
  <div class="tw"><table>
    <thead><tr><th>Function</th><th>Environmental modifications</th><th>Antecedent strategies</th></tr></thead>
    <tbody>
      <tr><td><strong>Escape</strong></td><td>Use visual cues/timers; incorporate preferred materials</td><td><strong>Behavioral momentum · choice-making · demand fading</strong></td></tr>
      <tr><td><strong>Attention</strong></td><td>Ask other RBTs to interact with the client; schedule social times/activities</td><td><strong>NCR · pairing</strong></td></tr>
      <tr><td><strong>Tangible</strong></td><td>Enrich the environment with preferred items; use token boards and other visual cues</td><td><strong>Premack Principle · choice-making</strong></td></tr>
      <tr><td><strong>Automatic / sensory</strong></td><td>Enrich the environment with sensory activities</td><td><strong>NCR · pairing</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A client's screaming is escape-maintained and demands are currently very long. Which two antecedent strategies fit best?</summary><div><p><strong>Demand fading</strong> (start small and build back up) and <strong>behavioral momentum</strong> (2–3 high-p tasks before the low-p one). <strong>Choice-making</strong> also works for escape. NCR and pairing are the attention/automatic answers, so they'd be the wrong pick here.</p></div></details>
  </div>

  <h3 id="rbt34-gloss">RBT34 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Antecedent Intervention</td><td>Strategies put in place before a challenging behavior occurs, reducing problem behavior and increasing appropriate behavior</td><td>Premack, NCR, choices</td><td>Prevent, don't react</td><td>Prevention</td><td>Consequence strategy</td></tr>
      <tr><td>Premack Principle (Grandma's Law)</td><td>Access to a preferred activity is provided only after completing a less preferred task (first–then)</td><td>"First math, then iPad"</td><td>Eat your vegetables first</td><td>Contingency contract</td><td>Noncontingent reinforcement</td></tr>
      <tr><td>Behavioral Momentum</td><td>Starting with a series of easy tasks before presenting a more difficult or less preferred task</td><td>3 easy, then 1 hard</td><td>Build momentum</td><td>High-p sequence</td><td>Starting with the hard task</td></tr>
      <tr><td>High-Probability Task (high-p)</td><td>Tasks the client almost always does without resistance</td><td>"Give me five"</td><td>They'll always do it</td><td>Mastered target</td><td>Low-p task</td></tr>
      <tr><td>Low-Probability Task (low-p)</td><td>A harder or less preferred task the client is less likely to do without resistance</td><td>A new writing demand</td><td>They resist it</td><td>—</td><td>High-p task</td></tr>
      <tr><td>Pairing</td><td>Associating yourself, your materials, and the learning environment with reinforcement</td><td>Presession pairing, all day</td><td>Be the good stuff</td><td>Presession pairing</td><td>—</td></tr>
      <tr><td>Noncontingent Reinforcement (NCR)</td><td>Giving the client access to reinforcement on a fixed schedule, whether or not problem behavior occurs</td><td>Attention every 2 minutes</td><td>Free, on a timer</td><td>Abolishing operation</td><td>Contingent reinforcement</td></tr>
      <tr><td>Demand Fading</td><td>Gradually increasing the amount, length, or difficulty of demands over time</td><td>1 problem, then 2, then 5</td><td>Fade demands in</td><td>Shaping</td><td>Full demands immediately</td></tr>
      <tr><td>Environmental Modification</td><td>Changes to the physical or social environment to reduce problem behavior and increase success</td><td>Removing hazards; visual schedule</td><td>Change the room</td><td>Antecedent intervention</td><td>—</td></tr>
      <tr><td>Environmental Enrichment</td><td>Adding variety, stimulation, and opportunities for engagement to the client's surroundings</td><td>Rotating novel toys</td><td>Make it interesting</td><td>NCR</td><td>Barren environment</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT34 in one breath</span>
    <p><strong>Antecedent interventions</strong> are put in place <em>before</em> challenging behavior to make it less likely and appropriate behavior more likely. Six strategies: the <strong>Premack Principle</strong> (first–then; preferred access only after the less preferred task), <strong>behavioral momentum</strong> (2–3 <strong>high-p</strong> tasks reinforced, then the <strong>low-p</strong> task, then great reinforcement), <strong>choices</strong> (identify options, present two or more, wait, and <strong>honor the choice</strong>), <strong>pairing</strong> (associate yourself, your materials and the setting with reinforcement, all day), <strong>NCR</strong> (a <em>functionally related</em> reinforcer delivered on a fixed schedule regardless of behavior, which works by removing the motivation) and <strong>demand fading</strong> (start small, reinforce success, build back up). <strong>Environmental modifications</strong> cover <strong>meeting basic needs, ensuring safety, visual supports and an enriched environment</strong>. Pick a strategy by the <strong>MO</strong> — deprivation/EO favours Premack and momentum, satiation/AO means switch reinforcers or enrich — and by the <strong>function</strong>: escape → momentum, choices, demand fading; attention → NCR and pairing; tangible → Premack and choices; automatic → NCR and pairing.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT34 exam checklist</span>
    <ul class="checklist">
      <li>Define antecedent intervention and say what it does.</li>
      <li>Define and give the implementation steps for all six antecedent strategies.</li>
      <li>Define high-p and low-p tasks.</li>
      <li>Explain why NCR works and what "functionally related" means.</li>
      <li>Explain why you must honor a choice once offered.</li>
      <li>Define environmental modification and enrichment, and name the four types.</li>
      <li>Say which strategies suit deprivation and which suit satiation.</li>
      <li>Match each of the four functions to its environmental modifications and antecedent strategies.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt35">
  <div class="plate"><span class="num" aria-hidden="true">35</span><p class="ttl">Consequence-based tools: extinction and differential reinforcement</p><p class="src">60-minute course · Extinction and its secondary effects · Implementing extinction · Differential reinforcement procedures</p></div>

  <div class="box def"><span class="lbl">Definition: consequence-based strategy</span>
    <p>What we do <strong>after</strong> a behavior occurs. These strategies <strong>change the likelihood that the behavior will happen again</strong> in the future.</p>
  </div>

  <h3 id="rbt35-extinction">Extinction</h3>
  <div class="box def"><span class="lbl">Definition: extinction</span>
    <p>Occurs when you <strong>stop providing the reinforcer that has been maintaining a behavior</strong>.</p>
  </div>
  <div class="box proc"><span class="lbl">Process: implementing extinction</span>
    <ol>
      <li><strong>Identify the function</strong> of the challenging behavior.</li>
      <li><strong>No longer provide that consequence</strong> when the challenging behavior occurs.</li>
    </ol>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Function</th><th>Under extinction</th></tr></thead>
    <tbody>
      <tr><td><strong>Attention</strong></td><td>Extinction means <strong>not giving attention</strong> when the screaming happens.</td></tr>
      <tr><td><strong>Escape</strong></td><td>Extinction means <strong>continuing the task</strong> and not letting the tantrum lead to escape.</td></tr>
      <tr><td><strong>Tangible</strong></td><td>Extinction means <strong>not handing over the toy</strong> when grabbing occurs.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: extinction is function-specific</span>
    <p>There is no such thing as "putting a behavior on extinction" in general — <strong>extinction means withholding <em>the specific reinforcer that maintains it</em></strong>. Ignoring an escape-maintained tantrum isn't extinction; it's escape, because you've stopped the demand. This is why step 1 is identifying the function, and why <a href="#rbt15">RBT15</a> matters so much.</p>
  </div>

  <h3 id="rbt35-risks">The risks of extinction</h3>
  <div class="box def"><span class="lbl">Definition: the four side effects</span>
    <dl>
      <dt>Extinction burst</dt><dd>A <strong>temporary increase in the frequency, intensity, or duration</strong> of a behavior once it no longer produces reinforcement.</dd>
      <dt>Spontaneous recovery</dt><dd>A behavior that had decreased or even stopped <strong>suddenly reappears after some time has passed</strong>.</dd>
      <dt>Extinction-induced variability</dt><dd>The original problem behavior stops working, and the learner <strong>begins trying out different behaviors</strong> to get the same outcome.</dd>
      <dt>Aggression and emotional responding</dt><dd>—</dd>
    </dl>
  </div>
  <div class="box warn"><span class="lbl">Watch out: a burst means it's working</span>
    <p>An extinction burst looks exactly like failure — the behavior gets worse. It is actually evidence the contingency has changed. The danger is that if someone gives in <em>during</em> the burst, they have just reinforced a more intense version of the behavior. That's why extinction procedures need a documented plan and a team that will hold the line, and why you report rather than improvise.</p>
  </div>

  <h3 id="rbt35-ferb">FERBs: why extinction alone isn't enough</h3>
  <div class="box def"><span class="lbl">Definition: functionally equivalent replacement behavior (FERB)</span>
    <p>A <strong>new behavior that serves the same purpose, or the same function, as the challenging behavior</strong>.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Extinction alone</th><th>Extinction + FERB</th></tr></thead>
    <tbody>
      <tr><td>Their needs are <strong>still unmet</strong>, which can lead to frustration, acting out, or other challenging behaviors.</td><td>The child has a <strong>clear and appropriate way to meet the same need</strong>. Now they know what is expected, their needs are satisfied, and the outcome is more positive for everyone.</td></tr>
    </tbody>
  </table></div>
  <p><em>Using extinction only teaches a learner what <strong>not</strong> to do — this is not useful for them.</em></p>
  <div class="tw"><table>
    <thead><tr><th>Function</th><th>Common FERBs</th></tr></thead>
    <tbody>
      <tr><td><strong>Attention</strong></td><td>Raising hand · saying the RBT's name · tapping on arm</td></tr>
      <tr><td><strong>Escape</strong></td><td>Handing a break card · "Break, please." · "Can I have more time to play?"</td></tr>
      <tr><td><strong>Tangible</strong></td><td>Asking for a toy with words · exchanging a picture of the toy · asking a friend to share</td></tr>
      <tr><td><strong>Automatic / sensory</strong></td><td>Squeezing a stress ball · using a fidget toy · using headphones</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt35-dr">Differential reinforcement</h3>
  <div class="box def"><span class="lbl">Definition: differential reinforcement</span>
    <p>A <strong>family of strategies where we reinforce some behaviors while placing others under extinction</strong>.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Type</th><th>Definition</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td><strong>DRO</strong><br><em>Other behavior</em></td><td>Reinforce the <strong>absence</strong> of the problem behavior during a set time interval.</td><td>A learner earns a token every 2 minutes they go without yelling out.</td></tr>
      <tr><td><strong>DRA</strong><br><em>Alternative behavior</em></td><td>Reinforce an <strong>alternative behavior that serves the same function</strong> as the problem behavior, withholding reinforcement for the problem behavior.</td><td>A learner who usually grabs toys is reinforced when they ask, "Can I have a turn?"</td></tr>
      <tr><td><strong>DRI</strong><br><em>Incompatible behavior</em></td><td>Reinforce a behavior that <strong>physically cannot happen at the same time</strong> as the problem behavior.</td><td>A learner who often leaves their seat is reinforced for sitting in their chair.</td></tr>
      <tr><td><strong>DRL</strong><br><em>Low rate behavior</em></td><td>Reinforce the behavior <strong>only when it occurs at a lower, more acceptable rate</strong>.</td><td>A student who interrupts 15 times per class is reinforced if they interrupt fewer than 5 times.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: all DR procedures include extinction</span>
    <p>The manual says it directly: <em>"Remember, all DR procedures require that the target challenging behavior is placed on extinction."</em> Differential reinforcement is <strong>reinforcement of one thing plus extinction of another</strong> — if you're still reinforcing the problem behavior, you're not running a DR procedure.</p>
    <p>Telling the four apart: <strong>DRO</strong> reinforces <em>nothing happening</em> for a while. <strong>DRA</strong> reinforces a <em>specific same-function alternative</em>. <strong>DRI</strong> reinforces something <em>physically impossible to do simultaneously</em>. <strong>DRL</strong> reinforces the <em>same behavior, just less of it</em> — the only one where the problem behavior still earns reinforcement, at a lower rate.</p>
  </div>
  <p>Your job as an RBT: <strong>make sure the problem behavior no longer works</strong> (place it on extinction), <strong>prompt and reinforce the new or appropriate behavior every time it happens</strong>, and <strong>keep good data</strong> so the BCBA knows how the plan is working.</p>
  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A learner hits to get the iPad. You stop giving the iPad after hits and start reinforcing them pointing to the iPad picture. Which procedure?</summary><div><p><strong>DRA</strong> — and because the alternative is a communicative response, it's also <strong>FCT</strong> (<a href="#rbt36">RBT36</a>). The pointing is a <strong>FERB</strong>: same function (tangible), acceptable form.</p></div></details>
    <details><summary>Which DR procedure reinforces the problem behavior itself?</summary><div><p><strong>DRL</strong> — you reinforce the behavior when it occurs at a <em>lower rate</em>. It's the right choice when the behavior isn't harmful but is happening too often (interrupting, asking questions), rather than something you want eliminated.</p></div></details>
  </div>

  <h3 id="rbt35-gloss">RBT35 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Consequence-Based Strategy</td><td>What we do after a behavior occurs; changes the likelihood it happens again</td><td>Extinction, DR</td><td>After the fact</td><td>—</td><td>Antecedent strategy</td></tr>
      <tr><td>Extinction</td><td>Stopping the reinforcer that has been maintaining a behavior</td><td>Not handing over the toy</td><td>It stops paying</td><td>Planned ignoring (attention only)</td><td>Reinforcement</td></tr>
      <tr><td>Extinction Burst</td><td>A temporary increase in frequency, intensity, or duration once the behavior no longer produces reinforcement</td><td>Screaming gets louder first</td><td>It gets worse before better</td><td>Spontaneous recovery</td><td>—</td></tr>
      <tr><td>Spontaneous Recovery</td><td>A behavior that had decreased or stopped suddenly reappears after time has passed</td><td>Returns two weeks later</td><td>It comes back</td><td>Extinction burst</td><td>—</td></tr>
      <tr><td>Extinction-Induced Variability</td><td>The original behavior stops working and the learner tries different behaviors to get the same outcome</td><td>Hitting → throwing → yelling</td><td>Tries something else</td><td>Response generalization</td><td>—</td></tr>
      <tr><td>Functionally Equivalent Replacement Behavior (FERB)</td><td>A new behavior serving the same purpose/function as the challenging behavior</td><td>Break card for escape</td><td>Same job, better form</td><td>Replacement behavior</td><td>Challenging behavior</td></tr>
      <tr><td>Differential Reinforcement</td><td>Reinforcing some behaviors while placing others under extinction</td><td>DRO, DRA, DRI, DRL</td><td>Reinforce this, not that</td><td>—</td><td>—</td></tr>
      <tr><td>DRO</td><td>Reinforce the absence of the problem behavior for a set amount of time</td><td>Token every 2 min without yelling</td><td>O = Omission / Other</td><td>DRI</td><td>DRL</td></tr>
      <tr><td>DRA</td><td>Reinforce a specific appropriate alternative serving the same function; withhold reinforcement for the problem behavior</td><td>"Can I have a turn?"</td><td>A = Alternative</td><td>FCT</td><td>DRO</td></tr>
      <tr><td>DRI</td><td>Reinforce a behavior that cannot physically happen at the same time as the problem behavior</td><td>Sitting instead of leaving the seat</td><td>I = Incompatible</td><td>DRA</td><td>—</td></tr>
      <tr><td>DRL</td><td>Reinforce the behavior only when it occurs at a lower rate than before</td><td>Fewer than 5 interruptions</td><td>L = Low rate</td><td>—</td><td>DRO</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT35 in one breath</span>
    <p><strong>Consequence-based strategies</strong> are what you do <em>after</em> a behavior to change how likely it is to recur. <strong>Extinction</strong> means stopping the reinforcer that maintains the behavior, implemented in two steps — <strong>identify the function, then no longer provide that consequence</strong> — so it looks different for each function: no attention for attention, <em>continue the task</em> for escape, no toy for tangible. Its four risks are the <strong>extinction burst</strong> (temporary increase in frequency, intensity or duration), <strong>spontaneous recovery</strong> (it reappears later), <strong>extinction-induced variability</strong> (they try other behaviors) and <strong>aggression and emotional responding</strong>. Extinction alone only teaches what <em>not</em> to do, so it is paired with a <strong>FERB</strong> — a replacement serving the same function, like a break card for escape or a picture exchange for tangible. <strong>Differential reinforcement</strong> reinforces some behaviors while placing others on extinction, and <strong>every DR procedure includes extinction</strong>: <strong>DRO</strong> reinforces the absence of the behavior for an interval, <strong>DRA</strong> reinforces a same-function alternative, <strong>DRI</strong> reinforces something physically incompatible, and <strong>DRL</strong> reinforces the behavior at a lower rate.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT35 exam checklist</span>
    <ul class="checklist">
      <li>Define consequence-based strategy and extinction.</li>
      <li>Give the two steps to implement extinction, and say what it looks like for each function.</li>
      <li>Name and define the four risks of extinction.</li>
      <li>Explain why an extinction burst is evidence the procedure is working, and the danger during it.</li>
      <li>Define FERB and explain why extinction alone is insufficient.</li>
      <li>Give common FERBs for all four functions.</li>
      <li>Define differential reinforcement and all four types with examples.</li>
      <li>State what every DR procedure requires, and which DR still reinforces the problem behavior.</li>
      <li>Describe the RBT's three jobs during a DR procedure.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt36">
  <div class="plate"><span class="num" aria-hidden="true">36</span><p class="ttl">Functional Communication Training (FCT)</p><p class="src">30-minute course · Understanding and implementing functional communication training</p></div>

  <div class="box def"><span class="lbl">Definition: FCT</span>
    <p>A <strong>special type of DRA procedure</strong> teaching clients to <strong>use communication to access reinforcement</strong> in their everyday lives. <strong>The FERB is always a communicative response</strong> that results in the same reinforcement as the challenging behavior.</p>
  </div>
  <div class="box proc"><span class="lbl">The logic, in two rows</span>
    <div class="tw"><table>
      <thead><tr><th>Antecedent</th><th>Behavior</th><th>Consequence</th></tr></thead>
      <tbody>
        <tr><td>Antecedent</td><td><strong>FERB (communication)</strong></td><td><strong>Same SR+</strong> as the challenging behavior used to receive</td></tr>
        <tr><td>Antecedent</td><td>Challenging behavior</td><td><strong>Extinction</strong> (no reinforcement)</td></tr>
      </tbody>
    </table></div>
    <p>When the FERB is a <em>communicative</em> response, you are using a specific kind of DRA — <strong>Functional Communication Training</strong>.</p>
  </div>
  <div class="box warn"><span class="lbl">Watch out: FCT is DRA with a narrower definition</span>
    <p>Every FCT is a DRA. Not every DRA is FCT. The distinguishing feature is that <strong>the replacement must be communication</strong>. Reinforcing a learner for sitting instead of eloping is DRA (and DRI); reinforcing them for saying "break please" instead of eloping is FCT.</p>
  </div>

  <h3 id="rbt36-modalities">Communication modalities</h3>
  <p><strong>Communication is a core deficit of autism</strong>, and it takes many forms — all of which may be reinforced as alternatives to challenging behaviors. Five common ways people with autism may communicate:</p>
  <div class="tw"><table>
    <tbody>
      <tr><td><strong>Sounds / speech</strong></td><td><strong>Hand or body movement</strong></td><td><strong>Facial expression</strong></td><td><strong>Pictures / visuals</strong></td><td><strong>Behavior</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box def"><span class="lbl">Definition: the four FCT targets</span>
    <dl>
      <dt>Picture exchange system</dt><dd>A communication system where a client uses <strong>visuals — pictures, symbols, or words</strong> — to let others know what they want or need.</dd>
      <dt>Sign language</dt><dd>A communication system using <strong>universally recognized hand and body motions</strong>.</dd>
      <dt>Gestures</dt><dd>Body or hand motions that <strong>may not be part of a formal sign language system</strong> but are still recognized in a client's environment.</dd>
      <dt>Speech</dt><dd>The client using <strong>sounds, words, or phrases spoken aloud</strong> to let others know their wants or needs.</dd>
    </dl>
  </div>
  <div class="box warn"><span class="lbl">Watch out: "behavior" is on the modality list</span>
    <p>Listing <em>behavior</em> as a form of communication is the whole premise of FCT. The challenging behavior <strong>is</strong> communication — it's just communication that works at too high a cost. FCT doesn't stop the client communicating; it gives them a better channel for the same message.</p>
  </div>

  <h3 id="rbt36-steps">Implementing FCT</h3>
  <div class="box proc"><span class="lbl">Process: the five steps</span>
    <ol>
      <li><strong>Know the function</strong> of the behavior you are replacing.</li>
      <li><strong>Know the target response.</strong> This could be a picture exchange, ASL/gestures, or a spoken word or phrase.</li>
      <li><strong>Teach the target response.</strong> Use <strong>shaping and prompting/fading</strong> so the client practices the response correctly.</li>
      <li><strong>Reinforce the target response.</strong> Provide <strong>the same reinforcer that used to maintain the problem behavior</strong>.</li>
      <li><strong>Use extinction.</strong> Withhold reinforcement for the inappropriate behavior.</li>
    </ol>
  </div>
  <p><strong>Embed FCT throughout every session.</strong> The question to keep asking: <em>"What does my client want right now, and how can I turn that into a chance to practice communication?"</em></p>
  <div class="tw"><table>
    <thead><tr><th>Moment</th><th>Opportunity</th></tr></thead>
    <tbody>
      <tr><td>During play</td><td>Pause before giving the next piece of a puzzle and prompt your client to request it.</td></tr>
      <tr><td>At snack time</td><td>Wait for them to ask for "juice" or exchange a picture card before handing over the drink.</td></tr>
      <tr><td>During group activities</td><td>Prompt them to tap your arm and say "look" to get your attention.</td></tr>
      <tr><td>When work gets tough</td><td>Prompt them to use their <strong>break card</strong> instead of escaping the task.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: step 4 is the one people soften</span>
    <p>The replacement must get <strong>the same reinforcer</strong>, not a lesser one. If hitting used to produce the iPad and "iPad please" produces praise, the learner will go back to hitting — because hitting still works better. The whole mechanism depends on the FERB being <em>at least as efficient</em> as the behavior it replaces.</p>
  </div>

  <h3 id="rbt36-gloss">RBT36 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Functional Communication Training (FCT)</td><td>A special type of DRA teaching clients to use communication to access reinforcement in everyday life</td><td>Break card instead of screaming</td><td>DRA where the FERB talks</td><td>DRA</td><td>—</td></tr>
      <tr><td>Picture Exchange System</td><td>A communication system where a client uses visuals — pictures, symbols, or words — to say what they want or need</td><td>Handing over a juice card</td><td>Trade a picture</td><td>AAC</td><td>Speech</td></tr>
      <tr><td>Sign Language</td><td>A communication system using universally recognized hand and body motions</td><td>ASL "more"</td><td>Formal signs</td><td>Gestures</td><td>—</td></tr>
      <tr><td>Gestures</td><td>Body or hand motions that may not be part of a formal sign system but are recognized in the client's environment</td><td>Tapping your arm</td><td>Informal signs</td><td>Sign language</td><td>—</td></tr>
      <tr><td>Speech</td><td>The client using sounds, words, or phrases spoken aloud to communicate wants or needs</td><td>"Break, please"</td><td>Spoken aloud</td><td>Mand</td><td>Picture exchange</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT36 in one breath</span>
    <p><strong>FCT</strong> is a <strong>special type of DRA</strong> in which the <strong>FERB is always a communicative response</strong> that earns the <em>same</em> reinforcement the challenging behavior used to earn, while the challenging behavior goes on <strong>extinction</strong>. Because communication is a core deficit of autism, the replacement can take many forms — <strong>sounds/speech, hand or body movement, facial expression, pictures/visuals, and behavior itself</strong> — and the four named targets are <strong>picture exchange, sign language, gestures and speech</strong>. Five steps: <strong>know the function, know the target response, teach it with shaping and prompting/fading, reinforce it with the same reinforcer, and put the problem behavior on extinction</strong>. Then <strong>embed it throughout every session</strong> by asking what the client wants right now and turning it into a chance to practise — pausing mid-puzzle, waiting at snack, prompting a tap for attention, offering the break card when work gets hard.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT36 exam checklist</span>
    <ul class="checklist">
      <li>Define FCT and explain why it is a special type of DRA.</li>
      <li>Draw the two-row contingency showing FERB vs challenging behavior.</li>
      <li>Identify the five communication modalities and the four FCT targets.</li>
      <li>Explain why "behavior" counts as communication.</li>
      <li>List the five steps of implementing FCT.</li>
      <li>Explain why the FERB must earn the same reinforcer, not a lesser one.</li>
      <li>Give four examples of embedding FCT in a session.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt37">
  <div class="plate"><span class="num" aria-hidden="true">37</span><p class="ttl">Punishment and ABA</p><p class="src">30-minute course · Conceptual and procedural aspects of punishment · Common procedures · Ethical and professional standards</p></div>

  <h3 id="rbt37-punishment">Positive and negative punishment</h3>
  <div class="box def"><span class="lbl">Definition: punishment</span>
    <p>Occurs when a behavior is followed by a consequence, and that consequence makes the behavior <strong>less likely to happen again in the future</strong>.</p>
    <dl>
      <dt>Positive punishment</dt><dd>Something is <strong>added</strong> after a behavior, making the behavior <strong>less likely</strong> to occur again.</dd>
      <dt>Negative punishment</dt><dd>Something is <strong>removed</strong> after a behavior, making the behavior <strong>less likely</strong> to happen again.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Example</th><th>A</th><th>B</th><th>C</th><th>Effect</th></tr></thead>
    <tbody>
      <tr><td><strong>Positive punishment</strong></td><td>Teacher presents math assignment</td><td>Student crumples the paper</td><td>Teacher reprimands the student</td><td>Crumpling <strong>decreases</strong> — something aversive was <em>added</em></td></tr>
      <tr><td><strong>Negative punishment</strong></td><td>Parent asks child to share toy</td><td>Child throws the toy</td><td>Parent takes the toy away for the rest of the day</td><td>Throwing <strong>decreases</strong> — something preferred was <em>removed</em></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: the 2×2 is now complete</span>
    <p>Put this next to <a href="#rbt03-reinf">RBT03</a>: <strong>positive/negative</strong> = added/removed. <strong>Reinforcement/punishment</strong> = behavior up/down. Four combinations, and the only way to tell which you're looking at is <strong>what happened to the behavior afterwards</strong>. A "consequence" that didn't change the behavior is neither.</p>
  </div>

  <h3 id="rbt37-common">Common punishment procedures</h3>
  <div class="tw"><table>
    <thead><tr><th>Procedure</th><th>Definition</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td><strong>Time-out</strong></td><td>Removing access to reinforcement for a short period after a behavior.</td><td>—</td></tr>
      <tr><td><strong>Non-exclusionary time-out</strong></td><td>The learner <strong>stays in the environment</strong> but loses access to reinforcement.</td><td>RBT places a red "X" on the child's desk following a challenging behavior, letting the child and others know reinforcement is temporarily unavailable even though the child is still participating.</td></tr>
      <tr><td><strong>Exclusionary time-out</strong></td><td>The learner is <strong>removed from the reinforcing environment</strong> altogether.</td><td>A child might be taken out of the play room after aggressive behavior.</td></tr>
      <tr><td><strong>Planned ignoring</strong></td><td>An adult <strong>withholds attention</strong> following a behavior in order to reduce it.</td><td>A student shouts out for attention; the teacher intentionally does not respond, and gives attention only when the student raises their hand appropriately.</td></tr>
      <tr><td><strong>Response cost</strong></td><td>Something the learner has <strong>already earned is taken away</strong> after a behavior.</td><td>In a token economy, a student who yells out an answer might lose one token.</td></tr>
      <tr><td><strong>Reprimands</strong></td><td><strong>Brief verbal corrections</strong> after a behavior.</td><td>A student blurts out during class and the teacher says, "That's not appropriate."</td></tr>
      <tr><td><strong>Overcorrection</strong></td><td>The learner must <strong>correct the results of their misbehavior</strong>, sometimes in an exaggerated way.</td><td>—</td></tr>
      <tr><td><strong>Restitutional overcorrection</strong></td><td>Restoring the environment to a <strong>better condition than before</strong> the behavior occurred.</td><td>If a child scribbles on one desk, they may have to clean all the desks.</td></tr>
      <tr><td><strong>Positive practice overcorrection</strong></td><td>Requiring the learner to <strong>repeatedly practice the correct behavior</strong>.</td><td>If a child runs down the hall, they may have to walk back and forth several times.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: planned ignoring vs extinction</span>
    <p>They can look identical. <strong>Planned ignoring</strong> is listed here as a punishment procedure — withholding attention to reduce a behavior. <strong>Extinction</strong> (<a href="#rbt35-extinction">RBT35</a>) is withholding <em>the maintaining reinforcer</em>. When the behavior is attention-maintained, ignoring it <em>is</em> extinction. When it's escape-maintained, ignoring it isn't extinction at all — it's accidentally delivering escape.</p>
  </div>

  <h3 id="rbt37-risks">The four risks of punishment</h3>
  <div class="tw"><table>
    <thead><tr><th>Risk</th><th>What it means</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td><strong>Emotional responding</strong></td><td>Punishment procedures can lead to <strong>crying, anger, or even aggression</strong>.</td><td>A child removed from play for hitting may scream, cry, or lash out at others in the moment.</td></tr>
      <tr><td><strong>Escape or avoidance</strong></td><td>A learner may try to get away from <strong>the situation, the task, or even the person delivering the consequence</strong>.</td><td>A child might refuse to enter the classroom where they've experienced frequent time-outs.</td></tr>
      <tr><td><strong>Behavioral contrast</strong></td><td>A behavior <strong>decreases in one setting but increases in another</strong>.</td><td>A child's yelling may decrease in the classroom after punishment procedures, but the same behavior may increase at home.</td></tr>
      <tr><td><strong>Strained therapeutic rapport</strong></td><td>If punishment is used too often, learners and caregivers may begin to see staff as <strong>someone to avoid</strong> rather than someone who supports growth.</td><td>A learner may prefer to work with RBTs who are paired with reinforcement.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt37-considerations">Ethical and professional considerations</h3>
  <div class="box warn"><span class="lbl">A note on punishment — read this one carefully</span>
    <p><strong>"Punishment strategies should be avoided when working with clients."</strong> These include consequences such as <strong>reprimands, time out, taking away reinforcers contingent on challenging behavior, and many others.</strong></p>
    <p>If punishment strategies are <strong>medically necessary</strong> to manage challenging behavior, the BCBA must:</p>
    <ol>
      <li><strong>Write a detailed description</strong> of the punishment procedure in the client's Behavior Intervention Plan.</li>
      <li><strong>Seek approval from clinical leadership</strong> before implementing the plan.</li>
      <li><strong>Directly train the technician(s)</strong> on implementation of the punishment procedure <strong>BEFORE</strong> the technician may implement the plan.</li>
    </ol>
    <p><em>If you have questions or concerns regarding punishment, reach out to your BCBA immediately.</em></p>
  </div>
  <div class="box warn"><span class="lbl">Watch out: this is the module where "knowing it" and "doing it" split</span>
    <p>You must be able to <strong>define and recognise</strong> every procedure above — the exam tests them. You must also know that your default is <strong>not to use them</strong>, and that three conditions must be met before you ever implement one. Compare <a href="#rbt11-section2">RBT11 responsibility #5</a>: restrictive or punishment-based procedures only when in a documented plan <em>and</em> after your supervisor has verified your competence.</p>
  </div>

  <h3 id="rbt37-gloss">RBT37 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Punishment</td><td>A behavior is followed by a consequence that makes the behavior less likely in future</td><td>Behavior decreases</td><td>Behavior goes down</td><td>—</td><td>Reinforcement</td></tr>
      <tr><td>Positive Punishment</td><td>Something is added after a behavior, making it less likely to occur again</td><td>A reprimand</td><td>+ added, behavior ↓</td><td>—</td><td>Negative punishment</td></tr>
      <tr><td>Negative Punishment</td><td>Something is removed after a behavior, making it less likely to happen again</td><td>Toy taken away</td><td>− removed, behavior ↓</td><td>Response cost</td><td>Positive punishment</td></tr>
      <tr><td>Time-out</td><td>Removing access to reinforcement for a short period after a behavior</td><td>Brief loss of access</td><td>Time out from reinforcement</td><td>Negative punishment</td><td>—</td></tr>
      <tr><td>Non-Exclusionary Time-out</td><td>The learner stays in the environment but loses access to reinforcement</td><td>Red "X" on the desk</td><td>Stays, but can't earn</td><td>Exclusionary time-out</td><td>Exclusionary time-out</td></tr>
      <tr><td>Exclusionary Time-out</td><td>The learner is removed from the reinforcing environment altogether</td><td>Taken out of the play room</td><td>Removed from the room</td><td>Non-exclusionary</td><td>Non-exclusionary</td></tr>
      <tr><td>Response Cost</td><td>Something the learner has already earned is taken away after a behavior</td><td>Losing a token</td><td>It costs them</td><td>Negative punishment</td><td>Token delivery</td></tr>
      <tr><td>Reprimands</td><td>Brief verbal corrections after a behavior</td><td>"That's not appropriate."</td><td>A telling-off</td><td>Positive punishment</td><td>Praise</td></tr>
      <tr><td>Planned Ignoring</td><td>An adult withholds attention following a behavior in order to reduce it</td><td>No response to shouting out</td><td>Deliberately ignore</td><td>Extinction (attention)</td><td>Attention</td></tr>
      <tr><td>Overcorrection</td><td>The learner must correct the results of their misbehavior, sometimes in an exaggerated way</td><td>Cleaning all the desks</td><td>Correct it, and then some</td><td>Restitutional / positive practice</td><td>—</td></tr>
      <tr><td>Restitutional Overcorrection</td><td>Restoring the environment to a better condition than before the behavior occurred</td><td>Scribbles on one desk, cleans all</td><td>Restore it better</td><td>Overcorrection</td><td>Positive practice</td></tr>
      <tr><td>Positive Practice Overcorrection</td><td>Requiring the learner to repeatedly practice the correct behavior</td><td>Walking the hall several times</td><td>Practise it right, repeatedly</td><td>Overcorrection</td><td>Restitutional</td></tr>
      <tr><td>Behavioral Contrast</td><td>A side effect of punishment: a behavior decreases in one setting but increases in another</td><td>Down at school, up at home</td><td>Pops up elsewhere</td><td>—</td><td>Generalization</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT37 in one breath</span>
    <p><strong>Punishment</strong> is any consequence that makes a behavior <strong>less likely</strong> in future: <strong>positive punishment</strong> adds something aversive, <strong>negative punishment</strong> removes something preferred — and as with reinforcement, positive and negative mean <em>added</em> and <em>removed</em>, while what defines it as punishment is that the behavior <strong>went down</strong>. The common procedures are <strong>time-out</strong> (non-exclusionary: stays but loses access; exclusionary: removed from the environment), <strong>planned ignoring</strong>, <strong>response cost</strong> (losing something already earned), <strong>reprimands</strong>, and <strong>overcorrection</strong> (restitutional: restore the environment better than before; positive practice: repeatedly practise the correct behavior). Its four risks are <strong>emotional responding, escape or avoidance, behavioral contrast</strong> (decreases in one setting, increases in another) and <strong>strained therapeutic rapport</strong>. The professional standard is unambiguous: <strong>punishment strategies should be avoided</strong>, and if medically necessary the BCBA must <strong>write it in detail into the BIP, get approval from clinical leadership, and directly train the technician before they implement it</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT37 exam checklist</span>
    <ul class="checklist">
      <li>Define punishment, positive punishment, and negative punishment, with examples.</li>
      <li>Complete the 2×2 with reinforcement and explain what distinguishes the four cells.</li>
      <li>Define and recognise examples of time-out, non-exclusionary and exclusionary time-out, planned ignoring, response cost, reprimands, and both overcorrection types.</li>
      <li>Distinguish planned ignoring from extinction.</li>
      <li>Name and define the four risks of punishment, with an example of each.</li>
      <li>State the professional standard on using punishment.</li>
      <li>List the three things the BCBA must do before a punishment procedure may be implemented.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt38">
  <div class="plate"><span class="num" aria-hidden="true">38</span><p class="ttl">Severe behavior: prevention and safe responding</p><p class="src">60-minute course · Conceptual and procedural aspects of crisis intervention · Implementing crisis/emergency procedures</p></div>

  <div class="box warn"><span class="lbl">Read the manual's own framing first</span>
    <p><em>"New RBTs are not typically assigned to clients who engage in severe behaviors. Because of that, we did not go into these procedures in extensive detail during this course. The goal of this lesson is to give you enough information to stay safe with the majority of our clients. If you ever work with a client who requires more advanced or individualized intervention strategies — either now or in the future — ask your supervisor for specific training and opportunities to practice those skills before implementing them."</em></p>
  </div>

  <h3 id="rbt38-values">Severe behavior and client rights</h3>
  <div class="box def"><span class="lbl">Definition: severe behavior (aka crisis)</span>
    <p>When behavior poses an <strong>immediate risk of harm to the client, to others, or to property</strong>, and if it <strong>interferes with participation in daily life</strong>.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Value</th><th>What it means</th></tr></thead>
    <tbody>
      <tr><td><strong>Right to effective, individualized, and least restrictive treatment</strong></td><td>Severe behavior signals that something in the environment isn't working for the client. Using individualized, least restrictive strategies keeps everyone safe and supports learning.</td></tr>
      <tr><td><strong>Right to respect, dignity, and compassion</strong></td><td>Severe behavior can be stressful, but responding calmly prevents harm and maintains trust. Patience and respect help de-escalate and strengthen therapeutic relationships.</td></tr>
      <tr><td><strong>Right to environments free from abuse, neglect, humiliation, restraint, and seclusion</strong></td><td>Using force or punishment to control behavior <strong>violates client rights and can cause harm</strong>. Focusing on safety, prevention, and skill-building supports lasting, positive change.</td></tr>
      <tr><td><strong>Compassionate care</strong></td><td>Providing services with patience, respect, and empathy keeps clients safe and valued. Preserving dignity builds trust, even during challenging moments.</td></tr>
      <tr><td><strong>Trauma-informed care</strong></td><td>Past trauma can shape how clients respond to people and environments. Adjusting your approach helps <strong>prevent re-traumatization</strong> and builds trust.</td></tr>
      <tr><td><strong>Team work culture</strong></td><td>Collaboration with staff, caregivers, and other providers promotes consistency and support, leading to safer, more effective outcomes.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt38-general">General safety and prevention strategies</h3>
  <div class="tw"><table>
    <thead><tr><th>Area</th><th>What to do</th></tr></thead>
    <tbody>
      <tr><td><strong>Follow the dress code</strong></td><td>Closed-toed shoes · no dangling jewelry · avoid hoods/strings · keep fingernails short · keep hair pulled back</td></tr>
      <tr><td><strong>Be client aware</strong></td><td>Know history of severe behavior · assess/use PPE if needed · seek support · be mindful of cultural and family preferences</td></tr>
      <tr><td><strong>Be situation aware</strong></td><td>Constantly scan the environment · know who is nearby to help · position the environment to support safety</td></tr>
      <tr><td><strong>Consider body position</strong></td><td>Keep clients in sight · keep clients within reach · keep clients in front of you · put yourself between clients and others (peers, staff, visitors)</td></tr>
      <tr><td><strong>Never be alone</strong></td><td>BlueSprig requires that a <strong>second adult be present during all services</strong> — another staff member, parent, or teacher. <strong>You should never be alone with a client, including behind a closed door.</strong></td></tr>
      <tr><td><strong>Never carry clients</strong></td><td>Technicians should <strong>NEVER pick up or carry a learner</strong> — even during play.</td></tr>
      <tr><td><strong>Never leave a client unattended</strong></td><td>If you leave a learner (end of session, break, bathroom), you <strong>MUST specifically tell another person to watch the learner</strong> and they <strong>MUST respond that they understand</strong> they are responsible for the learner.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Workplace-specific</span>
    <p>The "second adult present during all services" rule is a <strong>BlueSprig policy</strong>, not a BACB requirement. Follow it at work; don't expect it as a certification-exam answer. The handoff rule for leaving a client — <em>tell someone and have them confirm</em> — is good practice everywhere.</p>
  </div>

  <h3 id="rbt38-boundaries">Three boundaries you may not cross</h3>
  <div class="tw"><table>
    <tbody>
      <tr><td><strong>Do NOT restrain clients</strong></td><td><strong>Never put a client in seclusion</strong></td><td><strong>Never yell at, shame, or intentionally harm a client</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box def"><span class="lbl">Definition: the five safety terms</span>
    <dl>
      <dt>Restraint</dt><dd>Any action that <strong>prevents a client from freely moving their body</strong>.</dd>
      <dt>Seclusion</dt><dd>Placing a client <strong>alone in a space where they are not free to leave</strong>.</dd>
      <dt>Blocking</dt><dd><strong>Protecting yourself or the client</strong> by preventing contact with aggression or self-injury.</dd>
      <dt>Stabilizing</dt><dd>Using <strong>calm, steady pressure or positioning to stop unsafe movement without restraining</strong> the client.</dd>
      <dt>Release</dt><dd>A safe technique used to <strong>remove yourself or another person from a client's grasp</strong> — using the <strong>least amount of force necessary</strong>.</dd>
    </dl>
  </div>

  <h3 id="rbt38-respond">The five-step response to severe behavior</h3>
  <div class="box proc"><span class="lbl">Process: appropriate response to severe behavior</span>
    <ol>
      <li><strong>Get in a safe stance.</strong> Stand with your feet shoulder-width apart, one slightly forward, and your body angled toward the client. Keep your hands open, elbows bent, and eyes on the client.</li>
      <li><strong>Secure the environment.</strong> Calmly remove dangerous or breakable items if property destruction occurs, ask peers or other clients to leave the room, and position yourself between the client and others until everyone is safe. <strong>Call for help if needed.</strong></li>
      <li><strong>Step back — don't grab.</strong> Get out of the way instead of holding the client or pushing against their body. Stepping back lowers the risk of injury for both of you. <strong>Many clients will not follow you, so once you are out of range the behavior will stop.</strong></li>
      <li><strong>Block only when necessary.</strong> If you cannot get out of the way, use your <strong>forearms or calves/thighs</strong> to stop contact from a hit, kick, or grab before it lands.</li>
      <li><strong>Use safe stabilization and release techniques.</strong> If a client grabs or bites you, <strong>stay calm and stabilize instead of pulling away</strong>. Call for help. Whether the client grabs your arm, clothing, or hair, <strong>hold steady</strong> and use the correct release method to disengage safely.</li>
    </ol>
  </div>
  <div class="box warn"><span class="lbl">Watch out: "don't pull away" is counterintuitive and important</span>
    <p>Every instinct says pull. Pulling away from a bite or a hair grab causes <em>more</em> injury — to you and potentially to the client. The instruction across all three release scenarios is the same: <strong>call for help, do not pull away, hold steady, and wait for support.</strong></p>
  </div>

  <h3 id="rbt38-blocking">Blocking specific behaviors</h3>
  <div class="tw"><table>
    <thead><tr><th>Situation</th><th>What to do</th></tr></thead>
    <tbody>
      <tr><td><strong>Walking with learners who may elope or drop</strong></td><td>Place an <strong>open palm gently on their upper back or opposite shoulder</strong> · rest their hand closest to you in your hand, with <strong>their hand on top of yours</strong> · <strong>do not grab or wrap your fingers</strong> around their wrist or arm.</td></tr>
      <tr><td><strong>If a client runs from you</strong></td><td><strong>Call for assistance immediately</strong> · keep the client in sight at all times · position yourself between the client and exits or hazards · if safe, gently guide them back using an open palm on their upper back.</td></tr>
      <tr><td><strong>If a client drops to the floor</strong></td><td>Guide them down gently · once calm, use <strong>minimal force necessary</strong> to prompt them to stand · <strong>never hold or lift by joints</strong> · if they resist the physical prompt, <strong>stop and wait for help</strong>.</td></tr>
      <tr><td><strong>If a client tries to hit or grab you</strong></td><td>Keep your hands open and elbows bent · rotate the arm closest to the client to deflect the swing (softly) · step back to give both of you space · return to your safe stance.</td></tr>
      <tr><td><strong>Kick, from standing</strong></td><td><strong>Step slightly into the kick</strong> · turn your body sideways · keep your front foot grounded for stability.</td></tr>
      <tr><td><strong>Kick, from seated</strong></td><td>Kneel at the client's head (lunge position) · hover your open palms about 2" above their shins · keep elbows soft and arms relaxed.</td></tr>
      <tr><td><strong>If a client tries to bite you</strong></td><td>Move behind the client if you can; prompt from the side or back · if you can't move, place an open palm on the client's shoulder and step back · keep fingers extended, <strong>do not grab</strong> · <strong>do not cover their face or push backward</strong>.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt38-release">Stabilizing and releasing</h3>
  <div class="tw"><table>
    <thead><tr><th>If a client…</th><th>Steps</th></tr></thead>
    <tbody>
      <tr><td><strong>Bites you</strong></td><td>Call for help. <strong>Do not pull away.</strong> → Place an open palm on the <strong>back of the client's head (avoid the neck)</strong> → <strong>Gently push the bitten area <em>into</em> the client's mouth</strong> until the jaw opens → Quickly remove yourself once released; <strong>seek medical attention</strong>.</td></tr>
      <tr><td><strong>Grabs your clothing or body</strong></td><td>Call for assistance immediately → <strong>Do not pull away</strong> → Hold the part of your clothing or body that's being grabbed <strong>close to your body</strong> → Wait for support to arrive to help release the hold.</td></tr>
      <tr><td><strong>Grabs your hair</strong></td><td>Call for assistance immediately → <strong>Grasp the client's forearm(s) and pull them toward your head</strong> → Keep your feet shoulder-width apart and knees slightly bent → Wait for support to arrive to help release the hold.</td></tr>
    </tbody>
  </table></div>
  <div class="box proc"><span class="lbl">Friendly reminders from the end of the course</span>
    <ul>
      <li><strong>If there is a BIP in place, always follow that as trained.</strong></li>
      <li><strong>Record data after severe behavior.</strong> If formal data aren't set up, collect <strong>ABC data</strong>.</li>
      <li><strong>If new behavior occurs or behavior intensifies, contact the BCBA immediately.</strong></li>
      <li><strong>Always check the client for injuries</strong> after severe behavior and <strong>document appropriately</strong>.</li>
    </ul>
  </div>

  <h3 id="rbt38-gloss">RBT38 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Severe Behavior (crisis)</td><td>Behavior posing an immediate risk of harm to the client, others, or property, and interfering with participation in daily life</td><td>Aggression, self-injury</td><td>Immediate risk</td><td>Crisis</td><td>Precursor behavior</td></tr>
      <tr><td>Restraint</td><td>Any action that prevents a client from freely moving their body</td><td>Holding a client still</td><td>Can't move freely</td><td>Seclusion</td><td>Blocking</td></tr>
      <tr><td>Seclusion</td><td>Placing a client alone in a space where they are not free to leave</td><td>Locked room</td><td>Alone and can't leave</td><td>Restraint</td><td>Exclusionary time-out (supervised)</td></tr>
      <tr><td>Blocking</td><td>Protecting yourself or the client by preventing contact with aggression or self-injury</td><td>Forearm stops a hit</td><td>Block the contact</td><td>Stabilizing</td><td>Restraint</td></tr>
      <tr><td>Stabilizing</td><td>Using calm, steady pressure or positioning to stop unsafe movement without restraining the client</td><td>Steady positioning during a bite</td><td>Steady, not holding</td><td>Blocking</td><td>Restraint</td></tr>
      <tr><td>Release</td><td>A safe technique to remove yourself or another person from a client's grasp, using the least force necessary</td><td>Hair-pull release</td><td>Get free safely</td><td>Stabilizing</td><td>Pulling away</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT38 in one breath</span>
    <p><strong>Severe behavior (crisis)</strong> poses an immediate risk of harm to the client, others or property and interferes with daily life, and your response is grounded in client rights: <strong>effective, individualized, least restrictive treatment; respect, dignity and compassion; environments free from abuse, neglect, humiliation, restraint and seclusion; compassionate care; trauma-informed care; and a teamwork culture</strong>. Prevention comes from the <strong>dress code</strong> (closed-toed shoes, no dangling jewelry, no hoods or strings, short nails, hair back), <strong>client and situation awareness</strong>, <strong>body position</strong> (clients in sight, within reach, in front of you, you between them and others), and three absolutes — <strong>never be alone with a client, never pick up or carry a learner, never leave a client unattended without a confirmed handoff</strong>. Three boundaries you may not cross: <strong>do not restrain, never seclude, never yell at, shame or intentionally harm a client</strong>. The five-step response is <strong>get in a safe stance, secure the environment, step back don't grab, block only when necessary with forearms or calves, and use safe stabilization and release — holding steady rather than pulling away</strong>. Afterwards: <strong>follow the BIP, record data (ABC data if no formal system), contact the BCBA if behavior is new or intensifying, and check the client for injuries and document</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT38 exam checklist</span>
    <ul class="checklist">
      <li>Define severe behavior and name the six values that guide your response.</li>
      <li>List the dress code requirements and the body-position rules.</li>
      <li>State the three "never" rules about being alone, carrying, and leaving a client.</li>
      <li>Name the three boundaries you may not cross.</li>
      <li>Define restraint, seclusion, blocking, stabilizing, and release.</li>
      <li>List the five steps of responding to severe behavior.</li>
      <li>Describe how to block a hit, a standing kick, a seated kick, and a bite.</li>
      <li>Describe the release procedure for a bite, a clothing grab, and a hair pull.</li>
      <li>State the four things to do after severe behavior occurs.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt39">
  <div class="plate"><span class="num" aria-hidden="true">39</span><p class="ttl">In Sync Engagement (ISE)</p><p class="src">60-minute course · Applying behavior-change interventions within the ISE framework for effective, compassionate, individualized sessions</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt10-signs">RBT10</a>'s assent, <a href="#rbt33-anatomy">RBT33</a>'s precursor behaviors, <a href="#rbt34">RBT34</a>'s antecedent strategies, and <a href="#rbt38">RBT38</a>'s crisis response. ISE is the framework that tells you <em>which</em> of those to reach for, moment to moment.</p>
  </div>

  <h3 id="rbt39-foundations">Foundations of ISE</h3>
  <div class="box def"><span class="lbl">Definition: challenging behavior</span>
    <p>Any behavior that <strong>interferes with learning opportunities</strong>, <strong>stigmatizes a client</strong>, or <strong>creates a risk of harm for the client or others</strong>.</p>
  </div>
  <p>The six foundation values — all phrased as what great clinicians do:</p>
  <ol>
    <li>Great clinicians take steps to <strong>build, maintain, and repair rapport</strong> during session.</li>
    <li>Great clinicians demonstrate <strong>compassion</strong> by trying to take the client's perspective.</li>
    <li>Great clinicians demonstrate <strong>positive regard</strong> throughout the entire session.</li>
    <li>Great clinicians take care to protect <strong>client dignity</strong>, even when challenging behavior occurs.</li>
    <li>Great clinicians <strong>recognize and respond to signs of assent and assent withdrawal</strong>.</li>
    <li>Great clinicians are <strong>constantly aware of, and responsive to, safety risks</strong>.</li>
  </ol>
  <div class="box def"><span class="lbl">Definition: the ISE vocabulary</span>
    <dl>
      <dt>Rapport</dt><dd>Every interaction reflects a <strong>genuine, deep care for the client's growth and happiness</strong>.</dd>
      <dt>Compassion</dt><dd>Putting ourselves in the client's shoes and asking, <strong>"how would I want to be treated?"</strong> — then taking steps to help.</dd>
      <dt>Positive regard</dt><dd>The belief that <strong>every client is inherently valuable and loveable</strong>. Even when challenging behavior occurs.</dd>
      <dt>Assent</dt><dd>A client's way of <strong>showing willingness to participate</strong>.</dd>
      <dt>Client dignity</dt><dd>Recognising that clients need to be treated as <strong>individuals who have emotions, desires, preferences and needs</strong>.</dd>
    </dl>
  </div>

  <h3 id="rbt39-stages">The four stages of behavior</h3>
  <div class="tw"><table>
    <thead><tr><th>Level</th><th>Definition</th><th>Teaching</th><th>Goal</th></tr></thead>
    <tbody>
      <tr><td><strong>Happy, Connected, Progress (HCP)</strong></td><td>Client and RBT have strong rapport. Client actively and happily participates in therapy. RBT provides many learning opportunities and adjusts features of the program based on the client's behavior.</td><td><strong>This is the BEST level for meaningful learning to occur.</strong></td><td><strong>Maintain the session at this level</strong></td></tr>
      <tr><td><strong>Precursor behavior</strong></td><td>Generally harmless behaviors that <strong>warn you the session is no longer HCP</strong>. Usually they <strong>precede the occurrence of more severe challenging behaviors</strong>.</td><td>May be an appropriate time to work on manding; but <strong>pause and assess</strong>.</td><td><strong>Prevent escalation; return to HCP quickly</strong></td></tr>
      <tr><td><strong>Disruption</strong></td><td>Client engages in behavior that poses <strong>some risk of harm</strong> to the client, others, or the environment.</td><td><strong>Unlikely that clients will be ready or able to learn new skills at this level.</strong></td><td>Make sure everyone remains safe; prevent escalation; return to HCP as quickly as possible</td></tr>
      <tr><td><strong>Crisis</strong></td><td>Client engages in behavior that poses an <strong>immediate risk of serious harm</strong> to the client or others.</td><td><strong>Not a teachable moment.</strong></td><td><strong>Keep everyone safe; stop the behavior ASAP</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: the teaching column is the point</span>
    <p>Read down it: <em>best level for learning → pause and assess → unlikely they can learn → not a teachable moment.</em> As behavior escalates, <strong>your goal shifts from teaching to safety</strong>. Trying to push a demand at the disruption or crisis level isn't persistence — it's a mistake, and it escalates things further.</p>
  </div>

  <h3 id="rbt39-sync">Staying in sync: do's and don'ts</h3>
  <div class="tw"><table>
    <thead><tr><th>At level</th><th>Do's</th><th>Don'ts</th></tr></thead>
    <tbody>
      <tr><td><strong>HCP</strong></td><td>Stay flexible · offer choices · mix up DTT and NET · continue to pair · provide a high number of learning trials · continue to assess response to treatment and adjust</td><td>Ignore the client · get distracted · <strong>make work harder</strong></td></tr>
      <tr><td><strong>Precursor behavior</strong></td><td>Prompt and reinforce an <strong>easy response to get what they want</strong> · <strong>OR</strong> redirect to something else similar and preferred (offer choices, use visual cues) · <strong>OR</strong> redirect to an easy/incompatible behavior, considering <strong>behavioral momentum</strong></td><td>Continue to introduce new/difficult demands · yell, reprimand, or threaten · remove preferred items (unless necessary for safety)</td></tr>
      <tr><td><strong>Disruption</strong></td><td>Try the precursor-level strategies. <strong>If NOT effective:</strong> give the client what they want and will stop the behavior. <strong>If you CAN'T give them what they want:</strong> wait for the client to calm down; model calming strategies</td><td>Same as above, plus: <strong>restrain the client</strong></td></tr>
      <tr><td><strong>Crisis</strong></td><td><strong>Immediately call for help</strong> · assess the environment for safety and take necessary precautions <strong>within your scope</strong></td><td>Same as above</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "give the client what they want" at the disruption level</span>
    <p>This looks like it reinforces the problem behavior, and in the short term it does. ISE accepts that trade deliberately: <strong>at the disruption level, safety and de-escalation outweigh the teaching contingency.</strong> You fix the underlying problem afterwards, through antecedent strategies and FCT, not by holding the line while things get dangerous. This is also why step 3 of the return process is <em>plan for success with antecedents</em>.</p>
  </div>

  <h3 id="rbt39-return">Returning to learning</h3>
  <p><em>Stopping challenging behavior is just the first step.</em> The ultimate goal is always to return to <strong>Happy, Connected Progress</strong> so learning can continue.</p>
  <div class="box proc"><span class="lbl">Process: the four steps back to HCP</span>
    <ol>
      <li><strong>Recognize signs of de-escalation.</strong> Assess your client's behavior; recognize when they are calming down and may be ready to re-engage with you and the session.</li>
      <li><strong>Rebuild rapport.</strong> Take time to mindfully rebuild it. Consider using <strong>preference assessments and/or pairing strategies</strong>. Demonstrate positive regard and avoid doing anything to trigger challenging behavior.</li>
      <li><strong>Plan for success: antecedents!</strong> Make your best guess at what went wrong previously and make a plan. Use <strong>antecedent strategies to reduce the need to engage in challenging behavior</strong> by improving the environment and/or prompting a replacement behavior.</li>
      <li><strong>Reintroduce instruction.</strong> When you <em>and</em> the client are ready, start with <strong>easy or preferred activities</strong>, keep <strong>reinforcement rates high</strong>, and frequently assess the client's response to treatment.</li>
    </ol>
  </div>

  <h3 id="rbt39-gloss">RBT39 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Challenging Behavior</td><td>Any behavior that interferes with learning opportunities, stigmatizes a client, or creates a risk of harm</td><td>Screaming during instruction</td><td>Three tests</td><td>Interfering behavior</td><td>—</td></tr>
      <tr><td>Rapport</td><td>Every interaction reflects a genuine, deep care for the client's growth and happiness</td><td>Pairing, following their lead</td><td>The relationship</td><td>Pairing</td><td>—</td></tr>
      <tr><td>Compassion</td><td>Putting ourselves in the client's shoes and asking "how would I want to be treated?", then taking steps to help</td><td>Pausing when they're overwhelmed</td><td>Their perspective</td><td>Compassionate care</td><td>—</td></tr>
      <tr><td>Positive Regard</td><td>The belief that every client is inherently valuable and loveable, even when challenging behavior occurs</td><td>Warmth after a hard moment</td><td>Value them regardless</td><td>Dignity</td><td>—</td></tr>
      <tr><td>Assent</td><td>A client's way of showing willingness to participate</td><td>Staying near, engaged, calm</td><td>Willing, not just obedient</td><td>Assent withdrawal</td><td>—</td></tr>
      <tr><td>Client Dignity</td><td>Recognising clients as individuals who have emotions, desires, preferences and needs</td><td>Offering real choices</td><td>Treat them as a person</td><td>Positive regard</td><td>—</td></tr>
      <tr><td>Happy, Connected, Progress (HCP)</td><td>Strong rapport, active happy participation, many learning opportunities — the best level for learning</td><td>A session going well</td><td>The target state</td><td>—</td><td>Crisis</td></tr>
      <tr><td>Precursor Behavior</td><td>Generally harmless behaviors warning you the session is no longer HCP; usually precede more severe behavior</td><td>Whining, pushing materials away</td><td>The early warning</td><td>—</td><td>HCP</td></tr>
      <tr><td>Disruption</td><td>Behavior posing some risk of harm to the client, others, or the environment</td><td>Throwing materials</td><td>Some risk</td><td>—</td><td>HCP</td></tr>
      <tr><td>Crisis</td><td>Behavior posing an immediate risk of serious harm to the client or others</td><td>Aggression, self-injury</td><td>Immediate serious risk</td><td>Severe behavior</td><td>HCP</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT39 in one breath</span>
    <p><strong>Challenging behavior</strong> is any behavior that <strong>interferes with learning, stigmatizes the client, or creates a risk of harm</strong>, and <strong>In Sync Engagement</strong> is the framework for responding to it. Its six foundation values are that great clinicians <strong>build, maintain and repair rapport; demonstrate compassion by taking the client's perspective; demonstrate positive regard throughout; protect client dignity even during challenging behavior; recognise and respond to assent and assent withdrawal; and stay aware of safety risks</strong>. Behavior runs through four levels — <strong>Happy, Connected, Progress (HCP)</strong>, the best level for learning and the one to maintain; <strong>precursor behavior</strong>, harmless warning signs where you pause, assess and prevent escalation; <strong>disruption</strong>, some risk of harm where learning is unlikely; and <strong>crisis</strong>, immediate risk of serious harm and <em>not a teachable moment</em> — so <strong>as behavior escalates your goal shifts from teaching to safety</strong>. At precursor level you prompt an easy response, redirect to something preferred, or use behavioral momentum, and you never add difficult demands, yell, reprimand, threaten or remove preferred items. At disruption you try those first and, if they fail, <strong>give the client what they want</strong> or wait and model calming. At crisis you <strong>call for help immediately</strong>. Then you return to HCP in four steps: <strong>recognise de-escalation, rebuild rapport, plan for success with antecedents, and reintroduce instruction easy-first with high reinforcement</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT39 exam checklist</span>
    <ul class="checklist">
      <li>Define challenging behavior using all three of its tests.</li>
      <li>List the six foundation values of the ISE model.</li>
      <li>Define rapport, compassion, positive regard, assent, and client dignity.</li>
      <li>Name the four stages of behavior, define each, and give the goal at each level.</li>
      <li>Explain how the teaching opportunity changes as behavior escalates.</li>
      <li>Give do's and don'ts for HCP, precursor, disruption, and crisis.</li>
      <li>Explain why "give the client what they want" is acceptable at the disruption level.</li>
      <li>List the four steps for returning the client to learning.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt40">
  <div class="plate"><span class="num" aria-hidden="true">40</span><p class="ttl">Keeping your cool: emotion management for RBTs</p><p class="src">30-minute course · Staying calm during challenging behavior · Implementing ABA strategies under stress</p></div>

  <p>This module is about <em>you</em>. Every other module assumes a regulated RBT; this one covers what happens when you aren't, and how to get back.</p>

  <h3 id="rbt40-buffer">Six daily buffer habits</h3>
  <p>Use these to ensure you are mentally, physically and emotionally prepared for any challenges during the session:</p>
  <div class="tw"><table>
    <tbody>
      <tr><td><strong>Nurturing connections</strong></td><td><strong>Balanced nutrition</strong></td><td><strong>Physical activity</strong></td></tr>
      <tr><td><strong>Quality sleep</strong></td><td><strong>Mental health support</strong></td><td><strong>Mindfulness</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: these are <em>your</em> setting events</span>
    <p>Sleep, food, and connection are exactly the <strong>setting events</strong> from <a href="#rbt04-motivation">RBT04</a> — applied to you instead of the client. They don't cause your reaction to a hard session, but they make it much more or much less likely. The module is deliberately placed right after severe behavior and ISE for that reason.</p>
  </div>

  <h3 id="rbt40-fourstep">The four-step process for managing emotional responding</h3>
  <p>First, <strong>identify signs of your own dysregulation</strong>. When you observe them, follow:</p>
  <div class="box proc"><span class="lbl">Process: Pause → Breathe &amp; Regulate → Reflect → Choose</span>
    <ol>
      <li><strong>Pause</strong></li>
      <li><strong>Breathe &amp; regulate</strong></li>
      <li><strong>Reflect</strong></li>
      <li><strong>Choose</strong></li>
    </ol>
    <p>The sequence is the point: you <em>choose</em> last, after you have paused, regulated and reflected — not first, in the moment, while dysregulated.</p>
  </div>

  <h3 id="rbt40-recovery">Taking care of yourself post-incident</h3>
  <div class="tw"><table>
    <thead><tr><th>Recovery practices</th><th>Reflection tools — use 1–2</th></tr></thead>
    <tbody>
      <tr><td><strong>Brief peer debriefs</strong></td><td><strong>Name what you feel</strong></td></tr>
      <tr><td><strong>Micro-break</strong></td><td><strong>Reframe the behavior</strong></td></tr>
      <tr><td><strong>Emotional reflection log</strong></td><td><strong>Reconnect to your values</strong></td></tr>
      <tr><td></td><td><strong>Practice self-compassion</strong></td></tr>
      <tr><td></td><td><strong>Use HERO skills</strong></td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT40 in one breath</span>
    <p>Build <strong>six daily buffer habits</strong> so you arrive prepared: <strong>nurturing connections, balanced nutrition, physical activity, quality sleep, mental health support, and mindfulness</strong>. Learn to <strong>identify the signs of your own dysregulation</strong>, and when you see them run the four-step process — <strong>Pause → Breathe &amp; Regulate → Reflect → Choose</strong> — so that your action comes <em>after</em> regulation rather than instead of it. Afterwards, take care of yourself with <strong>brief peer debriefs, a micro-break, or an emotional reflection log</strong>, using one or two reflection tools: <strong>name what you feel, reframe the behavior, reconnect to your values, practice self-compassion, use HERO skills</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT40 exam checklist</span>
    <ul class="checklist">
      <li>Name the six daily buffer habits that build emotional resilience.</li>
      <li>List the four steps for managing emotional responding, in order.</li>
      <li>Explain why "choose" comes last.</li>
      <li>Name three post-incident recovery practices and five reflection tools.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt41">
  <div class="plate"><span class="num" aria-hidden="true">41</span><p class="ttl">Behavior reduction and CentralReach</p><p class="src">30-minute course · No study notes in the manual</p></div>
  <div class="box proc"><span class="lbl">No notes — here's what the manual says instead</span>
