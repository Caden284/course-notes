      <dt>Continuous data</dt><dd>Data collected on <strong>all behavior as it occurs in real time</strong> during an observation.</dd>
      <dt>Discontinuous data</dt><dd>Data recorded as an <strong>estimate</strong> of the occurrence of behavior during an observation.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Continuous</th><th>Discontinuous</th><th>Bonus</th></tr></thead>
    <tbody>
      <tr><td>Frequency · Rate · Duration · Latency · IRT · Trial-by-trial</td><td>Partial interval · Whole interval · Momentary time sampling</td><td>Permanent product</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: the three interval systems are the discontinuous ones</span>
    <p>If you remember only one thing: <strong>anything with "interval" or "sampling" in the name is discontinuous</strong>, because you are sampling rather than catching every instance. Everything else that you watch in real time — counting, timing, trial by trial — is continuous. <strong>Permanent product</strong> is listed as a bonus because you aren't observing the behavior at all; you're measuring what it left behind.</p>
    <p>And the two estimation errors are mirror images, which is exactly why they get tested together: <strong>partial interval overestimates</strong> (one second of behavior scores the whole interval) and <strong>whole interval underestimates</strong> (one second of <em>not</em> doing it loses the whole interval).</p>
  </div>

  <h3 id="rbt07-recognizing">Recognizing procedures from a scenario</h3>
  <p>The manual gives a cue for each. These are the phrases to look for:</p>
  <div class="tw"><table>
    <thead><tr><th>If the scenario says…</th><th>It's…</th></tr></thead>
    <tbody>
      <tr><td>Only a count</td><td><strong>Frequency</strong></td></tr>
      <tr><td>A count <em>per unit of time</em></td><td><strong>Rate</strong></td></tr>
      <tr><td>Time of the entire behavior</td><td><strong>Duration</strong></td></tr>
      <tr><td>Time <em>before</em> the first response</td><td><strong>Latency</strong></td></tr>
      <tr><td>Time <em>between</em> responses</td><td><strong>IRT</strong></td></tr>
      <tr><td>Discrete learning opportunities</td><td><strong>Trial-by-trial</strong></td></tr>
      <tr><td>Behavior occurred <em>at any point during</em> the interval</td><td><strong>Partial interval</strong></td></tr>
      <tr><td>Behavior occurred <em>during the entire</em> interval</td><td><strong>Whole interval</strong></td></tr>
      <tr><td>Behavior occurred <em>at the end of</em> the interval</td><td><strong>MTS</strong></td></tr>
      <tr><td>Recording the <em>output</em> of a behavior</td><td><strong>Permanent product</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box ex"><span class="lbl">Worked example: four scenarios</span>
    <ul>
      <li><em>"You start a stopwatch when you say 'come here' and stop it when she starts walking toward you."</em> → time before the first response → <strong>latency</strong>.</li>
      <li><em>"You count 14 vocal stereotypy episodes in a 30-minute session and write 'rate = 0.47/min'."</em> → a count per unit of time → <strong>rate</strong>.</li>
      <li><em>"The session is split into 10-second blocks; you mark the block if he was on-task for all ten seconds."</em> → entire interval → <strong>whole interval</strong>, which may <em>underestimate</em>.</li>
      <li><em>"At the end of each 5-minute block, a timer beeps and you look up and mark whether she is in her seat."</em> → at the end of the interval → <strong>MTS</strong>.</li>
    </ul>
  </div>

  <h3 id="rbt07-practice">Data collection practice</h3>
  <div class="box proc"><span class="lbl">Process: the six-step practice routine</span>
    <ol>
      <li>Have your data sheet ready (either electronic or printed).</li>
      <li>Have your timing device ready (phone, stopwatch, etc.).</li>
      <li>Double check you have your data sheet <em>and</em> timing device.</li>
      <li>Start the video and your timer.</li>
      <li>Watch the video carefully and record data.</li>
      <li>Once the video is over, summarize the data and double check your answers.</li>
    </ol>
  </div>

  <h3 id="rbt07-gloss">RBT07 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Frequency</td><td>The number of times a behavior occurs</td><td>7 hits</td><td>Just a count</td><td>Rate</td><td>Duration</td></tr>
      <tr><td>Rate</td><td>How many times a behavior occurs during a set amount of time</td><td>7 hits per hour</td><td>Count ÷ time</td><td>Frequency</td><td>—</td></tr>
      <tr><td>Duration</td><td>How long a behavior occurs</td><td>Tantrum lasted 4 min</td><td>How long it lasts</td><td>—</td><td>Frequency</td></tr>
      <tr><td>Latency</td><td>How long it takes for behavior to begin</td><td>8 s from SD to response</td><td>Late to start</td><td>IRT</td><td>Duration</td></tr>
      <tr><td>Interresponse time (IRT)</td><td>The time between two responses</td><td>45 s between bites</td><td>Between responses</td><td>Latency</td><td>—</td></tr>
      <tr><td>Trial-by-Trial</td><td>Recording how someone responds after the presentation of a discrete learning opportunity</td><td>✓ or ✗ per DTT trial</td><td>One mark per trial</td><td>DTT data</td><td>Interval data</td></tr>
      <tr><td>Partial-Interval Recording</td><td>Recording occurrence or non-occurrence of the target behavior during consecutive intervals of time</td><td>Any screaming in the 10 s block</td><td>Part of the interval counts</td><td>Whole interval</td><td>Whole interval</td></tr>
      <tr><td>Whole-Interval Recording</td><td>Recording the number of intervals in which the behavior occurred for the entire duration of the interval</td><td>On-task all 10 s</td><td>The whole thing counts</td><td>Partial interval</td><td>Partial interval</td></tr>
      <tr><td>Momentary time sampling (MTS)</td><td>Recording whether the target behavior occurs right at the end of each interval</td><td>Beep, look, mark</td><td>A snapshot</td><td>Interval recording</td><td>Continuous data</td></tr>
      <tr><td>Permanent Product Recording</td><td>Measuring a physical product produced by the target behavior</td><td>Completed worksheets</td><td>What it left behind</td><td>Indirect measure</td><td>Direct observation</td></tr>
      <tr><td>Continuous Data</td><td>Data collected on all behavior as it occurs in real time during an observation</td><td>Frequency, duration, IRT</td><td>Catches everything</td><td>Real-time recording</td><td>Discontinuous data</td></tr>
      <tr><td>Discontinuous Data</td><td>Data recorded as an estimate of the occurrence of behavior during an observation</td><td>Partial/whole interval, MTS</td><td>An estimate</td><td>Sampling</td><td>Continuous data</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT07 in one breath</span>
    <p>Ten data collection procedures. <strong>Continuous</strong> ones catch every instance in real time: <strong>frequency</strong> (a count), <strong>rate</strong> (count per unit time), <strong>duration</strong> (how long it lasts), <strong>latency</strong> (how long until it starts), <strong>IRT</strong> (time between two responses) and <strong>trial-by-trial</strong> (one score per discrete learning opportunity). <strong>Discontinuous</strong> ones estimate: <strong>partial interval</strong> (occurred at any point in the interval — <em>overestimates</em>), <strong>whole interval</strong> (occurred for the entire interval — <em>underestimates</em>) and <strong>momentary time sampling</strong> (occurred right at the end of the interval — misses instances in between). <strong>Permanent product</strong> sits outside both: you measure the physical thing the behavior produced instead of observing it, which is efficient but makes it hard to confirm who produced it. Match procedure to scenario by the cue words — <em>only a count</em>, <em>per unit of time</em>, <em>time before the first response</em>, <em>time between responses</em>, <em>at any point / for the entire / at the end of the interval</em> — and remember the general rule that counting and timing get hard with high-rate behavior or behavior with an unclear start and stop.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT07 exam checklist</span>
    <ul class="checklist">
      <li>Define all ten data collection procedures.</li>
      <li>Give the advantage and the limitation of each.</li>
      <li>Define continuous and discontinuous data and sort all ten procedures into them.</li>
      <li>State which interval system overestimates and which underestimates, and why.</li>
      <li>Identify the procedure from a scenario using the cue words.</li>
      <li>Explain why permanent product is treated separately.</li>
      <li>List the six steps of the data collection practice routine.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt08">
  <div class="plate"><span class="num" aria-hidden="true">08</span><p class="ttl">Basics of data entry and analysis</p><p class="src">60-minute course · Common data displays · How to record data · Analyzing and interpreting trend, level &amp; variability</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt02-phases">RBT02</a>'s graph anatomy and <a href="#rbt07">RBT07</a>'s procedures. Now you read what the data is telling you.</p>
  </div>

  <h3 id="rbt08-displays">Common data displays</h3>
  <div class="tw"><table>
    <thead><tr><th>Display</th><th>What it is</th><th>When you see it</th></tr></thead>
    <tbody>
      <tr><td><strong>Line graph</strong></td><td>Shows how something changes over time; data points are connected by lines</td><td>The default for tracking a behavior across sessions — the manual's example is a <em>Functional Communication Program</em> plotting frequency of pinching against light shoulder taps across dates, with a <strong>legend/key</strong> identifying the two data paths</td></tr>
      <tr><td><strong>Bar graph</strong></td><td>Uses bars of different lengths or heights to show and compare data; each bar is a different category or time period</td><td>Comparing categories — the manual's example is a <em>Preference Assessment</em> showing percent selected for racecar, bubbles, light wand and keyboard</td></tr>
    </tbody>
  </table></div>
  <p>Both displays carry a <strong>title</strong>, an <strong>X-axis</strong> with an <strong>axis title</strong>, a <strong>Y-axis</strong> with an axis title, <strong>data points</strong>, and — when more than one thing is plotted — a <strong>legend/key for the data paths</strong>.</p>

  <h3 id="rbt08-record">How to record data</h3>
  <p>In CentralReach: <strong>click "Restart Session" before you start collecting data for your session</strong>, and you should see the timer running during your session. If you need to review how to run a program, check the program instructions — you may have to expand them if they are hidden.</p>
  <div class="box warn"><span class="lbl">Workplace-specific</span>
    <p>CentralReach is the employer's data system, not a BACB concept. The exam will ask you about <em>duration, trial-by-trial and frequency/rate</em> recording in general; your supervisor will ask you about the buttons. Learn both, but don't confuse one for the other.</p>
  </div>

  <h3 id="rbt08-analysis">Trend, level, and variability</h3>
  <div class="box def"><span class="lbl">Definition: the three things you read off a graph</span>
    <dl>
      <dt>Level</dt><dd>The value on the <strong>vertical axis</strong> around which the data points fall — <em>how high or low</em> the data path sits.</dd>
      <dt>Trend</dt><dd>The <strong>overall direction</strong> taken by a data path — increasing, decreasing, or flat.</dd>
      <dt>Variability</dt><dd>The <strong>"bounce"</strong> — how much the data go up or down from one data point to the next.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Read this</th><th>By looking at</th><th>Low / decreasing looks like</th><th>High / increasing looks like</th></tr></thead>
    <tbody>
      <tr><td><strong>Level</strong></td><td>The <em>height</em> of the data path on each graph</td><td>Points clustered near the bottom</td><td>Points clustered near the top</td></tr>
      <tr><td><strong>Trend</strong></td><td>The <em>direction</em> of the data path</td><td>Path slopes down across sessions</td><td>Path slopes up across sessions</td></tr>
      <tr><td><strong>Variability</strong></td><td>The <em>amount of bounce</em> in the data path</td><td>A smooth, tight path</td><td>A jagged, scattered path</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: these three are independent</span>
    <p>A graph can be high <em>and</em> decreasing <em>and</em> variable all at once. Don't let one feature answer for another: "the behavior is going down" is a <strong>trend</strong> statement and says nothing about <strong>level</strong> or <strong>variability</strong>. Exam items often give you a graph and ask for all three.</p>
  </div>

  <h3 id="rbt08-interpret">Interpreting data and deciding what to do</h3>
  <p>Your job is not to change the program — it is to notice what the data says and decide between <strong>keep going</strong> and <strong>talk with your supervisor</strong>. The manual's three figures:</p>
  <div class="tw"><table>
    <thead><tr><th>What the data shows</th><th>Appropriate next step</th></tr></thead>
    <tbody>
      <tr><td><strong>Figure 1:</strong> Compared to baseline, the <em>behavior</em> shows a <strong>decreasing trend and lower level</strong> under the new BIP.</td><td><strong>Keep going!</strong> A problem behavior that is going down and sitting lower is exactly what the plan intended.</td></tr>
      <tr><td><strong>Figure 2:</strong> Compared to baseline, the <em>skill</em> shows a <strong>similar level, with little variability</strong>, under the request program.</td><td><strong>Talk with your supervisor.</strong> A skill program that hasn't moved off baseline isn't working yet.</td></tr>
      <tr><td><strong>Figure 3:</strong> Compared to baseline, the <em>skill</em> shows a <strong>higher level, with lots of variability</strong>, under the on-task program.</td><td><strong>Talk with your supervisor.</strong> It's improving, but the inconsistency is worth flagging.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: direction is good or bad depending on what's plotted</span>
    <p>A <strong>decreasing trend</strong> is excellent news on a <em>challenging behavior</em> graph and bad news on a <em>skill acquisition</em> graph. Always check the title and the Y-axis label before deciding whether "going down" is progress. This is the trap in every graph question.</p>
  </div>
  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A mastered skill's maintenance probes show a downward trend over four weeks. What do you do?</summary><div><p><strong>Talk with your supervisor.</strong> On a skill graph, a downward trend means the skill is not maintaining. <a href="#rbt28-tracking">RBT28</a> names this specifically: a downward trend or inconsistent performance on maintenance data is a sign to alert your supervisor. You do not change the program yourself.</p></div></details>
  </div>

  <h3 id="rbt08-gloss">RBT08 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Graph (Data Display)</td><td>A visual tool, like a chart, that shows collected data; highlights patterns, changes over time, or relationships between behavior and environment</td><td>A line graph of mands</td><td>A picture of the data</td><td>Data display</td><td>Raw data sheet</td></tr>
      <tr><td>Line graph</td><td>A chart showing how something changes over time; data points connected by lines</td><td>Pinching across dates</td><td>Time series</td><td>Data path</td><td>Bar graph</td></tr>
      <tr><td>Bar graph</td><td>A chart using bars of different heights to show and compare data; each bar is a category or time period</td><td>Preference assessment results</td><td>Compare categories</td><td>—</td><td>Line graph</td></tr>
      <tr><td>X-Axis</td><td>Horizontal line on a graph that usually represents some unit of time or category</td><td>Dates</td><td>X is across</td><td>—</td><td>Y-axis</td></tr>
      <tr><td>Y-Axis</td><td>Vertical line on a graph that usually represents what is being measured</td><td>Frequency</td><td>Y to the sky</td><td>—</td><td>X-axis</td></tr>
      <tr><td>Phase Change Line</td><td>A vertical line on a graph showing when something in the treatment or environment changed</td><td>Baseline → BIP</td><td>A divider</td><td>Condition label</td><td>—</td></tr>
      <tr><td>Phase Label</td><td>Titles at the top of a graph telling you what was happening during each phase</td><td>"Intervention"</td><td>Names the section</td><td>Condition label</td><td>—</td></tr>
      <tr><td>Level</td><td>The value on the vertical axis around which the data points fall</td><td>Around 20 per hour</td><td>How high</td><td>Mean</td><td>—</td></tr>
      <tr><td>Variability</td><td>The "bounce" — how much the data go up or down from one point to the next</td><td>Jagged path</td><td>How bouncy</td><td>Stability</td><td>Low variability</td></tr>
      <tr><td>Trend</td><td>The overall direction taken by a data path</td><td>Rising across sessions</td><td>Which way it's going</td><td>Slope</td><td>Flat line</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT08 in one breath</span>
    <p>Data gets displayed as a <strong>line graph</strong> (change over time, points connected) or a <strong>bar graph</strong> (comparing categories), both carrying a <strong>title, X-axis and Y-axis with axis titles, data points</strong> and a <strong>legend</strong> when more than one path is shown. Three things are read off a graph: <strong>level</strong> (how high the data sit on the Y-axis), <strong>trend</strong> (the overall direction of the data path) and <strong>variability</strong> (how much the path bounces from point to point) — and they are <em>independent</em>, so a graph can be high, falling and bouncy at once. Comparing a phase to baseline tells you what to do next, and the only two options in your scope are <strong>keep going</strong> or <strong>talk with your supervisor</strong>: a challenging behavior with a <em>decreasing trend and lower level</em> means keep going, while a skill sitting at <em>baseline level</em> or rising with <em>lots of variability</em> means raise it with the BCBA. Whether "down" is good depends entirely on <strong>what is plotted</strong> — down is progress on a problem behavior and a problem on a skill.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT08 exam checklist</span>
    <ul class="checklist">
      <li>Describe line graphs and bar graphs and when each is used.</li>
      <li>Label every part of a data display including the legend and axis titles.</li>
      <li>Define level, trend, and variability, and identify each from a graph.</li>
      <li>Explain why the three are independent of one another.</li>
      <li>Given a graph, decide between "keep going" and "talk with your supervisor."</li>
      <li>Explain why a decreasing trend is good news on one graph and bad on another.</li>
      <li>State what to click before collecting session data in CentralReach.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt09">
  <div class="plate"><span class="num" aria-hidden="true">09</span><p class="ttl">Environment and readiness: keys to RBT success</p><p class="src">30-minute course · Session prep · Reviewing procedures and prior documentation · Preparing the environment · The Skill Acquisition Plan (SAP)</p></div>

  <h3 id="rbt09-sap">The Skill Acquisition Plan</h3>
  <div class="box def"><span class="lbl">Definition: SAP</span>
    <p>A <strong>roadmap</strong>. It outlines <strong>what skill to teach, how to teach it, and how to know if it's working.</strong></p>
  </div>
  <p>Some BCBAs organise the SAP differently or use slightly different language — that's fine. Just make sure you have all the key information before running a program, and ask your BCBA if you have questions.</p>
  <div class="tw"><table>
    <thead><tr><th>Component</th><th>Key information</th></tr></thead>
    <tbody>
      <tr><td><strong>Short Term Goal (STG)</strong></td><td>Specific, measurable skills to work on. <em>Make sure to know these goals!</em></td></tr>
      <tr><td><strong>Materials and Stimuli</strong></td><td>Lists what you need to run the program.</td></tr>
      <tr><td><strong>Instructions &amp; Teaching Procedures</strong></td><td>Step-by-step guide for delivering the program.</td></tr>
      <tr><td><strong>Reinforcers &amp; Reinforcement Schedule</strong></td><td>Which reinforcers to use and how/when to deliver them.</td></tr>
      <tr><td><strong>Prompting &amp; Error Correction</strong></td><td>Which prompts to use, how to fade them, and how to correct errors.</td></tr>
      <tr><td><strong>Targets and Examples</strong></td><td>The actual content the client is learning (e.g. for a body-parts STG: head, nose, feet).</td></tr>
      <tr><td><strong>Data Collection Procedures</strong></td><td>What to measure (operational definition), how to score it, and how often to record.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Why this list is worth memorising</span>
    <p>Almost every later module ends with "check the SAP." These seven components are <em>what you are checking</em>. When <a href="#rbt22-integrity">RBT22</a> says procedural integrity means instructions, prompts, reinforcement and data collection — those are four of these seven.</p>
  </div>

  <h3 id="rbt09-environment">Preparing the environment</h3>
  <div class="box def"><span class="lbl">Definition: environment</span>
    <p>Everything around a person that can influence behavior — the <strong>physical setting, the materials available, the sounds, the people present, even the lighting</strong>.</p>
  </div>
  <div class="box proc"><span class="lbl">Process: the pre-session checklist</span>
    <div class="tw"><table>
      <thead><tr><th>Activity</th><th>Description</th></tr></thead>
      <tbody>
        <tr><td><strong>Gather materials</strong></td><td>Review the SAP and collect/organize all reinforcers and materials needed to run the programs.</td></tr>
        <tr><td><strong>Check &amp; charge devices</strong></td><td>Make sure everything is charged and working. Keep chargers nearby (just in case).</td></tr>
        <tr><td><strong>Minimize distractions</strong></td><td>Clear the space of unnecessary items, and create a calm, predictable setup so the learner can focus on you and the task.</td></tr>
        <tr><td><strong>Organize reinforcement system</strong></td><td>Gather available reinforcers and keep them somewhere accessible but not distracting.</td></tr>
        <tr><td><strong>Enrich play area</strong></td><td>Ensure there is an area set up with preferred toys/activities for pairing.</td></tr>
        <tr><td><strong>Create a safe &amp; functional seating arrangement</strong></td><td>Ensure there are no safety risks. Make sure <em>you</em> can access teaching materials but they are <em>out of reach of the learner</em>.</td></tr>
        <tr><td><strong>Have data sheet &amp; instructions ready</strong></td><td>Review the SAP before every session so you have a clear understanding of the day's targets and data collection.</td></tr>
      </tbody>
    </table></div>
  </div>

  <h3 id="rbt09-location">Service location and preparation</h3>
  <p>No matter where you are, the core mission stays the same: <strong>Prepare well. Teach well. Support progress.</strong></p>
  <p>In home, school, and community settings alike you:</p>
  <ul>
    <li>Organize core materials and reinforcers.</li>
    <li>Modify the environment to the extent possible.</li>
    <li>Communicate with caregivers and team members prior to the session.</li>
    <li>Prioritize safety and engagement.</li>
    <li>Review the SAP, ask for support, and stay flexible.</li>
  </ul>
  <p><strong>Your BCBA will accompany you to your first session</strong> and help you understand how to adapt the SAP to that setting.</p>

  <h3 id="rbt09-gloss">RBT09 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Skill Acquisition Plan (SAP)</td><td>A roadmap outlining what skill to teach, how to teach it, and how to know if it's working</td><td>Seven components incl. STG and data</td><td>The recipe</td><td>BIP (for behavior reduction)</td><td>—</td></tr>
      <tr><td>Environment</td><td>Everything around a person that can influence behavior — physical setting, materials, sounds, people, lighting</td><td>A cluttered, noisy room</td><td>Everything around them</td><td>Setting</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT09 in one breath</span>
    <p>The <strong>Skill Acquisition Plan (SAP)</strong> is your roadmap — what skill to teach, how to teach it, how to know it's working — with seven components: <strong>short term goal, materials and stimuli, instructions and teaching procedures, reinforcers and reinforcement schedule, prompting and error correction, targets and examples, and data collection procedures</strong>. BCBAs organise it differently and that's fine, as long as you have all the key information before running a program. The <strong>environment</strong> is everything around the person that can influence behavior — setting, materials, sounds, people, lighting — and you prepare it with a <strong>pre-session checklist</strong>: gather materials, check and charge devices, minimize distractions, organize the reinforcement system, enrich the play area, create safe seating with <em>materials in your reach and out of the learner's</em>, and have the data sheet and instructions ready. In home, school or community the core mission is the same — <strong>prepare well, teach well, support progress</strong> — and your BCBA comes to your first session in a new setting to help you adapt.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT09 exam checklist</span>
    <ul class="checklist">
      <li>Define the Skill Acquisition Plan and list its seven components.</li>
      <li>Describe the RBT's role in implementing a SAP.</li>
      <li>Define "environment" in behavioral terms.</li>
      <li>Walk through the seven items on the pre-session checklist.</li>
      <li>Say where teaching materials should be relative to the learner, and why.</li>
      <li>State what stays the same across home, school and community settings.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt10">
  <div class="plate"><span class="num" aria-hidden="true">10</span><p class="ttl">Starting strong: preparing clients for service delivery</p><p class="src">30-minute course · Preparing the client for service delivery</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt09">RBT09</a> prepared <em>you</em> and the room. This prepares the <em>client</em>. The strategies here reappear as step two of DTT (<a href="#rbt22-steps">RBT22</a>), as an antecedent strategy (<a href="#rbt34">RBT34</a>), and as the way back after challenging behavior (<a href="#rbt39-return">RBT39</a>).</p>
  </div>

  <h3 id="rbt10-pairing">Presession pairing</h3>
  <div class="box def"><span class="lbl">Definition: presession pairing</span>
    <p>Building a <strong>positive connection</strong> with your learner <em>before</em> beginning demands or structured teaching.</p>
  </div>
  <div class="box proc"><span class="lbl">Process: the five steps of pairing</span>
    <p>Take <strong>5–10 minutes at the beginning of EVERY session</strong> to pair with your client.</p>
    <ol>
      <li><strong>Observe &amp; approach (no demands!).</strong> Join their space calmly and let them get used to your presence. Notice what they are choosing to play with — maybe they seem drawn to blocks. <em>Do NOT give demands or force interaction.</em></li>
      <li><strong>Join the learner's activity.</strong> Engage in what they're doing; this shows you're interested in their world. If they're stacking blocks, build your own tower.</li>
      <li><strong>Add value to their play.</strong> Bring in something that makes the activity even better — a car could use their structure as a bridge, or a dinosaur could knock it down.</li>
      <li><strong>Follow the learner's lead.</strong> Let them guide the interaction. Don't make them play with a particular toy or in a particular way. If they switch from blocks to coloring, grab a crayon.</li>
      <li><strong>Be the giver of good stuff — no strings attached!</strong> Give access to favourite items <em>without requiring them to "work" for it yet</em>. This helps them associate you with free, fun reinforcement.</li>
    </ol>
  </div>
  <div class="box warn"><span class="lbl">Watch out: "no strings attached" is the point</span>
    <p>Pairing fails when it is used as a reinforcement contingency in disguise. If the learner has to do something to get the good stuff, you are not pairing — you are running a demand. The whole mechanism is that <em>you</em> become associated with reinforcement, which is <a href="#rbt21">RBT21</a>'s conditioned reinforcer procedure applied to a person.</p>
  </div>

  <h3 id="rbt10-signs">Signs a learner is prepared to learn</h3>
  <p>When learners are ready for instruction, you should see three things:</p>
  <div class="tw"><table>
    <thead><tr><th>Sign</th><th>Definition</th><th>What it looks like</th><th>If it's missing…</th></tr></thead>
    <tbody>
      <tr><td><strong>Joint attention</strong></td><td>When two people share focus on the same object or event, <em>and both know they're sharing that experience</em></td><td>You're both looking at the same toy and the learner glances back at you to share the moment</td><td>If you're not intentionally focused on the same thing, <strong>the learner is not ready to learn</strong></td></tr>
      <tr><td><strong>Attending</strong></td><td>The learner is actively paying attention to the relevant instruction, person, or activity</td><td>Looking at you or the materials; staying with the activity; not getting distracted</td><td>If the learner isn't paying attention, they're likely to <strong>miss instruction</strong></td></tr>
      <tr><td><strong>Assent</strong></td><td>When a learner <em>willingly participates</em> in an activity or interaction — even if they can't say "yes" with words</td><td>Staying near the activity; engaging with you; appearing calm or interested</td><td>If the learner isn't willing, teaching is <strong>less effective and more likely to lead to frustration</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: assent is not the same as compliance</span>
    <p>Assent is about <em>willingness</em>, and the definition explicitly includes learners who cannot say yes in words — so you read it from behavior. A learner who is sitting still because they've learned there's no point resisting is complying, not assenting. <a href="#rbt20-physical">RBT20</a> makes the matching point about the <strong>right to assent</strong>, and <a href="#rbt39">RBT39</a> builds a whole framework on recognising assent <em>withdrawal</em>.</p>
  </div>

  <h3 id="rbt10-strategies">Strategies when a learner isn't ready</h3>
  <p>There is not one right way — think of these as tools in your toolbox, and use whichever fits.</p>
  <div class="tw"><table>
    <thead><tr><th>Strategy</th><th>What to do</th></tr></thead>
    <tbody>
      <tr><td><strong>Presession pairing</strong></td><td>Build positive rapport first. If the child is enjoying their time with you, they'll be more likely to share focus and attention.</td></tr>
      <tr><td><strong>Get their attention</strong></td><td>Sit where they can see you and the materials; move into their space instead of calling from a distance; use clear, noticeable reactions.</td></tr>
      <tr><td><strong>Join play &amp; build engagement</strong></td><td>Join what the learner is already doing; follow their lead before introducing demands; add something fun or interesting to the activity.</td></tr>
      <tr><td><strong>Help them focus</strong></td><td>Use playful pauses; reduce distractions; give simple, clear directions; keep activities short.</td></tr>
      <tr><td><strong>Make it motivating</strong></td><td>Use preferred items or activities; reinforce quickly and often; celebrate small successes.</td></tr>
      <tr><td><strong>Build willingness</strong></td><td>Offer simple choices; keep interactions positive; watch for disengagement; <strong>pause and re-engage instead of pushing forward</strong>.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt10-gloss">RBT10 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Presession Pairing</td><td>Building a positive connection with your learner before beginning demands or structured teaching</td><td>5–10 min at session start</td><td>Pair before you demand</td><td>Rapport building</td><td>Starting with demands</td></tr>
      <tr><td>Joint Attention</td><td>When two people share focus on the same object or event, and both know they're sharing that experience</td><td>Both watch the toy; learner glances at you</td><td>Shared focus, shared knowing</td><td>Attending</td><td>Parallel play</td></tr>
      <tr><td>Attending</td><td>The learner is actively paying attention to the relevant instruction, person, or activity</td><td>Looking at the materials</td><td>Paying attention</td><td>Joint attention</td><td>Distracted</td></tr>
      <tr><td>Assent</td><td>When a learner willingly participates in an activity or interaction — even if they can't say "yes" with words</td><td>Staying near, calm, engaged</td><td>Willing, not just obedient</td><td>Willingness</td><td>Assent withdrawal</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT10 in one breath</span>
    <p><strong>Presession pairing</strong> is building a positive connection with the learner <em>before</em> any demands, for <strong>5–10 minutes at the start of every session</strong>, in five steps: <strong>observe and approach with no demands, join their activity, add value to their play, follow their lead, and be the giver of good stuff with no strings attached</strong>. You know a learner is ready to be taught when you see <strong>joint attention</strong> (shared focus that both of you know is shared), <strong>attending</strong> (actively focused on the instruction, person or activity) and <strong>assent</strong> (willing participation, which a learner can show without words) — and if any one is missing, the learner is not ready, will miss instruction, or will be frustrated. When they're not ready, reach for pairing, getting their attention, joining play, helping them focus, making it motivating, or building willingness — and <strong>pause and re-engage rather than pushing forward</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT10 exam checklist</span>
    <ul class="checklist">
      <li>Define presession pairing and say how long it takes and how often.</li>
      <li>List the five steps of presession pairing in order.</li>
      <li>Explain why pairing must have "no strings attached."</li>
      <li>Define joint attention, attending, and assent, and tell them apart.</li>
      <li>Say what happens if each of the three is missing.</li>
      <li>Explain why assent is not the same as compliance.</li>
      <li>List at least five strategies for a learner who isn't ready for instruction.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt11">
  <div class="plate"><span class="num" aria-hidden="true">11</span><p class="ttl">Ensuring ethical service delivery</p><p class="src">30-minute course · RBT Ethics Code · Section 2 of the RBT Ethics Code</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt01">RBT01</a>. That module was scope; this one is the full code. <a href="#rbt45">RBT45</a> and <a href="#rbt46">RBT46</a> are the code applied to supervision and to reporting.</p>
  </div>

  <h3 id="rbt11-foundations">Foundations of ethical service</h3>
  <div class="box def"><span class="lbl">Definition: the RBT Ethics Code</span>
    <p>A set of rules and expectations created by the <strong>Behavior Analyst Certification Board (BACB)</strong> that guides how Registered Behavior Technicians should act <strong>professionally and ethically</strong> in their work.</p>
  </div>
  <p>There are <strong>four core principles</strong> underpinning both the RBT Ethics Code and the Ethics Code for Behavior Analysts:</p>
  <ol>
    <li><strong>Benefit others</strong></li>
    <li><strong>Treat others with dignity and respect</strong></li>
    <li><strong>Act with integrity</strong></li>
    <li><strong>Stay within your competence</strong></li>
  </ol>
  <div class="box warn"><span class="lbl">The line to remember</span>
    <p><em>"The RBT Ethics Code is not a suggestion: even as a trainee, you are responsible for following the code at all times."</em></p>
  </div>
  <div class="box def"><span class="lbl">Definition: competence</span>
    <p>The ability to <strong>consistently apply the appropriate skills and knowledge</strong> to perform your responsibilities to a <strong>high standard of quality</strong>.</p>
  </div>

  <h3 id="rbt11-section2">The ten ethical responsibilities (Section 2)</h3>
  <p>These are the responsibilities in Section 2 of the RBT Ethics Code, as the manual lists them. Read them as ten separate commitments — exam items often quote one and ask you to recognise it.</p>
  <div class="tw"><table>
    <thead><tr><th class="num">#</th><th>Responsibility</th></tr></thead>
    <tbody>
      <tr><td class="num">1</td><td>RBTs <strong>do no harm</strong> and work to support the best interest of their clients. They are knowledgeable about and comply with <strong>mandated-reporting requirements</strong>.</td></tr>
      <tr><td class="num">2</td><td>RBTs <strong>follow the direction of their supervisors</strong>, accurately implement behavior-technician services, and accurately complete all required documentation.</td></tr>
      <tr><td class="num">3</td><td>RBTs conduct themselves in a <strong>professional manner</strong> during all work activities (delivering services, receiving training or supervision). They <strong>take action to improve their performance following feedback</strong> from supervisors.</td></tr>
      <tr><td class="num">4</td><td>RBTs <strong>do not use unfamiliar interventions</strong> or provide services to <strong>unfamiliar client populations</strong> unless they have received proper training.</td></tr>
      <tr><td class="num">5</td><td>RBTs implement <strong>restrictive or punishment-based procedures only</strong> when included in a documented behavior-change plan <strong>and after their supervisor has verified their competence</strong>.</td></tr>
      <tr><td class="num">6</td><td>RBTs <strong>direct any questions or concerns</strong> that they or others (caregivers, coworkers) have about their behavior-technician services <strong>to their supervisor</strong>.</td></tr>
      <tr><td class="num">7</td><td>RBTs take necessary actions to <strong>protect clients</strong> when they become aware that a client's legal rights are being violated or there is risk of harm. They report the matter to their supervisor, follow organization policies, and <strong>document these actions</strong>. In some instances RBTs may need to <strong>contact relevant authorities</strong>.</td></tr>
      <tr><td class="num">8</td><td>RBTs <strong>protect the confidentiality and privacy</strong> of clients, stakeholders, and others in the workplace by following all requirements established by the BACB, employers, and the law (privacy laws, licensure requirements), and maintain confidentiality when interacting with client information and records.</td></tr>
      <tr><td class="num">9</td><td>RBTs <strong>do not share identifying information</strong> — photos, videos, written information — about clients <strong>on social media or websites</strong>.</td></tr>
      <tr><td class="num">10</td><td>RBTs <strong>only discuss confidential client information under the direction of their supervisor</strong>, unless allowed by law for a valid reason (protecting the client or others from harm), and <strong>only share necessary client information</strong> in job-related communications (emails, documentation).</td></tr>
    </tbody>
  </table></div>

  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>Your BCBA writes a response cost procedure into a BIP. Can you run it tomorrow?</summary><div><p>Only if <strong>both</strong> conditions in responsibility #5 are met: it must be in a <em>documented behavior-change plan</em> (it is) <strong>and</strong> your supervisor must have <em>verified your competence</em> on it (has she?). Being written down is not enough on its own. <a href="#rbt37-considerations">RBT37</a> adds the organisation's own steps on top of that.</p></div></details>
    <details><summary>A coworker posts a photo of a client's artwork — no face, no name — to their personal Instagram. Is that a violation?</summary><div><p><strong>Yes.</strong> Responsibility #9 prohibits sharing <em>identifying information</em> — photos, videos, or written information — about clients on social media or websites. "No face" is not the test; the safest reading, and the one the code intends, is that client material doesn't go on social media at all. Report it to your supervisor (#6, #7).</p></div></details>
  </div>

  <h3 id="rbt11-gloss">RBT11 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>RBT Ethics Code</td><td>A set of rules and expectations created by the BACB that guides how RBTs should act professionally and ethically</td><td>Section 2's ten responsibilities</td><td>The rulebook</td><td>Ethics Code for Behavior Analysts</td><td>—</td></tr>
      <tr><td>Scope of Practice</td><td>What you are trained and allowed to do</td><td>Running a SAP as written</td><td>Your lane</td><td>Competence</td><td>Independent practice</td></tr>
      <tr><td>Competence</td><td>The ability to consistently apply the appropriate skills and knowledge to perform your responsibilities to a high standard of quality</td><td>Verified by your supervisor</td><td>Can do it well, every time</td><td>Scope of practice</td><td>Untrained</td></tr>
      <tr><td>Dignity &amp; Respect</td><td>Treating clients as valued individuals</td><td>Offering choices</td><td>They matter</td><td>Compassionate care</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT11 in one breath</span>
    <p>The <strong>RBT Ethics Code</strong> is the BACB's rules for how RBTs act professionally and ethically, it rests on <strong>four core principles — benefit others, treat others with dignity and respect, act with integrity, stay within your competence</strong> — and it is <strong>not a suggestion</strong>: you follow it as a trainee too. <strong>Competence</strong> means consistently applying the right skills and knowledge to a high standard. Section 2's ten responsibilities: <strong>do no harm</strong> and comply with <strong>mandated reporting</strong>; <strong>follow your supervisor</strong> and document accurately; behave <strong>professionally</strong> and act on feedback; <strong>don't use unfamiliar interventions or serve unfamiliar populations</strong> without training; use <strong>restrictive or punishment-based procedures only when documented in a plan <em>and</em> after your supervisor verifies your competence</strong>; <strong>direct questions and concerns to your supervisor</strong>; <strong>protect clients</strong> whose rights are violated or who are at risk, reporting, following policy, documenting, and contacting authorities if needed; <strong>protect confidentiality and privacy</strong>; <strong>never post identifying client information on social media</strong>; and <strong>discuss confidential information only under your supervisor's direction</strong>, sharing only what is necessary.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT11 exam checklist</span>
    <ul class="checklist">
      <li>Define the RBT Ethics Code and say who created it.</li>
      <li>List the four core ethical principles.</li>
      <li>Define competence and distinguish it from scope of practice.</li>
      <li>Recall all ten responsibilities in Section 2.</li>
      <li>State the two conditions required before implementing a restrictive or punishment-based procedure.</li>
      <li>Describe what to do when you become aware of a risk of harm to a client.</li>
      <li>State the rule about client information on social media.</li>
      <li>Recognise examples and non-examples of ethical behavior in documentation, supervision, confidentiality and client protection.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt12">
  <div class="plate"><span class="num" aria-hidden="true">12</span><p class="ttl">Assessments in ABA</p><p class="src">30-minute course · Defining assessment · When assessments occur · RBT vs BCBA roles · Main types of assessment</p></div>

  <h3 id="rbt12-purpose">Purpose of assessments</h3>
  <div class="box def"><span class="lbl">Definition: assessment</span>
    <p>A <strong>structured way to gather information about a learner's skills and behaviors</strong>.</p>
  </div>
  <p>Assessments are all about gathering information about a learner's skills and behaviors, and they answer four questions:</p>
  <ul>
    <li><strong>What skills does the learner already have?</strong></li>
    <li><strong>What skills are missing?</strong></li>
    <li><strong>What motivates the learner?</strong></li>
    <li><strong>What behaviors interfere with learning?</strong></li>
  </ul>

  <h3 id="rbt12-timeline">Timelines and expectations</h3>
  <p>Assessment is not a one-off. There is an <strong>initial assessment</strong>, then <strong>progress updates</strong> that continue throughout services. During assessments, learners may <strong>complete structured tasks, be observed, or participate in interviews with caregivers</strong>. You can expect to <strong>assist with data collection, present tasks, and observe objectively</strong>.</p>

  <h3 id="rbt12-roles">Roles and responsibilities</h3>
  <div class="tw"><table>
    <thead><tr><th>BCBAs</th><th>RBTs</th></tr></thead>
    <tbody>
      <tr><td><strong>Select</strong> assessments</td><td><strong>Follow</strong> procedures</td></tr>
      <tr><td><strong>Interpret</strong> results</td><td><strong>Collect</strong> data</td></tr>
      <tr><td><strong>Design</strong> treatment</td><td><strong>Report</strong> observations</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">The pattern to notice</span>
    <p>Select / interpret / design versus follow / collect / report. This same three-and-three split reappears in <a href="#rbt15-support">RBT15</a> (functional assessment), <a href="#rbt24-ta">RBT24</a> (BCBAs create the task analysis, RBTs implement it), <a href="#rbt25-steps">RBT25</a> (shaping) and <a href="#rbt33-role">RBT33</a> (BIPs). <strong>Anything that involves choosing or deciding belongs to the BCBA; anything that involves doing and recording belongs to you.</strong> If you learn one rule in this course, learn that one — it answers a surprising share of exam questions.</p>
  </div>

  <h3 id="rbt12-types">Types of assessment in ABA</h3>
  <p>The manual gives a map of everything you'll meet in RBT12–RBT15. Don't worry if some terms are unfamiliar yet:</p>
  <div class="tw"><table>
    <thead><tr><th>Family</th><th>Types within it</th><th>Covered in</th></tr></thead>
    <tbody>
      <tr><td><strong>Skill-based assessments</strong></td><td>Curriculum-based · Developmental · Social skills</td><td><a href="#rbt13">RBT13</a></td></tr>
      <tr><td><strong>Preference assessments</strong></td><td>Indirect · Free operant · Paired choice · MSWO</td><td><a href="#rbt14">RBT14</a></td></tr>
      <tr><td><strong>Functional assessments</strong></td><td>Indirect functional · Descriptive · Functional analysis</td><td><a href="#rbt15">RBT15</a></td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt12-takeaways">Key takeaways</h3>
  <ul>
    <li><strong>BCBAs will take the lead on assessments.</strong></li>
    <li><strong>RBTs will provide support during assessments.</strong></li>
    <li>They identify learner <strong>strengths, needs, and motivators</strong>.</li>
    <li>They occur <strong>at the start and throughout services</strong>.</li>
    <li>Although your role is different from your supervisor's, <strong>your contributions are still valuable</strong>.</li>
  </ul>

  <h3 id="rbt12-gloss">RBT12 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Assessment</td><td>A structured way to gather information about a learner's skills and behaviors</td><td>Initial assessment, progress updates</td><td>Gathering information</td><td>Evaluation</td><td>Teaching</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT12 in one breath</span>
    <p>An <strong>assessment</strong> is a structured way to gather information about a learner's skills and behaviors, answering four questions: <strong>what skills do they have, what's missing, what motivates them, and what behaviors interfere with learning</strong>. Assessment happens at the <strong>initial assessment and throughout services</strong> as progress updates, and may involve structured tasks, observation, or caregiver interviews. <strong>BCBAs select assessments, interpret results and design treatment; RBTs follow procedures, collect data and report observations</strong> — the same split you'll see in every later module. The three families are <strong>skill-based</strong> (curriculum-based, developmental, social skills), <strong>preference</strong> (indirect, free operant, paired choice, MSWO) and <strong>functional</strong> (indirect, descriptive, functional analysis).</p>
  </div>

  <div class="box exam"><span class="lbl">RBT12 exam checklist</span>
    <ul class="checklist">
      <li>Define assessment and explain its general purpose.</li>
      <li>Name the four questions assessments answer.</li>
      <li>Identify when assessments occur and what to expect during the process.</li>
      <li>Differentiate RBT and BCBA roles during assessment, three items each.</li>
      <li>Name the three families of assessment and the types within each.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt13">
  <div class="plate"><span class="num" aria-hidden="true">13</span><p class="ttl">Skill-based assessment</p><p class="src">30-minute course · Skill-based assessment and its purpose · RBT responsibilities · Common types</p></div>

  <h3 id="rbt13-purpose">Purpose of skill-based assessments</h3>
  <div class="box def"><span class="lbl">Definition: skill-based assessment</span>
    <p>A structured way to evaluate <strong>what a learner can do, under what conditions they can do it, and what supports they may need</strong>.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th class="num">#</th><th>Purpose</th><th>What it does</th></tr></thead>
    <tbody>
      <tr><td class="num">1</td><td><strong>Identify current abilities</strong></td><td>Understand what the learner can already do independently</td></tr>
      <tr><td class="num">2</td><td><strong>Pinpoint learning targets</strong></td><td>Identify what the learner needs to learn next</td></tr>
      <tr><td class="num">3</td><td><strong>Individualize treatment</strong></td><td>Create goals that are meaningful for the learner</td></tr>
      <tr><td class="num">4</td><td><strong>Track progress</strong></td><td>Monitor progress and adjust the plan as needed</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt13-role">Your role during a skill-based assessment</h3>
  <div class="box warn"><span class="lbl">The framing that makes this module click</span>
    <p><em>"Think of skill-based assessments like a test. You are not teaching a skill, you are evaluating what the learner already knows."</em></p>
    <p>That single sentence tells you what not to do: <strong>no hints, no making the task easier, no showing them what to do.</strong> Those are teaching behaviors, and during an assessment they contaminate the result.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Your role: do these</th><th>During assessment: don't do these</th></tr></thead>
    <tbody>
      <tr><td><strong>Get ready</strong> — have materials and data ready; review the plan or practice as needed</td><td rowspan="6">Give hints · Make the task easier · Show them what to do</td></tr>
      <tr><td><strong>Follow the plan</strong> — run the assessment exactly as your supervisor described</td></tr>
      <tr><td><strong>Present the task(s)</strong> — use clear directions and give the learner a chance to respond</td></tr>
      <tr><td><strong>Observe carefully</strong> — watch what the learner does, on their own or with help</td></tr>
      <tr><td><strong>Record what happens</strong> — write down what <em>actually</em> happens, not what you expected or wanted</td></tr>
      <tr><td><strong>Share information</strong> — share with your supervisor and assist as needed (organize data, summarize observations)</td></tr>
    </tbody>
  </table></div>
  <p>You <em>can</em> still: <strong>pause if needed</strong>, <strong>offer short breaks</strong>, and <strong>help them stay calm and engaged</strong>. And you still <strong>reward participation, engagement, and completing tasks — even if incorrect</strong>.</p>
  <div class="box warn"><span class="lbl">Watch out: reward the effort, not the answer</span>
    <p>This is the subtlety the exam likes. During an assessment you reinforce <em>participating</em>, not <em>being right</em>. If you only praise correct responses, you are teaching — and the learner's performance stops being a clean measure of what they could already do.</p>
  </div>

  <h3 id="rbt13-formal">Formal vs informal, and the three types</h3>
  <p>You'll see several different types of skill-based assessment. You don't need to memorize every one — <strong>what matters most is recognizing when you must follow a strict plan and when you can assess performance under more natural conditions.</strong></p>
  <div class="tw"><table>
    <thead><tr><th>Formal</th><th>Informal</th></tr></thead>
    <tbody>
      <tr><td>A <strong>standardized tool/manual or structured procedure</strong> used to measure specific skills.</td><td><strong>Less structured</strong>; involves observing the learner demonstrate a skill, given the opportunity.</td></tr>
      <tr><td>Expect to: use specific materials · follow a specific set of steps · record data in a set way, often on a standardized data sheet.</td><td>Observe how the learner performs: during regular activities · across different situations · <strong>without following a strict step-by-step protocol</strong>.</td></tr>
    </tbody>
  </table></div>
  <div class="tw"><table>
    <thead><tr><th>Type</th><th>Definition</th><th>Goal</th></tr></thead>
    <tbody>
      <tr><td><strong>Curriculum-based assessment</strong></td><td>Measures a learner's skills against a <strong>structured teaching outline</strong></td><td>Evaluate progress across specific skills within a structured teaching program</td></tr>
      <tr><td><strong>Developmental assessment</strong></td><td>Compares a learner's skills to <strong>typical milestones for their age</strong></td><td>Understand how the learner's skills compare to age-based expectations</td></tr>
      <tr><td><strong>Social skills assessment</strong></td><td>Evaluates <strong>how a learner interacts with others</strong>, including peers and adults</td><td>Understand how the learner interacts with others</td></tr>
    </tbody>
  </table></div>
  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>Which type compares the learner to other children their age, and which compares them to a teaching program?</summary><div><p><strong>Developmental</strong> compares to age-based milestones — the comparison is to <em>other people</em>. <strong>Curriculum-based</strong> compares to a structured teaching outline — the comparison is to <em>the program</em>. Memory hook: <em>development</em> is about growing up; <em>curriculum</em> is about the course of study.</p></div></details>
  </div>

  <h3 id="rbt13-gloss">RBT13 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Skill-Based Assessment</td><td>A structured way to evaluate what a learner can do, under what conditions, and what supports they may need</td><td>Running a curriculum probe</td><td>What can they do?</td><td>Assessment</td><td>Functional assessment</td></tr>
      <tr><td>Formal Skill-Based Assessment</td><td>A standardized tool/manual or structured procedure used to measure specific skills</td><td>Standardized data sheet</td><td>Follow the manual</td><td>Standardized test</td><td>Informal assessment</td></tr>
      <tr><td>Informal Skill-Based Assessment</td><td>Less structured; involves observing the learner demonstrate a skill, given the opportunity</td><td>Watching during free play</td><td>Watch it happen</td><td>Naturalistic observation</td><td>Formal assessment</td></tr>
      <tr><td>Curriculum-Based Assessment</td><td>Measures a learner's skills against a structured teaching outline</td><td>Progress through a program</td><td>Against the curriculum</td><td>Developmental assessment</td><td>—</td></tr>
      <tr><td>Developmental Assessment</td><td>Compares a learner's skills to typical milestones for their age</td><td>Age-based expectations</td><td>Against their age</td><td>Curriculum-based</td><td>—</td></tr>
      <tr><td>Social Skills Assessment</td><td>Evaluates how a learner interacts with others, including peers and adults</td><td>Peer interaction probe</td><td>How they get on with people</td><td>—</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT13 in one breath</span>
    <p>A <strong>skill-based assessment</strong> evaluates what a learner can do, under what conditions, and what supports they need, for four purposes: <strong>identify current abilities, pinpoint learning targets, individualize treatment, track progress</strong>. Treat it <strong>like a test — you are evaluating, not teaching</strong>, so <em>no hints, no making it easier, no showing them what to do</em>; you may still pause, offer breaks, and help them stay calm, and you <strong>reward participation and engagement rather than correctness</strong>. Your role is to <strong>get ready, follow the plan exactly, present the tasks, observe carefully, record what actually happened, and share with your supervisor</strong>. Assessments are either <strong>formal</strong> (a standardized tool with specific materials, steps and data sheet) or <strong>informal</strong> (observing the skill under natural conditions), and the three main types are <strong>curriculum-based</strong> (against a teaching outline), <strong>developmental</strong> (against age milestones) and <strong>social skills</strong> (how they interact with others).</p>
  </div>

  <div class="box exam"><span class="lbl">RBT13 exam checklist</span>
    <ul class="checklist">
      <li>Define skill-based assessment and give its four purposes.</li>
      <li>List the six things you do during an assessment and the three you must not.</li>
      <li>Explain what you reward during an assessment, and why not correctness.</li>
      <li>Differentiate formal from informal skill-based assessment.</li>
      <li>Define curriculum-based, developmental, and social skills assessment, with the goal of each.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt14">
  <div class="plate"><span class="num" aria-hidden="true">14</span><p class="ttl">Preference assessment</p><p class="src">60-minute course · Defining preference assessment · Why they matter · Implementing the four types · Collecting and analyzing data</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt03-dims">RBT03</a>'s <em>quality</em> dimension of reinforcement, and <a href="#rbt04-motivation">RBT04</a>'s MOs. A preference assessment is how you find out what is actually reinforcing <em>today</em>.</p>
  </div>

  <h3 id="rbt14-what">What a preference assessment is</h3>
  <div class="box def"><span class="lbl">Definition: preference assessment</span>
    <p>A <strong>systematic method used to identify stimuli</strong> — items, activities, or social interactions — <strong>that are likely to function as reinforcers</strong>.</p>
  </div>
  <p>The logic the manual draws: to support desirable client behavior you need <strong>a motivated learner</strong>, <strong>lots of learning opportunities</strong>, and <strong>reinforcement over time</strong> — and preference assessments help with all three.</p>

  <h3 id="rbt14-importance">Why they matter</h3>
  <div class="tw"><table>
    <thead><tr><th>Reason</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><strong>Find reinforcers</strong></td><td>Identify items, activities, or interactions that motivate learning.</td></tr>
      <tr><td><strong>Stay current</strong></td><td>Preferences change over time — <strong>check often!</strong></td></tr>
      <tr><td><strong>Boost motivation</strong></td><td>Make sessions fun and engaging by using what the learner already enjoys.</td></tr>
      <tr><td><strong>Minimize problem behavior</strong></td><td>Using preferred items reduces the likelihood of problem behavior.</td></tr>
      <tr><td><strong>Individualize treatment</strong></td><td>Every learner is different — what works for one may not work for another.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "preferences change over time"</span>
    <p>This is why preference assessment isn't a one-time intake task. A reinforcer that worked last month may be satiated (an <strong>AO</strong>, <a href="#rbt04-motivation">RBT04</a>) today. <a href="#rbt21-establishing">RBT21</a> says it directly: <em>a reinforcer's effectiveness can change day to day</em>.</p>
  </div>

  <h3 id="rbt14-types">The four types</h3>
  <div class="tw"><table>
    <thead><tr><th>Type</th><th>Direct or indirect?</th><th>How it works</th></tr></thead>
    <tbody>
      <tr><td><strong>Indirect preference assessment</strong></td><td>Indirect</td><td>Identifying potential reinforcers by <strong>asking caregivers, parents, teachers, or staff</strong> what the client is most likely to enjoy. Involves interviewing.</td></tr>
      <tr><td><strong>Free operant</strong></td><td>Direct</td><td>The client is given <strong>free access to a variety of items and activities at once</strong>, and <strong>how much time</strong> the client spends engaging with each option is recorded. The learner chooses which items they engage with and for how long, freely.</td></tr>
      <tr><td><strong>Paired choice</strong></td><td>Direct</td><td>The client is presented with <strong>two items at a time</strong> and asked to choose one.</td></tr>
      <tr><td><strong>MSWO</strong> (multiple stimulus without replacement)</td><td>Direct</td><td>The client is presented with an <strong>array of items (e.g. 5–8 at once)</strong> and asked to select one. <strong>Items chosen are removed from the array.</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: the three direct ones are told apart by the array</span>
    <p><strong>Free operant</strong> = everything available, nothing removed, <em>you time engagement</em>. <strong>Paired choice</strong> = exactly <em>two</em> at a time. <strong>MSWO</strong> = a <em>big array</em>, and the chosen item <em>doesn't go back</em> (that's the "without replacement" in the name). Only free operant needs a <strong>timer</strong>.</p>
  </div>

  <h3 id="rbt14-data">Collecting data</h3>
  <div class="box proc"><span class="lbl">Process: the practice routine</span>
    <ol>
      <li>Have your data sheet ready (electronic or printed).</li>
      <li>Have your timing device ready — <strong>timer for free operant only!</strong></li>
      <li>Double check you have your data sheet and timing device.</li>
      <li>Start the video and your timer.</li>
      <li>Watch carefully and record data.</li>
      <li>Once it's over, summarize the data and double check your answers.</li>
    </ol>
  </div>

  <h3 id="rbt14-gloss">RBT14 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Preference Assessment</td><td>A systematic method used to identify stimuli (items, activities, social interactions) likely to function as reinforcers</td><td>MSWO before a session</td><td>What do they like?</td><td>Reinforcer assessment</td><td>Skill assessment</td></tr>
      <tr><td>Indirect Preference Assessment</td><td>Identifying potential reinforcers by asking caregivers, parents, teachers or staff what the client is likely to enjoy</td><td>Caregiver interview</td><td>Ask someone else</td><td>Interview</td><td>Direct assessment</td></tr>
      <tr><td>Free Operant Preference Assessment</td><td>Client has free access to a variety of items at once; time spent engaging with each is recorded</td><td>Timer running during free play</td><td>Free to roam; time it</td><td>Direct assessment</td><td>Paired choice</td></tr>
      <tr><td>Paired Choice Preference Assessment</td><td>Client is presented with two items at a time and asked to choose one</td><td>"This one or this one?"</td><td>Two at a time</td><td>MSWO</td><td>Free operant</td></tr>
      <tr><td>MSWO Preference Assessment</td><td>Client is presented with an array (5–8) and asked to select one; chosen items are removed from the array</td><td>Array of 6 toys, shrinking</td><td>Without replacement</td><td>Paired choice</td><td>Free operant</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT14 in one breath</span>
    <p>A <strong>preference assessment</strong> systematically identifies items, activities or social interactions <strong>likely to function as reinforcers</strong>, because desirable behavior needs a motivated learner, many learning opportunities, and reinforcement over time. They matter because they <strong>find reinforcers, keep you current</strong> (preferences change — check often), <strong>boost motivation, minimize problem behavior</strong> and <strong>individualize treatment</strong>. There are four types: <strong>indirect</strong> (interview caregivers and staff) and three direct ones — <strong>free operant</strong> (free access to everything at once; record <em>how long</em> they engage with each, the only one needing a timer), <strong>paired choice</strong> (two items at a time, pick one) and <strong>MSWO</strong> (an array of 5–8, pick one, and the chosen item is <em>removed</em> — "without replacement").</p>
  </div>

  <div class="box exam"><span class="lbl">RBT14 exam checklist</span>
    <ul class="checklist">
      <li>Define preference assessment and explain its purpose.</li>
      <li>Give five reasons to run preference assessments.</li>
      <li>Explain why preferences must be re-checked over time, using MO language.</li>
      <li>Define all four types and say which is indirect.</li>
      <li>Tell free operant, paired choice, and MSWO apart by the array and what's recorded.</li>
      <li>Say which type requires a timer.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt15">
  <div class="plate"><span class="num" aria-hidden="true">15</span><p class="ttl">Functional assessment</p><p class="src">60-minute course · Defining functional assessment · The four functions · Indirect vs descriptive vs functional analysis · The FBA process · Identifying ABCs</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt04-function">RBT04</a>'s four functions and <a href="#rbt03-abc">RBT03</a>'s ABCs. This module is the formal procedure for finding the function, and it feeds directly into the BIP in <a href="#rbt33">RBT33</a>.</p>
  </div>

  <h3 id="rbt15-importance">Why functional assessment matters</h3>
  <div class="box def"><span class="lbl">Definition: functional assessment</span>
    <p>A process used to <strong>identify why a behavior is happening</strong>. Also referred to as an <strong>FBA</strong> (functional behavior assessment).</p>
  </div>
  <p>Once we figure out the "why," we can <strong>match interventions to learner needs</strong>, <strong>reduce challenging behaviors</strong>, and <strong>increase positive, replacement behaviors</strong>.</p>

  <h3 id="rbt15-functions">The four functions, again</h3>
  <p>RBT15 words the four functions slightly differently from <a href="#rbt04-function">RBT04</a> — worth knowing both phrasings:</p>
  <div class="tw"><table>
    <thead><tr><th>Function</th><th>RBT15's wording</th></tr></thead>
    <tbody>
      <tr><td><strong>Attention</strong></td><td>The behavior gets a <strong>reaction from others — the reaction could be positive or negative</strong>.</td></tr>
      <tr><td><strong>Escape</strong></td><td>The behavior allows the learner to <strong>avoid or get out of a task or situation</strong>.</td></tr>
      <tr><td><strong>Tangible</strong></td><td>The behavior results in <strong>obtaining an item or activity</strong>.</td></tr>
      <tr><td><strong>Automatic</strong></td><td>The behavior itself is reinforcing — <strong>it feels good or relieves discomfort</strong>.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: attention includes negative attention</span>
    <p>"The reaction could be positive <em>or negative</em>" is the clause that trips people up. Being told off is attention. Being looked at sharply is attention. A behavior maintained by attention will keep happening even when the attention it gets is disapproving — which is exactly why <strong>planned ignoring</strong> (<a href="#rbt37-common">RBT37</a>) works on it and scolding doesn't.</p>
  </div>

  <h3 id="rbt15-parts">The three parts of a functional assessment</h3>
  <div class="tw"><table>
    <thead><tr><th>Part</th><th>Definition</th><th>In one phrase</th></tr></thead>
    <tbody>
      <tr><td><strong>Indirect assessment</strong></td><td>Involves <strong>interviews, rating scales, or questionnaires</strong> with caregivers or staff about reasons the target behavior is occurring</td><td><em>Interviewing caregivers</em></td></tr>
      <tr><td><strong>Descriptive assessment</strong></td><td>Involves <strong>observing and recording the behavior in real time</strong></td><td><em>Observing the problem behavior</em></td></tr>
      <tr><td><strong>Functional analysis (FA)</strong></td><td>Involves <strong>systematically testing different conditions</strong> to identify the function</td><td><em>Testing different conditions</em></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "functional assessment" vs "functional analysis"</span>
    <p>They sound identical and they are not. The <strong>functional assessment (FBA)</strong> is the <em>whole process</em>. The <strong>functional analysis (FA)</strong> is <em>one method inside it</em> — the only one that experimentally <em>manipulates</em> conditions rather than just asking or watching. Note on the FBA flowchart that the FA step is marked <strong>"(if needed)"</strong>: it isn't always run.</p>
    <p>Ordering them by how much control they involve: <strong>indirect</strong> (ask) → <strong>descriptive</strong> (watch) → <strong>functional analysis</strong> (test).</p>
  </div>

  <h3 id="rbt15-support">How RBTs support functional assessment</h3>
  <div class="tw"><table>
    <thead><tr><th>RBTs do</th><th>RBTs don't</th></tr></thead>
    <tbody>
      <tr><td>Follow instructions</td><td rowspan="3">Design assessment conditions · Interpret or write up assessment results · Choose interventions or write BIPs</td></tr>
      <tr><td>Collect accurate data</td></tr>
      <tr><td>Report observations clearly</td></tr>
    </tbody>
  </table></div>
  <p>The results of doing your part well: <strong>reliable data</strong>, a <strong>clear picture of the behavior</strong>, and <strong>efficient treatment planning</strong>.</p>

  <h3 id="rbt15-process">The FBA process, step by step</h3>
  <div class="box proc"><span class="lbl">Process: the nine steps of an FBA</span>
    <div class="tw"><table>
      <thead><tr><th class="num">Step</th><th>What happens</th><th>Your involvement</th></tr></thead>
      <tbody>
        <tr><td class="num">1</td><td>Identify / define the target behavior</td><td>May be asked to assist</td></tr>
        <tr><td class="num">2</td><td>Gather background info</td><td>May be asked to assist</td></tr>
        <tr><td class="num">3</td><td>Conduct indirect assessment</td><td>May be asked to assist</td></tr>
        <tr><td class="num">4</td><td>Conduct descriptive assessment</td><td><strong>Will likely assist</strong></td></tr>
        <tr><td class="num">5</td><td>Formulate hypotheses</td><td>Supervisor leads</td></tr>
        <tr><td class="num">6</td><td>Conduct FA (<em>if needed</em>)</td><td>May be asked to assist</td></tr>
        <tr><td class="num">7</td><td>Develop function-based intervention</td><td>Supervisor leads</td></tr>
        <tr><td class="num">8</td><td>Implement / monitor intervention</td><td><strong>Will likely assist</strong></td></tr>
        <tr><td class="num">9</td><td>Evaluate / revise (as needed)</td><td>Supervisor leads</td></tr>
      </tbody>
    </table></div>
    <p>The manual's summary: <em>RBTs may be asked to assist with steps 1–3 and 6. RBTs will likely assist with steps 4 and 8. The supervisor will take the lead on all steps, especially steps 5–7 and 9.</em></p>
  </div>

  <h3 id="rbt15-abc">Identifying the ABCs</h3>
  <div class="tw"><table>
    <thead><tr><th>Antecedent</th><th>Behavior</th><th>Consequence</th></tr></thead>
    <tbody>
      <tr><td>What happened <strong>right before</strong> the behavior</td><td>The <strong>target behavior of concern</strong></td><td>What happened <strong>right after</strong> the behavior</td></tr>
    </tbody>
  </table></div>
  <p>The practice routine here is the same five steps as the others, minus the timer: have your data sheet ready, double check it, start the video, watch carefully and record, then double check your answers.</p>

  <h3 id="rbt15-gloss">RBT15 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Functional Assessment</td><td>A process used to identify why a behavior is happening; also called an FBA</td><td>The whole nine-step process</td><td>Finds the "why"</td><td>FBA</td><td>Skill assessment</td></tr>
      <tr><td>Indirect Assessment</td><td>Interviews, rating scales, or questionnaires with caregivers or staff about reasons the target behavior occurs</td><td>Caregiver questionnaire</td><td>Ask</td><td>Indirect preference assessment</td><td>Functional analysis</td></tr>
      <tr><td>Descriptive Assessment</td><td>Observing and recording the behavior in real time</td><td>ABC data in session</td><td>Watch</td><td>Direct observation</td><td>Indirect assessment</td></tr>
      <tr><td>Functional Analysis (FA)</td><td>Systematically testing different conditions to identify the function</td><td>Alternating test conditions</td><td>Test</td><td>Experimental analysis</td><td>Descriptive assessment</td></tr>
      <tr><td>Attention Function</td><td>The behavior gets a reaction from others — positive or negative</td><td>Being scolded still counts</td><td>Any reaction</td><td>Socially mediated</td><td>Automatic function</td></tr>
      <tr><td>Escape Function</td><td>The behavior allows the learner to avoid or get out of a task or situation</td><td>Throwing the worksheet</td><td>Gets out of it</td><td>Negative reinforcement</td><td>Tangible function</td></tr>
      <tr><td>Tangible Function</td><td>The behavior results in obtaining an item or activity</td><td>Grabbing a toy</td><td>Gets a thing</td><td>Access to tangibles</td><td>Escape function</td></tr>
      <tr><td>Automatic Function</td><td>The behavior itself is reinforcing — it feels good or relieves discomfort</td><td>Rocking alone in a room</td><td>Its own reward</td><td>Sensory</td><td>Socially mediated</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT15 in one breath</span>
    <p>A <strong>functional assessment (FBA)</strong> identifies <em>why</em> a behavior is happening, so interventions can be matched to needs, challenging behavior reduced, and replacement behaviors increased. The four functions are <strong>attention</strong> (a reaction from others, <em>positive or negative</em>), <strong>escape</strong> (avoid or get out of a task), <strong>tangible</strong> (obtain an item or activity) and <strong>automatic</strong> (the behavior feels good or relieves discomfort). It has three parts, in order of how much you control: <strong>indirect assessment</strong> (interviews, rating scales, questionnaires), <strong>descriptive assessment</strong> (observing and recording in real time) and <strong>functional analysis</strong> (systematically testing conditions) — and note that <em>functional analysis is one method inside the broader functional assessment</em>, and the flowchart marks it "if needed". RBTs <strong>follow instructions, collect accurate data and report observations clearly</strong>; RBTs <strong>do not design conditions, interpret results, or choose interventions</strong>. The nine-step FBA runs from defining the target behavior through to evaluating and revising, with RBTs likely assisting on <strong>descriptive assessment (step 4)</strong> and <strong>implementing/monitoring (step 8)</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT15 exam checklist</span>
