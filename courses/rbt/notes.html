      <dt>Activity-based instruction</dt><dd>Teaching is <strong>embedded into meaningful daily routines</strong>, play, or tasks that already have structure.</dd>
      <dt>Mand training</dt><dd>Focused instruction to teach the learner <strong>how to request</strong> preferred items, actions, or help.</dd>
    </dl>
  </div>
  <p><strong>Key features of naturalistic teaching:</strong></p>
  <div class="tw"><table>
    <tbody>
      <tr><td><strong>Organic</strong> — happens in natural environments</td><td><strong>Captures the learner's interests</strong></td><td><strong>Learning is often initiated by the learner</strong></td></tr>
      <tr><td><strong>Targets functional skills</strong> (especially communication)</td><td><strong>Uses natural consequences as reinforcers</strong></td><td><strong>Is flexible, not scripted</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box ex"><span class="lbl">Worked example: DTT vs NT on the same target</span>
    <div class="tw"><table>
      <thead><tr><th>DTT: colors</th><th>NT: colors</th></tr></thead>
      <tbody>
        <tr><td>The RBT holds up a flashcard and says, "What color is this?" The client says "green" and gets <strong>a token</strong>.</td><td>The client reaches for a green car. The RBT pauses and the child says, "green." The RBT hands <strong>the car</strong> to the child.</td></tr>
        <tr><td><strong>DTT is structured and adult-led</strong> — great for teaching new skills in a clear, repetitive way.</td><td><strong>NT is flexible and child-led</strong> — it happens during play and real life. <strong>Great for generalization!</strong></td></tr>
      </tbody>
    </table></div>
    <p>Notice the consequence column: a token versus the actual car. That is the "natural consequence" feature, and it is why NT produces mands that work in the real world.</p>
  </div>

  <h3 id="rbt23-steps">The 11 steps of naturalistic teaching</h3>
  <div class="box proc"><span class="lbl">Process: implementing NT</span>
    <ol>
      <li><strong>Know the target.</strong> You can't teach effectively if you don't know the goal — always review the targets before starting.</li>
      <li><strong>Arrange the environment.</strong> When it's set up well, the learner is more likely to initiate learning opportunities without you forcing it.</li>
      <li><strong>Follow the learner's lead.</strong> Let them select the activity and play with them — you're playing <em>with</em> them, not against them.</li>
      <li><strong>Capture or contrive a learning opportunity.</strong> Watch for a teaching moment or create one naturally.</li>
      <li><strong>Deliver a natural SD.</strong> A short, meaningful cue that fits what's happening — it should feel like part of the activity, <strong>not like a random question out of nowhere</strong>.</li>
      <li><strong>Wait.</strong> Pause for <strong>3–5 seconds</strong>. That short pause gives the learner a fair chance to respond on their own.</li>
      <li><strong>Prompt (as needed).</strong> Give just enough help. <strong>Typically you will use least-to-most prompting during naturalistic teaching</strong> — start small and increase help only if needed.</li>
      <li><strong>Reinforce naturally.</strong> Give them exactly what they asked for, or what makes sense for the activity.</li>
      <li><strong>Take data.</strong> Record how the learner responded, just as your BCBA taught you.</li>
      <li><strong>Embed additional targets.</strong> Keep teaching while the activity is going — more natural opportunities mean more practice without it feeling like a drill.</li>
      <li><strong>End positively.</strong> Wrap up on a good note so the learner is happy to transition and willing to work with you again later.</li>
    </ol>
  </div>
  <div class="box warn"><span class="lbl">Watch out: MTL for DTT, LTM for NT</span>
    <p><a href="#rbt18-errorless">Errorless learning</a> (used heavily in DTT) is "almost always MTL." Naturalistic teaching "typically uses <strong>least-to-most</strong>." That contrast is very testable, and it makes sense: NT is built on the learner <em>initiating</em>, so you give them the chance to do it unaided first.</p>
  </div>

  <h3 id="rbt23-strategies">Ten strategies for effective NT</h3>
  <div class="tw"><table>
    <thead><tr><th>Strategy</th><th>What it is</th></tr></thead>
    <tbody>
      <tr><td><strong>Expectant looks</strong></td><td>Use eye contact, facial expression, and an intentional pause to encourage a response.</td></tr>
      <tr><td><strong>Pregnant pauses</strong></td><td>Provide only part of a phrase, or leave out predictable labels or actions, so the learner can fill it in or tell you what to do.</td></tr>
      <tr><td><strong>Entice with objects</strong></td><td>Engage with items in fun or unexpected ways to draw attention and increase desire to play with them.</td></tr>
      <tr><td><strong>Gentle sabotage</strong></td><td>Intentionally omit or alter part of an activity to encourage communication.</td></tr>
      <tr><td><strong>Offer choices</strong></td><td>Provide two or more options to promote decision-making and language use.</td></tr>
      <tr><td><strong>Reciprocal commenting</strong></td><td>Make casual comments and wait for the child to respond or expand.</td></tr>
      <tr><td><strong>Narrate the session</strong></td><td>Describe what's happening using clear, natural language.</td></tr>
      <tr><td><strong>Negations / absurdities</strong></td><td>Use silly or incorrect statements or actions to spark correction or attention.</td></tr>
      <tr><td><strong>Shared control</strong></td><td>Follow the child's lead AND contribute to the activity.</td></tr>
      <tr><td><strong>Reinforce attempts</strong></td><td>Acknowledge and reinforce even <em>approximations</em> of a skill to build momentum.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt23-integrity">Procedural integrity in NT</h3>
  <div class="tw"><table>
    <thead><tr><th>Checklist item</th><th>Example of doing it right</th></tr></thead>
    <tbody>
      <tr><td>Reviewed SAP and identified targets</td><td>She knew the goal was labeling animals and chose farm toys intentionally.</td></tr>
      <tr><td>Arranged the environment to promote motivation</td><td>He placed animal figures on a high shelf to encourage requesting.</td></tr>
      <tr><td>Followed learner's lead</td><td>When the child chose the car ramp, the RBT joined in and used it to teach "fast" and "slow."</td></tr>
      <tr><td>Captured or contrived teaching opportunities</td><td>She paused at the top of the ramp and waited for the child to say "go."</td></tr>
      <tr><td>Used correct prompting and wait time</td><td><strong>🚫 What not to see:</strong> prompted immediately with a full verbal cue every time.</td></tr>
      <tr><td>Delivered natural reinforcement</td><td>Child said "cow," and the RBT immediately handed over the toy cow.</td></tr>
      <tr><td>Collected accurate data</td><td><strong>🚫 What not to see:</strong> no data collected because it felt "too casual."</td></tr>
    </tbody>
  </table></div>
  <p>Three habits: <strong>read the SAP before every session · have a plan to teach · ask your BCBA for clarification and feedback.</strong></p>

  <h3 id="rbt23-data">Data collection barriers and solutions</h3>
  <p>In NT, collecting data can feel tricky — you're on the floor, in play, mid-conversation, juggling materials, trying not to interrupt the moment. It takes practice, but with good systems you can teach and take great data at the same time.</p>
  <div class="tw"><table>
    <thead><tr><th>Barrier</th><th>Solutions</th></tr></thead>
    <tbody>
      <tr><td><strong>"I forgot to record the trial."</strong></td><td>Keep your data sheet or tablet close · take data immediately after the reinforcer is delivered · use a code or checkmark system you're fluent in, and don't make it more complicated than it needs to be.</td></tr>
      <tr><td><strong>"Learner got distracted when I collected data."</strong></td><td>Use discreet methods like digital clickers or tallies · practice your "multi-tasking face" — nod and smile while writing so you stay socially engaged · include the learner: <em>"I'm just writing that you asked for more bubbles! That was awesome!"</em></td></tr>
      <tr><td><strong>"There was too much going on. I couldn't keep track!"</strong></td><td>Focus on one or two targets during high-activity segments · break data collection into short time blocks (5 minutes on mands, 5 on labeling) · if you lose track, write a note in the session log to let your BCBA know what happened.</td></tr>
      <tr><td><strong>"It's hard to know what counts as a trial during play."</strong></td><td>Review the target definitions with your BCBA · <strong>ask, don't guess</strong> · ask for sample data sheets with examples for naturalistic contexts.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt23-gloss">RBT23 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Naturalistic Teaching</td><td>An ABA strategy where instruction happens during naturally occurring and motivating activities</td><td>Teaching "green" during car play</td><td>Teach in real life</td><td>NET</td><td>DTT</td></tr>
      <tr><td>Natural Environment Training (NET)</td><td>Spontaneously teaching skills during naturally occurring activities the learner is already engaged in</td><td>Teaching during snack</td><td>In their environment</td><td>Naturalistic teaching</td><td>DTT</td></tr>
      <tr><td>Incidental Teaching</td><td>Teaching opportunities set up by the RBT but initiated by the learner</td><td>Toys on a high shelf</td><td>You set it, they start it</td><td>Contriving opportunities</td><td>Teacher-led trial</td></tr>
      <tr><td>Activity-Based Instruction</td><td>Teaching embedded into meaningful daily routines, play, or tasks that already have structure</td><td>Teaching during handwashing</td><td>Inside the routine</td><td>NET</td><td>—</td></tr>
      <tr><td>Mand Training</td><td>Focused instruction to teach the learner how to request preferred items, actions, or help</td><td>Teaching "more"</td><td>Teaching requests</td><td>Mand</td><td>Tact training</td></tr>
      <tr><td>Gentle Sabotage</td><td>Intentionally omitting or altering part of an activity to encourage communication</td><td>Giving a bowl with no spoon</td><td>Break it on purpose</td><td>Contriving an MO</td><td>—</td></tr>
      <tr><td>Pregnant Pause</td><td>Providing only part of a phrase or leaving out a predictable label so the learner fills it in</td><td>"Ready, set…"</td><td>Leave a gap</td><td>Expectant look</td><td>—</td></tr>
      <tr><td>Procedural Integrity</td><td>Doing what the program says, exactly how it was written by the BCBA</td><td>Correct wait time in NT</td><td>Run it as written</td><td>Treatment fidelity</td><td>Drift</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT23 in one breath</span>
    <p><strong>Naturalistic teaching</strong> delivers instruction during naturally occurring, motivating activities: it is <strong>organic, captures the learner's interests, is often learner-initiated, targets functional skills (especially communication), uses natural consequences as reinforcers, and is flexible rather than scripted</strong>. Related terms are <strong>NET</strong> (teaching in activities the learner is already doing), <strong>incidental teaching</strong> (opportunities you set up but the learner initiates), <strong>activity-based instruction</strong> (embedded in existing routines) and <strong>mand training</strong>. Against <strong>DTT</strong> — structured, adult-led, good for teaching new skills clearly — NT is <strong>flexible, child-led, and great for generalization</strong>, and the giveaway is the consequence: a token in DTT, the actual requested item in NT. The eleven steps run <strong>know the target, arrange the environment, follow the learner's lead, capture or contrive an opportunity, deliver a natural SD, wait 3–5 seconds, prompt as needed (typically <em>least-to-most</em>), reinforce naturally, take data, embed additional targets, end positively</strong>. Ten strategies — expectant looks, pregnant pauses, enticing with objects, gentle sabotage, offering choices, reciprocal commenting, narrating, negations and absurdities, shared control, reinforcing attempts — keep it productive, and the two integrity failures to avoid are <strong>prompting immediately every time</strong> and <strong>not collecting data because it felt too casual</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT23 exam checklist</span>
    <ul class="checklist">
      <li>Define naturalistic teaching, NET, incidental teaching, activity-based instruction, and mand training.</li>
      <li>List the six key features of naturalistic teaching.</li>
      <li>Compare and contrast DTT and NT, including the same target taught both ways.</li>
      <li>List the 11 steps of implementing NT in order.</li>
      <li>State the wait time and the prompting procedure typically used in NT.</li>
      <li>Name all ten strategies for effective naturalistic teaching.</li>
      <li>Give two things a BCBA would <em>not</em> want to see on an NT integrity check.</li>
      <li>Name four data collection barriers in NT and a solution to each.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt24">
  <div class="plate"><span class="num" aria-hidden="true">24</span><p class="ttl">Task analysis and chaining</p><p class="src">60-minute course · Conceptual and procedural aspects of task analysis &amp; chaining · Implementing with procedural integrity</p></div>

  <h3 id="rbt24-ta">Task analysis</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Behavior chain</dt><dd>A <strong>sequence of smaller, related actions that lead to a specific outcome</strong>.</dd>
      <dt>Task analysis</dt><dd>Breaking down a complex skill into teachable parts — a <strong>written list of the steps</strong> needed to complete a skill, <strong>in the right order</strong>.</dd>
      <dt>Chaining</dt><dd>The process of <strong>teaching each step in the chain, one at a time</strong>, until the learner can do the whole skill independently.</dd>
    </dl>
  </div>
  <div class="box proc"><span class="lbl">Process: creating a task analysis</span>
    <ol>
      <li><strong>Identify the goal or end product</strong> (e.g. tie shoes).</li>
      <li><strong>Identify the instruction or SD.</strong></li>
      <li><strong>List each step of the behavior chain in order.</strong></li>
    </ol>
    <p><strong>Three ways to identify the steps:</strong> observe someone perform the task · ask caregivers how they perform the task · <strong>try it yourself!</strong></p>
    <p><strong>Three factors that affect the detail in a TA:</strong> the <strong>learner's skill level and familiarity</strong> with the task · <strong>cultural and contextual information</strong> · <strong>generalization</strong>.</p>
    <p><em>Every learner is unique — the task analysis should be, too.</em> And the division of labour: <strong>BCBAs create the TA. RBTs implement them.</strong></p>
  </div>

  <h3 id="rbt24-chaining">The three chaining procedures</h3>
  <p>All three share the goal of teaching complex skills; <strong>the difference is where the learning starts.</strong></p>
  <div class="tw"><table>
    <thead><tr><th>Procedure</th><th>Starting point</th><th>Definition</th></tr></thead>
    <tbody>
      <tr><td><strong>Forward chaining</strong></td><td>Learner starts at the <strong>beginning</strong> of the chain and learns steps in sequential order</td><td>The learner is taught the first step first. Subsequent steps are added in order. The RBT prompts the rest of the chain.</td></tr>
      <tr><td><strong>Backward chaining</strong></td><td>Learner starts at the <strong>end</strong> of the chain and learns steps in reverse order</td><td>The learner is taught the last step first. The RBT guides them through all the earlier steps, then lets them try the final step independently.</td></tr>
      <tr><td><strong>Total task presentation</strong></td><td>Learner works on <strong>all steps every time</strong></td><td>The learner is given the chance to try every step of the chain during each teaching session. The RBT provides prompts or assistance as needed.</td></tr>
    </tbody>
  </table></div>
  <div class="box ex"><span class="lbl">Worked example: dressing, taught three ways</span>
    <div class="tw"><table>
      <thead><tr><th>Method</th><th>What it looks like</th></tr></thead>
      <tbody>
        <tr><td><strong>Forward</strong></td><td>The learner starts with step 1 while the RBT completes the rest. Once step 1 is mastered, the learner does steps 1–2 and the RBT completes 3–4. This continues, <strong>adding one new step from the beginning</strong> each time, until the learner can dress independently.</td></tr>
        <tr><td><strong>Backward</strong></td><td>The RBT completes all but the last step, which the learner performs. As the learner masters the final step, the RBT adds the previous step for the learner to do, <strong>moving backward through the chain</strong> until they can complete all steps independently.</td></tr>
        <tr><td><strong>Total task</strong></td><td>The learner attempts <strong>all steps in the sequence during each session</strong>. The RBT provides prompts and support as needed for any step the learner hasn't mastered, until the entire chain is performed independently.</td></tr>
      </tbody>
    </table></div>
  </div>
  <div class="box warn"><span class="lbl">Watch out: where reinforcement goes</span>
    <p>Reinforcement can occur at different parts in the chain. <strong>Always check the SAP</strong> to see whether you should reinforce <strong>after every independent response</strong>, <strong>after the target step is completed</strong>, or <strong>after the entire chain is completed</strong>. Guessing here is a procedural integrity failure even if the teaching looks fine.</p>
  </div>

  <h3 id="rbt24-data">Data and procedural integrity</h3>
  <p>Your BCBA may ask you to take data on a variety of things during a chaining procedure. Always check the SAP and ask for clarification. You may collect data on:</p>
  <div class="tw"><table>
    <tbody>
      <tr><td><strong>Steps completed independently</strong></td><td><strong>Prompt level</strong></td><td><strong>Reinforcement</strong></td><td><strong>Completion of the chain</strong></td><td><strong>Errors</strong></td></tr>
    </tbody>
  </table></div>
  <div class="tw"><table>
    <thead><tr><th>Strategies for success</th><th>Procedural integrity check</th></tr></thead>
    <tbody>
      <tr><td><strong>Keep the TA in front of you</strong> during teaching. Use it as a checklist so you don't accidentally skip or combine steps.</td><td>Presenting the correct SD · Following the exact steps, in order</td></tr>
      <tr><td><strong>Review the plan before the session</strong> to remind yourself which prompt to use and when.</td><td>Using the chaining method specified in the SAP · Delivering prompts as described in the SAP</td></tr>
      <tr><td><strong>Record data in real time</strong>, as described in the SAP.</td><td>Providing reinforcement as described in the SAP · Recording data as described in the SAP</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt24-gloss">RBT24 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Behavior Chain</td><td>A sequence of smaller, related actions that lead to a specific outcome</td><td>Handwashing</td><td>Links in a chain</td><td>Task analysis</td><td>Discrete skill</td></tr>
      <tr><td>Task Analysis</td><td>Breaking a complex skill into teachable parts — a written list of the steps in the right order</td><td>7 steps to wash hands</td><td>Analyze the task</td><td>Behavior chain</td><td>—</td></tr>
      <tr><td>Chaining</td><td>Teaching each step in the chain, one at a time, until the learner can do the whole skill independently</td><td>Forward, backward, total task</td><td>Build the chain</td><td>Shaping</td><td>—</td></tr>
      <tr><td>Forward Chaining</td><td>The learner is taught the first step first; subsequent steps are added in order; the RBT prompts the rest</td><td>Step 1, then 1–2, then 1–3</td><td>Start at the start</td><td>Total task</td><td>Backward chaining</td></tr>
      <tr><td>Backward Chaining</td><td>The learner is taught the last step first; the RBT guides earlier steps, then the learner does the final step</td><td>Last step, then last two</td><td>Start at the end</td><td>—</td><td>Forward chaining</td></tr>
      <tr><td>Total Task Presentation</td><td>The learner tries every step of the chain during each session, with prompts as needed</td><td>All steps, every session</td><td>The whole thing</td><td>Graduated guidance</td><td>Forward/backward chaining</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT24 in one breath</span>
    <p>A <strong>behavior chain</strong> is a sequence of smaller related actions leading to an outcome; a <strong>task analysis</strong> is the written, ordered list of those steps; <strong>chaining</strong> is teaching them one at a time until the learner does the whole skill alone. You build a TA by <strong>identifying the goal, identifying the SD, and listing each step in order</strong>, finding the steps by <strong>observing someone, asking caregivers, or doing it yourself</strong>, and adjusting detail for the <strong>learner's skill level, cultural and contextual information, and generalization</strong> — <strong>BCBAs create the TA, RBTs implement it</strong>. The three procedures differ only in <em>where learning starts</em>: <strong>forward chaining</strong> (first step first, adding forward), <strong>backward chaining</strong> (last step first, adding backward) and <strong>total task presentation</strong> (every step, every session, prompted as needed). Reinforcement may come <strong>after every independent response, after the target step, or after the entire chain</strong> — check the SAP. Data may cover <strong>steps completed independently, prompt level, reinforcement, completion of the chain, and errors</strong>; keep the TA in front of you as a checklist so you don't skip or combine steps.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT24 exam checklist</span>
    <ul class="checklist">
      <li>Define behavior chain, task analysis, and chaining.</li>
      <li>List the three steps of creating a task analysis and the three ways to identify the steps.</li>
      <li>Name three factors that affect how detailed a TA should be.</li>
      <li>Say who creates the TA and who implements it.</li>
      <li>Define forward chaining, backward chaining, and total task presentation, and say where each starts.</li>
      <li>Describe the same skill taught all three ways.</li>
      <li>Name the three places reinforcement might be delivered in a chain.</li>
      <li>List five things you might collect data on during chaining.</li>
      <li>Give three strategies for success and six procedural integrity checks.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt25">
  <div class="plate"><span class="num" aria-hidden="true">25</span><p class="ttl">Shaping</p><p class="src">60-minute course · Conceptual and procedural aspects of shaping · Implementing shaping procedures</p></div>

  <h3 id="rbt25-intro">What shaping is</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Shaping</dt><dd>Teaching by <strong>rewarding small, gradual improvements toward one goal behavior</strong>.</dd>
      <dt>Successive approximations</dt><dd>Each new version of the behavior that's <strong>closer to the final goal</strong>.</dd>
      <dt>Terminal behavior</dt><dd>The <strong>finished skill or end goal</strong> we're aiming for.</dd>
    </dl>
    <p>Shaping is about <strong>meeting the learner where they are</strong> and using reinforcement to celebrate small, doable steps that bring them closer to the goal. The manual's example: <strong>pointing + sound → "Wa" → "Wada" → "Water."</strong></p>
  </div>
  <div class="box warn"><span class="lbl">Watch out: shaping vs prompting vs chaining</span>
    <div class="tw"><table>
      <thead><tr><th>Intervention</th><th>Definition</th><th>Example</th></tr></thead>
      <tbody>
        <tr><td><strong>Prompting</strong></td><td>Providing help so the person can do the skill <strong>right away</strong>. The learner is performing the <em>desired</em> behavior, just with assistance.</td><td>Guiding a child's hand to cut with scissors; pointing to the correct answer.</td></tr>
        <tr><td><strong>Chaining</strong></td><td>Teaching <strong>distinctly different steps</strong> of a skill, in order.</td><td>The steps of making a sandwich, or tying shoes.</td></tr>
        <tr><td><strong>Shaping</strong></td><td>Reinforcing <strong>gradual improvements to the same behavior</strong>.</td><td>Teaching a child to ride a bike — first sitting on it, then pushing the pedals, then coasting, then pedaling continuously.</td></tr>
      </tbody>
    </table></div>
    <p>The clean test: <strong>chaining teaches <em>different</em> steps; shaping improves <em>one</em> behavior.</strong> And in prompting the learner is already doing the real thing with help, whereas in shaping they're doing a rougher version unaided.</p>
  </div>

  <h3 id="rbt25-dimensions">Dimensions of behavior you can shape</h3>
  <div class="box def"><span class="lbl">Definition: dimensions of behavior</span>
    <p>Aspects of a behavior that allow it to be <strong>precisely defined, measured, and shaped</strong>.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Dimension</th><th>Definition</th><th>Shaping it means reinforcing…</th></tr></thead>
    <tbody>
      <tr><td><strong>Duration</strong></td><td>How long the behavior happens</td><td>…doing something for longer (or shorter) stretches of time</td></tr>
      <tr><td><strong>Magnitude</strong></td><td>The intensity or strength of the behavior</td><td>…versions a little stronger or more powerful than before — or sometimes a little softer</td></tr>
      <tr><td><strong>Rate</strong></td><td>How often a behavior happens in a given amount of time</td><td>…the behavior happening more often — or less often — depending on the goal</td></tr>
      <tr><td><strong>Topography</strong></td><td>The form or appearance of the behavior (how it looks)</td><td>…versions that look more and more like the final desired form</td></tr>
      <tr><td><strong>Latency</strong></td><td>The time between the SD and the onset of the behavior</td><td>…longer (or shorter) delays to responding following an SD</td></tr>
    </tbody>
  </table></div>
  <p><strong>You can shape more than one dimension at the same time.</strong></p>

  <h3 id="rbt25-steps">The seven steps of shaping</h3>
  <div class="box proc"><span class="lbl">Process: shaping, and who does what</span>
    <div class="tw"><table>
      <thead><tr><th class="num">#</th><th>Step</th><th>Who</th></tr></thead>
      <tbody>
        <tr><td class="num">1</td><td><strong>Choose the terminal behavior.</strong> Sets a goal for a new skill, considering assessment data, program goals, and developmental appropriateness.</td><td><strong>BCBA</strong></td></tr>
        <tr><td class="num">2</td><td><strong>Identify the baseline.</strong> Assess the learner's current level of performance on the skill.</td><td><strong>BCBA and RBT together</strong></td></tr>
        <tr><td class="num">3</td><td><strong>Plan the successive approximations.</strong> List the small steps that will be reinforced, including the reinforcement schedule and criteria to move to the next step.</td><td><strong>BCBA</strong></td></tr>
        <tr><td class="num">4</td><td><strong>Reinforcement and extinction.</strong> Reinforce the learner when they engage in the behavior at the target step. <strong>STOP reinforcing previous step(s).</strong></td><td><strong>RBT</strong></td></tr>
        <tr><td class="num">5</td><td><strong>Collect data</strong> immediately after the behavior occurs. The BCBA analyzes it to decide when to move on or modify.</td><td><strong>RBT</strong> collects, <strong>BCBA</strong> analyzes</td></tr>
        <tr><td class="num">6</td><td><strong>Raise the bar gradually until the goal is met.</strong> Reinforce each successive approximation and put previous behaviors on extinction, <em>when the BCBA approves moving to the next step</em>.</td><td><strong>RBT</strong> follows the BCBA's plan</td></tr>
        <tr><td class="num">7</td><td><strong>Maintenance.</strong> A plan is created to fade reinforcement; maintenance trials are run and data collected as described in the SAP.</td><td><strong>BCBA</strong> plans, <strong>RBT</strong> runs</td></tr>
      </tbody>
    </table></div>
  </div>

  <h3 id="rbt25-extinction">Reinforcement and extinction in shaping</h3>
  <div class="box ex"><span class="lbl">Worked example: shaping rate of tacting</span>
    <p>The manual walks a learner from 5 to 20 tacts per hour. Watch what happens to the <em>old</em> targets:</p>
    <div class="tw"><table>
      <thead><tr><th>Current target</th><th>5/hr</th><th>8/hr</th><th>12/hr</th><th>16/hr</th><th>20/hr</th></tr></thead>
      <tbody>
        <tr><td><strong>Step 1</strong></td><td>Break!</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>
        <tr><td><strong>Step 2</strong></td><td>Nothing / Ext.</td><td>Break!</td><td>—</td><td>—</td><td>—</td></tr>
        <tr><td><strong>Step 3</strong></td><td>Nothing / Ext.</td><td>Nothing / Ext.</td><td>Break!</td><td>—</td><td>—</td></tr>
        <tr><td><strong>Step 4</strong></td><td>Nothing / Ext.</td><td>Nothing / Ext.</td><td>Nothing / Ext.</td><td>Break!</td><td>—</td></tr>
        <tr><td><strong>Step 5</strong></td><td>Nothing / Ext.</td><td>Nothing / Ext.</td><td>Nothing / Ext.</td><td>Nothing / Ext.</td><td>Break!</td></tr>
      </tbody>
    </table></div>
    <p><strong>When a new step is introduced, the previous step is no longer the target behavior and does not earn reinforcement. That is extinction.</strong> Shaping works by reinforcing successive approximations that move the learner closer to the terminal goal <em>while placing previously reinforced levels on extinction</em>. <strong>Only behaviors at the current target level (or better) should be reinforced.</strong></p>
  </div>
  <div class="box warn"><span class="lbl">Watch out: shaping contains extinction</span>
    <p>This surprises people. Every time you move the bar, the old approximation goes on <a href="#rbt35-extinction">extinction</a> — which means you should expect the side effects from <a href="#rbt35">RBT35</a>: an <strong>extinction burst</strong>, emotional responding, or variability. That's normal, and it's why the BCBA controls when the bar moves.</p>
  </div>

  <h3 id="rbt25-data">Data and procedural integrity</h3>
  <p>Depending on the dimension being shaped, you may collect <strong>duration data, rate or frequency data, trial-by-trial data, rating scales — and more</strong>. Always review the SAP.</p>
  <div class="tw"><table>
    <thead><tr><th>Look at the data</th><th>What to do</th></tr></thead>
    <tbody>
      <tr><td><strong>Is progress steady?</strong></td><td>Great — keep doing what you are doing and check in with the BCBA when it's time to move to the next step.</td></tr>
      <tr><td><strong>Is progress too slow?</strong></td><td>Check in with the BCBA and share observations about possible barriers. Follow any program modifications they make.</td></tr>
      <tr><td><strong>Is progress faster than expected?</strong></td><td>Check in with the BCBA. They may want to <strong>skip a step or set bigger jumps</strong>.</td></tr>
    </tbody>
  </table></div>
  <p><strong>Procedural integrity check:</strong> know the terminal behavior and dimension · start at the correct target step · deliver reinforcement as planned · collect accurate data · progress through the steps as described in the SAP · record data as described in the SAP.</p>

  <h3 id="rbt25-gloss">RBT25 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Shaping</td><td>Teaching by rewarding small, gradual improvements toward one goal behavior</td><td>"Wa" → "Wada" → "Water"</td><td>Sculpting the behavior</td><td>Successive approximation</td><td>Chaining</td></tr>
      <tr><td>Successive Approximations</td><td>Each new version of the behavior that's closer to the final goal</td><td>8 tacts/hr, then 12</td><td>Closer each time</td><td>Shaping steps</td><td>Terminal behavior</td></tr>
      <tr><td>Terminal Behavior</td><td>The finished skill or end goal we're aiming for</td><td>Saying "Water"</td><td>The terminus</td><td>Goal behavior</td><td>Baseline</td></tr>
      <tr><td>Dimensions of Behavior</td><td>Aspects of a behavior that allow it to be precisely defined, measured, and shaped</td><td>Duration, magnitude, rate, topography, latency</td><td>Five dials</td><td>—</td><td>—</td></tr>
      <tr><td>Duration (dimension)</td><td>How long the behavior happens</td><td>Sitting for 5 min</td><td>How long</td><td>—</td><td>Latency</td></tr>
      <tr><td>Magnitude (dimension)</td><td>The intensity or strength of the behavior</td><td>Louder vocalization</td><td>How strong</td><td>Force</td><td>—</td></tr>
      <tr><td>Rate (dimension)</td><td>How often a behavior happens in a given amount of time</td><td>20 tacts/hour</td><td>How often</td><td>Frequency</td><td>—</td></tr>
      <tr><td>Topography (dimension)</td><td>The form or appearance of the behavior</td><td>Handwriting legibility</td><td>How it looks</td><td>Form</td><td>Function</td></tr>
      <tr><td>Latency (dimension)</td><td>The time between the SD and the onset of the behavior</td><td>Responds within 2 s</td><td>How soon</td><td>—</td><td>Duration</td></tr>
      <tr><td>Extinction</td><td>Withholding reinforcement for a behavior that was previously reinforced</td><td>Old approximation no longer earns a break</td><td>It stops working</td><td>—</td><td>Reinforcement</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT25 in one breath</span>
    <p><strong>Shaping</strong> teaches by reinforcing <strong>successive approximations</strong> — each version closer to the <strong>terminal behavior</strong> — and differs from <strong>prompting</strong> (helping the learner do the real skill now) and <strong>chaining</strong> (teaching <em>distinctly different</em> steps in order) because it improves <strong>one behavior gradually</strong>. You can shape five <strong>dimensions of behavior</strong>: <strong>duration, magnitude, rate, topography and latency</strong> — and more than one at once. The seven steps are <strong>choose the terminal behavior (BCBA), identify the baseline (together), plan the successive approximations (BCBA), reinforce the target step while putting previous steps on extinction (RBT), collect data (RBT) for the BCBA to analyze, raise the bar gradually when the BCBA approves, and run maintenance</strong>. The engine is the step-4 pairing: <strong>only behaviors at the current target level or better earn reinforcement</strong>, so each time the bar moves the old approximation goes on <strong>extinction</strong> — expect the usual extinction side effects. Read the data for whether progress is <strong>steady</strong> (keep going), <strong>too slow</strong> (report barriers) or <strong>faster than expected</strong> (the BCBA may skip a step).</p>
  </div>

  <div class="box exam"><span class="lbl">RBT25 exam checklist</span>
    <ul class="checklist">
      <li>Define shaping, successive approximations, and terminal behavior.</li>
      <li>Differentiate shaping from prompting and from chaining, with an example of each.</li>
      <li>Name the five dimensions of behavior that can be shaped and define each.</li>
      <li>List the seven steps of shaping and say who is responsible for each.</li>
      <li>Explain how extinction operates inside a shaping procedure.</li>
      <li>State the rule about which behaviors earn reinforcement during shaping.</li>
      <li>Say what to do when progress is steady, too slow, or faster than expected.</li>
      <li>List the six procedural integrity checks for shaping.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt26">
  <div class="plate"><span class="num" aria-hidden="true">26</span><p class="ttl">Self-monitoring for independence</p><p class="src">30-minute course · Conceptual and procedural aspects of self-monitoring</p></div>

  <div class="box def"><span class="lbl">Definition: self-monitoring</span>
    <p>When the learner <strong>keeps track of their own behavior</strong>.</p>
  </div>
  <p>Self-monitoring aims to teach learners to become more independent by <strong>noticing, tracking, and taking responsibility for their own behavior</strong>. This helps them <strong>build independence, stay on task, learn new skills, and reduce challenging behaviors</strong>.</p>

  <h3 id="rbt26-goals">Choosing appropriate goals</h3>
  <ul>
    <li>The target behavior should be <strong>observable and measurable</strong> — meaning the RBT can see it <em>and the learner can too</em>.</li>
    <li>The target may reflect <strong>skill acquisition</strong> — the learner will be taught an entirely new skill.</li>
    <li>The target may focus on <strong>behavior reduction</strong> — the learner will be taught to reduce or stop a behavior.</li>
  </ul>
  <div class="box warn"><span class="lbl">Watch out: "and the learner can too"</span>
    <p>Operational definitions (<a href="#rbt06-opdef">RBT06</a>) normally have to be clear to <em>observers</em>. In self-monitoring the learner <strong>is</strong> the observer, so the definition has to be clear to them as well. "On task" won't do; "pencil touching paper" might.</p>
  </div>

  <h3 id="rbt26-role">Your role</h3>
  <div class="box proc"><span class="lbl">Process: the RBT's three jobs</span>
    <ol>
      <li><strong>Understand the plan.</strong> Know what behavior is being tracked · know how the client is supposed to track it · <strong>if anything is unclear, ask the BCBA</strong>.</li>
      <li><strong>Run the system.</strong> Make sure materials are ready · prompt and reinforce <em>the target behavior <strong>and</strong> the tracking</em> · pay attention to accuracy and look for teaching opportunities.</li>
      <li><strong>Support independence.</strong> Fade prompts · shift to natural cues · then thin reinforcement schedules · collect data · communicate progress or barriers to the BCBA.</li>
    </ol>
  </div>
  <div class="box warn"><span class="lbl">Watch out: you reinforce two things, not one</span>
    <p>In self-monitoring there are <em>two</em> behaviors in play: doing the thing, and <strong>recording</strong> the thing. The strategies list says it explicitly — <em>pair self-monitoring with reinforcement (not just the target behavior)</em> — and <em>shape accurate recording</em>. A learner who does the skill but never marks it hasn't learned self-monitoring.</p>
  </div>

  <h3 id="rbt26-tools">Tools and strategies</h3>
  <div class="tw"><table>
    <thead><tr><th>Tools to use</th><th>Strategies to try</th></tr></thead>
    <tbody>
      <tr><td><strong>Timers</strong> — visual or auditory</td><td><strong>Pair self-monitoring with reinforcement</strong> (not just the target behavior)</td></tr>
      <tr><td><strong>Visual schedules</strong></td><td><strong>Use prompting and fading</strong> (usually less intrusive is better)</td></tr>
      <tr><td><strong>Activity schedules</strong></td><td><strong>Shape accurate recording</strong></td></tr>
      <tr><td><strong>Token boards</strong></td><td><strong>Naturalistic teaching</strong></td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt26-gloss">RBT26 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Self-Monitoring</td><td>When the learner keeps track of their own behavior</td><td>Learner marks their own token board</td><td>They watch themselves</td><td>Self-management</td><td>RBT-collected data</td></tr>
      <tr><td>Visual Schedule</td><td>A set of pictures or words that shows the order of tasks or routines</td><td>Morning routine strip</td><td>Pictures in order</td><td>Activity schedule</td><td>—</td></tr>
      <tr><td>Activity Schedules</td><td>A sequence of tasks designed to be completed independently by the learner</td><td>A binder of tasks to work through</td><td>Do it yourself, in order</td><td>Visual schedule</td><td>—</td></tr>
      <tr><td>Token Board or Tallies</td><td>A visual system where learners earn tokens for showing target behaviors and record them</td><td>Learner adds their own star</td><td>They move the token</td><td>Token economy</td><td>—</td></tr>
      <tr><td>Timers &amp; Counters</td><td>Devices that signal when it's time to record behavior, or let the learner count how often they've shown a skill</td><td>Beep, then mark the sheet</td><td>It tells them when</td><td>MTS prompt</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT26 in one breath</span>
    <p><strong>Self-monitoring</strong> is the learner keeping track of their own behavior, taught to build <strong>independence, on-task behavior, new skills and reduced challenging behavior</strong>. Appropriate targets must be <strong>observable and measurable to the RBT <em>and</em> to the learner</strong>, and can be either <strong>skill acquisition</strong> or <strong>behavior reduction</strong>. Your role is three jobs: <strong>understand the plan</strong> (what's tracked, how, ask the BCBA if unclear), <strong>run the system</strong> (materials ready, prompt and reinforce <em>both the target behavior and the tracking</em>, watch accuracy), and <strong>support independence</strong> (fade prompts, shift to natural cues, thin reinforcement, collect data, report to the BCBA). The tools are <strong>timers, visual schedules, activity schedules and token boards</strong>, and the four strategies are <strong>pairing self-monitoring itself with reinforcement, prompting and fading, shaping accurate recording, and naturalistic teaching</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT26 exam checklist</span>
    <ul class="checklist">
      <li>Define self-monitoring and say what it builds.</li>
      <li>Give three considerations for choosing a self-monitoring goal.</li>
      <li>Explain why the operational definition must be clear to the learner too.</li>
      <li>List the RBT's three responsibilities and what sits under each.</li>
      <li>Explain why you reinforce the recording as well as the behavior.</li>
      <li>Name four tools and four strategies.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt27">
  <div class="plate"><span class="num" aria-hidden="true">27</span><p class="ttl">Social skills training &amp; peer-mediated intervention</p><p class="src">No study notes in the manual</p></div>

    <p>"The strategies you've learned" points back at <a href="#rbt23-strategies">RBT23</a>'s ten naturalistic teaching strategies — expectant looks, pregnant pauses, gentle sabotage, offering choices, reciprocal commenting — which are exactly the tools for capturing an unplanned social opportunity. A social skills assessment (<a href="#rbt13-formal">RBT13</a>) is how the targets get picked.</p>

<section class="lecture prose" id="rbt28">
  <div class="plate"><span class="num" aria-hidden="true">28</span><p class="ttl">Generalization and maintenance</p><p class="src">60-minute course · Defining and differentiating them · Types of generalization · Promoting maintenance · Collecting and analyzing data</p></div>

  <h3 id="rbt28-compare">Generalization vs maintenance</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Generalization</dt><dd>The transfer of learned behavior to <strong>new but similar situations or stimuli</strong>.</dd>
      <dt>Maintenance</dt><dd>The <strong>continued performance of a learned behavior over time after training has ended</strong>.</dd>
      <dt>Maintenance procedures</dt><dd>Strategies used to ensure a behavior continues after formal teaching stops — e.g. periodic reinforcement, practice sessions.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th></th><th>Generalization</th><th>Maintenance procedures</th></tr></thead>
    <tbody>
      <tr><td><strong>Goal</strong></td><td>Use skills in <strong>new contexts</strong></td><td>Use skill <strong>over time</strong></td></tr>
      <tr><td><strong>When?</strong></td><td><strong>During acquisition</strong></td><td><strong>After mastery</strong></td></tr>
      <tr><td><strong>Focus</strong></td><td>People, settings, stimuli</td><td>Longevity, independence</td></tr>
      <tr><td><strong>Examples</strong></td><td>Different toys or environments</td><td>Weekly skill probes</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: generalization is programmed <em>during</em> teaching</span>
    <p>The "When?" row is the one people get wrong. Generalization isn't something you bolt on after the skill is mastered — it happens <strong>during acquisition</strong>, which is why you vary stimuli and people <em>while</em> you teach. Maintenance is the one that comes <strong>after mastery</strong>. Space the two along a timeline: <em>generalization during, maintenance after.</em></p>
  </div>

  <h3 id="rbt28-types">Stimulus vs response generalization</h3>
  <div class="tw"><table>
    <thead><tr><th>Stimulus generalization</th><th>Response generalization</th></tr></thead>
    <tbody>
      <tr><td>The client gives the <strong>same response to different but similar stimuli</strong> — the client recognizes something new as being close enough to what they learned before.</td><td>The client uses a <strong>different response that still serves the same purpose</strong> or has the same effect.</td></tr>
      <tr><td>A client learns to label a picture of a golden retriever as "dog." Later they see a poodle and say "dog." Finally they see a cartoon dog and still say "dog."</td><td>A client learns to say "help please" to request assistance. Later they raise their hand or say "can you help me?" to get the same result.</td></tr>
      <tr><td></td><td>A client opens a bag of chips by ripping it one day, popping it the next, and finally using scissors.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: which one changes?</span>
    <p><strong>Stimulus</strong> generalization — the <em>stimulus</em> changes, the response stays the same. <strong>Response</strong> generalization — the <em>response</em> changes, the function stays the same. The word before "generalization" tells you what varies.</p>
  </div>

  <h3 id="rbt28-over">Overgeneralization</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <p>Applying a behavior or rule <strong>too broadly, leading to errors</strong>.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Overgeneralization can…</th><th>Because…</th></tr></thead>
    <tbody>
      <tr><td><strong>Limit skill precision</strong></td><td>It leads to errors, ineffective communication, or unsafe behaviors. Addressing it involves careful teaching, <strong>discrimination training</strong>, and consistent feedback to help the learner apply skills in the right contexts.</td></tr>
      <tr><td><strong>Lead to problem behavior</strong></td><td>The learner applies a response in situations where it's not appropriate or effective.</td></tr>
      <tr><td><strong>Interfere with independence</strong></td><td>Applying a skill in the wrong context or with the wrong cues makes it harder to navigate situations successfully alone.</td></tr>
      <tr><td><strong>Interfere with social communication</strong></td><td>Using language or social behaviors where they don't fit leads to misunderstandings or awkward interactions.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt28-promote">How RBTs help skills stick</h3>
  <div class="tw"><table>
    <thead><tr><th>To promote <strong>generalization</strong></th><th>To promote <strong>maintenance</strong></th></tr></thead>
    <tbody>
      <tr><td><strong>1. Varying stimuli</strong></td><td>Use <strong>natural reinforcers</strong></td></tr>
      <tr><td><strong>2. Varying people &amp; setting</strong></td><td><strong>Fade reinforcement</strong> over time</td></tr>
      <tr><td><strong>3. Programming common stimuli</strong></td><td><strong>Build fluency</strong></td></tr>
      <tr><td><strong>4. Teaching multiple exemplars</strong></td><td>Use <strong>varied and intermittent practice</strong></td></tr>
      <tr><td></td><td>Conduct <strong>maintenance probes</strong></td></tr>
      <tr><td></td><td><strong>Involve caregivers</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box def"><span class="lbl">Definition: the maintenance toolkit</span>
    <dl>
      <dt>Natural reinforcement</dt><dd>Reinforcement that occurs as a <strong>natural consequence</strong> of a behavior in everyday settings — e.g. saying "hello" and getting a smile.</dd>
      <dt>Fluency training</dt><dd>Practice designed to increase both <strong>accuracy and speed</strong> of a skill until it becomes automatic.</dd>
      <dt>Fading reinforcement</dt><dd>Gradually reducing the <strong>frequency or intensity</strong> of reinforcement to encourage independent behavior.</dd>
      <dt>Varied practice</dt><dd>Practicing a skill in <strong>different conditions</strong> to promote adaptability and generalization.</dd>
    </dl>
  </div>

  <h3 id="rbt28-tracking">Tracking progress</h3>
  <div class="tw"><table>
    <thead><tr><th>Question</th><th>Answer</th></tr></thead>
    <tbody>
      <tr><td><strong>Why is data important?</strong></td><td>Generalization and maintenance data help the team make important decisions. Are skills showing up in real life? Are they sticking over time? Your data shows whether a client is truly becoming more independent — or if the teaching plan needs adjusting.</td></tr>
      <tr><td><strong>When to collect it</strong></td><td><strong>Maintenance data is collected after a skill has been mastered.</strong> This may happen weekly or on a set rotation — like "Maintenance Mondays." You'll <strong>probe the skill without prompting</strong> and record whether the client still engages in it independently.</td></tr>
      <tr><td><strong>How to collect it accurately</strong></td><td>Always follow your BCBA's instructions — CentralReach or a paper sheet. Be specific and objective. Record exactly what you observed. <strong>Don't assume, fill in gaps, or change how the data is collected.</strong></td></tr>
      <tr><td><strong>What to look for</strong></td><td>For <strong>generalization</strong> data, look for <strong>consistency across different conditions</strong> — is the client showing the skill with different people and materials? For <strong>maintenance</strong> data, look for <strong>consistent success over time</strong>. <strong>If you see a downward trend or inconsistent performance, that's a sign to alert your supervisor.</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: maintenance probes are unprompted</span>
    <p>"Probe the skill <em>without prompting</em>" is the detail that makes maintenance data meaningful. A prompted probe tells you nothing about whether the skill maintained — it tells you the prompt still works.</p>
  </div>

  <h3 id="rbt28-gloss">RBT28 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Generalization</td><td>The transfer of learned behavior to new but similar situations or stimuli</td><td>Mands at home and school</td><td>Spreads out</td><td>Varied practice</td><td>Context-bound skill</td></tr>
      <tr><td>Maintenance</td><td>The continued performance of a learned behavior over time after training has ended</td><td>Still does it 3 months later</td><td>It lasts</td><td>Maintenance probe</td><td>Skill loss</td></tr>
      <tr><td>Maintenance Procedures</td><td>Strategies used to ensure a behavior continues after formal teaching stops</td><td>Periodic reinforcement, practice sessions</td><td>Keep it alive</td><td>Fading reinforcement</td><td>—</td></tr>
      <tr><td>Stimulus Generalization</td><td>A behavior occurs in the presence of stimuli similar to the original training stimulus</td><td>Poodle also called "dog"</td><td>The stimulus changes</td><td>Generalization</td><td>Response generalization</td></tr>
      <tr><td>Response Generalization</td><td>A learner produces different responses that serve the same function as the trained behavior</td><td>"Help please" or raising a hand</td><td>The response changes</td><td>Functionally equivalent</td><td>Stimulus generalization</td></tr>
      <tr><td>Overgeneralization</td><td>Applying a behavior or rule too broadly, leading to errors</td><td>All animals are "dog"</td><td>Too broad</td><td>—</td><td>Discrimination training</td></tr>
      <tr><td>Natural Reinforcement</td><td>Reinforcement occurring as a natural consequence of behavior in everyday settings</td><td>Saying "hello" and getting a smile</td><td>Real life pays it</td><td>NT reinforcement</td><td>Contrived reinforcer</td></tr>
      <tr><td>Fluency Training</td><td>Practice designed to increase both accuracy and speed of a skill until it becomes automatic</td><td>SAFMEDS</td><td>Fast and right</td><td>—</td><td>—</td></tr>
      <tr><td>Fading Reinforcement</td><td>Gradually reducing the frequency or intensity of reinforcement to encourage independent behavior</td><td>Rich → lean</td><td>Thin it out</td><td>Thinning</td><td>Continuous reinforcement</td></tr>
      <tr><td>Varied Practice</td><td>Practicing a skill in different conditions to promote adaptability and generalization</td><td>Different rooms, people, materials</td><td>Mix the conditions</td><td>Multiple exemplars</td><td>Massed identical practice</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT28 in one breath</span>
    <p><strong>Generalization</strong> is transferring a learned behavior to <em>new but similar</em> situations or stimuli and is programmed <strong>during acquisition</strong>; <strong>maintenance</strong> is continued performance <em>over time after training ends</em> and is worked on <strong>after mastery</strong>. <strong>Stimulus generalization</strong> means the same response to different but similar stimuli (poodle → "dog"); <strong>response generalization</strong> means different responses serving the same function ("help please" → raising a hand) — the word before "generalization" tells you what varies. <strong>Overgeneralization</strong> is applying a rule too broadly, which limits skill precision, can lead to problem behavior, interferes with independence and with social communication, and is addressed with <strong>discrimination training</strong>. RBTs promote generalization by <strong>varying stimuli, varying people and settings, programming common stimuli, and teaching multiple exemplars</strong>; they promote maintenance by using <strong>natural reinforcers, fading reinforcement, building fluency, varied and intermittent practice, maintenance probes, and involving caregivers</strong>. Maintenance data is taken after mastery, often on a weekly rotation, by probing the skill <strong>without prompting</strong> — and a <strong>downward trend or inconsistent performance is a signal to alert your supervisor</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT28 exam checklist</span>
    <ul class="checklist">
      <li>Define generalization and maintenance and complete the four-row comparison table.</li>
      <li>Say when generalization is programmed and when maintenance work begins.</li>
      <li>Define stimulus and response generalization with examples, and say which element varies in each.</li>
      <li>Define overgeneralization and name its four consequences.</li>
      <li>List the four ways RBTs promote generalization.</li>
      <li>List the six ways RBTs promote maintenance.</li>
      <li>Define natural reinforcement, fluency training, fading reinforcement, and varied practice.</li>
      <li>Say when and how maintenance data is collected, and why probes are unprompted.</li>
      <li>State what you look for in generalization data versus maintenance data, and when to alert your supervisor.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt30">
  <div class="plate"><span class="num" aria-hidden="true">30</span><p class="ttl">Common threats to procedural integrity</p><p class="src">30-minute course · Identifying barriers · Proactive strategies · Communication and problem-solving when concerns arise</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt22-integrity">RBT22</a> defined procedural integrity as doing what the program says, exactly as the BCBA wrote it. This module is the honest list of why that is hard, and what to do about each reason.</p>
  </div>

  <p>Nine common barriers, each with its own fix. The pattern across all of them is worth noticing before you read the list: <strong>almost every solution involves either preparation before the session or asking your supervisor</strong> — and none involves quietly changing the program.</p>

  <div class="tw"><table>
    <thead><tr><th>Barrier</th><th>What to do</th></tr></thead>
    <tbody>
      <tr><td><strong>"I'm not sure what to do with the protocol."</strong></td><td><strong>Before the session</strong>, ask for clarification, get a step-by-step visual or checklist, practice out loud, and use visual reminders during the session.</td></tr>
      <tr><td><strong>"I haven't practiced the skill enough."</strong></td><td>Ask your supervisor for <strong>hands-on practice</strong>, review video examples or modeling, <strong>role-play with a peer</strong>, and start with simpler versions of the skill.</td></tr>
      <tr><td><strong>"Over time, I start doing things differently."</strong></td><td>Check yourself <strong>weekly with a fidelity checklist</strong>, seek occasional observation and feedback, and compare your current practice to your training.</td></tr>
      <tr><td><strong>"This program seems unnecessary."</strong></td><td>Ask your BCBA for <strong>data on the plan's effectiveness</strong>, share your feedback respectfully, and <strong>trust the data rather than assumptions</strong>.</td></tr>
      <tr><td><strong>"I get mixed messages from different team members."</strong></td><td><strong>Go to the BCBA for clarification</strong>, take notes to confirm understanding, and use team communication tools to stay aligned.</td></tr>
      <tr><td><strong>"I don't always have what I need."</strong></td><td>Use a <strong>session prep checklist</strong>, keep a small <strong>"go bag"</strong> with common tools, and inform your BCBA or lead tech if materials run low.</td></tr>
      <tr><td><strong>"My client acts out and I panic on what to do."</strong></td><td><strong>Review the behavior plan before the session</strong>, use a <strong>quick-reference card</strong>, seek in-the-moment coaching from your supervisor, and <strong>debrief after incidents</strong>.</td></tr>
      <tr><td><strong>"Things change when I move to a different setting."</strong></td><td>Keep a <strong>portable copy</strong> of programs or plans, set up consistently each session, and practice generalizing skills across people and settings with your supervisor.</td></tr>
      <tr><td><strong>"There's a new staff member, or I switch clients a lot."</strong></td><td>Ask for a <strong>quick program walkthrough</strong>, focus on <strong>what you can do with fidelity</strong>, request a written plan if needed, and <strong>speak up about your comfort level</strong>.</td></tr>
    </tbody>
  </table></div>

  <div class="box warn"><span class="lbl">Watch out: the third barrier is the sneaky one</span>
    <p>"Over time, I start doing things differently" is <strong>procedural drift</strong>, and it's the only barrier on the list you won't notice happening. The others announce themselves — you feel unprepared, or the materials are missing. Drift feels like competence. That's exactly why the fix is an <em>external</em> check: a weekly fidelity checklist and periodic observation, not self-assessment.</p>
  </div>
  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>You think a program is pointless and the client seems bored by it. What are you allowed to do?</summary><div><p>Ask the BCBA for the <strong>data on the plan's effectiveness</strong>, share your observation <strong>respectfully</strong>, and <strong>trust the data rather than your assumptions</strong>. What you may not do is drop it, shorten it, or run it half-heartedly — that's outside your scope (<a href="#rbt01">RBT01</a>) and it corrupts the data the BCBA would use to agree with you.</p></div></details>
  </div>

  <div class="box proc"><span class="lbl">RBT30 in one breath</span>
    <p>Nine common threats to procedural integrity, each with a fix. <strong>Unclear protocol</strong> → ask before the session, get a visual or checklist, practice out loud. <strong>Not enough practice</strong> → request hands-on practice, video models, peer role-play, simpler versions first. <strong>Drift over time</strong> → weekly fidelity checklist, occasional observation and feedback, compare to your training. <strong>Program seems unnecessary</strong> → ask for the data, share feedback respectfully, trust data over assumptions. <strong>Mixed messages</strong> → go to the BCBA, take notes, use team communication tools. <strong>Missing materials</strong> → session prep checklist, a "go bag," tell your BCBA when supplies run low. <strong>Panic during challenging behavior</strong> → review the behavior plan beforehand, keep a quick-reference card, seek in-the-moment coaching, debrief afterward. <strong>New setting</strong> → portable copies of plans, consistent setup, practice generalizing with your supervisor. <strong>New staff or frequent client changes</strong> → ask for a walkthrough, focus on what you can do with fidelity, request a written plan, speak up about your comfort level. The common thread: <strong>prepare before, or ask your supervisor — never quietly change the program</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT30 exam checklist</span>
    <ul class="checklist">
      <li>Name at least three common barriers to procedural integrity and describe how each affects client progress.</li>
      <li>Give at least two proactive strategies for maintaining procedural integrity during sessions.</li>
      <li>Describe the right communication and problem-solving steps when an integrity concern arises.</li>
      <li>Explain what procedural drift is and why it needs an external check.</li>
      <li>Say what to do — and what not to do — when you think a program is unnecessary.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt32">
  <div class="plate"><span class="num" aria-hidden="true">32</span><p class="ttl">From foundation to function: the ABA roots of behavior reduction</p><p class="src">30-minute course · No study notes in the manual</p></div>
  <div class="box proc"><span class="lbl">No notes — here's what the manual says instead</span>
    <p><em>"There are no study notes for this course. This 30-minute training is a quick review of core concepts from earlier lessons and a preview of how they connect to the next section: Behavior Reduction."</em></p>
    <p><strong>Your challenge:</strong> keep studying and look for new ways to apply what you've learned.</p>
  </div>
  <div class="box exam"><span class="lbl">What to have solid before you continue</span>
    <p>Behavior reduction leans almost entirely on four earlier modules. Make sure you can do these cold: the <strong>four functions</strong> (<a href="#rbt04-function">RBT04</a>), <strong>positive and negative reinforcement</strong> (<a href="#rbt03-reinf">RBT03</a>), <strong>setting events, MOs, EOs and AOs</strong> (<a href="#rbt04-motivation">RBT04</a>), and the <strong>FBA process</strong> (<a href="#rbt15">RBT15</a>). Every strategy in RBT33–RBT38 is one of those four applied to a problem behavior.</p>
  </div>
</section>

<section class="lecture prose" id="rbt33">
  <div class="plate"><span class="num" aria-hidden="true">33</span><p class="ttl">Behavior intervention plans</p><p class="src">30-minute course · Key components of a BIP · How assessment informs planning · The RBT's role in implementation</p></div>

  <h3 id="rbt33-what">What a BIP is</h3>
  <div class="box def"><span class="lbl">Definition: behavior intervention plan</span>
    <p>A <strong>written plan designed to reduce problem behaviors and teach appropriate replacement behaviors</strong>. Each BIP is <strong>individualized to the client</strong> and ensures interventions are <strong>ethical, evidence-based, and consistent across team members</strong>.</p>
  </div>
  <p>The <strong>Functional Behavior Assessment (FBA)</strong> is used by the BCBA to identify the <strong>function</strong> of a behavior, which is then used to develop the BIP. <strong>Interventions used in the BIP will match the function of the behavior as identified in the FBA.</strong></p>
  <div class="box warn"><span class="lbl">The sentence that connects three modules</span>
    <p>FBA (<a href="#rbt15">RBT15</a>) → function (<a href="#rbt04-function">RBT04</a>) → function-matched intervention (RBT33). This is why identifying the function matters so much: <strong>the function selects the treatment.</strong> An escape-maintained behavior and an attention-maintained behavior with identical topography get different plans.</p>
  </div>

  <h3 id="rbt33-anatomy">The anatomy of a BIP</h3>
  <div class="tw"><table>
    <thead><tr><th>Component</th><th>What it contains</th></tr></thead>
    <tbody>
      <tr><td><strong>Operational definition</strong></td><td>A clear, measurable description of the target behavior. The <strong>function</strong> identifies why the behavior occurs — attention, escape, access to a tangible, or sensory stimulation.</td></tr>
      <tr><td><strong>Setting events &amp; immediate antecedents</strong></td><td>Any information highly specific to your client that is relevant and needs to be highlighted.</td></tr>
      <tr><td><strong>Progression of behaviors / precursors</strong></td><td>How interfering behavior may progress <strong>from least to most intense</strong>.</td></tr>
      <tr><td><strong>Function of behavior</strong></td><td>As identified from the FBA, the function targeted for each behavior. <strong>Clients can engage in the same behavior for multiple functions — pay close attention to this.</strong></td></tr>
      <tr><td><strong>Strategies to prevent interfering behavior</strong></td><td>The strategies to prevent the behaviors listed <strong>for each function</strong>, indicated for each behavior targeted for reduction.</td></tr>
      <tr><td><strong>Strategies to respond to interfering behavior (consequences)</strong></td><td>Each behavior for reduction and what strategies should be used <strong>in response</strong> to each.</td></tr>
      <tr><td><strong>Replacement behaviors</strong></td><td>The replacement behaviors for each behavior for reduction. <strong>We must teach our clients how to get their needs met in a safe and acceptable way. We cannot teach them what <em>not</em> to do only.</strong></td></tr>
      <tr><td><strong>Criteria to move to crisis plan</strong></td><td>Specific thresholds of behavior that may pose a <strong>risk of harm</strong> to the client or others. If met, staff should <strong>immediately contact the BCBA</strong> and implement the behavioral crisis plan as directed.</td></tr>
      <tr><td><strong>Behavioral crisis plan</strong></td><td>Where you request your BCBA's support on how to move forward if behaviors have escalated to crisis criteria. Includes <strong>topography-specific steps</strong> for each behavior for reduction, the criteria for <strong>returning to regular BIP procedures</strong>, and the <strong>session termination criteria</strong>.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: the precursor section is the useful one</span>
    <p>"Progression of behaviors / precursors" tells you what comes <em>before</em> the serious behavior. That's what makes prevention possible — and it maps directly onto <a href="#rbt39-stages">RBT39</a>'s stages, where <strong>precursor behavior</strong> is the level at which you can still turn a session around.</p>
  </div>

  <h3 id="rbt33-role">The RBT's role in implementing a BIP</h3>
  <p>It's important for RBTs to know their role because <strong>they are the ones working with the client every day</strong>. Knowing exactly what to do helps you follow the plan correctly, respond to behaviors safely, and collect accurate data so the client can make progress.</p>
  <ul>
    <li>You are responsible for <strong>implementing the BIP exactly as written</strong>. You will be <strong>trained by your BCBA on all procedures before implementation</strong>. <strong>Fidelity is critical</strong> to ensure interventions are effective and that data accurately reflect client progress.</li>
    <li>You <strong>collect data on target behaviors and replacement skills</strong>. Accurate data allows the BCBA to evaluate the plan and make adjustments; <strong>inconsistent or incomplete data can affect the accuracy of progress monitoring</strong>.</li>
    <li>If you are <strong>unsure about any step or notice a new behavior, communicate immediately with your BCBA</strong>. <strong>Never change the plan on your own.</strong> Collaboration ensures ethical and effective practice.</li>
  </ul>

  <h3 id="rbt33-gloss">RBT33 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Behavior Intervention Plan</td><td>A written plan designed to reduce problem behaviors and teach appropriate replacement behaviors</td><td>Individualized, from the FBA</td><td>The plan for behavior</td><td>SAP (for skills)</td><td>—</td></tr>
      <tr><td>Functional Behavior Assessment</td><td>An assessment identifying why a behavior occurs; examines antecedents, behaviors and consequences to understand what triggers and maintains it</td><td>Nine-step FBA</td><td>Finds the function</td><td>Functional assessment</td><td>—</td></tr>
      <tr><td>Operational Definition</td><td>A clear, specific, measurable description of a behavior so anyone observing can identify and record it the same way</td><td>"Both feet leave the chair"</td><td>Same for everyone</td><td>Target definition</td><td>Vague description</td></tr>
      <tr><td>Setting Events</td><td>Conditions or circumstances occurring before a behavior that make it more or less likely to happen</td><td>Poor sleep</td><td>Sets the stage</td><td>Motivating operation</td><td>Immediate antecedent</td></tr>
      <tr><td>Function of Behavior</td><td>The reason or purpose the behavior occurs — what the person is trying to get or avoid</td><td>Escape from demands</td><td>What it's for</td><td>—</td><td>Topography</td></tr>
      <tr><td>Replacement Behaviors</td><td>Appropriate, alternative behaviors that serve the same function as the challenging behavior but are more acceptable and effective</td><td>Handing a break card</td><td>Same need, better way</td><td>FERB</td><td>Challenging behavior</td></tr>
      <tr><td>Antecedent Strategies</td><td>What to do before maladaptive behavior occurs, to promote appropriate behavior</td><td>Premack, choices, NCR</td><td>Before it happens</td><td>Prevention</td><td>Consequence strategies</td></tr>
      <tr><td>Behavioral Crisis Plan</td><td>The section covering topography-specific steps once crisis criteria are met, return criteria, and session termination criteria</td><td>Called when thresholds are met</td><td>The emergency section</td><td>Crisis criteria</td><td>Regular BIP procedures</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT33 in one breath</span>
    <p>A <strong>behavior intervention plan</strong> is a written, individualized plan to <strong>reduce problem behavior and teach replacement behaviors</strong>, built from the <strong>FBA</strong> so that <strong>interventions match the function</strong>. Its components are the <strong>operational definition</strong>, <strong>setting events and immediate antecedents</strong>, <strong>progression of behaviors/precursors</strong> (least to most intense), the <strong>function</strong> (and a client can have <em>multiple</em> functions for one behavior), <strong>strategies to prevent</strong>, <strong>strategies to respond</strong>, <strong>replacement behaviors</strong> (because you cannot only teach what <em>not</em> to do), <strong>criteria to move to the crisis plan</strong>, and the <strong>behavioral crisis plan</strong> itself with topography-specific steps, return criteria and session termination criteria. Your role: <strong>implement it exactly as written after your BCBA has trained you, collect accurate data on target behaviors and replacement skills, and communicate immediately if you are unsure or see a new behavior — never change the plan on your own.</strong></p>
  </div>

  <div class="box exam"><span class="lbl">RBT33 exam checklist</span>
    <ul class="checklist">
      <li>Define a BIP and describe its purpose.</li>
      <li>Explain how the FBA informs the BIP, and what "function-matched" means.</li>
      <li>Name all nine components of a BIP and what each contains.</li>
      <li>Explain why replacement behaviors are required, not optional.</li>
      <li>State what the crisis criteria section does and what you do when criteria are met.</li>
      <li>Name the three things included in the behavioral crisis plan.</li>
      <li>Describe the RBT's three responsibilities in implementing a BIP.</li>
      <li>Say what you do if you are unsure of a step or notice a new behavior.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt34">
  <div class="plate"><span class="num" aria-hidden="true">34</span><p class="ttl">Prevention in practice: antecedent strategies</p><p class="src">60-minute course · Conceptual and procedural aspects of antecedent intervention · Implementing antecedent interventions</p></div>

  <div class="box def"><span class="lbl">Definition: antecedent intervention</span>
    <p>Strategies put in place <strong>before a challenging behavior occurs</strong>. They <strong>reduce the likelihood of problem behavior and increase appropriate behavior</strong>.</p>
  </div>
  <div class="box warn"><span class="lbl">Why this module comes before the consequence one</span>
    <p>Antecedent strategies are the <em>preventive</em> half of behavior reduction. <a href="#rbt35">RBT35</a> is the <em>reactive</em> half. Both matter, but preventing a behavior is always cheaper, safer and kinder than responding to one — which is why the BIP has a whole "strategies to prevent" section before it gets to "strategies to respond."</p>
  </div>

  <h3 id="rbt34-six">The six antecedent strategies</h3>
  <div class="tw"><table>
    <thead><tr><th>Strategy</th><th>Definition</th><th>Steps to implement</th></tr></thead>
    <tbody>
      <tr><td><strong>Premack Principle</strong> (Grandma's Law)</td><td>Access to a preferred activity or item is provided <strong>only after</strong> a client completes a less preferred activity or task. <em>First–then.</em></td><td>1. Identify the preferred item → 2. State the contingency ("first… then…") → 3. Present the less preferred task → 4. Provide the preferred item when the task is complete</td></tr>
      <tr><td><strong>Behavioral momentum</strong></td><td>Starting with a series of <strong>easy tasks</strong> — things the client is very likely to do — <strong>before presenting a more difficult or less preferred task</strong>.</td><td>1. Select several high-p tasks → 2. Deliver 2–3 high-p tasks in a row and reinforce → 3. Present the low-p task → 4. Provide great reinforcement for the low-p task</td></tr>
      <tr><td><strong>Choices</strong></td><td>Offering the client appropriate options.</td><td>1. Identify appropriate choices → 2. Present 2 or more clear options → 3. Wait for the client's response → 4. <strong>Honor the choice</strong></td></tr>
      <tr><td><strong>Pairing</strong></td><td>Associating <strong>yourself, your materials, and the learning environment</strong> with reinforcement.</td><td>See <a href="#rbt10-pairing">RBT10</a> — apply the same presession pairing strategies <strong>throughout the day</strong>.</td></tr>
      <tr><td><strong>Noncontingent reinforcement (NCR)</strong></td><td>Giving the client access to reinforcement <strong>on a fixed schedule — whether or not problem behavior occurs</strong>.</td><td>1. Ensure you have a <strong>functionally related</strong> reinforcer → 2. Deliver the reinforcer on schedule, non-contingently → 3. Keep reinforcement brief and consistent → 4. Continue the session and reinforce on schedule</td></tr>
      <tr><td><strong>Demand fading</strong></td><td><strong>Gradually increasing</strong> the amount, length, or difficulty of demands placed on a client over time.</td><td>1. Start small → 2. Reinforce success → 3. Gradually increase expectations → 4. Continue fading in demands until the client reaches target level</td></tr>
    </tbody>
  </table></div>
  <div class="box def"><span class="lbl">Definition: high-p and low-p</span>
    <dl>
      <dt>High-probability task (high-p)</dt><dd>Tasks the client <strong>almost always does without resistance</strong>.</dd>
      <dt>Low-probability task (low-p)</dt><dd>A <strong>harder or less preferred task</strong> the client is <strong>less likely to do without resistance</strong>.</dd>
    </dl>
  </div>
  <div class="box warn"><span class="lbl">Watch out: NCR is the counterintuitive one</span>
    <p>"Whether or not problem behavior occurs" sounds like you're rewarding the behavior. You aren't — you're <strong>removing the motivation for it</strong> by supplying the reinforcer for free, which makes it an <strong>AO</strong> (<a href="#rbt04-motivation">RBT04</a>). If attention is the function, giving plenty of attention on a timer means attention-seeking behavior no longer has a job to do. The key word is <strong>functionally related</strong>: NCR only works if you're delivering the <em>same</em> reinforcer that maintains the behavior.</p>
  </div>
