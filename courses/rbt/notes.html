    <ul class="checklist">
      <li>Define functional assessment and explain its importance.</li>
      <li>List the four functions in RBT15's wording, including that attention can be negative.</li>
      <li>Define and differentiate indirect assessment, descriptive assessment, and functional analysis.</li>
      <li>Explain the difference between a functional assessment and a functional analysis.</li>
      <li>Name three things RBTs do and three they do not do in functional assessment.</li>
      <li>List the nine steps of the FBA process and say which ones RBTs assist with.</li>
      <li>Identify the ABCs of a target behavior from a scenario.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt17">
  <div class="plate"><span class="num" aria-hidden="true">17</span><p class="ttl">Getting started with skill acquisition in ABA</p><p class="src">60-minute course · Gaining instructional control · Implementing discrimination training</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt10">RBT10</a>'s pairing and <a href="#rbt03-abc">RBT03</a>'s contingency. Discrimination training is where the antecedent half of the contingency becomes something you deliberately teach.</p>
  </div>

  <h3 id="rbt17-control">Instructional control</h3>
  <div class="box def"><span class="lbl">Definition: instructional control</span>
    <p>Occurs when a learner <strong>listens to and responds to your instructions because they've learned it leads to positive outcomes</strong>.</p>
  </div>
  <div class="box proc"><span class="lbl">Process: the 7 steps to instructional control</span>
    <p>Use these throughout <em>every</em> session to establish rapport and foster motivation and cooperation.</p>
    <ol>
      <li><strong>Control reinforcement.</strong> YOU hold the good stuff. Keep preferred items out of reach, don't give everything away for free, and use reinforcers to reward cooperation and learning.</li>
      <li><strong>Be a FUN person.</strong> Make sure they associate YOU with good stuff. Pair yourself with things they like, follow their lead, and don't be afraid to get silly.</li>
      <li><strong>Follow through.</strong> If a learner doesn't follow an instruction, prompt cooperation or help them request a break or assistance. <strong>Predictability builds trust.</strong></li>
      <li><strong>Do NOT reward challenging behavior.</strong> Focus on supporting the client while ensuring challenging behaviors do not lead to desired outcomes.</li>
      <li><strong>Say what you mean. Mean what you say.</strong> Use clear, simple language. Give firm, neutral instructions — <em>not questions</em>. Honor choices, and use an enthusiastic tone for reinforcement.</li>
      <li><strong>Teach clients that cooperation benefits them.</strong> Catch and reinforce every good response, especially early on. Help the learner see that cooperating with you is the key to good things.</li>
      <li><strong>Know priorities.</strong> Stay focused on what is most important for learning. Use preference assessments and choices to motivate them.</li>
    </ol>
  </div>
  <div class="box warn"><span class="lbl">Watch out: "instructions, not questions"</span>
    <p>Step 5 shows up again in <a href="#rbt22-steps">DTT step five</a> and in the <a href="#rbt22-integrity">procedural integrity</a> table: say <em>"Touch head,"</em> not <em>"Can you find your head?"</em> A question invites "no" as a legitimate answer and muddies what the SD actually is. Save the warm, enthusiastic tone for the <em>reinforcement</em>, and keep the instruction firm and neutral.</p>
  </div>

  <h3 id="rbt17-vocab">Discrimination training vocabulary</h3>
  <div class="box def"><span class="lbl">Definition: the four core terms</span>
    <dl>
      <dt>Discrimination training</dt><dd>A process by which we teach someone to <strong>tell the difference between two or more stimuli</strong> and respond appropriately to each.</dd>
      <dt>Discriminative stimulus (SD)</dt><dd>A signal that <strong>reinforcement IS available</strong> if a specific behavior occurs.</dd>
      <dt>S-delta</dt><dd>A stimulus that signals reinforcement is <strong>NOT available</strong>.</dd>
      <dt>Stimulus control</dt><dd>Occurs when a learner <strong>reliably responds in the presence of the SD, and not the S-delta</strong>.</dd>
    </dl>
  </div>
  <p><strong>Everyday behaviors are under stimulus control.</strong> The manual's examples:</p>
  <div class="tw"><table>
    <thead><tr><th>Behavior</th><th>SD</th><th>S-delta</th></tr></thead>
    <tbody>
      <tr><td>Stepping on the gas</td><td>Green light</td><td>Red light</td></tr>
      <tr><td>Answering the door</td><td>Knocking</td><td>No knocking</td></tr>
      <tr><td>Putting money in a machine</td><td>"Ready" light on</td><td>Out of Order sign</td></tr>
    </tbody>
  </table></div>
  <div class="box ex"><span class="lbl">Worked example: teaching "touch dog"</span>
    <p><strong>Target behavior:</strong> client touches the dog when told to "Touch dog."</p>
    <div class="tw"><table>
      <thead><tr><th></th><th>What's presented</th><th>What happens</th></tr></thead>
      <tbody>
        <tr><td><strong>SD</strong></td><td>"Touch dog" + image of dog</td><td>Child earns reinforcement for touching the dog</td></tr>
        <tr><td><strong>S-delta</strong></td><td>Image of cat</td><td>Client does NOT earn reinforcement for touching the cat</td></tr>
      </tbody>
    </table></div>
    <p>The behavior of touching the dog is <strong>under stimulus control</strong> when the learner consistently touches the dog in the presence of the SD <em>and does not touch the cat</em>. Both halves are required — responding correctly isn't stimulus control if they also respond to everything else.</p>
  </div>

  <h3 id="rbt17-phases">The five phases of discrimination training</h3>
  <p>Discrimination training occurs during the <strong>intervention, generalization, and maintenance</strong> phases of ABA treatment. The phases, in order:</p>
  <div class="tw"><table>
    <thead><tr><th class="num">#</th><th>Phase</th><th>Description</th><th>Example instruction</th></tr></thead>
    <tbody>
      <tr><td class="num">1</td><td><strong>Mass trials</strong></td><td>1 target SD, repeated over and over. <strong>No S-deltas, no distractors.</strong></td><td>"Touch dog."</td></tr>
      <tr><td class="num">2</td><td><strong>Simple discrimination</strong></td><td>Introduce <strong>one SD and one S-delta</strong>. Typically the SD and S-delta are <em>very different</em>.</td><td>"Touch dog."</td></tr>
      <tr><td class="num">3</td><td><strong>Complex discrimination</strong></td><td>Introduce <strong>multiple S-deltas</strong> and/or S-deltas <strong>with smaller differences</strong>.</td><td>"Touch dog."</td></tr>
      <tr><td class="num">4</td><td><strong>Conditional discrimination</strong></td><td>Learners respond to an SD <strong>based on a specific condition or context</strong>.</td><td>"Touch the <em>barking</em> dog."</td></tr>
      <tr><td class="num">5</td><td><strong>Generalization &amp; maintenance</strong></td><td>Learners respond to the SD in a <strong>variety of conditions, across time</strong>. Use a variety of pictures, objects, or even real dogs.</td><td>"Where is the dog?" / "Find the dog." / "Show me dog."</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt17-steps">Implementing discrimination training</h3>
  <div class="box proc"><span class="lbl">Process: the 10 steps</span>
    <ol>
      <li><strong>Review the SAP.</strong> Find out the SD and S-deltas, the target response, and prompting and reinforcement strategies.</li>
      <li><strong>Set up the array (if needed).</strong> Arrange the target SD and one or more S-deltas; make sure materials align with the SAP; lay them out clearly so the learner can easily scan the options.</li>
      <li><strong>Present the SD.</strong> Use simple, clear, consistent wording as written in the SAP. <strong>Make sure you have the learner's attention first</strong>, use a firm neutral tone, and avoid extra words or phrasing the instruction as a question.</li>
      <li><strong>Prompt (if needed).</strong> Prompt if the learner is likely to answer incorrectly — typically when teaching a brand-new skill, when they've recently struggled, or when it's been a while since they were successful.</li>
      <li><strong>Observe the learner's behavior.</strong> Give about <strong>3–5 seconds</strong> after the SD and any prompt. Watch for <em>any</em> response, not just correct ones, and <strong>avoid giving unintentional cues</strong> like eye gaze or subtle gestures.</li>
      <li><strong>Reinforce correct responses</strong> within <strong>1–2 seconds</strong>, <em>including prompted responses</em>. Use high-quality, varied reinforcers and <strong>save the best ones for independent responses</strong>. Pair with specific praise and rotate items to avoid satiation.</li>
      <li><strong>Do NOT reinforce incorrect responses.</strong> Withhold reinforcement and remain neutral — no emotional reactions or negative language like "no" or "that's wrong." Say <em>"Let's try again"</em> and repeat the trial <strong>with a prompt</strong> to guide success.</li>
      <li><strong>Record data</strong> immediately after each trial. Note whether the response was correct, whether a prompt was used, and any relevant behaviors or context.</li>
      <li><strong>Intermix targets.</strong> Mix mastered skills with newer or harder targets to keep the learner motivated, reduce frustration, and encourage consistent responding.</li>
      <li><strong>Rotate stimuli.</strong> <strong>Random rotation</strong> means changing stimulus positions across trials so the learner focuses on the correct item, <em>not its location</em>. Rotate between left, right and center, and vary the order to avoid creating patterns.</li>
    </ol>
  </div>
  <div class="box warn"><span class="lbl">Watch out: two numbers worth memorising</span>
    <p><strong>3–5 seconds</strong> to wait for a response. <strong>1–2 seconds</strong> to deliver reinforcement. They are easy to swap and both get tested. And note the asymmetry in step 6: you reinforce <em>prompted</em> responses too, but you <strong>save the best reinforcers for independent ones</strong> — that gradient is what pulls the learner toward independence.</p>
  </div>

  <h3 id="rbt17-flags">Green flags and red flags</h3>
  <div class="tw"><table>
    <thead><tr><th>🟢 Green flags — keep doing what's working</th><th>🔴 Red flags — check the SAP, record accurate data, contact the BCBA</th></tr></thead>
    <tbody>
      <tr><td><strong>Stimulus control is established</strong></td><td><strong>Overselectivity</strong> — the learner focuses on only one specific feature of a stimulus and fails to respond appropriately when that feature changes</td></tr>
      <tr><td><strong>Generalization occurs</strong></td><td><strong>Overgeneralization</strong> — the learner responds the same way to different stimuli that are not appropriate to group together</td></tr>
      <tr><td><strong>Maintenance occurs</strong></td><td><strong>Scrolling</strong> — the learner gives multiple incorrect or random responses in quick succession before or instead of responding correctly</td></tr>
      <tr><td></td><td><strong>Prompt dependency</strong> — the learner consistently waits for a prompt before responding, even when they might know the answer</td></tr>
      <tr><td></td><td><strong>Side bias</strong> — the learner consistently selects one side of an array (e.g. left or right) regardless of the SD</td></tr>
    </tbody>
  </table></div>
  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>A learner always picks the card on the right, whatever you ask for. Which red flag, and which step of the procedure addresses it?</summary><div><p><strong>Side bias.</strong> Step 10, <strong>random rotation</strong> — changing stimulus positions across trials so the learner attends to the item rather than its location.</p></div></details>
    <details><summary>A learner labels every four-legged animal "dog." Overselectivity or overgeneralization?</summary><div><p><strong>Overgeneralization</strong> — responding the same way to different stimuli that shouldn't be grouped. <em>Overselectivity</em> is the opposite failure: attending to too narrow a feature, so a change in that one feature breaks the response (e.g. they only identify <em>their</em> brown dog photo and miss every other dog).</p></div></details>
  </div>

  <h3 id="rbt17-gloss">RBT17 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Instructional Control</td><td>When a learner listens to and responds to your instructions because they've learned it leads to positive outcomes</td><td>7-step process</td><td>They follow because it pays</td><td>Rapport</td><td>Noncompliance</td></tr>
      <tr><td>Discrimination Training</td><td>Teaching someone to tell the difference between two or more stimuli and respond appropriately to each</td><td>Dog vs cat</td><td>Tell them apart</td><td>Stimulus control</td><td>—</td></tr>
      <tr><td>Discriminative Stimulus (SD)</td><td>A signal that reinforcement IS available if a specific behavior occurs</td><td>Green light</td><td>S-"Do"</td><td>Cue</td><td>S-delta</td></tr>
      <tr><td>S-Delta</td><td>A stimulus that signals reinforcement is NOT available</td><td>Red light</td><td>S-"Don't"</td><td>Distractor</td><td>SD</td></tr>
      <tr><td>Stimulus Control</td><td>When a learner reliably responds in the presence of the SD, and not the S-delta</td><td>Touches dog, not cat</td><td>The cue controls it</td><td>Discrimination</td><td>Overgeneralization</td></tr>
      <tr><td>Mass Trial</td><td>A phase of discrimination training where one target is repeated over and over with no S-delta</td><td>"Touch dog" ×10, dog only</td><td>Mass = one, many times</td><td>Phase 1</td><td>Complex discrimination</td></tr>
      <tr><td>Simple Discrimination</td><td>A phase where the learner is presented with one SD and one S-delta, typically very different</td><td>Dog vs cat</td><td>Two, very different</td><td>Phase 2</td><td>Complex discrimination</td></tr>
      <tr><td>Complex Discrimination</td><td>A phase with one SD and several S-deltas and/or stimuli similar to each other</td><td>Dog among 4 animals</td><td>More and harder</td><td>Phase 3</td><td>Simple discrimination</td></tr>
      <tr><td>Conditional Discrimination</td><td>A phase requiring the learner to respond to a stimulus based on a specific condition</td><td>"Touch the barking dog"</td><td>Depends on context</td><td>Phase 4</td><td>Simple discrimination</td></tr>
      <tr><td>Random Rotation</td><td>Changing the position of stimuli during discrimination training to prevent side bias</td><td>Left, center, right</td><td>Move it around</td><td>Counterbalancing</td><td>Fixed position</td></tr>
      <tr><td>Intermixing / Interspersing</td><td>Interchanging easy and hard tasks during discrimination training</td><td>Mastered + new targets</td><td>Mix it up</td><td>Behavioral momentum</td><td>Massed hard trials</td></tr>
      <tr><td>Overselectivity</td><td>The learner focuses on only one specific feature of a stimulus and fails to respond when that feature changes</td><td>Only knows the brown dog</td><td>Too narrow</td><td>Stimulus overselectivity</td><td>Overgeneralization</td></tr>
      <tr><td>Overgeneralization</td><td>The learner responds the same way to different stimuli that are not appropriate to group together</td><td>All animals are "dog"</td><td>Too broad</td><td>—</td><td>Overselectivity</td></tr>
      <tr><td>Scrolling</td><td>The learner gives multiple incorrect or random responses in quick succession before or instead of responding correctly</td><td>"Cat-dog-bird-dog?"</td><td>Scrolls through answers</td><td>Guessing</td><td>Discriminated response</td></tr>
      <tr><td>Prompt Dependent</td><td>The learner consistently waits for a prompt before responding, even when they might know the answer</td><td>Freezes until you point</td><td>Waits for help</td><td>—</td><td>Independent responding</td></tr>
      <tr><td>Side Bias</td><td>The learner consistently selects one side of an array regardless of the SD</td><td>Always picks the right card</td><td>Always the same side</td><td>Position bias</td><td>Random rotation</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT17 in one breath</span>
    <p><strong>Instructional control</strong> is when a learner responds to your instructions <em>because they've learned it leads to good outcomes</em>, built with seven steps: <strong>control reinforcement, be a fun person, follow through, don't reward challenging behavior, say what you mean (firm neutral instructions, not questions), teach that cooperation benefits them, and know priorities</strong>. <strong>Discrimination training</strong> teaches a learner to tell stimuli apart: the <strong>SD</strong> signals reinforcement <em>is</em> available, the <strong>S-delta</strong> signals it is <em>not</em>, and <strong>stimulus control</strong> exists when the learner responds to the SD <em>and not</em> the S-delta. It runs through five phases — <strong>mass trials</strong> (one SD, no distractors), <strong>simple</strong> (one very different S-delta), <strong>complex</strong> (several or similar S-deltas), <strong>conditional</strong> (respond based on context) and <strong>generalization &amp; maintenance</strong>. The ten implementation steps centre on: review the SAP, set the array, present a clear SD, prompt if an error is likely, wait <strong>3–5 seconds</strong>, reinforce correct responses within <strong>1–2 seconds</strong> (including prompted ones, best reinforcers saved for independent), stay neutral and re-run with a prompt after errors, record immediately, <strong>intermix</strong> easy and hard targets, and <strong>randomly rotate</strong> stimulus positions. Green flags are stimulus control, generalization and maintenance; red flags are <strong>overselectivity, overgeneralization, scrolling, prompt dependency and side bias</strong>.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT17 exam checklist</span>
    <ul class="checklist">
      <li>Define instructional control and list the 7 steps to gaining it.</li>
      <li>Explain why instructions should not be phrased as questions.</li>
      <li>Define discrimination training, SD, S-delta, and stimulus control.</li>
      <li>Give three everyday examples of stimulus control with their SD and S-delta.</li>
      <li>List the five phases of discrimination training in order and define each.</li>
      <li>Walk through the 10 steps of implementing discrimination training.</li>
      <li>State the wait time after the SD and the time to reinforce a correct response.</li>
      <li>Explain what to do after an incorrect response, word for word.</li>
      <li>Name the 3 green flags and the 5 red flags, and define each red flag.</li>
      <li>Tell overselectivity from overgeneralization.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt18">
  <div class="plate"><span class="num" aria-hidden="true">18</span><p class="ttl">Prompting and errorless learning</p><p class="src">60-minute course · Introduction to prompting · Introduction to fading · Errorless learning procedures · Factors to consider</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt17">RBT17</a> (step 4 was "prompt if needed" — this is that step in full) and <a href="#rbt04-motivation">RBT04</a>'s MOs, which decide how much prompting you need moment to moment.</p>
  </div>

  <h3 id="rbt18-prompting">Prompting vs error correction</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Prompting</dt><dd>Providing extra help <strong>before the behavior occurs</strong> to increase the likelihood that a learner will respond correctly in the presence of an SD.</dd>
      <dt>Error correction</dt><dd>Occurs <strong>after a mistake</strong>, to help the learner learn the correct response.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Prompting</th><th>Error correction</th></tr></thead>
    <tbody>
      <tr><td>Happens <strong>BEFORE</strong> the learner responds, to help them succeed</td><td>Happens <strong>AFTER</strong> a mistake, to help them learn the right response</td></tr>
      <tr><td>"Touch your nose" + <strong>prompt</strong> → reinforcement is delivered</td><td>"Touch your nose" (<strong>no prompt</strong>) → error correction is provided</td></tr>
      <tr><td>Increases the likelihood of a correct response, allowing children to <strong>learn through reinforcement</strong></td><td>Without prompts, children might make mistakes, <strong>which is frustrating</strong></td></tr>
    </tbody>
  </table></div>
  <p>Prompts are used when <strong>teaching a new skill</strong>, when <strong>the learner is struggling to respond correctly</strong>, or when they <strong>just need a little guidance to be successful</strong>. They build skills, boost confidence, and support learning by helping prevent mistakes.</p>

  <h3 id="rbt18-hierarchy">The prompting hierarchy and fading</h3>
  <div class="box def"><span class="lbl">Definition: fading</span>
    <p>The <strong>systematic reduction of prompts</strong> used during teaching, with the goal of helping the learner <strong>become more independent</strong>.</p>
    <p>We fade because <em>the goal in ABA therapy is always independence</em>. If we keep giving the same prompt every time, the learner may start relying on it — that is <strong>prompt dependency</strong>.</p>
  </div>
  <p>The <strong>prompting hierarchy</strong> is a way to think about how much help a prompt gives, from most intrusive to least:</p>
  <div class="tw"><table>
    <thead><tr><th>Level</th><th>Prompt</th><th>Definition</th></tr></thead>
    <tbody>
      <tr><td rowspan="2"><strong>Less intrusive</strong> ↑</td><td><strong>Independence</strong></td><td>No prompt at all — the goal.</td></tr>
      <tr><td><strong>Visual</strong></td><td>RBT shows a picture, symbol, or written cue to evoke the correct response.</td></tr>
      <tr><td></td><td><strong>Verbal</strong></td><td>RBT says the answer (or part of it), or gives a verbal hint.</td></tr>
      <tr><td></td><td><strong>Gestural</strong></td><td>RBT points, motions towards, or nods/glances at the correct response.</td></tr>
      <tr><td></td><td><strong>Model</strong></td><td>RBT demonstrates the correct response for the learner.</td></tr>
      <tr><td rowspan="2"><strong>More intrusive</strong> ↓</td><td><strong>Partial physical</strong></td><td>RBT gently touches or guides a learner's body part to help evoke the correct response.</td></tr>
      <tr><td><strong>Full physical</strong></td><td>RBT uses <strong>hand-over-hand guidance</strong> to help the learner respond correctly.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: the hierarchy is not a script</span>
    <p>The manual is explicit: <em>"These aren't steps you always follow in order — the type of prompt you use depends on the skill and the learner."</em> And: <em>"You don't have to jump to a whole new prompt type to fade. You can make smaller adjustments to the prompt type you're already using."</em> Fading a full verbal prompt to a partial one is fading, even though you never changed category.</p>
  </div>

  <h3 id="rbt18-fading">The four fading procedures</h3>
  <div class="tw"><table>
    <thead><tr><th>Procedure</th><th>Definition</th><th>Example</th><th>Use it when…</th></tr></thead>
    <tbody>
      <tr><td><strong>Most-to-least (MTL)</strong></td><td>Begin with the <strong>most intrusive</strong> level of support and reduce it gradually over time as the learner shows success.</td><td>Teaching a child to put on a jacket: 1. full physical guidance → 2. partial physical → 3. a gesture → 4. just the instruction</td><td>You're teaching a <strong>brand-new skill and want to avoid errors</strong>.</td></tr>
      <tr><td><strong>Least-to-most (LTM)</strong></td><td><strong>Start with no help</strong> — give the instruction and wait. Increase the level of prompting <em>only if</em> the learner needs it.</td><td>"Clap your hands." 1. Wait a few seconds. 2. If no response, gesture or model. 3. If still no response, use partial physical assistance.</td><td>The learner has <strong>some familiarity</strong> with the skill and might not need much help.</td></tr>
      <tr><td><strong>Time delay</strong></td><td>Fade prompts by waiting a predetermined amount of time before providing a prompt.</td><td>"What's 2 + 2?" 1. Wait 3 seconds and say "Four." 2. Gradually increase the delay as the learner is successful.</td><td>You want to <strong>reduce prompt dependency</strong>.</td></tr>
      <tr><td><strong>Graduated guidance</strong></td><td>Use physical prompts; fade by adjusting the level of support <strong>moment by moment based on the learner's performance</strong>.</td><td>Tooth brushing: 1. full hand-over-hand → 2. as the learner takes control, shift to light touch → 3. step back when they do it on their own → 4. provide increased assistance if they struggle</td><td>You're teaching <strong>motor sequences or self-help routines</strong> that involve multiple steps.</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: two kinds of time delay</span>
    <p><strong>Constant time delay</strong> — always wait the <em>same</em> amount of time before prompting (e.g. 3 seconds). <strong>Progressive time delay</strong> — <em>gradually increase</em> the time between the SD and the prompt (e.g. 0 s, 3 s, 5 s). Both are "time delay"; the exam will ask which is which.</p>
    <p>And the distinction that matters most: <strong>graduated guidance fades within a single trial, moment to moment</strong>, while MTL fades <em>across</em> trials over time. That's why graduated guidance suits multi-step motor routines.</p>
  </div>

  <h3 id="rbt18-errorless">Errorless learning</h3>
  <div class="box def"><span class="lbl">Definition: errorless learning</span>
    <p>A teaching strategy where we <strong>prevent mistakes before they happen</strong> by using prompts <strong>immediately after giving an instruction</strong>. It combines prompting and fading into one smooth teaching process, and is <strong>almost always done using a MTL prompting procedure</strong>.</p>
  </div>
  <div class="box proc"><span class="lbl">Process: the 5 steps to errorless learning</span>
    <ol>
      <li><strong>Present the SD.</strong> Provide a clear instruction.</li>
      <li><strong>Immediately prompt.</strong> Provide the <em>least intrusive prompt necessary to ensure success</em>. When first introducing a new target, this is often a full physical prompt.</li>
      <li><strong>Reinforce correct responses.</strong> Praise, tokens, toys etc. following correct responses — <em>even if they are prompted</em>. Save the best reinforcers for more independent responses.</li>
      <li><strong>Fade the prompt.</strong> Gradually reduce the intrusiveness as the learner is successful — e.g. move from physical prompts to a model prompt.</li>
      <li><strong>Intersperse easy tasks.</strong> Mix in mastered or simple tasks to keep momentum and motivation high.</li>
    </ol>
  </div>

  <h3 id="rbt18-factors">Factors influencing prompting and fading</h3>
  <ul>
    <li><strong>Setting events and MOs.</strong> Increased motivation typically means you can use <em>less</em> intrusive prompts.</li>
    <li><strong>The environment.</strong> If it's noisy or distracting, you may need <em>more</em> intrusive prompts.</li>
    <li><strong>Task difficulty.</strong> Maintenance targets typically need little to no prompting; newer targets should have more intrusive prompts.</li>
  </ul>
  <div class="box ex"><span class="lbl">Worked example: teaching a learner to mand for "ball"</span>
    <div class="tw"><table>
      <thead><tr><th>Setting event</th><th>Motivating operation</th><th>Environment</th><th>Task difficulty</th><th>Prompting level</th></tr></thead>
      <tbody>
        <tr><td>N/A</td><td>Loves the ball!</td><td>Calm</td><td>Easy / known</td><td>Gesture · partial verbal · <strong>no prompt</strong></td></tr>
        <tr><td>Tired</td><td>Not interested in the ball right now</td><td>Distracting; other toys more accessible</td><td>Hard / unknown</td><td><strong>Full verbal prompt</strong> (or pick a different activity)</td></tr>
      </tbody>
    </table></div>
    <p>The closing line is the one to take into session: <strong>prompting decisions should change throughout the session — moment to moment — based on the learner's performance and what's happening around them.</strong></p>
  </div>

  <h3 id="rbt18-gloss">RBT18 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Prompting</td><td>Providing extra help before the behavior occurs to increase the likelihood of a correct response in the presence of an SD</td><td>Pointing at the right card</td><td>Help first</td><td>Cue</td><td>Error correction</td></tr>
      <tr><td>Error Correction</td><td>Occurs after a mistake, to help the learner learn the correct response</td><td>"Let's try again" + prompt</td><td>Help after</td><td>Transfer trial</td><td>Prompting</td></tr>
      <tr><td>Fading</td><td>The systematic reduction of prompts used during teaching, to help the learner become more independent</td><td>Full physical → model</td><td>Fade it out</td><td>Thinning</td><td>Prompt dependency</td></tr>
      <tr><td>Prompting Hierarchy</td><td>A way to think about how much help a prompt gives (most to least intrusive) and how it might be faded</td><td>Full physical → independence</td><td>A ladder of help</td><td>—</td><td>—</td></tr>
      <tr><td>Full Physical Prompt</td><td>Hand-over-hand guidance to help the learner respond correctly</td><td>Guiding both hands</td><td>Most intrusive</td><td>Partial physical</td><td>Independence</td></tr>
      <tr><td>Partial Physical Prompt</td><td>Gently touching or guiding a learner's body part to evoke the correct response</td><td>A tap on the elbow</td><td>A light touch</td><td>Full physical</td><td>Gestural</td></tr>
      <tr><td>Model Prompt</td><td>Demonstrating the correct response for the learner</td><td>You clap, then they clap</td><td>Show them</td><td>Imitation</td><td>Verbal prompt</td></tr>
      <tr><td>Gestural Prompt</td><td>Pointing, motioning towards, or nodding/glancing at the correct response</td><td>Pointing at the card</td><td>A gesture</td><td>Position prompt</td><td>Model prompt</td></tr>
      <tr><td>Verbal Prompt</td><td>Saying the answer or part of the answer, or giving a verbal hint</td><td>"Say 'ball'"</td><td>Tell them</td><td>Echoic prompt</td><td>Gestural prompt</td></tr>
      <tr><td>Visual Prompt</td><td>Showing a picture, symbol, or written cue to evoke the correct response</td><td>A picture schedule</td><td>Show a picture</td><td>Stimulus prompt</td><td>—</td></tr>
      <tr><td>Most-to-Least Prompting (MTL)</td><td>Begin with the most intrusive support and reduce gradually over time as the learner succeeds</td><td>Jacket: full physical → instruction</td><td>Start big, shrink</td><td>Errorless learning</td><td>Least-to-most</td></tr>
      <tr><td>Least-to-Most Prompting (LTM)</td><td>Start with no help; increase prompting only if the learner needs it</td><td>Wait, then gesture, then partial physical</td><td>Start small, grow</td><td>—</td><td>Most-to-least</td></tr>
      <tr><td>Time Delay</td><td>Fading prompts by waiting a predetermined amount of time before providing a prompt</td><td>Wait 3 s, then say "Four"</td><td>Pause before helping</td><td>Constant/progressive delay</td><td>Immediate prompt</td></tr>
      <tr><td>Constant Time Delay</td><td>Always wait the same amount of time before providing a prompt</td><td>Always 3 seconds</td><td>Same wait each time</td><td>Progressive time delay</td><td>Progressive time delay</td></tr>
      <tr><td>Progressive Time Delay</td><td>Gradually increase the amount of time between the SD and the prompt</td><td>0 s, 3 s, 5 s</td><td>Wait grows</td><td>Constant time delay</td><td>Constant time delay</td></tr>
      <tr><td>Graduated Guidance</td><td>Use physical prompts, fading by adjusting support moment by moment based on performance</td><td>Tooth brushing</td><td>Hands follow, then lift</td><td>Most-to-least</td><td>—</td></tr>
      <tr><td>Errorless Learning</td><td>Preventing mistakes before they happen by prompting immediately after the instruction</td><td>SD + immediate prompt</td><td>No errors allowed</td><td>Most-to-least</td><td>Trial and error</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT18 in one breath</span>
    <p><strong>Prompting</strong> is extra help given <em>before</em> the response to make it correct; <strong>error correction</strong> comes <em>after</em> a mistake. <strong>Fading</strong> is the systematic reduction of prompts, because the goal is always independence and constant prompting produces <strong>prompt dependency</strong>. The <strong>prompting hierarchy</strong> runs from most to least intrusive — <strong>full physical, partial physical, model, gestural, verbal, visual, independence</strong> — but it is <em>not a fixed order</em>, and you can fade within a prompt type rather than jumping to a new one. Four fading procedures: <strong>most-to-least</strong> (start most intrusive, for brand-new skills where you want no errors), <strong>least-to-most</strong> (start with nothing and add only if needed, for partly familiar skills), <strong>time delay</strong> (wait a set time before prompting — <strong>constant</strong> keeps the same wait, <strong>progressive</strong> lengthens it — best for reducing prompt dependency) and <strong>graduated guidance</strong> (physical prompts adjusted moment by moment within a trial, for motor and self-help routines). <strong>Errorless learning</strong> combines prompting and fading using MTL, in five steps: <strong>present the SD, immediately prompt, reinforce correct responses (even prompted ones), fade the prompt, intersperse easy tasks</strong>. How much to prompt depends on <strong>MOs and setting events, the environment, and task difficulty</strong> — and changes moment to moment.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT18 exam checklist</span>
    <ul class="checklist">
      <li>Define prompting and error correction, and say when each happens.</li>
      <li>Say when prompts are used, and three benefits of prompting.</li>
      <li>Define fading and prompt dependency, and explain why we fade.</li>
      <li>Order the prompting hierarchy from most to least intrusive.</li>
      <li>Explain why the hierarchy isn't followed in strict order.</li>
      <li>Define MTL, LTM, time delay, and graduated guidance, with an example and a "use it when" for each.</li>
      <li>Distinguish constant from progressive time delay.</li>
      <li>Define errorless learning and list its 5 steps.</li>
      <li>Name three factors that influence prompting level and say which way each pushes it.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt19">
  <div class="plate"><span class="num" aria-hidden="true">19</span><p class="ttl">Using and fading stimulus prompts</p><p class="src">30-minute course · Conceptual and procedural aspects of stimulus prompts and fading · Implementing with appropriate fading procedures</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt18">RBT18</a>. That module covered prompting in general; RBT19 and <a href="#rbt20">RBT20</a> split prompts into two families. <strong>Stimulus prompts change the materials. Response prompts change what you do to the learner.</strong> That one sentence is the difference between the two modules.</p>
  </div>

  <div class="box def"><span class="lbl">Definition: stimulus prompt</span>
    <p>Something we <strong>add to or modify in the environment — usually the materials</strong> — to help the learner respond correctly to the SD.</p>
  </div>

  <div class="tw"><table>
    <thead><tr><th>Stimulus prompt</th><th>Definition</th><th>Examples</th></tr></thead>
    <tbody>
      <tr><td><strong>Gesture prompt</strong></td><td>The RBT makes a <strong>movement that draws attention</strong> to the correct response option.</td><td>Point · Glance · Hover hand · Tap · Tilt head</td></tr>
      <tr><td><strong>Position prompt</strong></td><td>Placing the correct item in a <strong>location that makes it easier to select</strong>.</td><td>Place the correct stimulus closest to the learner · right in the center · in front of the others</td></tr>
      <tr><td><strong>Redundancy prompt</strong></td><td><strong>Changes part of the correct stimulus</strong> to make it stand out from the others.</td><td>Commonly manipulated features: <strong>color · size · shape/bolding · auditory emphasis</strong> — e.g. "<strong>BOUNCE</strong> the ball," "<strong>TOUCH</strong> the ball," "<strong>ROLL</strong> the ball"</td></tr>
      <tr><td><strong>Visual prompt</strong></td><td>Any <strong>added image, symbol, icon, or text</strong> that helps the learner know what to do.</td><td>A green checkmark and illustration next to the correct job · a toileting visual schedule (pull pants down, sit, wipe, flush) · labels on sorting bins · a star on the correct card</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: position prompt is how side bias gets built</span>
    <p>A position prompt is deliberate and faded. The <strong>side bias</strong> from <a href="#rbt17-flags">RBT17</a> is the accidental version — the learner picks a location because you kept putting the right answer there. Same mechanism; the difference is whether you planned it and whether you faded it. That's why <strong>random rotation</strong> matters so much once the position prompt is gone.</p>
  </div>

  <h3 id="rbt19-fading">Fading each stimulus prompt</h3>
  <div class="tw"><table>
    <thead><tr><th>Prompt</th><th>Most-to-least (errorless)</th><th>Least-to-most</th><th>Time delay</th></tr></thead>
    <tbody>
      <tr><td><strong>Gesture</strong></td><td>Start with a clear, obvious gesture prompt and gradually make it <strong>less noticeable</strong>.</td><td>Start with no prompts and only add a gesture if needed — increasing intensity as necessary.</td><td>Systematically increase the time between the SD and the gesture.</td></tr>
      <tr><td><strong>Position</strong></td><td>Start with the correct item clearly emphasized by its position, then gradually make placement more neutral by <strong>moving the distractors closer</strong> to the correct item.</td><td>Start by placing all items <strong>equally spaced</strong>. If the learner doesn't respond correctly, make a small change like moving the correct item a little closer, and keep adjusting if they still need help.</td><td>—</td></tr>
      <tr><td><strong>Redundancy</strong></td><td>Start with a strong redundancy and fade by gradually <strong>reducing the salience</strong> — the correct item becomes less different, and by the final trial <strong>all items look the same</strong>.</td><td>Start with <strong>no added cue at all</strong>. If the learner struggles, add a slight redundancy prompt and increase its intensity (making the correct item bold or brighter). Once successful, fade it in future trials.</td><td>—</td></tr>
      <tr><td><strong>Visual</strong></td><td>Start with a strong visual prompt and gradually reduce its <strong>size, clarity, visibility</strong>.</td><td>Start with no prompts and only add a visual cue if needed.</td><td>Systematically increase the time between the SD and the presentation of the visual prompt.</td></tr>
    </tbody>
  </table></div>
  <div class="box exam"><span class="lbl">Check yourself</span>
    <details><summary>What does "fully faded" look like for a position prompt and for a redundancy prompt?</summary><div><p><strong>Position:</strong> all items equally spaced, no location advantage. <strong>Redundancy:</strong> all items look the same — the correct one is no longer bigger, brighter, bolder, or emphasized. In both cases the array ends up <em>neutral</em>, which is exactly the condition the learner will face in real life.</p></div></details>
  </div>

  <h3 id="rbt19-gloss">RBT19 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Stimulus Prompt</td><td>Something added to or modified in the environment — usually the materials — to help the learner respond correctly to the SD</td><td>A star on the right card</td><td>Change the stuff</td><td>Response prompt</td><td>Response prompt</td></tr>
      <tr><td>Gesture Prompt</td><td>A stimulus prompt where the RBT makes a movement drawing attention to the correct response option</td><td>Point, glance, hover hand, tap</td><td>A movement</td><td>Gestural prompt</td><td>Position prompt</td></tr>
      <tr><td>Position Prompt</td><td>A stimulus prompt that places the correct item in a location making it easier to select</td><td>Correct card closest to learner</td><td>Where it sits</td><td>Side bias (accidental)</td><td>Random rotation</td></tr>
      <tr><td>Redundancy Prompt</td><td>A stimulus prompt that changes part of the correct stimulus to make it stand out</td><td>Correct card is bigger/brighter</td><td>Make it stand out</td><td>Visual prompt</td><td>Neutral array</td></tr>
      <tr><td>Visual Prompt</td><td>A stimulus prompt including any added image, symbol, icon, or text that helps the learner know what to do</td><td>Picture schedule for toileting</td><td>An added picture</td><td>Redundancy prompt</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT19 in one breath</span>
    <p><strong>Stimulus prompts</strong> are things added to or modified <em>in the environment, usually the materials</em>, to help a learner respond correctly to the SD — as opposed to response prompts, which act on the learner. There are four: <strong>gesture</strong> (a movement drawing attention — point, glance, hover hand, tap, tilt head), <strong>position</strong> (placing the correct item closest, centered, or in front), <strong>redundancy</strong> (changing a feature of the correct stimulus so it stands out — color, size, shape/bolding, auditory emphasis) and <strong>visual</strong> (any added image, symbol, icon or text, like a picture schedule or a star on the right card). All four fade by <strong>most-to-least</strong> (start obvious, reduce salience until a position prompt is equally spaced and a redundancy prompt leaves every item looking the same), <strong>least-to-most</strong> (start with nothing and add only as needed), and for gesture and visual also <strong>time delay</strong> (increase the gap between the SD and the prompt).</p>
  </div>

  <div class="box exam"><span class="lbl">RBT19 exam checklist</span>
    <ul class="checklist">
      <li>Define stimulus prompt and distinguish it from a response prompt.</li>
      <li>Define and give examples of gesture, position, redundancy, and visual prompts.</li>
      <li>Name the four commonly manipulated features in a redundancy prompt.</li>
      <li>Describe MTL and LTM fading for each of the four prompt types.</li>
      <li>Say what a fully faded position prompt and a fully faded redundancy prompt look like.</li>
      <li>Explain how a position prompt relates to side bias.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt20">
  <div class="plate"><span class="num" aria-hidden="true">20</span><p class="ttl">Using and fading response prompts</p><p class="src">30-minute course · Conceptual and procedural aspects of response prompts and fading</p></div>

  <div class="box def"><span class="lbl">Definition: response prompts</span>
    <p>Actions the RBT takes to <strong>directly help the learner perform the correct behavior</strong>.</p>
  </div>

  <h3 id="rbt20-physical">Physical prompts and the right to assent</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Physical prompt</dt><dd>Occurs when the instructor <strong>physically guides the learner's body</strong> through the correct movement or behavior.</dd>
      <dt>Full physical prompt</dt><dd><strong>Hand-over-hand guidance.</strong></dd>
      <dt>Partial physical prompt</dt><dd>Less intrusive physical prompt — lighter touch, or a <strong>tap or nudge to initiate movement</strong>.</dd>
      <dt>Right to assent</dt><dd>Learners have the right to <strong>show us whether they're willing to participate</strong>.</dd>
    </dl>
  </div>
  <div class="box warn"><span class="lbl">Watch out: this is the one with an ethics clause attached</span>
    <p>The manual puts it directly in the physical prompt lesson: <em>"If a learner pulls away, resists, or shows discomfort during physical prompting, that's a signal they may not be giving assent. Physical prompts should always be used in a way that is gentle, respectful, and responsive to the learner's signals."</em></p>
    <p>Pulling away is <strong>data</strong>, not noncompliance. This connects to <a href="#rbt10-signs">RBT10</a>'s assent, <a href="#rbt39">RBT39</a>'s assent withdrawal, and <a href="#rbt38-values">RBT38</a>'s right to be free from restraint. Physical prompting is the most intrusive thing you routinely do, so it carries the most responsibility.</p>
  </div>
  <p><strong>Examples:</strong> teaching "wash hands" — you gently guide their hands under the water. Gently placing your hand on a learner's back to guide them during a transition. Teaching "zip jacket" — you guide their hand up the zipper.</p>
  <div class="tw"><table>
    <thead><tr><th>Fading physical prompts</th><th>How</th></tr></thead>
    <tbody>
      <tr><td><strong>Most-to-least (errorless)</strong></td><td>Start with full physical support (hand over hand) and reduce over time (partial physical, model, etc.).</td></tr>
      <tr><td><strong>Least-to-most</strong></td><td>Start with no prompt and only gradually add physical prompts if needed — try gesture or model prompts <em>before</em> a partial physical prompt.</td></tr>
      <tr><td><strong>Time delay</strong></td><td>Systematically increase the time between the SD and the presentation of the physical prompt.</td></tr>
      <tr><td><strong>Graduated guidance</strong></td><td>Begin with full physical help, then fade <strong>moment-by-moment based on the learner's behavior within the same trial</strong>.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt20-model">Model prompts</h3>
  <p>A <strong>model prompt</strong> occurs when the instructor <strong>demonstrates the correct response for the learner to imitate</strong>. Examples: say "Clap" and clap your hands; say "Wave" and wave your hand; say "Touch nose" and touch your nose.</p>
  <div class="tw"><table>
    <thead><tr><th>Most-to-least</th><th>Least-to-most</th><th>Time delay</th></tr></thead>
    <tbody>
      <tr><td>Start by modeling the behavior <strong>with emphasis</strong>, then reduce how obviously you model it as the learner is successful.</td><td>Start by giving the SD <strong>without a model</strong>. If the learner doesn't respond, provide a low-intensity model, and <strong>gradually exaggerate</strong> it as needed.</td><td>Systematically increase the time between the SD and the presentation of the model prompt.</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt20-verbal">Verbal prompts</h3>
  <p>A <strong>verbal prompt</strong> is any spoken word, phrase, or instruction you give <strong>in addition to the SD</strong> to help the learner respond correctly. There are three kinds:</p>
  <div class="tw"><table>
    <thead><tr><th>Type</th><th>What it does</th><th>SD</th><th>Prompt</th></tr></thead>
    <tbody>
      <tr><td><strong>Direct</strong></td><td>Tell the learner <strong>exactly what to do or say</strong></td><td>"What is your name?"</td><td>"Say, 'Max.'"</td></tr>
      <tr><td><strong>Indirect</strong></td><td><strong>Hints</strong> that help the learner figure it out</td><td>"Clean up."</td><td>"Where do the blocks go?"</td></tr>
      <tr><td><strong>Clarifying</strong></td><td><strong>State instructions or the steps</strong> of a task</td><td>"Go potty."</td><td>"First, close the stall door."</td></tr>
    </tbody>
  </table></div>
  <p>Fading: <strong>MTL</strong> — start with a full, direct verbal prompt, then reduce the amount of help over time. <strong>LTM</strong> — give the SD without any added help; if the learner doesn't respond, gradually increase the level of verbal support. <strong>Time delay</strong> — systematically increase the time between the SD and the verbal prompt.</p>
  <div class="box warn"><span class="lbl">Watch out: a verbal prompt is <em>in addition to</em> the SD</span>
    <p>That phrase is the test. "Touch head" is the SD. "Touch head… it's on top of your shoulders" adds a verbal prompt. If you can't separate the instruction from the help, the learner can't either — and you've changed the SD, which is a <a href="#rbt22-integrity">procedural integrity</a> problem.</p>
  </div>

  <h3 id="rbt20-gloss">RBT20 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Response Prompts</td><td>Actions the RBT takes to directly help the learner perform the correct behavior</td><td>Modeling, guiding, telling</td><td>You act on the learner</td><td>Stimulus prompt</td><td>Stimulus prompt</td></tr>
      <tr><td>Right to Assent</td><td>Learners have the right to show us whether they're willing to participate</td><td>Pulling away during a physical prompt</td><td>They get a say</td><td>Assent</td><td>Forced compliance</td></tr>
      <tr><td>Physical Prompt</td><td>The instructor physically guides the learner's body through the correct movement or behavior</td><td>Guiding hands under water</td><td>Hands on</td><td>Graduated guidance</td><td>Verbal prompt</td></tr>
      <tr><td>Full Physical Prompt</td><td>Hand-over-hand guidance</td><td>Both hands guided</td><td>Full hands-on</td><td>Partial physical</td><td>Independence</td></tr>
      <tr><td>Partial Physical Prompt</td><td>Less intrusive physical prompt — lighter touch, tap or nudge to initiate movement</td><td>A nudge at the elbow</td><td>Just a nudge</td><td>Full physical</td><td>—</td></tr>
      <tr><td>Model Prompt</td><td>The instructor demonstrates the correct response for the learner to imitate</td><td>You clap, they clap</td><td>Monkey see</td><td>Imitation</td><td>—</td></tr>
      <tr><td>Verbal Prompt</td><td>Any spoken word, phrase, or instruction given in addition to the SD to help the learner respond correctly</td><td>"Say 'Max'"</td><td>Extra words</td><td>Direct/indirect/clarifying</td><td>Independent response</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT20 in one breath</span>
    <p><strong>Response prompts</strong> are actions the RBT takes to directly help the learner perform the correct behavior. <strong>Physical prompts</strong> guide the learner's body — <strong>full physical</strong> is hand-over-hand and <strong>partial physical</strong> is a lighter touch, tap or nudge — and they carry an ethics clause: learners have the <strong>right to assent</strong>, so pulling away, resisting or showing discomfort is a signal they may not be giving it, and physical prompts must be <strong>gentle, respectful and responsive</strong>. <strong>Model prompts</strong> demonstrate the response for the learner to imitate. <strong>Verbal prompts</strong> are spoken help <em>in addition to the SD</em>, and come in three kinds — <strong>direct</strong> (tell them exactly what to say), <strong>indirect</strong> (a hint) and <strong>clarifying</strong> (state the steps). All fade by <strong>most-to-least</strong>, <strong>least-to-most</strong> and <strong>time delay</strong>, with <strong>graduated guidance</strong> available for physical prompts because it fades moment-by-moment within a single trial.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT20 exam checklist</span>
    <ul class="checklist">
      <li>Define response prompts and contrast them with stimulus prompts.</li>
      <li>Define physical, full physical, partial physical, model, and verbal prompts.</li>
      <li>State the right to assent and what to do when a learner pulls away during physical prompting.</li>
      <li>Name the three types of verbal prompt with an example of each.</li>
      <li>Describe MTL, LTM, time delay and graduated guidance fading for physical prompts.</li>
      <li>Explain why a verbal prompt must be separable from the SD.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt21">
  <div class="plate"><span class="num" aria-hidden="true">21</span><p class="ttl">Establishing and using conditioned reinforcers</p><p class="src">60-minute course · Implement procedures to establish and use conditioned reinforcers (TCO 3: C-2)</p></div>

  <div class="box bg"><span class="lbl">Builds on</span>
    <p><a href="#rbt03">RBT03</a>'s dimensions and schedules (reviewed again here), <a href="#rbt04-motivation">RBT04</a>'s MOs, and <a href="#rbt14">RBT14</a>'s preference assessments.</p>
  </div>

  <h3 id="rbt21-review">Reinforcement review</h3>
  <p>RBT21 opens by re-running the four dimensions from <a href="#rbt03-dims">RBT03</a> — <strong>immediacy</strong> (reinforce right after the behavior), <strong>magnitude</strong> (bigger effort = bigger reward), <strong>quality</strong> (use reinforcement the learner loves), <strong>rate</strong> (reinforce often enough to keep motivation high) — and adds a second way to describe schedules:</p>
  <div class="tw"><table>
    <thead><tr><th>Pair</th><th>Terms</th></tr></thead>
    <tbody>
      <tr><td>By <em>whether</em> every response is reinforced</td><td><strong>Continuous</strong> — given every time a behavior occurs · <strong>Intermittent</strong> — given only sometimes</td></tr>
      <tr><td>By <em>how often</em> reinforcement comes</td><td><strong>Rich</strong> — provides reinforcement often · <strong>Lean</strong> — provides reinforcement less often</td></tr>
    </tbody>
  </table></div>
  <p>Fading schedules from rich to lean is what <strong>promotes independence and durability of skills in natural environments</strong>.</p>

  <h3 id="rbt21-conditioned">Conditioned and unconditioned reinforcers</h3>
  <div class="tw"><table>
    <thead><tr><th>Reinforcer</th><th>Definition</th><th>Examples</th></tr></thead>
    <tbody>
      <tr><td><strong>Unconditioned</strong> (primary)</td><td>A stimulus that increases behavior <strong>without any prior learning history</strong>; tied to <strong>biological needs</strong>.</td><td>Food, water, warmth, sleep, relief from pain</td></tr>
      <tr><td><strong>Conditioned</strong> (secondary)</td><td>A stimulus that <strong>gains reinforcing power through pairing</strong> with unconditioned or already-conditioned reinforcers.</td><td>Praise, stickers, money, tokens, grades</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: the ethics clause</span>
    <p><em>"As an RBT, you must always follow the BACB Ethics Code when using reinforcers. We use reinforcers to support client goals, not for our own convenience."</em> Used thoughtfully, reinforcement supports learning, independence, and a higher quality of life.</p>
  </div>

  <h3 id="rbt21-establishing">Establishing and strengthening conditioned reinforcers</h3>
  <div class="box proc"><span class="lbl">Process: the four pairing steps</span>
    <ol>
      <li><strong>Pair the neutral stimulus with an existing reinforcer.</strong></li>
      <li><strong>Deliver the neutral item immediately after the reinforcer.</strong></li>
      <li><strong>Be consistent and frequent with pairing at first.</strong></li>
      <li><strong>Gradually fade reliance on the unconditioned reinforcer.</strong></li>
    </ol>
    <p><em>A reinforcer's effectiveness can change day to day. Always assess and adapt to what your client needs in the moment.</em></p>
  </div>
  <div class="box def"><span class="lbl">Definition: pairing (in this sense)</span>
    <p>The process of delivering a <strong>neutral item or event with an existing reinforcer</strong> so that, over time, <strong>the neutral item becomes reinforcing on its own</strong>.</p>
  </div>
  <div class="box warn"><span class="lbl">Watch out: two meanings of "pairing"</span>
    <p><a href="#rbt10-pairing">RBT10</a>'s <strong>presession pairing</strong> is pairing <em>yourself</em> with reinforcement so the learner likes working with you. RBT21's <strong>pairing</strong> is the general procedure for turning any neutral stimulus into a conditioned reinforcer. They're the same mechanism — presession pairing is just the version where the neutral stimulus is <em>you</em>.</p>
  </div>
  <p>The two MOs from <a href="#rbt04-motivation">RBT04</a> reappear here with their own names: <strong>deprivation</strong> is an MO that <em>increases</em> a reinforcer's value because access has been limited (hunger makes food more reinforcing), and <strong>satiation</strong> is an MO that <em>decreases</em> it because access has been abundant (being full makes food less reinforcing).</p>

  <h3 id="rbt21-tokens">Token economies</h3>
  <div class="box def"><span class="lbl">Definition: the token economy vocabulary</span>
    <dl>
      <dt>Token economy</dt><dd>A reinforcement system where clients <strong>earn tokens for specific behaviors</strong>, which can later be <strong>exchanged for backup reinforcers</strong>.</dd>
      <dt>Token</dt><dd>A neutral item (sticker, chip, point) that has <strong>no value on its own</strong> but becomes reinforcing when it can be exchanged for backup reinforcers.</dd>
      <dt>Backup reinforcer</dt><dd>The <strong>actual item or activity</strong> that tokens are exchanged for — toy, snack, activity.</dd>
      <dt>Exchange rate</dt><dd>The <strong>number of tokens required</strong> to trade for a backup reinforcer.</dd>
      <dt>Fading</dt><dd>The gradual reduction of tokens so clients move toward <strong>more natural reinforcement, like praise</strong>.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Tips for success</th><th>Pitfalls to avoid</th></tr></thead>
    <tbody>
      <tr><td><strong>Pair tokens with praise</strong></td><td><strong>Exchange rate being too high</strong></td></tr>
      <tr><td><strong>Start with easy, frequent learning</strong></td><td><strong>Not pairing tokens with praise</strong></td></tr>
      <tr><td><strong>Keep the system simple</strong></td><td><strong>Being inconsistent</strong></td></tr>
      <tr><td><strong>Involve client choice in backup reinforcers</strong></td><td><strong>Ignoring client preferences</strong></td></tr>
      <tr><td><strong>Fade gradually</strong></td><td><strong>Not fading</strong> · <strong>Taking tokens away</strong></td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "taking tokens away" is on the pitfall list</span>
    <p>Removing earned tokens is <strong>response cost</strong>, a punishment procedure (<a href="#rbt37-common">RBT37</a>). It is listed here as a pitfall because it isn't part of a token economy as such, and because — like every punishment procedure — it requires documentation in a plan and verified competence before you may run it.</p>
  </div>

  <h3 id="rbt21-gloss">RBT21 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Conditioned Reinforcer</td><td>A stimulus that gains reinforcing value through pairing with an unconditioned or already conditioned reinforcer</td><td>Praise, money, tokens</td><td>Learned to like it</td><td>Secondary reinforcer</td><td>Unconditioned reinforcer</td></tr>
      <tr><td>Unconditioned Reinforcer</td><td>A stimulus that increases behavior without prior learning history; tied to biological needs</td><td>Food, water, warmth, sleep</td><td>Born liking it</td><td>Primary reinforcer</td><td>Conditioned reinforcer</td></tr>
      <tr><td>Pairing</td><td>Delivering a neutral item or event with an existing reinforcer so the neutral item becomes reinforcing on its own</td><td>Token + snack</td><td>Rub off on it</td><td>Presession pairing</td><td>—</td></tr>
      <tr><td>Setting Event</td><td>An environmental or contextual factor influencing how reinforcers work</td><td>Lack of sleep, missed breakfast</td><td>Background condition</td><td>Motivating operation</td><td>—</td></tr>
      <tr><td>Motivating Operation (MO)</td><td>An event or condition that alters the effectiveness of a reinforcer and the likelihood of the behavior that produces it</td><td>Hunger</td><td>Changes the value</td><td>Setting event</td><td>—</td></tr>
      <tr><td>Deprivation</td><td>An MO that increases the value of a reinforcer because access has been limited</td><td>Hunger makes food reinforcing</td><td>Going without</td><td>EO</td><td>Satiation</td></tr>
      <tr><td>Satiation</td><td>An MO that decreases the value of a reinforcer because access has been abundant</td><td>Being full</td><td>Had enough</td><td>AO</td><td>Deprivation</td></tr>
      <tr><td>Token Economy</td><td>A reinforcement system where clients earn tokens for specific behaviors, exchangeable for backup reinforcers</td><td>Star chart</td><td>Earn and spend</td><td>Point system</td><td>—</td></tr>
      <tr><td>Token</td><td>A neutral item with no value on its own that becomes reinforcing when exchangeable for backup reinforcers</td><td>Sticker, chip, point</td><td>Like money</td><td>Conditioned reinforcer</td><td>Backup reinforcer</td></tr>
      <tr><td>Backup Reinforcer</td><td>The actual item or activity that tokens are exchanged for</td><td>Toy, snack, activity</td><td>What it buys</td><td>Primary reinforcer</td><td>Token</td></tr>
      <tr><td>Exchange Rate</td><td>The number of tokens required to trade for a backup reinforcer</td><td>5 tokens = 10 min iPad</td><td>The price</td><td>—</td><td>—</td></tr>
      <tr><td>Operant Conditioning</td><td>Learning through consequences, where behavior is strengthened or weakened based on what follows it</td><td>Reinforcement and punishment</td><td>Consequences teach</td><td>—</td><td>Respondent conditioning</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT21 in one breath</span>
    <p>Reinforcers are either <strong>unconditioned (primary)</strong> — effective with <em>no prior learning history</em> and tied to biological needs like food, water, warmth, sleep and relief from pain — or <strong>conditioned (secondary)</strong>, which <strong>gain their power through pairing</strong>: praise, stickers, money, tokens, grades. You establish a conditioned reinforcer in four steps: <strong>pair the neutral stimulus with an existing reinforcer, deliver the neutral item immediately after it, be consistent and frequent at first, then gradually fade reliance on the unconditioned reinforcer</strong>. Value shifts day to day with MOs — <strong>deprivation</strong> raises it, <strong>satiation</strong> lowers it. A <strong>token economy</strong> is the applied version: clients earn <strong>tokens</strong> (neutral, worthless alone) for specific behaviors and exchange them at a set <strong>exchange rate</strong> for <strong>backup reinforcers</strong>, with tokens eventually <strong>faded</strong> toward natural reinforcement like praise. Make it work by <strong>pairing tokens with praise, starting easy and frequent, keeping it simple, involving client choice, and fading gradually</strong>; avoid <strong>too high an exchange rate, no praise, inconsistency, ignoring preferences, never fading, and taking tokens away</strong>. Schedules are also described as <strong>rich</strong> (often) versus <strong>lean</strong> (less often), and thinning from rich to lean is what builds durable, independent skills.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT21 exam checklist</span>
    <ul class="checklist">
      <li>Define conditioned and unconditioned reinforcers and give examples of each.</li>
      <li>Explain how a conditioned reinforcer is established, in four steps.</li>
      <li>Define pairing and distinguish it from presession pairing.</li>
      <li>Define deprivation and satiation and link them to EO and AO.</li>
      <li>Define token, backup reinforcer, exchange rate, and token economy.</li>
      <li>List five tips and six pitfalls for token economies.</li>
      <li>Explain why taking tokens away is a pitfall and what procedure it actually is.</li>
      <li>Define rich and lean schedules and explain why schedules are thinned.</li>
      <li>State the ethical rule about who reinforcers are for.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt22">
  <div class="plate"><span class="num" aria-hidden="true">22</span><p class="ttl">Discrete Trial Training (DTT)</p><p class="src">60-minute course · Conceptual and procedural aspects of DTT · Implementing DTT</p></div>

  <h3 id="rbt22-intro">What DTT is</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Discrete Trial Training</dt><dd>A <strong>structured teaching method that breaks skills down into small, teachable components</strong>.</dd>
      <dt>A discrete trial</dt><dd>Has <strong>three components</strong>: <strong>Instruction/SD → Learner's response → Consequence</strong> (reinforcement or error correction).</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th colspan="4">Four unique features of DTT</th></tr></thead>
    <tbody>
      <tr><td><strong>Teacher led</strong></td><td><strong>Reinforcers are not related to the task</strong></td><td><strong>Predictable, structured routine</strong></td><td><strong>Designed to go quickly and offer many opportunities to learn</strong></td></tr>
    </tbody>
  </table></div>
  <div class="tw"><table>
    <thead><tr><th>Advantages of DTT</th><th>Disadvantages of DTT</th></tr></thead>
    <tbody>
      <tr><td>Reduces confusion</td><td>Rote responding</td></tr>
      <tr><td>Builds skills quickly</td><td>Harder to generalize</td></tr>
      <tr><td>Learners know what to expect</td><td>Risk of prompt dependency</td></tr>
      <tr><td>Easier data collection</td><td>Not as motivating</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: "reinforcers are not related to the task"</span>
    <p>This is the feature that most cleanly separates DTT from <a href="#rbt23">naturalistic teaching</a>. In DTT you label a card and get a token — the token has nothing to do with cards. In NT you ask for the green car and get <em>the green car</em>. That difference is also why DTT generalizes less well and NT is better for generalization.</p>
  </div>

  <h3 id="rbt22-steps">The 10 steps of DTT</h3>
  <div class="box proc"><span class="lbl">Process: implementing DTT</span>
    <ol>
      <li><strong>Prepare the environment.</strong> Have your data sheet ready and review the SAP; organize teaching materials; keep reinforcers ready but out of reach.</li>
      <li><strong>Pair!</strong> Engage in pairing with reinforcement; build joint attention; establish instructional control.</li>
      <li><strong>Learner selects reinforcer.</strong> Offer a choice of reinforcers — increases motivation and keeps learning fun.</li>
      <li><strong>Start easy.</strong> Begin with maintenance tasks the learner knows; build momentum; deliver high rates of reinforcement; set a positive tone.</li>
      <li><strong>Deliver target SD.</strong> Clear and consistent instruction; neutral tone of voice; <strong>avoid phrasing instructions as questions</strong>.</li>
      <li><strong>Prompt (if needed).</strong> If the learner does not respond or is unsure, prompt. Use the prompt described in the SAP that suits the skill and the child's level. <strong>Use prompts to avoid incorrect responses — teach through success.</strong></li>
      <li><strong>Deliver consequence.</strong> Correct/independent = <strong>BIG reinforcer and descriptive praise</strong>. Prompted = <strong>milder reinforcer</strong> ("That's right!"). Incorrect = <strong>error correction and withhold reinforcement</strong>.</li>
      <li><strong>Intertrial interval.</strong> Take a short pause, about <strong>3–5 seconds</strong>; record your data; prepare for the next instruction.</li>
      <li><strong>Intermix easy/hard tasks.</strong> Don't just run difficult targets — mix in mastered tasks so the child succeeds and earns reinforcement.</li>
      <li><strong>Repeat: mass trials.</strong> The pattern continues until your session ends.</li>
    </ol>
  </div>

  <h3 id="rbt22-errorcorrection">Error correction and the transfer trial</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Error correction</dt><dd>A <strong>quick, calm way to help a learner fix a mistake</strong>. We tell or show them the right answer, then try again.</dd>
      <dt>Transfer trial</dt><dd>A <strong>second chance for the learner to respond correctly</strong> — right after an error correction, <strong>using less help if possible</strong>.</dd>
    </dl>
  </div>
  <div class="box proc"><span class="lbl">Process: the error correction sequence</span>
    <ol>
      <li><strong>Trial 1:</strong> SD → learner's response is an <strong>error</strong> → correct the error, <strong>do not reinforce</strong>.</li>
      <li><strong>Transfer trial:</strong> new trial with <strong>SD + prompt</strong> → learner's response is correct → <strong>mild reinforcement</strong>.</li>
      <li><strong>Independent trial:</strong> new trial with SD alone → learner behavior → consequence.</li>
      <li><strong>Intermix easy tasks.</strong></li>
    </ol>
    <p>The manual's note: <em>you can fade the prompt instead of immediately trying for independence if you think the chance of another error is high.</em></p>
  </div>

  <h3 id="rbt22-fun">Ten strategies to keep DTT fun</h3>
  <div class="tw"><table>
    <tbody>
      <tr><td>Go fast! Have fun!</td><td>Get away from the table</td></tr>
      <tr><td>Vary praise and use affect</td><td>Enrich and organize the environment</td></tr>
      <tr><td>Establish a routine</td><td>Pair first (&amp; often)</td></tr>
      <tr><td>Reinforce frequently</td><td>Use visuals and offer choice</td></tr>
      <tr><td>Honor your word</td><td>Turn no's into yes's</td></tr>
    </tbody>
  </table></div>

  <h3 id="rbt22-data">Data collection in DTT</h3>
  <p><strong>What to record:</strong> typically <strong>trial-by-trial data</strong>. In CentralReach, a <strong>check</strong> if the response was correct and independent, an <strong>"x"</strong> if it was incorrect, and if you used a prompt, select the <strong>type of prompt used</strong> and then a check or x depending on whether the learner responded correctly following the prompt. Your data sheet may include other details — always follow your team's documentation system.</p>
  <p><strong>When to record:</strong> take data <strong>right after the learner responds, during the intertrial interval</strong> — that 3-to-5 second pause before the next trial. <strong>Don't wait until the end.</strong> Recording in real time keeps it accurate and objective.</p>

  <h3 id="rbt22-integrity">DTT and procedural integrity</h3>
  <div class="box def"><span class="lbl">Definition: procedural integrity</span>
    <p><strong>Doing what the program says — exactly the way it was written by the BCBA.</strong></p>
  </div>
  <p>Procedural integrity refers to all aspects of the SAP. During DTT, pay particular attention to four components: <strong>instructions, prompts, reinforcement, data collection.</strong></p>
  <div class="tw"><table>
    <thead><tr><th>If the SAP says…</th><th>Do</th><th>Don't</th></tr></thead>
    <tbody>
      <tr><td>Deliver the SD: "Touch your head"</td><td>Say, "Touch head."</td><td>Provide other instruction, like "Can you find your head?"</td></tr>
      <tr><td>Prompt after 3 seconds if there is no response</td><td>Wait 3 seconds after the SD and provide a prompt if needed</td><td>Prompt immediately, or wait over 3 seconds to prompt</td></tr>
      <tr><td>Reinforce only independent responses</td><td>Provide reinforcement after correct/independent responses</td><td>Reinforce incorrect or prompted responses</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Watch out: small changes are still changes</span>
    <p><em>"These details aren't optional — they're part of the treatment plan. In DTT, consistency is key. If you change part of the trial — even something small like the wording of the instruction or how quickly you prompt — you're no longer running the program as intended. Any change can affect how effective treatment is."</em></p>
    <p>Note the third row carefully: whether to reinforce prompted responses <strong>depends on what the SAP says</strong>. <a href="#rbt17-steps">RBT17</a> and <a href="#rbt18-errorless">errorless learning</a> both reinforce prompted responses; this example SAP doesn't. <strong>The plan wins.</strong></p>
  </div>

  <h3 id="rbt22-gloss">RBT22 glossary</h3>
  <div class="tw"><table class="gloss">
    <thead><tr><th>Term</th><th>Definition</th><th>Example</th><th>Memory trick</th><th>Similar</th><th>Opposite</th></tr></thead>
    <tbody>
      <tr><td>Discrete Trial Training</td><td>A structured teaching method that breaks skills down into small, teachable components</td><td>Flashcard labeling at a table</td><td>Small discrete chunks</td><td>Mass trials</td><td>Naturalistic teaching</td></tr>
      <tr><td>Discrete Trial</td><td>Has 3 components: instruction/SD, learner's response, consequence (reinforcement or error correction)</td><td>SD → response → token</td><td>Three parts</td><td>3-term contingency</td><td>—</td></tr>
      <tr><td>Error Correction</td><td>A quick, calm way to help a learner fix a mistake: tell or show the right answer, then try again</td><td>"Let's try again" + prompt</td><td>Fix and retry</td><td>Transfer trial</td><td>Prompting</td></tr>
      <tr><td>Transfer Trial</td><td>A second chance to respond correctly right after an error correction, using less help if possible</td><td>SD + prompt → mild reinforcement</td><td>Transfer to independence</td><td>Error correction</td><td>Independent trial</td></tr>
      <tr><td>Receptive Labeling</td><td>(Receptive identification) Teaching a learner to respond to verbal instructions by identifying or selecting the correct item</td><td>"Touch dog"</td><td>They receive, then select</td><td>Listener response</td><td>Tacting</td></tr>
      <tr><td>Tacting</td><td>(Expressive labeling) Teaching a learner to name or label things in their environment when they see them</td><td>"What is it?" → "Dog"</td><td>They say it</td><td>Tact</td><td>Receptive labeling</td></tr>
      <tr><td>Procedural Integrity</td><td>Doing what the program says — exactly the way it was written by the BCBA</td><td>Same SD wording every trial</td><td>Run it as written</td><td>Treatment fidelity</td><td>Drift</td></tr>
      <tr><td>Intertrial Interval</td><td>The short 3–5 second pause between trials, used to record data and prepare</td><td>Pause, mark data, reset</td><td>Between the trials</td><td>—</td><td>—</td></tr>
    </tbody>
  </table></div>

  <div class="box proc"><span class="lbl">RBT22 in one breath</span>
    <p><strong>DTT</strong> is a structured teaching method that breaks skills into small components, and a <strong>discrete trial</strong> has three parts: <strong>instruction/SD → learner's response → consequence</strong> (reinforcement or error correction). Its four features are that it is <strong>teacher led</strong>, uses <strong>reinforcers unrelated to the task</strong>, follows a <strong>predictable structured routine</strong>, and is <strong>fast with many learning opportunities</strong> — which buys you reduced confusion, quick skill building, predictability and easy data, at the cost of <strong>rote responding, harder generalization, prompt dependency and lower motivation</strong>. The ten steps: <strong>prepare the environment, pair, let the learner select a reinforcer, start easy, deliver the target SD (clear, neutral, not a question), prompt if needed, deliver the consequence (big reinforcer for independent, milder for prompted, error correction for incorrect), take the 3–5 second intertrial interval and record data, intermix easy and hard, repeat</strong>. After an error you run a <strong>transfer trial</strong> — SD plus prompt, mild reinforcement — then an independent trial. <strong>Procedural integrity</strong> means running the program exactly as the BCBA wrote it, watched especially on <strong>instructions, prompts, reinforcement and data collection</strong>, because even changing the wording of the SD or how fast you prompt means you are no longer running the program as intended.</p>
  </div>

  <div class="box exam"><span class="lbl">RBT22 exam checklist</span>
    <ul class="checklist">
      <li>Define DTT and name the three components of a discrete trial.</li>
      <li>List the four unique features of DTT.</li>
      <li>Give four advantages and four disadvantages of DTT.</li>
      <li>Walk the 10 steps of implementing DTT in order.</li>
      <li>State what consequence follows an independent, a prompted, and an incorrect response.</li>
      <li>Define error correction and transfer trial, and sequence the error correction procedure.</li>
      <li>Say what data you take in DTT and exactly when you record it.</li>
      <li>Define procedural integrity and name the four components watched during DTT.</li>
      <li>Give an example of a procedural integrity violation that looks harmless.</li>
    </ul>
  </div>
</section>

<section class="lecture prose" id="rbt23">
  <div class="plate"><span class="num" aria-hidden="true">23</span><p class="ttl">Naturalistic teaching (NT)</p><p class="src">60-minute course · Conceptual and procedural aspects of naturalistic teaching · Implementing NT procedures</p></div>

  <h3 id="rbt23-intro">What naturalistic teaching is</h3>
  <div class="box def"><span class="lbl">Definition</span>
    <dl>
      <dt>Naturalistic teaching</dt><dd>An ABA strategy where instruction happens during <strong>naturally occurring and motivating activities</strong>.</dd>
      <dt>Natural Environment Training (NET)</dt><dd>Spontaneously teaching skills during naturally occurring activities the learner is <strong>already engaged in</strong>.</dd>
      <dt>Incidental teaching</dt><dd>Teaching opportunities are <strong>set up by the RBT but initiated by the learner</strong>.</dd>
