<div class="tw"><table><thead><tr><th>Condition attacked</th><th>How</th><th>Verdict</th></tr></thead><tbody><tr><td><strong>Mutual Exclusion</strong></td><td>Make resources sharable so no one needs exclusive access.</td><td><strong>Generally impossible</strong> — some resources are inherently non-sharable (a printer mid-job, a mutex by definition).</td></tr><tr><td><strong>Hold and Wait</strong></td><td>Require each process to request <em>all</em> resources at startup; or require a process to release everything it holds before requesting anything new.</td><td>Works but <strong>neither approach is truly</strong> <strong>feasible in practice</strong>: all-at-startup yields terrible utilization (resources held long before use) and future needs are often unknown; release-before-request forces redoing work and risks livelock/starvation.</td></tr><tr><td><strong>Circular Wait</strong></td><td>Impose a <strong>total ordering</strong>: assign a sequence number to every resource type and require every process to request resources in <strong>ascending order</strong> only.</td><td><strong>The practical winner.</strong> A circular chain cannot form — in any would-be cycle, some process would have to request a lower-numbered resource while holding a higher-numbered one, which the rule forbids. (This is exactly the odd/even philosopher fix of §8.4 generalized.)</td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch: prevention vs. avoidance, the classic compare-and-contrast</span><p><strong>Prevention</strong> breaks a necessary condition <em>by design</em>, needs no runtime information, no per-request algorithm — but is restrictive and can waste resources. <strong>Avoidance</strong> allows all four conditions but uses runtime information (the maximum claim) to sidestep unsafe <em>states</em>, running a check (Banker's) on <strong>every request</strong> — flexible, but pays runtime overhead and requires processes to declare maxima up front. <strong>Detection &amp; recovery</strong> permits deadlock, finds it after the fact, and pays the (potentially cascading) recovery bill. One sentence each is a guaranteed exam answer.</p></div>
<h3 id="s9-11"><span class="secnum">9.11</span> Chapter Summary — Living with Deadlock</h3>
<p>Deadlocks are a fundamental problem of concurrent systems, not an edge case. A set of processes deadlocks when each waits for an event only another member can cause; it requires <strong>mutual exclusion, hold-and-wait, no preemption, and circular wait</strong> to hold simultaneously. Resource-allocation graphs make the situation visible — <strong>no cycle → no deadlock; cycle + single instances → deadlock; cycle + multiple instances → run graph reduction</strong>, remembering that consumable resources can make reduction <strong>order-dependent</strong> and that in an <strong>expedient</strong> system a <strong>knot</strong> is sufficient for deadlock. The three strategies are complementary, and each has a bill: <strong>recovery</strong> is costly due to rollback and cascading effects; <strong>avoidance</strong> (Banker's Algorithm on the Maximum Claim Graph) adds per-request overhead but guarantees safety; <strong>prevention</strong> is cleanest but often too restrictive for real workloads. Bottom line, straight from the last slide: deadlocks are hard to deal with — but they are a matter of fact, and understanding the theory is what enables informed system-design choices.</p>
<div class="box proc"><span class="lbl">Key idea</span><p>Four conditions make deadlock possible; a cycle is necessary, a knot (in an expedient system) is sufficient, and graph reduction decides the ambiguous middle. Then pick your poison: prevent (break one condition — usually by ordering resources), avoid (Banker's: tentatively grant, reduce the MCG, defer if unsafe), or detect and recover (terminate incrementally or preempt with checkpoints, and budget for cascading rollback).</p></div>
</section>
<section class="lecture prose" id="ch10">
<div class="plate"><span class="num" aria-hidden="true">10</span><p class="ttl">Main Memory, Part 1</p><p class="src">Chapter 10</p></div>
<h3 id="s10-1"><span class="secnum">10.1</span> Big Picture</h3>
<p>The course now moves from <em>who runs</em> (scheduling) and <em>how they cooperate</em> (synchronization) to <em>where they live</em>: <strong>memory management</strong>. A program on disk is just a file; to run, it must be brought into main memory and placed within a process. This chapter covers the foundations — protection, address binding, the logical/physical address split, and the MMU — then two generations of allocation strategy: <strong>contiguous allocation</strong> (with its fragmentation diseases) and <strong>paging</strong> (the cure, and the basis of everything modern). Part 2 (Chapter 11) finishes with advanced page-table structures, swapping, and the Intel and ARM architectures as case studies.</p>
<div class="box exam"><span class="lbl">Exam watch: final exam logistics (from lecture)</span><p>The <strong>final exam has moved</strong> to the last lecture day: <strong>Thursday, July 30th</strong>. Format: <strong>cumulative with a focus on newer topics</strong> — which makes Chapters 10–11 (and Chapter 12, Virtual Memory) the highest-yield material in these notes. Duration <strong>1 hour 40 minutes</strong>; sections are <strong>Definitions, MCQ, and Short Answers</strong>; a <strong>cheat sheet and calculator are allowed</strong>. The calculator is a hint: expect address-translation and effective-access-time arithmetic like §10.11 and §10.13. Mid-term solution keys: definitions and MCQ will be posted online; short answers will not.</p></div>
<p>Two hardware facts drive the entire chapter. First, <strong>main memory and registers are the only storage the CPU can access directly</strong> — a register in one CPU clock (or less), but main memory in <em>many</em> cycles, causing a <strong>stall</strong> while the CPU waits (the cache sits between them to soften this). Second, correctness demands <strong>protection</strong>: a process must be confined to its own addresses, and that check is performed by the memory <em>hardware</em> on every access, not by the OS in software — the OS could never afford to intercept every load and store.</p>
<h3 id="s10-2"><span class="secnum">10.2</span> Protection: Base and Limit Registers</h3>
<p>The simplest protection scheme uses a pair of registers that together define a process's <strong>logical address space</strong>: the <strong>base register</strong> holds the smallest legal physical address, and the <strong>limit register</strong> holds the <em>size</em> of the range. The CPU checks <strong>every memory access generated in user mode</strong>: legal means <em>base ≤ address &lt; base + limit</em>; anything else traps to the kernel as an addressing error. Crucially, <strong>the instructions that load the base and limit registers are privileged</strong> — only the OS, in kernel mode, may execute them. If a user process could set its own base and limit, the protection would be decoration.</p>
<div class="box ex"><span class="lbl">Worked example: the numbers from the slide</span><p>Base register = 300040, limit register = 120900. The program may legally access every address from <strong>300040</strong> through <strong>300040 + 120900 − 1 = 420939</strong>, inclusive. Address 420940? One past the end — trap. Address 299999? Below base — trap. Note the limit is a <em>count</em>, not an upper address; the upper bound is base + limit − 1. Expect exactly this arithmetic as a short answer.</p></div>
<h3 id="s10-3"><span class="secnum">10.3</span> Address Binding — Three Moments to Decide</h3>
<p>Programs waiting on disk to be brought into memory form the <strong>input queue</strong>. In principle a process could be loaded anywhere in physical memory — the machine's address space may start at 00000, but the first address of the user process need not be. That flexibility raises the central question: <em>when</em> does an address in the program get pinned to a real memory location? An address is represented differently at each stage of a program's life: <strong>source code</strong> uses <em>symbolic</em> addresses (the variable count); the <strong>compiler</strong> binds those to <em>relocatable</em> addresses ("14 bytes from the beginning of this module"); the <strong>linker or loader</strong> binds relocatable addresses to <em>absolute</em> addresses (74014). Each binding is a mapping from one address space to another — and the interesting design choice is how late you can delay the final one.</p>
<div class="tw"><table><thead><tr><th>Binding time</th><th>How it works</th><th>Consequence</th></tr></thead><tbody><tr><td><strong>Compile time</strong></td><td>If the memory location is known a priori, the compiler generates <strong>absolute code</strong> with real addresses baked in.</td><td>If the starting location ever changes, you must <strong>recompile</strong>. Rigid.</td></tr><tr><td><strong>Load time</strong></td><td>Location unknown at compile time → compiler generates <strong>relocatable code</strong>; final binding is delayed until the loader places it.</td><td>Process can load anywhere — but once loaded, it cannot move.</td></tr><tr><td><strong>Execution time</strong></td><td>Binding delayed until <em>runtime</em>; the process can be <strong>moved during execution</strong> from one memory segment to another.</td><td>Requires hardware support for address maps (base/limit, MMU). <strong>Most</strong> <strong>operating systems use this method.</strong></td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch: the break questions, answered</span><p>These appeared as in-class MCQs and are prime exam recycling: (1) <em>Absolute code can be generated for</em> → <strong>compile-time binding</strong> (only then is the location known early enough to hard-code). (2) <em>In a dynamically linked library</em> → <strong>a stub is included in the image for each library routine</strong> (see §10.5 — loading postponed until execution describes dynamic <em>loading</em>; the stub is the DLL signature). (3) <em>The mapping of a logical address to a physical address is done in hardware by the</em> → <strong>memory-</strong><strong>management unit (MMU)</strong> — not the relocation register alone (that is a component the MMU uses), and not the memory address register.</p></div>
<h3 id="s10-4"><span class="secnum">10.4</span> Logical vs. Physical Addresses and the MMU</h3>
<div class="box def"><span class="lbl">Definition: Logical (Virtual) vs. Physical Address</span><p><strong>In plain English:</strong> The logical address is the address as the program sees it; the physical address is where the bytes actually sit in RAM. The program lives its whole life never knowing the difference.</p><p><strong>Technical definition:</strong> A <strong>logical address</strong> (also called a <em>virtual address</em>) is generated by the CPU. A <strong>physical address</strong> is the address seen by the memory unit. The <strong>logical address space</strong> is the set of all logical addresses generated by a program; the <strong>physical address space</strong> is the set of all physical addresses corresponding to them.</p><p><strong>Why it matters:</strong> The concept of a logical address space bound to a <em>separate</em> physical address space is <strong>central to proper memory management</strong> — it is what lets the OS place, move, and protect processes without their knowledge or cooperation.</p></div>
<p>The two spaces are <strong>identical</strong> under compile-time and load-time binding (static binding) — the address the CPU emits <em>is</em> the memory address. They <strong>differ</strong> under execution-time binding, and that gap is bridged by hardware: the <strong>Memory-Management Unit (MMU)</strong>, a hardware device that maps virtual to physical addresses <em>at run time</em>. Many mapping methods exist — the rest of this chapter and the next is essentially a catalog of them.</p>
<h4>The simplest MMU: the relocation register</h4>
<p>Generalize the base register and rename it the <strong>relocation register</strong>: its value is <strong>added to every address generated by the user process</strong> at the moment the address is sent to memory. A process compiled to run at logical addresses 0…max executes correctly at physical addresses R…R+max, where R is whatever the OS loaded into the relocation register. The user program deals only in logical addresses and <strong>never sees the real physical addresses</strong> — execution-time binding happens on each reference.</p>
<div class="box warn"><span class="lbl">Misconception</span><p>"The logical address is just a fancy name for the physical address." Only in the static-binding schemes. The moment binding moves to execution time, they are genuinely different numbers, and the program cannot discover — and has no reason to care — where it physically resides. Every address it can print, store in a pointer, or compare is logical. This is also why the OS can later <em>move</em> the process (compaction, §10.8; swapping, §11.5) by changing one register instead of rewriting the program.</p></div>
<h3 id="s10-5"><span class="secnum">10.5</span> Dynamic Loading and Dynamic Linking</h3>
<h4>Dynamic loading — don't load what you don't call</h4>
<ul><li>The <strong>entire program does not need to be in memory to execute</strong>: a routine is not loaded until it is actually <em>called</em>.</li><li>All routines are kept on disk in <strong>relocatable load format</strong>; unused routines are never loaded → better memory utilization.</li><li>Especially useful when large amounts of code handle <strong>infrequently occurring cases</strong> (error handlers, obscure features).</li><li><strong>No special OS support is required</strong> — it is implemented through program design, though the OS can help by providing libraries that implement dynamic loading.</li></ul>
<h4>Dynamic linking — shared libraries and stubs</h4>
<p><strong>Static linking</strong> combines system libraries and program code into the binary image at build time — every program carries its own copy of printf. <strong>Dynamic linking</strong> postpones linking until <em>execution time</em>: the image instead contains a small piece of code called a <strong>stub</strong> for each library routine. On first call, the stub locates the memory-resident library routine (the OS checks whether it is already in the process's address space and maps it in if not), then <strong>replaces itself with the address of the routine</strong> and executes it — so every later call jumps straight there, paying the lookup cost once. Dynamically linked libraries are also called <strong>shared libraries</strong>; Windows is famous for this model with its <strong>DLLs</strong>. One operational wrinkle: patching a shared library affects every program that uses it, so systems handle updates by <strong>distributing different versions</strong> of libraries and letting programs bind to the one they expect.</p>
<div class="box proc"><span class="lbl">Key idea</span><p>Dynamic <em>loading</em> delays bringing a routine into memory until it is called (a program-design trick, no OS needed). Dynamic <em>linking</em> delays resolving the reference itself until runtime via a self-replacing stub (an OS-supported mechanism enabling shared libraries). Same instinct — pay costs lazily — applied to two different steps.</p></div>
<h3 id="s10-6"><span class="secnum">10.6</span> Contiguous Allocation</h3>
<p>Main memory must hold both the OS and the user processes, and it is a limited resource the OS must allocate efficiently. <strong>Contiguous allocation</strong> is the early method: memory is divided into two partitions — the <strong>resident OS in low memory</strong> (with the interrupt vector) and <strong>user processes in high memory</strong> — and <strong>each process is contained in a single contiguous section of memory</strong>. Protection reuses §10.2's hardware per process: the <strong>relocation register</strong> holds the process's smallest physical address, the <strong>limit register</strong> holds the range of legal logical addresses (every logical address must be less than the limit), and the MMU maps dynamically. A side benefit of dynamic mapping: the kernel itself can be <em>transient</em> — kernel code can come and go and the kernel can change size, since nothing is pinned by compiled-in addresses.</p>
<h4>Fixed partitions vs. variable partitions</h4>
<p>In <strong>fixed-partition memory</strong>, the user region is divided in advance into blocks — either equal-sized or variable-sized chunks — and a process is placed into a partition at least as large as its need. Fixed partitions suited old <strong>batch multiprogramming</strong> systems (job sizes were known, turnover was slow) but are a poor fit for timesharing. In <strong>variable-partition</strong> (multiple-partition) allocation, partitions are sized <em>to each process's needs</em> at arrival. The degree of multiprogramming is limited by the number of partitions. A <strong>hole</strong> is a block of available memory; holes of assorted sizes end up scattered throughout memory. An arriving process is carved out of a hole large enough to accommodate it; an exiting process frees its partition, and <strong>adjacent free partitions are combined</strong>. The OS bookkeeping is two lists: allocated partitions and free partitions (holes).</p>
<h3 id="s10-7"><span class="secnum">10.7</span> The Dynamic Storage-Allocation Problem</h3>
<p>Given a request of size <em>n</em> and a list of free holes, which hole do you use? This is the <strong>dynamic storage-</strong><strong>allocation problem</strong>, and the lecture presents four placement strategies — the first three are the classic trio the exam asks about by name.</p>
<div class="tw"><table><thead><tr><th>Strategy</th><th>Rule</th><th>Properties</th></tr></thead><tbody><tr><td><strong>First-fit</strong></td><td>Allocate the <em>first</em> hole that is big enough (search from the start).</td><td>Fast — stops at the first success; no full scan needed.</td></tr><tr><td><strong>Best-fit</strong></td><td>Allocate the <em>smallest</em> hole that is big enough.</td><td>Must search the entire list (unless it is ordered by size) — but produces the <strong>smallest leftover hole</strong>.</td></tr><tr><td><strong>Worst-fit</strong></td><td>Allocate the <em>largest</em> hole.</td><td>Also searches the whole list — produces the <strong>largest leftover hole</strong> (hoping the remainder stays usable).</td></tr><tr><td><strong>Next-fit</strong></td><td>Like first-fit, but start searching <strong>from the last</strong> <strong>placement</strong> instead of the beginning.</td><td>Spreads allocations around memory instead of clustering them near the front.</td></tr></tbody></table></div>
<p>The verdict from analysis and simulation: <strong>first-fit and best-fit are better than worst-fit</strong> in both speed and storage utilization. The two in-class review questions map straight onto the table: <em>smallest leftover hole</em> → <strong>best-fit</strong>; <em>largest leftover hole</em> → <strong>worst-fit</strong>.</p>
<h3 id="s10-8"><span class="secnum">10.8</span> Fragmentation</h3>
<div class="box def"><span class="lbl">Definition: External vs. Internal Fragmentation</span><p><strong>In plain English:</strong> External fragmentation is having enough total free memory but in useless scattered slivers; internal fragmentation is wasted space <em>inside</em> an allocation because you were given more than you asked for.</p><p><strong>Technical definition: External fragmentation</strong> — total memory space exists to satisfy a request, but it is not contiguous. <strong>Internal fragmentation</strong> — allocated memory may be slightly larger than requested memory; the size difference is memory internal to a partition that is not being used.</p><p><strong>Why it matters:</strong> External fragmentation is the disease of variable partitions (and the reason paging exists); internal fragmentation is the disease of fixed-size units (fixed partitions, and pages themselves — §10.10). Every allocation scheme trades one for the other; know which scheme suffers which.</p></div>
<p>How bad does it get? Statistical analysis of first-fit gives the <strong>50-percent rule</strong>: given N allocated blocks, another <strong>0.5 N blocks are lost to fragmentation</strong> — i.e., <strong>one-third of memory may be unusable</strong>.</p>
<h4>Compaction — and why it needs dynamic relocation</h4>
<p>External fragmentation can be reduced by <strong>compaction</strong>: shuffle memory contents to place all free memory together in one large block. But compaction is possible <strong>only if relocation is dynamic and done at execution time</strong> — moving a process means changing its physical location mid-run, which only works when addresses are translated through a relocation register the OS can update (a load-time-bound process would carry stale absolute addresses). Compaction also collides with I/O: a device may be writing into a process's buffer by physical address while the OS wants to move the process. Two fixes: <strong>latch the job in memory</strong> while it is involved in I/O (forbid moving it), or <strong>do I/O only into OS buffers</strong> and copy to the process afterward. And a sobering closing note from the slide: the <strong>backing store has the same fragmentation problems</strong> — moving the mess to disk does not dissolve it. This appeared as a review MCQ: the true statement about compaction is that <em>it is possible only if relocation is dynamic and done at execution time</em>.</p>
<h3 id="s10-9"><span class="secnum">10.9</span> Paging</h3>
<p>Paging is the escape from contiguity — and from external fragmentation. The idea: let the <strong>physical address space of a process be non-contiguous</strong>, allocating physical memory wherever it happens to be available, and the varying-sized-chunk problem disappears entirely.</p>
<div class="box def"><span class="lbl">Definition: Frames and Pages</span><p><strong>In plain English:</strong> Chop physical memory into equal fixed-size slots (frames) and chop each program's memory into pieces of exactly the same size (pages); then any piece fits in any slot.</p><p><strong>Technical definition:</strong> Divide physical memory into fixed-sized blocks called <strong>frames</strong>, with size a <strong>power of 2</strong> between <strong>512 bytes and 16 MB</strong>; divide logical memory into blocks of the same size called <strong>pages</strong>. The backing store is likewise split into pages.</p><p><strong>Why it matters:</strong> Because every page fits every frame, allocation becomes trivial bookkeeping (a free-frame list) instead of hole-hunting — no external fragmentation, no compaction, ever.</p></div>
<p>The OS keeps track of all <strong>free frames</strong>. To run a program of N pages, it finds N free frames — <em>any</em> N, anywhere — loads the pages, and builds a <strong>page table</strong> for the process: the translation from logical pages to physical frames. The price of the fixed unit is the return of <strong>internal fragmentation</strong>: the last page of a process is rarely exactly full, wasting on average half a frame per process (bounded by number of processes × frame size).</p>
<h4>The address translation scheme</h4>
<p>Every CPU-generated address is split in two: a <strong>page number (p)</strong> — used as an index into the page table, which holds the base address of each page in physical memory — and a <strong>page offset (d)</strong> — concatenated with that base to form the physical address sent to the memory unit. For a logical address space of 2ᵐ and page size 2ⁿ: the <strong>high-order m − n bits are the page number</strong> and the <strong>low n bits are the offset</strong>. Translation never touches the offset — a byte keeps its position within its page; only <em>which frame the page sits in</em> changes.</p>
<div class="box ex"><span class="lbl">Worked example: the 32-byte machine from the slides</span><p>Setup: n = 2, m = 4 — page size 4 bytes, logical space 16 bytes (4 pages), physical memory 32 bytes (8 frames). Page table: page 0 → frame 5, page 1 → frame 6, page 2 → frame 1, page 3 → frame 2. <strong>How does logical address 13 map?</strong></p><p>Split 13: page = 13 ÷ 4 = <strong>3</strong>, offset = 13 mod 4 = <strong>1</strong> (binary 1101 → p = 11, d = 01). Look up page 3 → frame 2. Physical address = frame × page size + offset = 2 × 4 + 1 = <strong>9</strong>. General recipe for the exam (calculator allowed!): p = ⌊addr / pagesize⌋, d = addr mod pagesize, physical = frame(p) × pagesize + d.</p></div>
<div class="box ex"><span class="lbl">Worked example: calculating internal fragmentation</span><p>Page size = 2,048 bytes; process size = 72,766 bytes. Then 72,766 ÷ 2,048 = 35 full pages with 72,766 − 35 × 2,048 = <strong>1,086 leftover bytes</strong>, so the memory footprint is <strong>36 logical pages → 36 physical frames</strong>.</p><p>Internal fragmentation, actual: the last frame holds 1,086 useful bytes out of 2,048 → <strong>2,048 − 1,086 = 962 bytes wasted</strong>. Worst case: a process needing one byte more than a page multiple wastes <strong>one frame minus 1 byte</strong>. Average case: <strong>half a frame</strong> per process.</p><p><em>"So smaller frame sizes are better?"</em> — the slide's rhetorical trap. Smaller pages do cut internal fragmentation, but they multiply the number of pages, and therefore the size of the page table (§10.12's problem) and the per-page management overhead. Page size is a trade-off, and its historical drift has been <em>upward</em>.</p></div>
<h3 id="s10-10"><span class="secnum">10.10</span> Implementing the Page Table: PTBR, PTLR, and the TLB</h3>
<p>The page table itself lives <strong>in main memory</strong>. Two registers describe it: the <strong>page-table base register (PTBR)</strong> points to the table, and the <strong>page-table length register (PTLR)</strong> gives its size in entries — a context switch just reloads these two registers, which is what makes switching address spaces cheap. But now count the cost of one load instruction: <strong>every data/instruction access requires two memory accesses</strong> — one to read the page-table entry, one for the data itself. Memory just got twice as slow.</p>
<p>The fix is a special fast-lookup hardware cache: the <strong>translation look-aside buffer (TLB)</strong>, also called <em>associative memory</em> — a small set of page-table entries searched in parallel by page number. TLB facts to know:</p>
<ul><li>TLBs are <strong>typically small: 64 to 1,024 entries</strong>.</li><li>On a <strong>TLB miss</strong>, the translation is fetched from the page table in memory and <strong>loaded into the TLB</strong> for faster access next time; when the TLB is full, a <strong>replacement policy</strong> (LRU, round-robin, random, …) picks a victim.</li><li>Some entries can be <strong>wired down</strong> — permanently resident, never eligible for replacement (used for critical kernel translations).</li><li>Some TLBs store <strong>address-space identifiers (ASIDs)</strong> in each entry, uniquely identifying the owning process so entries from different processes can coexist safely. <strong>Without ASID support, the TLB must be flushed on every context switch</strong> — otherwise the next process would use the previous process's (wrong) translations.</li></ul>
<h4>Effective Access Time (EAT) — the calculator question</h4>
<p>The <strong>hit ratio</strong> is the percentage of translations found in the TLB. Model each access as: TLB hit → one memory access; TLB miss → two (page table, then data). With 10 ns memory access time:</p>
<pre class="code"><code>EAT = hit_ratio * (1 memory access) + miss_ratio * (2 memory accesses)
80% hit ratio:  EAT = 0.80 * 10 + 0.20 * 20 = 12 ns    -&gt; 20% slowdown
99% hit ratio:  EAT = 0.99 * 10 + 0.01 * 20 = 10.1 ns  -&gt;  1% slowdown</code></pre>
<div class="box exam"><span class="lbl">Exam watch</span><p>EAT is the single most likely calculation on the final (calculator allowed, formula on your cheat sheet). Be ready for variants: some problems add an explicit TLB-lookup time ε to both cases — EAT = h·(ε + m) + (1 − h)·(ε + 2m) — but the lecture's version treats TLB lookup as free; match whichever the question states. And be able to <em>interpret</em> the result: the slowdown relative to bare memory access is (EAT − m)/m, which is why 80% hits → 20% slower but 99% hits → only 1% slower. Realistic TLBs live at the 99% end, which is why paging is affordable at all.</p></div>
<h3 id="s10-11"><span class="secnum">10.11</span> Memory Protection in a Paged World</h3>
<p>Base-and-limit protected a contiguous block; paging protects <strong>per page</strong>, using extra bits in each page-table entry. A <strong>protection bit</strong> on each frame marks the page <strong>read-only or read-write</strong> (and more bits can mark execute-only, etc.). Separately, a <strong>valid–invalid bit</strong> on each entry says whether the page is in the process's logical address space at all: <strong>valid</strong> = a legal page; <strong>invalid</strong> = not part of this process's space. An alternative to per-entry valid bits is simply the <strong>PTLR</strong> — any page number beyond the table length is illegal. <strong>Any violation traps to the kernel.</strong></p>
<div class="box ex"><span class="lbl">Worked example: valid/invalid bits (the 14-bit example)</span><p>A system has a 14-bit address space (addresses 0 to 16,383) with 2 KB pages, but the process only uses addresses 0 to 10,468. Pages 0 through 5 cover addresses 0–12,287 and are mapped normally with valid bits; <strong>pages 6 and 7 are marked invalid</strong>, and any address generated in them traps.</p><p>Notice the leak: page 5 spans 10,240–12,287, but the program is only entitled up to 10,468 — addresses 10,469–12,287 are <em>inside a valid page</em> and slip through. Page-granular protection cannot catch overruns within the last page; this residue is internal fragmentation's security-flavored twin.</p></div>
<h4>Shared pages</h4>
<p>Paging makes sharing natural. <strong>Shared code:</strong> one copy of <strong>read-only (reentrant) code</strong> — text editors, compilers, window systems — is mapped into many processes' page tables at once, similar to multiple threads sharing one process image; sharing read-write pages is likewise useful for inter-process communication if allowed. <strong>Private code and data:</strong> each process keeps its own copy, and those pages can appear anywhere in its logical address space. The slide's example: if libc occupies four pages, forty processes using it need four <em>physical</em> frames for libc, not one hundred sixty — each process's page table simply points its libc pages at the same frames.</p>
<h3 id="s10-12"><span class="secnum">10.12</span> Structure of the Page Table: Why One Flat Table Fails</h3>
<p>Straightforward paging has a hidden memory bill. Take a modern-looking configuration: a <strong>32-bit logical address space</strong> with <strong>4 KB pages (2¹²)</strong>. The page table needs 2³² / 2¹² = <strong>2²⁰ ≈ 1 million entries</strong>; at 4 bytes each, that is <strong>4 MB of physical memory for the page table alone — per process</strong>. We do not want to allocate that much contiguous space in main memory, so the table itself must be broken into smaller units. Three families of solutions: <strong>hierarchical paging</strong> (below), <strong>hashed page tables</strong>, and <strong>inverted page tables</strong> (both in Chapter 11).</p>
<h4>Hierarchical page tables — page the page table</h4>
<p>A <strong>two-level page table</strong> breaks the logical address space into multiple page tables by applying paging to the page table itself. The <strong>outer page table</strong>'s entries give the starting address of a <em>page of the page table</em>; the <strong>inner page table</strong>'s entries give actual frame addresses. On the 32-bit / 4 KB machine, the 20-bit page number splits into a <strong>10-bit outer index p₁</strong> and a <strong>10-bit inner index p₂</strong>, followed by the 12-bit offset d — p₁ indexes the outer table, p₂ is the displacement within that page of the inner table. This is called a <strong>forward-mapped page table</strong>. The payoff: only the outer table must exist in full; <strong>inner page tables are created only for active pages</strong>, so a process using a sliver of a 4 GB address space pays for a sliver of a page table.</p>
<h4>64-bit spaces — where even two levels give up</h4>
<p>Scale to a 64-bit logical address with 4 KB pages: 2⁵² page-table entries. Two levels with 2¹⁰-entry inner tables leaves an outer table of <strong>2⁴² entries ≈ 2⁴⁴ bytes</strong> — absurd. Add a second outer level (three-level paging) and that second outer table is <em>still</em> 2³⁴ bytes, and each translation now costs up to <strong>four memory accesses</strong>. Hierarchies alone do not tame 64 bits; that is exactly why Chapter 11 opens with <strong>hashed</strong> and <strong>inverted</strong> page tables.</p>
<div class="box proc"><span class="lbl">Key idea</span><p>Everything in this chapter is one arms race. Base+limit protects a contiguous process; variable partitions cause external fragmentation; compaction needs execution-time binding; paging eliminates external fragmentation by fixing the unit size (accepting internal fragmentation in the last page); the page table makes memory 2× slower, so the TLB caches translations (EAT = h·m + (1−h)·2m); and flat page tables grow monstrous, so we page the page table — until 64-bit spaces demand the hashed and inverted structures of Chapter 11.</p></div>
</section>
<section class="lecture prose" id="ch11">
<div class="plate"><span class="num" aria-hidden="true">11</span><p class="ttl">Main Memory, Part 2</p><p class="src">Chapter 11</p></div>
<h3 id="s11-1"><span class="secnum">11.1</span> Big Picture</h3>
<p>Part 1 ended on a cliffhanger: flat page tables collapse under 32-bit address spaces and even hierarchies strain under 64-bit ones. Part 2 delivers the two remaining page-table structures — <strong>hashed</strong> and <strong>inverted</strong> — then covers <strong>swapping</strong> (using disk as overflow memory, and why modern systems mostly don't), and closes with two real architectures as case studies: <strong>Intel IA-32/x86-64</strong> (segmentation <em>plus</em> paging, PAE, four-level tables) and <strong>ARM</strong> (the mobile world's answer). These case studies exist because the lecture's stated objective is a detailed description of the Intel architecture supporting <em>both pure segmentation and segmentation with paging</em> — expect the exam to probe the IA-32 translation pipeline.</p>
<p>Warm up with the lecture's paging exercise, since it is the mechanical skill everything else builds on:</p>
<div class="box ex"><span class="lbl">Worked example: page number and offset (1 KB pages)</span><p>Assuming a 1-KB (1,024-byte) page size, find the page number and offset of these decimal addresses (page numbers start at 0):</p><p><strong>Address 3085:</strong> page = ⌊3085 / 1024⌋ = ⌊3.012…⌋ = <strong>3</strong>; offset = 3085 mod 1024 = <strong>13</strong>. Reference: page 3, offset 13.</p><p><strong>Address 42095:</strong> page = ⌊42095 / 1024⌋ = ⌊41.108…⌋ = <strong>41</strong>; offset = 42095 mod 1024 = <strong>111</strong>. Reference: page 41, offset 111.</p><p>Divide for the page, take the remainder for the offset — with a power-of-two page size this is just splitting the binary representation, which is why hardware does it for free.</p></div>
<h3 id="s11-2"><span class="secnum">11.2</span> Hashed Page Tables</h3>
<p><strong>Hashed page tables</strong> are common for address spaces <strong>larger than 32 bits</strong>. Instead of indexing a giant array by page number, the <strong>virtual page number is hashed</strong> into a table of buckets, and each bucket holds a <strong>chain of elements</strong> that hashed to the same location. Each element carries three fields: <strong>(1) the virtual page number, (2) the value of the mapped page frame, (3) a pointer to the next element</strong> in the chain. Translation walks the chain <strong>comparing virtual page numbers</strong> until a match is found, then extracts the corresponding physical frame. The table is sized to the pages <em>actually in use</em>, not to the whole address space — sparse 64-bit spaces stop being a problem.</p>
<p>A variation for 64-bit addresses is the <strong>clustered page table</strong>: like a hashed table, but <strong>each entry refers to several pages (e.g., 16) instead of one</strong>. Clustering is <strong>especially useful for sparse address spaces</strong>, where memory references are non-contiguous and scattered — one entry covers a small neighborhood of pages, cutting both table size and chain-walking.</p>
<h3 id="s11-3"><span class="secnum">11.3</span> Inverted Page Tables</h3>
<div class="box def"><span class="lbl">Definition: Inverted Page Table</span><p><strong>In plain English:</strong> Instead of every process keeping a directory of its own pages, the system keeps one master directory of physical frames, each entry recording which process's which page currently lives there.</p><p><strong>Technical definition:</strong> A single table with <strong>one entry for each real page (frame) of memory</strong>; each entry contains the <strong>virtual address of the page stored in that frame</strong> and <strong>information about the process that owns it</strong> (its pid). Rather than each process tracking all its possible logical pages, the system tracks all physical frames and who references them.</p><p><strong>Why it matters:</strong> Table size now scales with <strong>physical memory</strong>, not with the number of processes times the size of their (possibly enormous, possibly sparse) virtual spaces — one table for the whole machine.</p></div>
<p>The trade is time for space: the table is indexed by <em>frame</em>, but translation starts from a <em>virtual</em> address ⟨pid, p, d⟩, so a lookup must <strong>search</strong> the table for an entry matching (pid, p) — the matching entry's <em>position i</em> is the frame number, giving physical address ⟨i, d⟩. Searching every frame per memory reference would be crippling, so implementations <strong>hash the (pid, p) pair to limit the search to one — or at most a few — entries</strong>, and the <strong>TLB</strong> absorbs most lookups before they touch the table at all. One structural casualty: <strong>shared memory gets awkward</strong>. A frame has exactly one table entry, so it can record only <strong>one mapping of one virtual address</strong> — the multiple-processes-point-at-one-frame trick of §10.11 has no natural home in a pure inverted table.</p>
<div class="box ex"><span class="lbl">Worked example: counting entries (the lecture exercise)</span><p>A system has a <strong>32-bit logical address</strong>, a <strong>4-KB page size</strong>, but only supports <strong>512 MB of physical memory</strong>. How many entries in each table?</p><p><strong>Conventional single-level page table:</strong> one entry per <em>logical</em> page = 2³² / 2¹² = <strong>2²⁰ = 1,048,576 entries</strong> (per process!) — physical memory size is irrelevant.</p><p><strong>Inverted page table:</strong> one entry per <em>physical</em> frame = 512 MB / 4 KB = 2²⁹ / 2¹² = <strong>2¹⁷ = 131,072 entries</strong> (for the whole system).</p><p>The contrast is the whole argument for inversion: 8× fewer entries here, and the gap explodes as logical spaces grow to 64 bits while physical memory stays finite.</p></div>
<div class="box exam"><span class="lbl">Exam watch</span><p>Know which quantity sizes which table: conventional → <strong>logical</strong> address space ÷ page size, <em>per process</em>; inverted → <strong>physical</strong> memory ÷ frame size, <em>per system</em>. And the two canonical inverted-table trade-offs, one sentence each: it <strong>decreases memory</strong> needed for page tables but <strong>increases search time</strong> per reference (mitigated by hashing + TLB); and it <strong>complicates shared memory</strong> because each frame can record only one virtual mapping.</p></div>
<h3 id="s11-4"><span class="secnum">11.4</span> Swapping</h3>
<p><strong>Swapping</strong> lets the <em>sum</em> of processes' memory exceed physical memory: a process can be <strong>swapped temporarily out</strong> of memory to a <strong>backing store</strong> and later brought back in to continue executing. The backing store is a <strong>fast disk, large enough to hold copies of all memory images for all users, with direct access</strong> to those images. The system keeps a <strong>ready queue</strong> of ready-to-run processes whose images are on disk. One named variant: <strong>roll out, roll in</strong> — swapping driven by priority-based scheduling, where a lower-priority process is swapped out so a higher-priority one can be loaded and run.</p>
<h4>Two questions every swap raises</h4>
<ul><li><strong>Must a process swap back into the same physical addresses?</strong> Depends on the <strong>address-binding method</strong>. With compile-/load-time binding, yes — its absolute addresses are baked in. With <strong>execution-time binding</strong>, relocation is trivial: land the process anywhere and just update the page table.</li><li><strong>What about pending I/O?</strong> A device may be transferring into the process's memory by physical address; swap the process out and the I/O lands in the <em>wrong process</em>. Either forbid swapping a process with pending I/O, or always transfer I/O <strong>into kernel buffers first</strong>, then to the process — called <strong>double buffering</strong>, which itself adds overhead.</li></ul>
<h4>The cost — context switching with swap in the loop</h4>
<div class="box ex"><span class="lbl">Worked example: the 100 MB context switch</span><p>If the next process to run is not in memory, the OS must swap one out and swap the target in — and the <strong>major part of swap time is transfer time</strong>, proportional to the amount of memory swapped.</p><p><strong>Hard drive at 140 MB/s:</strong> swapping out a 100 MB process takes 100/140 ≈ <strong>714 ms</strong>; add the swap-in of a same-sized process → <strong>1,428 ms ≈ 1.4 seconds</strong> of context-switch time. Compare a normal context switch measured in <em>microseconds</em>.</p><p><strong>NVMe SSD at 14,700 MB/s:</strong> the same swap-out takes ≈ <strong>6.8 ms</strong>, total ≈ <strong>13.6 ms</strong> — a hundred times better, still enormous next to a switch without swapping.</p><p>Reduction lever: swap less. If the OS knows how much memory is <em>really</em> being used, it moves only that — hence system calls like request_memory() and release_memory() by which a process informs the OS of its actual memory use.</p></div>
<p>The verdict on classic swapping: <strong>standard swapping — whole processes shuttled to disk — is not used in modern operating systems.</strong> What survives is a <strong>modified version</strong> found in UNIX, Linux, and Windows: swapping is <strong>normally disabled</strong>, is <strong>started only when free memory falls below a threshold</strong> (allocated memory exceeds the threshold), and is <strong>disabled again</strong> once demand drops back down. Modern systems also swap at <em>page</em> granularity rather than whole processes (swapping combines with paging — the natural bridge to virtual memory, Chapter 12).</p>
<h4>Swapping on mobile systems</h4>
<p>Mobile OSes <strong>typically do not support swapping at all</strong>, for flash-memory reasons: <strong>small capacity</strong>, a <strong>limited number of write cycles</strong> before the flash wears out, and <strong>poor throughput</strong> between flash and CPU on mobile platforms. Instead, when memory runs low they reclaim it by other means: <strong>iOS asks applications to voluntarily relinquish</strong> allocated memory — <strong>read-only data (like code) is thrown out and reloaded from flash if needed</strong> — and an app that fails to free memory <strong>can be terminated</strong>. <strong>Android</strong> goes straight to <strong>terminating apps</strong> when memory is low, but first <strong>writes application state to flash for a fast restart</strong>. Despite rejecting swap, <strong>both OSes support paging</strong> — the translation machinery is universal even where the disk-overflow habit is not.</p>
<div class="box warn"><span class="lbl">Misconception</span><p>"Swapping and paging are the same thing." They solve different problems. <strong>Paging</strong> is an <em>address-</em><em>translation</em> scheme — it removes the contiguity requirement and exists on essentially every modern system, including phones. <strong>Swapping</strong> is a <em>capacity</em> scheme — moving memory contents to disk to overcommit RAM. You can page without ever swapping (iOS, Android), and historical systems swapped whole processes without paging. Modern desktops combine them: paging supplies the unit (the page) that the swap mechanism moves.</p></div>
<h3 id="s11-5"><span class="secnum">11.5</span> Case Study: Intel IA-32</h3>
<p>Intel chips dominate the industry: 32-bit Pentium-class CPUs are the <strong>IA-32</strong> architecture, and current 64-bit Intel CPUs are <strong>IA-64</strong> / x86-64. IA-32 is the textbook's showpiece because it supports <strong>both pure segmentation and segmentation with paging</strong> — the CPU runs <em>two</em> translation stages back to back, and together the segmentation and paging units form the equivalent of the MMU.</p>
<h4>Segmentation: selectors, LDT, and GDT</h4>
<ul><li>Each segment can be up to <strong>4 GB</strong>, with up to <strong>16 K segments per process</strong>, split into two partitions: up to <strong>8 K private segments</strong> in the process's <strong>local descriptor table (LDT)</strong>, and up to <strong>8 K shared segments</strong> (shared among all processes) in the <strong>global descriptor table (GDT)</strong>.</li><li>A logical address is a tuple <strong>(selector, offset)</strong>. The <strong>offset (32-bit)</strong> locates the byte within the segment. The <strong>selector (16-bit)</strong> decomposes as: <strong>segment number s (13 bits)</strong>, <strong>global/local bit g (1 bit)</strong> choosing GDT vs. LDT, and <strong>protection bits p (2 bits)</strong>.</li><li>Each LDT/GDT entry is an <strong>8-byte segment descriptor</strong> holding the segment's <strong>base address and limit</strong> (plus detailed attributes).</li><li>Translation, stage 1: the selector picks a descriptor; the offset is <strong>compared against the limit</strong> (trap if out of range), then, if valid, <strong>added to the base</strong>, producing a <strong>32-bit linear address</strong>.</li></ul>
<h4>Paging the linear address</h4>
<p>Stage 2: the linear address is fed to the <strong>paging unit</strong>, which produces the physical address. Page sizes are <strong>4 KB or 4 MB</strong>. For <strong>4-KB pages</strong>, IA-32 uses a <strong>two-level scheme</strong>: the <strong>10 high-order bits</strong> index the outermost table — Intel calls it the <strong>page directory</strong> — whose entry points to an inner <strong>page table</strong>; the <strong>next 10 bits</strong> index that page table; and the <strong>low 12 bits</strong> are the offset within the 4-KB page. If the directory entry is flagged as a <strong>4-MB page</strong>, the page directory <strong>points directly at the page frame</strong> and the remaining <strong>22 bits</strong> are all offset — one level shallower.</p>
<h4>PAE — Page Address Extensions</h4>
<p>The 4 GB ceiling of 32-bit addressing pushed Intel to add <strong>PAE</strong>, letting 32-bit applications reach beyond 4 GB of <em>physical</em> memory. Paging becomes a <strong>3-level scheme</strong>: the <strong>top 2 bits</strong> of the linear address index a <strong>page-directory pointer table</strong>, which points to a page directory, then a page table. Page-directory and page-table entries widen to <strong>64 bits</strong>, so frame addresses can exceed 32 bits: the net effect is <strong>36-bit physical addressing = up to 64 GB</strong> of physical memory. (Virtual addresses are still 32 bits — PAE grows the machine, not the process.)</p>
<h3 id="s11-6"><span class="secnum">11.6</span> Case Study: x86-64 and ARM</h3>
<h4>Intel x86-64</h4>
<ul><li>A 64-bit address space is, in the lecture's words, <em>ginormous</em> — more than 16 exabytes; in practice <strong>only 48-bit virtual addressing is implemented</strong>.</li><li>Page sizes: <strong>4 KB, 2 MB, or 1 GB</strong>, through <strong>four levels</strong> of paging hierarchy.</li><li>With PAE-style widening, <strong>virtual addresses are 48 bits and physical addresses are 52 bits</strong>.</li></ul>
<h4>ARM (ARMv8 family)</h4>
<p>ARM is the <strong>dominant mobile-platform chip</strong> — Apple iOS and Google Android devices — built as modern, energy-efficient CPUs. Its memory system in brief:</p>
<ul><li>Page sizes <strong>4 KB and 16 KB</strong>, plus large <strong>1 MB and 16 MB</strong> units termed <strong>sections</strong>. Translation is <strong>one-</strong><strong>level for sections, two-level for the smaller pages</strong> — big mappings pay one lookup, small ones pay two.</li><li><strong>Two levels of TLBs:</strong> the outer level holds <strong>two micro TLBs — one for data, one for instructions</strong>; the inner level is a <strong>single main TLB</strong>. On a reference, the micro TLB is checked first; on a miss, the main TLB; on a second miss, the CPU performs the <strong>page-table walk</strong> itself.</li></ul>
<div class="box exam"><span class="lbl">Exam watch: architecture facts that make easy MCQs</span><p>IA-32: logical (selector, offset) → <em>segmentation unit</em> → <strong>linear address</strong> → <em>paging unit</em> → <strong>physical address</strong>; selector = 13-bit s + 1-bit g + 2-bit p; 8 K LDT (private) + 8 K GDT (shared) segments of up to 4 GB; pages 4 KB (two-level, 10/10/12) or 4 MB (directory-direct, 22-bit offset); PAE → 3 levels, 64-bit entries, 36-bit/64 GB physical. x86-64: 48-bit virtual, 52-bit physical, 4 levels, 4 KB/2 MB/1 GB pages. ARM: 4 KB/16 KB pages + 1 MB/16 MB <em>sections</em>; micro TLBs (data + instruction) → main TLB → hardware page-table walk. Any of these numbers can be a one-point definition or MCQ — they fit on a cheat-sheet corner.</p></div>
<h3 id="s11-7"><span class="secnum">11.7</span> Chapter Summary</h3>
<p>When flat page tables outgrow memory, three structures answer: <strong>hierarchical</strong> tables page the page table (great until 64-bit spaces demand too many levels); <strong>hashed</strong> tables size the structure to pages in use, chaining collisions (with <strong>clustered</strong> variants for sparse 64-bit spaces); <strong>inverted</strong> tables keep one entry per physical frame — small and global, but slower to search (hash + TLB to the rescue) and awkward for sharing. <strong>Swapping</strong> stretches memory onto a backing store, but transfer time makes whole-process swapping brutally slow (1.4 s for 100 MB over disk), so modern systems keep only a threshold-triggered, page-granular version — and mobile systems skip it entirely, reclaiming memory by asking (iOS) or by terminating with saved state (Android). The <strong>IA-32</strong> pipeline — selector through segmentation to a linear address, then two-level (or PAE three-level) paging to a physical address — and the <strong>x86-64</strong> and <strong>ARM</strong> schemes show every idea of Chapters 10–11 shipped in silicon.</p>
<div class="box proc"><span class="lbl">Key idea</span><p>Next stop, the course's final topic: <strong>Chapter 12 — Virtual Memory</strong> (textbook Chapter 10), where the valid–invalid bit, the backing store, and swapping-with-paging fuse into demand paging. And circle the date: <strong>the final exam is Thursday, July 30th, 2:00–3:40 pm — cumulative with roughly 80% new content, one-page handwritten cheat sheet allowed.</strong> Chapters 10 and 11 are squarely inside that 80%.</p></div>
