<p>Big picture: software-only solutions are fragile, so hardware gives us special <strong>atomic instructions</strong> that test-and-modify a word, or swap two words, as one <strong>uninterruptible</strong> step. On uniprocessors the old trick was disabling interrupts (not scalable); on modern machines the two workhorses are <strong>test-and-set</strong> and <strong>compare-and-swap</strong>, plus <strong>atomic variables</strong> built on top of them.</p>
<h4>test_and_set()</h4>
<pre class="code"><code>boolean test_and_set(boolean *target) {
    boolean rv = *target;   /* remember the OLD value  */
    *target = true;         /* always set flag to true */
    return rv;              /* return the OLD value    */
}   /* the whole thing executes ATOMICALLY */</code></pre>
<p>Three properties to recite: it executes <strong>atomically</strong> (one indivisible step); it returns the <strong>original value</strong> of *target; and it <strong>always leaves *target true</strong>. It is the classic building block for spinlocks.</p>
<p><strong>Lock with TAS</strong> — shared <code>boolean lock = false</code>:</p>
<pre class="code"><code>do {
    while (test_and_set(&amp;lock));  /* busy wait */
    /* critical section */
    lock = false;
    /* remainder section */
} while (true);</code></pre>
<p>Why it works: if the lock was free (false), TAS returns false — the loop exits and you're in, and the lock is now true so everyone else spins. If it was taken (true), TAS returns true and you keep spinning. <strong>Verdict vs. the three requirements:</strong> mutual exclusion ✓, progress ✓, but <strong>bounded waiting</strong> ✗ — an unlucky process can lose the TAS race forever while others repeatedly grab the lock.</p>
<h4>compare_and_swap() (CAS)</h4>
<pre class="code"><code>int compare_and_swap(int *value, int expected, int new_value) {
    int temp = *value;          /* remember original      */
    if (*value == expected)     /* swap ONLY if it matches */
        *value = new_value;
    return temp;                /* return original value  */
}   /* executes ATOMICALLY */</code></pre>
<p>Three properties: <strong>atomic</strong>; returns the <strong>original value</strong>; and the swap is <strong>conditional</strong> — it happens only when *value equals expected. CAS is the foundation of modern lock-free algorithms.</p>
<p><strong>Lock with CAS</strong> — shared <code>int lock = 0</code>:</p>
<pre class="code"><code>while (true) {
    while (compare_and_swap(&amp;lock, 0, 1) != 0);  /* busy wait */
    /* critical section */
    lock = 0;
    /* remainder section */
}</code></pre>
<p>Read the spin condition aloud: "try to change lock from 0 to 1; if the returned original wasn't 0, someone else holds it — spin." Same verdict as TAS: mutual exclusion ✓, progress ✓, <strong>bounded waiting</strong> ✗.</p>
<h4>Adding bounded waiting (Slides 39–40)</h4>
<p>To satisfy all three requirements, add shared <code>boolean waiting[n]</code> (all false — nobody waiting at startup) and <code>int lock = 0</code> (lock starts free, so the first process can acquire it immediately):</p>
<pre class="code"><code>while (true) {
    /* ---- ENTRY SECTION ---- */
    waiting[i] = true;
    key = 1;
    while (waiting[i] &amp;&amp; key == 1)
        key = compare_and_swap(&amp;lock, 0, 1);
    waiting[i] = false;
    /* critical section */
    /* ---- EXIT SECTION ---- */
    j = (i + 1) % n;
    while ((j != i) &amp;&amp; !waiting[j])   /* scan for next waiter */
        j = (j + 1) % n;
    if (j == i)  lock = 0;            /* nobody waiting: free the lock */
    else         waiting[j] = false;  /* hand CS directly to Pj        */
    /* remainder section */
}</code></pre>
<p><strong>The idea:</strong> a process escapes the entry loop either by winning the CAS (<code>key == 0</code>) or by being <strong>chosen</strong> (<code>waiting[i]</code> set false by the exiting process). On exit, the leaver scans the waiting array <em>in circular order</em> from i+1 and passes the CS to the first waiter it finds — so every waiter is reached within at most <strong>n − 1</strong> turns. That circular scan is exactly what buys bounded waiting.</p>
<h4>Atomic variables</h4>
<div class="box def"><span class="lbl">Definition: Atomic variable</span><dl><dt>Plain English</dt><dd>A variable whose reads and updates happen as single uninterruptible operations — no explicit lock needed.</dd><dt>Technical</dt><dd>An atomic variable provides atomic (uninterruptible) updates on basic data types such as integers and booleans, often built on hardware instructions such as compare_and_swap().</dd><dt>Why it matters</dt><dd>It is the lightweight fix for single-variable races like the producer/consumer counter — increment(&amp;sequence) is guaranteed to update without interruption.</dd></dl></div>
<pre class="code"><code>void increment(atomic_int *v) {
    int temp;
    do {
        temp = *v;                                     /* snapshot   */
    } while (temp != compare_and_swap(v, temp, temp + 1)); /* retry  */
}</code></pre>
<p><strong>How the retry loop works:</strong> snapshot the value, then CAS attempts to bump it from that snapshot. If another thread changed *v in between, CAS returns something ≠ temp — the swap didn't happen — so loop and try again with a fresh snapshot. Eventually one clean attempt lands.</p>
<h3 id="s7-6"><span class="secnum">7.6</span> Mutex Locks</h3>
<p>Big picture: TAS/CAS solutions are complex and easy to get wrong, so OS designers wrapped them in a simpler tool programmers can actually use — the mutex (MUTual EXclusion) lock.</p>
<div class="box def"><span class="lbl">Definition: Mutex lock</span><dl><dt>Plain English</dt><dd>A simple on/off lock: grab it before your critical section, give it back after. If someone else has it, you wait.</dd><dt>Technical</dt><dd>A mutex lock is a boolean variable indicating whether the lock is available, protecting a critical section via two operations — acquire() and release() — both of which must be atomic (typically implemented via compare_and_swap()).</dd><dt>Why it matters</dt><dd>It is the everyday synchronization tool. Its spin-based form is called a spinlock because waiting threads continuously re-check ('spin on') the lock, burning CPU — busy waiting.</dd></dl></div>
<pre class="code"><code>/* usage */                    /* implementation */
while (true) {                 acquire() {
    acquire(lock);                 while (!available);  /* spin */
    /* critical section */         available = false;
    release(lock);             }
    /* remainder section */    release() {
}                                  available = true;
                               }</code></pre>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>"Spinlock" isn't a different tool — it's a mutex that busy-waits.</strong> While the lock is held, waiting threads loop re-checking it. That wastes CPU cycles, which is fine for very short critical sections (spinning is cheaper than a context switch) but terrible for long ones. The no-busy-wait alternative appears in the semaphore section next.</p></div>
<h3 id="s7-7"><span class="secnum">7.7</span> Semaphores</h3>
<p>Big picture: a mutex is a door that's open or shut. A semaphore is a counter of available resources — strictly more powerful. Invented by Edsger Dijkstra in 1965; the original operation names P() and V() come from Dutch: proberen ('test') and verhogen ('increase').</p>
<div class="box def"><span class="lbl">Definition: Semaphore</span><dl><dt>Plain English</dt><dd>A shared integer you can only touch through two atomic operations: wait() (take one, or wait if none left) and signal() (put one back).</dd><dt>Technical</dt><dd>A semaphore S is an integer variable accessed only through two atomic, indivisible operations: wait() and signal() (originally P() and V()). It provides more sophisticated synchronization than mutex locks.</dd><dt>Why it matters</dt><dd>One tool solves mutual exclusion (initialize to 1), resource counting (initialize to N), and event ordering (initialize to 0) — three exam scenarios from one primitive.</dd></dl></div>
<pre class="code"><code>/* busy-waiting definition */
wait(s) {                       signal(s) {
    while (s &lt;= 0);  /* spin */     s++;
    s--;                        }
}</code></pre>
<h4>Two types</h4>
<div class="tw"><table><thead><tr><th>Type</th><th>Value range</th><th>Use</th></tr></thead><tbody><tr><td>Counting semaphore</td><td>Unrestricted integer domain</td><td>Controlling access to a pool of N identical resources.</td></tr><tr><td>Binary semaphore</td><td>Only 0 or 1</td><td>Same as a mutex lock. (A counting semaphore can even be built from binary ones.)</td></tr></tbody></table></div>
<p>With semaphores we can solve the classic synchronization problems previewed for next chapter: the <strong>Bounded-Buffer</strong>, <strong>Readers–Writers</strong>, and <strong>Dining-Philosophers</strong> problems.</p>
<h4>The two canonical usage patterns (Slide 49) — both are exam gold</h4>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Pattern 1 — mutual exclusion.</strong> Create semaphore <code>mutex = 1</code> (the number of 'resources' = 1 CS slot):</p><p><code>wait(mutex); /* critical section */ signal(mutex);</code></p><p><strong>Pattern 2 — enforcing order (S1 before S2).</strong> P1 must run S1 before P2 runs S2. Create semaphore <code>sync = 0</code>:</p><p>P1: <code>S1; signal(sync);</code> P2: <code>wait(sync); S2;</code></p><p>Because sync starts at 0, P2's wait() blocks until P1's signal() — regardless of scheduling order. Initializing to 0 = 'the event has not happened yet.'</p></div>
<h4>Implementing semaphores — and killing the busy wait</h4>
<p>wait() and signal() must themselves be mutually exclusive — no two processes may execute them on the same semaphore simultaneously. So the semaphore implementation <em>is itself</em> a critical-section problem, with wait/signal code in the CS. The naive version busy-waits; that's tolerable when critical sections are short and rarely occupied, but applications that spend a lot of time in their CS make spinning a very poor solution.</p>
<p>The fix (Slides 51–53): give each semaphore a <strong>waiting queue</strong>. Each queue entry holds a value and a pointer to the next record. Two new kernel operations: <strong>block()</strong> — put the invoking process on the semaphore's waiting queue (suspend it); <strong>wakeup(P)</strong> — remove process P from the waiting queue and move it to the ready queue.</p>
<pre class="code"><code>typedef struct {
    int value;
    struct process *list;   /* the waiting queue */
} semaphore;
wait(semaphore *s) {                signal(semaphore *s) {
    s-&gt;value--;                         s-&gt;value++;
    if (s-&gt;value &lt; 0) {                 if (s-&gt;value &lt;= 0) {
        (s-&gt;list).append(P);                P = (s-&gt;list).pop();
        block();   /* suspend */            wakeup(P);
    }                                   }
}                                   }</code></pre>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Read the negative value!</strong> In this version, <code>s-&gt;value</code> may go negative — and its <strong>magnitude equals the number of processes waiting</strong> on the semaphore. E.g., value = −3 means three processes are blocked in the queue. In signal(), the test <code>value &lt;= 0</code> (after the increment) means "at least one process was waiting — wake one up." Instructors love asking what a negative semaphore value means.</p></div>
<h4>What goes wrong when you misuse semaphores (Slide 54)</h4>
<div class="tw"><table><thead><tr><th>Mistake</th><th>Consequence</th></tr></thead><tbody><tr><td>signal(mutex) … then wait(mutex) — reversed order</td><td>Several processes may be in their CS simultaneously — mutual exclusion violated.</td></tr><tr><td>wait(mutex) … then wait(mutex) again — double wait</td><td>The process permanently blocks on the second wait; the semaphore is now unavailable to everyone.</td></tr><tr><td>Omitting wait() and/or signal()</td><td>Either mutual exclusion is violated, or processes permanently block.</td></tr></tbody></table></div>
<p>These bugs motivate the final tool: push the discipline into the language/compiler so programmers <em>can't</em> forget or misorder the calls — the <strong>monitor</strong>.</p>
<h3 id="s7-8"><span class="secnum">7.8</span> Monitors &amp; Condition Variables</h3>
<div class="box def"><span class="lbl">Definition: Monitor</span><dl><dt>Plain English</dt><dd>A synchronized 'room' of code and data: only one process may be inside at a time, and the compiler enforces it automatically.</dd><dt>Technical</dt><dd>A monitor is a high-level abstraction — an abstract data type whose internal variables are accessible only by code within its procedures — that provides a convenient, effective mechanism for process synchronization. Only one process may be active within the monitor at a time.</dd><dt>Why it matters</dt><dd>Monitors bake mutual exclusion into the structure itself, eliminating the misordered/missing wait–signal bugs of raw semaphores.</dd></dl></div>
<pre class="code"><code>monitor monitor-name {
    /* shared variable declarations */
    initialization_code (...) { ... }
    procedure_p1 (...) { ... }
    procedure_p2 (...) { ... }
    ...
}</code></pre>
<p><strong>Schematic (Slide 56):</strong> picture the monitor as a box holding shared data and its procedures. Processes wanting in line up in a single <strong>entry queue</strong> outside; at most one is active inside at any moment. That entry queue is the mutual exclusion made visible.</p>
<h4>Condition variables — waiting for something INSIDE the monitor</h4>
<div class="box def"><span class="lbl">Definition: Condition variable</span><dl><dt>Plain English</dt><dd>A named waiting spot inside a monitor for processes that got in but discovered they can't proceed yet.</dd><dt>Technical</dt><dd>Declared as 'condition x, y;'. Two operations: x.wait() suspends the invoking process until another process invokes x.signal(); x.signal() resumes exactly one waiting process — and if no process is waiting on x, the signal has no effect.</dd><dt>Why it matters</dt><dd>Mutual exclusion gets you into the monitor, but sometimes you must also wait for a state ('buffer not empty'). Condition variables provide that second kind of waiting.</dd></dl></div>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>x.signal() is NOT semaphore signal().</strong> A semaphore's signal() always increments — it is 'remembered' even if nobody is waiting. A condition variable's x.signal() with no waiters does <strong>nothing at all</strong> — it evaporates. This is the most-tested difference between the two tools.</p></div>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Ordering with a condition variable (Slide 60):</strong> require S1 (in P1) before S2 (in P2). Build a monitor with a shared <code>done = false</code> and condition <code>x</code>:</p><p>F1() { S1; done = true; x.signal(); } F2() { if (done == false) x.wait(); S2; }</p><p>If P2 arrives first, done is false, so it waits on x. When P1 finishes S1 it sets done and signals. Note the <code>done</code> flag handles the case where P1 ran first — then P2 skips the wait entirely (remember: a signal with no waiter would have vanished).</p></div>
<h4>Implementing a monitor with semaphores (Slides 57, 61–63)</h4>
<p><strong>Simple version (mutual exclusion only):</strong> one semaphore <code>mutex = 1</code>; every monitor procedure body is wrapped as <code>wait(mutex); …body…; signal(mutex);</code> — mutual exclusion within the monitor is ensured.</p>
<p><strong>Full version (with signaling):</strong> add <code>semaphore next = 0</code> and <code>int next_count = 0</code> — the count of processes suspended <em>inside</em> the monitor after signaling. A signaler must yield the monitor to the process it woke, then wait on <code>next</code> until it can resume. Each procedure exit becomes:</p>
<pre class="code"><code>wait(mutex);
    ... body of P ...
if (next_count &gt; 0)
    signal(next);    /* let a suspended signaler resume  */
else
    signal(mutex);   /* otherwise open the front door    */</code></pre>
<p>For each condition variable x, keep <code>semaphore x_sem = 0</code> and <code>int x_count = 0</code>:</p>
<pre class="code"><code>/* x.wait() */                      /* x.signal() */
x_count++;                          if (x_count &gt; 0) {
if (next_count &gt; 0)                     next_count++;
    signal(next);                       signal(x_sem);  /* wake waiter  */
else                                    wait(next);     /* I step aside */
    signal(mutex);                      next_count--;
wait(x_sem);   /* sleep on x */     }
x_count--;</code></pre>
<p><strong>The logic in one breath:</strong> x.wait() = register as a waiter, release the monitor to someone (a suspended signaler first, else the entry queue), then sleep on x_sem. x.signal() = if anyone is waiting on x, wake exactly one and suspend yourself on next until the monitor is handed back — preserving the one-active-process rule at every instant.</p>
<p><em>The deck ends here — 'to be continued, resumed before the exam.' Next lecture: Chapter 7 continued / Synchronization Examples (Bounded-Buffer, Readers–Writers, Dining Philosophers).</em></p>
<div class="box proc"><span class="lbl">Chapter 7 in one breath</span><p>Concurrent access to shared data causes <strong>race conditions</strong> because even counter++ is three interruptible instructions. Code touching shared data is a <strong>critical section</strong>, and a valid protection scheme must guarantee <strong>mutual exclusion, progress, and bounded waiting</strong> while avoiding starvation, deadlock, and livelock. A bare turn variable fails progress; <strong>Peterson's solution</strong> (flag[] + turn) provably satisfies all three — but modern CPUs <strong>reorder independent instructions</strong>, so it needs <strong>memory barriers</strong> to force visibility. Hardware gives atomic <strong>test_and_set</strong> and <strong>compare_and_swap</strong> (mutual exclusion but unbounded waiting until you add the circular waiting[] scan) and <strong>atomic variables</strong> (CAS retry loops). The OS wraps these into <strong>mutex locks</strong> — acquire/release spinlocks — and <strong>semaphores</strong> (Dijkstra 1965; atomic wait/signal; counting vs. binary; init 1 = mutual exclusion, init 0 = ordering; the blocked-queue version's negative value counts the waiters). Misused semaphores deadlock or break exclusion, so <strong>monitors</strong> enforce one-active-process automatically, with <strong>condition variables</strong> (x.wait/x.signal — a signal with no waiter evaporates) for waiting on state inside.</p></div>
</section>
<section class="lecture prose" id="ch8">
<div class="plate"><span class="num" aria-hidden="true">08</span><p class="ttl">Synchronization Examples</p><p class="src">Chapter 8</p></div>
<h3 id="s8-1"><span class="secnum">8.1</span> Big Picture</h3>
<p>Chapter 7 built the toolbox: hardware gives us atomic <strong>test_and_set</strong> and <strong>compare_and_swap</strong>, the OS wraps those into <strong>mutex locks</strong> and <strong>semaphores</strong>, and languages wrap everything into <strong>monitors</strong> with <strong>condition variables</strong>. Chapter 8 is where the toolbox gets used. First we solve the three <em>classical synchronization problems</em> — Bounded-Buffer, Readers–Writers, and Dining Philosophers — which are the standard benchmarks every new synchronization scheme is tested against. Then we look at how <em>real</em> systems — Windows, Linux, POSIX, and Java — actually implement these tools.</p>
<p>The classical problems matter for two reasons. First, they are abstractions of situations that appear constantly in real systems (a print queue <em>is</em> a bounded buffer; a database <em>is</em> a readers–writers situation). Second, they are the single most common source of exam questions on synchronization: you will be asked to write or trace the semaphore code, explain why a wait comes before another wait, or spot the deadlock in a broken variant.</p>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Take-Home Quiz 4 covers Lectures 8 and 9</strong> — exactly the material in this chapter and the next. Homework 3 (the process-synchronization program with reads/writes on a common file) requires <strong>POSIX semaphores</strong>, which are covered in §8.6. Read that section with the assignment open next to it.</p></div>
<p>One recap fact worth restating before the problems: every valid critical-section solution must give <strong>Mutual Exclusion</strong>, <strong>Progress</strong>, and <strong>Bounded Waiting</strong>, and the hardware primitives alone give you the first two but <em>not</em> the third. The classical problems below are where these requirements stop being abstract and start deciding whether your code deadlocks.</p>
<h3 id="s8-2"><span class="secnum">8.2</span> The Bounded-Buffer (Producer–Consumer) Problem</h3>
<p>You met the producer–consumer setup in Chapters 4 and 7: a producer creates items and inserts them into a shared buffer of fixed size <em>n</em>; a consumer removes them. Two things can go wrong: the producer must not insert into a <em>full</em> buffer, the consumer must not remove from an <em>empty</em> one — and neither may touch the buffer while the other is mid-operation. The semaphore solution handles all three concerns with exactly three semaphores.</p>
<pre class="code"><code>int n;                      /* buffer holds n items          */
semaphore mutex = 1;        /* mutual exclusion on the buffer */
semaphore empty = n;        /* counts EMPTY slots (starts n)  */
semaphore full  = 0;        /* counts FULL slots (starts 0)   */</code></pre>
<p>Read the initial values as an inventory: at the start there are <em>n</em> empty slots and 0 full slots, and the buffer itself is free (mutex = 1). <strong>mutex</strong> is a <em>binary</em> semaphore used for mutual exclusion; <strong>empty</strong> and <strong>full</strong> are <em>counting</em> semaphores used for ordering — the two canonical usage patterns from §7.7, side by side in one problem.</p>
<h4>The producer and consumer processes</h4>
<pre class="code"><code>/* PRODUCER */                          /* CONSUMER */
while (true) {                          while (true) {
    /* produce item in next_produced */     wait(full);
    wait(empty);                            wait(mutex);
    wait(mutex);                            /* remove item to next_consumed */
    /* add next_produced to buffer */       signal(mutex);
    signal(mutex);                          signal(empty);
    signal(full);                           /* consume item in next_consumed */
}                                       }</code></pre>
<p>Trace the symmetry: the producer <em>consumes an empty slot</em> (wait(empty)) and <em>produces a full slot</em> (signal(full)); the consumer does the mirror image. Each process signals the semaphore the <em>other</em> process waits on — that is what makes them cooperate. The mutex wait/signal pair is nested <em>inside</em> the empty/full pair, wrapping only the few lines that actually touch the buffer.</p>
<div class="box exam"><span class="lbl">Exam watch: the order of the two waits is everything</span><p>A classic exam question swaps the producer's two waits: <strong>wait(mutex) before wait(empty)</strong>. Trace it with a full buffer: the producer acquires mutex, then blocks on empty (no empty slots). The consumer now runs wait(full) — fine — then blocks on <strong>wait(mutex)</strong>, which the sleeping producer still holds. Each waits for an event only the other can cause: <strong>deadlock</strong>. Rule to memorize: <em>acquire the resource-counting semaphore first, the mutex last</em> — never sleep on a counting semaphore while holding the mutex. (Swapping the two signals only hurts efficiency; swapping the two waits kills the program.)</p></div>
<div class="box proc"><span class="lbl">Key idea</span><p>Bounded buffer = one binary semaphore for exclusion + two counting semaphores that count <em>empty</em> and <em>full</em> slots. Initial values are the inventory (n, 0), each side waits on what it needs and signals what it creates, and the mutex is always the innermost pair.</p></div>
<h3 id="s8-3"><span class="secnum">8.3</span> The Readers–Writers Problem</h3>
<p>A dataset is shared among concurrent processes of two kinds. <strong>Readers</strong> only read — they never update, so any number of them can be in the dataset <em>simultaneously</em> without harm. <strong>Writers</strong> read and write, so a writer needs the dataset <em>exclusively</em>: no other writer, and no readers either. The problem is to maximize concurrency (let readers overlap) while preserving safety (writers alone).</p>
<div class="box def"><span class="lbl">Definition: Readers–Writers Problem</span><p><strong>In plain English:</strong> Many processes share data; the ones that only look can share freely, but the ones that change it need everyone else out of the room.</p><p><strong>Technical definition:</strong> A synchronization problem in which any number of reader processes may access a shared dataset concurrently, but each writer process requires exclusive access (no concurrent readers or writers).</p><p><strong>Why it matters:</strong> It models real systems directly — databases, file systems, caches — and it motivated the reader–writer locks that Linux and Pthreads provide as first-class primitives.</p></div>
<p>There are two standard fairness policies, and the exam expects you to know both by name. <strong>Reader-</strong><strong>priority</strong> (the "first" readers–writers problem): no reader waits unless a writer has <em>already</em> obtained permission — readers never wait merely because a writer is <em>waiting</em>. <strong>Writer-priority</strong> (the "second" problem): once a writer is ready, it writes as soon as possible — no new readers may start after a writer is queued. Each policy starves the other side: reader-priority can starve writers under a steady stream of readers; writer-priority can starve readers.</p>
<h4>The reader-priority solution — shared data</h4>
<pre class="code"><code>semaphore rw_mutex = 1;   /* readers vs. writers: who owns the dataset  */
semaphore mutex    = 1;   /* protects updates to read_count             */
int read_count     = 0;   /* how many readers are inside right now      */</code></pre>
<p>Keep the two semaphores straight — this is the part students mix up. <strong>rw_mutex</strong> guards the <em>dataset itself</em>; a writer holds it for the whole write, and the reader <em>group</em> holds it collectively while any reader is inside. <strong>mutex</strong> guards only the little integer <strong>read_count</strong>, because read_count++ is itself a critical section (it is exactly the counter++ race from §7.1).</p>
<h4>The writer — trivially simple</h4>
<pre class="code"><code>while (true) {
    wait(rw_mutex);       /* claim exclusive access */
    /* writing is performed */
    signal(rw_mutex);     /* release it             */
}</code></pre>
<h4>The reader — first in locks the door, last out unlocks it</h4>
<pre class="code"><code>while (true) {
    wait(mutex);                 /* permission to update read_count */
    read_count++;
    if (read_count == 1)         /* FIRST reader...                 */
        wait(rw_mutex);          /* ...locks out the writers        */
    signal(mutex);
    /* reading is performed */
    wait(mutex);
    read_count--;
    if (read_count == 0)         /* LAST reader...                  */
        signal(rw_mutex);        /* ...lets the writers back in     */
    signal(mutex);
}</code></pre>
<div class="box ex"><span class="lbl">Worked example: three readers and a writer arrive</span><p>Reader R1 arrives: read_count becomes 1, so R1 (the <em>first</em> reader) does wait(rw_mutex), acquiring the dataset for the reader group. R2 and R3 arrive: read_count becomes 2, then 3; the if fails both times, so they walk straight in — <strong>three readers overlap</strong>, which is the whole point.</p><p>Writer W arrives: wait(rw_mutex) blocks, because the reader group holds it. R1 and R2 leave (read_count 2, then 1) — nothing happens to rw_mutex. R3 leaves: read_count hits 0, so R3 (the <em>last</em> reader) does signal(rw_mutex), and W finally proceeds. Note it is not the first reader who releases — it is whoever happens to leave last.</p></div>
<div class="box warn"><span class="lbl">Misconception</span><p>"Each reader locks rw_mutex on the way in." No — only the <strong>first</strong> reader locks it and only the <strong>last</strong> releases it; the ones in between just increment/decrement the count under mutex. If every reader took rw_mutex, readers would exclude <em>each other</em> and you would have built an ordinary mutex with extra steps, losing all reader concurrency.</p></div>
<div class="box exam"><span class="lbl">Exam watch</span><p>Two favorite short-answers: (1) <em>Why does this version starve writers?</em> Because a continuous overlapping stream of readers keeps read_count above 0 forever, so signal(rw_mutex) never runs and the writer waits indefinitely — reader-priority sacrifices writer <strong>bounded waiting</strong>. (2) <em>What does the inner mutex protect and why is it needed?</em> Only read_count — because ++/-- are not atomic, two readers updating simultaneously could lose an update, and then the first/last-reader tests fire at the wrong times.</p></div>
<p>Because the pattern is so common, many systems ship it pre-built as a <strong>reader–writer lock</strong>: acquire in <em>read</em> mode (shared, many holders) or <em>write</em> mode (exclusive). Pthreads provides pthread_rwlock_t, and Linux provides reader–writer versions of both its spinlocks and its semaphores (§8.5) — useful whenever readers clearly outnumber writers.</p>
<h3 id="s8-4"><span class="secnum">8.4</span> The Dining-Philosophers Problem</h3>
<p>Five philosophers sit around a circular table with one bowl of rice in the middle and <strong>five single chopsticks</strong>, one between each pair of neighbors. A philosopher alternates forever between <em>thinking</em> and <em>eating</em>, never interacting with neighbors directly. To eat, a philosopher needs <strong>both</strong> adjacent chopsticks, picked up <em>one at a time</em>, and releases neither until finished eating. The puzzle: design a protocol so no philosopher starves.</p>
<p>Why anyone cares: it is the cleanest possible model of a set of processes that each need <strong>multiple shared resources</strong> at once. Every deadlock you will ever debug is dining philosophers wearing a costume.</p>
<h4>The obvious semaphore solution — and its fatal flaw</h4>
<pre class="code"><code>semaphore chopstick[5];        /* all initialized to 1 */
/* philosopher i */
while (true) {
    wait(chopstick[i]);              /* pick up left  */
    wait(chopstick[(i + 1) % 5]);    /* pick up right */
    /* eat for a while */
    signal(chopstick[i]);            /* put down left  */
    signal(chopstick[(i + 1) % 5]);  /* put down right */
    /* think for a while */
}</code></pre>
<div class="box exam"><span class="lbl">Exam watch: "Is this solution correct?"</span><p>This is asked verbatim. The answer: it guarantees mutual exclusion on each chopstick (no two neighbors eat at once), <strong>but it can deadlock</strong>. If all five philosophers get hungry simultaneously and each grabs their <em>left</em> chopstick, all five then block on wait(chopstick[(i+1) % 5]) — every chopstick is held, every philosopher waits for a resource held by their neighbor, and the circular wait never breaks. Note this is precisely the four deadlock conditions of Chapter 9 in action: mutual exclusion (a chopstick has one holder), hold-and-wait (hold left, wait for right), no preemption (you cannot snatch a chopstick), circular wait (the ring).</p></div>
<h4>Standard fixes for the deadlock</h4>
<ul><li><strong>Admit at most four</strong> philosophers to the table at once (a counting semaphore initialized to 4) — with five chopsticks and four diners, someone can always get both.</li><li><strong>Break the symmetry:</strong> odd-numbered philosophers pick up left-then-right, even-numbered pick up right-then-left — the circular wait cannot form. (This is the resource-ordering idea formalized in §9.10.)</li><li><strong>All-or-nothing:</strong> allow a philosopher to pick up chopsticks only if <em>both</em> are available, done inside a critical section — which is exactly what the monitor solution below implements.</li></ul>
<h4>The monitor solution</h4>
<p>The monitor tracks each philosopher's <strong>state</strong> — THINKING, HUNGRY, or EATING — and grants chopsticks in one atomic decision instead of two separate grabs. A philosopher may move to EATING only when <em>neither neighbor</em> is EATING. Each philosopher has a condition variable self[i] to wait on when hungry but blocked.</p>
<pre class="code"><code>monitor DiningPhilosophers
{
    enum {THINKING, HUNGRY, EATING} state[5];
    condition self[5];
    void pickup(int i) {
        state[i] = HUNGRY;
        test(i);                     /* try to eat right now      */
        if (state[i] != EATING)
            self[i].wait();          /* otherwise sleep until fed */
    }
    void putdown(int i) {
        state[i] = THINKING;
        test((i + 4) % 5);           /* maybe left neighbor can eat now  */
        test((i + 1) % 5);           /* maybe right neighbor can eat now */
    }
    void test(int i) {
        if ((state[(i + 4) % 5] != EATING) &amp;&amp;    /* left not eating  */
            (state[i] == HUNGRY) &amp;&amp;              /* i wants to eat   */
            (state[(i + 1) % 5] != EATING)) {    /* right not eating */
            state[i] = EATING;
            self[i].signal();        /* wake i if it was waiting */
        }
    }
    initialization_code() {
        for (int i = 0; i &lt; 5; i++)
            state[i] = THINKING;
    }
}</code></pre>
<p>A philosopher uses it as: <strong>DiningPhilosophers.pickup(i); ... eat ... ; DiningPhilosophers.putdown(i);</strong> — and the monitor's built-in mutual exclusion (only one process active inside at a time, §7.8) makes each pickup/putdown decision atomic. The clever part is putdown(): a finishing philosopher runs test() <em>on behalf of both neighbors</em>, which is what wakes a hungry neighbor whose earlier test() failed. Note (i + 4) % 5 is just "left neighbor" written without negative numbers — it equals (i − 1) mod 5.</p>
<div class="box warn"><span class="lbl">Misconception</span><p>"The monitor solution fully solves dining philosophers." Not quite — it eliminates <strong>deadlock</strong> (chopstick pairs are granted atomically, so the hold-and-wait on single chopsticks never happens) <strong>but starvation is still possible</strong>: an unlucky philosopher can wait forever while their two neighbors alternate eating, since nothing guarantees the waiter is ever chosen. Deadlock-free and starvation-free are different guarantees — the exam loves this distinction.</p></div>
<div class="box proc"><span class="lbl">Key idea</span><p>One semaphore per chopstick + grab-left-then-right = possible deadlock (all five hold left). Fixes all break one deadlock condition: limit to four diners, order the grabs asymmetrically, or grant both chopsticks atomically. The monitor does the last one via state[] and test(), giving no deadlock — but still possible starvation.</p></div>
<h3 id="s8-5"><span class="secnum">8.5</span> Kernel Synchronization: Windows and Linux</h3>
<p>The classical problems are solved with idealized semaphores and monitors. Real kernels have to build those tools out of what the hardware offers, and the design differs by OS and by uniprocessor vs. multiprocessor — a distinction that echoes §7.2's point that disabling interrupts only works on one core.</p>
<h4>Windows</h4>
<ul><li>On <strong>uniprocessor</strong> systems, the kernel protects access to global resources with <strong>interrupt masks</strong> — temporarily masking the interrupts whose handlers touch the same resource.</li><li>On <strong>multiprocessor</strong> systems it uses <strong>spinlocks</strong>, and to keep spin times short, <strong>a thread holding a spinlock is never preempted</strong> — preempting a spinlock holder would leave other CPUs spinning uselessly on a lock nobody is running to release.</li><li>For user-land code, Windows provides <strong>dispatcher objects</strong>, a single umbrella mechanism that can behave as a <strong>mutex</strong>, <strong>semaphore</strong>, <strong>event</strong> (acts like a condition variable), or <strong>timer</strong> (notifies one or more threads when its time expires).</li><li>Every dispatcher object is in one of two states: <strong>signaled</strong> — the object is available, a thread acquiring it will not block — or <strong>non-signaled</strong> — the object is not available, and an acquiring thread blocks until the object becomes signaled.</li></ul>
<h4>Linux</h4>
<ul><li><strong>Before kernel 2.6</strong>, Linux implemented short critical sections by <strong>disabling interrupts</strong> (and disabling kernel preemption). From <strong>version 2.6 on, the kernel is fully preemptive</strong> — a task can be preempted even while running in kernel mode, so real locking is required.</li><li>Linux provides <strong>mutex locks, semaphores, spinlocks, and atomic integers</strong> — plus <strong>reader–writer versions</strong> of spinlocks and semaphores (the readers–writers problem of §8.3, shipped as a primitive).</li><li>On <strong>single-CPU</strong> systems a spinlock makes no sense (spinning waits for another CPU that does not exist), so spinlock acquire/release is replaced by <strong>disabling and enabling kernel preemption</strong>.</li></ul>
<h4>Linux atomic variables</h4>
<p>The type <strong>atomic_t</strong> is an integer whose operations are guaranteed indivisible without an explicit lock — the "atomic variables" of §7.5 as a concrete kernel API. Given atomic_t counter; and int value;, the basic operations behave as follows:</p>
<div class="tw"><table><thead><tr><th>Operation</th><th>Effect</th><th>Value of counter</th></tr></thead><tbody><tr><td>atomic_set(&amp;counter, 5);</td><td>counter = 5, atomically</td><td>5</td></tr><tr><td>atomic_add(10, &amp;counter);</td><td>counter = counter + 10</td><td>15</td></tr><tr><td>atomic_sub(4, &amp;counter);</td><td>counter = counter − 4</td><td>11</td></tr><tr><td>atomic_inc(&amp;counter);</td><td>counter = counter + 1</td><td>12</td></tr><tr><td>value = atomic_read(&amp;counter);</td><td>value = counter (atomically read)</td><td>12</td></tr></tbody></table></div>
<p>Atomic integers are ideal when the shared data is <em>just a counter</em> (reference counts, statistics): they are far cheaper than taking a lock. The moment an update involves more than one variable, or any decision logic, you are back to locks — atomicity of single operations does not compose into atomicity of sequences (the same lesson as the CAS discussion in §7.5).</p>
<h3 id="s8-6"><span class="secnum">8.6</span> POSIX Synchronization</h3>
<p>The POSIX API (Pthreads and friends) is what you program against on UNIX, Linux, and macOS — and what <strong>Homework 3 requires</strong>. It provides three tools: <strong>mutex locks</strong>, <strong>semaphores</strong>, and <strong>condition variables</strong>. POSIX is a specification for user-level code; underneath, each OS implements these with the kernel machinery of §8.5.</p>
<h4>POSIX mutex locks</h4>
<pre class="code"><code>#include &lt;pthread.h&gt;
pthread_mutex_t mutex;
pthread_mutex_init(&amp;mutex, NULL);   /* create + initialize; NULL = default attrs */
pthread_mutex_lock(&amp;mutex);         /* acquire (blocks if unavailable) */
/* critical section */
pthread_mutex_unlock(&amp;mutex);       /* release */</code></pre>
<h4>POSIX semaphores — named vs. unnamed</h4>
<p>POSIX provides <strong>two versions</strong> of semaphores. <strong>Named</strong> semaphores have a filesystem-style name and therefore can be shared by <strong>unrelated processes</strong> — two programs that have never met can both sem_open("SEM", ...) and synchronize. <strong>Unnamed</strong> semaphores live in a variable, so other processes can only get them by inheritance across <strong>fork()</strong> (or via placement in shared memory).</p>
<pre class="code"><code>#include &lt;semaphore.h&gt;
/* NAMED: usable by unrelated processes */
sem_t *sem;
sem = sem_open("SEM", O_CREAT, 0666, 1);   /* create, perms 0666, initial value 1 */
/* UNNAMED: shared only via fork() or shared memory */
sem_t sem2;
sem_init(&amp;sem2, 0, 1);   /* 0 = shared between THREADS of this process; 1 = initial
value */
/* Both versions are used identically afterwards: */
sem_wait(sem);    /* = wait():   acquire  */
/* critical section */
sem_post(sem);    /* = signal(): release  */</code></pre>
<div class="box exam"><span class="lbl">Exam watch</span><p>Vocabulary mapping trips people up: POSIX spells wait() as <strong>sem_wait()</strong> and signal() as <strong>sem_post()</strong> — there is no function called sem_signal. And the named-vs-unnamed distinction is a ready-made short answer: <em>named</em> → unrelated processes via a string name; <em>unnamed</em> → related processes only, inherited through fork(). For Homework 3 (separate processes sharing a file), named semaphores are the natural fit.</p></div>
<h4>POSIX condition variables</h4>
<p>C has no monitors, so a POSIX condition variable does not live inside one — instead it is <strong>explicitly paired with a pthread mutex</strong>, and <em>you</em> supply the mutual exclusion the monitor would have provided. The waiting thread must hold the mutex when it calls pthread_cond_wait(), which atomically releases the mutex and sleeps; when signaled, it reacquires the mutex before returning.</p>
<pre class="code"><code>#include &lt;pthread.h&gt;
pthread_mutex_t mutex;
pthread_cond_t  cond_var;
pthread_mutex_init(&amp;mutex, NULL);
pthread_cond_init(&amp;cond_var, NULL);
/* WAITING side: sleep until a == b */          /* SIGNALING side */
pthread_mutex_lock(&amp;mutex);                     pthread_mutex_lock(&amp;mutex);
while (a != b)                                  a = b;
    pthread_cond_wait(&amp;cond_var, &amp;mutex);       pthread_cond_signal(&amp;cond_var);
pthread_mutex_unlock(&amp;mutex);                   pthread_mutex_unlock(&amp;mutex);</code></pre>
<div class="box warn"><span class="lbl">Misconception</span><p>"You can test the condition with an if." Always a <strong>while</strong>. Between the moment a waiter is signaled and the moment it actually reacquires the mutex and runs, another thread may have slipped in and falsified the condition again (or the wait may return spuriously). The while re-checks on every wakeup; an if would proceed on a stale condition. This single line is one of the most-tested details in POSIX synchronization.</p></div>
<h3 id="s8-7"><span class="secnum">8.7</span> Java Synchronization</h3>
<p>Java bakes synchronization into the language. It offers <strong>Java monitors</strong> (via the synchronized keyword), plus library classes for <strong>reentrant locks</strong> (mutex locks), <strong>semaphores</strong>, and <strong>condition variables</strong>. The monitor mechanism is the part the lecture develops, because it is the closest thing in mainstream languages to Chapter 7's monitor concept.</p>
<h4>Every object is a monitor</h4>
<ul><li><strong>Every Java object is associated with a single lock.</strong></li><li>If a method is declared <strong>synchronized</strong>, a calling thread must <strong>own that object's lock</strong> to enter; the lock is acquired on entry and released when the owning thread exits the method.</li><li>If the lock is owned by another thread, the caller <strong>blocks</strong> and is placed in the object's <strong>entry set</strong> — the set of threads waiting for the lock to become available.</li></ul>
<h4>The entry set and the wait set</h4>
<p>Each object actually has <em>two</em> waiting rooms, and telling them apart is the standard exam question. The <strong>entry set</strong> holds threads waiting <em>to acquire the lock</em> (they tried to enter a synchronized method that was busy). The <strong>wait set</strong> holds threads that <em>had</em> the lock and gave it up by calling <strong>wait()</strong> because some condition they needed was false. When a thread calls wait(): (1) it <strong>releases the object's lock</strong>, (2) its state is set to <strong>blocked</strong>, (3) it is placed in the <strong>wait set</strong>. A call to <strong>notify()</strong> picks one thread from the wait set and moves it to the entry set, where it competes to reacquire the lock.</p>
<h4>Bounded buffer in Java — the full circle</h4>
<pre class="code"><code>public class BoundedBuffer&lt;E&gt; {
    private static final int BUFFER_SIZE = 5;
    private int count, in, out;
    private E[] buffer;
    public BoundedBuffer() {
        count = 0; in = 0; out = 0;
        buffer = (E[]) new Object[BUFFER_SIZE];
    }
    /* Producers call this */
    public synchronized void insert(E item) {
        while (count == BUFFER_SIZE) {
            try { wait(); }                  /* buffer full: sleep */
            catch (InterruptedException ie) {}
        }
        buffer[in] = item;
        in = (in + 1) % BUFFER_SIZE;
        count++;
        notify();                            /* wake a waiting consumer */
    }
    /* Consumers call this */
    public synchronized E remove() {
        E item;
        while (count == 0) {
            try { wait(); }                  /* buffer empty: sleep */
            catch (InterruptedException ie) {}
        }
        item = buffer[out];
        out = (out + 1) % BUFFER_SIZE;
        count--;
        notify();                            /* wake a waiting producer */
        return item;
    }
}</code></pre>
<p>Compare this with §8.2: <strong>synchronized</strong> replaces the mutex semaphore, and the <strong>wait()/notify() loops on count</strong> replace the empty/full counting semaphores. Same problem, one buffer class, no explicit semaphores — the monitor absorbs them. Note the wait() sits inside a <strong>while</strong>, for exactly the reason given in the POSIX misconception above, and notify() at the end of each method plays the role of putdown()'s neighbor tests in §8.4: the state change might be exactly what a sleeping thread was waiting for.</p>
<div class="box proc"><span class="lbl">Key idea</span><p>Four platforms, one toolbox. Windows: interrupt masks (uniprocessor), spinlocks that are never preempted (multiprocessor), dispatcher objects in signaled/non-signaled states. Linux: fully preemptive since 2.6, with mutexes, semaphores, spinlocks, atomic_t, and reader–writer variants — spinlocks become preemption-disabling on one CPU. POSIX: mutexes, named/unnamed semaphores (sem_wait/sem_post), condition variables paired with a mutex and tested in a while. Java: every object is a monitor with one lock, an entry set (waiting for the lock) and a wait set (called wait()); synchronized + wait/notify rebuild the bounded buffer with no explicit semaphores.</p></div>
</section>
<section class="lecture prose" id="ch9">
<div class="plate"><span class="num" aria-hidden="true">09</span><p class="ttl">Deadlocks</p><p class="src">Chapter 9</p></div>
<h3 id="s9-1"><span class="secnum">9.1</span> Big Picture and System Model</h3>
<p>Chapter 8 ended with the dining philosophers frozen, each clutching one chopstick. This chapter is the full theory of that freeze: what deadlock <em>is</em>, the four conditions that must all hold for it to occur, how to draw it (resource-allocation graphs), how to detect it (graph reduction, cycles, and knots), and the three strategic responses — <strong>detection and recovery</strong>, <strong>avoidance</strong> (the Banker's Algorithm), and <strong>prevention</strong>. Deadlock received formal treatment early — Dijkstra (1968) and Holt (1971, 1972) — because it is a fundamental problem of concurrent systems, not an edge case.</p>
<h4>The system model</h4>
<p>A system consists of resource types <strong>R₁, R₂, …, Rₘ</strong> — CPU cycles, memory space, I/O devices — where each type Rᵢ has <strong>Wᵢ instances</strong> (e.g., two identical printers = one type, two instances). Every process uses a resource in the same three-step pattern, and all deadlock theory hangs off step one and step three:</p>
<ul><li><strong>Request</strong> — ask the OS for the resource; if it cannot be granted immediately, the process waits.</li><li><strong>Use</strong> — operate on the resource (print, write memory, hold the lock).</li><li><strong>Release</strong> — give it back so others can use it.</li></ul>
<h4>Reusable vs. consumable resources</h4>
<p>The lecture makes a distinction most textbooks skip, and it matters later (§9.5–§9.6): resources come in two fundamentally different kinds.</p>
<div class="tw"><table><thead><tr><th>Kind</th><th>Definition</th><th>Examples</th></tr></thead><tbody><tr><td><strong>Reusable</strong></td><td>A fixed number of units; each unit is either available or allocated to exactly one process, and is returned intact after use.</td><td>Devices (printers, tapes, disks), memory, service routines / critical sections</td></tr><tr><td><strong>Consumable</strong></td><td>Units are produced and consumed dynamically — the count varies over time; a consumed unit ceases to exist.</td><td>Messages, signals, interrupts / events, dynamic data structures</td></tr></tbody></table></div>
<p>A lock is reusable — you give it back. A message is consumable — receiving it destroys it, and the sender can mint new ones. Deadlock can involve either kind (Example 3 below deadlocks on messages alone), but the clean classical theory is stated for reusable resources; consumable resources complicate detection in a specific way we will hit in §9.6.</p>
<h3 id="s9-2"><span class="secnum">9.2</span> Deadlock Defined — and Its Look-Alike, Livelock</h3>
<div class="box def"><span class="lbl">Definition: Deadlock</span><p><strong>In plain English:</strong> A group of processes stuck waiting on each other in a circle, where nobody can move because the thing each one needs is held by another member of the stuck group.</p><p><strong>Technical definition:</strong> A set of processes is deadlocked when every process in the set is blocked waiting for an event that can be caused only by another process in the set. Equivalently: the permanent blocking of a set of processes that either compete for system resources or communicate with each other.</p><p><strong>Why it matters:</strong> Deadlocked processes never run again without outside intervention — no error is raised, no timeout fires by default; the system just silently stops making progress on those processes.</p></div>
<div class="box def"><span class="lbl">Definition: Livelock</span><p><strong>In plain English:</strong> Everyone is moving but nobody is getting anywhere — like two people in a hallway who keep stepping the same direction to let each other pass.</p><p><strong>Technical definition:</strong> A liveness failure in which a thread continuously attempts an action that fails; the threads are <em>not blocked</em>, but make no useful progress.</p><p><strong>Why it matters:</strong> Livelock is the trap hiding inside naive deadlock fixes — e.g., philosophers who politely put their chopstick down and immediately retry <em>in lockstep</em> forever. It burns CPU while deadlock does not, yet delivers the same zero progress.</p></div>
<div class="box exam"><span class="lbl">Exam watch: deadlock vs. livelock vs. starvation</span><p>Three distinct liveness failures; be able to separate them in one sentence each. <strong>Deadlock:</strong> blocked forever, waiting in a cycle — no one runs. <strong>Livelock:</strong> running constantly, retrying and failing — no one progresses. <strong>Starvation:</strong> the <em>system</em> makes progress but one unlucky process is indefinitely postponed (the waiting philosopher of §8.4, the writer of §8.3). All deadlocked processes are starved; starved processes are usually not deadlocked.</p></div>
<h4>Three canonical deadlock examples (know all three)</h4>
<p>The lecture's three examples are chosen to show deadlock arising from different resource kinds — the third one has no devices or locks in it at all.</p>
<ul><li><strong>Example 1 — circular resource requests.</strong> P1: request(Disk) → request(Tape) → release both. P2: request(Tape) → request(Disk) → release both. Interleave the first steps: P1 holds the disk, P2 holds the tape, and each now requests what the other holds → deadlock.</li><li><strong>Example 2 — memory blocks.</strong> 100 blocks total. P1: request(40) → request(40). P2: request(30) → request(50). Both first requests are granted (70 used, 30 free); now P1 needs 40 more and P2 needs 50 more, and 30 free satisfies neither → deadlock. Note there is no cycle of <em>named</em> resources here — they deadlock on quantities of one resource.</li><li><strong>Example 3 — message exchange.</strong> P1: receive(P2) → send(P2). P2: receive(P1) → send(P1). Each blocks receiving a message the other will only send <em>after</em> receiving one → deadlock on <strong>consumable</strong> resources.</li></ul>
<h3 id="s9-3"><span class="secnum">9.3</span> A Formal Look: States, Blocking, and Safety</h3>
<p>To reason precisely, the lecture models execution as a <strong>state space</strong>: Σ is the set of all possible resource-allocation states, and processes' actions (request, acquire, release) are transitions between states. The two-process disk/tape program of Example 1 generates a grid of states — P1's progress on one axis, P2's on the other — and tracing it shows <em>every</em> path eventually funnels into total deadlock, which is why the slide annotates that state diagram with "there are no safe/secure states!"</p>
<div class="box def"><span class="lbl">Definition: Blocked, Deadlocked, Total Deadlock, Safe State</span><p><strong>Blocked:</strong> Process Pᵢ is blocked in state S if no action <em>by Pᵢ</em> can change the state — Pᵢ has no move.</p><p><strong>Deadlocked:</strong> Pᵢ is deadlocked in S if it is blocked in S <strong>and in every state T reachable from S</strong> — no future sequence of other processes' actions can ever unblock it. (Merely blocked is temporary; deadlocked is forever.)</p><p><strong>Total deadlock:</strong> S is a total deadlock state if <em>all</em> processes are deadlocked in S.</p><p><strong>Safe (secure) state:</strong> S is safe if neither S nor any state reachable from S is a deadlock state — from a safe state, deadlock is unreachable no matter what happens.</p><p><strong>Why it matters:</strong> "Safe state" is the load-bearing concept of deadlock avoidance (§9.8): the Banker's Algorithm is nothing more than a rule that refuses to leave the set of safe states.</p></div>
<div class="box warn"><span class="lbl">Misconception</span><p>"Blocked and deadlocked are the same thing." No — blocked is a snapshot, deadlocked is a destiny. A process waiting for a printer is blocked but not deadlocked if the printer will eventually be released. It is deadlocked only if in <em>every reachable future</em> it stays blocked. This quantifier ("in every state reachable from S") is exactly what makes deadlock detection require search rather than a glance.</p></div>
<h3 id="s9-4"><span class="secnum">9.4</span> The Four Necessary Conditions — MEMORIZE</h3>
<p>Deadlock can arise <strong>only if all four</strong> of the following conditions hold simultaneously. They are necessary conditions: each one is a load-bearing wall, and knocking out <em>any single one</em> makes deadlock impossible — which is precisely the design space of prevention (§9.10).</p>
<div class="tw"><table><thead><tr><th>#</th><th>Condition</th><th>What it means</th></tr></thead><tbody><tr><td>1</td><td><strong>Mutual Exclusion</strong></td><td>At least one resource is held in a non-sharable mode — held exclusively, unavailable to others while held.</td></tr><tr><td>2</td><td><strong>Hold and Wait</strong> (partial allocation)</td><td>A process holds at least one resource while waiting to acquire additional resources held by others.</td></tr><tr><td>3</td><td><strong>No Preemption</strong></td><td>Resources cannot be forcibly taken away; only the holding process may release them, voluntarily, when finished.</td></tr><tr><td>4</td><td><strong>Circular Wait</strong></td><td>A circular chain of processes exists — P₀ waits for a resource held by P₁, P₁ for one held by P₂, …, Pₙ for one held by P₀.</td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch</span><p>"Define the four necessary conditions that characterize deadlock" is a stated chapter objective — expect it verbatim, worth easy points if you can produce all four names <em>and</em> one-line definitions. Two follow-ups to prepare: (1) <em>Necessary, not sufficient</em> — all four can hold and the system may still avoid deadlock (see the cycle-without-deadlock graphs of §9.5); the four holding makes deadlock <em>possible</em>, not certain. (2) <em>Violating any ONE condition guarantees a deadlock-free system</em> — the sentence the slide flags with a lightning bolt.</p><p>Map them onto the dining philosophers for an instant example bank: chopsticks are exclusive (1), a philosopher holds left while waiting for right (2), you cannot snatch a chopstick (3), and five of them wait in a ring (4).</p></div>
<h3 id="s9-5"><span class="secnum">9.5</span> Resource-Allocation Graphs</h3>
<p>Deadlocks are easiest to see when drawn. A <strong>resource-allocation graph</strong> is a directed graph G = (V, E) whose vertex set is the union of <strong>process nodes</strong> (drawn as circles: P₁, P₂, …) and <strong>resource nodes</strong> (drawn as rectangles, with a dot inside for each <em>instance</em> of that type). Three kinds of edges encode who wants what and who has what:</p>
<div class="tw"><table><thead><tr><th>Edge</th><th>Direction</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>Request edge</strong></td><td>Pᵢ → Rⱼ</td><td>Process Pᵢ has requested an instance of Rⱼ and is waiting for it.</td></tr><tr><td><strong>Assignment edge</strong></td><td>Rⱼ → Pᵢ</td><td>An instance of Rⱼ is currently allocated to Pᵢ. (Drawn from the specific instance dot.)</td></tr><tr><td><strong>Producer edge</strong></td><td>Rⱼ ↔ producing P</td><td>Connects a <em>consumable</em> resource to the process that produces its units — only exists in the general (consumable) model.</td></tr></tbody></table></div>
<h4>How the graph evolves — request, acquire, release</h4>
<ul><li><strong>Request:</strong> any process with no outstanding requests may request units of any resources; add a request edge Pᵢ → Rⱼ per unit requested. For reusable resources, the requested units must not exceed the total units of that type.</li><li><strong>Acquire:</strong> if the requested number of units is available, the request is granted — <strong>reverse</strong> each request edge into an assignment edge Rⱼ → Pᵢ (reusable). For consumable resources: <em>remove</em> the request edges and decrement the unit count — the units are consumed, not held.</li><li><strong>Release:</strong> remove the assignment edges and increment the available count (reusable). A producer can <em>create</em> units of its consumable resource, incrementing its count.</li></ul>
<h4>The three cycle facts (the most-quoted slide in the chapter)</h4>
<ul><li><strong>No cycle in the graph → no deadlock.</strong> Ever. A cycle is a <em>necessary</em> condition — it is condition 4 (circular wait) made visible.</li><li><strong>Cycle + every resource type has a single instance → deadlock.</strong> With one instance each, the cycle cannot be broken by an alternate instance, so the cycle is also <em>sufficient</em>.</li><li><strong>Cycle + some resource types have multiple instances → *maybe* deadlock.</strong> Some other process outside the cycle may hold an instance it will release, breaking the cycle. The graph must be analyzed (reduced, §9.6) to decide.</li></ul>
<div class="box ex"><span class="lbl">Worked example: a cycle that is not a deadlock</span><p>Take R with two instances. P₁ holds one instance of R and requests S; P₂ holds S and requests R — that is a cycle P₁ → S → P₂ → R → P₁. But suppose P₃, <em>outside the cycle</em>, holds R's second instance and requests nothing. P₃ will finish and release its instance of R; P₂'s request is then granted, P₂ finishes and releases S, and P₁ proceeds. The cycle existed, the deadlock never did — this is exactly the "graph with a cycle but no deadlock" figure from the slides, and it is why multiple instances demote a cycle from proof to suspicion.</p></div>
<div class="box proc"><span class="lbl">Key idea</span><p>Draw it: circles request rectangles (Pᵢ → Rⱼ), rectangles are assigned to circles (Rⱼ → Pᵢ). Then read it: no cycle → safe; cycle with single-instance resources → deadlocked; cycle with multi-instance resources → run the detection algorithm.</p></div>
<h3 id="s9-6"><span class="secnum">9.6</span> Deadlock Detection: Graph Reduction, Cycles, and Knots</h3>
<p><strong>Deadlock detection</strong> answers one question: given the current resource graph, <em>is this state deadlocked or not?</em> The tool is <strong>graph reduction</strong> — repeatedly simulating "this process could finish" and erasing it, then seeing who is left. To state the results precisely, the lecture first recalls some graph-theory vocabulary.</p>
<h4>Graph-theory definitions you need</h4>
<ul><li><strong>Sink:</strong> a node z with no outgoing edges — it wants nothing.</li><li><strong>Isolated node:</strong> no edges in or out at all.</li><li><strong>Path:</strong> a sequence of ≥ 2 nodes (a, b, …, z) where each consecutive pair is an edge in E.</li><li><strong>Cycle:</strong> a path whose first and last vertices are the same.</li><li><strong>Reachable set of z, reachable(z):</strong> all nodes b such that a path leads from z to b.</li><li><strong>Knot K:</strong> a non-empty set of nodes such that <strong>for every node z in K, reachable(z) = K</strong> — from anywhere in the knot you can reach exactly the knot and nothing else. You can wander inside forever, but every road out leads back in.</li></ul>
<p>Facts about knots worth writing on your cheat sheet: in a directed graph, <strong>a knot implies a cycle</strong> (but not vice versa); <strong>no node in a knot is a sink</strong> and <strong>no path leads from a knot node to a sink</strong> — a sink would be an exit, and knots have none; and a digraph is knot-free <strong>iff</strong> every node is a sink or has a path to a sink.</p>
<h4>The reduction algorithm — reusable-resource variant</h4>
<pre class="code"><code>Given resource graph G:
  repeat until no unblocked process remains:
      select any unblocked process p        /* its requests can all be granted */
      remove p and ALL of its request and assignment edges
If G is completely reducible (all processes removed)  -&gt;  state is NOT deadlocked
If G is NOT completely reducible                      -&gt;  state IS a deadlock state;
                                                          the irreducible processes
are the deadlocked ones</code></pre>
<p>The intuition: removing an unblocked process simulates <em>"let it run to completion and hand everything back."</em> Its released resources may unblock others, who get removed next, and so on. Whoever can never be removed is waiting on something that will never appear — deadlocked. For reusable-only systems the slide adds a reassuring note: <strong>all reduction sequences of a given graph lead to the same final graph</strong>, so you may erase eligible processes in any order you like.</p>
<h4>…but is that true in general? (the consumable-resource wrinkle)</h4>
<p>The lecture then sets a trap: consider P₁ and P₂ where P₁ requests one unit each of R₁ and R₂, P₂ requests one unit each of R₁ and R₂ — and R₁ is <em>consumable</em> with <strong>P₁ as its producer</strong>. Reduce by P₁ first: as producer, P₁ sets R₁'s count to ∞ on removal, P₂'s requests become grantable, and the graph reduces completely. Reduce by P₂ first: P₂ <em>consumes</em> the available units, and the reduction can strand P₁. Same graph, different orders, different verdicts: <strong>when consumable resources are involved, reducibility may be order-dependent.</strong> Is the textbook wrong? No — it simply neglects the more general case; its any-order claim is stated (and true) for reusable resources only.</p>
<h4>The general reduction algorithm and its exact guarantees</h4>
<pre class="code"><code>For a non-isolated, unblocked process Pi:
  Step 1: delete every request edge (Pi, Rj);
          if Rj is consumable, decrement rj by the number of deleted requests
  Step 2: delete every assignment/producer edge (Rj, Pi);
          if Rj is reusable,   increment rj (units returned)
          if Rj is consumable and Pi is its producer, set rj = INFINITY</code></pre>
<ul><li><strong>Theorem.</strong> Pᵢ is <em>not</em> deadlocked in state S <strong>iff</strong> there exists <em>a</em> reduction sequence that leaves Pᵢ unblocked. (Existence of one good order — you may have to find it.)</li><li><strong>Corollary.</strong> If G is completely reducible, the state is not deadlocked. <strong>The converse is NOT true in general</strong> — a state can be non-deadlocked and yet not completely reducible when consumable resources are in play.</li></ul>
<h4>Expediency — and when a knot means deadlock</h4>
<div class="box def"><span class="lbl">Definition: Expedient System</span><p><strong>In plain English:</strong> A system that never sits on a grantable request — if it can say yes, it says yes immediately.</p><p><strong>Technical definition:</strong> A system is expedient if all satisfiable resource requests are granted immediately; consequently the resource graph never contains a satisfiable request edge, and every process with an outstanding request is blocked.</p><p><strong>Why it matters:</strong> Real OSes are expedient (why would you delay a grantable request?), and expediency buys a powerful shortcut: <strong>in an expedient system, a knot is a *sufficient* condition for deadlock.</strong></p></div>
<p>Putting the pieces together gives the chapter's central chain of implications — learn it as four one-liners:</p>
<ul><li><strong>deadlock</strong> ⟹ <strong>cycle</strong> — a cycle is <em>necessary</em>; no cycle, no deadlock.</li><li><strong>cycle</strong> ⟹ <strong>deadlock is FALSE in general</strong> — a cycle alone is not sufficient (multi-instance escape, §9.5).</li><li><strong>expedient + knot</strong> ⟹ <strong>deadlock</strong> — a knot is <em>sufficient</em> under expediency; nobody in the knot can reach a sink, so nobody can ever finish.</li><li><strong>deadlock</strong> ⟹ <strong>knot is FALSE</strong> — a knot is not <em>necessary</em>; systems can deadlock without forming a full knot.</li></ul>
<p>Practical reading: <strong>cycle detection is the fast first check</strong> (necessary condition — no cycle, stop worrying); <strong>knot analysis gives the stronger guarantee</strong> when the system is expedient.</p>
<h4>Two special cases where detection becomes easy</h4>
<div class="tw"><table><thead><tr><th>Restriction</th><th>What simplifies</th><th>Detection result</th></tr></thead><tbody><tr><td><strong>Single-unit resources</strong> (each resource class has exactly one unit)</td><td>Collapse the graph to a <strong>wait-for graph</strong>: edge Pᵢ → Pⱼ means Pᵢ waits for a resource Pⱼ holds.</td><td><strong>Cycle</strong> ⟺ <strong>deadlock</strong> — cycle becomes sufficient as well as necessary; detection reduces to cycle detection.</td></tr><tr><td><strong>Single-unit requests</strong> (each process may have at most one outstanding request, for one unit) in an expedient system</td><td>Any two reduction sequences reach the same irreducible state; Pᵢ is not deadlocked iff Pᵢ is a sink or on a path to a sink.</td><td><strong>Knot</strong> ⟺ <strong>deadlock</strong> — knot detection is both necessary and sufficient. Proof sketch that no knot ⟹ reducible: a knot-free graph has a sink (or paths to sinks); by expediency that sink must be a <em>process</em> (a resource with free units would have granted someone), and a sink process is unblocked — reduce by it and repeat.</td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch</span><p>Keep the quantifiers straight — this is where points are lost. Cycle: necessary always, sufficient only with single-instance/single-unit resources. Knot: sufficient only with expediency, necessary only in the single-unit-request case. And the order-dependence question has a two-word trigger: the moment a problem says <strong>"consumable resources,"</strong> answer that reduction order may matter and that complete reducibility is no longer equivalent to freedom from deadlock — only the one-directional corollary survives.</p></div>
<h3 id="s9-7"><span class="secnum">9.7</span> Recovery from Deadlock</h3>
<p>Detection without recovery is just bad news. Once a deadlock is found, the system must break it, and there are exactly <strong>two approaches: process termination and resource preemption.</strong> Both are expensive, and the lecture is blunt about why: time is spent detecting and removing the deadlock; the deadlocked processes have already consumed resources; resource <em>state</em> may have been changed and must be rolled back; and other processes that ran during the deadlock may need to be undone too — a <strong>cascading rollback</strong>.</p>
<h4>Approach 1 — process termination</h4>
<ul><li>Terminating <strong>all</strong> deadlocked processes at once certainly works — and is prohibitively expensive: all their partial work is lost.</li><li><strong>Incremental termination:</strong> kill deadlocked processes <strong>one at a time</strong>, re-running detection after each, until the deadlock is eliminated.</li><li>Choosing the victim order weighs: the <strong>priority</strong> of the process, the <strong>cost of restarting</strong> it, and its <strong>current state</strong> (how far along it is, what it holds).</li></ul>
<div class="box def"><span class="lbl">Definition: Idempotency (and why termination is dangerous)</span><p><strong>In plain English:</strong> An action is idempotent if doing it twice is the same as doing it once — safe to redo.</p><p><strong>Technical definition:</strong> An execution sequence is idempotent if re-executing it (after partial completion) yields the same final state with no additional side effects.</p><p><strong>Why it matters:</strong> Process execution sequences are <strong>generally NOT idempotent</strong> — a process that has printed a page, sent a message, or moved money cannot simply be killed and restarted without repeating side effects. Interleaving with other processes makes this even harder. This is the fundamental reason "just restart it" is not a free recovery strategy.</p></div>
<h4>Approach 2 — resource preemption</h4>
<ul><li><strong>Direct preemption:</strong> the system temporarily deallocates a contested resource from its holder so others can proceed. Only a few resource types can be handled this way <em>transparently</em> (CPU is trivially preemptible; a half-written tape is not).</li><li><strong>Process rollback:</strong> the system preempts <em>indirectly</em> by rolling a process back to an earlier point, releasing everything acquired since. Requires <strong>checkpoints</strong> — periodic snapshots of process state/history. Silver lining: checkpointing also provides implicit <strong>fault tolerance</strong>.</li><li><strong>Cascading rollback:</strong> rolling back one process can force rollbacks of processes that interacted with it, and interleaving makes the cascade difficult to bound — this is the dominant cost of rollback-based recovery.</li></ul>
<h3 id="s9-8"><span class="secnum">9.8</span> Deadlock Avoidance and the Maximum Claim</h3>
<p>Rather than letting deadlock happen and paying for recovery, <strong>avoidance</strong> enforces runtime rules that keep the system from ever entering an unsafe state (recall §9.3: from a safe state, deadlock is unreachable). It is defined for <strong>reusable resources</strong>, and it charges rent: <strong>the avoidance algorithm runs on every resource request.</strong> The core idea: <strong>delay</strong> granting any request that <em>might</em> lead to deadlock, using advance knowledge of each process's worst-case future needs. That declared upper bound is the <strong>Maximum Claim</strong>.</p>
<div class="box def"><span class="lbl">Definition: Maximum Claim / Maximum Claim Graph (MCG)</span><p><strong>In plain English:</strong> Every process must announce, up front, the most of each resource it could ever ask for; the system then plans for the worst case at every step.</p><p><strong>Technical definition:</strong> The maximum claim is a per-process upper bound on units of each resource type the process may request. The Maximum Claim Graph extends the resource graph with dashed <strong>potential request edges</strong> showing every request the process could still make; the total number of edges between a process and the resources stays constant throughout execution — edges only change <em>kind</em> (potential → request → assignment → back to potential).</p><p><strong>Why it matters:</strong> The MCG lets the system test the <em>worst case</em> before saying yes: if the graph remains completely reducible even when everyone might demand their maximum, the grant is safe.</p></div>
<h4>The safety test</h4>
<p>When a process makes a request, its potential edge becomes an actual request edge, and the avoidance algorithm asks: <em>if I grant this, is the resulting worst case still reducible?</em> It tentatively grants and performs <strong>graph reduction on the MCG</strong>. <strong>Completely reducible → even worst-case future requests cannot deadlock → SAFE → grant.</strong> Not reducible → UNSAFE → <strong>defer</strong> the request (the process waits — it is not denied forever, just until the state changes).</p>
<h3 id="s9-9"><span class="secnum">9.9</span> The Banker's Algorithm</h3>
<p>The <strong>Banker's Algorithm</strong> is deadlock avoidance made concrete — dynamic avoidance using the Maximum Claim Graph. The name is the metaphor: a banker never commits cash in a way that could leave every customer's declared credit line unsatisfiable; the OS never allocates in a way that could leave every process's maximum claim unsatisfiable.</p>
<h4>The algorithm</h4>
<ul><li><strong>On entry</strong>, each process declares the maximum number of instances it may need of each resource type (its row of the maximum claim matrix).</li><li><strong>On a request</strong>, the system converts the request edge into a <strong>tentative assignment</strong> edge.</li><li>The system attempts to <strong>reduce the MCG</strong> (the deadlock check under worst-case assumptions).</li><li><strong>If the graph reduces → the state is safe → grant</strong> the request for real.</li><li><strong>If not → unsafe → defer</strong> the request; the process waits until a grant would be safe.</li></ul>
<h4>Data structures</h4>
<div class="tw"><table><thead><tr><th>Structure</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>C</strong> — maximum claim matrix</td><td>C[i][j] = maximum demand of process Pᵢ for resource type Rⱼ (declared on entry).</td></tr><tr><td><strong>Avail</strong> — available vector</td><td>Avail[j] = number of currently unallocated units of Rⱼ: [R₁, R₂, …, Rₖ].</td></tr><tr><td><strong>Alloc</strong> — allocation matrix</td><td>Alloc[i][j] = units of Rⱼ currently held by Pᵢ.</td></tr><tr><td><strong>Need</strong> = C − Alloc</td><td>Need[i][j] = units of Rⱼ that Pᵢ may <em>still</em> request — the remaining claim.</td></tr></tbody></table></div>
<div class="box ex"><span class="lbl">Worked example: the two-process example from lecture</span><p><strong>Setup:</strong> 2 processes (P₁, P₂), 2 resource types. R₁ has 3 units available, R₂ has 2. Maximum claims: <strong>P₁ may need [1, 2]</strong> (1 of R₁, 2 of R₂) and <strong>P₂ may need [2, 2]</strong>.</p><p><strong>Scenario A — P₂ requests one unit of R₁.</strong> Tentatively assign it and reduce the MCG assuming worst-case futures. Worst case: P₁ demands its full claim (1 R₁, 2 R₂) — with 2 R₁ and 2 R₂ still free, grantable; remove P₁, returning its units. Now P₂'s worst case (1 more R₁, 2 R₂) is grantable; remove P₂. <strong>Completely reducible → SAFE → grant.</strong></p><p><strong>Scenario B — P₁ now requests a unit (with P₂ already holding one R₁).</strong> Tentatively grant and try to reduce. In the worst case each process may still demand enough of R₂ (both claim 2, only 2 exist — one full claim at a time is fine, but with the tentative grant in place neither process's <em>entire</em> remaining claim can be guaranteed grantable in any order: the MCG <strong>cannot be reduced</strong>. <strong>UNSAFE → defer P₁'s request</strong> until it is safe to do so.</p><p>The takeaway shape of every Banker's question: tentatively grant → reduce under maximum claims → reducible means grant, irreducible means defer. Note what deferral means: nothing is "denied," and no deadlock exists — the system is simply refusing to <em>enter a state from which</em> deadlock could become unavoidable.</p></div>
<div class="box warn"><span class="lbl">Misconception</span><p>"Unsafe state = deadlocked state." No. Unsafe means <em>deadlock is now possible in some worst-case future</em>, not that it has happened — processes might never actually request their maxima, and the system could get lucky. The Banker's Algorithm is conservative on purpose: it refuses unsafe states so that luck is never required. Safe ⊂ deadlock-free futures guaranteed; unsafe = guarantee lost, not doom certain.</p></div>
<h3 id="s9-10"><span class="secnum">9.10</span> Deadlock Prevention</h3>
<p><strong>Prevention</strong> is the design-time strategy: structure the system so that <strong>one of the necessary conditions can never hold</strong> (the lecture focuses on attacking mutual exclusion, hold-and-wait, and circular wait). No condition, no deadlock — guaranteed statically, with no per-request runtime check. The catch is the price each attack exacts:</p>
