<title>Caden's Course Notes</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2EE; --panel:#E4E7E1; --plate:#FBFBF8; --text:#1B2430; --muted:#56606B; --rule:#C9CEC6;
  --brass:#8A6414; --def:#2F7466; --warn:#9A3434; --ex:#34548F; --exam:#6B4A8C; --code-bg:#E2E5DF;
  --good:#2F7466; --bad:#9A3434; --on-brass:#FBFBF8;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --cond:"Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15202E; --panel:#1C2A3A; --plate:#EEF0EA; --text:#E6E1D5; --muted:#A3ADB7; --rule:#2F4054;
    --brass:#D6B062; --def:#79C0AE; --warn:#E08A84; --ex:#9DB6E6; --exam:#C3A6E0; --code-bg:#223347;
    --good:#79C0AE; --bad:#E08A84; --on-brass:#15202E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15202E; --panel:#1C2A3A; --plate:#EEF0EA; --text:#E6E1D5; --muted:#A3ADB7; --rule:#2F4054;
  --brass:#D6B062; --def:#79C0AE; --warn:#E08A84; --ex:#9DB6E6; --exam:#C3A6E0; --code-bg:#223347;
  --good:#79C0AE; --bad:#E08A84; --on-brass:#15202E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:18px;line-height:1.7;font-optical-sizing:auto}
a{color:var(--brass);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--brass);outline-offset:3px}
img,svg{max-width:100%}
button{font:inherit}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px clamp(16px,3vw,28px);background:var(--bg);border-bottom:1px solid var(--rule);font-family:var(--cond)}
.bar .home{font-weight:700;font-size:21px;color:var(--text);text-decoration:none;letter-spacing:.01em}
.bar .home span{color:var(--brass)}
.bar .crumb{color:var(--muted);font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .spacer{flex:1}
.btn{font-family:var(--cond);font-size:17px;font-weight:600;line-height:1.2;padding:7px 14px;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brass);background:transparent;color:var(--text)}
.btn.solid{background:var(--brass);color:var(--on-brass)}
.btn.quiet{border-color:var(--rule)}
.btn:hover{border-color:var(--brass)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- notes layout (from the ITEC 4235 page) ---------- */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
nav.toc{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;padding:24px 22px 40px;border-right:1px solid var(--rule);background:var(--panel);font-family:var(--cond);font-size:17px;line-height:1.35}
nav.toc .brand{font-weight:700;font-size:26px;line-height:1.05;margin:0 0 4px}
nav.toc .sub{color:var(--muted);font-size:15px;margin:0 0 14px}
nav.toc .actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
nav.toc ol{list-style:none;margin:0;padding:0}
nav.toc > ol > li{margin:0 0 14px}
nav.toc > ol > li > a{font-weight:600;color:var(--text);text-decoration:none;display:block;padding:2px 0}
nav.toc > ol > li > a .code{color:var(--brass);margin-right:6px}
nav.toc ol ol{margin:4px 0 0 12px;border-left:1px solid var(--rule);padding-left:10px}
nav.toc ol ol a{color:var(--muted);text-decoration:none;display:block;padding:2px 0;font-weight:500}
nav.toc a:hover{color:var(--brass)}
main{padding:40px clamp(16px,5vw,72px) 120px;max-width:980px;width:100%;min-width:0;margin-inline:auto}
.prose{max-width:72ch}
h1,h2,h3,h4{font-family:var(--cond);line-height:1.1;letter-spacing:.005em;text-wrap:balance}
h1{font-size:clamp(40px,7vw,72px);font-weight:700;margin:0 0 12px}
h2{font-size:22px;font-weight:600;color:var(--muted);margin:0}
h3{font-size:34px;font-weight:700;margin:64px 0 8px;padding-top:14px;border-top:2px solid var(--brass)}
h3 .secnum{color:var(--brass);margin-right:.15em}
h4{font-size:24px;font-weight:600;margin:34px 0 8px;color:var(--brass)}
h5{font-family:var(--cond);font-size:20px;font-weight:600;margin:24px 0 6px}
p{margin:0 0 14px}
ul,ol{padding-left:1.3em;margin:0 0 14px}
li{margin:0 0 6px}
code,kbd{font-family:var(--mono);font-size:.84em;background:var(--code-bg);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
pre.code{font-family:var(--mono);font-size:14.5px;line-height:1.55;background:var(--code-bg);padding:14px 16px;overflow-x:auto;border-radius:4px;margin:0 0 16px}
pre.code code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.lead{font-size:21px;color:var(--muted);max-width:62ch}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--cond);font-size:17px;color:var(--muted);margin:0 0 8px}
section.lecture{margin-top:96px}
.plate{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:end;padding:26px 0 22px;border-bottom:1px solid var(--rule)}
.plate .num{font-family:var(--cond);font-weight:700;font-size:clamp(84px,14vw,150px);line-height:.82;color:transparent;-webkit-text-stroke:2px var(--brass);grid-row:span 2}
.plate .ttl{font-family:var(--cond);font-weight:700;font-size:clamp(30px,4.2vw,46px);line-height:1.02;margin:0}
.plate .src{color:var(--muted);font-size:16px;margin:0}
@media (max-width:640px){.plate{grid-template-columns:minmax(0,1fr)}.plate .num{grid-row:auto;font-size:84px}}
.plate .ttl,.plate .src{min-width:0;overflow-wrap:anywhere}
@supports not (-webkit-text-stroke:2px black){.plate .num{color:var(--brass)}}
.box{border-left:4px solid var(--rule);background:var(--panel);padding:14px 18px 6px;margin:18px 0 20px;border-radius:0 4px 4px 0;max-width:76ch;min-width:0}
.box > .lbl{font-family:var(--cond);font-weight:700;font-size:19px;margin:0 0 6px;display:block}
.box.def{border-color:var(--def)} .box.def > .lbl{color:var(--def)}
.box.warn{border-color:var(--warn)} .box.warn > .lbl{color:var(--warn)}
.box.ex{border-color:var(--ex)} .box.ex > .lbl{color:var(--ex)}
.box.exam{border-color:var(--exam)} .box.exam > .lbl{color:var(--exam)}
.box.proc{border-color:var(--brass)} .box.proc > .lbl{color:var(--brass)}
.box.bg{border-color:var(--muted)} .box.bg > .lbl{color:var(--muted)}
.def dl{margin:0 0 8px;display:grid;grid-template-columns:118px 1fr;gap:4px 14px}
.def dt{font-family:var(--cond);font-weight:600;color:var(--muted);font-size:17px;padding-top:3px}
.def dd{margin:0;min-width:0}
@media (max-width:560px){.def dl{grid-template-columns:1fr}.def dt{padding-top:6px}}
.lvl{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--muted);margin-left:6px}
details{margin:6px 0 10px}
summary{cursor:pointer;font-weight:600}
details > div{padding:8px 0 4px 18px;border-left:2px solid var(--rule);margin-top:6px}
.formula{background:var(--panel);border:1px solid var(--rule);padding:16px 20px 8px;margin:18px 0 22px;border-radius:4px;max-width:76ch}
.formula .eq{font-family:var(--mono);font-size:20px;text-align:center;padding:10px;margin:0 0 12px;background:var(--code-bg);border-radius:3px;overflow-x:auto}
.tw{overflow-x:auto;margin:14px 0 22px}
table{border-collapse:collapse;width:100%;font-size:16px;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--cond);font-size:17px;font-weight:600;color:var(--brass);border-bottom:2px solid var(--brass)}
table.gloss td:first-child{font-weight:600;white-space:nowrap}
table.gloss{min-width:880px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
figure.fig{margin:20px 0 24px;background:var(--plate);color:#1B2430;border-radius:4px;padding:18px;overflow-x:auto}
figure.fig figcaption{font-family:var(--cond);font-size:17px;color:#56606B;margin-top:10px}
figure.fig pre.mermaid{margin:0;background:transparent;text-align:center}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;font-family:var(--cond);font-size:17px;max-width:520px}
.quad div{padding:14px 10px;text-align:center}
.quad .ax{background:none;color:#56606B;display:flex;align-items:center;justify-content:center}
.q-lo{background:#CFE3D6}.q-md{background:#F1E6C8}.q-hi{background:#EFCACA}
.tool{border:1px solid var(--brass);border-radius:4px;padding:16px 18px;margin:20px 0 26px;max-width:76ch}
.tool .lbl{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--brass);display:block;margin-bottom:8px}
.tool label{font-family:var(--cond);font-size:17px;display:inline-block;margin:4px 12px 4px 0}
.tool input,.tool select{font-family:var(--mono);font-size:15px;background:var(--bg);color:var(--text);border:1px solid var(--rule);padding:5px 8px;border-radius:3px;max-width:100%}
.tool button{font-family:var(--cond);font-size:17px;font-weight:600;background:var(--brass);color:var(--on-brass);border:0;padding:6px 14px;border-radius:3px;cursor:pointer;margin:6px 6px 6px 0}
.tool output,.tool .out{display:block;font-family:var(--mono);font-size:14.5px;background:var(--code-bg);padding:10px 12px;margin-top:10px;white-space:pre-wrap;overflow-x:auto;border-radius:3px}
.checklist li{list-style:none;position:relative}
.checklist li::before{content:"☐";position:absolute;left:-1.3em;color:var(--brass)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;max-width:76ch;margin:18px 0}
.legend .box{margin:0}
.gantt{display:flex;max-width:76ch;margin:14px 0 18px;border:1px solid var(--brass);border-radius:3px;overflow-x:auto;font-family:var(--cond);font-size:17px}
.gantt span{flex:1 0 auto;padding:8px 12px;border-right:1px solid var(--brass);white-space:nowrap;text-align:center}
.gantt span:last-child{border-right:0}
.mobile-toc{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.toc{display:none}
  .mobile-toc{display:block;background:var(--panel);padding:10px 16px;border-bottom:1px solid var(--rule);font-family:var(--cond);font-size:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:5}
  .mobile-toc ol{list-style:none;padding-left:0;max-height:60vh;overflow-y:auto}
  .mobile-toc ol ol{padding-left:14px}
  .mobile-toc a{color:var(--text);text-decoration:none}
  .mobile-toc .actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  main{padding-top:24px}
  [id]{scroll-margin-top:110px}
  body{font-size:17px}
}
[id]{scroll-margin-top:70px}

/* ---------- home ---------- */
.home-wrap{max-width:1040px;margin:0 auto;padding-block:48px 120px;padding-inline:clamp(16px,4vw,40px)}
.home-head{display:grid;gap:10px;margin-bottom:34px}
.home-head .kicker{font-family:var(--cond);font-size:18px;font-weight:600;color:var(--brass);letter-spacing:.08em;text-transform:uppercase;margin:0}
.home-head h1{margin:0}
.home-head .lead{margin:0}
.search{position:relative;max-width:620px;margin:6px 0 0}
.search input{width:100%;font-family:var(--serif);font-size:18px;padding:12px 14px;border:1px solid var(--rule);border-radius:4px;background:var(--plate);color:#1B2430}
.results{list-style:none;margin:10px 0 0;padding:0;max-width:620px;display:grid;gap:2px}
.results a{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:8px 10px;border-radius:3px;text-decoration:none;color:var(--text)}
.results a:hover,.results a:focus-visible{background:var(--panel)}
.results .rc{font-family:var(--cond);font-weight:600;color:var(--brass);white-space:nowrap}
.results .rt{min-width:0}
.results .rs{grid-column:2;font-family:var(--cond);color:var(--muted);font-size:15px}
.results .none{color:var(--muted);padding:8px 10px}
.term{margin-top:44px}
.term h2{font-family:var(--cond);font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.course{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 30px;align-items:center;padding:22px 0 26px;border-bottom:1px solid var(--rule)}
.course .cnum{font-family:var(--cond);font-weight:700;font-size:clamp(72px,11vw,120px);line-height:.85;color:transparent;-webkit-text-stroke:2px var(--brass);grid-row:span 3}
@supports not (-webkit-text-stroke:2px black){.course .cnum{color:var(--brass)}}
.course .ctitle{font-family:var(--cond);font-weight:700;font-size:clamp(30px,4vw,40px);line-height:1.05;margin:0}
.course .cmeta{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--cond);font-size:17px;color:var(--muted);margin:0}
.pill{display:inline-block;font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.04em;padding:1px 9px;border-radius:999px;border:1px solid currentColor}
.pill.live{color:var(--def)}
.pill.done{color:var(--muted)}
.course .cactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
@media (max-width:640px){.course{grid-template-columns:minmax(0,1fr)}.course .cnum{grid-row:auto;font-size:72px}}
.howto{margin-top:56px;max-width:72ch;color:var(--muted);font-size:16px}
.howto h2{font-family:var(--cond);font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* ---------- exam ---------- */
.exam-wrap{max-width:860px;margin:0 auto;padding-block:40px 120px;padding-inline:clamp(16px,4vw,40px)}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px 20px;margin:0 0 20px}
.panel h3{margin:0 0 10px;padding:0;border:0;font-size:24px}
.fieldrow{display:flex;flex-wrap:wrap;gap:8px 10px;margin:4px 0 12px}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--cond);font-size:17px;padding:5px 12px 5px 9px;border:1px solid var(--rule);border-radius:999px;background:var(--bg);cursor:pointer;user-select:none}
.chip input{margin:0;accent-color:var(--brass)}
.chip:has(input:checked){border-color:var(--brass)}
.chip .cc{color:var(--brass);font-weight:600}
.chip .cn{color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;color:var(--brass);cursor:pointer;font-family:var(--cond);font-size:16px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.hint{font-family:var(--cond);font-size:16px;color:var(--muted);margin:4px 0 0}
.status{font-family:var(--cond);font-size:18px;margin:12px 0 0}
.status.err{color:var(--bad)}
.scorebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--bg);border-bottom:1px solid var(--rule);padding:10px 0;margin:0 0 18px;font-family:var(--cond);font-size:19px}
.scorebar .big{font-weight:700;font-size:26px;color:var(--brass);font-variant-numeric:tabular-nums}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:16px;counter-reset:q}
.q{border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:0 4px 4px 0;padding:14px 18px 12px;background:var(--bg);counter-increment:q}
.q.right{border-left-color:var(--good)}
.q.wrong{border-left-color:var(--bad)}
.q .qhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-family:var(--cond);font-size:16px;color:var(--muted);margin:0 0 4px}
.q .qhead::before{content:"Q" counter(q);font-weight:700;color:var(--brass);font-size:18px}
.q .qtext{margin:0 0 10px;white-space:pre-wrap}
.opts{display:grid;gap:6px;margin:0 0 6px;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--rule);border-radius:3px;cursor:pointer;background:var(--bg)}
.opt input{margin-top:.35em;accent-color:var(--brass)}
.opt.correct{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.opt.chosen-wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.q textarea{width:100%;min-height:90px;font-family:var(--serif);font-size:17px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--plate);color:#1B2430;resize:vertical}
.verdict{font-family:var(--cond);font-weight:700;font-size:17px;margin:8px 0 4px}
.verdict.right{color:var(--good)} .verdict.wrong{color:var(--bad)}
.explain{background:var(--panel);border-radius:3px;padding:10px 14px;margin:6px 0 2px;font-size:16px}
.explain .k{font-family:var(--cond);font-weight:700;color:var(--muted);display:block;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.selfmark{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.selfmark .btn[aria-pressed="true"]{background:var(--brass);color:var(--on-brass)}
.stream{font-family:var(--mono);font-size:13px;color:var(--muted);max-height:120px;overflow:hidden;white-space:pre-wrap;margin-top:10px}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
</style>

<header class="bar">
  <a class="home" href="#/">Course <span>Notes</span></a>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <button class="btn quiet" type="button" id="themeBtn">Light / dark</button>
</header>

<script id="questions-data" type="application/json">[{"unit": "l00", "type": "mc", "q": "Assignments 92, participation 100, midterm 78, project 88. Using Grade = 0.30A + 0.05P + 0.25M + 0.25F + 0.15T, what final exam score F gives an 85 overall?", "choices": ["72.4", "78.8", "85.0", "91.2"], "answer": 1, "explain": "0.30(92) + 0.05(100) + 0.25(78) + 0.15(88) = 65.3. 0.25F = 85 − 65.3 = 19.7, so F = 78.8.", "course": "itec4235", "id": "itec4235-1"}, {"unit": "l00", "type": "mc", "q": "What is 0xB6 in decimal?", "choices": ["166", "176", "182", "198"], "answer": 2, "explain": "B = 11, so 11 × 16 + 6 = 182.", "course": "itec4235", "id": "itec4235-2"}, {"unit": "l00", "type": "mc", "q": "How many bits are in a hash written as 64 hex digits?", "choices": ["64", "128", "256", "512"], "answer": 2, "explain": "Each hex digit is 4 bits: 64 × 4 = 256 bits (SHA-256).", "course": "itec4235", "id": "itec4235-3"}, {"unit": "l00", "type": "mc", "q": "Convert binary 101101 to hex.", "choices": ["0xB4", "0x2D", "0x5A", "0xB1"], "answer": 1, "explain": "Group from the right in fours: 0010 1101 = 0x2D. Grouping from the left is the classic mistake.", "course": "itec4235", "id": "itec4235-4"}, {"unit": "l00", "type": "short", "q": "Convert decimal 13 to binary, showing the method.", "answer": "Divide by 2 and read the remainders bottom to top: 13÷2 = 6 r1, 6÷2 = 3 r0, 3÷2 = 1 r1, 1÷2 = 0 r1, so 1101. Check: 8 + 4 + 0 + 1 = 13.", "explain": "Repeated division by the base, reading remainders upward.", "course": "itec4235", "id": "itec4235-5"}, {"unit": "l00", "type": "tf", "q": "Scanning real third-party systems is allowed in this course as long as you don't break anything.", "answer": false, "explain": "Only authorized course environments may be used. Unauthorized access is a crime even without damage.", "course": "itec4235", "id": "itec4235-6"}, {"unit": "l00b", "type": "mc", "q": "What is the correct order of attack phases?", "choices": ["Scanning, footprinting, gaining access, maintaining access", "Footprinting, scanning, gaining access, maintaining access", "Gaining access, scanning, footprinting, maintaining access", "Footprinting, gaining access, scanning, maintaining access"], "answer": 1, "explain": "Footprinting (passive research) comes before scanning (active probing), then exploitation, then persistence.", "course": "itec4235", "id": "itec4235-7"}, {"unit": "l00b", "type": "mc", "q": "An attacker runs nmap against a target to find open ports. Which phase is this?", "choices": ["Footprinting", "Scanning", "Gaining access", "Maintaining access"], "answer": 1, "explain": "Scanning actively probes for live hosts, open ports, and services.", "course": "itec4235", "id": "itec4235-8"}, {"unit": "l00b", "type": "mc", "q": "What most defines a grey hat hacker according to the slides?", "choices": ["Mostly good intentions", "Unpredictability, mixing offensive and defensive work", "Working only with permission", "Hacking for political causes"], "answer": 1, "explain": "The slide's defining trait is unpredictability, not good intentions.", "course": "itec4235", "id": "itec4235-9"}, {"unit": "l00b", "type": "short", "q": "Why would an attacker patch the vulnerability they used to break in?", "answer": "To keep exclusive control. If other attackers use the same hole they could disrupt the system or alert the administrator. The attacker already has a backdoor, so they no longer need the original vulnerability.", "explain": "Patching the hole is a listed post-exploitation step.", "course": "itec4235", "id": "itec4235-10"}, {"unit": "l00b", "type": "mc", "q": "A computer that stores stolen information plays which role in a cybercrime?", "choices": ["Target", "Tool", "Accessory", "Proxy"], "answer": 2, "explain": "Target = attacked (viruses); tool = used for a traditional crime (fraud); accessory = stores evidence or illegal material.", "course": "itec4235", "id": "itec4235-11"}, {"unit": "l00b", "type": "mc", "q": "How does a security test differ from a penetration test?", "choices": ["It is always black box", "It adds analysis of security policy and procedures and offers solutions", "It never attempts to break in", "It is done only by insiders"], "answer": 1, "explain": "Security test = pen test + policy analysis + solutions. A pen test only reports findings.", "course": "itec4235", "id": "itec4235-12"}, {"unit": "l00b", "type": "mc", "q": "In which penetration testing model are staff not told about the test, so it measures detection of a real-looking attack?", "choices": ["White box", "Black box", "Gray box", "Tiger box"], "answer": 1, "explain": "In a black-box test the tester knows nothing and staff are unaware.", "course": "itec4235", "id": "itec4235-13"}, {"unit": "l00b", "type": "tf", "q": "Under duty-based ethics, breaking into a system is acceptable if nothing is damaged.", "answer": false, "explain": "The breaking-and-entering analogy: you still took away the owner's sense of security. \"No damage\" is not a defense.", "course": "itec4235", "id": "itec4235-14"}, {"unit": "l00b", "type": "mc", "q": "Which UK law created the specific offenses of unauthorized access and data modification?", "choices": ["Criminal Damage Act 1971", "Computer Misuse Act 1990", "CFAA 1986", "Budapest Convention 2001"], "answer": 1, "explain": "The Computer Misuse Act 1990 made computer crimes easier to prosecute. The 1971 Act established that data counts as property.", "course": "itec4235", "id": "itec4235-15"}, {"unit": "l00b", "type": "mc", "q": "A USB drive labeled \"Salaries 2026\" left in a parking lot is which social engineering technique?", "choices": ["Pretexting", "Baiting", "Quid pro quo", "Masquerade"], "answer": 1, "explain": "Baiting offers a lure. Pretexting invents a story; quid pro quo offers a service in exchange.", "course": "itec4235", "id": "itec4235-16"}, {"unit": "l01a", "type": "mc", "q": "An attacker flips bits in the amount field of an encrypted bank transfer without reading it. Which property is violated?", "choices": ["Confidentiality", "Integrity", "Availability", "Anonymity"], "answer": 1, "explain": "Confidentiality held, but the data was altered. This is why encryption alone is not enough and MACs exist.", "course": "itec4235", "id": "itec4235-17"}, {"unit": "l01a", "type": "mc", "q": "Logging into iCollege is ___, and seeing only your own grades is ___.", "choices": ["authorization; authentication", "authentication; authorization", "authentication; accounting", "identification; authentication"], "answer": 1, "explain": "AuthN answers \"who are you?\"; AuthZ answers \"what are you allowed to do?\" Authentication comes first.", "course": "itec4235", "id": "itec4235-18"}, {"unit": "l01a", "type": "mc", "q": "Recording a car key fob's encrypted unlock signal and playing it back later is which attack?", "choices": ["Passive: traffic analysis", "Active: masquerade", "Active: replay", "Passive: release of message contents"], "answer": 2, "explain": "Replay retransmits a captured valid message. The attacker never needed to decrypt it.", "course": "itec4235", "id": "itec4235-19"}, {"unit": "l01a", "type": "tf", "q": "Passive attacks are best handled by detection, since they are easy to prevent.", "answer": false, "explain": "It is the reverse. Passive attacks are hard to detect because nothing changes, so you prevent them with encryption. Active attacks are hard to prevent, so you detect and recover.", "course": "itec4235", "id": "itec4235-20"}, {"unit": "l01a", "type": "mc", "q": "Which cryptanalytic attack model gives Eve the most power?", "choices": ["Ciphertext only", "Known plaintext", "Chosen plaintext", "Chosen ciphertext"], "answer": 3, "explain": "From weakest to strongest: ciphertext only, known plaintext, chosen plaintext, chosen ciphertext.", "course": "itec4235", "id": "itec4235-21"}, {"unit": "l01a", "type": "mc", "q": "Encrypt XYZ with a Caesar cipher and k = 3.", "choices": ["ABC", "UVW", "YZA", "[\\]"], "answer": 0, "explain": "X = 23 → (23 + 3) mod 26 = 0 = A, and similarly Y → B, Z → C.", "course": "itec4235", "id": "itec4235-22"}, {"unit": "l01a", "type": "short", "q": "A ciphertext contains the repeated three-letter word \"pda\". Explain how to find the Caesar shift, assuming it is \"the\".", "answer": "Match p to t: p = 15 and t = 19, so encryption shifted by 15 − 19 = −4 (k = 22). To decrypt, shift forward by 4. Check the other letters: d + 4 = h and a + 4 = e, which confirms \"the\".", "explain": "Frequency and short-word analysis beats trying all 26 shifts by hand.", "course": "itec4235", "id": "itec4235-23"}, {"unit": "l01a", "type": "mc", "q": "How many keys do 100 users need to communicate pairwise with symmetric encryption?", "choices": ["100", "200", "4,950", "10,000"], "answer": 2, "explain": "n(n − 1)/2 = 100 × 99 / 2 = 4,950. Public-key needs only 100 pairs (200 keys).", "course": "itec4235", "id": "itec4235-24"}, {"unit": "l01a", "type": "mc", "q": "Which statement about symmetric encryption is true?", "choices": ["It is better when many people need access", "It is less efficient than public-key for large data", "The key must be kept secret between the parties", "Each party has a different key"], "answer": 2, "explain": "From the slide quiz: symmetric is faster, and the shared key must stay secret.", "course": "itec4235", "id": "itec4235-25"}, {"unit": "l01a", "type": "tf", "q": "Signing a message with your private key keeps its contents confidential.", "answer": false, "explain": "Anyone can verify with your public key. Encrypt for secrecy with the recipient's public key; sign with the sender's private key.", "course": "itec4235", "id": "itec4235-26"}, {"unit": "l01a", "type": "mc", "q": "A 57-bit key compared to a 56-bit key is:", "choices": ["About 2% stronger", "Twice as strong", "56 times stronger", "The same strength"], "answer": 1, "explain": "Each extra bit doubles the key space.", "course": "itec4235", "id": "itec4235-27"}, {"unit": "l01a", "type": "short", "q": "A 6-character password uses all 94 practical keyboard symbols and must be changed every 60 days. How many guesses per second does an attacker need to exhaust the space in time, and does an RTX 4090 at 5,000,000 guesses/s succeed?", "answer": "94^6 = 689,869,781,056 passwords. 60 days = 5,184,000 s. Required rate ≈ 689,869,781,056 / 5,184,000 ≈ 133,076 guesses/s. The GPU does 5,000,000/s, far more, so it exhausts the space in about 138,000 s (about 1.6 days), well within 60 days.", "explain": "At 7 characters the required rate is about 12.5 million/s, which beats the GPU under the 60-day policy.", "course": "itec4235", "id": "itec4235-28"}, {"unit": "l01a", "type": "mc", "q": "Which slide password is strongest?", "choices": ["Seattle1", "M1ke03", "P@$$w0rd", "TD2k5secV"], "answer": 3, "explain": "It is 9 characters, mixed case with digits, and contains no dictionary word. The others are in every cracking list.", "course": "itec4235", "id": "itec4235-29"}, {"unit": "l01a", "type": "mc", "q": "In an access control matrix, reading one column gives:", "choices": ["A subject's capability list", "That object's access control list", "The role hierarchy", "The audit log"], "answer": 1, "explain": "Column = ACL for an object; row = capability list for a subject.", "course": "itec4235", "id": "itec4235-30"}, {"unit": "l01a", "type": "mc", "q": "Which FIPS 200 area failed when a fired employee's account still works a month later?", "choices": ["Media protection", "Personnel security", "Planning", "Maintenance"], "answer": 1, "explain": "Personnel security covers protecting systems during terminations and transfers. Access control is also involved.", "course": "itec4235", "id": "itec4235-31"}, {"unit": "l01a", "type": "mc", "q": "Kerckhoffs's principle says a cryptosystem's security should depend only on:", "choices": ["Keeping the algorithm secret", "The key", "Hardware isolation", "The length of the ciphertext"], "answer": 1, "explain": "Algorithms are assumed public; secret algorithms tend to be broken once reverse-engineered.", "course": "itec4235", "id": "itec4235-32"}, {"unit": "l01a", "type": "mc", "q": "Which anonymity tool combines many people's data so sums or averages cannot identify anyone?", "choices": ["Mixing", "Proxies", "Aggregation", "Pseudonyms"], "answer": 2, "explain": "Census reports of average income by county are the example. Its failure mode is statistical analysis revealing the underlying data.", "course": "itec4235", "id": "itec4235-33"}, {"unit": "l03a", "type": "mc", "q": "Using PKCS5 padding with 16-byte blocks, what is appended to a message that is exactly 16 bytes long?", "choices": ["Nothing", "One byte 0x01", "A full block of sixteen 0x10 bytes", "Sixteen 0x00 bytes"], "answer": 2, "explain": "You always pad. Otherwise a message ending in 0x01 would be ambiguous.", "course": "itec4235", "id": "itec4235-34"}, {"unit": "l03a", "type": "mc", "q": "\"Roberto\" is 7 bytes. What PKCS5 padding does it get with 16-byte blocks?", "choices": ["Nine bytes each with value 9", "Seven bytes each with value 7", "Nine zero bytes", "The character \"9\" nine times"], "answer": 0, "explain": "16 − 7 = 9 bytes of padding, each equal to 9 (the byte value, not the character).", "course": "itec4235", "id": "itec4235-35"}, {"unit": "l03a", "type": "short", "q": "Compute the unicity distance of AES-128 for English plaintext (β ≈ 0.16).", "answer": "n = k / (1 − β) = 128 / 0.844 ≈ 152 bits, about 19 characters.", "explain": "Divide by (1 − β), not β, and remember the answer is in bits. AES-256 is about 304 bits.", "course": "itec4235", "id": "itec4235-36"}, {"unit": "l03a", "type": "mc", "q": "What are the block and key sizes of DES?", "choices": ["64-bit block, 56-bit key", "128-bit block, 56-bit key", "64-bit block, 64-bit key", "56-bit block, 64-bit key"], "answer": 0, "explain": "Its 56-bit key is what killed it: about an hour at 10^13 decryptions per second.", "course": "itec4235", "id": "itec4235-37"}, {"unit": "l03a", "type": "mc", "q": "What are the four steps of an AES round, in order?", "choices": ["ShiftRows, SubBytes, AddRoundKey, MixColumns", "SubBytes, ShiftRows, MixColumns, AddRoundKey", "MixColumns, SubBytes, ShiftRows, AddRoundKey", "AddRoundKey, MixColumns, ShiftRows, SubBytes"], "answer": 1, "explain": "\"Some Shy Monkeys Add.\" The final round skips MixColumns.", "course": "itec4235", "id": "itec4235-38"}, {"unit": "l03a", "type": "tf", "q": "AES-128 encrypts the plaintext ten times using the same key.", "answer": false, "explain": "It uses a different round key, derived from K, in each round.", "course": "itec4235", "id": "itec4235-39"}, {"unit": "l03a", "type": "mc", "q": "Why is the ECB penguin still visible after encryption?", "choices": ["The key was too short", "Identical plaintext blocks encrypt to identical ciphertext blocks", "ECB leaves the image header unencrypted", "The IV was reused"], "answer": 1, "explain": "ECB leaks patterns regardless of key strength, which is why CBC chains blocks.", "course": "itec4235", "id": "itec4235-40"}, {"unit": "l03a", "type": "short", "q": "In CBC mode, one bit of ciphertext block C[1] is flipped in transit. Which plaintext blocks are affected when decrypting?", "answer": "P[1] = C[0] ⊕ D(C[1]) is completely garbled. P[2] = C[1] ⊕ D(C[2]) has exactly that one bit flipped, since C[1] is XORed in directly. P[3] onward is unaffected.", "explain": "In ECB only P[1] would be garbled, which is why CBC needs reliable sequential delivery.", "course": "itec4235", "id": "itec4235-41"}, {"unit": "l03a", "type": "mc", "q": "If the same key stream S encrypts two messages, what does XORing the ciphertexts reveal?", "choices": ["The key stream", "P1 ⊕ P2", "Nothing", "P1 only"], "answer": 1, "explain": "C1 ⊕ C2 = P1 ⊕ P2 because the key cancels. This is the repetition attack; never reuse a key stream.", "course": "itec4235", "id": "itec4235-42"}, {"unit": "l03a", "type": "mc", "q": "What is −1 mod 13?", "choices": ["−1", "1", "12", "13"], "answer": 2, "explain": "In math the result is always in 0…n−1: −1 + 13 = 12. Many calculators give −1.", "course": "itec4235", "id": "itec4235-43"}, {"unit": "l03a", "type": "mc", "q": "gcd(412, 260) = ?", "choices": ["2", "4", "8", "52"], "answer": 1, "explain": "412 → 260 → 152 → 108 → 44 → 20 → 4 → 0, so the gcd is 4.", "course": "itec4235", "id": "itec4235-44"}, {"unit": "l03a", "type": "mc", "q": "Which elements of Z10 have multiplicative inverses?", "choices": ["All nonzero elements", "1, 3, 7, 9", "2, 4, 6, 8", "1 and 9 only"], "answer": 1, "explain": "x has an inverse iff gcd(x, n) = 1, so φ(10) = 4.", "course": "itec4235", "id": "itec4235-45"}, {"unit": "l03a", "type": "short", "q": "Find d such that 7d ≡ 1 (mod 40). Show your work.", "answer": "Euclid: 40 = 5·7 + 5; 7 = 1·5 + 2; 5 = 2·2 + 1. Back-substitute: 1 = 5 − 2·2 = 5 − 2(7 − 5) = 3·5 − 2·7 = 3(40 − 5·7) − 2·7 = 3·40 − 17·7. So d = −17 mod 40 = 23. Check: 7 × 23 = 161 = 4·40 + 1.", "explain": "The two-column table method gives the same d = 23.", "course": "itec4235", "id": "itec4235-46"}, {"unit": "l03a", "type": "short", "q": "RSA with p = 3, q = 11, e = 3: find n, φ(n), d, and encrypt M = 2.", "answer": "n = 33, φ(n) = 2 × 10 = 20. d = 7 because 3 × 7 = 21 ≡ 1 (mod 20). C = 2^3 mod 33 = 8. Decrypting: 8^7 mod 33 = 2.", "explain": "Public key (33, 3); private key 7.", "course": "itec4235", "id": "itec4235-47"}, {"unit": "l03a", "type": "tf", "q": "In RSA, the modulus n must be kept secret.", "answer": false, "explain": "n and e are public. p, q, φ(n), and d are secret.", "course": "itec4235", "id": "itec4235-48"}, {"unit": "l03a", "type": "mc", "q": "For n = pq with distinct primes, φ(n) equals:", "choices": ["n − 1", "pq − 1", "(p − 1)(q − 1)", "(p + 1)(q + 1)"], "answer": 2, "explain": "n − 1 only holds for prime n, a common mistake.", "course": "itec4235", "id": "itec4235-49"}, {"unit": "l03a", "type": "mc", "q": "A stolen file of password hashes is protected by which hash property?", "choices": ["Preimage resistance", "Second preimage resistance", "Collision resistance", "Avalanche effect"], "answer": 0, "explain": "The attacker has hash values and wants any matching input.", "course": "itec4235", "id": "itec4235-50"}, {"unit": "l03a", "type": "mc", "q": "An attacker prepares a fair and an unfair contract with the same hash, gets the fair one signed, then swaps them. Which property must fail?", "choices": ["Preimage resistance", "Second preimage resistance", "Collision resistance", "One-wayness"], "answer": 2, "explain": "The attacker controls both inputs, which is exactly the MD5 chosen-prefix attack.", "course": "itec4235", "id": "itec4235-51"}, {"unit": "l03a", "type": "mc", "q": "About how many tries does a birthday attack need to find a collision on a b-bit hash?", "choices": ["2^b", "2^(b−1)", "2^(b/2)", "b^2"], "answer": 2, "explain": "k ≈ 1.17√m with m = 2^b, so a b-bit hash gives about b/2 bits of collision resistance.", "course": "itec4235", "id": "itec4235-52"}, {"unit": "l03a", "type": "mc", "q": "Why is MAC = h(K ‖ M) insecure with iterated hashes like SHA-256?", "choices": ["It leaks K directly", "Length-extension attacks let an attacker forge a MAC for M plus extra data", "It is too slow", "K must be longer than M"], "answer": 1, "explain": "The digest is the chain's internal state, so hashing can continue from it. HMAC's nested structure blocks this.", "course": "itec4235", "id": "itec4235-53"}, {"unit": "l03a", "type": "short", "q": "Write the Merkle membership proof for leaf x6 in an 8-leaf tree (leaves x1…x8; e = h(x5, x6), f = h(x7, x8), c = h(a, b), d = h(e, f), root g = h(c, d)).", "answer": "[(x5, L), (f, R), (c, L)]. Verify: e = h(x5, x6), d = h(e, f), g′ = h(c, d), then check g′ = g.", "explain": "One sibling per level, tagged by side, because h(a, b) ≠ h(b, a).", "course": "itec4235", "id": "itec4235-54"}, {"unit": "l03a", "type": "mc", "q": "Compute 3^18 mod 19.", "choices": ["0", "1", "3", "18"], "answer": 1, "explain": "Repeated squaring gives 1. By Fermat, 19 is prime so 3^18 ≡ 1 (mod 19).", "course": "itec4235", "id": "itec4235-55"}, {"unit": "l03a", "type": "tf", "q": "When a randomized primality test answers \"composite\", it can be wrong.", "answer": false, "explain": "A composite answer is always correct; only a prime answer can be wrong, with probability at most 2^−k.", "course": "itec4235", "id": "itec4235-56"}, {"unit": "l04a", "type": "mc", "q": "A file is -rwxr-xr-- with owner zakir and group dabo. Who can execute it?", "choices": ["Everyone", "Only zakir", "zakir and members of group dabo", "Only members of group dabo"], "answer": 2, "explain": "Owner rwx, group r-x, other r--. Others can read but not execute.", "course": "itec4235", "id": "itec4235-57"}, {"unit": "l04a", "type": "mc", "q": "What is rwxr-xr-- in octal?", "choices": ["754", "744", "755", "644"], "answer": 0, "explain": "rwx = 4 + 2 + 1 = 7, r-x = 4 + 1 = 5, r-- = 4.", "course": "itec4235", "id": "itec4235-58"}, {"unit": "l04a", "type": "tf", "q": "UNIX permissions add up: a file owner who is also in the file's group gets the union of the user and group triplets.", "answer": false, "explain": "The check stops at the first match: owner triplet, else group, else other. A ----rwx--- file gives its owner nothing.", "course": "itec4235", "id": "itec4235-59"}, {"unit": "l04a", "type": "mc", "q": "Why are password hashes stored in /etc/shadow rather than /etc/passwd?", "choices": ["/etc/passwd is too small", "/etc/passwd is world-readable, and stolen hashes can be brute-forced", "/etc/shadow is encrypted with AES", "Only service accounts use /etc/passwd"], "answer": 1, "explain": "/etc/shadow is readable only by root.", "course": "itec4235", "id": "itec4235-60"}, {"unit": "l04a", "type": "mc", "q": "An unprivileged process may change its EUID to:", "choices": ["Any UID", "Only 0", "Its current RUID or SUID", "Only its parent's UID"], "answer": 2, "explain": "Root can set all three IDs to anything; unprivileged processes are limited to RUID or SUID.", "course": "itec4235", "id": "itec4235-61"}, {"unit": "l04a", "type": "short", "q": "An SSH server authenticates a user, forks, calls seteuid(uid), and execs a shell. What is the vulnerability, and what is the fix?", "answer": "seteuid changes only the EUID, so the shell still has SUID (and RUID) 0. The user can call setuid(0), which is allowed because 0 matches the saved UID, and become root. Fix: call setuid(uid), while still root, so EUID = RUID = SUID = uid and there is nothing to switch back to.", "explain": "Drop privilege completely, while you still have the power to.", "course": "itec4235", "id": "itec4235-62"}, {"unit": "l04a", "type": "mc", "q": "How does passwd know whose password the caller may change, when it runs setuid root?", "choices": ["From the EUID", "From the RUID", "From the SUID", "From the GID"], "answer": 1, "explain": "The EUID is 0 because of the setuid bit, but the RUID is still the person who ran the program.", "course": "itec4235", "id": "itec4235-63"}, {"unit": "l04a", "type": "mc", "q": "The setuid() system call and the setuid bit differ how?", "choices": ["They do the same thing", "The call usually drops privilege; the bit makes a program run as its owner to gain privilege", "The bit drops privilege; the call gains it", "The call only works on Windows"], "answer": 1, "explain": "They share a name but work in opposite directions.", "course": "itec4235", "id": "itec4235-64"}, {"unit": "l04a", "type": "mc", "q": "Which Linux capability would let Apache bind port 80 without starting as root?", "choices": ["CAP_KILL", "CAP_NET_RAW", "CAP_NET_BIND_SERVICE", "CAP_SYS_PTRACE"], "answer": 2, "explain": "CAP_NET_BIND_SERVICE allows binding to ports below 1024. Modern ping uses CAP_NET_RAW.", "course": "itec4235", "id": "itec4235-65"}, {"unit": "l04a", "type": "mc", "q": "In a Windows security descriptor, which part decides access and which part controls auditing?", "choices": ["SACL decides, DACL audits", "DACL decides, SACL audits", "SID decides, token audits", "Both are DACLs"], "answer": 1, "explain": "\"DACL Decides, SACL Surveils.\"", "course": "itec4235", "id": "itec4235-66"}, {"unit": "l04a", "type": "mc", "q": "Capabilities (in the capability-vs-ACL sense) are like:", "choices": ["A guest list checked at the door", "A movie ticket: whoever holds it gets in", "A group membership", "An audit log"], "answer": 1, "explain": "Capability = a row of the matrix (per subject); ACL = a column (per object).", "course": "itec4235", "id": "itec4235-67"}, {"unit": "l04a", "type": "short", "q": "Name the four layers Chrome uses to sandbox a renderer on Windows and what each blocks.", "answer": "1) Restricted token with the null SID: removes access to nearly all files and to the network. 2) Job object: no desktop or display settings, clipboard, subprocesses, or global atoms table. 3) Alternate desktop: blocks snooping on window messages such as keystrokes. 4) Low integrity level: can read but not write most files.", "explain": "This is defense in depth: each layer blocks a different escape route.", "course": "itec4235", "id": "itec4235-68"}, {"unit": "l04a", "type": "mc", "q": "Why is role-based access control easier to maintain than per-user ACLs?", "choices": ["Roles are encrypted", "Users change more often than roles, so you update one membership instead of every file", "Roles bypass the kernel", "It needs no groups"], "answer": 1, "explain": "When a TA leaves, you remove one group membership.", "course": "itec4235", "id": "itec4235-69"}, {"unit": "l04a", "type": "mc", "q": "How does Android turn UNIX's user boundary into an app boundary?", "choices": ["All apps share one UID", "Each app runs with its own UID in its own VM", "Apps run as root", "Apps use Windows tokens"], "answer": 1, "explain": "Apps cannot interact directly, and a reference monitor checks inter-component communication.", "course": "itec4235", "id": "itec4235-70"}, {"unit": "l04a", "type": "mc", "q": "In the policy \"An app should only be able to edit its own data\", what is the subject?", "choices": ["Edit", "Its data", "The app", "The OS"], "answer": 2, "explain": "Subject = app, operation = edit (write), object = its data.", "course": "itec4235", "id": "itec4235-71"}, {"unit": "l04b", "type": "mc", "q": "Which command correctly sets the setuid bit on a binary named admin_tool?", "choices": ["chmod 755 admin_tool", "chmod u+s admin_tool", "chown root:root admin_tool", "setuid admin_tool 4755"], "answer": 1, "explain": "u+s adds the setuid bit to the owner's execute position. chmod 4755 admin_tool would also work, but \"setuid\" is a system call, not a shell command.", "course": "itec4235", "id": "itec4235-72"}, {"unit": "l04b", "type": "mc", "q": "In Windows, which kernel-mode component is the only one that directly accesses physical hardware?", "choices": ["The executive", "The microkernel", "The hardware abstraction layer (HAL)", "Kernel mode drivers"], "answer": 2, "explain": "All other kernel-mode programs go through the HAL, so porting Windows to new hardware only needs a new HAL module.", "course": "itec4235", "id": "itec4235-73"}, {"unit": "l04b", "type": "mc", "q": "User-mode programs interact with the Windows operating system through which component?", "choices": ["The HAL", "The executive", "The microkernel", "The environment subsystem"], "answer": 1, "explain": "The executive is the highest-level kernel-mode layer and the only door from user mode; it manages objects, I/O, security, and processes.", "course": "itec4235", "id": "itec4235-74"}, {"unit": "l04b", "type": "mc", "q": "Which Windows user-mode component handles logon and access control?", "choices": ["Environment subsystem", "Integral subsystem", "Executive", "Kernel mode drivers"], "answer": 1, "explain": "The integral subsystem handles logon, access control, and network services on behalf of the environment subsystem, which runs programs written for other OSes.", "course": "itec4235", "id": "itec4235-75"}, {"unit": "l04b", "type": "mc", "q": "A Secret-cleared analyst is blocked from a Top Secret file even though it concerns their own project. Which access control model is this?", "choices": ["Discretionary access control", "Mandatory access control", "Role-based access control", "Dynamic Access Control"], "answer": 1, "explain": "MAC requires a clearance at or above the object's classification, plus need to know. The owner has no say.", "course": "itec4235", "id": "itec4235-76"}, {"unit": "l04b", "type": "tf", "q": "Renaming a Windows user account changes its SID, so the account loses its existing permissions.", "answer": false, "explain": "The SID stays the same when a user or group is renamed, so ACEs keep working. Deleting and recreating an account creates a new SID.", "course": "itec4235", "id": "itec4235-77"}, {"unit": "l04b", "type": "mc", "q": "What does the well-known SID S-1-1-0 identify?", "choices": ["Null SID (no members)", "World (all users)", "Local users", "Creator Owner"], "answer": 1, "explain": "S-1-0-0 null, S-1-1-0 world, S-1-2-0 local, S-1-3-0 creator owner, S-1-3-1 creator group.", "course": "itec4235", "id": "itec4235-78"}, {"unit": "l04b", "type": "short", "q": "List the four steps Windows takes to validate a user and build the security access token (SAT).", "answer": "1) Prompt the user for identification and authentication credentials. 2) Look up the user and stored authentication information; if they match, the user is authenticated. 3) Record the user's SID, the SID of every group the user belongs to, and the user's privileges in a token. 4) Attach the SAT to every process the user runs.", "explain": "The SAT holds user SID, group SIDs, list of privileges, and other access information.", "course": "itec4235", "id": "itec4235-79"}, {"unit": "l04b", "type": "mc", "q": "Why are workgroups discouraged for more than about half a dozen computers?", "choices": ["They require Kerberos", "Users and groups must be defined on each computer, and every permission change applied to every computer", "They cannot share files", "They require a domain controller"], "answer": 1, "explain": "Active Directory centralizes users and groups, reducing redundant administration at the cost of more setup.", "course": "itec4235", "id": "itec4235-80"}, {"unit": "l04b", "type": "tf", "q": "In a Windows domain, complete security access tokens are sent across the network to the computer being accessed.", "answer": false, "explain": "Only the parts needed to construct the SAT are shared: domain user and group SIDs from the domain controller, combined with local group SIDs on the resource's computer.", "course": "itec4235", "id": "itec4235-81"}, {"unit": "l04b", "type": "mc", "q": "In Kerberos, the key distribution center (KDC) on a Windows domain controller acts first as ___ and then as ___.", "choices": ["TGS; AS", "AS (authentication service); TGS (ticket-granting service)", "LDAP server; DNS server", "Client; server"], "answer": 1, "explain": "The AS authenticates the client once; the TGS then issues tickets the client presents to servers.", "course": "itec4235", "id": "itec4235-82"}, {"unit": "l04b", "type": "short", "q": "Explain how User Account Control (UAC) applies least privilege to administrators.", "answer": "Members of the Administrators group get a split security access token: one full-privilege part and one limited part like a normal user's. Processes start with the limited token. When a process needs an administrator privilege, Windows shows an escalation prompt, and only after the user confirms does that program run with the full token.", "explain": "It is Windows' equivalent of running as a normal user and using sudo when needed.", "course": "itec4235", "id": "itec4235-83"}, {"unit": "l04b", "type": "mc", "q": "Ivy is in both the Finance group (Allow Write) and the Interns group (Deny Write) on a file's DACL. Using the Windows access calculation, can she write?", "choices": ["Yes, allow ACEs take priority", "Yes, because she is in Finance", "No, any deny ACE for the requested access results in denial", "It depends on which group was added first"], "answer": 2, "explain": "With multiple ACEs for the same access, all must be allow; a single deny wins.", "course": "itec4235", "id": "itec4235-84"}, {"unit": "l04b", "type": "mc", "q": "Which is NOT one of the four Dynamic Access Control features?", "choices": ["Identify and classify data", "Control file access with central access policies", "Audit file access", "Assign owners full discretionary control"], "answer": 3, "explain": "The four features are classify, control, audit, and encrypt (via RMS). Owner discretion describes discretionary access control, a different \"DAC\".", "course": "itec4235", "id": "itec4235-85"}, {"unit": "l04b", "type": "mc", "q": "Which basic Windows permission reads data and permissions and lists folders, but does NOT traverse folders or execute files?", "choices": ["Read", "Read and Execute", "Write", "Modify"], "answer": 0, "explain": "Read and Execute adds traverse/execute on top of Read.", "course": "itec4235", "id": "itec4235-86"}, {"unit": "l04b", "type": "mc", "q": "Which identifier does the Windows Registry use to record objects, as in the Recycle Bin's ::{645ff040-5081-101b-9f08-00aa002f954e}?", "choices": ["SID", "CLSID", "UID", "ACE"], "answer": 1, "explain": "The Registry identifies objects with GUIDs stored as CLSIDs. SIDs identify security subjects.", "course": "itec4235", "id": "itec4235-87"}, {"unit": "l04b", "type": "mc", "q": "Which command-line tool replaced cacls.exe and can back up ACLs and change file ownership?", "choices": ["robocopy.exe", "xcopy.exe", "icacls.exe", "chmod.exe"], "answer": 2, "explain": "icacls (Integrity Control ACL) replaces cacls and xcacls. robocopy copies files with or without their ACLs.", "course": "itec4235", "id": "itec4235-88"}, {"unit": "l04b", "type": "short", "q": "Expand AGULP and explain why it scales.", "answer": "Accounts are placed in Global groups, global groups in Universal groups, universal groups in Local groups, and Permissions are assigned only to the local groups. Because permissions never point at individual users, adding or removing a person means changing one group membership instead of editing ACLs, which keeps large networks predictable.", "explain": "It can look overly complex for a small office but shines with many users.", "course": "itec4235", "id": "itec4235-89"}, {"unit": "l04b", "type": "mc", "q": "Which default Active Directory group can back up and restore all files regardless of their permissions?", "choices": ["Account operators", "Backup operators", "Users", "Remote desktop users"], "answer": 1, "explain": "That is why Backup Operators membership should be treated as highly privileged.", "course": "itec4235", "id": "itec4235-90"}, {"unit": "l04b", "type": "mc", "q": "Why does Chrome give its sandboxed renderer's restricted token the SID S-1-0-0?", "choices": ["It is the administrator SID", "It is the null SID, a group with no members, so no DACL grants it access", "It is required by Kerberos", "It identifies the local user"], "answer": 1, "explain": "With the null SID and non-null security on disk root directories, the renderer can open essentially no files and has no network access.", "course": "itec4235", "id": "itec4235-91"}, {"unit": "ch1", "type": "mc", "q": "In the four-component view of a computer system, which ordering runs from bottom to top?", "choices": ["Users, applications, operating system, hardware", "Hardware, operating system, applications, users", "Hardware, applications, operating system, users", "Operating system, hardware, applications, users"], "answer": 1, "explain": "Hardware sits at the bottom, the OS coordinates it, applications use resources to solve problems, and users (people, programs, or other computers) direct the work.", "course": "csc4320", "id": "csc4320-1"}, {"unit": "ch1", "type": "mc", "q": "Who manages the CPU cache level of the storage hierarchy?", "choices": ["The compiler", "The operating system", "Hardware", "The user program"], "answer": 2, "explain": "Registers are managed by the compiler, cache by hardware, and main memory, SSDs, and magnetic disks by the operating system.", "course": "csc4320", "id": "csc4320-2"}, {"unit": "ch1", "type": "tf", "q": "The kernel and the operating system are synonyms.", "answer": false, "explain": "The kernel is the always-running core. The full OS also includes system programs and, on modern systems, middleware.", "course": "csc4320", "id": "csc4320-3"}, {"unit": "ch1", "type": "mc", "q": "A trap (exception) differs from a hardware interrupt because it is:", "choices": ["Handled without an interrupt vector", "Generated by software, from an error or a system call", "Always non-maskable", "Only raised by I/O devices"], "answer": 1, "explain": "A trap is a software-generated interrupt caused by an error (divide by zero, page fault) or a user request such as a system call. It uses the same handling machinery.", "course": "csc4320", "id": "csc4320-4"}, {"unit": "ch1", "type": "mc", "q": "Why does DMA improve performance for high-speed devices?", "choices": ["It raises one interrupt per byte so data is never lost", "It lets the device controller move whole blocks to memory with one interrupt per block", "It turns the device into a volatile cache", "It makes the CPU poll the device constantly"], "answer": 1, "explain": "With Direct Memory Access the controller transfers entire blocks between its buffer and main memory, generating one interrupt per block, so the CPU is free for other work.", "course": "csc4320", "id": "csc4320-5"}, {"unit": "ch1", "type": "tf", "q": "A user program can switch the mode bit to kernel mode by itself whenever it needs a privileged instruction.", "answer": false, "explain": "The only legitimate route into kernel mode is a system call, trap, or interrupt, which the OS controls. The mode bit resets to user on return.", "course": "csc4320", "id": "csc4320-6"}, {"unit": "ch1", "type": "mc", "q": "What guarantees the OS regains control from a process stuck in an infinite loop?", "choices": ["The interrupt vector", "The timer", "Spooling", "The device-status table"], "answer": 1, "explain": "The OS sets a timer through a privileged instruction before scheduling a process. When it counts down to zero it raises an interrupt, returning control to the OS.", "course": "csc4320", "id": "csc4320-7"}, {"unit": "ch1", "type": "short", "q": "Explain the difference between multiprogramming and multitasking (timesharing).", "answer": "Multiprogramming keeps several jobs in memory and switches to another job when the current one must wait (for example for I/O), so the CPU is never idle. Multitasking goes further: it switches among jobs rapidly on a timer so every user can interact with each job while it runs, producing interactive response.", "explain": "Key contrast: multiprogramming switches only when a job blocks; multitasking switches frequently to give responsiveness.", "course": "csc4320", "id": "csc4320-8"}, {"unit": "ch1", "type": "mc", "q": "Which I/O subsystem technique overlaps the output of one job with the input of others, as in print queues?", "choices": ["Buffering", "Caching", "Spooling", "Swapping"], "answer": 2, "explain": "Spooling queues output (classically print jobs). Buffering holds data in transit; caching keeps copies in faster storage.", "course": "csc4320", "id": "csc4320-9"}, {"unit": "ch1", "type": "short", "q": "What is abstraction in an operating system? Give one concrete example.", "answer": "Abstraction hides device and architecture details behind simple, consistent interfaces so programmers do not deal with the hardware directly. Example: the OS exposes a file with open/read/write/close, so programs never deal with disk sectors, RPM, or controller commands.", "explain": "The notes flag this as a classic exam question: give the definition plus a concrete case.", "course": "csc4320", "id": "csc4320-10"}, {"unit": "ch2", "type": "mc", "q": "Which parameter-passing method for system calls is used by Linux and places no limit on the number or length of parameters?", "choices": ["CPU registers only", "A memory block whose address is passed in a register", "Global variables", "The interrupt vector"], "answer": 1, "explain": "Linux stores parameters in a memory block/table and passes its address in a register. The block and stack methods don't limit parameter count or length.", "course": "csc4320", "id": "csc4320-11"}, {"unit": "ch2", "type": "tf", "q": "Background services (daemons) run in kernel mode.", "answer": false, "explain": "Daemons are system programs launched at boot that run in user mode, not kernel mode.", "course": "csc4320", "id": "csc4320-12"}, {"unit": "ch2", "type": "mc", "q": "In a program that calls fork() and then execl(\"/bin/ls\", ...) in the child, what happens to a printf placed right after the successful execl?", "choices": ["It prints once", "It prints twice", "It never runs because the child's code was replaced by ls", "It runs after ls finishes"], "answer": 2, "explain": "A successful exec overlays the calling process with the new executable, so there is no original code left to return to.", "course": "csc4320", "id": "csc4320-13"}, {"unit": "ch2", "type": "mc", "q": "What is the difference between an API and an ABI?", "choices": ["They are the same thing on POSIX systems", "An API is source-level; an ABI is the binary-level interface for compiled code on a specific OS and CPU", "An ABI is for Java only", "An API defines calling conventions; an ABI defines function names"], "answer": 1, "explain": "The notes' exact phrasing: the ABI is the architecture equivalent of an API. API = how you write code; ABI = how compiled bytes interoperate.", "course": "csc4320", "id": "csc4320-14"}, {"unit": "ch2", "type": "mc", "q": "Which OS structure moves as much functionality as possible into user space and communicates through message passing?", "choices": ["Monolithic", "Layered", "Microkernel", "Loadable kernel modules"], "answer": 2, "explain": "A microkernel (Mach is the classic example) keeps the kernel tiny. It is more reliable and secure but pays message-passing overhead.", "course": "csc4320", "id": "csc4320-15"}, {"unit": "ch2", "type": "mc", "q": "What does the loader do?", "choices": ["Combines object files into one executable", "Translates C source into object code", "Brings an executable into memory and performs relocation", "Handles # preprocessor directives"], "answer": 2, "explain": "The linker combines object files into an executable; the loader copies it into memory, assigning final addresses (relocation).", "course": "csc4320", "id": "csc4320-16"}, {"unit": "ch2", "type": "tf", "q": "A plain (unbalanced) binary search tree has O(log n) search time.", "answer": false, "explain": "A general BST is O(n) because it can degenerate into a linked list. Only a balanced BST guarantees O(log n).", "course": "csc4320", "id": "csc4320-17"}, {"unit": "ch2", "type": "short", "q": "Distinguish protection from security as OS services.", "answer": "Protection ensures that all access to system resources is controlled, so concurrent processes cannot interfere with each other (an internal concern). Security defends the system from outsiders, which requires user authentication and guarding external I/O devices such as network adapters from invalid access.", "explain": "Protection is internal control of access; security is defense against external threats.", "course": "csc4320", "id": "csc4320-18"}, {"unit": "ch2", "type": "mc", "q": "macOS's Darwin kernel is best described as:", "choices": ["A pure monolithic kernel", "A hybrid combining the Mach microkernel with BSD UNIX parts", "A layered kernel with no modules", "A microkernel with no BSD components"], "answer": 1, "explain": "macOS is a hybrid, layered OS; Darwin combines Mach and BSD, with an I/O kit and loadable kernel extensions.", "course": "csc4320", "id": "csc4320-19"}, {"unit": "ch3", "type": "mc", "q": "What does (int)3.99 evaluate to in C?", "choices": ["4", "3", "3.99", "A compile error"], "answer": 1, "explain": "Casting float to int truncates the fractional part; it does not round.", "course": "csc4320", "id": "csc4320-20"}, {"unit": "ch3", "type": "mc", "q": "How many bytes is a long on a typical 64-bit system (versus 32-bit)?", "choices": ["4 on both", "8 on 64-bit, 4 on 32-bit", "8 on both", "16 on 64-bit"], "answer": 1, "explain": "long grows from 4 bytes on 32-bit to 8 bytes on 64-bit, a classic portability bug.", "course": "csc4320", "id": "csc4320-21"}, {"unit": "ch3", "type": "mc", "q": "Given int *p, *q; what does *q = *p do?", "choices": ["Makes q point where p points", "Copies the value p points to into the location q points to", "Compares the two pointers", "Swaps the pointers"], "answer": 1, "explain": "q = p is pointer assignment; *q = *p copies the pointed-to value.", "course": "csc4320", "id": "csc4320-22"}, {"unit": "ch3", "type": "tf", "q": "You can compare two structs of the same type with ==.", "answer": false, "explain": "Structs can be assigned with = but not compared with == or !=; compare member by member.", "course": "csc4320", "id": "csc4320-23"}, {"unit": "ch3", "type": "mc", "q": "After free(ptr); the pointer ptr still holds the old address. What is ptr called, and what is the fix?", "choices": ["A memory leak; call free again", "A dangling pointer; set ptr = NULL", "A null pointer; nothing to fix", "A void pointer; cast it"], "answer": 1, "explain": "free releases the block but does not change the pointer. Set it to NULL immediately after freeing.", "course": "csc4320", "id": "csc4320-24"}, {"unit": "ch3", "type": "short", "q": "Contrast a memory leak with a dangling pointer.", "answer": "A memory leak is memory that is still allocated but every pointer to it was lost, so it can never be freed. A dangling pointer is a pointer you still have to memory that was already freed, so it points at nothing valid. They are opposite mistakes.", "explain": "Leak: memory without a pointer. Dangling: pointer without memory.", "course": "csc4320", "id": "csc4320-25"}, {"unit": "ch3", "type": "mc", "q": "Given printf(\"One\\n\"); fork(); printf(\"Two\\n\"); how many times does each line print?", "choices": ["One once, Two once", "One twice, Two twice", "One once, Two twice", "One twice, Two once"], "answer": 2, "explain": "Code before the fork runs once; code after runs in both the parent and child.", "course": "csc4320", "id": "csc4320-26"}, {"unit": "ch3", "type": "mc", "q": "What does fork() return in the child process?", "choices": ["The child's PID", "The parent's PID", "0", "-1"], "answer": 2, "explain": "fork is called once but returns twice: 0 in the child, the child's PID in the parent, and -1 on failure.", "course": "csc4320", "id": "csc4320-27"}, {"unit": "ch3", "type": "mc", "q": "How many processes exist after three consecutive fork() calls, counting the original?", "choices": ["3", "4", "6", "8"], "answer": 3, "explain": "n forks create 2^n processes, so 2^3 = 8.", "course": "csc4320", "id": "csc4320-28"}, {"unit": "ch3", "type": "mc", "q": "Which allocation function zero-clears the block it returns?", "choices": ["malloc", "calloc", "realloc", "free"], "answer": 1, "explain": "calloc(n, size) allocates and zeroes; malloc does not initialize; realloc resizes.", "course": "csc4320", "id": "csc4320-29"}, {"unit": "ch3", "type": "tf", "q": "When exec() replaces a process's code, its PID changes.", "answer": false, "explain": "Only the code being executed changes. The PID and PPID stay the same.", "course": "csc4320", "id": "csc4320-30"}, {"unit": "ch4", "type": "mc", "q": "Which process memory section holds function parameters, return addresses, and local variables?", "choices": ["Text", "Data", "Heap", "Stack"], "answer": 3, "explain": "Text holds code, data holds globals, the heap holds malloc'd memory, and the stack holds temporary call data.", "course": "csc4320", "id": "csc4320-31"}, {"unit": "ch4", "type": "mc", "q": "A process finishes waiting for I/O. Which state does it move to next?", "choices": ["Running", "Ready", "New", "Terminated"], "answer": 1, "explain": "A waiting process returns to Ready, not directly to Running; it still needs the scheduler to give it a CPU.", "course": "csc4320", "id": "csc4320-32"}, {"unit": "ch4", "type": "mc", "q": "In Linux, the process control block is the C structure:", "choices": ["proc_t", "task_struct", "pcb_entry", "thread_info"], "answer": 1, "explain": "Linux represents the PCB with task_struct.", "course": "csc4320", "id": "csc4320-33"}, {"unit": "ch4", "type": "tf", "q": "Context-switch time is pure overhead; no useful work is done during it.", "answer": true, "explain": "The switch itself accomplishes nothing. Its cost grows with OS and PCB complexity and depends on hardware support.", "course": "csc4320", "id": "csc4320-34"}, {"unit": "ch4", "type": "mc", "q": "Why is shared memory faster than message passing?", "choices": ["It uses smaller messages", "After setup, access is ordinary memory reads and writes with no kernel involvement", "It never needs synchronization", "It works across machines"], "answer": 1, "explain": "The kernel is only needed to set up the region. Message passing traps into the kernel on every send and receive.", "course": "csc4320", "id": "csc4320-35"}, {"unit": "ch4", "type": "mc", "q": "In the bounded-buffer solution with in and out indices (no counter), the buffer is full when:", "choices": ["in == out", "(in + 1) % BUFFER_SIZE == out", "out == BUFFER_SIZE", "in == BUFFER_SIZE - 1"], "answer": 1, "explain": "Full is (in + 1) % SIZE == out and empty is in == out, which sacrifices one slot to tell them apart.", "course": "csc4320", "id": "csc4320-36"}, {"unit": "ch4", "type": "short", "q": "Why does adding a shared counter to the producer-consumer buffer create a race condition?", "answer": "counter++ and counter-- are not atomic. Each compiles to three steps: load into a register, add or subtract, store back. If the producer's and consumer's steps interleave, one update is lost, so counter can end up 4 or 6 instead of 5. The in/out version had no race because each process modified only its own variable.", "explain": "The race comes from both processes writing the same variable with unsynchronized read-modify-write sequences.", "course": "csc4320", "id": "csc4320-37"}, {"unit": "ch4", "type": "mc", "q": "For an unnamed pipe created with int fd[2]; pipe(fd);, which end is which?", "choices": ["fd[0] write, fd[1] read", "fd[0] read, fd[1] write", "Both ends read and write", "It depends on which process calls fork first"], "answer": 1, "explain": "fd[0] is the read end and fd[1] is the write end. Unnamed pipes are one-way; two-way communication needs two pipes.", "course": "csc4320", "id": "csc4320-38"}, {"unit": "ch4", "type": "mc", "q": "If both send and receive are blocking, the meeting point is called a:", "choices": ["Mailbox", "Rendezvous", "Spool", "Port"], "answer": 1, "explain": "Blocking send plus blocking receive is a rendezvous, which is also what zero-capacity buffering forces.", "course": "csc4320", "id": "csc4320-39"}, {"unit": "ch4", "type": "mc", "q": "On Android, which process type is killed first when memory runs low?", "choices": ["Foreground", "Visible", "Service", "Empty"], "answer": 3, "explain": "Importance from most to least: foreground, visible, service, background, empty. Empty processes are reclaimed first.", "course": "csc4320", "id": "csc4320-40"}, {"unit": "ch5", "type": "mc", "q": "Which of these does each thread have its own copy of?", "choices": ["Heap", "Global data section", "Stack", "Open files"], "answer": 2, "explain": "Each thread owns its TID, program counter, registers, and stack. Code, data, heap, and OS resources are shared.", "course": "csc4320", "id": "csc4320-41"}, {"unit": "ch5", "type": "tf", "q": "Concurrency requires multiple CPU cores.", "answer": false, "explain": "Concurrency means multiple tasks make progress, which a single core does by interleaving them. Parallelism, where tasks run at the same instant, requires multiple cores.", "course": "csc4320", "id": "csc4320-42"}, {"unit": "ch5", "type": "mc", "q": "A program is 25% serial. What is the speedup going from 1 to 2 cores according to Amdahl's Law?", "choices": ["2.0", "1.6", "1.75", "1.33"], "answer": 1, "explain": "speedup = 1 / (0.25 + 0.75/2) = 1 / 0.625 = 1.6.", "course": "csc4320", "id": "csc4320-43"}, {"unit": "ch5", "type": "mc", "q": "A program is 10% serial. What is the maximum possible speedup with unlimited cores?", "choices": ["9", "10", "90", "Unlimited"], "answer": 1, "explain": "As N grows without bound, speedup approaches 1/S = 1/0.10 = 10.", "course": "csc4320", "id": "csc4320-44"}, {"unit": "ch5", "type": "short", "q": "Compute the speedup for a program that is 90% parallel on 4 cores. Show the formula.", "answer": "S = 0.10, N = 4. speedup = 1 / (S + (1 - S)/N) = 1 / (0.10 + 0.90/4) = 1 / (0.10 + 0.225) = 1 / 0.325 ≈ 3.08x.", "explain": "Only the parallel portion is divided by N. The ceiling for this program is 10x.", "course": "csc4320", "id": "csc4320-45"}, {"unit": "ch5", "type": "mc", "q": "In the many-to-one threading model, what happens when one thread makes a blocking system call?", "choices": ["Only that thread blocks", "The whole process's threads block", "The kernel creates a new kernel thread", "The thread is migrated to another core"], "answer": 1, "explain": "All user threads share one kernel thread, so a blocking call stalls every thread. Many-to-one also cannot run threads in parallel.", "course": "csc4320", "id": "csc4320-46"}, {"unit": "ch5", "type": "mc", "q": "Linux and Windows use which threading model?", "choices": ["Many-to-one", "One-to-one", "Many-to-many", "Two-level"], "answer": 1, "explain": "Each user thread maps to its own kernel thread.", "course": "csc4320", "id": "csc4320-47"}, {"unit": "ch5", "type": "tf", "q": "It is possible to create a thread library without any kernel-level support.", "answer": true, "explain": "A user-level library can implement creation, context switching, scheduling, and synchronization entirely in user space.", "course": "csc4320", "id": "csc4320-48"}, {"unit": "ch5", "type": "mc", "q": "Why should a Pthread return a value through malloc'd memory rather than the address of a local variable?", "choices": ["Locals are slower", "The thread's stack is gone once the thread exits, so the address would be invalid", "pthread_exit only accepts heap pointers by type", "Heap memory is automatically freed on join"], "answer": 1, "explain": "A local lives on the thread's private stack, which disappears at exit. Heap memory persists until freed.", "course": "csc4320", "id": "csc4320-49"}, {"unit": "ch5", "type": "mc", "q": "Sending CTRL+C (an asynchronous signal) to a multithreaded process should generally be delivered to:", "choices": ["Only the thread that caused it", "All threads", "A random thread", "No thread"], "answer": 1, "explain": "Synchronous signals go to the thread that caused them; asynchronous ones like CTRL+C are generally sent to all threads.", "course": "csc4320", "id": "csc4320-50"}, {"unit": "ch5", "type": "mc", "q": "Which cancellation approach lets the target thread stop at a safe point?", "choices": ["Asynchronous cancellation", "Deferred cancellation", "Immediate cancellation", "Signal cancellation"], "answer": 1, "explain": "With deferred cancellation, the target periodically checks whether it should terminate. Asynchronous cancellation can leave shared data half-updated.", "course": "csc4320", "id": "csc4320-51"}, {"unit": "ch5", "type": "mc", "q": "Summing a huge array by giving each core its own slice is an example of:", "choices": ["Task parallelism", "Data parallelism", "Concurrency without parallelism", "Fork-join only"], "answer": 1, "explain": "Data parallelism runs the same operation on different chunks of data. Task parallelism runs different operations.", "course": "csc4320", "id": "csc4320-52"}, {"unit": "ch6", "type": "mc", "q": "Under non-preemptive scheduling, scheduling decisions occur only when a process:", "choices": ["Moves from running to ready, or from waiting to ready", "Moves from running to waiting, or terminates", "Receives any interrupt", "Is created"], "answer": 1, "explain": "Situations 1 (running → waiting) and 4 (terminate) force a decision. Situations 2 and 3 are the extra choices preemptive scheduling adds.", "course": "csc4320", "id": "csc4320-53"}, {"unit": "ch6", "type": "mc", "q": "The time it takes the dispatcher to stop one process and start another is called:", "choices": ["Turnaround time", "Response time", "Dispatch latency", "Burst time"], "answer": 2, "explain": "Dispatch latency is pure overhead paid on every switch.", "course": "csc4320", "id": "csc4320-54"}, {"unit": "ch6", "type": "mc", "q": "Which scheduling criteria should be maximized?", "choices": ["Waiting time and turnaround time", "CPU utilization and throughput", "Response time and throughput", "CPU utilization and waiting time"], "answer": 1, "explain": "Maximize CPU utilization and throughput; minimize turnaround, waiting, and response time.", "course": "csc4320", "id": "csc4320-55"}, {"unit": "ch6", "type": "short", "q": "Processes P1 (burst 24), P2 (3), and P3 (3) arrive in order P1, P2, P3 under FCFS. Compute the average waiting time and average turnaround time.", "answer": "Gantt chart: P1 0–24, P2 24–27, P3 27–30. Waiting times are 0, 24, and 27, so the average is 51/3 = 17. Turnaround times are 24, 27, and 30, so the average is 81/3 = 27.", "explain": "If they arrive in order P2, P3, P1 instead, the average wait drops to 3, which shows the convoy effect.", "course": "csc4320", "id": "csc4320-56"}, {"unit": "ch6", "type": "mc", "q": "Short processes stuck waiting behind one long CPU-bound process under FCFS is called:", "choices": ["Starvation", "Aging", "The convoy effect", "Thrashing"], "answer": 2, "explain": "The convoy effect is FCFS's signature weakness and the motivation for SJF.", "course": "csc4320", "id": "csc4320-57"}, {"unit": "ch6", "type": "short", "q": "Using SJF, compute the average waiting time for P1 (6), P2 (8), P3 (7), P4 (3), all arriving at time 0.", "answer": "Order: P4 (0–3), P1 (3–9), P3 (9–16), P2 (16–24). Waiting times are P4 = 0, P1 = 3, P3 = 9, P2 = 16. Average = 28/4 = 7.", "explain": "SJF is optimal: it gives the minimum average waiting time for a given set of processes.", "course": "csc4320", "id": "csc4320-58"}, {"unit": "ch6", "type": "mc", "q": "With exponential averaging and α = 0.5, the previous prediction was 10 ms and the actual burst was 6 ms. What is the next prediction?", "choices": ["6 ms", "7 ms", "8 ms", "10 ms"], "answer": 2, "explain": "T(n+1) = 0.5 × 6 + 0.5 × 10 = 8 ms.", "course": "csc4320", "id": "csc4320-59"}, {"unit": "ch6", "type": "tf", "q": "With α = 0 in exponential averaging, the prediction always equals the most recent actual burst.", "answer": false, "explain": "α = 0 ignores the recent burst, so the prediction never changes. α = 1 makes it equal the most recent burst.", "course": "csc4320", "id": "csc4320-60"}, {"unit": "ch6", "type": "mc", "q": "The preemptive version of SJF is:", "choices": ["Round Robin", "Shortest-Remaining-Time-First", "Priority aging", "Multilevel feedback queue"], "answer": 1, "explain": "SRTF preempts the running process if a newly arrived process has a shorter remaining burst.", "course": "csc4320", "id": "csc4320-61"}, {"unit": "ch6", "type": "mc", "q": "What does SJF's \"shortest job\" actually compare?", "choices": ["Total program length", "The next CPU burst length", "Memory footprint", "Arrival time"], "answer": 1, "explain": "It compares the upcoming CPU burst, which is why predicting that burst is the practical challenge.", "course": "csc4320", "id": "csc4320-62"}, {"unit": "ch7", "type": "mc", "q": "Which is NOT one of the three requirements for a critical-section solution?", "choices": ["Mutual exclusion", "Progress", "Bounded waiting", "Preemption"], "answer": 3, "explain": "The three requirements are mutual exclusion, progress, and bounded waiting.", "course": "csc4320", "id": "csc4320-63"}, {"unit": "ch7", "type": "mc", "q": "The simple turn-variable solution (while (turn == j);) fails which requirement?", "choices": ["Mutual exclusion", "Progress", "Atomicity", "None, it is correct"], "answer": 1, "explain": "It forces strict alternation. If it is Pj's turn but Pj never wants to enter, Pi is locked out of an empty critical section.", "course": "csc4320", "id": "csc4320-64"}, {"unit": "ch7", "type": "short", "q": "Write the entry section of Peterson's solution for process Pi, and explain in one sentence why it provides mutual exclusion.", "answer": "flag[i] = true; turn = j; while (flag[j] && turn == j); Mutual exclusion holds because Pi enters only if flag[j] is false or turn == i, and turn is a single variable that cannot equal both i and j, so both processes cannot pass at once.", "explain": "Exit section: flag[i] = false. On modern CPUs, Peterson's needs memory barriers because independent writes can be reordered.", "course": "csc4320", "id": "csc4320-65"}, {"unit": "ch7", "type": "mc", "q": "Why can Peterson's solution fail on modern architectures?", "choices": ["It uses too much memory", "Processors and compilers may reorder independent writes, and memory may be weakly ordered", "It requires disabling interrupts", "It only works with more than two processes"], "answer": 1, "explain": "Reordering the writes to flag[i] and turn can let both processes into their critical sections. Memory barriers force visibility.", "course": "csc4320", "id": "csc4320-66"}, {"unit": "ch7", "type": "mc", "q": "A lock built from test_and_set() with a busy-wait loop satisfies which requirements?", "choices": ["All three", "Mutual exclusion and progress, but not bounded waiting", "Only bounded waiting", "Mutual exclusion on
