ly"], "answer": 1, "explain": "An unlucky process can lose the TAS race forever. Adding the waiting[] array with a circular scan restores bounded waiting.", "course": "csc4320", "id": "csc4320-67"}, {"unit": "ch7", "type": "mc", "q": "compare_and_swap(&lock, 0, 1) returns:", "choices": ["The new value", "The original value of lock", "True if the swap happened", "Always 1"], "answer": 1, "explain": "CAS atomically returns the original value and swaps only if *value equals expected.", "course": "csc4320", "id": "csc4320-68"}, {"unit": "ch7", "type": "mc", "q": "A semaphore whose value is -3 under the blocking-queue implementation means:", "choices": ["The semaphore is corrupted", "Three resources are available", "Three processes are blocked waiting on it", "Three signals were lost"], "answer": 2, "explain": "In the no-busy-wait version, a negative value's magnitude equals the number of waiting processes.", "course": "csc4320", "id": "csc4320-69"}, {"unit": "ch7", "type": "mc", "q": "To force P1's statement S1 to run before P2's S2, initialize semaphore sync to:", "choices": ["0", "1", "2", "-1"], "answer": 0, "explain": "P1: S1; signal(sync). P2: wait(sync); S2. Starting at 0 means the event has not happened yet, so P2 blocks until P1 signals.", "course": "csc4320", "id": "csc4320-70"}, {"unit": "ch7", "type": "mc", "q": "A process calls wait(mutex) twice in a row without a signal in between. What happens?", "choices": ["Mutual exclusion is violated", "The process blocks permanently on the second wait", "The second wait is ignored", "The semaphore becomes a counting semaphore"], "answer": 1, "explain": "Double wait deadlocks the process and makes the semaphore unavailable to everyone. Reversing the order (signal then wait) violates mutual exclusion.", "course": "csc4320", "id": "csc4320-71"}, {"unit": "ch7", "type": "tf", "q": "A condition variable's x.signal() with no waiting process is remembered, just like a semaphore signal().", "answer": false, "explain": "x.signal() with no waiters has no effect. A semaphore signal() always increments the value.", "course": "csc4320", "id": "csc4320-72"}, {"unit": "ch7", "type": "short", "q": "Distinguish deadlock from livelock.", "answer": "In deadlock, processes are blocked waiting on each other and do nothing. In livelock, processes are actively running, constantly reacting and yielding to each other, but still make no progress, like two people stepping aside the same way in a hallway.", "explain": "Both mean zero progress. Deadlock is idle; livelock burns CPU.", "course": "csc4320", "id": "csc4320-73"}, {"unit": "ch7", "type": "mc", "q": "Why does disabling interrupts fail as a general critical-section solution?", "choices": ["It is too slow on one CPU", "It does not stop another core from entering the critical section, and long sections can starve others", "It violates mutual exclusion on a uniprocessor", "User programs disable interrupts constantly"], "answer": 1, "explain": "It is not scalable to multiprocessors and can starve processes if the section runs long.", "course": "csc4320", "id": "csc4320-74"}, {"unit": "ch8", "type": "mc", "q": "In the bounded-buffer semaphore solution, what are the initial values of mutex, empty, and full for a buffer of size n?", "choices": ["1, 0, n", "1, n, 0", "0, n, 0", "n, 1, 0"], "answer": 1, "explain": "The buffer is free (mutex = 1), all n slots are empty (empty = n), and none are full (full = 0).", "course": "csc4320", "id": "csc4320-75"}, {"unit": "ch8", "type": "short", "q": "What happens if the producer swaps its two waits to wait(mutex); wait(empty); and the buffer is full?", "answer": "Deadlock. The producer takes the mutex, then blocks on empty because no slots are free. The consumer passes wait(full) but blocks on wait(mutex), which the sleeping producer holds. Each waits for something only the other can provide. Rule: acquire the counting semaphore first and the mutex last.", "explain": "Swapping the two signals only hurts efficiency; swapping the two waits kills the program.", "course": "csc4320", "id": "csc4320-76"}, {"unit": "ch8", "type": "mc", "q": "In the reader-priority readers-writers solution, which reader releases rw_mutex?", "choices": ["The first reader", "Every reader", "The last reader to leave (when read_count hits 0)", "The writer"], "answer": 2, "explain": "Only the first reader locks rw_mutex and only the last one out unlocks it. Readers in between just update read_count.", "course": "csc4320", "id": "csc4320-77"}, {"unit": "ch8", "type": "mc", "q": "In the readers-writers solution, what does the inner mutex protect?", "choices": ["The dataset", "read_count", "The writer queue", "rw_mutex itself"], "answer": 1, "explain": "read_count++ and read_count-- are not atomic, so mutex prevents lost updates that would make the first/last-reader tests fire at the wrong time.", "course": "csc4320", "id": "csc4320-78"}, {"unit": "ch8", "type": "tf", "q": "The reader-priority readers-writers solution can starve writers.", "answer": true, "explain": "A continuous stream of overlapping readers keeps read_count above 0, so signal(rw_mutex) never runs.", "course": "csc4320", "id": "csc4320-79"}, {"unit": "ch8", "type": "mc", "q": "The naive dining philosophers solution (one semaphore per chopstick, grab left then right) can:", "choices": ["Violate mutual exclusion on chopsticks", "Deadlock if all five grab their left chopstick at once", "Never deadlock", "Only starve philosopher 0"], "answer": 1, "explain": "Every chopstick is held and every philosopher waits on a neighbor, which is a circular wait.", "course": "csc4320", "id": "csc4320-80"}, {"unit": "ch8", "type": "tf", "q": "The monitor solution to dining philosophers eliminates both deadlock and starvation.", "answer": false, "explain": "It eliminates deadlock by granting both chopsticks atomically, but a philosopher can still starve while both neighbors alternate eating.", "course": "csc4320", "id": "csc4320-81"}, {"unit": "ch8", "type": "mc", "q": "In POSIX, the equivalents of semaphore wait() and signal() are:", "choices": ["sem_lock / sem_unlock", "sem_wait / sem_post", "sem_wait / sem_signal", "pthread_wait / pthread_signal"], "answer": 1, "explain": "There is no sem_signal. signal() maps to sem_post().", "course": "csc4320", "id": "csc4320-82"}, {"unit": "ch8", "type": "mc", "q": "Which POSIX semaphore type can be shared by unrelated processes?", "choices": ["Unnamed, created with sem_init", "Named, created with sem_open", "Both equally", "Neither"], "answer": 1, "explain": "Named semaphores have a string name that unrelated processes can open. Unnamed ones are shared only through fork or shared memory.", "course": "csc4320", "id": "csc4320-83"}, {"unit": "ch8", "type": "short", "q": "Why must pthread_cond_wait be called inside a while loop rather than an if?", "answer": "Between the moment a waiter is signaled and the moment it reacquires the mutex, another thread may have changed the condition again, or the wait may return spuriously. The while loop rechecks the condition on every wakeup; an if would proceed on a stale condition.", "explain": "The same rule applies to Java's wait() inside synchronized methods.", "course": "csc4320", "id": "csc4320-84"}, {"unit": "ch8", "type": "mc", "q": "In Java, a thread that called wait() inside a synchronized method is placed in the object's:", "choices": ["Entry set", "Wait set", "Ready queue", "Monitor queue"], "answer": 1, "explain": "The entry set holds threads waiting to acquire the lock. The wait set holds threads that gave up the lock by calling wait(). notify() moves one from the wait set to the entry set.", "course": "csc4320", "id": "csc4320-85"}, {"unit": "ch8", "type": "mc", "q": "On a single-CPU Linux system, spinlock acquire and release are replaced by:", "choices": ["Semaphores", "Disabling and enabling kernel preemption", "Atomic integers", "Busy waiting"], "answer": 1, "explain": "Spinning makes no sense with no other CPU to release the lock.", "course": "csc4320", "id": "csc4320-86"}, {"unit": "ch9", "type": "short", "q": "List and define the four necessary conditions for deadlock.", "answer": "1) Mutual exclusion: at least one resource is held in a non-sharable mode. 2) Hold and wait: a process holds at least one resource while waiting for others. 3) No preemption: resources cannot be forcibly taken away; only the holder can release them. 4) Circular wait: a cycle of processes exists where each waits for a resource held by the next.", "explain": "All four must hold at once. Breaking any one makes deadlock impossible.", "course": "csc4320", "id": "csc4320-87"}, {"unit": "ch9", "type": "mc", "q": "A resource-allocation graph contains a cycle, and every resource type has a single instance. What can you conclude?", "choices": ["No deadlock", "Deadlock", "Maybe deadlock", "The graph is invalid"], "answer": 1, "explain": "No cycle → no deadlock. Cycle with single instances → deadlock. Cycle with multiple instances → maybe; run graph reduction.", "course": "csc4320", "id": "csc4320-88"}, {"unit": "ch9", "type": "tf", "q": "A cycle in a resource-allocation graph with multi-instance resources always means deadlock.", "answer": false, "explain": "A process outside the cycle may hold an instance it will release, breaking the cycle.", "course": "csc4320", "id": "csc4320-89"}, {"unit": "ch9", "type": "mc", "q": "Deadlock, livelock, and starvation differ as follows. Which statement is correct?", "choices": ["All starved processes are deadlocked", "All deadlocked processes are starved, but starved processes are usually not deadlocked", "Livelocked processes are blocked", "Starvation means no process runs"], "answer": 1, "explain": "Deadlock is blocked forever in a cycle; livelock is running but making no progress; starvation is one process indefinitely postponed while the system progresses.", "course": "csc4320", "id": "csc4320-90"}, {"unit": "ch9", "type": "mc", "q": "In an expedient system, a knot in the resource graph is:", "choices": ["Necessary but not sufficient for deadlock", "Sufficient for deadlock", "Irrelevant to deadlock", "Only possible with consumable resources"], "answer": 1, "explain": "Expedient + knot ⟹ deadlock. A cycle is necessary; a knot is not necessary in general.", "course": "csc4320", "id": "csc4320-91"}, {"unit": "ch9", "type": "tf", "q": "When consumable resources are involved, the order of graph reduction can change the verdict.", "answer": true, "explain": "With consumable resources reducibility may be order-dependent, and complete reducibility is no longer equivalent to freedom from deadlock.", "course": "csc4320", "id": "csc4320-92"}, {"unit": "ch9", "type": "mc", "q": "In the Banker's Algorithm, Need is computed as:", "choices": ["Avail - Alloc", "C - Alloc (maximum claim minus allocation)", "Alloc - C", "C + Avail"], "answer": 1, "explain": "Need[i][j] is the remaining claim: the maximum claim minus what is currently allocated.", "course": "csc4320", "id": "csc4320-93"}, {"unit": "ch9", "type": "tf", "q": "An unsafe state is the same as a deadlocked state.", "answer": false, "explain": "Unsafe means deadlock is possible in some worst-case future. The Banker's Algorithm avoids unsafe states so luck is never required.", "course": "csc4320", "id": "csc4320-94"}, {"unit": "ch9", "type": "mc", "q": "Which deadlock prevention approach is the practical winner?", "choices": ["Make all resources sharable", "Request all resources at startup", "Impose a total ordering and request resources in ascending order", "Allow preemption of all resources"], "answer": 2, "explain": "Resource ordering makes circular wait impossible; the other approaches are infeasible or wasteful.", "course": "csc4320", "id": "csc4320-95"}, {"unit": "ch9", "type": "short", "q": "Contrast deadlock prevention with deadlock avoidance.", "answer": "Prevention breaks one of the four necessary conditions by design, so it needs no runtime information or per-request check, but it is restrictive and can waste resources. Avoidance allows all four conditions but uses runtime information, the declared maximum claim, to refuse requests that would lead to an unsafe state, running a check such as the Banker's Algorithm on every request. It is more flexible but has runtime overhead and requires maxima to be declared up front.", "explain": "Detection and recovery is the third option: allow deadlock, find it, and pay the recovery cost.", "course": "csc4320", "id": "csc4320-96"}, {"unit": "ch9", "type": "mc", "q": "Why is killing and restarting a deadlocked process not free?", "choices": ["Processes cannot be terminated", "Process execution is generally not idempotent, so restarting can repeat side effects", "It always causes a new deadlock", "The PCB cannot be reused"], "answer": 1, "explain": "A process that already printed or sent messages cannot simply be re-run without repeating those effects.", "course": "csc4320", "id": "csc4320-97"}, {"unit": "ch9", "type": "mc", "q": "Two processes each request 40 blocks, then another 40 (P1), or 30 then 50 (P2), from 100 blocks. After both first requests are granted, what happens?", "choices": ["Both complete", "Only P1 completes", "Deadlock: 30 blocks are free but P1 needs 40 and P2 needs 50", "Only P2 completes"], "answer": 2, "explain": "70 of 100 are allocated. Neither remaining request can be satisfied, so they deadlock on quantities of a single resource type.", "course": "csc4320", "id": "csc4320-98"}, {"unit": "ch10", "type": "mc", "q": "The base register is 300040 and the limit register is 120900. What is the highest legal address?", "choices": ["420940", "420939", "120900", "300040"], "answer": 1, "explain": "Legal addresses satisfy base ≤ address < base + limit, so the highest is 300040 + 120900 − 1 = 420939.", "course": "csc4320", "id": "csc4320-99"}, {"unit": "ch10", "type": "mc", "q": "Absolute code can be generated for which binding time?", "choices": ["Compile time", "Load time", "Execution time", "Link time only"], "answer": 0, "explain": "Only when the memory location is known at compile time can addresses be hard-coded.", "course": "csc4320", "id": "csc4320-100"}, {"unit": "ch10", "type": "mc", "q": "The mapping of logical to physical addresses is done in hardware by the:", "choices": ["Relocation register alone", "Memory address register", "Memory-management unit (MMU)", "Loader"], "answer": 2, "explain": "The MMU performs run-time mapping; the relocation register is a component it uses.", "course": "csc4320", "id": "csc4320-101"}, {"unit": "ch10", "type": "mc", "q": "Which placement strategy produces the smallest leftover hole?", "choices": ["First-fit", "Best-fit", "Worst-fit", "Next-fit"], "answer": 1, "explain": "Best-fit picks the smallest hole that fits. Worst-fit leaves the largest leftover. First-fit and best-fit beat worst-fit in speed and utilization.", "course": "csc4320", "id": "csc4320-102"}, {"unit": "ch10", "type": "tf", "q": "Compaction is possible only if relocation is dynamic and done at execution time.", "answer": true, "explain": "Moving a process mid-run requires translating addresses through a register the OS can update.", "course": "csc4320", "id": "csc4320-103"}, {"unit": "ch10", "type": "mc", "q": "Paging eliminates which kind of fragmentation?", "choices": ["Internal", "External", "Both", "Neither"], "answer": 1, "explain": "Any page fits any frame, so there is no external fragmentation. Internal fragmentation remains in each process's last page.", "course": "csc4320", "id": "csc4320-104"}, {"unit": "ch10", "type": "short", "q": "With 4-byte pages and a page table mapping page 0→5, 1→6, 2→1, 3→2, translate logical address 13 to a physical address.", "answer": "page = 13 ÷ 4 = 3, offset = 13 mod 4 = 1. Page 3 maps to frame 2. Physical address = 2 × 4 + 1 = 9.", "explain": "General recipe: p = floor(addr / pagesize), d = addr mod pagesize, physical = frame(p) × pagesize + d.", "course": "csc4320", "id": "csc4320-105"}, {"unit": "ch10", "type": "short", "q": "Page size is 2,048 bytes and a process is 72,766 bytes. How many frames does it need, and how much internal fragmentation is there?", "answer": "72,766 ÷ 2,048 = 35 full pages with 1,086 bytes left over, so it needs 36 frames. Internal fragmentation = 2,048 − 1,086 = 962 bytes.", "explain": "Worst case wastes one frame minus one byte; the average is half a frame per process.", "course": "csc4320", "id": "csc4320-106"}, {"unit": "ch10", "type": "mc", "q": "With a 10 ns memory access, a TLB hit ratio of 80%, and free TLB lookup, what is the effective access time?", "choices": ["10 ns", "11 ns", "12 ns", "18 ns"], "answer": 2, "explain": "EAT = 0.80 × 10 + 0.20 × 20 = 12 ns, a 20% slowdown. At a 99% hit ratio it is 10.1 ns.", "course": "csc4320", "id": "csc4320-107"}, {"unit": "ch10", "type": "mc", "q": "Without ASID support in the TLB, what must happen on each context switch?", "choices": ["The page table is deleted", "The TLB must be flushed", "The PTBR is left unchanged", "Nothing"], "answer": 1, "explain": "Otherwise the next process would use the previous process's translations.", "course": "csc4320", "id": "csc4320-108"}, {"unit": "ch10", "type": "mc", "q": "A 32-bit logical address space with 4 KB pages and 4-byte entries needs how much memory for one flat page table?", "choices": ["4 KB", "1 MB", "4 MB", "4 GB"], "answer": 2, "explain": "2^32 / 2^12 = 2^20 entries × 4 bytes = 4 MB per process, which is why the page table itself gets paged.", "course": "csc4320", "id": "csc4320-109"}, {"unit": "ch10", "type": "tf", "q": "Dynamic loading requires special operating system support.", "answer": false, "explain": "Dynamic loading is implemented through program design. Dynamic linking (stubs and shared libraries) is the OS-supported mechanism.", "course": "csc4320", "id": "csc4320-110"}, {"unit": "ch11", "type": "mc", "q": "With a 1 KB page size, what are the page number and offset for address 3085?", "choices": ["Page 3, offset 13", "Page 3, offset 85", "Page 30, offset 85", "Page 2, offset 1037"], "answer": 0, "explain": "floor(3085 / 1024) = 3 and 3085 mod 1024 = 13.", "course": "csc4320", "id": "csc4320-111"}, {"unit": "ch11", "type": "short", "q": "A system has a 32-bit logical address, 4 KB pages, and 512 MB of physical memory. How many entries are in a conventional page table and in an inverted page table?", "answer": "Conventional: 2^32 / 2^12 = 2^20 = 1,048,576 entries per process. Inverted: 512 MB / 4 KB = 2^29 / 2^12 = 2^17 = 131,072 entries for the whole system.", "explain": "A conventional table is sized by logical space per process; an inverted table is sized by physical memory for the whole system.", "course": "csc4320", "id": "csc4320-112"}, {"unit": "ch11", "type": "mc", "q": "What is a known drawback of inverted page tables?", "choices": ["They use more memory than conventional tables", "Lookups require searching, and shared memory is awkward", "They cannot be used with a TLB", "They only work for 32-bit addresses"], "answer": 1, "explain": "Each frame records one mapping, and lookups search for (pid, page), mitigated by hashing and the TLB.", "course": "csc4320", "id": "csc4320-113"}, {"unit": "ch11", "type": "mc", "q": "Each element in a hashed page table's chain contains:", "choices": ["Only the frame number", "Virtual page number, mapped frame, and a pointer to the next element", "Process ID and offset", "The outer and inner page indices"], "answer": 1, "explain": "Translation walks the chain comparing virtual page numbers until one matches.", "course": "csc4320", "id": "csc4320-114"}, {"unit": "ch11", "type": "short", "q": "A 100 MB process is swapped out to a hard drive at 140 MB/s and a same-size process is swapped in. Estimate the context-switch time.", "answer": "Swap out: 100 / 140 ≈ 714 ms. Swap in: another ≈ 714 ms. Total ≈ 1,428 ms, about 1.4 seconds.", "explain": "On an NVMe SSD at 14,700 MB/s, the total is about 13.6 ms, still huge next to a normal context switch.", "course": "csc4320", "id": "csc4320-115"}, {"unit": "ch11", "type": "tf", "q": "iOS and Android support paging but typically do not support swapping.", "answer": true, "explain": "Flash has limited write cycles, small capacity, and poor throughput on mobile. iOS asks apps to free memory; Android terminates apps after saving state.", "course": "csc4320", "id": "csc4320-116"}, {"unit": "ch11", "type": "mc", "q": "How is the IA-32 16-bit segment selector divided?", "choices": ["13-bit segment number, 1-bit GDT/LDT flag, 2-bit protection", "8-bit segment, 8-bit offset", "12-bit segment, 4-bit protection", "14-bit segment, 2-bit flags"], "answer": 0, "explain": "s = 13 bits, g = 1 bit (GDT vs LDT), p = 2 bits.", "course": "csc4320", "id": "csc4320-117"}, {"unit": "ch11", "type": "mc", "q": "For 4 KB pages, IA-32 splits the 32-bit linear address as:", "choices": ["12 / 10 / 10", "10 / 10 / 12", "20 / 12", "8 / 12 / 12"], "answer": 1, "explain": "10 bits index the page directory, 10 bits index the page table, and 12 bits are the offset. A 4 MB page uses a 22-bit offset.", "course": "csc4320", "id": "csc4320-118"}, {"unit": "ch11", "type": "mc", "q": "PAE on IA-32 allows up to how much physical memory?", "choices": ["4 GB", "16 GB", "64 GB", "1 TB"], "answer": 2, "explain": "PAE uses three-level paging with 64-bit entries for 36-bit physical addresses (64 GB). Virtual addresses stay 32-bit.", "course": "csc4320", "id": "csc4320-119"}, {"unit": "ch11", "type": "mc", "q": "x86-64 in practice implements:", "choices": ["64-bit virtual and 64-bit physical addresses", "48-bit virtual and 52-bit physical addresses with four-level paging", "32-bit virtual and 36-bit physical addresses", "52-bit virtual and 48-bit physical addresses"], "answer": 1, "explain": "Page sizes are 4 KB, 2 MB, or 1 GB.", "course": "csc4320", "id": "csc4320-120"}, {"unit": "ch11", "type": "mc", "q": "On an ARM memory reference, which TLB is checked first?", "choices": ["The main TLB", "The micro TLBs (data and instruction)", "The page table", "The inverted table"], "answer": 1, "explain": "The micro TLB is checked first, then the main TLB, then the CPU walks the page table itself.", "course": "csc4320", "id": "csc4320-121"}, {"unit": "ch11", "type": "tf", "q": "Swapping and paging solve the same problem.", "answer": false, "explain": "Paging is an address-translation scheme that removes contiguity. Swapping is a capacity scheme that moves memory to disk. You can page without swapping.", "course": "csc4320", "id": "csc4320-122"}]</script>

<section id="how" class="prose">
  <h3>How to use these notes</h3>
  <p>Read a lecture top to bottom once, then come back and use the colored boxes as your review layer. Each box type always means the same thing:</p>
  <div class="legend">
    <div class="box def"><span class="lbl">Definition</span><p>Plain English, the technical version, and why it matters.</p></div>
    <div class="box proc"><span class="lbl">Process</span><p>A sequence of steps you may need to reproduce.</p></div>
    <div class="box ex"><span class="lbl">Worked example</span><p>Problems that get harder as you go.</p></div>
    <div class="box warn"><span class="lbl">Misconception</span><p>Traps that cost points on exams.</p></div>
    <div class="box exam"><span class="lbl">Exam practice</span><p>Questions with the answer hidden until you open it.</p></div>
    <div class="box bg"><span class="lbl">Background</span><p>Prerequisite knowledge the slides assume.</p></div>
  </div>
  <p>Your professor ended the L01a deck with a "Worth notice" list, which is the clearest signal of what gets tested. Those items are marked in each lecture's exam checklist. The course is cumulative, so earlier material can reappear on later tests.</p>
  <p>Three interactive tools are built in: a <a href="#tool-caesar">Caesar cipher breaker</a>, an <a href="#tool-rsa">RSA calculator</a>, and a <a href="#tool-perm">UNIX permission decoder</a>. Use them to check your hand work, not to replace it: exams are closed-tool.</p>
</section>

<section class="lecture prose" id="l00">
  <div class="plate"><span class="num" aria-hidden="true">L00</span><p class="ttl">Course orientation</p><p class="src">Source: L00-Course-Info-itec4235.pdf</p></div>

  <h3 id="l00-policies">Course policies and grading</h3>
  <h4>Big picture</h4>
  <p>This deck is logistics, but some of it is quietly testable (the ethics of authorized security work shows up again in L00B) and all of it affects your grade. The course is face-to-face, 4 credit hours, and mixes lecture, demonstrations, hands-on labs, and a term project. The theme of the whole course is on the closing slide: <em>learn the concept, run the lab, and explain the evidence.</em> Security "becomes real when you can observe, reproduce, and explain it."</p>

  <h4>Explanation</h4>
  <h5>Who and where</h5>
  <p>Instructor: Dr. Peng Wang (wpeng2@gsu.edu), 25 Park Place, Room 714. Office hours are Tuesday/Thursday 1:30–2:00 pm in person and Friday 11:00 am–12:00 pm online over Zoom. Always email from your GSU account. Materials, deadlines, and submissions live in iCollege (D2L).</p>

  <h5>Prerequisites</h5>
  <p>CSC 2720 (Data Structures) and CSC 3320 (System-Level Programming) with a C or better; students without them can be dropped at any time. Recommended: Java or Python, C, and Unix basics, plus comfort converting between decimal, binary, and hexadecimal. That last one matters a lot in this course, because keys, hashes, and ciphertexts are almost always shown in hex. A refresher follows below.</p>

  <h5>Texts</h5>
  <p>Recommended: Stallings &amp; Brown, <em>Computer Security: Principles and Practice</em>, 5th ed. Many slides in L01a and L03a ("Table 1.1", "Figure 2.3") come straight from this book, so its chapters 1–2 are the best companion reading. Supplementary: Trappe (<em>Introduction to Cryptography with Coding Theory</em>, the source of the Alice/Bob/Eve slides) and Goodrich &amp; Tamassia (<em>Introduction to Computer Security</em>, the source of the CIA/AAA and block cipher slides).</p>

  <h5>What the course covers</h5>
  <ul>
    <li>Cryptography, hashing, passwords, and secure protocols</li>
    <li>Linux/Windows security, permissions, and access control</li>
    <li>Program security, buffer overflows, and malware analysis</li>
    <li>Network scanning, packet analysis, detection, and firewalls</li>
    <li>HTTPS, sessions, web attacks, distributed systems, and AI security</li>
  </ul>

  <h5>Learning outcomes</h5>
  <p>Foundations: explain ethical hacking and its legal boundaries; use controlled tools to investigate network and system behavior; identify common vulnerabilities, attacks, and malware. Practice: analyze how threats are discovered, validated, mitigated, and monitored; apply basic encryption, hashing, and secure protocols; document commands, evidence, and technical conclusions.</p>

  <div class="box proc"><span class="lbl">Process: how a class week works</span>
    <ol>
      <li>Attend the face-to-face class.</li>
      <li>Concept briefing plus a demonstration.</li>
      <li>Practice the technique in a controlled local lab.</li>
      <li>Complete the assigned evidence, report, or code.</li>
      <li>Check iCollege and GSU email for updates.</li>
    </ol>
  </div>

  <p>Pop quizzes may count toward the exam grade or as bonus points, per what is announced in class.</p>

  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: weighted course grade</span>
    <div class="eq">Grade = 0.30·A + 0.05·P + 0.25·M + 0.25·F + 0.15·T</div>
    <p>Each letter is your percentage in that category (0–100). The weights add up to 1.00, so the result is also a percentage.</p>
    <p><strong>Worked example.</strong> Assignments 92, participation 100, midterm 78, project 88. What final exam score F gets you a 85 overall? 0.30(92) + 0.05(100) + 0.25(78) + 0.15(88) = 27.6 + 5 + 19.5 + 13.2 = 65.3. You need 0.25F = 85 − 65.3 = 19.7, so F = 78.8.</p>

    <p>A 100-point lab earns a raw 86 but is one day late. The most common reading of "90% of total points" is that your score is multiplied by 0.9: 86 × 0.9 = 77.4. Another reading is that the maximum drops to 90 points. Because the wording allows both, confirm with Dr. Wang before you rely on either. The practical lesson is the same: two days late costs 30% and three days late costs everything.</p>
  </div>

  <h5>Authorized security work (important beyond grading)</h5>
  <p>Use only authorized course environments: local Docker containers, toy systems, packet captures, provided files, and simulated datasets. <strong>Never scan, attack, exploit, or test real third-party systems.</strong> This is not just a course rule. As L00B explains, accessing a computer without permission is a crime even if you "don't break anything."</p>

  <h5>Labs</h5>
  <p>Before Lab 0, install Docker Desktop, Git, and a terminal. STUDENT_SETUP.md and TROUBLESHOOTING.md are your first stop when stuck. The Lab 0 startup commands:</p>
<pre class="code"><code>cd lab00-kali-docker-networking      # move into the lab folder
docker compose up -d --build         # build images and start containers in the background (-d = detached)
docker compose ps                    # list running containers and their status
docker compose exec kali bash        # open a bash shell inside the "kali" container</code></pre>
  <div class="box bg"><span class="lbl">Background: Docker in one paragraph</span>
    <p>A <strong>container</strong> is a lightweight, isolated environment that runs its own filesystem and processes on your machine's kernel. <strong>Docker Compose</strong> reads a <code>docker-compose.yml</code> file describing several containers (for example an attacker "kali" box and a victim box) and a private network between them. Because the whole lab lives inside that private network, you can practice scanning and attacking without touching any real system, which is exactly what the authorized-work policy requires.</p>
  </div>

  <h5>Conduct, honesty, and AI tools</h5>
  <p>Submit your own work and be able to explain it. Follow each assignment's rules on AI and collaboration; AI output is not a substitute for evidence or understanding. No AI or outside help on quizzes or exams unless explicitly allowed. Course materials are for enrolled students only and must not be posted publicly. Disagreement in class is fine when supported with evidence; harassment and personal attacks are not. Excused absences go through the Dean of Students.</p>

  <h3 id="l00-numbers">Number systems refresher (prerequisite)</h3>
  <h4>Big picture</h4>
  <p>The syllabus asks you to be comfortable with decimal, binary, and hexadecimal. Cryptography works on bits, but humans read those bits in hex. A 128-bit AES key is 32 hex digits; a SHA-256 digest is 64 hex digits. If you can move between these bases quickly, the rest of the course gets easier.</p>

  <div class="box def"><span class="lbl">Definition: positional number system</span>
    <dl>
      <dt>Plain English</dt><dd>A way of writing numbers where each digit's value depends on its position.</dd>
      <dt>Technical</dt><dd>In base b, the digit string d<sub>k</sub>…d<sub>1</sub>d<sub>0</sub> means Σ d<sub>i</sub>·b<sup>i</sup>. Decimal is base 10 (digits 0–9), binary base 2 (0–1), hexadecimal base 16 (0–9, A=10 … F=15).</dd>
      <dt>Why it matters</dt><dd>Keys, hashes, permissions (octal, base 8), and packet bytes are all written in non-decimal bases.</dd>
    </dl>
  </div>

  <div class="box proc"><span class="lbl">Process: converting between bases</span>
    <p><strong>Decimal → binary:</strong> repeatedly divide by 2 and read the remainders bottom to top.</p>
    <p><strong>Binary → hex:</strong> group bits in fours from the right; each group is one hex digit. This works because 16 = 2<sup>4</sup>.</p>
    <p><strong>Binary → octal:</strong> group bits in threes (8 = 2<sup>3</sup>). This is how <code>chmod 754</code> works (see L04a).</p>
    <p><strong>Any base → decimal:</strong> multiply each digit by its place value and add.</p>
  </div>

  <div class="box ex"><span class="lbl">Worked examples <span class="lvl">easy → hard</span></span>
    <p><strong>1.</strong> 13 in binary: 13÷2 = 6 r1, 6÷2 = 3 r0, 3÷2 = 1 r1, 1÷2 = 0 r1. Read upward: <code>1101</code>. Check: 8+4+0+1 = 13.</p>
    <p><strong>2.</strong> <code>0x2F</code> to decimal: 2·16 + 15 = 47.</p>
    <p><strong>3.</strong> <code>1011 0110</code> to hex: 1011 = B, 0110 = 6, so <code>0xB6</code> = 182.</p>
    <p><strong>4.</strong> How many bits in a 64-hex-digit hash? Each hex digit is 4 bits, so 64 × 4 = 256 bits (that is SHA-256).</p>
    <p><strong>5.</strong> One byte is 8 bits, which is exactly 2 hex digits (00–FF, 0–255). "Hello" is 5 bytes: <code>48 65 6C 6C 6F</code>.</p>
  </div>
  <div class="box warn"><span class="lbl">Misconception</span>
    <p>Grouping bits from the left instead of the right. <code>101101</code> is <code>0010 1101</code> = <code>0x2D</code>, not <code>1011 01</code>. Pad with leading zeros first.</p>
  </div>
</section>

<section class="lecture prose" id="l00b">
  <div class="plate"><span class="num" aria-hidden="true">L00B</span><p class="ttl">Ethical hacking</p><p class="src">Source: L00B-EthicHacking.pdf (partial slides credited to samsclass.info)</p></div>

  <h3 id="l00b-hackers">Hackers, crackers, and hat colors</h3>
  <h4>Big picture</h4>
  <p>This course teaches attack techniques. The only thing separating a security professional from a criminal who uses the same tools is <em>authorization</em>. This lecture draws that line so you understand why every lab stays inside Docker.</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: hacker</span>
    <dl>
      <dt>Plain English</dt><dd>Someone who gets into a computer or network they were not given permission to use.</dd>
      <dt>Technical</dt><dd>A person who accesses a computer system or network without authorization. Motivations range from proving status to causing damage.</dd>
      <dt>Why it matters</dt><dd>The U.S. Department of Justice treats unauthorized access as illegal regardless of motive; hackers and crackers alike can go to prison.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: cracker</span>
    <dl>
      <dt>Plain English</dt><dd>A hacker whose goal is to steal or destroy.</dd>
      <dt>Technical</dt><dd>An individual who breaks into systems specifically to steal or destroy data.</dd>
      <dt>Why it matters</dt><dd>The slide distinguishes intent (curiosity vs. harm), but legally both are breaking the law.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Type</th><th>Behavior</th><th>Who benefits</th></tr></thead>
    <tbody>
      <tr><td>Black hat (cracker)</td><td>Extraordinary skill used for malicious or destructive activity</td><td>Themselves, usually by hurting others</td></tr>
      <tr><td>White hat</td><td>Hacker skills used for defense, with permission</td><td>Others and the common good</td></tr>
      <tr><td>Grey hat</td><td>Works offensively and defensively at different times</td><td>Unpredictable; behavior cannot be predicted</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Misconception</span>
    <p>"Grey hat means mostly good." The slide's defining feature of grey hats is <em>unpredictability</em>, not good intentions. A grey hat who breaks in without permission to report a flaw has still accessed a system without authorization.</p>
  </div>

  <h3 id="l00b-process">The hacking process</h3>
  <h4>Big picture</h4>
  <p>Attacks follow a repeatable lifecycle. Defenders (and ethical hackers) study the same lifecycle so they know where to detect and block an attacker.</p>

  <h4>Diagram explained: "Hacking defined"</h4>
  <figure class="fig">
<pre class="mermaid">
flowchart TD
  T([TRY]) --> S{Success?}
  S -- No --> T
  S -- Yes --> N([NEXT])
</pre>
    <figcaption>Redrawn from the slide: a loop that repeats until an attempt works, then moves to the next stage.</figcaption>
  </figure>
  <p>The slide's flowchart has three parts: a <strong>TRY</strong> box, a <strong>Success?</strong> decision diamond, and a <strong>NEXT</strong> box. A "No" sends you back to TRY; a "Yes" advances. The joke has a real point: hacking is mostly persistence. Attackers try many passwords, many ports, many exploits, and only need one to work. Keep this in mind for L01a's challenge #6: attackers need one weakness; defenders must close all of them.</p>

  <div class="box proc"><span class="lbl">Process: the four phases of an attack</span>
    <ol>
      <li><strong>Footprinting.</strong> Passive information gathering about the target: domain names, IP ranges, employee names, technologies in use, public documents. Nothing is sent to the target that would look like an attack. Example: reading a company's job postings reveals it runs Windows Server and Cisco firewalls.</li>
      <li><strong>Scanning.</strong> Actively probing the target to find live hosts, open ports, and running services and their versions. Tool: <code>nmap</code>. Example: discovering port 22 (SSH) and 80 (HTTP) are open on a server.</li>
      <li><strong>Gaining access.</strong> Exploiting a vulnerability found during scanning to get in: a weak password, an unpatched service, a misconfiguration. Tool: Metasploit.</li>
      <li><strong>Maintaining access.</strong> Making sure you can come back later, even if the original hole is fixed: backdoors, rootkits, new accounts.</li>
    </ol>
    <p><strong>Why it exists:</strong> each phase feeds the next. You cannot exploit a service you have not found, and you cannot find it without knowing where to look.</p>
    <p><strong>Common exam questions:</strong> put the phases in order; identify the phase from a scenario ("the attacker ran nmap" = scanning); name a tool for a phase.</p>
    <p><strong>Common misconception:</strong> that scanning is the first step. Footprinting comes first, and much of it is legal public research.</p>
  </div>

  <h5>What attackers do after getting in</h5>
  <p>The slide lists post-exploitation behavior. Each item has a purpose:</p>
  <ul>
    <li><strong>Patch the security hole</strong> they used, so other hackers cannot get in and compete for the machine.</li>
    <li><strong>Clear logs and hide themselves</strong> so administrators do not notice (often called "covering tracks").</li>
    <li><strong>Install a rootkit (backdoor)</strong> so they can return later. Rootkits may bundle Trojans and other malware and are designed to hide from the OS.</li>
    <li><strong>Install scanners</strong> (mscan, sscan, nmap) to use this machine to scan other networks. The victim becomes a launching point.</li>
    <li><strong>Install exploit programs</strong> to attack further targets from inside.</li>
    <li><strong>Install denial-of-service programs</strong> so the machine can join attacks on others.</li>
    <li><strong>Use everything silently.</strong></li>
  </ul>
  <div class="box exam"><span class="lbl">Exam practice</span>
    <details><summary>Why would an attacker patch the very vulnerability they used?</summary><div><p>To keep exclusive control. If other attackers can use the same hole, they may disrupt the system or draw the administrator's attention. The attacker already has a backdoor, so they no longer need the original vulnerability.</p></div></details>
    <details><summary>A compromised server starts probing other companies' networks. Which post-exploitation step explains this?</summary><div><p>Installing scanner programs (and possibly exploit programs). The victim is being used as a pivot so the scans do not trace back to the attacker.</p></div></details>
  </div>

  <h3 id="l00b-ethics">Ethics and the law</h3>
  <h4>Big picture</h4>
  <p>The slides argue that "no damage" is not a defense. They build the case from moral philosophy (duty, Kant), property law (information as property), and specific statutes.</p>

  <h4>Explanation</h4>
  <h5>"Duty is what counts"</h5>
  <p>This is duty-based ethics (deontology, associated with Immanuel Kant): whether an act is right depends on the act and your obligations, not on what you want or on how things turn out. Applied here: breaking into a system to learn about it or to point out flaws is wrong even when nothing is damaged. The slide's analogy is breaking and entering. If you break into a house and take nothing, you have still committed a crime, because you took away the owner's sense of security.</p>

  <h5>Information is property</h5>
  <ul>
    <li><strong>UK Criminal Damage Act 1971:</strong> an offender was convicted of property damage even though the property was intangible and the "damage" could only be detected by a machine. Data counts as property.</li>
    <li><strong>UK Computer Misuse Act 1990:</strong> created the specific offenses of "unauthorized access" and "data modification," which made computer crimes easier to prosecute because prosecutors no longer had to stretch older property laws.</li>
  </ul>
  <div class="box bg"><span class="lbl">Background: the U.S. equivalent</span>
    <p>The slides cite UK law. The main U.S. federal law is the Computer Fraud and Abuse Act (CFAA, 1986), which similarly criminalizes accessing a computer "without authorization" or "exceeding authorized access." The slide's mention of the Department of Justice and the CHIP units refers to U.S. enforcement.</p>
  </div>

  <h5>Public information</h5>
  <p>Information deliberately published is accessible, but that does not give you the right to destroy or edit it. Information not deliberately published, like account numbers and personal data, should not be sought out regardless of your intentions.</p>

  <h5>International legislation</h5>
  <p>The United Nations and Council of Europe draft law that applies across borders (the Council of Europe's 2001 Budapest Convention on Cybercrime is the best-known example). The slides define three roles a computer can play in a cybercrime:</p>
  <div class="tw"><table>
    <thead><tr><th>Role</th><th>Meaning</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td>Target</td><td>The computer itself is attacked</td><td>Spreading viruses</td></tr>
      <tr><td>Tool</td><td>The computer is used to commit a traditional crime</td><td>Credit card fraud</td></tr>
      <tr><td>Accessory</td><td>The computer stores evidence or illegal material</td><td>Storing stolen information</td></tr>
    </tbody>
  </table></div>
  <p>Memory trick: <strong>TTA</strong>, "the computer is hit, used, or holds."</p>

  <h5>Freedom of speech and hacktivism</h5>
  <p><strong>Hacktivism</strong> is hacking for a political or social cause (for example defacing a political group's website). The slide argues it violates the target's First Amendment free speech rights: you are silencing their speech to promote yours. The ethical alternative is to publish your own site or blog. The Kantian principle behind this: no one's rights should be taken at the expense of another's, because all people are equal.</p>

  <h5>The hidden subculture</h5>
  <p>Hacker communities develop norms to avoid getting caught: keep a low profile, do not brag to outsiders, do not "narc" on fellow hackers. The slide's argument is that these norms exist precisely because members know what they do is wrong.</p>

  <h5>What you can and cannot do legally</h5>
  <ul>
    <li>Technology law changes as fast as technology, and varies by location. Find out what is legal where you are.</li>
    <li>Federal laws are getting more specific about cybercrime and intellectual property. The DOJ created <strong>CHIP</strong> (Computer Hacking and Intellectual Property) units to prosecute these crimes.</li>
    <li>Some hacking tools may be illegal to possess in some places; the slide advises checking with local law enforcement before installing them.</li>
    <li>Written law is open to interpretation, and punishments are becoming more serious.</li>
  </ul>
  <p><strong>Is port scanning legal?</strong> It depends. Some states consider it legal; the federal government does not treat it as a violation and leaves it to the states. Your ISP's Acceptable Use Policy may still forbid it and can cut off your service. IRC "bots" (programs that auto-respond to make it look like a person is present) may also be forbidden by the AUP.</p>
  <p><strong>Clearly illegal:</strong> accessing a computer without permission; installing worms or viruses; denial-of-service attacks; denying users access to network resources. Even a legitimate tester must make sure their actions do not prevent the customer's employees from doing their jobs.</p>

  <div class="box exam"><span class="lbl">Discussion scenarios from the slides</span>
    <p>These have no single "correct" answer, but a strong exam answer applies the lecture's framework: authorization, duty, and harm to others' rights.</p>
    <details><summary>Hacking a government system to point out flaws without harming it</summary><div><p>Unethical under the lecture's framework. No permission was given, and "no damage" does not matter under duty-based ethics (the breaking-and-entering analogy). The ethical path is responsible disclosure through official channels or an authorized bug bounty.</p></div></details>
    <details><summary>Hacking a home computer to point out flaws</summary><div><p>Unethical for the same reason, and it also invades personal privacy. It takes away the owner's sense of security.</p></div></details>
    <details><summary>A grad student builds a site imitating an airline to show fake boarding passes are possible</summary><div><p>A real 2006 case (Christopher Soghoian). Arguments for: no system was broken into, and it exposed a real public-safety weakness. Arguments against: it could help actual attackers, and it was done without coordinating with authorities. Good answers weigh the public benefit against the risk and discuss disclosure to the TSA/airline first.</p></div></details>
    <details><summary>A hacker finds a data company publishing SSNs it promised to keep private, and goes to the press</summary><div><p>If the data was discovered in publicly released reports (no break-in), exposing a broken promise may be justified whistleblowing. If the hacker broke in to find it, the access itself is unethical and illegal. Publicizing the SSNs themselves would harm the very people being "protected."</p></div></details>
    <details><summary>Editing a political candidate's website because you disagree</summary><div><p>Clearly unethical: this is the hacktivism case. It is unauthorized modification and silences the candidate's speech. Create your own site instead.</p></div></details>
  </div>

  <h3 id="l00b-pentest">Ethical hacking and penetration testing</h3>
  <h4>Big picture</h4>
  <p>Organizations hire people to attack them on purpose, under contract, so they find weaknesses before criminals do. The one thing that makes this legal is the owner's permission.</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: ethical hacking</span>
    <dl>
      <dt>Plain English</dt><dd>Hacking with the owner's permission to find and report problems.</dd>
      <dt>Technical</dt><dd>Also called penetration testing or white-hat hacking: using the same tools, tricks, and techniques as attackers, legally, as an independent security professional who neither damages systems nor steals information, then reports vulnerabilities to the owner.</dd>
      <dt>Why it matters</dt><dd>It is the job description behind most of the hands-on work in this course.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: penetration test vs. security test</span>
    <dl>
      <dt>Plain English</dt><dd>A pen test tries to break in and reports what worked. A security test does that and also reviews policies and recommends fixes.</dd>
      <dt>Technical</dt><dd><strong>Penetration test:</strong> legally breaking into a company's network to find weaknesses; the tester only reports findings. <strong>Security test:</strong> a broader engagement that adds analysis of the company's security policy and procedures and offers solutions to secure the network.</dd>
      <dt>Why it matters</dt><dd>A classic compare-and-contrast exam item. Key phrase: security test = pen test + policy analysis + solutions.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: security policy</span>
    <dl>
      <dt>Plain English</dt><dd>The organization's written rulebook for secure behavior.</dd>
      <dt>Technical</dt><dd>A document that sets rules for expected behavior by users (patch regularly, use strong passwords) and IT staff (no unauthorized access to users' files), defines access control rules, defines consequences of violations, and helps track regulatory compliance.</dd>
      <dt>Why it matters</dt><dd>A security test checks whether the policy exists, is sensible, and is followed. The slide's examples: "Passwords must not be written down," and "Access to files must be granted to the level required by users' job" (least privilege, which returns in L04a).</dd>
    </dl>
  </div>

  <h4>Explanation: penetration testing models</h4>
  <div class="tw"><table>
    <thead><tr><th>Model</th><th>What the tester knows</th><th>Who knows about the test</th><th>What it measures</th></tr></thead>
    <tbody>
      <tr><td>White box</td><td>Everything: topology, technology; may interview IT staff and employees</td><td>Staff generally aware</td><td>Thorough internal weaknesses; easiest for tester</td></tr>
      <tr><td>Black box</td><td>Nothing; must discover details</td><td>Staff not told</td><td>Whether security staff detect a real-looking attack</td></tr>
      <tr><td>Gray box</td><td>Partial information</td><td>Varies</td><td>A hybrid balance of depth and realism</td></tr>
    </tbody>
  </table></div>
  <p>Memory trick: the "box" is the target. A <em>white</em> box is transparent (you see inside), a <em>black</em> box is opaque, and <em>gray</em> is in between.</p>

  <h4>Diagram explained: Figure 1-1, a sample network diagram</h4>
  <p>The slide shows an office floor plan with dimensions in feet. Along the top are a conference/break room and four office cubicles (15′, 15′, 12′, 12′, 12′ wide), each with a workstation. An 8′ closet labeled <strong>"Wire &amp; phone equipment"</strong> holds the <strong>NetWare servers</strong> (NetWare was a Novell network operating system). Next to it is the <strong>Network administrator</strong>'s office. The middle holds the Lobby and restrooms, with more workstations nearby. On the right are the <strong>Production</strong> (20′) and <strong>Shipping</strong> (30′) areas, each with two <strong>Data collection</strong> terminals. A note says some diagrams also show routers and firewalls.</p>
  <p><strong>What the instructor wants you to notice:</strong> this is the kind of document a white-box tester is <em>given</em>. It tells them where the servers physically are, how many hosts exist, and which areas (production floor terminals) might be less supervised. A black-box tester would have to reconstruct this through footprinting and scanning.</p>

  <div class="box exam"><span class="lbl">The slide's two questions</span>
    <details><summary>What is the disadvantage of letting the company's employees know about the penetration test?</summary><div><p>They change their behavior. Employees on alert will not click phishing links, will lock their screens, and will challenge strangers, so the test no longer reflects how the organization really behaves. Social engineering results become meaningless.</p></div></details>
    <details><summary>What is the disadvantage of letting the IT staff know?</summary><div><p>They may temporarily tighten defenses (patch, watch logs closely) just for the test, and you can no longer measure whether they would detect a real attack. The black-box model exists precisely to test detection and response.</p></div></details>
  </div>

  <h5>Required skills of an ethical hacker</h5>
  <ul>
    <li><strong>Microsoft:</strong> operating, configuring, and managing Windows systems.</li>
    <li><strong>Linux:</strong> Linux/Unix security settings, configuration, and services.</li>
    <li><strong>Firewalls:</strong> configuration and operation of firewalls and intrusion detection systems (IDS).</li>
    <li><strong>Routers:</strong> routing protocols and access control lists.</li>
    <li><strong>Mainframes:</strong> still common in banking and government.</li>
    <li><strong>Network protocols:</strong> how TCP/IP works and how it can be manipulated.</li>
    <li><strong>Project management:</strong> leading, planning, organizing, and controlling a testing team.</li>
  </ul>
  <p>The "nutshell" slide adds soft skills: knowledge of network and computer technology, the ability to communicate with management and IT staff, understanding of the law, and the ability to use the necessary tools.</p>

  <h5>Advantages and disadvantages</h5>
  <p><strong>Advantages:</strong> "to catch a thief you have to think like a thief"; helps close holes; protects banks and financial institutions; prevents website defacement; an evolving technique. <strong>Disadvantages:</strong> everything depends on the tester's trustworthiness (you are handing a stranger the keys), and professionals are expensive.</p>

  <h3 id="l00b-tools">Hacking tools and common commands</h3>
  <h4>Explanation</h4>
  <p>The textbook calls a hacker's toolkit a <strong>tiger box</strong>: a collection of operating systems and tools for hacking, such as network scanners, traffic monitors, keyloggers, and password crackers. Programming helps too: Perl (Practical Extraction and Report Language) for text processing and quick scripts, C for low-level exploits, and scripts in general (sets of instructions run in sequence).</p>
  <div class="tw"><table>
    <thead><tr><th>Tool</th><th>Purpose</th></tr></thead>
    <tbody>
      <tr><td>Kali Linux</td><td>Security-focused Linux distribution; the "attacker's system." Your lab's <code>kali</code> container runs it.</td></tr>

<!-- ===================== L01a ===================== -->
<section class="lecture prose" id="l01a">
  <div class="plate"><span class="num" aria-hidden="true">L01a</span><p class="ttl">The CIA triad and an introduction to cryptography</p><p class="src">Source: L01a-Ch01-CIA-Crypto1.pdf (Goodrich &amp; Tamassia Ch. 1, Stallings &amp; Brown Ch. 1, Trappe Ch. 1)</p></div>
  <p>The deck's outline has four parts: fundamental concepts (the framework for everything else), access control models (who has access?), cryptographic concepts (protecting data), and implementation and usability (passwords, social engineering).</p>

  <h3 id="l01a-cia">The CIA triad</h3>
  <h4>Big picture</h4>
  <p>Every security question in this course can be phrased as "which of these three properties is at risk?" Confidentiality, Integrity, and Availability are the three goals security is trying to guarantee. NIST's official definition of computer security is built on them: <em>measures and controls that ensure confidentiality, integrity, and availability of information processed and stored by a computer, including hardware, software, firmware, information data, and telecommunications</em> (NISTIR 7298, 2019).</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: confidentiality</span>
    <dl>
      <dt>Plain English</dt><dd>Only the right people can read it.</dd>
      <dt>Technical</dt><dd>The avoidance of unauthorized disclosure of information: giving access to those allowed to see data while preventing others from learning anything about its content.</dd>
      <dt>Why it matters</dt><dd>Protects financial records, medical data, and military plans. Controls are based on the user's role, security classification, and clearance, on a need-to-know basis.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: integrity</span>
    <dl>
      <dt>Plain English</dt><dd>Nobody changed it without permission.</dd>
      <dt>Technical</dt><dd>The property that information has not been altered in an unauthorized way; information can be modified only by authorized users.</dd>
      <dt>Why it matters</dt><dd>A bank balance that is secret but wrong is useless. Controls prohibit unauthorized changes.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: availability</span>
    <dl>
      <dt>Plain English</dt><dd>You can get to it when you need it.</dd>
      <dt>Technical</dt><dd>The property that information is accessible and modifiable in a timely fashion by those authorized to do so.</dd>
      <dt>Why it matters</dt><dd>Attacks like denial of service (DoS) and hacktivist takedowns break availability without reading or changing any data.</dd>
    </dl>
  </div>

  <h4>Explanation: the tools for each property</h4>
  <h5>Confidentiality tools</h5>
  <p><strong>Encryption</strong> transforms information using a secret (the encryption key) so that it can only be read using another secret (the decryption key), which may or may not be the same key. The slide's diagram shows a sender encrypting plaintext with a shared secret key, sending ciphertext over a communication channel where an attacker is eavesdropping, and the recipient decrypting with the same shared key. The attacker sees only ciphertext.</p>
  <p><strong>Access control</strong> is the set of rules and policies limiting access to those with a "need to know." Need to know can be determined by <em>identity</em> (a person's name, a computer's serial number) or by <em>role</em> (manager, security specialist).</p>
  <p><strong>Authentication</strong> determines the identity or role someone has. It is based on some combination of three factors:</p>
  <div class="tw"><table>
    <thead><tr><th>Factor</th><th>Slide examples</th><th>Other examples</th><th>Weakness</th></tr></thead>
    <tbody>
      <tr><td>Something you know</td><td>password=ucIb()w1V, mother=Jones, pet=Caesar</td><td>PIN, security questions</td><td>Can be guessed, phished, or shared</td></tr>
      <tr><td>Something you have</td><td>Radio token with secret keys, smart card, key fob</td><td>Phone authenticator app, YubiKey</td><td>Can be lost or stolen</td></tr>
      <tr><td>Something you are</td><td>A human with fingers and eyes</td><td>Fingerprint, face, iris</td><td>Cannot be changed if compromised</td></tr>
    </tbody>
  </table></div>
  <p>Notice the slide's "mother=Jones, pet=Caesar": security questions are "something you know," and they are weak because the answers are often public.</p>
  <p><strong>Authorization</strong> determines whether a person or system is allowed to access a resource, based on an access control policy. It should prevent an attacker from tricking the system into granting access.</p>
  <div class="box warn"><span class="lbl">Misconception: authentication vs. authorization</span>
    <p>Authentication answers "<em>who are you?</em>" Authorization answers "<em>what are you allowed to do?</em>" Logging into iCollege is authentication; being able to see only your own grades is authorization. Authentication always comes first. Memory trick: auth<strong>N</strong> = ide<strong>N</strong>tity, auth<strong>Z</strong> = permi<strong>Z</strong>ion (sounds like it).</p>
  </div>
  <p><strong>Physical security</strong> uses physical barriers: locked cabinets and doors, windowless rooms, sound-dampening materials, and even <strong>Faraday cages</strong> (rooms whose walls contain copper mesh so electromagnetic signals cannot enter or leave, blocking wireless eavesdropping). The OS file system (Unix, Windows) is also an access control tool; that is the subject of L04a.</p>

  <h5>Integrity tools</h5>
  <ul>
    <li><strong>Backups:</strong> periodic archiving of data so it can be restored after unauthorized change.</li>
    <li><strong>Checksums:</strong> a function mapping a file's contents to a number. It depends on the entire file, so even flipping one bit very likely changes the output. Compare the stored checksum to a freshly computed one to detect changes.</li>
    <li><strong>Data correcting codes:</strong> store data so small changes can be detected <em>and automatically corrected</em> (for example the error-correcting codes in RAM and QR codes).</li>
  </ul>

  <h5>Availability tools</h5>
  <ul>
    <li><strong>Physical protections:</strong> infrastructure that keeps information available despite physical challenges (backup power, climate control, hardened buildings).</li>
    <li><strong>Computational redundancies:</strong> extra computers and storage that act as fallbacks when something fails (RAID, failover servers).</li>
  </ul>

  <h4>Examples</h4>
  <div class="box ex"><span class="lbl">Worked examples: which property is violated? <span class="lvl">easy → hard</span></span>
    <p><strong>1.</strong> A hospital's patient records are posted online. <em>Confidentiality.</em></p>
    <p><strong>2.</strong> A student changes their grade in the registrar's database. <em>Integrity.</em></p>
    <p><strong>3.</strong> A flood of traffic takes the GSU portal offline during registration. <em>Availability.</em></p>
    <p><strong>4.</strong> Ransomware encrypts a company's files. <em>Availability</em> primarily (the owners cannot reach their data). If the attackers also copy the files first ("double extortion"), confidentiality is violated too.</p>
    <p><strong>5.</strong> An attacker intercepts an encrypted bank transfer and flips bits in the amount field without being able to read it. <em>Integrity</em>, even though confidentiality held. This is why encryption alone is not enough and why MACs exist (later in this lecture and L03a).</p>
  </div>

  <h3 id="l01a-aaa">Assurance, authenticity, and anonymity (A.A.A.)</h3>
  <h4>Big picture</h4>
  <p>CIA covers the data. The "other security concepts" cover trust: can we trust the system's rules, can we trust who said something, and can people act without being tracked?</p>
  <h4>Definitions and explanation</h4>
  <div class="box def"><span class="lbl">Definition: assurance</span>
    <dl>
      <dt>Plain English</dt><dd>How we know we can trust the system.</dd>
      <dt>Technical</dt><dd>How trust is provided and managed in computer systems. Trust management depends on <strong>policies</strong> (behavioral expectations), <strong>permissions</strong> (behaviors allowed for agents interacting with the system), and <strong>protections</strong> (mechanisms that enforce the permissions and policies).</dd>
      <dt>Why it matters</dt><dd>Stallings adds a second meaning: an attribute giving grounds for confidence that the system actually enforces its security policy.</dd>
    </dl>
  </div>
  <p>The slide's running example is an online music store. <em>Policy:</em> designers specify how users can access and copy songs. <em>Permission:</em> people who bought a song get limited access and copying rights. <em>Protection:</em> the store builds mechanisms (like DRM) that stop unauthorized copying. Memory trick: <strong>P-P-P</strong>, rules → rights → enforcement.</p>

  <div class="box def"><span class="lbl">Definition: authenticity and nonrepudiation</span>
    <dl>
      <dt>Plain English</dt><dd>Authenticity: proof that a message really came from who it says. Nonrepudiation: the sender cannot later deny sending it.</dd>
      <dt>Technical</dt><dd>Authenticity is the ability to determine that statements, policies, and permissions issued by persons or systems are genuine. The primary tool is the <strong>digital signature</strong>, a cryptographic computation that lets a person commit to their documents uniquely, achieving <strong>nonrepudiation</strong>: authentic statements cannot be denied by their issuer.</dd>
      <dt>Why it matters</dt><dd>Contracts, software updates, and certificates rely on it.</dd>
    </dl>
  </div>

  <div class="box def"><span class="lbl">Definition: anonymity</span>
    <dl>
      <dt>Plain English</dt><dd>Records cannot be traced back to you.</dd>
      <dt>Technical</dt><dd>The property that certain records or transactions are not attributable to any individual.</dd>
      <dt>Why it matters</dt><dd>Privacy for voters, whistleblowers, and survey participants.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th>Anonymity tool</th><th>How it works</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td>Aggregation</td><td>Combine many people's data so sums/averages cannot identify anyone</td><td>Census reports average income by county</td></tr>
      <tr><td>Mixing</td><td>Intertwine transactions or messages so none can be traced to one person</td><td>Mix networks; cryptocurrency mixers</td></tr>
      <tr><td>Proxies</td><td>Trusted agents act on your behalf so the action cannot be traced to you</td><td>A VPN or Tor relay making requests for you</td></tr>
      <tr><td>Pseudonyms</td><td>Fictional identities known only to a trusted entity</td><td>A username only the site admin can link to your real name</td></tr>
    </tbody>
  </table></div>

  <h3 id="l01a-terms">Threats, vulnerabilities, attacks, and countermeasures</h3>
  <h4>Big picture</h4>
  <p>Security professionals use precise vocabulary so they can reason about risk. These terms (Stallings Table 1.1) are standard exam definitions, and the relationship diagram ties them together.</p>

  <h4>Definitions</h4>
  <div class="tw"><table>
    <thead><tr><th>Term</th><th>Plain English</th><th>Technical (Table 1.1)</th></tr></thead>
    <tbody>
      <tr><td>Adversary (threat agent)</td><td>The bad actor</td><td>An individual, group, organization, or government that conducts or intends to conduct detrimental activities</td></tr>
      <tr><td>Attack</td><td>The bad act</td><td>Any malicious activity that attempts to collect, disrupt, deny, degrade, or destroy information system resources or the information itself</td></tr>
      <tr><td>Countermeasure</td><td>The defense</td><td>A device or technique that impairs adversarial activity or prevents espionage, sabotage, theft, or unauthorized access/use</td></tr>
      <tr><td>Risk</td><td>How worried you should be</td><td>The extent to which an entity is threatened; a function of (1) the adverse impact if the event occurs and (2) its likelihood</td></tr>
      <tr><td>Security policy</td><td>The rules</td><td>Criteria for providing security services; defines and constrains activities to keep systems and data secure</td></tr>
      <tr><td>System resource (asset)</td><td>What you protect</td><td>Applications, support systems, programs, physical plant, mission-critical systems, personnel, equipment, or related groups of systems</td></tr>
      <tr><td>Threat</td><td>What could go wrong</td><td>Any circumstance or event that could adversely impact operations, assets, individuals, other organizations, or the Nation via unauthorized access, destruction, disclosure, modification, or denial of service</td></tr>
      <tr><td>Vulnerability</td><td>The weak spot</td><td>A weakness in a system, procedures, internal controls, or implementation that could be exploited by a threat source</td></tr>
    </tbody>
  </table></div>

  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: risk (conceptual)</span>
    <div class="eq">Risk = f(Impact, Likelihood) ≈ Impact × Likelihood</div>
    <p><strong>Variables:</strong> Impact is how bad the harm would be (dollars, lives, reputation). Likelihood is how probable the event is. The slide only says "a function of" both; multiplication is the common way to score it.</p>
    <p><strong>Worked example.</strong> On a 1–5 scale: a lost unencrypted laptop with customer data has impact 5 and likelihood 3 → risk 15. A defaced marketing page has impact 2 and likelihood 4 → risk 8. Prioritize the laptop (encrypt disks).</p>
    <p><strong>Common mistake:</strong> treating a high-likelihood, trivial event as the top priority. Both factors matter.</p>
  </div>

  <h4>Diagram explained: security concepts and relationships</h4>
  <figure class="fig">
<pre class="mermaid">
flowchart LR
  O[Owners] -- value --> A[Assets]
  O -- impose --> C[Countermeasures]
  O -- wish to minimize --> R[Risk]
  C -- to reduce --> R
  TA[Threat agents] -- wish to abuse and/or may damage --> A
  TA -- give rise to --> T[Threats]
  T -- that increase --> R
  R -- to --> A
</pre>
    <figcaption>Redrawn from Stallings: owners and threat agents both care about assets, from opposite sides.</figcaption>
  </figure>
  <p>Read the figure as two stories that meet at the <strong>assets</strong> in the center.</p>
  <ul>
    <li><strong>The owner's story (left):</strong> owners <em>value</em> assets and <em>wish to minimize</em> risk, so they <em>impose</em> countermeasures, which exist <em>to reduce</em> risk.</li>
    <li><strong>The attacker's story (right):</strong> threat agents <em>wish to abuse and/or may damage</em> assets. They <em>give rise to</em> threats, and threats <em>increase</em> risk.</li>
    <li><strong>Where they meet:</strong> risk points <em>to</em> assets. Risk is the quantity both sides push on.</li>
  </ul>
  <p><strong>What to notice:</strong> owners never reduce threats directly; they can only impose countermeasures to reduce risk. An exam may give you a scenario and ask you to label the owner, asset, threat agent, threat, countermeasure, and risk.</p>

  <h4>Explanation: assets, vulnerabilities, threats, attacks</h4>
  <p>The <strong>assets</strong> of a computer system fall into four categories: hardware, software, data, and communication facilities and networks.</p>
  <p><strong>Vulnerabilities</strong> map onto CIA. A resource can be <em>corrupted</em> (loss of integrity), <em>leaky</em> (loss of confidentiality), or <em>unavailable or very slow</em> (loss of availability).</p>
  <p><strong>Threats</strong> are capable of exploiting vulnerabilities and represent potential harm. <strong>Attacks</strong> are threats carried out, classified two ways:</p>
  <div class="tw"><table>
    <thead><tr><th>By effect</th><th>By origin</th></tr></thead>
    <tbody>
      <tr><td><strong>Active:</strong> tries to alter system resources or affect their operation</td><td><strong>Insider:</strong> initiated by an entity inside the security perimeter (an authorized user misusing access)</td></tr>
      <tr><td><strong>Passive:</strong> tries to learn or use information without affecting resources</td><td><strong>Outsider:</strong> initiated from outside the perimeter</td></tr>
    </tbody>
  </table></div>

  <h5>Passive vs. active attacks in detail</h5>
  <div class="tw"><table>
    <thead><tr><th></th><th>Passive</th><th>Active</th></tr></thead>
    <tbody>
      <tr><td>Goal</td><td>Obtain transmitted information (eavesdropping, monitoring)</td><td>Modify the data stream or create a false stream</td></tr>
      <tr><td>Types</td><td><strong>Release of message contents</strong> (reading the message); <strong>traffic analysis</strong> (learning from patterns, such as who talks to whom, when, and how much, even when messages are encrypted)</td><td><strong>Replay</strong> (capture and retransmit a valid message); <strong>masquerade</strong> (pretend to be someone else); <strong>modification of messages</strong> (alter, delay, or reorder); <strong>denial of service</strong> (prevent normal use)</td></tr>
      <tr><td>Defense strategy</td><td>Prevent (encryption); hard to detect because nothing changes</td><td>Detect and recover; hard to prevent completely</td></tr>
    </tbody>
  </table></div>
  <div class="box ex"><span class="lbl">Worked examples: classify the attack</span>
    <p><strong>1.</strong> Sniffing Wi-Fi to read unencrypted emails → passive, release of message contents.</p>
    <p><strong>2.</strong> Noticing a CEO's encrypted messages to a rival company spike before a merger → passive, traffic analysis.</p>
    <p><strong>3.</strong> Recording an encrypted "unlock" signal from a car key fob and playing it back later → active, replay. Encryption did not help because the attacker never needed to read it.</p>
    <p><strong>4.</strong> Sending email with a forged "From: dean@gsu.edu" → active, masquerade.</p>
  </div>

  <h5>Countermeasures</h5>
  <p>Countermeasures <strong>prevent, detect, or recover</strong> from attacks. Two cautions from the slide: a countermeasure may itself introduce new vulnerabilities (a buggy antivirus runs with high privilege), and <strong>residual vulnerabilities</strong> may remain. The goal is not zero risk; it is to minimize the <em>residual level of risk</em> to the assets.</p>

  <h5>Table 1.3: assets × CIA, with example threats</h5>
  <div class="tw"><table>
    <thead><tr><th>Asset</th><th>Availability</th><th>Confidentiality</th><th>Integrity</th></tr></thead>
    <tbody>
      <tr><td>Hardware</td><td>Equipment stolen or disabled, denying service</td><td>An unencrypted USB drive is stolen</td><td>A door sensor is replaced with one that always reports "closed" at certain times</td></tr>
      <tr><td>Software</td><td>Programs deleted, denying access</td><td>An unauthorized copy of software is made</td><td>A working program is modified to fail or do something unintended</td></tr>
      <tr><td>Data</td><td>Files deleted, denying access</td><td>Unauthorized read of data; statistical analysis reveals underlying data</td><td>Existing files modified or new files fabricated</td></tr>
      <tr><td>Communication lines and networks</td><td>Messages destroyed or deleted; lines rendered unavailable</td><td>Messages read; traffic pattern observed</td><td>Messages modified, delayed, reordered, or duplicated; false messages fabricated</td></tr>
    </tbody>
  </table></div>
  <p>Notice the hardware-integrity example: the attacker does not destroy the sensor, they replace it with one that <em>lies</em>. Also note "statistical analysis reveals underlying data," which is the failure mode aggregation (an anonymity tool) is supposed to prevent.</p>

  <h5>Table 1.4: FIPS 200 security requirements</h5>
  <p>FIPS 200 is a U.S. federal standard listing the minimum security areas an organization must address. You do not need every word, but you should recognize each area and be able to say what it covers.</p>
  <div class="tw"><table>
    <thead><tr><th>Area</th><th>In one line</th></tr></thead>
    <tbody>
      <tr><td>Access control</td><td>Limit system access to authorized users, their processes, and devices, and to permitted transactions</td></tr>
      <tr><td>Awareness and training</td><td>Make staff aware of risks, laws, and policies; train them for security duties</td></tr>
      <tr><td>Audit and accountability</td><td>Create and keep audit logs; trace actions to individual users</td></tr>
      <tr><td>Certification, accreditation, and security assessments</td><td>Periodically assess controls, fix deficiencies, authorize operation, monitor continuously</td></tr>
      <tr><td>Configuration management</td><td>Maintain baseline configurations and inventories; enforce secure settings</td></tr>
      <tr><td>Contingency planning</td><td>Emergency response, backups, and post-disaster recovery to keep critical resources available</td></tr>
      <tr><td>Identification and authentication</td><td>Identify and verify users, processes, and devices before granting access</td></tr>
      <tr><td>Incident response</td><td>Prepare, detect, analyze, contain, recover; track and report incidents</td></tr>
      <tr><td>Maintenance</td><td>Timely maintenance with controlled tools and personnel</td></tr>
      <tr><td>Media protection</td><td>Protect paper and digital media; limit access; sanitize or destroy before disposal</td></tr>

      <tr><td>System and information integrity</td><td>Fix flaws promptly; protect against malicious code; act on security alerts</td></tr>
    </tbody>
  </table></div>

    <details><summary>An employee is fired and their account still works a month later. Which FIPS 200 area failed?</summary><div><p>Personnel security (protecting systems during terminations and transfers). Access control is also involved.</p></div></details>
    <details><summary>Old hard drives are sold on eBay with customer data still on them. Which area?</summary><div><p>Media protection (sanitize or destroy media before disposal).</p></div></details>

  <h5>Why computer security is hard: the ten challenges</h5>
  <ol>
    <li>It is not as simple as it looks to a novice; requirements sound simple but mechanisms are complex.</li>
    <li>Every mechanism must be designed while thinking about how it could be attacked.</li>
    <li>The procedures used to provide security are often counterintuitive (why add random padding?).</li>
    <li>You must decide where mechanisms go, both physically (which network point) and logically (which protocol layer).</li>
    <li>Mechanisms usually need secret information (keys), which raises questions about how secrets are created, distributed, and protected.</li>
    <li>Attackers need to find only one weakness; designers must eliminate all of them.</li>
    <li>Users and managers see little benefit from security until something fails.</li>
    <li>Security requires regular, constant monitoring.</li>
    <li>Security is often an afterthought added after design rather than built in.</li>
    <li>Many people see strong security as an obstacle to efficient, user-friendly operation.</li>
  </ol>
  <p>Memory hook for #6, the most-quoted one: <em>"The defender has to be right every time; the attacker only has to be right once."</em></p>

  <h3 id="l01a-surface">Attack surfaces, defense in depth, and security strategy</h3>
  <h4>Big picture</h4>
  <p>An attack surface is how much of your system an attacker can touch. Shrinking it and layering defenses are the two main architectural strategies.</p>
  <div class="box def"><span class="lbl">Definition: attack surface</span>
    <dl>
      <dt>Plain English</dt><dd>All the places an attacker could try to get in.</dd>
      <dt>Technical</dt><dd>The reachable and exploitable vulnerabilities in a system.</dd>
      <dt>Why it matters</dt><dd>Every open port, input form, and trusted employee adds to it. Reducing it (disable unused services) is one of the cheapest defenses.</dd>
    </dl>
  </div>
  <p>Slide examples: open ports on outward-facing web servers and the code listening on them; services inside a firewall; code that processes incoming data, email, XML, and office documents; interfaces, SQL, and web forms; and an employee with sensitive access who could be socially engineered.</p>
  <div class="tw"><table>
    <thead><tr><th>Category</th><th>Vulnerabilities in</th><th>Examples</th></tr></thead>
    <tbody>
      <tr><td>Network attack surface</td><td>Enterprise networks, WANs, the Internet</td><td>Protocol flaws used for DoS, disrupting links, intruder attacks</td></tr>
      <tr><td>Software attack surface</td><td>Application, utility, or OS code</td><td>Especially web server software</td></tr>
      <tr><td>Human attack surface</td><td>Personnel or outsiders</td><td>Social engineering, human error, trusted insiders</td></tr>
    </tbody>
  </table></div>

  <h4>Diagram explained: Figure 1.4, defense in depth and attack surface</h4>
  <figure class="fig">
    <div class="quad" role="img" aria-label="Two by two grid: shallow layering with small surface is medium risk, shallow with large is high risk, deep with small is low risk, deep with large is medium risk">
      <div class="ax"></div><div class="ax">Small surface</div><div class="ax">Large surface</div>
      <div class="ax">Shallow layering</div><div class="q-md">Medium risk</div><div class="q-hi">High risk</div>
