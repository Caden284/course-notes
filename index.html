  <p>The x-axis is attack surface size (small → large). The y-axis is layering, meaning how many defensive layers protect the system (deep → shallow). <strong>Defense in depth</strong> means stacking multiple independent protections so one failure is not fatal. The quadrants: deep layering with a small surface is <em>low</em> risk; shallow layering with a large surface is <em>high</em> risk; the two mixed combinations are <em>medium</em>. The takeaway: you can compensate for one weakness with the other, but the best position combines both. L04a applies defense in depth to Chrome.</p>

  <h4>Diagram explained: Figure 1.5, attack tree for Internet banking</h4>
  <p>An <strong>attack tree</strong> puts the attacker's goal at the root ("bank account compromise") and breaks it into sub-goals, with leaves being concrete attacks. In the figure, the root branches into five paths: <strong>user credential compromise</strong> (theft of tokens and handwritten notes, malicious software installation, vulnerability exploits, brute-force attacks with PIN calculators, social engineering, web page obfuscation, user surveillance), <strong>injection of commands</strong>, <strong>user credential guessing</strong> (brute force), <strong>security policy violation</strong>, and <strong>use of known authenticated sessions</strong> (normal authentication with a pre-defined session ID, session hijacking). Leaves are coded by where the attack happens: UT/U for the user terminal and user, CC for the communications channel, IBS for the Internet banking server. <strong>Why it's useful:</strong> it lets defenders enumerate every path to the goal and see which countermeasure blocks which branches.</p>

  <h5>Computer security strategy</h5>
  <ul>
    <li><strong>Security policy:</strong> a formal statement of rules and practices specifying how a system or organization provides security services.</li>
    <li><strong>Security implementation</strong>, four complementary actions: <strong>prevention</strong> (stop attacks), <strong>detection</strong> (notice them), <strong>response</strong> (stop an attack in progress), <strong>recovery</strong> (restore afterward). Memory trick: <em>PDRR</em>, "Prevent, Detect, Respond, Recover."</li>
    <li><strong>Assurance:</strong> covering both design and implementation, the grounds for confidence that the system enforces its policy.</li>
    <li><strong>Evaluation:</strong> examining a product or system against criteria, through testing and possibly formal mathematical analysis.</li>
  </ul>

  <h5>Standards organizations</h5>
  <div class="tw"><table>
    <thead><tr><th>Organization</th><th>What it is</th></tr></thead>
    <tbody>
      <tr><td>NIST (National Institute of Standards and Technology)</td><td>U.S. federal agency for measurement science and standards; publishes FIPS (e.g., AES, FIPS 200) and SP 800 documents</td></tr>
      <tr><td>ISOC (Internet Society)</td><td>Professional membership society; organizational home of the groups (like the IETF) that set Internet infrastructure standards</td></tr>
      <tr><td>ITU-T (International Telecommunication Union)</td><td>United Nations agency where governments and industry coordinate global telecom (e.g., X.509 certificates)</td></tr>
      <tr><td>ISO (International Organization for Standardization)</td><td>Nongovernmental body publishing International Standards (e.g., ISO 27001)</td></tr>
    </tbody>
  </table></div>

  <h3 id="l01a-crypto">Cryptographic concepts</h3>
  <h4>Big picture</h4>
  <p>Cryptography is the main technical tool for confidentiality, integrity, and authenticity. This section sets up the cast of characters, the notation, and the attack models used for the rest of the course.</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: encryption</span>
    <dl>
      <dt>Plain English</dt><dd>Scrambling a message so only the intended reader can unscramble it.</dd>
      <dt>Technical</dt><dd>A means for two parties (Alice and Bob) to establish confidential communication over an insecure channel subject to eavesdropping (by Eve). Alice converts plaintext M to ciphertext C using an encryption algorithm E; Bob recovers M using a decryption algorithm D.</dd>
      <dt>Why it matters</dt><dd>It lets you send secrets over the public Internet.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: plaintext, ciphertext, key</span>
    <dl>
      <dt>Plain English</dt><dd>Plaintext is the readable message, ciphertext is the scrambled version, and the key is the secret setting that controls the scrambling.</dd>
      <dt>Technical</dt><dd>M (plaintext) is input to E; C = E(M) is the ciphertext. The algorithms are assumed public; what keeps the message secret is the key.</dd>
      <dt>Why it matters</dt><dd>The rule that security depends only on the key, not on hiding the algorithm, is called <strong>Kerckhoffs's principle</strong>. Secret algorithms tend to be broken once reverse-engineered.</dd>
    </dl>
  </div>

  <h4>Explanation</h4>
  <p>The cast: <strong>Alice</strong> sends, <strong>Bob</strong> receives, <strong>Eve</strong> eavesdrops. Alice encrypts using a method prearranged with Bob. Bob receives the ciphertext and decrypts with the decryption key.</p>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: encryption and decryption</span>
    <div class="eq">C = E(M)&nbsp;&nbsp;&nbsp;&nbsp;M = D(C)&nbsp;&nbsp;&nbsp;&nbsp;so D(E(M)) = M</div>
    <p><strong>Variables:</strong> M = plaintext, C = ciphertext, E = encryption algorithm (with its key), D = decryption algorithm (with its key).</p>
    <p><strong>Why it works:</strong> E and D are chosen as inverses, so decryption undoes encryption. They are also chosen so that recovering M from C is infeasible for anyone without the key, which is what lets C travel over an insecure channel.</p>
    <p><strong>Example:</strong> with a Caesar cipher, E(HELLO) = KHOOR and D(KHOOR) = HELLO.</p>
    <p><strong>Common mistake:</strong> thinking D must use a different key from E. In symmetric systems the keys are usually the same.</p>
  </div>

  <h5>Eve's goals (from Trappe)</h5>
  <ol>
    <li>Read the message.</li>
    <li>Find the key, and thus read <em>all</em> messages encrypted with it.</li>
    <li>Corrupt Alice's message so Bob thinks Alice sent the altered version.</li>
    <li>Masquerade as Alice and talk to Bob.</li>
  </ol>
  <p>Goals 1–2 are <strong>passive</strong> (the attacker is sometimes named <strong>Oscar</strong>); goals 3–4 are <strong>active</strong> (named <strong>Mallory</strong>, for "malicious"). The course generally uses Eve for both and assumes she is as bad as the situation allows. Goal 2 is the worst outcome because it compromises past and future messages.</p>

  <h5>The four attack models</h5>
  <p>These differ by how much information Eve has when trying to find the key. They are listed from weakest attacker to strongest.</p>
  <div class="tw"><table>
    <thead><tr><th>Attack</th><th>Eve has</th><th>Realistic example</th></tr></thead>
    <tbody>
      <tr><td>Ciphertext only</td><td>Only ciphertext</td><td>Intercepted encrypted radio traffic</td></tr>
      <tr><td>Known plaintext</td><td>Ciphertext plus the matching plaintext</td><td>WWII codebreakers knew messages began with a weather report</td></tr>
      <tr><td>Chosen plaintext</td><td>Temporary access to the encryption machine; can encrypt plaintexts of her choosing (but cannot open the machine to read the key)</td><td>Getting a server to encrypt data you submitted</td></tr>
      <tr><td>Chosen ciphertext</td><td>Temporary access to the decryption machine; can decrypt strings of her choosing</td><td>A server that reveals whether a submitted ciphertext decrypts correctly</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Misconception</span>
    <p>In a chosen-plaintext attack, Eve does <em>not</em> learn the key by reading it from the machine. She only observes input/output pairs and deduces the key. A good modern cipher should resist all four models.</p>
  </div>

  <h5>What makes up a cryptosystem</h5>
  <p>A complete cryptosystem specifies seven things: (1) the set of possible plaintexts, (2) the set of possible ciphertexts, (3) the set of encryption keys, (4) the set of decryption keys, (5) the correspondence between encryption and decryption keys, (6) the encryption algorithm, and (7) the decryption algorithm. Memory trick: <em>two message sets, two key sets, one link, two algorithms</em> (2 + 2 + 1 + 2 = 7).</p>

  <h3 id="l01a-caesar">The Caesar cipher</h3>
  <h4>Big picture</h4>
  <p>The simplest historical cipher. It is on the "worth notice" list: know how to apply it <em>and</em> how to break it.</p>
  <div class="box def"><span class="lbl">Definition: Caesar cipher (shift cipher)</span>
    <dl>
      <dt>Plain English</dt><dd>Replace each letter with the one a fixed number of places later in the alphabet. Julius Caesar used 3.</dd>
      <dt>Technical</dt><dd>A monoalphabetic substitution cipher with key k ∈ {0,…,25}. Number letters A=0 … Z=25.</dd>
      <dt>Why it matters</dt><dd>It illustrates keys, key space, brute force, and frequency analysis in the smallest possible example.</dd>
    </dl>
  </div>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: Caesar cipher</span>
    <div class="eq">C = (P + k) mod 26&nbsp;&nbsp;&nbsp;&nbsp;P = (C − k) mod 26</div>
    <p><strong>Variables:</strong> P = plaintext letter number, C = ciphertext letter number, k = shift (the key), mod 26 wraps past Z back to A.</p>
    <p><strong>Why it works:</strong> adding k shifts; subtracting k shifts back. "mod 26" keeps the result a valid letter.</p>
    <p><strong>Example (k = 3):</strong> X = 23 → (23+3) mod 26 = 0 = A. So "XYZ" → "ABC".</p>
    <p><strong>Common mistake:</strong> forgetting to wrap (writing "[" after Z), or subtracting on encryption. For negative results, add 26: (1 − 3) mod 26 = −2 + 26 = 24 = Y.</p>
  </div>

  <div class="box proc"><span class="lbl">Process: breaking a Caesar cipher</span>
    <p><strong>Why it's breakable:</strong> there are only 26 keys (really 25 useful ones), and the cipher keeps English letter frequencies intact, just shifted.</p>
    <ol>
      <li><strong>Brute force:</strong> try all 26 shifts and look for readable text.</li>
      <li><strong>Frequency analysis (faster by hand):</strong> count ciphertext letters. The most common probably stands for <strong>e</strong> (12.702% in English), then t, a (8.167%), o (7.507%), i (6.966%).</li>
      <li><strong>Short-word shortcut:</strong> a repeated 3-letter word is likely "the"; a 1-letter word is "a" or "i".</li>
      <li>Compute the shift from one guess (cipher − plain mod 26) and apply it to everything. If the result is gibberish, try the next guess.</li>
    </ol>
    <p><strong>Common exam questions:</strong> encrypt/decrypt a word with a given k; find k from a ciphertext; explain why the key space is too small.</p>
  </div>

  <div class="box ex"><span class="lbl">Worked example: the slide's practice ciphertext <span class="lvl">hard</span></span>
    <p><code>Sdaj ukq dwra bejeodaz zaynulpekj kb pdeo patp, lhawoa mqeaphu ck pk pda ejopnqypkn wjz hawra.</code></p>
    <p><strong>Step 1.</strong> The three-letter word <code>pda</code> appears; guess it is "the."</p>
    <p><strong>Step 2.</strong> p → t: p = 15, t = 19. The encryption shift was 15 − 19 = −4, i.e., k = 22 (equivalently, shift back 4). To decrypt, add 4.</p>
    <p><strong>Step 3.</strong> Check: <code>d</code>+4 = h, <code>a</code>+4 = e. "the" confirmed.</p>
    <details><summary>Show the full decryption</summary><div><p><em>When you have finished decryption of this text, please quietly go to the instructor and leave.</em> (This was an in-class exercise; the payoff was the instruction itself.)</p></div></details>
  </div>

  <h3 id="l01a-symasym">Symmetric vs. public-key cryptography</h3>
  <h4>Big picture</h4>
  <p>This comparison is explicitly on the "worth notice" list. Symmetric crypto is fast but has a key distribution problem. Public-key crypto solves distribution but is slow. Real systems use both.</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: symmetric (secret-key) cryptosystem</span>
    <dl>
      <dt>Plain English</dt><dd>Both sides use the same secret key.</dd>
      <dt>Technical</dt><dd>Encryption and decryption keys are known to both Alice and Bob and are often identical. All classical (pre-1970) ciphers are symmetric, as are DES and AES.</dd>
      <dt>Why it matters</dt><dd>Fast enough for bulk data; but the key must somehow be shared securely first.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: public-key (asymmetric) cryptosystem</span>
    <dl>
      <dt>Plain English</dt><dd>Each person has a lock anyone can use (public key) and the only key that opens it (private key).</dd>
      <dt>Technical</dt><dd>Bob has a private key S<sub>B</sub> he keeps secret and a public key P<sub>B</sub> he broadcasts. Alice sends C = E<sub>P<sub>B</sub></sub>(M); Bob recovers M = D<sub>S<sub>B</sub></sub>(C). It must be computationally infeasible to find S<sub>B</sub> from P<sub>B</sub>.</dd>
      <dt>Why it matters</dt><dd>Introduced in the 1970s, it lets strangers communicate securely without meeting first, and it enables digital signatures.</dd>
    </dl>
  </div>

  <h4>Explanation</h4>
  <h5>Two kinds of symmetric cipher</h5>
  <p><strong>Stream ciphers</strong> feed data in small pieces (bits or characters) and output corresponding small pieces. <strong>Block ciphers</strong> collect a block of bits and process it all at once, outputting a block. The course focuses on block ciphers: DES and Rijndael, which NIST selected in 2000 (standardized 2001) as AES, the replacement for DES. L03a goes deep on both.</p>

  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: binary stream cipher</span>
    <div class="eq">y<sub>i</sub> = x<sub>i</sub> ⊕ s<sub>i</sub>&nbsp;&nbsp;&nbsp;&nbsp;x<sub>i</sub> = y<sub>i</sub> ⊕ s<sub>i</sub></div>
    <p><strong>Variables:</strong> x<sub>i</sub> = plaintext bit, y<sub>i</sub> = ciphertext bit, s<sub>i</sub> = key stream bit, all in {0,1}. ⊕ is XOR, which is the same as addition mod 2 (the slide writes "x<sub>i</sub> + s<sub>i</sub> mod 2").</p>
    <p><strong>Why it works:</strong> XOR is its own inverse: (x ⊕ s) ⊕ s = x ⊕ (s ⊕ s) = x ⊕ 0 = x. That is why encryption and decryption are the <em>same function</em>.</p>
    <div class="tw"><table style="max-width:320px"><thead><tr><th>a</th><th>b</th><th>a ⊕ b</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>0</td></tr></tbody></table></div>
    <p><strong>Worked example:</strong> plaintext <code>1011 0010</code>, key stream <code>0110 1100</code> → ciphertext <code>1101 1110</code>. XOR the ciphertext with the same key stream: <code>1011 0010</code>. Back to the plaintext.</p>
    <p><strong>Common mistakes:</strong> using AND/OR instead of XOR; reusing the key stream (see the repetition attack in L03a).</p>
  </div>

  <h5>The key distribution problem</h5>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: number of keys needed</span>
    <div class="eq">Symmetric: n(n − 1) / 2 keys&nbsp;&nbsp;&nbsp;&nbsp;Public key: n key pairs (2n keys)</div>
    <p><strong>Variables:</strong> n = number of people who all want to talk privately with each other.</p>
    <p><strong>Why it works:</strong> symmetric crypto needs a separate secret for every <em>pair</em>. Each of n people pairs with n − 1 others, giving n(n−1), but that counts each pair twice (Alice–Bob and Bob–Alice), so divide by 2. With public keys, each person needs only their own pair; anyone can use your public key.</p>
    <p><strong>Worked examples:</strong> n = 5 → 5·4/2 = 10 symmetric keys vs. 5 pairs. n = 100 → 4,950 vs. 100 pairs (200 keys). n = 1,000 → 499,500 vs. 1,000 pairs.</p>
    <p><strong>Common mistake:</strong> forgetting to divide by 2, or answering "n keys" for public-key (it is n <em>pairs</em>; L03a counts that as 2n keys).</p>
  </div>

  <h4>Diagram explained: symmetric vs. public-key channels</h4>
  <figure class="fig">
<pre class="mermaid">
flowchart LR
  subgraph SYM [Symmetric]
    A1[Alice] -- "encrypt with K" --> C1((ciphertext)) -- "decrypt with K" --> B1[Bob]
  end
  subgraph PK [Public-key]
    A2[Alice] -- "encrypt with Bob's PUBLIC key" --> C2((ciphertext)) -- "decrypt with Bob's PRIVATE key" --> B2[Bob]
  end
  E1[Eve] -. eavesdrops .-> C1
  E2[Eve] -. eavesdrops .-> C2
</pre>
    <figcaption>Both slide diagrams show the same channel and eavesdropper; only the keys differ.</figcaption>
  </figure>
  <p>In the symmetric diagram both ends hold the same "shared secret key." In the public-key diagram the sender holds the recipient's <em>public</em> key and the recipient holds the matching <em>private</em> key. The key distribution diagrams show a web of lines (one shared secret per pair, n(n−1)/2) versus each person holding one public/private pair.</p>

  <h5>The padlock analogy and its weakness</h5>
  <p>A non-mathematical version: Bob mails Alice a box and an open padlock. Alice puts her message in, snaps Bob's lock shut, and mails it back. Only Bob has the key. The weakness is <strong>authentication</strong>: Eve could intercept the first mailing and substitute her own padlock, then intercept the locked box, open it with her key, read the message (and re-lock it with Bob's lock). This is a <strong>man-in-the-middle attack</strong>, and it is why public keys need to be tied to identities using digital certificates.</p>

  <h5>The historical progression</h5>
  <ol>
    <li>Earliest cryptography: security depended on keeping the <em>method</em> secret.</li>
    <li>Later: the method is public; security depends on keeping the symmetric <em>key</em> secret.</li>
    <li>Public-key: the method <em>and</em> the encryption key are public, and everyone knows what must be done to find the decryption key. Security rests on that being computationally infeasible.</li>
  </ol>
  <p>Public-key algorithms: <strong>RSA</strong> (hardness of factoring large integers, the most popular), <strong>ElGamal</strong> (discrete logarithm problem), <strong>NTRU</strong> (lattices), <strong>McEliece</strong> (error-correcting codes).</p>

    <thead><tr><th></th><th>Symmetric</th><th>Public key</th></tr></thead>
    <tbody>
      <tr><td>Keys</td><td>One shared secret key</td><td>Public/private key pair</td></tr>
      <tr><td>Speed</td><td>Fast; good for large data</td><td>Slow; do not use for large quantities of data</td></tr>
      <tr><td>Keys for n users</td><td>n(n−1)/2</td><td>n pairs</td></tr>
      <tr><td>Key distribution</td><td>Hard: key must be shared secretly in advance</td><td>Easy: publish the public key (but must authenticate it)</td></tr>

  <div class="box exam"><span class="lbl">The slide's pop quiz</span>
    <details><summary>Which type of encryption uses the same key for both encryption and decryption? A) Public key B) Symmetric C) Both D) Neither</summary><div><p><strong>B) Symmetric.</strong></p></div></details>
    <details><summary>Which statement is true about symmetric encryption? A) Better when numerous people need access B) Less efficient than public key for large data C) The key must be kept secret between the parties D) Each party has different keys</summary><div><p><strong>C.</strong> A is false (key count explodes as n grows). B is backwards (symmetric is faster). D describes public-key crypto.</p></div></details>
  </div>

  <h3 id="l01a-strength">Key length, brute force, and the one-time pad</h3>
  <h4>Big picture</h4>
  <p>How strong is a cipher? Mostly: how long would it take to find the key? Key length sets the upper bound, but a badly designed algorithm can fall far below it.</p>
  <div class="box def"><span class="lbl">Definition: brute-force attack</span>
    <dl>
      <dt>Plain English</dt><dd>Try every key until one works.</dd>
      <dt>Technical</dt><dd>Exhaustive search of the key space, checking which keys yield meaningful decryptions.</dd>
      <dt>Why it matters</dt><dd>It always works eventually, so it sets the ceiling on security. Cryptanalysts hope to find something faster; brute force is the last resort.</dd>
    </dl>
  </div>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: key space and brute-force time</span>
    <div class="eq">Keys = 2<sup>k</sup>&nbsp;&nbsp;&nbsp;&nbsp;Worst-case time = 2<sup>k</sup> / rate&nbsp;&nbsp;&nbsp;&nbsp;Average ≈ 2<sup>k−1</sup> / rate</div>
    <p><strong>Variables:</strong> k = key length in bits; rate = keys tested per second.</p>
    <p><strong>Why it works:</strong> each bit doubles the number of possible keys. On average you find the key halfway through.</p>
    <p><strong>Worked examples.</strong></p>
    <ul>
      <li>16-bit key: 2<sup>16</sup> = 65,536 keys (instant).</li>
      <li>DES, 56-bit: 2<sup>56</sup> ≈ 7.2 × 10<sup>16</sup> keys.</li>
      <li>100-bit key ≈ 10<sup>30</sup> keys (since 2<sup>10</sup> ≈ 10<sup>3</sup>, 2<sup>100</sup> ≈ 10<sup>30</sup>). At 10<sup>9</sup> keys/s: 10<sup>21</sup> seconds ÷ 3.15 × 10<sup>7</sup> s/year ≈ 3 × 10<sup>13</sup> years.</li>
    </ul>
    <p><strong>Units:</strong> use seconds, then divide by 3.15 × 10<sup>7</sup> (seconds per year).</p>
    <p><strong>Common mistake:</strong> thinking a 57-bit key is "slightly" stronger than 56-bit. It is <em>twice</em> as strong. And 128-bit is 2<sup>72</sup> times stronger than 56-bit, not about twice.</p>
  </div>
  <p><strong>Key length is not everything.</strong> The simple substitution cipher (any permutation of the alphabet) has 26! ≈ 4 × 10<sup>26</sup> keys, far more than DES's 7.2 × 10<sup>16</sup>, yet it is trivial to break with frequency analysis. Some algorithms can be attacked by methods other than brute force, and some use their key bits inefficiently: "not all 128-bit algorithms are created equal." Faster-than-brute-force attacks you will meet: frequency analysis (substitution and Vigenère ciphers) and birthday attacks.</p>
  <p><strong>Nothing lasts forever.</strong> DES survived 20 years of scrutiny before falling to a purpose-built parallel computer (the EFF's "Deep Crack," 1998). Quantum computing could change the landscape again.</p>

  <div class="box def"><span class="lbl">Definition: one-time pad</span>
    <dl>
      <dt>Plain English</dt><dd>XOR the message with a truly random key as long as the message, and never use that key again.</dd>
      <dt>Technical</dt><dd>A stream cipher with a uniformly random key stream equal in length to the plaintext, used exactly once. It is provably unbreakable (perfect secrecy): every plaintext of that length is equally likely.</dd>
      <dt>Why it matters</dt><dd>It is the only unbreakable system, but it is enormously expensive: you must securely exchange as much key material as you will ever send.</dd>
    </dl>
  </div>

  <h3 id="l01a-integrity">Digital signatures, hash functions, MACs, and certificates</h3>
  <h4>Big picture</h4>
  <p>Encryption gives confidentiality. These four tools give integrity and authenticity. L03a covers each in depth; here is the conceptual introduction.</p>
  <div class="box def"><span class="lbl">Definition: digital signature</span>
    <dl>
      <dt>Plain English</dt><dd>A value only you can produce that anyone can check.</dd>
      <dt>Technical</dt><dd>To sign M, Alice computes C = E<sub>S<sub>A</sub></sub>(M) with her <em>private</em> key. Anyone decrypts with her <em>public</em> key, M′ = D<sub>P<sub>A</sub></sub>(C), and compares M′ with M.</dd>
      <dt>Why it matters</dt><dd>Only Alice has S<sub>A</sub>, so a valid signature proves authenticity and gives nonrepudiation.</dd>
    </dl>
  </div>
  <div class="box warn"><span class="lbl">Misconception: which key does what</span>
    <p><strong>Encrypt for secrecy:</strong> use the <em>recipient's public</em> key. <strong>Sign:</strong> use the <em>sender's private</em> key. Signing with a private key does not provide confidentiality, because anyone can "decrypt" with the public key. Memory trick: <em>"Public locks, private signs."</em></p>
  </div>
  <div class="box def"><span class="lbl">Definition: cryptographic hash function</span>
    <dl>
      <dt>Plain English</dt><dd>A fingerprint of a message: short, fixed-size, and changes completely if the message changes.</dd>
      <dt>Technical</dt><dd>A checksum Y = H(M) that is <strong>one-way</strong> (easy to compute, hard to invert) and <strong>collision-resistant</strong> (hard to find M ≠ N with H(M) = H(N)). Examples: SHA-1, SHA-256.</dd>
      <dt>Why it matters</dt><dd>Password storage, integrity checks, and efficient signatures (sign the hash, not the whole file).</dd>
    </dl>
  </div>
  <p>Example: SHA-256("hello") begins <code>2cf24dba5fb0a30e…</code>, while SHA-256("Hello") begins <code>185f8db32271fe25…</code>. One capital letter changed everything.</p>
  <div class="box def"><span class="lbl">Definition: message authentication code (MAC)</span>
    <dl>
      <dt>Plain English</dt><dd>A hash that also needs a shared secret, so only key-holders can make a valid one.</dd>
      <dt>Technical</dt><dd>If Alice and Bob share key K, Alice sends M together with MAC = H(K‖M). Bob recomputes H(K‖M′) on what he received and compares. (‖ means concatenation.)</dd>
      <dt>Why it matters</dt><dd>Detects tampering. An attacker can change M but cannot compute the matching MAC without K. (L03a explains why the simple H(K‖M) form is actually insecure and HMAC is used instead.)</dd>
    </dl>
  </div>
  <p><strong>MAC diagram explained.</strong> The sender runs message M and the shared key through hash h, producing MAC <code>4C66809</code>, and sends both. An attacker in the channel modifies the message to M′. The recipient computes h on M′ with the shared key, gets <code>87F9024</code>, compares with the received <code>4C66809</code>, finds a mismatch ("=?"), and flags the attack.</p>
  <div class="box def"><span class="lbl">Definition: digital certificate</span>
    <dl>
      <dt>Plain English</dt><dd>An ID card for a public key, signed by someone everyone trusts.</dd>
      <dt>Technical</dt><dd>A document in which a certificate authority (CA) digitally signs the binding between an identity and that identity's public key.</dd>
      <dt>Why it matters</dt><dd>It defeats the padlock-swap man-in-the-middle: Alice verifies the CA's signature before trusting "Bob's" key. This is how HTTPS works.</dd>
    </dl>
  </div>

  <h4>Diagram explained: combined signature and integrity check (final slide)</h4>
  <figure class="fig">
<pre class="mermaid">
flowchart LR
  M[message M] --> ENC[Encrypt with Alice's private key] --> C[Ciphertext C] --> CH((channel)) --> C2["C' received"] --> DEC[Decrypt with Alice's public key] --> M2["M'"] --> H2[Hash] --> X2["MAC''"]
  M --> H1[Hash] --> X1[MAC] --> CH2((channel)) --> X1b["MAC' received"]
  X1b --> CMP{Match?}
  X2 --> CMP
  CMP -- Yes --> OK[Bob accepts]
  CMP -- No --> BAD[Reject]
</pre>
    <figcaption>Redrawn from the last slide of L01a.</figcaption>
  </figure>
  <p><strong>Top path:</strong> Alice encrypts M with her private key (a signature), producing C. It travels to Bob as C′ (possibly altered). Bob decrypts with Alice's public key to get M′, then hashes M′ to get MAC″. <strong>Bottom path:</strong> Alice also hashes the original M and sends that value (MAC), which arrives as MAC′. <strong>Decision:</strong> Bob compares MAC′ with MAC″. If they match, the message is authentic and unmodified; if not, reject. The slide also shows a key icon beside the hash steps, meaning the hash may be keyed (a true MAC). <strong>What to notice:</strong> two independent paths must agree, and only Alice could have produced a C that decrypts under her public key.</p>

  <h3 id="l01a-pw">Passwords and social engineering</h3>
  <h4>Big picture</h4>
  <p>Passwords are the most common authentication factor and one of the weakest. The "worth notice" list asks you to create a strong password <em>with reasonable analysis</em>, which means doing the math below.</p>
  <div class="box def"><span class="lbl">Definition: password</span>
    <dl>
      <dt>Plain English</dt><dd>A secret you type to prove who you are.</dd>
      <dt>Technical</dt><dd>A short sequence of characters used to authenticate someone via a secret they know.</dd>
      <dt>Why it matters</dt><dd>Its strength is entirely a function of how many guesses an attacker needs.</dd>
    </dl>
  </div>

  <h5>How passwords are stored</h5>
  <p>The slide's diagram: the user enters <code>Dog124</code>; it passes through a hash function; the result is stored in the password file next to the username, e.g., <code>Butch:ASDSA21QW3R50EERWWER323…</code>. At login, the system hashes what you typed and compares hashes. The plaintext password is never stored, so a stolen password file does not directly reveal passwords; attackers must guess and hash candidates (a brute-force or dictionary attack). Modern systems also add a random <strong>salt</strong> per user so identical passwords get different hashes. On Linux the hashes live in <code>/etc/shadow</code> (see L04a).</p>

  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: password search space</span>
    <div class="eq">N = C<sup>L</sup></div>
    <p><strong>Variables:</strong> C = size of the character set; L = password length; N = number of possible passwords.</p>
    <p><strong>Why it works:</strong> each of the L positions independently has C choices, so multiply C by itself L times.</p>
    <p><strong>Character sets:</strong> digits 10; one case of letters 26; both cases 52; special characters 32; practical keyboard total 52 + 10 + 32 = <strong>94</strong>; full 7-bit ASCII 2<sup>7</sup> = 128.</p>
  </div>
  <div class="tw"><table>
    <thead><tr><th>6-character password using…</th><th class="num">Combinations</th></tr></thead>
    <tbody>
      <tr><td>Digits only (10<sup>6</sup>)</td><td class="num">1,000,000</td></tr>
      <tr><td>One letter case (26<sup>6</sup>)</td><td class="num">308,915,776</td></tr>
      <tr><td>32 special characters (32<sup>6</sup>)</td><td class="num">1,073,741,824</td></tr>
      <tr><td>Upper and lower case (52<sup>6</sup>)</td><td class="num">19,770,609,664</td></tr>
      <tr><td>All 94 practical symbols (94<sup>6</sup>)</td><td class="num">689,869,781,056</td></tr>
      <tr><td>7-bit ASCII (128<sup>6</sup>)</td><td class="num">4,398,046,511,104</td></tr>
    </tbody>
  </table></div>
  <div class="tw"><table>
    <thead><tr><th>Length (94 symbols)</th><th class="num">94<sup>L</sup></th><th class="num">Guesses/sec to exhaust in 60 days</th></tr></thead>
    <tbody>
      <tr><td>5</td><td class="num">7,339,040,224</td><td class="num">1,415</td></tr>
      <tr><td>6</td><td class="num">689,869,781,056</td><td class="num">133,076</td></tr>
      <tr><td>7</td><td class="num">64,847,759,419,264</td><td class="num">12,509,214</td></tr>
      <tr><td>8</td><td class="num">6,095,689,385,410,816</td><td class="num">1,175,866,008</td></tr>
      <tr><td>9</td><td class="num">572,994,802,228,616,704</td><td class="num">110,531,404,750</td></tr>
    </tbody>
  </table></div>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: required cracking rate</span>
    <div class="eq">rate = C<sup>L</sup> / T</div>
    <p><strong>Variables:</strong> T = how long the password stays valid, in seconds. The slide uses a 60-day password change policy: T = 60 × 24 × 3600 = 5,184,000 s.</p>
    <p><strong>Interpretation:</strong> if an attacker can test more than this many passwords per second, they can try every possible password before you are forced to change it.</p>
    <p><strong>Worked example (6 chars):</strong> 689,869,781,056 ÷ 5,184,000 ≈ 133,076 guesses/s.</p>
  </div>
  <div class="box ex"><span class="lbl">Worked examples: is it safe? <span class="lvl">medium → hard</span></span>
    <p>The slide gives two attackers: a computer with an <strong>RTX 4090 GPU at 5,000,000 guesses/s</strong>, and the <strong>Frontier supercomputer at 440,000,000,000,000 (4.4 × 10<sup>14</sup>) guesses/s</strong>.</p>
    <p><strong>1. 6 characters vs. the GPU.</strong> Needed rate 133,076/s. The GPU does 5,000,000/s, far more. Broken well within 60 days (694 billion ÷ 5 million ≈ 138,000 s ≈ 1.6 days).</p>
    <p><strong>2. 7 characters vs. the GPU.</strong> Needed 12,509,214/s, more than 5,000,000. The GPU needs 64.8 × 10<sup>12</sup> ÷ 5 × 10<sup>6</sup> ≈ 1.3 × 10<sup>7</sup> s ≈ 150 days to exhaust, longer than 60. Safe against this attacker under the change policy (though on average the key is found halfway, around 75 days, still over 60).</p>
    <p><strong>3. 8 characters vs. the GPU.</strong> 6.1 × 10<sup>15</sup> ÷ 5 × 10<sup>6</sup> ≈ 1.22 × 10<sup>9</sup> s ≈ 38.6 years. Safe.</p>
    <p><strong>4. 8 characters vs. Frontier.</strong> 6.1 × 10<sup>15</sup> ÷ 4.4 × 10<sup>14</sup> ≈ <strong>14 seconds</strong>. Even 9 characters falls in about 22 minutes. The lesson: length and character variety matter, and so does slow, salted hashing that limits guesses per second.</p>
    <p><strong>5. Which slide password is strongest?</strong> <code>Seattle1</code> (dictionary word + digit), <code>M1ke03</code> (short, name + leetspeak), <code>P@$$w0rd</code> (famous leetspeak of "password", in every cracking list), <code>TD2k5secV</code> (9 characters, mixed case, digits, no dictionary word). <strong>TD2k5secV</strong> is strongest. The math above assumes random passwords; real attackers try dictionary words and common substitutions first, so the first three fall far faster than their raw C<sup>L</sup>.</p>
  </div>
  <p><strong>Rules for strong passwords:</strong> use characters from at least three of these groups: uppercase, lowercase, digits, special characters. Prefer <strong>pass phrases</strong> like <code>I re@lly want to buy 11 Dogs!</code>: long, easy to remember, and they include all four groups. Length grows the exponent, which beats any single substitution trick.</p>

  <h5>Social engineering</h5>
  <p>Attacks on the human attack surface rather than the technology:</p>
  <div class="tw"><table>
    <thead><tr><th>Technique</th><th>How it works</th><th>Example</th></tr></thead>
    <tbody>
      <tr><td>Pretexting</td><td>Invent a story that convinces an administrator or operator to reveal secrets</td><td>"Hi, I'm from IT, I need your password to fix your account"</td></tr>
      <tr><td>Baiting</td><td>Offer a "gift" to get the victim to do something insecure</td><td>A USB drive labeled "Salaries 2026" left in the parking lot</td></tr>
      <tr><td>Quid pro quo</td><td>Offer a service and expect something in return</td><td>"Free tech support" in exchange for remote access</td></tr>
    </tbody>
  </table></div>
  <p>Memory trick: pretexting = a <em>pretext</em> (a false story); baiting = a <em>lure</em>; quid pro quo = Latin for "something for something."</p>

  <h3 id="l01a-acm">Access control matrices</h3>
  <h4>Big picture</h4>
  <p>The outline lists "access control models," and the worth-notice list asks: <em>how do you draw an access control matrix when roles and access rights are given?</em> The deck does not include a slide for it, so here is the full method. L04a builds on it with ACLs and RBAC.</p>
  <div class="box def"><span class="lbl">Definition: access control matrix</span>
    <dl>
      <dt>Plain English</dt><dd>A table showing who can do what to which thing.</dd>
      <dt>Technical</dt><dd>A table with <strong>subjects</strong> (users, roles, processes) as rows and <strong>objects</strong> (files, directories, devices) as columns. Each cell lists the access rights (e.g., read, write, execute, own) the subject has on the object.</dd>
      <dt>Why it matters</dt><dd>It is the model behind every real system. Reading a <em>column</em> gives that object's <strong>access control list (ACL)</strong>; reading a <em>row</em> gives that subject's <strong>capability list</strong>.</dd>
    </dl>
  </div>
  <div class="box proc"><span class="lbl">Process: drawing an access control matrix</span>
    <ol>
      <li>List every subject (or role) as a row.</li>
      <li>List every object as a column.</li>
      <li>For each rule in the problem, write the rights in the matching cell, using letters (r, w, x, o for own).</li>
      <li>Leave cells with no rights empty or mark "—".</li>
      <li>Check each rule once more against the table, especially "only," "all," and "except" wording.</li>
    </ol>
  </div>
  <div class="box ex"><span class="lbl">Worked example</span>
    <p><strong>Given:</strong> Instructors can read and write the gradebook and the exams. TAs can read and write the gradebook and read the exams. Students can read the syllabus. Everyone can read the syllabus; only instructors can write it.</p>
    <div class="tw"><table>
      <thead><tr><th>Subject \ Object</th><th>gradebook</th><th>exams</th><th>syllabus</th></tr></thead>
      <tbody>
        <tr><td>Instructor</td><td>r, w</td><td>r, w</td><td>r, w</td></tr>
        <tr><td>TA</td><td>r, w</td><td>r</td><td>r</td></tr>
        <tr><td>Student</td><td>—</td><td>—</td><td>r</td></tr>
      </tbody>
    </table></div>
    <p><strong>ACL for exams</strong> (a column): Instructor: rw; TA: r. <strong>Capability list for TA</strong> (a row): gradebook: rw; exams: r; syllabus: r.</p>
    <p><strong>Harder follow-up:</strong> in a real system, the matrix is mostly empty (thousands of users × millions of files), so systems store only the non-empty entries, either by column (ACLs) or by row (capabilities). That trade-off is the subject of L04a's "Capabilities vs. ACLs."</p>
  </div>

<!-- ===================== L03a ===================== -->
<section class="lecture prose" id="l03a">
  <div class="plate"><span class="num" aria-hidden="true">L03a</span><p class="ttl">Cryptographic tools: ciphers, RSA, and hashing</p><p class="src">Source: L03a-Cryptographic.pdf (Goodrich &amp; Tamassia Ch. 8, Stallings &amp; Brown Ch. 2)</p></div>
  <p>This is the most math-heavy lecture so far. It deepens every idea from L01a: symmetric ciphers get real algorithms (DES, AES) and modes of operation, public-key crypto gets its math (RSA), and hashing gets its security properties and applications. If you only have time for three things, master <strong>RSA key setup with the extended Euclidean algorithm</strong>, <strong>CBC mode</strong>, and <strong>the three hash properties with the birthday bound</strong>.</p>

  <h3 id="l03a-sym">Symmetric encryption and how it is attacked</h3>
  <h4>Big picture</h4>
  <p>Alice wants to send plaintext P to Bob over an eavesdropped channel. If they have already agreed on a scheme and a secret key K, she sends ciphertext C instead. The questions this section answers: what makes a scheme good, how expensive is it, and how big is the ciphertext compared to the plaintext?</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: consistency (correctness)</span>
    <dl>
      <dt>Plain English</dt><dd>Decrypting what you encrypted gives you back the original.</dd>
      <dt>Technical</dt><dd>D<sub>K</sub>(E<sub>K</sub>(P)) = P for every plaintext P and key K.</dd>
      <dt>Why it matters</dt><dd>A cipher that is secure but not consistent is useless. Consistency forces E<sub>K</sub> to be a <strong>bijection</strong> (a one-to-one, onto mapping, i.e., a permutation) on the set of n-bit arrays: no two plaintexts may encrypt to the same ciphertext under the same key.</dd>
    </dl>
  </div>
  <p><strong>Notation used throughout:</strong> K = secret key, E<sub>K</sub>(P) = encryption, D<sub>K</sub>(C) = decryption. Plaintext and ciphertext are typically the same length. Both functions must have <strong>efficient</strong> algorithms.</p>

  <h4>Explanation: two ways to attack</h4>
  <div class="tw"><table>
    <thead><tr><th></th><th>Brute-force attack</th><th>Cryptanalytic attack</th></tr></thead>
    <tbody>
      <tr><td>Idea</td><td>Try every key on some ciphertext until the output is intelligible</td><td>Exploit the algorithm's characteristics to deduce the plaintext or key</td></tr>
      <tr><td>Relies on</td><td>Enough computing power; ability to recognize correct plaintext</td><td>The nature of the algorithm, general knowledge about the plaintext, sample plaintext–ciphertext pairs</td></tr>
      <tr><td>Cost</td><td>On average, half of all keys must be tried</td><td>Can be far less than brute force</td></tr>
      <tr><td>If successful</td><td>That key is found</td><td>All past and future messages under that key are compromised</td></tr>
    </tbody>
  </table></div>
  <p><strong>Diagram explained: the four attack models (a–d).</strong> Each panel shows an encryption algorithm box with a key, and Eve. In (a) <em>ciphertext only</em>, Eve sees just the ciphertext. In (b) <em>known plaintext</em>, she sees both the plaintext ("Hi, Bob. Don't invite Eve to the party! Love, Alice") and its ciphertext. In (c) <em>chosen plaintext</em>, Eve supplies the plaintext herself (the alphabet "ABCDEFG…") and sees what comes out. In (d) <em>chosen ciphertext</em>, Eve supplies ciphertext (bit strings like <code>001101</code>) and sees the resulting plaintext (gibberish like "IJCGA, CAN DO HIFFA GOT TIME."). The progression shows Eve gaining more control at each step.</p>
  <p><strong>Brute force needs recognizable plaintext.</strong> Trying key K means computing D<sub>K</sub>(C) and asking "is this a likely plaintext?" That requires knowing something about the plaintext's structure (a PDF header, an email format). The defense is a key that is a sufficiently long random value, making exhaustive search infeasible.</p>

  <h3 id="l03a-entropy">Redundancy, entropy, and unicity distance</h3>
  <h4>Big picture</h4>
  <p>Why can a brute-force attacker tell the right key from the wrong ones? Because real language is highly redundant. Out of all possible bit strings, very few are English. This section quantifies how much ciphertext an attacker needs before only one key produces sensible output.</p>

  <div class="box bg"><span class="lbl">Background: ASCII and entropy</span>
    <p><strong>ASCII</strong> encodes each English character as 8 bits (one byte), so a t-character message is an n-bit array with <strong>n = 8t</strong>. <strong>Entropy</strong> (Shannon) measures information content: how many bits of genuinely unpredictable information each symbol carries. If every one of 256 byte values were equally likely, each byte would carry 8 bits. English carries only about <strong>1.25 bits per character</strong>, because letters are predictable ("th", "ing", "q" is followed by "u"). The rest is <strong>redundancy</strong>.</p>
  </div>

  <h4>Diagram explained: English text as a tiny subset</h4>
  <p>The slide shows two large ovals labeled "Plaintexts: n-bit strings" and "Ciphertexts: n-bit strings." Inside the plaintext oval is a small region labeled "English text." Arrows show encryption scattering that small region across the whole ciphertext oval. The point: English plaintexts are a very small subset of all n-bit arrays, so a random wrong key almost always decrypts to something outside that subset, which is garbage an attacker can reject.</p>

  <h4>Important formulas</h4>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: how many n-bit strings are valid English</span>
    <div class="eq">(2<sup>1.25</sup>)<sup>t</sup> = 2<sup>1.25t</sup> = 2<sup>1.25n/8</sup> ≈ 2<sup>0.16n</sup> = 2<sup>βn</sup></div>
    <p><strong>Variables:</strong> t = characters, n = 8t bits, β = the language's constant (β &lt; 1; for English β ≈ 1.25/8 ≈ 0.16).</p>
    <p><strong>Why it works:</strong> 1.25 bits of entropy per character means roughly 2<sup>1.25</sup> ≈ 2.4 "effective choices" per character, so t characters give 2<sup>1.25t</sup> meaningful strings. Substitute t = n/8.</p>
    <p><strong>Fraction of n-bit strings that are valid:</strong> 2<sup>βn</sup> / 2<sup>n</sup> = 1 / 2<sup>(1−β)n</sup>. For a 64-bit block that is 1/2<sup>54</sup>, a vanishingly small probability.</p>
  </div>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: unicity distance</span>
    <div class="eq">n = k / (1 − β)</div>
    <p><strong>Variables:</strong> k = key length in bits; β = language constant; n = ciphertext length in bits.</p>
    <p><strong>Derivation.</strong> A brute-force attacker tries all 2<sup>k</sup> keys, producing 2<sup>k</sup> candidate plaintexts. Each is valid with probability 1/2<sup>(1−β)n</sup>, so the expected number of valid-looking plaintexts is 2<sup>k</sup> / 2<sup>(1−β)n</sup>. When this equals 1, only the true plaintext looks valid (no "spurious keys"). Set 2<sup>k</sup> = 2<sup>(1−β)n</sup>, so k = (1−β)n and n = k/(1−β).</p>
    <p><strong>Interpretation:</strong> the unicity distance is the minimum ciphertext length at which a brute-force attacker can, in principle, identify the unique correct key. It says nothing about how <em>long</em> the search takes.</p>
    <p><strong>Worked examples</strong> (1 − β ≈ 0.844):</p>
    <ul>
      <li>AES-256 (slide): 256 / 0.844 ≈ 303 → <strong>304 bits</strong>, about 38 characters.</li>
      <li>AES-128: 128 / 0.844 ≈ 152 bits ≈ 19 characters.</li>
      <li>DES (56 bits): 56 / 0.844 ≈ 66 bits ≈ 8–9 characters. So a single 64-bit DES block of English almost pins down the key.</li>
    </ul>
    <p><strong>Common mistakes:</strong> dividing by β instead of (1 − β); forgetting the answer is in <em>bits</em> (divide by 8 for characters); concluding a short message is "safe" (it only means brute force cannot distinguish keys, and real attackers usually have more ciphertext).</p>
  </div>

  <h5>Frequency analysis and S-boxes</h5>
  <p>Letters, pairs ("th"), and triples ("the") are not uniformly distributed, and that knowledge breaks substitution ciphers (as with the Caesar practice in L01a). Substitution also works on binary numbers: a <strong>substitution box (S-box)</strong> is a lookup table mapping each small input bit pattern to an output pattern (for example, a 4-bit S-box maps each of 16 inputs to a 4-bit output). S-boxes are the nonlinear core of DES and AES.</p>

  <h3 id="l03a-block">Block ciphers: DES, Triple DES, and AES</h3>
  <h4>Big picture</h4>
  <p>Block ciphers are the workhorses of symmetric encryption. You need to know their block sizes, key sizes, why DES was replaced, and how AES is structured.</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: block cipher</span>
    <dl>
      <dt>Plain English</dt><dd>A cipher that encrypts fixed-size chunks.</dd>
      <dt>Technical</dt><dd>Plaintext and ciphertext have fixed length b (e.g., 128 bits). A plaintext of length n is split into m blocks P[0], …, P[m−1] with n ≤ bm ≤ n + b, and each block is encrypted or decrypted.</dd>
      <dt>Why it matters</dt><dd>The extra bits (bm − n) are <strong>padding</strong>, and how blocks are combined is the <strong>mode of operation</strong>. Both affect security.</dd>
    </dl>
  </div>

  <h4>Explanation: padding</h4>
  <p>Block ciphers need the plaintext length to be a multiple of b. Padding must be <strong>unambiguous</strong>: you cannot just add zeros, because the receiver could not tell padding zeros from real trailing zeros. <strong>PKCS5</strong> (PKCS7 for general block sizes) appends a sequence of identical bytes, each equal to the number of padding bytes. <strong>You always pad</strong>, even when the plaintext already fills the last block; in that case you add an entire block of padding.</p>
  <div class="box ex"><span class="lbl">Worked examples: PKCS5 padding, b = 128 bits (16 bytes) <span class="lvl">easy → hard</span></span>
    <p><strong>1. Slide example.</strong> "Roberto" is 7 bytes. Need 16 − 7 = 9 bytes of padding, each with value 9: <code>Roberto</code> + <code>09 09 09 09 09 09 09 09 09</code>. (The slide writes "Roberto999999999" where 9 means the byte value 9, not the character "9".)</p>
    <p><strong>2.</strong> A 14-byte message gets <code>02 02</code>.</p>
    <p><strong>3.</strong> A 15-byte message gets <code>01</code>.</p>
    <p><strong>4. Tricky.</strong> A 16-byte message gets a whole new block of sixteen <code>10</code> bytes (0x10 = 16). Total 32 bytes. Why? If you added nothing and the message happened to end in byte <code>01</code>, the receiver would wrongly strip it.</p>
    <p><strong>5. Unpadding.</strong> Read the last byte, say it is 5; remove the last 5 bytes (and check they all equal 5).</p>
    <p><strong>6. Block count.</strong> A 40-byte message with 16-byte blocks: 40 = 2 × 16 + 8, pad 8 bytes → 48 bytes → 3 blocks.</p>
  </div>

  <h5>Table 2.1: three popular symmetric algorithms</h5>
  <div class="tw"><table>
    <thead><tr><th></th><th>DES</th><th>Triple DES</th><th>AES</th></tr></thead>
    <tbody>
      <tr><td>Plaintext block (bits)</td><td>64</td><td>64</td><td>128</td></tr>
      <tr><td>Ciphertext block (bits)</td><td>64</td><td>64</td><td>128</td></tr>
      <tr><td>Key size (bits)</td><td>56</td><td>112 or 168</td><td>128, 192, or 256</td></tr>
    </tbody>
  </table></div>

  <h5>DES (Data Encryption Standard)</h5>
  <p>For many years the most widely used scheme (FIPS PUB 46; the algorithm is called DEA). It uses a 64-bit plaintext block and a 56-bit key to produce a 64-bit ciphertext block. Two strength concerns: (1) the algorithm itself, though DES is the most studied cipher in existence and no fatal structural flaw was found; and (2) the <strong>56-bit key</strong>, which is woefully inadequate for modern processor speeds. Concern (2) is what killed it.</p>

  <h5>Table 2.2: average time for exhaustive key search</h5>
  <div class="tw"><table>
    <thead><tr><th>Key size</th><th>Cipher</th><th class="num">Keys</th><th class="num">At 10<sup>9</sup> decryptions/s</th><th class="num">At 10<sup>13</sup> decryptions/s</th></tr></thead>
    <tbody>
      <tr><td>56</td><td>DES</td><td class="num">2<sup>56</sup> ≈ 7.2 × 10<sup>16</sup></td><td class="num">2<sup>55</sup> ns ≈ 1.125 years</td><td class="num">about 1 hour</td></tr>
      <tr><td>128</td><td>AES</td><td class="num">2<sup>128</sup> ≈ 3.4 × 10<sup>38</sup></td><td class="num">5.3 × 10<sup>21</sup> years</td><td class="num">5.3 × 10<sup>17</sup> years</td></tr>
      <tr><td>168</td><td>Triple DES</td><td class="num">2<sup>168</sup> ≈ 3.7 × 10<sup>50</sup></td><td class="num">5.8 × 10<sup>33</sup> years</td><td class="num">5.8 × 10<sup>29</sup> years</td></tr>
      <tr><td>192</td><td>AES</td><td class="num">2<sup>192</sup> ≈ 6.3 × 10<sup>57</sup></td><td class="num">9.8 × 10<sup>40</sup> years</td><td class="num">9.8 × 10<sup>36</sup> years</td></tr>
      <tr><td>256</td><td>AES</td><td class="num">2<sup>256</sup> ≈ 1.2 × 10<sup>77</sup></td><td class="num">1.8 × 10<sup>60</sup> years</td><td class="num">1.8 × 10<sup>56</sup> years</td></tr>
    </tbody>
  </table></div>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Reading Table 2.2</span>
    <div class="eq">Average time = 2<sup>k−1</sup> / rate</div>
    <p><strong>Why 2<sup>55</sup> for a 56-bit key:</strong> on average you search half the key space, and half of 2<sup>56</sup> is 2<sup>55</sup>. At 10<sup>9</sup> per second, each try takes 1 nanosecond, so the time is 2<sup>55</sup> ns ≈ 3.6 × 10<sup>16</sup> ns = 3.6 × 10<sup>7</sup> s ≈ 1.1 years.</p>
    <p><strong>At 10<sup>13</sup>/s:</strong> 3.6 × 10<sup>16</sup> / 10<sup>13</sup> = 3,600 s ≈ one hour. That is why DES is dead.</p>
    <p><strong>Check AES-128:</strong> 2<sup>127</sup> ≈ 1.7 × 10<sup>38</sup> ns = 1.7 × 10<sup>29</sup> s ÷ 3.15 × 10<sup>7</sup> ≈ 5.4 × 10<sup>21</sup> years. The universe is about 1.4 × 10<sup>10</sup> years old.</p>
    <p><strong>Common mistake:</strong> mixing units. The slide's footnotes mention microseconds, but the numbers only work out with nanoseconds (10<sup>9</sup> per second).</p>
  </div>

  <h5>Triple DES (3DES)</h5>
  <p>Runs DES three times with two or three distinct keys (first standardized for finance in ANSI X9.17, 1985). The usual pattern is Encrypt–Decrypt–Encrypt: C = E<sub>K3</sub>(D<sub>K2</sub>(E<sub>K1</sub>(P))). <strong>Attractions:</strong> the 168-bit key defeats brute force, and the underlying algorithm is the well-studied DES. <strong>Drawbacks:</strong> sluggish in software (three times the work of an already slow cipher) and still a 64-bit block, which is small by modern standards.</p>

  <h5>AES (Advanced Encryption Standard)</h5>
  <p>3DES was not reasonable long-term, so in 1997 NIST publicly called for proposals. Requirements: security equal to or better than 3DES, much better efficiency, a symmetric block cipher with 128-bit blocks and 128/192/256-bit keys. After narrowing to five finalists, NIST selected <strong>Rijndael</strong> (by Joan Daemen and Vincent Rijmen) in November 2001, published as <strong>FIPS 197</strong>. The versions are AES-128, AES-192, and AES-256.</p>

  <h4>Diagram explained: AES round structure (AES-128)</h4>
  <figure class="fig">
<pre class="mermaid">
flowchart TD
  P[Plaintext P] --> X((XOR))
  K[Key K] --> X
  X --> X0[X0 = P XOR K]
  X0 --> R1[Round 1] --> R2[Round 2] --> D[... Rounds 3 to 9 ...] --> R10[Round 10] --> C[Ciphertext C = X10]
</pre>
    <figcaption>Redrawn: ten rounds, each turning state X<sub>i−1</sub> into X<sub>i</sub>.</figcaption>
  </figure>
  <p>The 128-bit working value is called the <strong>state</strong>. First, the plaintext is XORed with the key: <strong>X<sub>0</sub> = P ⊕ K</strong>. Then rounds 1 through 10 each take X<sub>i−1</sub> and produce X<sub>i</sub> through an invertible transformation. The ciphertext is the output of round 10: <strong>C = X<sub>10</sub></strong>. The slide's figure also shows K feeding into every round, because each round mixes in a round key derived from K. (AES-192 uses 12 rounds and AES-256 uses 14.)</p>
  <div class="box proc"><span class="lbl">Process: the four steps in each AES round</span>
    <p>The 128-bit state is arranged as a 4 × 4 grid of bytes.</p>
    <ol>
      <li><strong>SubBytes:</strong> replace each byte using an S-box. This is the nonlinear "confusion" step that defeats algebraic attacks.</li>
      <li><strong>ShiftRows:</strong> a permutation: cyclically shift each row left by 0, 1, 2, and 3 positions, spreading bytes across columns.</li>
      <li><strong>MixColumns:</strong> multiply each column by a fixed matrix, so every output byte depends on all four input bytes of its column ("diffusion").</li>
      <li><strong>AddRoundKey:</strong> XOR the state with a round key derived from the 128-bit encryption key.</li>
    </ol>
    <p><strong>Why it exists:</strong> after a few rounds, every output bit depends on every input bit and key bit in a complicated way. <strong>Exam note:</strong> the final round skips MixColumns. <strong>Common misconception:</strong> "AES encrypts the plaintext ten times with the same key." It uses a different round key each round.</p>
    <p>Memory trick: <em>"Some Shy Monkeys Add"</em> → Sub, Shift, Mix, Add.</p>
  </div>

  <h3 id="l03a-modes">Block cipher modes: ECB and CBC</h3>
  <h4>Big picture</h4>
  <p>Real data is longer than one 64- or 128-bit block. A <strong>mode of operation</strong> describes how a block cipher encrypts and decrypts a sequence of blocks. The simplest mode leaks patterns; the more common one hides them.</p>

  <h4>Definitions and formulas</h4>
  <div class="box def"><span class="lbl">Definition: Electronic Code Book (ECB) mode</span>
    <dl>
      <dt>Plain English</dt><dd>Encrypt each block on its own with the same key.</dd>
      <dt>Technical</dt><dd>C[i] = E<sub>K</sub>(P[i]); P[i] = D<sub>K</sub>(C[i]).</dd>
      <dt>Why it matters</dt><dd>Identical plaintext blocks always give identical ciphertext blocks, so patterns leak.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: Cipher Block Chaining (CBC) mode</span>
    <dl>
      <dt>Plain English</dt><dd>Mix each plaintext block with the previous ciphertext block before encrypting, so every block depends on all the ones before it.</dd>
      <dt>Technical</dt><dd>C[i] = E<sub>K</sub>(C[i−1] ⊕ P[i]), with C[−1] = V, a random <strong>initialization vector (IV)</strong> transmitted separately (encrypted, per the slide). Decryption: P[i] = C[i−1] ⊕ D<sub>K</sub>(C[i]).</dd>
      <dt>Why it matters</dt><dd>Hides patterns; it is the most common classic mode.</dd>
    </dl>
  </div>

  <h4>Diagrams explained</h4>
  <p><strong>ECB diagram:</strong> four independent columns. Each P[i] enters its own E<sub>K</sub> box and exits as C[i]. No arrows connect the columns.</p>
  <p><strong>The ECB penguin:</strong> image (a) is Tux, the Linux penguin. Image (b) is the same bitmap encrypted with ECB. You can still clearly see the penguin's outline, because every block of solid black pixels encrypted to the same ciphertext block, and every block of solid white to another. This is the single most famous illustration of why ECB is unsuitable for documents and images.</p>
  <figure class="fig">
<pre class="mermaid">
flowchart LR
  V[IV V] --> X0((XOR))
  P0[P0] --> X0 --> E0[E_K] --> C0[C0]
  C0 --> X1((XOR))
  P1[P1] --> X1 --> E1[E_K] --> C1[C1]
  C1 --> X2((XOR))
  P2[P2] --> X2 --> E2[E_K] --> C2[C2]
</pre>
    <figcaption>CBC encryption: each ciphertext block feeds the next XOR.</figcaption>
  </figure>
  <p><strong>CBC encryption diagram:</strong> the IV V is XORed with P[0], the result is encrypted to get C[0], and C[0] travels diagonally to be XORed with P[1], and so on. <strong>CBC decryption diagram</strong> (the slide's right half): each C[i] goes into D<sub>K</sub>, and the output is XORed with the <em>previous</em> ciphertext block (or V for the first) to produce P[i]. Notice that decryption of block i only needs C[i] and C[i−1], so decryption can be done in parallel, but encryption cannot.</p>

  <h4>Examples</h4>
  <div class="box ex"><span class="lbl">Worked example: ECB vs. CBC with a toy 4-bit cipher <span class="lvl">medium</span></span>
    <p>To see the chaining, use a toy (insecure) cipher E<sub>K</sub>(x) = x ⊕ K on 4-bit blocks, with K = <code>0110</code>, IV V = <code>0011</code>, and two <em>identical</em> plaintext blocks P[0] = P[1] = <code>1010</code>.</p>
    <p><strong>ECB:</strong> C[0] = 1010 ⊕ 0110 = <code>1100</code>; C[1] = <code>1100</code>. Identical blocks leak.</p>
    <p><strong>CBC:</strong> C[0] = E(P[0] ⊕ V) = E(1010 ⊕ 0011) = E(1001) = 1001 ⊕ 0110 = <code>1111</code>. C[1] = E(P[1] ⊕ C[0]) = E(1010 ⊕ 1111) = E(0101) = 0101 ⊕ 0110 = <code>0011</code>. Different, even though the plaintext blocks were identical.</p>
    <p><strong>CBC decryption check:</strong> P[1] = C[0] ⊕ D(C[1]) = 1111 ⊕ (0011 ⊕ 0110) = 1111 ⊕ 0101 = <code>1010</code> ✓. P[0] = V ⊕ D(C[0]) = 0011 ⊕ (1111 ⊕ 0110) = 0011 ⊕ 1001 = <code>1010</code> ✓.</p>
  </div>
  <div class="box ex"><span class="lbl">Worked example: error propagation <span class="lvl">hard</span></span>
    <p>In CBC, one bit of C[1] is flipped in transit. Which plaintext blocks are affected on decryption? P[1] = C[0] ⊕ D(C[1]) is completely garbled (D scrambles it). P[2] = C[1] ⊕ D(C[2]) has exactly the same single bit flipped (because C[1] is XORed in directly). P[3] onward is fine. In ECB, only P[1] would be garbled. This is why the slides say ECB "can tolerate the loss or damage of a block" and CBC needs reliable delivery of all blocks in sequence.</p>
  </div>

  <div class="tw"><table>
    <thead><tr><th></th><th>ECB</th><th>CBC</th></tr></thead>
    <tbody>
      <tr><td>Strengths</td><td>Very simple; blocks can be encrypted in parallel; tolerates loss or damage of a block</td><td>Hides plaintext patterns; most common mode; fast and relatively simple</td></tr>
      <tr><td>Weaknesses</td><td>Repeated plaintext patterns appear in ciphertext; unsuitable for documents and images</td><td>Requires reliable, sequential transmission of all blocks; unsuitable when packets may be lost (music, video streaming)</td></tr>
      <tr><td>Needs IV?</td><td>No</td><td>Yes (random, unpredictable)</td></tr>
    </tbody>
  </table></div>
  <div class="box warn"><span class="lbl">Misconceptions</span>
    <p>"The IV must be secret." In most real protocols the IV is sent in the clear; it must be <em>random and unpredictable</em>, not secret. (The slide says it is transmitted encrypted, which is also acceptable.) Also: "ECB is fine if the key is strong." No: ECB leaks structure regardless of key strength.</p>
  </div>

  <h5>Code examples from the slides</h5>
  <p>Both examples generate a random AES key, create an AES cipher in ECB mode with PKCS5 padding, encrypt "My secret message" (17 bytes, so it pads to 32 bytes / 2 blocks), then decrypt.</p>
<pre class="code"><code>// Java (javax.crypto)
KeyGenerator keygen = KeyGenerator.getInstance("AES");
SecretKey aesKey = keygen.generateKey();                        // random AES key
Cipher aesCipher = Cipher.getInstance("AES/ECB/PKCS5Padding");  // algorithm/mode/padding
aesCipher.init(Cipher.ENCRYPT_MODE, aesKey);
byte[] ciphertext = aesCipher.doFinal("My secret message".getBytes());
aesCipher.init(Cipher.DECRYPT_MODE, aesKey);
byte[] plaintext1 = aesCipher.doFinal(ciphertext);</code></pre>
<pre class="code"><code># Python (pycryptodome)
from Crypto.Cipher import AES
from Crypto.Random import get_random_bytes
from Crypto.Util.Padding import pad, unpad

key = get_random_bytes(16)                    # 16 bytes = AES-128
cipher = AES.new(key, AES.MODE_ECB)
ciphertext = cipher.encrypt(pad(b"My secret message", AES.block_size))   # block_size = 16
decipher = AES.new(key, AES.MODE_ECB)
plaintext = unpad(decipher.decrypt(ciphertext), AES.block_size)</code></pre>
  <p>Note the difference: Java's <code>PKCS5Padding</code> pads automatically inside <code>doFinal</code>, while Python requires explicit <code>pad</code>/<code>unpad</code> calls. Also note these examples use ECB only because it is simplest; in real code you would use CBC (with an IV) or an authenticated mode like GCM.</p>

  <h3 id="l03a-stream">Stream ciphers</h3>
  <h4>Big picture</h4>
  <p>When data arrives continuously and at unpredictable length (voice, video), stream ciphers encrypt it on the fly without padding.</p>
  <div class="box def"><span class="lbl">Definition: key stream and stream cipher</span>
    <dl>
      <dt>Plain English</dt><dd>Generate a long stream of random-looking bits from the key and XOR it with the message.</dd>
      <dt>Technical</dt><dd>A key stream is a pseudo-random bit sequence S = S[0], S[1], …, generated one bit or byte at a time. Encryption: C[i] = S[i] ⊕ P[i].</dd>
      <dt>Why it matters</dt><dd>Works for plaintext of arbitrary length generated on the fly, such as media streams.</dd>
    </dl>
  </div>
  <div class="tw"><table>
    <thead><tr><th></th><th>Synchronous stream cipher</th><th>Self-synchronizing stream cipher</th></tr></thead>
    <tbody>
      <tr><td>Key stream from</td><td>Only the secret key K</td><td>The secret key and the q previous ciphertext symbols</td></tr>
      <tr><td>Lost data</td><td>Works on unreliable channels if packets carry sequence numbers (so the receiver knows where in the key stream to be)</td><td>A loss causes a delay of q steps, then decryption resumes automatically</td></tr>
    </tbody>
  </table></div>

  <h5>Generating key streams</h5>
  <ul>
    <li><strong>RC4:</strong> designed by Ron Rivest in 1987 for RSA Security; a trade secret until leaked in 1994; keys up to 2,048 bits; very simple algorithm. (Now considered broken and banned from TLS.)</li>
    <li><strong>Block cipher in counter (CTR) mode:</strong> the secret key is a pair (K, t), where t is a b-bit counter. The key stream is E<sub>K</sub>(t) ‖ E<sub>K</sub>(t+1) ‖ E<sub>K</sub>(t+2) ‖ … A shorter counter can be concatenated with a random value (a nonce). CTR is a synchronous stream cipher, and it can be parallelized.</li>
    <li><strong>ChaCha20:</strong> designed by Daniel J. Bernstein (2008). 256-bit (32-byte) key and 96-bit (12-byte) nonce. The nonce makes the same plaintext under the same key encrypt differently each time (the slide frames this as helping prevent replay; its core job is preventing key-stream reuse). No practical attacks on the full 20-round version. Often faster than AES on devices without AES hardware acceleration (phones), which is why TLS 1.3 offers it.</li>
  </ul>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: CTR mode</span>
    <div class="eq">C[i] = P[i] ⊕ E<sub>K</sub>(t + i)</div>
    <p><strong>Why it works:</strong> the block cipher acts as a pseudo-random generator; XOR is self-inverse, so decryption is the same operation. Only E<sub>K</sub> is ever used, never D<sub>K</sub>.</p>
    <p><strong>Common mistake:</strong> reusing the same (K, t) for two messages, which creates the repetition attack below.</p>
  </div>

  <h5>Attacks on stream ciphers</h5>
  <div class="box ex"><span class="lbl">Repetition attack (key-stream reuse)</span>
    <p>If the same key stream S encrypts two messages: C<sub>1</sub> = P<sub>1</sub> ⊕ S and C<sub>2</sub> = P<sub>2</sub> ⊕ S. The attacker XORs the ciphertexts: C<sub>1</sub> ⊕ C<sub>2</sub> = P<sub>1</sub> ⊕ S ⊕ P<sub>2</sub> ⊕ S = <strong>P<sub>1</sub> ⊕ P<sub>2</sub></strong>. The key cancels out. With the redundancy of English, two XORed plaintexts can often be separated, and if either plaintext is known, the other falls immediately: P<sub>2</sub> = (C<sub>1</sub> ⊕ C<sub>2</sub>) ⊕ P<sub>1</sub>.</p>
    <p><strong>Numeric check:</strong> P<sub>1</sub> = <code>1100</code>, P<sub>2</sub> = <code>1010</code>, S = <code>0111</code>. C<sub>1</sub> = <code>1011</code>, C<sub>2</sub> = <code>1101</code>. C<sub>1</sub> ⊕ C<sub>2</sub> = <code>0110</code> = P<sub>1</sub> ⊕ P<sub>2</sub> ✓. This is why the one-time pad must be used <em>once</em>.</p>
  </div>
  <div class="box ex"><span class="lbl">Insertion attack (Bayer and Metzger, 1976)</span>
    <p><strong>Setup:</strong> a message is retransmitted with one attacker-chosen byte X inserted, using the same key stream (for example an email re-sent with a new message number).</p>
    <p><strong>Diagram explained:</strong> the original row shows P[i], P[i+1], P[i+2], P[i+3] lined up with S[i], S[i+1], … and producing C[i], C[i+1], …. The retransmission row shows P[i], <strong>X</strong>, P[i+1], P[i+2] lined up with the <em>same</em> S[i], S[i+1], S[i+2], S[i+3]. Everything after the insertion is shifted one position relative to the key stream.</p>
    <p><strong>The cascade:</strong></p>
    <ol>
      <li>The attacker knows X, so from C′[i+1] = X ⊕ S[i+1] they get S[i+1].</li>
      <li>From the original, P[i+1] = C[i+1] ⊕ S[i+1]. Now they know P[i+1].</li>
      <li>From C′[i+2] = P[i+1] ⊕ S[i+2], they get S[i+2].</li>
      <li>Then P[i+2] = C[i+2] ⊕ S[i+2], and so on to the end of the message.</li>
    </ol>
    <p>One inserted byte unravels everything after it. Defense: never reuse a key stream.</p>
  </div>

  <h3 id="l03a-math">Number theory for public-key cryptography</h3>
  <h4>Big picture</h4>
  <p>RSA is built entirely from a handful of number facts: primes, GCDs, modular arithmetic, multiplicative inverses, and Euler's theorem. Learn these well and RSA becomes mechanical.</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: prime number</span>
    <dl>
      <dt>Plain English</dt><dd>A whole number bigger than 1 that only 1 and itself divide evenly.</dd>
      <dt>Technical</dt><dd>An integer p ≥ 2 whose only positive divisors are 1 and p. Examples: 2, 7, 19. Not primes: −3, 0, 1, 6.</dd>
      <dt>Why it matters</dt><dd>RSA keys are made from two large random primes.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: prime decomposition (Fundamental Theorem of Arithmetic)</span>
    <dl>
      <dt>Plain English</dt><dd>Every positive integer breaks into primes in exactly one way.</dd>
      <dt>Technical</dt><dd>n = p<sub>1</sub><sup>e<sub>1</sub></sup> × … × p<sub>k</sub><sup>e<sub>k</sub></sup>, and this decomposition is unique. Example: 200 = 2<sup>3</sup> × 5<sup>2</sup>.</dd>
      <dt>Why it matters</dt><dd>Multiplying primes is easy; recovering them from the product (factoring) is hard. RSA's security depends on that gap.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: greatest common divisor, relatively prime</span>
    <dl>
      <dt>Plain English</dt><dd>The GCD is the biggest number dividing both. Two numbers are relatively prime if that biggest number is 1.</dd>
      <dt>Technical</dt><dd>gcd(a, b) is the largest positive integer dividing both a and b (extended to any integers). a and b are relatively prime (coprime) if gcd(a, b) = 1. Examples: gcd(18, 30) = 6; gcd(−21, 49) = 7; gcd(0, 20) = 20; 15 and 28 are relatively prime.</dd>
      <dt>Why it matters</dt><dd>RSA's e must be relatively prime to φ(n), or it has no inverse d.</dd>
    </dl>
  </div>
  <div class="box def"><span class="lbl">Definition: modulo</span>
    <dl>
      <dt>Plain English</dt><dd>The remainder after division, always between 0 and n − 1.</dd>
      <dt>Technical</dt><dd>r = a mod n means a = r + kn for some integer k with 0 ≤ r &lt; n; equivalently r = a − ⌊a/n⌋·n.</dd>
      <dt>Why it matters</dt><dd>All RSA arithmetic happens "mod n," which keeps huge numbers bounded.</dd>
    </dl>
  </div>
  <div class="box ex"><span class="lbl">Worked examples: mod</span>
    <p>29 mod 13 = 3, because 29 = 3 + 2·13. 13 mod 13 = 0, because 13 = 0 + 1·13. −1 mod 13 = 12, because −1 = 12 + (−1)·13 (slide writes it as 12 = −1 + 1·13).</p>
    <p><strong>Trap:</strong> many calculators and programming languages give −1 for "−1 % 13". In math (and on the exam) the answer is always in 0…n−1, so add n: −1 + 13 = 12.</p>
  </div>

  <h4>Euclid's GCD algorithm</h4>
  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: Euclid's key identity</span>
    <div class="eq">gcd(a, b) = gcd(b, a mod b),&nbsp;&nbsp;gcd(a, 0) = a</div>
    <p><strong>Why it works:</strong> a mod b = a − qb. Any number dividing both a and b also divides a − qb, and vice versa, so the pairs (a, b) and (b, a mod b) have exactly the same common divisors. The numbers shrink every step until one is 0.</p>
    <p><strong>When it's used:</strong> checking gcd(e, φ(n)) = 1 in RSA setup, and (extended version) computing d.</p>
  </div>
<pre class="code"><code>Algorithm EuclidGCD(a, b)
  if b = 0: return a
  else:     return EuclidGCD(b, a mod b)</code></pre>
  <div class="box ex"><span class="lbl">Worked example: gcd(412, 260) (slide)</span>
    <div class="tw"><table style="max-width:560px">
      <thead><tr><th>a</th><th>b</th><th>a mod b</th></tr></thead>
      <tbody>
        <tr><td>412</td><td>260</td><td>152</td></tr><tr><td>260</td><td>152</td><td>108</td></tr><tr><td>152</td><td>108</td><td>44</td></tr><tr><td>108</td><td>44</td><td>20</td></tr><tr><td>44</td><td>20</td><td>4</td></tr><tr><td>20</td><td>4</td><td>0</td></tr><tr><td>4</td><td>0</td><td>return 4</td></tr>
      </tbody>
    </table></div>
    <p>Also: gcd(21, 12) = gcd(12, 9) = gcd(9, 3) = gcd(3, 0) = 3.</p>
  </div>
  <p><strong>Running time (the "Analysis" slide).</strong> Let a<sub>i</sub>, b<sub>i</sub> be the arguments of the i-th call. Then a<sub>i+2</sub> = b<sub>i+1</sub> = a<sub>i</sub> mod a<sub>i+1</sub>. Claim: a<sub>i+2</sub> ≤ ½a<sub>i</sub>. <em>Case 1:</em> if a<sub>i+1</sub> ≤ ½a<sub>i</sub>, then a<sub>i+2</sub> &lt; a<sub>i+1</sub> ≤ ½a<sub>i</sub>. <em>Case 2:</em> if a<sub>i+1</sub> &gt; ½a<sub>i</sub>, then a<sub>i</sub> mod a<sub>i+1</sub> = a<sub>i</sub> − a<sub>i+1</sub> &lt; ½a<sub>i</sub>. So the first argument at least halves every two calls, giving at most 1 + 2 log max(a, b) calls: <strong>O(log max(a, b))</strong> arithmetic operations (also expressible as O(log min(a, b))). For a 2048-bit number that is only a few thousand steps.</p>

  <h4>Multiplicative inverses</h4>
  <div class="box def"><span class="lbl">Definition: multiplicative inverse mod n</span>
    <dl>
      <dt>Plain English</dt><dd>The number you multiply by to get back to 1, in "remainder world."</dd>
      <dt>Technical</dt><dd>Z<sub>n</sub> = {0, 1, …, n−1} is the set of residues mod n. If xy mod n = 1, then y is the inverse of x, written y = x<sup>−1</sup>.</dd>
      <dt>Why it matters</dt><dd>RSA's private exponent d is the inverse of e mod φ(n).</dd>
    </dl>
  </div>
  <div class="tw"><table style="max-width:640px">
    <thead><tr><th>x (mod 11)</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr></thead>
    <tbody><tr><th>x<sup>−1</sup></th><td>—</td><td>1</td><td>6</td><td>4</td><td>3</td><td>9</td><td>2</td><td>8</td><td>7</td><td>5</td><td>10</td></tr></tbody>
  </table></div>
  <p>Check a few: 2·6 = 12 = 11 + 1 ✓; 5·9 = 45 = 44 + 1 ✓; 10·10 = 100 = 99 + 1 ✓.</p>
  <p><strong>Theorem:</strong> x has an inverse in Z<sub>n</sub> if and only if gcd(x, n) = 1. In Z<sub>10</sub>, only 1, 3, 7, 9 have inverses (1·1, 3·7 = 21, 7·3, 9·9 = 81, all ≡ 1 mod 10). <strong>Corollary:</strong> if p is prime, every nonzero residue mod p has an inverse. More examples: the inverse of 5 mod 14 is 3 (15 = 14 + 1); 2 has no inverse mod 14 (gcd = 2); 4x ≡ 1 (mod 7) means finding x, k with 4x = 7k + 1, so x = 2.</p>

  <h4>Powers, Fermat, and Euler</h4>
  <p><strong>Powers repeat.</strong> For prime p, the successive powers of each element of Z<sub>p</sub> cycle, and the cycle lengths divide p − 1. The slide's table for p = 7:</p>
  <div class="tw"><table style="max-width:480px">
    <thead><tr><th>x</th><th>x<sup>2</sup></th><th>x<sup>3</sup></th><th>x<sup>4</sup></th><th>x<sup>5</sup></th><th>x<sup>6</sup></th></tr></thead>
    <tbody>
      <tr><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr>
      <tr><td>2</td><td>4</td><td>1</td><td>2</td><td>4</td><td>1</td></tr>
      <tr><td>3</td><td>2</td><td>6</td><td>4</td><td>5</td><td>1</td></tr>
      <tr><td>4</td><td>2</td><td>1</td><td>4</td><td>2</td><td>1</td></tr>
      <tr><td>5</td><td>4</td><td>6</td><td>2</td><td>3</td><td>1</td></tr>
      <tr><td>6</td><td>1</td><td>6</td><td>1</td><td>6</td><td>1</td></tr>
    </tbody>
  </table></div>
  <p>What to notice: the last column is all 1s (Fermat's little theorem). Cycle lengths are 1, 3, 6, 3, 6, 2, all divisors of 6. Elements with cycle length 6 (here 3 and 5) generate every nonzero residue; they are called generators.</p>

  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: Fermat's little theorem</span>
    <div class="eq">x<sup>p−1</sup> mod p = 1&nbsp;&nbsp;&nbsp;(p prime, x ≠ 0 mod p)</div>
    <p><strong>Example (p = 5):</strong> 1<sup>4</sup> = 1; 2<sup>4</sup> = 16 = 15 + 1; 3<sup>4</sup> = 81 = 80 + 1; 4<sup>4</sup> = 256 = 255 + 1. All ≡ 1.</p>
    <p><strong>Corollary:</strong> the inverse of x mod p is x<sup>p−2</sup> mod p. Proof: x · x<sup>p−2</sup> = x<sup>p−1</sup> ≡ 1. Example: inverse of 3 mod 7 is 3<sup>5</sup> mod 7 = 243 mod 7 = 5, and 3·5 = 15 ≡ 1 ✓ (matches the table above: 3<sup>5</sup> = 5).</p>
    <p><strong>Uses:</strong> primality testing, computing inverses mod a prime.</p>
  </div>

  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: Euler's totient and Euler's theorem</span>
    <div class="eq">x<sup>φ(n)</sup> mod n = 1&nbsp;&nbsp;&nbsp;for every x in Z<sub>n</sub>*</div>
    <p><strong>Variables:</strong> Z<sub>n</sub>* = the elements of Z<sub>n</sub> relatively prime to n (the multiplicative group). φ(n) = the totient = |Z<sub>n</sub>*|, the count of those elements.</p>
    <p><strong>Key values:</strong> Z<sub>10</sub>* = {1, 3, 7, 9}, so φ(10) = 4. For prime p, φ(p) = p − 1 (so Euler's theorem generalizes Fermat's). For n = pq with distinct primes, <strong>φ(n) = (p − 1)(q − 1)</strong>, the formula RSA uses.</p>
    <p><strong>Example (n = 10):</strong> 3<sup>4</sup> = 81 ≡ 1; 7<sup>4</sup> = 2401 ≡ 1; 9<sup>4</sup> = 6561 ≡ 1 (mod 10).</p>
    <p><strong>Why φ(pq) = (p−1)(q−1):</strong> of the pq numbers 0…pq−1, the ones sharing a factor with pq are the q multiples of p and the p multiples of q, with 0 counted twice: pq − p − q + 1 = (p−1)(q−1).</p>
    <p><strong>Common mistake:</strong> using φ(n) = n − 1 for composite n. That only holds for primes.</p>
  </div>

  <h3 id="l03a-rsa">RSA</h3>
  <h4>Big picture</h4>
  <p>RSA (Rivest, Shamir, Adleman, MIT, 1977) is the best-known and most widely used public-key scheme. Its idea: multiplying primes is easy, but factoring their product seems infeasible. Modular exponentiation takes O((log n)<sup>3</sup>) bit operations (easy), while the best known factoring algorithms grow far faster than any polynomial in the number of digits (hard). Keys are large, e.g., 1024–2048 bits.</p>

  <h4>Definitions</h4>
  <div class="box def"><span class="lbl">Definition: RSA key pair</span>
    <dl>
      <dt>Plain English</dt><dd>A public pair (e, n) anyone can use to lock, and a private number d only the owner can use to unlock.</dd>
      <dt>Technical</dt><dd>n = pq for large random primes p, q; e with 1 &lt; e &lt; φ(n) and gcd(e, φ(n)) = 1; d with ed mod φ(n) = 1. Public key PK = {e, n}; private key SK = {d, p, q} (p and q are kept secret too, and speed up decryption).</dd>
      <dt>Why it matters</dt><dd>Anyone who learns p and q can compute φ(n) and then d. That is why factoring n breaks RSA.</dd>
    </dl>
  </div>

  <div class="formula"><span class="lbl" style="font-family:var(--cond);font-weight:700;color:var(--brass)">Formula: RSA</span>
    <div class="eq">n = pq&nbsp;&nbsp;&nbsp;φ(n) = (p−1)(q−1)&nbsp;&nbsp;&nbsp;ed ≡ 1 (mod φ(n))<br>C = M<sup>e</sup> mod n&nbsp;&nbsp;&nbsp;&nbsp;M = C<sup>d</sup> mod n</div>
    <p><strong>Variables:</strong> p, q = secret primes; n = modulus (public); φ(n) = totient (secret); e = public (encryption) exponent; d = private (decryption) exponent; M = plaintext as a number with <strong>0 ≤ M &lt; n</strong>; C = ciphertext.</p>
    <p><strong>Why it works:</strong> see the correctness proof below. In one line: M<sup>ed</sup> = M<sup>kφ(n)+1</sup> = (M<sup>φ(n)</sup>)<sup>k</sup>·M ≡ 1<sup>k</sup>·M = M.</p>
    <p><strong>When it's used:</strong> encrypting small secrets (like a session key) and digital signatures. Not bulk data.</p>
    <p><strong>Common mistakes:</strong> computing d mod n instead of mod φ(n); choosing e that shares a factor with φ(n); encrypting M ≥ n (the message must be smaller than the modulus, so split it into blocks if needed).</p>
  </div>

  <div class="box proc"><span class="lbl">Process: RSA key setup, encryption, and decryption</span>
    <ol>
      <li><strong>Pick primes.</strong> Choose two large random primes p and q (test candidates with a primality test).</li>
