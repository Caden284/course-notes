<p>When user code runs, the mode bit is set to <strong>user</strong>; when kernel code runs, it is set to <strong>kernel</strong>. A program cannot simply flip the bit to kernel itself — that would defeat the whole scheme. Instead, a <strong>system call</strong> switches the mode to kernel, and the return from the call resets it to user. Instructions marked <strong>privileged</strong> only execute in kernel mode.</p>
<p>But what if a user program never gives control back — an infinite loop, or a process hogging resources? The <strong>timer</strong> prevents this. The OS sets a counter (via a privileged instruction); the physical clock decrements it; when it hits zero it raises an interrupt. By setting the timer <em>before</em> scheduling a process, the OS guarantees it can regain control or terminate a program that overruns its time slice.</p>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>“A program can switch itself to kernel mode whenever it wants.”</strong> No. The only legitimate route into kernel mode is a <strong>system call</strong> (or a trap/interrupt), which the OS controls; the mode bit resets to user on return. That gate is precisely what keeps user code from running privileged instructions.</p></div>
<h3 id="s1-12"><span class="secnum">1.12</span> Core OS Responsibilities (Roadmap of the Course)</h3>
<p>The chapter closes by previewing the OS's major management duties — each becomes a later topic.</p>
<h4>Process management</h4>
<p>A <strong>single-threaded</strong> process has one program counter and executes instructions sequentially to completion; a <strong>multi-threaded</strong> process has one program counter <em>per thread</em>. A system typically runs many processes concurrently (some user, some OS) by <strong>multiplexing the CPU</strong> among them. OS duties include creating/deleting processes, suspending/resuming them, and providing mechanisms for synchronization, communication, and deadlock handling.</p>
<h4>Memory management</h4>
<p>To execute, a program's instructions and needed data must be in memory. Memory management decides what is in memory and when, to optimize CPU utilization and responsiveness. Duties: track which parts of memory are used and by whom; decide what to move in/out; allocate and deallocate space; and protect memory from unauthorized access.</p>
<h4>File-system management</h4>
<p>The OS gives a uniform logical view of storage by abstracting physical media into <strong>files</strong>. Each medium (HDD, SSD) has its own properties — capacity, transfer rate, and access method (sequential or random). Files are organized into <strong>directories</strong>, with access controls (file permissions; <code>chmod</code> on Linux) deciding who can access what. The OS creates/deletes files and directories, maps files onto secondary storage via a filesystem format (FAT32, NTFS, ext4, ZFS), and backs them up to stable storage. Under RAID, one file need not live entirely on one device.</p>
<h4>I/O subsystem</h4>
<p>One job of the OS is to hide each device's peculiarities from the user. The I/O subsystem manages device memory through three techniques you should be able to name and distinguish:</p>
<ul><li><strong>Buffering</strong> — temporarily storing data while it is being transferred.</li><li><strong>Caching</strong> — storing parts of data in faster storage for performance.</li><li><strong>Spooling</strong> — overlapping the output of one job with the input of others (classic example: print spooling).</li></ul>
<p>Only the <strong>device driver</strong> knows a specific device's quirks; generic standards (like USB) handle simple peripherals, while complex hardware (GPUs, network cards, printers) needs vendor-specific drivers.</p>
<h4>Virtualization</h4>
<div class="box def"><span class="lbl">Definition: Virtualization</span><dl><dt>Plain English</dt><dd>Splitting one physical computer into several independent “virtual” computers, each able to run its own OS.</dd><dt>Technical</dt><dd>Abstracting the hardware of a single computer into several different execution environments, allowing operating systems to run as applications within other native OSes; the foundation of cloud computing.</dd><dt>Why it matters</dt><dd>It underlies the entire cloud industry: one physical server can host many isolated virtual machines for different customers.</dd></dl></div>
<p>Distinguish three related ideas: <strong>Emulation</strong> simulates hardware in software and is used when the host CPU type differs from the target (e.g., Apple's x86→ARM migration) — generally the slowest. <strong>Interpretation</strong> runs a language not compiled to native CPU code. <strong>Virtualization</strong> runs guest OSes that are themselves natively compiled for the host CPU; a <strong>Virtual Machine Manager (VMM)</strong> provides the virtualization services (e.g., VMware running Linux guests on a Linux host).</p>
<div class="box proc"><span class="lbl">Chapter 1 in one breath</span><p>An OS is the abstraction layer between hardware and applications. It virtualizes the machine into <strong>processes</strong>, is <strong>interrupt-driven</strong>, uses <strong>dual-mode operation + a timer</strong> for protection, keeps the CPU busy via <strong>multiprogramming/multitasking</strong>, exploits a <strong>storage hierarchy</strong> with caching, and manages processes, memory, files, I/O, and virtualization.</p></div>
</section>
<section class="lecture prose" id="ch2">
<div class="plate"><span class="num" aria-hidden="true">02</span><p class="ttl">Operating System Structures</p><p class="src">Chapter 2</p></div>
<h3 id="s2-1"><span class="secnum">2.1</span> Big Picture</h3>
<p>Chapter 1 asked <em>what</em> an OS is. Chapter 2 asks <em>how</em> it is built and <em>how programs reach its services</em>. Two threads run through it: the menu of <strong>services</strong> the OS offers, and the <strong>system-call</strong> mechanism that lets your code request those services. It ends with the major ways OS code can be <strong>structured</strong> (monolithic, layered, microkernel, modular, hybrid).</p>
<h3 id="s2-2"><span class="secnum">2.2</span> Operating System Services</h3>
<p>An OS provides an environment for executing programs and a set of services for users and for other programs. The slides group the services; you should be able to list and briefly explain each.</p>
<div class="tw"><table><thead><tr><th>Service</th><th>What it provides</th></tr></thead><tbody><tr><td>User interface</td><td>Almost every OS has one (CLI, GUI, or touch).</td></tr><tr><td>Program execution</td><td>Load a program into memory, run it, and terminate it (normally or abnormally).</td></tr><tr><td>I/O operations</td><td>Let a running program access files or I/O devices.</td></tr><tr><td>File-system manipulation</td><td>Read/write/create/delete/search files &amp; directories; set permissions.</td></tr><tr><td>Communications</td><td>Let processes exchange information within one system or across a network.</td></tr><tr><td>Error detection</td><td>Constantly watch for errors in CPU/memory, I/O devices, and user programs, and respond appropriately.</td></tr><tr><td>Resource allocation</td><td>Allocate and coordinate CPU, memory, storage, and I/O among concurrent jobs/users.</td></tr><tr><td>Logging</td><td>Track who used how much of which resources.</td></tr><tr><td>Protection &amp; security</td><td>Control access to resources; authenticate users; defend against outsiders.</td></tr></tbody></table></div>
<p><strong>Protection vs. security — keep them distinct.</strong> Protection means ensuring all access to system resources is <em>controlled</em> (internal: stopping concurrent processes from interfering with one another). Security means defending the system from <em>outsiders</em>, which requires user authentication and defending external I/O devices (e.g., network adapters) from invalid access.</p>
<p>On errors: hardware errors include memory errors or power failure; I/O errors include a network connection failure or a printer out of paper; user-program errors include arithmetic overflow or an attempt to access an illegal memory location. Good <strong>debugging</strong> support greatly enhances a programmer's ability to use the system.</p>
<h3 id="s2-3"><span class="secnum">2.3</span> Kernel Data Structures</h3>
<p>The kernel uses the same data structures you learned in your data-structures course — arrays, lists, stacks, queues, trees, hash maps, and bitmaps. A few specifics the lecture highlighted:</p>
<ul><li><strong>Binary Search Tree (BST)</strong>: left ≤ right ordering. An unbalanced BST searches in <code>O(n)</code>; a <strong>balanced</strong> BST searches in <code>O(log n)</code>.</li><li><strong>Hash map</strong>: a hash function maps keys to slots (e.g., <code>hash_value = key % 10</code>), giving fast key→value lookup such as username→password. A <strong>hash collision</strong> is when two distinct inputs produce the same output slot.</li><li><strong>Bitmap</strong>: a string of <em>n</em> binary digits representing the status of <em>n</em> items (used heavily to track free/used blocks).</li></ul>
<p>In Linux these live in C headers such as <code>&lt;linux/list.h&gt;</code>, <code>&lt;linux/kfifo.h&gt;</code>, and <code>&lt;linux/rbtree.h&gt;</code>.</p>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Likely gotcha:</strong> “Search performance of a BST?” The <em>general</em> BST is <code>O(n)</code> (it can degenerate into a linked list); a <strong>balanced</strong> BST is <code>O(log n)</code>. Do not write <code>O(log n)</code> for a plain BST.</p></div>
<h3 id="s2-4"><span class="secnum">2.4</span> The User Interface: Command-Line Interfaces</h3>
<p>A <strong>CLI</strong> lets a user type commands directly. It may be built into the kernel or — more flexibly — implemented as a separate system program. Unix-like systems have several <strong>shells</strong>: the C Shell, the Bourne-Again Shell (<code>bash</code>), and the Korn Shell.</p>
<p>A shell's job is to interpret commands and execute them. Some commands are <strong>built-in</strong> (part of the shell itself); others are simply the <strong>names of programs/utilities</strong> on disk. The second design is powerful: to add a new command you just add a new program — no need to modify the shell. Commands are maintained as ordinary system programs.</p>
<h3 id="s2-5"><span class="secnum">2.5</span> System Calls — The Door into the Kernel</h3>
<div class="box def"><span class="lbl">Definition: System Call</span><dl><dt>Plain English</dt><dd>The official request a program makes to ask the OS to do something it is not allowed to do itself.</dd><dt>Technical</dt><dd>A programming interface to the services provided by the OS, typically written in a high-level language (C/C++) and accessed by programmers through a high-level API rather than directly.</dd><dt>Why it matters</dt><dd>System calls are the controlled gateway between user mode and kernel mode. Every file you open, process you fork, or byte you send over the network ultimately goes through one.</dd></dl></div>
<p>You almost never invoke a system call directly. You call a friendly <strong>API</strong> (Application Programming Interface) function, and <em>it</em> invokes the real system call on your behalf. The three most common APIs:</p>
<ul><li><strong>Win32 API</strong> — for Windows.</li><li><strong>POSIX API</strong> — for POSIX-based systems: virtually all UNIX, Linux, and macOS (BSD).</li><li><strong>Java API</strong> — for the Java Virtual Machine (JVM).</li></ul>
<p>On UNIX/Linux, the C library that provides the API is <code>libc</code>. Example of the layering: the Windows function <code>CreateProcess()</code> actually invokes the <code>NTCreateProcess()</code> system call inside the Windows kernel. The system-call names used in this course are generic/POSIX-style; each real OS has its own names.</p>
<h4>How a system call is implemented</h4>
<ol><li>Each system call has a <strong>number</strong>.</li><li>The <strong>system-call interface</strong> keeps a table indexed by those numbers.</li><li>It invokes the matching system call in the kernel and returns the status and any return values.</li></ol>
<p>The beauty: the <strong>caller knows nothing about the implementation</strong>. A programmer only has to obey the API and understand what the OS will do as a result. The <strong>Runtime Environment (RTE)</strong> — compilers, interpreters, libraries, loaders — provides the system-call interface that links the API to actual system calls; it intercepts API function calls and invokes the necessary kernel calls.</p>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>“You must know how a system call works internally to use it.”</strong> Exactly backwards. The whole design hides the implementation; you only obey the API. The OS defines the convention, the compiler follows it, and the application stays blissfully unaware.</p></div>
<h4>Passing parameters to the OS</h4>
<p>A system call often needs more than just its number — it needs parameters. There are three standard methods:</p>
<div class="tw"><table><thead><tr><th>Method</th><th>How it works</th><th>Note</th></tr></thead><tbody><tr><td>Registers</td><td>Pass parameters directly in CPU registers.</td><td>Simplest; limited by register count.</td></tr><tr><td>Memory block / table</td><td>Store parameters in memory; pass the block's address in a register.</td><td>Used by Linux; no limit on count/length.</td></tr><tr><td>Process stack</td><td>Program pushes parameters onto the stack; OS pops them off.</td><td>No limit on count/length.</td></tr></tbody></table></div>
<p>The method is <strong>fixed by the OS and architecture</strong> (the calling convention). The OS defines it, the compiler adheres to it for all programs, and users are kept unaware of the details. The block and stack methods are favored when parameters are numerous or large because they do not limit the number or length of parameters.</p>
<h4>fork() + exec(): starting a new program</h4>
<p>A recurring pattern (you will see it again in Chapters 3 and 4): to launch a brand-new program you use <strong>fork() followed by exec()</strong>.</p>
<ul><li><code>fork()</code> clones the currently executing process, producing a near-identical child.</li><li><code>exec()</code> overlays a different executable on top of the calling process, replacing its code.</li></ul>
<pre class="code"><code>#include &lt;stdio.h&gt;
#include &lt;sys/types.h&gt;
#include &lt;unistd.h&gt;
int main() {
    pid_t pid = fork();              // clone this process
    if (pid &lt; 0) {                   // fork failed
        perror("Fork Failed\n");
        exit(1);
    } else if (pid == 0) {           // child branch
        printf("I am process %d, about to exec ls -l\n", getpid());
        execl("/bin/ls", "ls", "-l", NULL);  // replace child with ls
        printf("This line should never be executed\n");
    }
    return 0;
}</code></pre>
<p>The <code>printf</code> after <code>execl</code> never runs: if <code>execl</code> succeeds, the child's code is entirely replaced by <code>ls</code>, so there is no “original” code left to return to.</p>
<h3 id="s2-6"><span class="secnum">2.6</span> System Programs and Background Services</h3>
<p>Most users' view of “the OS” is actually shaped by <strong>system programs</strong> (also called system utilities), not by raw system calls. They provide a convenient environment for development and execution, in categories: file manipulation, status information, programming-language support, program loading/execution, communications, background services, and application programs.</p>
<div class="box def"><span class="lbl">Definition: Background Service (daemon)</span><dl><dt>Plain English</dt><dd>A program that runs quietly in the background, usually started at boot, handling ongoing system chores.</dd><dt>Technical</dt><dd>System programs launched at boot time — known as services, subsystems, or daemons — that provide facilities like disk checking, process scheduling, error logging, and printing, and that run in user mode (not kernel mode).</dd><dt>Why it matters</dt><dd>Daemons are how the system performs continuous behind-the-scenes work (web servers and databases often run as daemons) without a user actively driving them.</dd></dl></div>
<p>Some services are <strong>“oneshot”</strong>: launched only for startup, then they terminate. These facilitate booting — setting kernel variables, mounting drives, loading drivers — and then exit. <strong>Key exam point:</strong> daemons run in <strong>user mode, not kernel mode</strong>.</p>
<h3 id="s2-7"><span class="secnum">2.7</span> Linkers and Loaders</h3>
<p>How does source code become a running program? Through compiling, linking, and loading. Get the vocabulary and order right.</p>
<div class="box def"><span class="lbl">Definition: Linker</span><dl><dt>Plain English</dt><dd>The tool that stitches your compiled code together with library code into one runnable program.</dd><dt>Technical</dt><dd>A program that combines relocatable object files (and external libraries) into a single binary executable file.</dd><dt>Why it matters</dt><dd>Without the linker, your code could not use printf, math routines, or any library — they live in separate object files that must be joined to yours.</dd></dl></div>
<div class="box def"><span class="lbl">Definition: Loader</span><dl><dt>Plain English</dt><dd>The tool that copies an executable from disk into memory and gets it ready to run.</dd><dt>Technical</dt><dd>A program that brings a binary executable into memory so it can execute, performing relocation: assigning final addresses to program parts and adjusting code and data to match.</dd><dt>Why it matters</dt><dd>A program living on disk does nothing; the loader is what actually places it in memory to become a process.</dd></dl></div>
<p>The pipeline: reusable source (like a library) is compiled into <strong>relocatable object files</strong> — designed to be loaded at <em>any</em> physical memory location. The <strong>linker</strong> combines object files into one executable on secondary storage. To run, the <strong>loader</strong> brings it into memory and relocates it.</p>
<p>Modern systems usually do <em>not</em> link libraries directly into executables. In Windows, <strong>dynamically linked libraries (DLLs)</strong> are loaded as needed and shared by all programs using the same version — loaded only once. This shrinks program sizes because the library routines are stored separately. The linker inserts <strong>relocation information</strong> so a library (e.g., the math library) can be dynamically linked and loaded at runtime rather than baked into the executable. Object and executable files use standard formats so each OS knows how to load and start them.</p>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>The shell pipeline you already use:</strong> when you run <code>gcc -o pun pun.c</code>, the compiler turns <code>pun.c</code> into object code, the linker joins it with the standard I/O library's object code, and the result is the executable <code>pun</code>. Later, typing <code>./pun</code> invokes the loader, which places it in memory as a process.</p></div>
<h3 id="s2-8"><span class="secnum">2.8</span> Why Are Applications Operating-System Specific?</h3>
<p>A program compiled for Windows usually will not run on Linux. Why? Because it was built against a specific OS's system calls, binary format, and <strong>ABI</strong>. The slides list the ways apps can become <em>non</em>-OS-specific (i.e., cross-platform):</p>
<ul><li><strong>Interpreted languages</strong> (Python, Perl, Ruby): a bespoke interpreter is written for each OS, so the same script runs everywhere the interpreter does.</li><li><strong>Virtual-machine languages</strong> (Java on the JVM): the program runs on a VM that itself runs on each host OS.</li><li><strong>Recompiling a standard language</strong> (like C): compile separately on each OS. Broader compatibility is possible but may require modifying the libraries used.</li></ul>
<div class="box def"><span class="lbl">Definition: Application Binary Interface (ABI)</span><dl><dt>Plain English</dt><dd>The architecture-level rulebook for how compiled machine code talks to the OS and hardware.</dd><dt>Technical</dt><dd>The binary-level counterpart of an API; it defines how components of binary code interface with a given OS on a given CPU architecture (calling conventions, data layout, etc.).</dd><dt>Why it matters</dt><dd>An API is source-level (how you write code); an ABI is binary-level (how the compiled bytes interoperate). Mismatched ABIs are a core reason a binary built for one platform fails on another.</dd></dl></div>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>API vs. ABI.</strong> API = <em>source</em>-level interface for programmers. ABI = <em>binary</em>-level interface for compiled code on a specific OS+CPU. “The ABI is the architecture equivalent of an API” is the exact phrasing to remember.</p></div>
<h3 id="s2-9"><span class="secnum">2.9</span> Operating-System Structure</h3>
<p>A general-purpose OS is an enormous program, and there are several ways to organize its internal structure. Know all five, with an example of each.</p>
<h4>Monolithic</h4>
<p>The original UNIX (and MS-DOS) were <strong>monolithic</strong>: an “all-in-one” kernel containing everything below the system-call interface and above the hardware — file system, CPU scheduling, memory management, and every other OS function in one big program. Monolithic kernels are <strong>hard to implement and extend</strong>, but they have <strong>very little overhead</strong> in the system-call interface, and communication within the kernel is <strong>fast</strong>. On Linux, <code>glibc</code> (the GNU C Library) provides the interface between C programs and the kernel.</p>
<h4>Layered</h4>
<div class="box def"><span class="lbl">Definition: Layered Approach</span><dl><dt>Plain English</dt><dd>Build the OS as a stack of layers, each only using the layer directly beneath it.</dd><dt>Technical</dt><dd>An OS structure divided into layers (levels): layer 0 is the hardware and the highest layer is the user interface; each layer uses only the functions and services of lower layers.</dd><dt>Why it matters</dt><dd>Layering is the textbook illustration of modular design and clean abstraction; it shows up in security and networking too.</dd></dl></div>
<p>In theory layering <strong>simplifies construction and debugging</strong> because each layer worries only about its own data and operations. In practice it is hard: deciding <em>how many</em> layers and <em>what goes in each</em> is difficult, and it is <strong>slow</strong> — a user request must cross multiple layers, each handing off to the next, to reach an OS service.</p>
<h4>Microkernel</h4>
<div class="box def"><span class="lbl">Definition: Microkernel</span><dl><dt>Plain English</dt><dd>Keep the kernel tiny by pushing as much OS functionality as possible out into ordinary user-space programs that talk via messages.</dd><dt>Technical</dt><dd>A structure that moves as much functionality as possible from kernel space into user space, with communication between user-space modules done through message passing; Mach is the classic example.</dd><dt>Why it matters</dt><dd>Microkernels trade performance for reliability and security: less code in kernel mode means fewer ways to crash or compromise the whole system.</dd></dl></div>
<p>Microkernel benefits and the downside, as the slides frame them:</p>
<ul><li><strong>Benefits</strong>: easier to extend; easier to port to new architectures; more reliable; more secure (less code runs in kernel mode).</li><li><strong>Downside</strong>: performance overhead. Module-to-module communication must go Module A → kernel → Module B via message passing, and the OS switches between processes to exchange messages — slower than in-kernel communication.</li></ul>
<p>macOS's kernel, <strong>Darwin</strong>, is partly based on the Mach microkernel. In a microkernel, client programs and services <em>never interact directly</em> — the microkernel facilitates all communication between them.</p>
<h4>Modules (Loadable Kernel Modules)</h4>
<p>Many modern OSes use <strong>loadable kernel modules (LKMs)</strong>: a core kernel plus additional services linked in as modules, loaded at boot or at runtime (Linux, macOS, Solaris, Windows). Each module talks to others through known interfaces. It is <em>like</em> a layered-microkernel approach but more flexible — any module can call any other <strong>without message passing</strong>.</p>
<h4>Hybrid</h4>
<p>Real operating systems are <strong>not</strong> one pure model — they combine approaches for performance, security, and usability:</p>
<ul><li><strong>Linux and Solaris</strong> are monolithic (kernel in one address space) but allow modular, dynamic loading of functionality.</li><li><strong>Windows</strong> is mostly monolithic but also contains microkernel pieces for different subsystem “personalities” (e.g., the Windows Subsystem for Linux).</li><li><strong>macOS</strong> is a hybrid, layered OS: the Aqua UI + Cocoa environment provide the API; below that sits <strong>Darwin</strong>, a kernel combining the <strong>Mach microkernel</strong> and <strong>BSD UNIX</strong> parts, plus an I/O kit and dynamically loadable kernel extensions (kexts).</li></ul>
<p>macOS/iOS structure, top to bottom: the <strong>User Experience</strong> layer (how users interact), the <strong>Application Framework</strong> layer (Cocoa / Cocoa Touch APIs for Objective-C and Swift), the <strong>Core Frameworks</strong> (graphics and media), and the <strong>Kernel Environment (Darwin)</strong>. Darwin exposes two system-call interfaces: Mach system calls (“traps”) and BSD system calls (POSIX functionality), and provides core services — memory management, CPU scheduling, and inter-process communication (IPC).</p>
<div class="tw"><table><thead><tr><th>Structure</th><th>Idea</th><th>Example</th></tr></thead><tbody><tr><td>Monolithic</td><td>Everything in one big kernel.</td><td>Original UNIX, MS-DOS</td></tr><tr><td>Layered</td><td>Stack of layers, each using only lower ones.</td><td>Abstraction-based designs</td></tr><tr><td>Microkernel</td><td>Tiny kernel; services in user space via messages.</td><td>Mach</td></tr><tr><td>Modular (LKM)</td><td>Core kernel + dynamically loadable modules.</td><td>Linux, Windows, macOS, Solaris</td></tr><tr><td>Hybrid</td><td>Combination of the above.</td><td>Linux, Windows, macOS</td></tr></tbody></table></div>
<div class="box proc"><span class="lbl">Chapter 2 in one breath</span><p>The OS offers <strong>services</strong>; programs reach them through <strong>system calls</strong> wrapped in <strong>APIs</strong>; <strong>linkers/loaders</strong> turn source into a running process; apps are OS-specific because of system calls and the <strong>ABI</strong>; and the kernel can be structured as <strong>monolithic, layered, microkernel, modular, or hybrid</strong>.</p></div>
</section>
<section class="lecture prose" id="ch3">
<div class="plate"><span class="num" aria-hidden="true">03</span><p class="ttl">C Review</p><p class="src">Chapter 3</p></div>
<h3 id="s3-1"><span class="secnum">3.1</span> Big Picture: Why C, Why Now</h3>
<p>Operating systems are written in C, and your programming assignments run on the GSU <strong>Snowball</strong> server and are graded there. C gives you direct control over memory and a thin layer over the hardware — exactly what an OS needs. This chapter is your toolkit for every later chapter: <strong>fork/exec, pipes, shared memory, and Pthreads</strong> are all C. If pointers and dynamic memory feel shaky, the process and thread chapters will too — so invest here.</p>
<p>If you know Java, much of C's syntax will feel familiar; the big differences are <strong>manual memory management</strong>, <strong>pointers</strong>, <strong>no classes (only structs)</strong>, and <strong>no garbage collector</strong>.</p>
<h3 id="s3-2"><span class="secnum">3.2</span> Anatomy of a C Program and the Build Pipeline</h3>
<pre class="code"><code>#include &lt;stdio.h&gt;                 // preprocessor directive: import I/O library
/* My first C program prints a pun */
int main(void) {                   // main returns an int, takes no args
    printf("To C, or not to C: that is the question.\n");
    return 0;                      // 0 means "finished without errors"
}</code></pre>
<p>Stored as <code>pun.c</code> — the filename does not matter, but the <code>.c</code> extension usually does. Notice there is <strong>no class or module name</strong> wrapping <code>printf</code>: C functions are free-standing. <code>return 0</code> from <code>main</code> reports success to the OS.</p>
<h4>Three build steps</h4>
<ol><li><strong>Pre-processing</strong>: the pre-processor handles every line that begins with <code>#</code> (called <strong>directives</strong>).</li><li><strong>Compiling</strong>: the compiler translates your code into machine instructions (<strong>object code</strong>).</li><li><strong>Linking</strong>: the linker combines your object code with library code (e.g., <code>stdio</code>) into a complete executable.</li></ol>
<p>The pre-processor is usually integrated with the compiler. In large projects, object code is <strong>cached</strong> — only changed <code>.c</code> files are recompiled. Compile with <code>gcc</code> (the GNU Compiler Collection — the one to use on Snowball):</p>
<pre class="code"><code>cc pun.c            # produces a.out by default
cc -o pun pun.c     # -o names the executable 'pun'
gcc -o pun pun.c    # gcc works the same way; use this on Snowball</code></pre>
<h4>Directives and macros</h4>
<p>Directives begin with <code>#</code>, are one line long by default, and have <strong>no semicolon</strong> at the end. The <code>&lt; &gt;</code> around a header name (e.g., <code>#include &lt;stdio.h&gt;</code>) mark it as a <strong>standard library</strong> header rather than a programmer-defined one. Directives can also define <strong>macros</strong>:</p>
<div class="box def"><span class="lbl">Definition: Macro</span><dl><dt>Plain English</dt><dd>A named snippet of code that the pre-processor pastes in wherever the name appears, before compilation.</dd><dt>Technical</dt><dd>A fragment of code given a name via #define; the preprocessor textually substitutes the macro's contents at each occurrence of the name. An object-like macro is a plain identifier replaced by a code fragment, commonly used to name numeric constants.</dd><dt>Why it matters</dt><dd>Macros give symbolic names to magic numbers (e.g., array sizes), making code readable and easy to change in one place.</dd></dl></div>
<pre class="code"><code>#define ARRAY_SIZE 1024     // object-like macro for a constant
#define N 100</code></pre>
<h3 id="s3-3"><span class="secnum">3.3</span> Basic Data Types and Sizes</h3>
<p>C's integer sizes can vary by platform (32-bit vs 64-bit), which matters for OS code. Note especially that <code>long</code> is <strong>4 bytes on 32-bit but 8 bytes on 64-bit</strong> — a classic source of portability bugs.</p>
<div class="tw"><table><thead><tr><th>Type</th><th>Bytes (32-bit)</th><th>Bytes (64-bit)</th><th>Approx. range</th></tr></thead><tbody><tr><td>char</td><td>1</td><td>1</td><td>-128 … 127</td></tr><tr><td>short</td><td>2</td><td>2</td><td>-32,768 … 32,767</td></tr><tr><td>int</td><td>4</td><td>4</td><td>-2.15B … 2.15B</td></tr><tr><td>long</td><td>4</td><td>8</td><td>(grows on 64-bit)</td></tr><tr><td>long long</td><td>8</td><td>8</td><td>-2^63 … 2^63 - 1</td></tr><tr><td>float</td><td>4</td><td>4</td><td>3.4e-38 … 3.4e38</td></tr><tr><td>double</td><td>8</td><td>8</td><td>1.7e-308 … 1.7e308</td></tr></tbody></table></div>
<p>Check any type's or variable's size with the <code>sizeof</code> operator: <code>sizeof(int)</code>, <code>sizeof(x)</code>. Integers can be <strong>signed</strong> (default) or <strong>unsigned</strong> (non-negative only, doubling the positive range): an <code>unsigned int</code> spans 0 … ~4.29 billion. <strong>float and double have no unsigned variants</strong>; there is a <code>long double</code> (16 bytes) for extended precision.</p>
<h4>Truthiness — C has no real boolean (until C99)</h4>
<p>Classic C has no Boolean type (C99 adds <code>_Bool</code>). Three ways to fake true/false:</p>
<ul><li>Use integers: <code>0</code> is false, <strong>anything non-zero</strong> is true.</li><li>Use an enum: <code>enum { false = 0, true = 1 };</code></li><li>Use directives: <code>#define true 1</code> and <code>#define false 0</code>.</li></ul>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Sizeof and unsigned traps.</strong> Expect a question on <code>long</code>'s size difference (4 vs 8 bytes) and on the fact that <strong>0 is false and any non-zero value is true</strong> in C. Also: <code>float/double</code> cannot be unsigned.</p></div>
<h3 id="s3-4"><span class="secnum">3.4</span> Variables, Constants, and Basic I/O</h3>
<p>Variables must be <strong>declared before use</strong> (like Java). <strong>Critical C-only hazard: uninitialized variables are NOT set to 0.</strong> They contain whatever “junk” was already in that memory. Reading an uninitialized variable yields unpredictable garbage.</p>
<pre class="code"><code>int height, length = 12, width = 10;   // declare; length &amp; width initialized
float profit = 2150.48f;               // 'f' suffix marks a float literal
int volume = height * length * width;  // height is UNINITIALIZED -&gt; garbage!</code></pre>
<p>Character constants use single quotes (<code>'A'</code>); string literals use double quotes (<code>"text"</code>). Escape sequences: <code>\n</code> newline, <code>\t</code> tab, <code>\\</code> backslash, <code>\"</code> double quote.</p>
<p>Input/output use <code>scanf()</code> and <code>printf()</code>. Both take a <strong>format string</strong> first, containing ordinary characters plus <strong>format specifiers</strong> (starting with <code>%</code>) that get replaced by the argument values.</p>
<div class="tw"><table><thead><tr><th>Specifier</th><th>Meaning</th><th>Specifier</th><th>Meaning</th></tr></thead><tbody><tr><td>%c</td><td>character</td><td>%u</td><td>unsigned integer</td></tr><tr><td>%d or %i</td><td>signed integer</td><td>%ld / %li</td><td>long / unsigned long</td></tr><tr><td>%e or %E</td><td>scientific notation</td><td>%lf</td><td>double</td></tr><tr><td>%f</td><td>float</td><td>%Lf</td><td>long double</td></tr><tr><td>%s</td><td>string</td><td>%%</td><td>a literal % sign</td></tr></tbody></table></div>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Printing a float:</strong></p><pre class="code"><code>float pi = 3.14;
printf("The value of Pi is %f", pi);   // %f is replaced by pi's value</code></pre></div>
<h3 id="s3-5"><span class="secnum">3.5</span> Type Conversions</h3>
<h4>Implicit conversion (automatic)</h4>
<p>When you mix types in an expression, C automatically promotes <strong>narrower</strong> types to <strong>wider</strong> ones. The promotion chains:</p>
<ul><li><code>int → float/double</code></li><li><code>int → unsigned int → long int → unsigned long int</code></li><li><code>float → double → long double</code></li></ul>
<p>The <strong>reverse</strong> (wider → narrower) is <em>not</em> automatic. Also, <strong>chars are an integer type</strong> and can be implicitly converted — <code>'a'</code> has the numeric value 97, so <code>num + letter</code> adds 97 to <code>num</code>.</p>
<h4>Explicit conversion (casting)</h4>
<p>To force a conversion, <strong>cast</strong> with <code>(type)(expression)</code>. Moving from wider to narrower <strong>loses information</strong>:</p>
<ul><li><code>float → int</code> truncates the fractional part (does not round).</li><li><code>double → float</code> rounds digits.</li><li><code>long int → int</code> drops higher-order bits.</li></ul>
<pre class="code"><code>int a = 1, b = 0;
double c = 2.55;
b = (int)(a + c);   // a promoted to double -&gt; 3.55, then cast to int -&gt; 3</code></pre>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>“float → int rounds to nearest.”</strong> No — it <strong>truncates</strong>. <code>(int)3.99</code> is <code>3</code>, not 4. (Only <code>double→float</code> rounds.)</p></div>
<h3 id="s3-6"><span class="secnum">3.6</span> Pointers — The Heart of C</h3>
<p>Pointers are the single most important — and most tested — topic in this chapter. Background first: <strong>main memory is divided into bytes, each with a unique numeric address.</strong> Every variable occupies one or more bytes, and the address of its <em>first</em> byte is “the address of the variable.” Typical sizes: <code>char</code> 1 byte, <code>int</code> 4 bytes, <code>double</code> 8 bytes, and a <strong>pointer is 8 bytes</strong>.</p>
<div class="box def"><span class="lbl">Definition: Pointer</span><dl><dt>Plain English</dt><dd>A variable that stores the memory address of another variable — it “points to” where something lives.</dd><dt>Technical</dt><dd>A variable whose value is the address (location in memory) of another variable; declared with an asterisk and associated with a reference type. Its underlying value is an unsigned long int (8 bytes).</dd><dt>Why it matters</dt><dd>Pointers enable everything OS programming needs: passing data by reference, dynamic memory, linked data structures, and sharing memory between processes.</dd></dl></div>
<p>Example: if <code>int i = 1;</code> lives at address 2000, a pointer <code>p</code> can store the value <em>2000</em> — we say “p points to i.” Every pointer has a <strong>reference type</strong> (the type it points to), declared by preceding the name with <code>*</code>:</p>
<pre class="code"><code>int    *p;      // p points to an int
char   *str;    // str points to a char
double *q;      // q points to a double
int i, a[10], *p, *q;   // p and q point to int</code></pre>
<p>A pointer can even point to another pointer. (On some old CPUs, pointers were <em>offsets</em> combined with a segment register rather than full addresses — Intel x86 “real mode” — but you can treat pointers as addresses.)</p>
<h4>The two pointer operators: &amp; and *</h4>
<div class="tw"><table><thead><tr><th>Operator</th><th>Name</th><th>Does</th></tr></thead><tbody><tr><td>&amp;</td><td>Address-of</td><td>Returns the address of a variable (a pointer of that variable's type).</td></tr><tr><td>*</td><td>Indirection / dereference</td><td>Returns the VALUE stored at the address the pointer holds.</td></tr></tbody></table></div>
<p>You have already used <code>&amp;</code> with <code>scanf</code>: <code>scanf("%d", &amp;num1);</code> passes the <em>address</em> of <code>num1</code> so scanf knows where to store the value it reads. The <code>*</code> operator turns a pointer back into the value it points to; the reference type determines how many bytes are read.</p>
<pre class="code"><code>int i = 2, j, *p;   // p points nowhere yet
p = &amp;i;             // p now holds the address of i
j = *p;             // *p reads the value at that address -&gt; same as j = i;
int k = 2, *q = &amp;k; // you can initialize a pointer at declaration</code></pre>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>q = p vs *q = *p — do not confuse these.</strong> <code>q = p</code> is a <strong>pointer assignment</strong> (q now points where p points). <code>*q = *p</code> copies the <strong>value</strong> p points to into the location q points to. Totally different effects.</p></div>
<h4>Pointer dangers (every one is an exam favorite)</h4>
<ul><li><strong>Using an uninitialized pointer with *</strong>: <code>int *p; printf("%u", *p);</code> may print garbage, crash, or worse — <code>p</code> points nowhere meaningful.</li><li><strong>Writing through an uninitialized pointer</strong>: <code>int *p; *p = 1;</code> writes to a random address. If it belongs to another program or the OS, you get a <strong>Segmentation Fault</strong> (crash); if it happens to belong to your program, the result is undefined.</li><li><strong>The context-specific *</strong>: in a <em>declaration</em> <code>int *p = &amp;i;</code> the <code>*</code> just means “p is a pointer.” In a <em>statement</em> <code>*p = &amp;i;</code> the <code>*</code> performs indirection — here it wrongly tries to store an address into the int that p points to.</li></ul>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>“All uninitialized pointers are automatically NULL.”</strong> Some compilers zero them, <strong>but not all</strong>. Never rely on it. Always initialize pointers, and after freeing memory set the pointer to <code>NULL</code>.</p></div>
<h4>Why pointers matter: pass-by-reference</h4>
<p>C passes arguments <strong>by value</strong> — a function gets a <em>copy</em> of each argument, in a fresh memory location. So a function cannot change the caller's variable… unless you pass a <strong>pointer</strong>. A copy of a pointer is still the same address, so the function can reach back and modify the original.</p>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>decompose() splits a number into integer and fractional parts by writing through pointers:</strong></p><pre class="code"><code>void decompose(double x, long *int_part, double *frac_part) {
    *int_part  = (long) x;        // write the integer part back to caller
    *frac_part = x - *int_part;   // write the fractional part back
}
// caller:
int whole; double frac;
decompose(3.14159, &amp;whole, &amp;frac);  // pass ADDRESSES so changes stick
// after the call: whole == 3, frac == 0.14159</code></pre><p>Forgetting the <code>&amp;</code> — calling <code>decompose(3.14159, whole, frac)</code> — passes values, not addresses, and leads to wrong results or a crash. A function <em>prototype</em> lets the compiler catch the type mismatch (but it cannot catch a missing <code>&amp;</code> for <code>scanf</code>, whose arguments are untyped).</p></div>
<h3 id="s3-7"><span class="secnum">3.7</span> Structures — C's Answer to Classes</h3>
<p>C has no classes, but it has <strong>structures</strong> (structs). Arrays force two restrictions: every element must be the <em>same type</em>, and you select elements by <em>position</em>. Structures lift both: their <strong>members can have different types</strong>, and you select a member by <strong>name</strong>.</p>
<div class="box def"><span class="lbl">Definition: Structure (struct)</span><dl><dt>Plain English</dt><dd>A bundle of related variables of possibly different types, grouped under one name.</dd><dt>Technical</dt><dd>A logical collection of related data items (members) stored together in memory in the order declared; called a record in other languages, with members called fields.</dd><dt>Why it matters</dt><dd>Structs let you model real-world entities (a warehouse part, an employee, a linked-list node) as a single value — the foundation for nearly every data structure in C and the OS.</dd></dl></div>
<p>Use a struct when several data items only make sense together. Example: a warehouse part needs a number (int), a name (char array), and a quantity on hand (int) — none means much alone.</p>
<pre class="code"><code>struct {
    int  number;
    char name[NAME_LEN+1];
    int  on_hand;
} part1 = {528, "Disk drive", 10},
  part2 = {914, "Printer cable", 5};</code></pre>
<p>Members are stored in memory <strong>in declaration order</strong>. Initialization uses braces, and the values must appear <strong>in the same order as the members</strong>, and must be <strong>constant</strong> expressions. Each struct is its own <strong>scope / namespace</strong> — a member named <code>number</code> in <code>part</code> never clashes with <code>number</code> in <code>employee</code> or with ordinary variables.</p>
<h4>Operating on structures</h4>
<p>Access a member with the <strong>dot operator</strong>: <code>struct_name.member</code>. Members can be read, assigned, incremented, etc.:</p>
<pre class="code"><code>printf("Part number: %d\n", part1.number);
part1.number = 258;     // assign
part1.on_hand++;        // increment
scanf("%d", &amp;part1.on_hand);   // &amp; and . together</code></pre>
<p>Operator precedence detail the slides stress: the <strong>dot operator outranks &amp;</strong>, so <code>&amp;part1.on_hand</code> computes the address of <em>on_hand</em> (what we want), not of <code>part1</code>.</p>
<h4>What you can and cannot do to whole structs</h4>
<ul><li><strong>Assignment works</strong>: <code>part2 = part1;</code> copies every member. This works because a struct is a known, fixed-size type (member arrays are always the same size), unlike a bare array.</li><li><strong>A clever loophole</strong>: wrap an array in a struct and you <em>can</em> copy it with <code>=</code> — but only between structs of the same length/type.</li><li><strong>Comparison does NOT work</strong>: you cannot use <code>==</code> or <code>!=</code> on whole structs. You must compare member by member.</li></ul>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Two classic struct traps.</strong> (1) You <em>can</em> assign structs with <code>=</code> but <em>cannot</em> compare them with <code>==</code>. (2) Forgetting the <strong>semicolon after a struct's closing brace</strong> produces a cryptic error reported far away (often at the next function's <code>return</code>), nowhere near the real mistake.</p></div>
<h4>Struct tags vs. typedef</h4>
<p>Two anonymous structs with identical members are <strong>not</strong> compatible types — you cannot assign one to the other or pass them interchangeably. The fix is to name the structure. A <strong>structure tag</strong> names a kind of struct:</p>
<pre class="code"><code>struct part {                 // 'part' is a struct TAG
    int  number;
    char name[NAME_LEN+1];
    int  on_hand;
};                            // &lt;-- semicolon REQUIRED
struct part part1, part2;     // must keep the keyword 'struct'</code></pre>
<p>With a tag you must always write <code>struct part</code>. A <strong>typedef</strong> lets you drop the keyword and use the name like a built-in type:</p>
<pre class="code"><code>typedef struct {
    int  number;
    char name[NAME_LEN+1];
    int  on_hand;
} Part;
Part part1, part2;            // no 'struct' keyword needed</code></pre>
<p>Functions can take structs as arguments and return them. But passing or returning a struct <strong>copies the entire struct</strong> — expensive for large structs (especially with big arrays). To avoid that overhead — and to let a function <em>modify</em> the caller's struct — pass a <strong>pointer to the struct</strong> instead.</p>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>“when a struct contains a pointer to itself, typedef is fine.”</strong> The lecture notes that to declare a self-referential node (a pointer to the same struct type), you generally use the <strong>struct tag</strong> form, because the typedef name is not yet defined at the point the member is declared. This is why linked-list nodes use <code>struct node *next;</code>.</p></div>
<h3 id="s3-8"><span class="secnum">3.8</span> Dynamic Memory Allocation</h3>
<p>C's data structures are normally <strong>fixed in size</strong>: an array's length is set at compile time, forcing you to guess the maximum and waste space — and it can still fill up. <strong>Dynamic storage allocation</strong> lets you request memory <em>during</em> execution, so data structures can grow and shrink as needed (lists, trees, etc.).</p>
<div class="box def"><span class="lbl">Definition: The Heap</span><dl><dt>Plain English</dt><dd>A big pool of memory your program can borrow from at runtime, in whatever sizes it needs.</dd><dt>Technical</dt><dd>The storage pool from which malloc and related functions obtain memory blocks during program execution.</dd><dt>Why it matters</dt><dd>The heap is where all dynamically allocated memory lives. Mismanaging it causes the two great C bugs: memory leaks and dangling pointers.</dd></dl></div>
<p>Three allocation functions live in <code>&lt;stdlib.h&gt;</code>:</p>
<div class="tw"><table><thead><tr><th>Function</th><th>Prototype</th><th>Behavior</th></tr></thead><tbody><tr><td>malloc</td><td>void *malloc(size_t bytes)</td><td>Allocates a block; does NOT initialize it. Most used (fastest).</td></tr><tr><td>calloc</td><td>void *calloc(size_t n, size_t bytes)</td><td>Allocates AND zero-clears the block. Slower for large blocks.</td></tr><tr><td>realloc</td><td>void *realloc(void *ptr, size_t bytes)</td><td>Resizes a previous block; may copy/move data (can be slow).</td></tr></tbody></table></div>
<p>All three return a <strong>void * (“generic” pointer)</strong> — an address with no reference type that you cast to whatever you need (<code>int *</code>, <code>char *</code>, <code>struct part *</code>). If no large-enough block is available, they return <strong>NULL</strong> (“a pointer to nothing”, like Java's <code>null</code> or Python's <code>None</code>). <strong>Always check the return value against NULL before using it.</strong></p>
<p>Here <code>size_t</code> is an unsigned integer type (a typedef alias for <code>unsigned int</code>) meant to represent discrete counts of things, like a number of bytes.</p>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Allocating an array of 10 ints with malloc:</strong></p><pre class="code"><code>#define ARR_SIZE 10
int *num_arr;
num_arr = (int *) malloc(sizeof(int) * ARR_SIZE);  // size * count
if (num_arr == NULL) exit(1);     // always check!
num_arr[0] = 15;   num_arr[5] = 1;</code></pre><p>The <code>calloc</code> version takes (count, size) and zeroes the block: <code>calloc(ARR_SIZE, sizeof(int))</code>.</p></div>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>String concatenation that allocates exactly the space needed:</strong></p><pre class="code"><code>char *concat(const char *s1, const char *s2) {
    char *result = malloc(strlen(s1) + strlen(s2) + 1);  // +1 for '\0'
    if (result == NULL) { printf("malloc failed\n"); exit(EXIT_FAILURE); }
    strcpy(result, s1);
    strcat(result, s2);
    return result;
}</code></pre><p>The <strong>+1</strong> is the null terminator — forgetting it is a classic buffer-overrun bug.</p></div>
<h3 id="s3-9"><span class="secnum">3.9</span> Freeing Memory: Leaks and Dangling Pointers</h3>
<p>C has <strong>no garbage collector</strong> — you must hand memory back yourself with <code>free()</code>:</p>
<pre class="code"><code>void free(void *ptr);   // returns ptr's block to the heap</code></pre>
<p>Only call <code>free</code> on an address that came from <code>malloc</code>/<code>calloc</code>/<code>realloc</code>. Two failure modes dominate:</p>
<div class="box def"><span class="lbl">Definition: Memory Leak</span><dl><dt>Plain English</dt><dd>Memory you allocated but lost the only pointer to, so you can never free it — wasted forever (until the program ends).</dd><dt>Technical</dt><dd>A block of memory that is no longer accessible (garbage) because every pointer to it was overwritten or lost; a program that leaves garbage behind has a memory leak.</dd><dt>Why it matters</dt><dd>Leaks slowly exhaust the heap. In long-running programs (servers) and embedded systems, leaks eventually crash the program.</dd></dl></div>
<pre class="code"><code>p = malloc(...);
q = malloc(...);
p = q;     // the block p used to point to is now UNREACHABLE -&gt; leak</code></pre>
<div class="box def"><span class="lbl">Definition: Dangling Pointer</span><dl><dt>Plain English</dt><dd>A pointer that still holds the address of memory you already freed — pointing at something that is gone.</dd><dt>Technical</dt><dd>A pointer whose target block has been deallocated by free(); free() releases the block but does NOT change the pointer's value, so it still contains the old address.</dd><dt>Why it matters</dt><dd>Using a dangling pointer reads or writes reclaimed memory, causing unpredictable corruption. The fix is to set the pointer to NULL immediately after freeing.</dd></dl><pre class="code"><code>char *ptr = malloc(4);
free(ptr);              // memory released, but ptr STILL holds the old address
strcpy(ptr, "abc");     // *** dangling-pointer use: risky! ***
// correct habit:
free(ptr);
ptr = NULL;             // now ptr is safe to test and won't dangle</code></pre></div>
<p>For <strong>nested</strong> dynamic memory (a struct holding pointers that were themselves malloc'd), <strong>free the inner pointers first, then the struct</strong> — otherwise you lose the only references to the inner blocks and leak them:</p>
<pre class="code"><code>free(myname-&gt;first_name);   // free inner pointers FIRST
free(myname);               // then the struct itself</code></pre>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Leak vs. dangling — know the difference cold.</strong> A <strong>memory leak</strong> = you still have memory but lost the pointer (can't free it). A <strong>dangling pointer</strong> = you freed the memory but still have the pointer (point at nothing valid). Two opposite mistakes.</p></div>
<h3 id="s3-10"><span class="secnum">3.10</span> Linked Lists</h3>
<p>A <strong>linked list</strong> is a chain of structs called <strong>nodes</strong>; each node holds data plus a pointer to the next node. The last node's next pointer is <strong>NULL</strong> (drawn as a diagonal line). Because nodes are self-referential, you must use the <strong>struct tag</strong> form:</p>
<pre class="code"><code>struct node {
    int value;            // the data
    struct node *next;    // pointer to the next node (self-reference)
};
struct node *head = NULL; // tracks the start of the list</code></pre>
<p>Creating a node = allocate memory, store data, then insert. The <strong>-&gt; (arrow) operator</strong> accesses a member through a pointer — it is shorthand for dereference-then-dot:</p>
<pre class="code"><code>struct node *new_node = malloc(sizeof(struct node));
(*new_node).value = 10;   // verbose way
new_node-&gt;value = 10;     // identical, using the -&gt; operator</code></pre>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Inserting at the front of a list (returns the new head):</strong></p><pre class="code"><code>struct node *add_to_list(struct node *list, int n) {
    struct node *new_node = malloc(sizeof(struct node));
    if (new_node == NULL) exit(EXIT_FAILURE);
    new_node-&gt;value = n;
    new_node-&gt;next  = list;   // new node points at the old head
    return new_node;          // new node becomes the new head
}</code></pre></div>
<h3 id="s3-11"><span class="secnum">3.11</span> Creating and Replacing Processes: fork(), exec(), wait()</h3>
<p>This section is the bridge into Chapter 4 — the C system calls that create processes. In UNIX, a new process is born from <strong>fork()</strong>.</p>
<div class="box def"><span class="lbl">Definition: fork()</span><dl><dt>Plain English</dt><dd>A system call that makes a near-perfect copy of the running process, so now there are two: a parent and a child.</dd><dt>Technical</dt><dd>A system call (prototype pid_t fork(void)) that creates a new process by copying the parent's process image (except shared memory); it is called ONCE but returns TWICE.</dd><dt>Why it matters</dt><dd>fork() is how every UNIX process except the first comes into existence. The “returns twice” behavior is the single most-tested fact about it.</dd></dl></div>
<p>When fork() is called, the OS: allocates a slot in the process table; assigns a unique process ID; copies the parent's process image (except shared memory); puts the child in the Ready-to-Run state; and returns the child's PID to the parent and 0 to the child.</p>
<p><strong>The key to telling parent from child is the return value:</strong></p>
<ul><li>In the <strong>child</strong>: <code>fork()</code> returns <strong>0</strong>.</li><li>In the <strong>parent</strong>: <code>fork()</code> returns the <strong>child's PID</strong> (a positive number).</li><li>On <strong>failure</strong>: <code>fork()</code> returns <strong>-1</strong> and no child is created.</li></ul>
<p>The child is an <em>exact but separate</em> copy — an independent process image, not a shared one.</p>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>Distinguishing parent and child after fork():</strong></p><pre class="code"><code>#include &lt;unistd.h&gt;
int main() {
    pid_t pid = fork();
    if (pid == 0)
        printf("I am the child process\n");
    else if (pid &gt; 0)
        printf("I am the parent process\n");
    else
        printf("the fork() has failed\n");
}</code></pre><p>Both processes run the same code <em>after</em> the fork; they differ only in <code>pid</code>, so the <code>if</code> sends each down its own branch. The code <em>before</em> the fork runs once; the code after runs in both.</p></div>
<p>To run a <em>different</em> program, a process uses the <strong>exec()</strong> family to replace its current code, data, and stack with a new executable. Crucially, <strong>only the code being executed changes — the PID and PPID stay the same.</strong> The <code>exec()</code> functions (<code>execl</code>, <code>execv</code>, <code>execlp</code>, etc.) are C library wrappers around the single real system call <code>execve()</code>, which is rarely called directly.</p>
<pre class="code"><code>int execl(const char *path, const char *arg0, ..., const char *argn, NULL);
// path = absolute path to executable; arg0 = program name; args end with NULL
// returns -1 if the executable is not found</code></pre>
<p>The standard pattern combines all three calls — <strong>fork to create, exec in the child to run a new program, wait in the parent to synchronize:</strong></p>
<pre class="code"><code>int main() {
    pid_t pid = fork();
    if (pid &lt; 0) {                    // error
        fprintf(stderr, "Fork Failed");
        exit(-1);
    } else if (pid == 0) {            // child: become 'ls'
        execlp("/bin/ls", "ls", NULL);
    } else {                          // parent: wait for child
        wait(NULL);
        printf("Child Complete");
        exit(0);
    }
}</code></pre>
<p>Two coordination calls round this out:</p>
<ul><li><code>void exit(int status)</code> terminates a process; <code>status</code> is its return value, announcing success or failure.</li><li><code>pid_t wait(int *status)</code> suspends the parent until a child terminates, returning that child's PID (or -1 if no children exist) and writing the child's status into <code>status</code>.</li></ul>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>The “fork() prints” question.</strong> Given <code>printf("One\n"); fork(); printf("Two\n");</code> — “One” prints <strong>once</strong> (before the fork) and “Two” prints <strong>twice</strong> (parent and child each run the code after the fork). Be ready to count outputs across multiple forks, where <em>n</em> forks create <em>2^n</em> processes.</p></div>
<div class="box proc"><span class="lbl">Chapter 3 in one breath</span><p>C gives you <strong>manual control</strong>: typed variables (mind <code>sizeof</code> and uninitialized junk), <strong>pointers</strong> (<code>&amp;</code> address-of, <code>*</code> dereference) for pass-by-reference, <strong>structs</strong> (assign yes, compare no), <strong>malloc/free</strong> on the heap (watch leaks &amp; dangling pointers), and the <strong>fork/exec/wait</strong> trio that creates and runs processes.</p></div>
</section>
<section class="lecture prose" id="ch4">
<div class="plate"><span class="num" aria-hidden="true">04</span><p class="ttl">Processes</p><p class="src">Chapter 4</p></div>
<h3 id="s4-1"><span class="secnum">4.1</span> Big Picture</h3>
<p>The process is the OS's fundamental unit of work, and this chapter is the spine of the course. You will learn what a process is made of, the <strong>states</strong> it moves through, the <strong>PCB</strong> the OS uses to track it, how the scheduler shuffles processes through <strong>queues</strong>, what a <strong>context switch</strong> costs, how processes are <strong>created and terminated</strong>, and finally how cooperating processes talk to each other via <strong>IPC</strong> (shared memory, message passing, and pipes).</p>
<h3 id="s4-2"><span class="secnum">4.2</span> The Process Concept and Its Memory Layout</h3>
<div class="box def"><span class="lbl">Definition: Process</span><dl><dt>Plain English</dt><dd>A program that is actually running, together with everything it needs to run.</dd><dt>Technical</dt><dd>A program in execution; execution must progress sequentially (no parallel execution of instructions within a single process).</dd><dt>Why it matters</dt><dd>It is the active counterpart of a passive program file, and the entity the OS schedules, protects, and accounts for.</dd></dl></div>
<p><strong>Program vs. process, again, because the exam loves it:</strong> a program is a <strong>passive</strong> file on disk; a process is <strong>active</strong>. You can start a program via GUI clicks, a command-line name, or the <code>exec()</code> system call. And <strong>one program can become many processes</strong> — e.g., several users running the same shell each get a separate process.</p>
<p>A process in memory has four sections (plus current activity). Know all of them and what each holds:</p>
<div class="tw"><table><thead><tr><th>Section</th><th>Contains</th></tr></thead><tbody><tr><td>Text</td><td>The program code (the compiled instructions).</td></tr><tr><td>Data</td><td>Global variables (split into initialized and uninitialized).</td></tr><tr><td>Heap</td><td>Memory dynamically allocated at runtime (malloc).</td></tr><tr><td>Stack</td><td>Temporary data: function parameters, return addresses, local variables.</td></tr><tr><td>(Current activity)</td><td>Program counter + processor registers.</td></tr></tbody></table></div>
<p>The heap and stack grow toward each other into the free space between them. The global data section divides into <strong>initialized</strong> and <strong>uninitialized</strong> data, and a separate area holds the <code>argc</code>/<code>argv</code> command-line parameters.</p>
<p>You can inspect a compiled program's section sizes with the Linux <code>size</code> utility (<code>size executable_name</code>). It reports <code>text</code> (code), <code>data</code>, <code>bss</code> (Block Started by Symbol — uninitialized data), and the <code>dec</code>/<code>hex</code> totals.</p>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>Slide wording quirk to watch.</strong> The lecture's <code>size</code> slide labels <code>data</code> as “uninitialized” and <code>bss</code> as “initialized,” but standard convention is the reverse: <code>data</code> = initialized globals, <code>bss</code> = uninitialized globals. Learn the standard meaning (<strong>bss = uninitialized</strong>) and be aware the slide swapped the labels.</p></div>
<h3 id="s4-3"><span class="secnum">4.3</span> Process States</h3>
<p>As a process runs it changes state. Memorize the five-state model — it is guaranteed exam material and underpins Chapter 6.</p>
<div class="tw"><table><thead><tr><th>State</th><th>Meaning</th></tr></thead><tbody><tr><td>New</td><td>The process is being created.</td></tr><tr><td>Ready</td><td>Waiting to be assigned to a processor (in memory, runnable).</td></tr><tr><td>Running</td><td>Instructions are currently being executed on a CPU.</td></tr><tr><td>Waiting</td><td>Blocked, waiting for some event (e.g., I/O completion).</td></tr><tr><td>Terminated</td><td>The process has finished execution.</td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Ready vs. Waiting — the distinction students miss.</strong> A <strong>Ready</strong> process <em>could</em> run right now but is waiting only for a free CPU. A <strong>Waiting</strong> (blocked) process <em>cannot</em> run yet because it is waiting for an event like I/O. After the event completes, a Waiting process moves back to Ready, not straight to Running.</p></div>
<h3 id="s4-4"><span class="secnum">4.4</span> The Process Control Block (PCB)</h3>
<div class="box def"><span class="lbl">Definition: Process Control Block (PCB)</span><dl><dt>Plain English</dt><dd>The OS's record card for a process — everything it needs to know to manage and resume that process.</dd><dt>Technical</dt><dd>The kernel data structure holding all information associated with a process; in Linux it is the C structure task_struct (also called a Task Control Block).</dd><dt>Why it matters</dt><dd>The PCB is what the OS saves and restores on a context switch. Without it, the OS could not pause a process and pick it back up later.</dd></dl></div>
<p>A PCB stores, at minimum:</p>
<ul><li><strong>Process state</strong> — running, waiting, ready, etc.</li><li><strong>Program counter</strong> — the address of the next instruction.</li><li><strong>CPU registers</strong> — the contents of all process registers.</li><li><strong>Memory-management information</strong> — the memory allocated to the process.</li><li><strong>Accounting information</strong> — CPU time used, clock time since start, time limits.</li><li><strong>I/O status information</strong> — I/O devices allocated, list of open files.</li></ul>
<p>So far each process had a single <strong>thread</strong> (one program counter). A <strong>multithreaded</strong> process has multiple program counters — one per thread — so multiple locations can execute at once (e.g., a word processor handling input, spell-checking, and saving simultaneously). The PCB must then store details for each thread. The number of processes currently in memory is the <strong>degree of multiprogramming</strong>.</p>
<h3 id="s4-5"><span class="secnum">4.5</span> Process Scheduling and Queues</h3>
<p>The <strong>process scheduler</strong> selects which available process runs next on each CPU core, with the goal of <strong>maximizing CPU utilization</strong> by switching quickly when a process blocks or terminates. It keeps processes organized in queues:</p>
<ul><li><strong>Ready queue</strong> — all processes in main memory that are ready and waiting to execute. Generally stored as a <strong>linked list</strong>, with a header pointing to the first PCB.</li><li><strong>Wait queues</strong> — processes waiting for a particular event, such as I/O completion.</li></ul>
<p>Processes <strong>migrate among the queues</strong> over their lifetime: a running process that issues I/O moves to a wait queue; when the I/O completes it returns to the ready queue. When a process finally terminates, it is removed from all queues and its PCB is deallocated.</p>
<h3 id="s4-6"><span class="secnum">4.6</span> Context Switch</h3>
<div class="box def"><span class="lbl">Definition: Context Switch</span><dl><dt>Plain English</dt><dd>The act of saving one process's state and loading another's so the CPU can switch between them.</dd><dt>Technical</dt><dd>The procedure where the system saves the state of the old process (in its PCB) and loads the saved state of the new process when the CPU switches processes.</dd><dt>Why it matters</dt><dd>Context switching is what makes multitasking possible — but it is pure overhead, so its cost directly limits how much real work the CPU gets done.</dd></dl></div>
<p>The crucial exam point: <strong>context-switch time is pure overhead — no useful work happens during it.</strong> The more complex the OS and the PCB, the longer a switch takes. It also depends on hardware support: some CPUs provide <strong>multiple register sets</strong>, so several contexts can be loaded at once and a switch becomes as cheap as changing a pointer to the active register set.</p>
<div class="box warn"><span class="lbl">Misconception</span><p><strong>“Context switching gets work done faster.”</strong> A context switch itself accomplishes <strong>zero</strong> useful computation — it is overhead. The <em>benefit</em> is keeping the CPU busy across many processes; the switch itself is a cost you want to minimize.</p></div>
<h3 id="s4-7"><span class="secnum">4.7</span> Operations on Processes: Creation and Termination</h3>
<p>Processes form a <strong>tree</strong> (“process genealogy”): a <strong>parent</strong> creates <strong>children</strong>, which create their own children. Each process has a <strong>process identifier (PID)</strong>. On creation, the OS decides resource sharing and execution policy:</p>
<ul><li><strong>Resource sharing</strong>: parent and child share all resources; OR child shares a subset; OR they share nothing.</li><li><strong>Execution</strong>: parent and children execute concurrently; OR the parent waits until the child terminates.</li><li><strong>Address space</strong>: the child is a duplicate of the parent, OR the child has a new program loaded into it.</li></ul>
<p>In UNIX, <code>fork()</code> creates the new process, <code>exec()</code> (after the fork) replaces the child's memory with a new program, and the parent calls <code>wait()</code> to wait for the child. On Linux, <code>pstree -p</code> shows the tree: <code>systemd</code> is the root parent, <code>logind</code> manages logins, and from a <code>bash</code> shell a user spawns processes like <code>ps</code> and <code>vim</code>.</p>
<h4>Termination</h4>
<p>A process finishes by executing its last instruction and calling <code>exit()</code>, which returns status data to the parent (via <code>wait()</code>) and lets the OS deallocate its resources. A parent can forcibly terminate a child with <code>abort()</code> if: the child exceeded its allocated resources; the child's task is no longer needed; or the parent is exiting and the OS does not allow a child to outlive its parent.</p>
<h4>Mobile process-importance hierarchy</h4>
<p>Mobile OSes (Android) reclaim memory by killing processes, starting with the least important. Know the ranking, most to least important:</p>
<ol><li><strong>Foreground</strong> — the process currently visible and interacting on screen.</li><li><strong>Visible</strong> — visible but not directly interacting (e.g., a video in picture-in-picture).</li><li><strong>Service</strong> — background work with apparent output (downloading, streaming music).</li><li><strong>Background</strong> — not apparent (a messaging app syncing).</li><li><strong>Empty</strong> — no active components (an unused app kept around for fast restart).</li></ol>
<h3 id="s4-8"><span class="secnum">4.8</span> Multi-Process Architecture: The Chrome Example</h3>
<p>Older browsers ran as a single process; Google Chrome uses <strong>multiple processes</strong> for robustness and security — a great real-world illustration of process isolation:</p>
<ul><li><strong>Browser process</strong> — manages the user interface, disk, and network I/O.</li><li><strong>Renderer process</strong> — renders web pages and runs HTML/JavaScript. A new renderer is created per tab, each in a <strong>sandbox</strong> that restricts disk and network I/O, minimizing the damage from a security exploit.</li><li><strong>Plug-in process</strong> — runs each type of plug-in/extension.</li></ul>
<p>So a crash or compromise in one tab's renderer is contained — it cannot easily take down the whole browser or reach the disk.</p>
<h3 id="s4-9"><span class="secnum">4.9</span> Inter-Process Communication (IPC)</h3>
<p>Processes are either <strong>independent</strong> or <strong>cooperating</strong>. Cooperating processes can affect or be affected by each other (e.g., by sharing data), and they need <strong>IPC</strong>. Reasons to cooperate: information sharing, computation speedup (splitting subtasks across cores), modularity, and convenience.</p>
<p>There are two IPC models. The comparison is a guaranteed exam question:</p>
<div class="tw"><table><thead><tr><th></th><th>Shared Memory</th><th>Message Passing</th></tr></thead><tbody><tr><td>Speed</td><td>Faster.</td><td>Slower.</td></tr><tr><td>Kernel involvement</td><td>Only to set up the shared region; then routine memory access, no kernel.</td><td>Each message needs kernel intervention (time-consuming).</td></tr><tr><td>Data size</td><td>Good for large amounts of data.</td><td>Useful for smaller amounts of data.</td></tr><tr><td>Coordination</td><td>Programmer must synchronize access (risk of race conditions).</td><td>No conflict avoidance needed by the programmer.</td></tr><tr><td>Distributed systems</td><td>Harder.</td><td>Easier to implement across machines.</td></tr></tbody></table></div>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Why is shared memory faster?</strong> Because after the region is established, all accesses are <strong>ordinary memory reads/writes with no system calls and no kernel intervention</strong>. Message passing must trap into the kernel for every send/receive.</p></div>
<h3 id="s4-10"><span class="secnum">4.10</span> The Producer–Consumer Problem and Race Conditions</h3>
<div class="box def"><span class="lbl">Definition: Producer–Consumer Problem</span><dl><dt>Plain English</dt><dd>A classic setup where one process makes data and another uses it, sharing a buffer between them.</dd><dt>Technical</dt><dd>A paradigm for cooperating processes in which a producer process produces information consumed by a consumer process; a process can be both at once.</dd><dt>Why it matters</dt><dd>It is the canonical example for studying synchronization, buffering, and race conditions — and it directly motivates the synchronization tools in later chapters.</dd></dl></div>
<p>Two buffer variations:</p>
<ul><li><strong>Unbounded buffer</strong> — no size limit; the producer never waits, but the consumer must wait if there is nothing to consume.</li><li><strong>Bounded buffer</strong> — fixed maximum size; the producer must wait if the buffer is full, and the consumer must wait if it is empty.</li></ul>
<p>A clean bounded-buffer solution uses a <strong>circular array</strong> with two indices: <code>in</code> (next free slot) and <code>out</code> (first filled slot). The buffer is <strong>full</strong> when <code>(in + 1) % BUFFER_SIZE == out</code> and <strong>empty</strong> when <code>in == out</code>. This version is correct but can only use <strong>BUFFER_SIZE - 1</strong> elements (one slot is sacrificed to distinguish full from empty).</p>
<pre class="code"><code>/* Producer */                      /* Consumer */
while (1) {                         while (1) {
  /* produce next_produced */         while (in == out)   ; // empty? busy-wait
  while ((in+1)%SIZE == out) ;        next_consumed = buffer[out];
  buffer[in] = next_produced;         out = (out + 1) % SIZE;
  in = (in + 1) % SIZE;               /* consume next_consumed */
}                                   }</code></pre>
<p>To use <em>all</em> of the buffer, add a <code>counter</code> of filled slots: the producer waits while <code>counter == BUFFER_SIZE</code> and increments after producing; the consumer waits while <code>counter == 0</code> and decrements after consuming. But this shared <code>counter</code> introduces a <strong>race condition</strong>.</p>
<div class="box def"><span class="lbl">Definition: Race Condition</span><dl><dt>Plain English</dt><dd>A bug where the final result depends on the unpredictable timing of which process touches shared data first.</dd><dt>Technical</dt><dd>A situation in a shared-memory solution where multiple processes/threads access and manipulate shared data concurrently, and the outcome depends on the order in which operations execute.</dd><dt>Why it matters</dt><dd>Race conditions cause data corruption and unpredictable behavior, and motivate the entire field of process synchronization (locks, semaphores).</dd></dl></div>
<p>Why <code>counter++</code> is dangerous: it is not atomic. It compiles to three steps — <code>register = counter</code>; <code>register = register + 1</code>; <code>counter = register</code>. With <code>counter = 5</code> and the producer's <code>++</code> interleaved with the consumer's <code>--</code>, you can end up with <code>counter = 6</code> or <code>4</code> depending on interleaving — a lost update.</p>
<div class="box ex"><span class="lbl">Worked example</span><p><strong>A losing interleaving (counter starts at 5):</strong></p><pre class="code"><code>S0 producer: reg1 = counter        (reg1 = 5)
S1 producer: reg1 = reg1 + 1       (reg1 = 6)
S2 consumer: reg2 = counter        (reg2 = 5)
S3 consumer: reg2 = reg2 - 1       (reg2 = 4)
S4 producer: counter = reg1        (counter = 6)
S5 consumer: counter = reg2        (counter = 4)  &lt;-- should be 5!</code></pre><p>The correct answer is 5 (one produced, one consumed), but the race yields 4. The <strong>first</strong> version (using only BUFFER_SIZE-1 slots) had no race because producer and consumer never wrote the <em>same</em> variable — the producer only touched <code>in</code>, the consumer only touched <code>out</code>.</p></div>
<div class="box exam"><span class="lbl">Exam watch</span><p><strong>Why was there no race in the first solution?</strong> Because the two processes never modified a <strong>shared</strong> variable. With the <code>counter</code>, both write it, so their unsynchronized read-modify-write sequences interleave badly. This is the setup for synchronization tools in the next chapter.</p></div>
<h3 id="s4-11"><span class="secnum">4.11</span> Message Passing in Detail</h3>
<p>In message passing, processes communicate <strong>without shared variables</strong>, through two operations: <code>send(message)</code> and <code>receive(message)</code>. To communicate, processes P and Q must <strong>establish a link</strong> and then exchange messages. Messages may be fixed or variable size.</p>
<h4>Direct vs. indirect communication</h4>
<div class="tw"><table><thead><tr><th></th><th>Direct</th><th>Indirect</th></tr></thead><tbody><tr><td>Naming</td><td>Processes name each other: send(P, msg), receive(Q, msg).</td><td>Messages go to/from mailboxes (ports) with unique IDs: send(A, msg).</td></tr><tr><td>Link established</td><td>Automatically, between exactly one pair.</td><td>Only if processes share a common mailbox.</td></tr><tr><td>Processes per link</td><td>Exactly two.</td><td>A link may be associated with many processes.</td></tr><tr><td>Links per pair</td><td>Exactly one.</td><td>Several (one per shared port).</td></tr></tbody></table></div>
<p>Indirect communication raises a sharing puzzle: if P1, P2, P3 all share mailbox A and P1 sends one message while P2 and P3 both try to receive, <strong>who gets it?</strong> Solutions: limit a link to at most two processes; allow only one receive at a time; or let the system pick the receiver arbitrarily and tell the sender who got it. Mailbox operations: create a mailbox, send/receive through it, and delete it.</p>
<h4>Synchronization: blocking vs. non-blocking</h4>
<ul><li><strong>Blocking (synchronous)</strong>: a blocking <em>send</em> waits until the message is received; a blocking <em>receive</em> waits until a message is available.</li><li><strong>Non-blocking (asynchronous)</strong>: a non-blocking <em>send</em> sends and continues; a non-blocking <em>receive</em> returns either a valid message or null.</li></ul>
<p>Commonly, sending is non-blocking but receiving is blocking. If <strong>both</strong> send and receive block, that meeting point is called a <strong>rendezvous</strong>.</p>
<h4>Buffering</h4>
